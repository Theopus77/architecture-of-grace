<svg viewBox="0 0 1120 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aogTitle aogDesc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,system-ui,sans-serif">
  <title id="aogTitle">How Architecture of Grace works</title>
  <desc id="aogDesc">A pipeline: Student to Check-In to MTSS tiers to Resource Mapping to Growth over time, color-coded by support tier.</desc>

  <!-- background -->
  <rect x="0" y="0" width="1120" height="450" rx="18" fill="#FBF8F1"/>

  <!-- heading -->
  <text x="560" y="46" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="29" font-weight="700" fill="#0A1E33">From One Check-In to Years of Growth</text>
  <text x="560" y="74" text-anchor="middle" font-size="14.5" fill="#46506E">A four-minute reflection becomes multi-year, curriculum-linked support — privately, and owned by the school.</text>

  <!-- ===== connector chevrons (drawn first, behind cards) ===== -->
  <g stroke="#D9A33B" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M224 203 L236 213 L224 223"/>
    <path d="M444 203 L456 213 L444 223"/>
    <path d="M664 203 L676 213 L664 223"/>
    <path d="M884 203 L896 213 L884 223"/>
  </g>

  <!-- ===== STAGE 1 · STUDENT ===== -->
  <g>
    <rect x="30" y="100" width="180" height="232" rx="16" fill="#FFFFFF" stroke="#E4DAC5" stroke-width="1.5"/>
    <circle cx="120" cy="131" r="13" fill="#0A1E33"/><text x="120" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#D9A33B">1</text>
    <circle cx="120" cy="182" r="28" fill="#0A1E33"/>
    <circle cx="120" cy="174" r="6" fill="#F4EEE2"/>
    <path d="M109 194 Q120 179 131 194" stroke="#F4EEE2" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <text x="120" y="248" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#0A1E33">Student</text>
    <text x="120" y="270" text-anchor="middle" font-size="12" fill="#46506E">Any learner, K–adult</text>
    <text x="120" y="290" text-anchor="middle" font-size="11" fill="#8A6D1F" font-weight="700">A code, never a name</text>
  </g>

  <!-- ===== STAGE 2 · CHECK-IN ===== -->
  <g>
    <rect x="250" y="100" width="180" height="232" rx="16" fill="#FFFFFF" stroke="#E4DAC5" stroke-width="1.5"/>
    <circle cx="340" cy="131" r="13" fill="#0A1E33"/><text x="340" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#D9A33B">2</text>
    <circle cx="340" cy="182" r="28" fill="#0A1E33"/>
    <rect x="331" y="167" width="18" height="26" rx="3" fill="none" stroke="#F4EEE2" stroke-width="2.2"/>
    <rect x="336" y="163" width="8" height="6" rx="2" fill="#F4EEE2"/>
    <path d="M335 181 l4 4 l7 -9" stroke="#F4EEE2" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="340" y="248" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#0A1E33">Check-In</text>
    <text x="340" y="270" text-anchor="middle" font-size="12" fill="#46506E">18 items · ~4 minutes</text>
    <text x="340" y="290" text-anchor="middle" font-size="11" fill="#8A6D1F" font-weight="700">3 domains · 3 windows/yr</text>
  </g>

  <!-- ===== STAGE 3 · MTSS TIERS ===== -->
  <g>
    <rect x="470" y="100" width="180" height="232" rx="16" fill="#FFFFFF" stroke="#E4DAC5" stroke-width="1.5"/>
    <circle cx="560" cy="131" r="13" fill="#0A1E33"/><text x="560" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#D9A33B">3</text>
    <g font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">
      <rect x="490" y="156" width="140" height="18" rx="5" fill="#2E6B3A"/><text x="560" y="169">Tier 1 · Doing well</text>
      <rect x="490" y="178" width="140" height="18" rx="5" fill="#8A6D1F"/><text x="560" y="191">Tier 2 · Some support</text>
      <rect x="490" y="200" width="140" height="18" rx="5" fill="#8B2A2A"/><text x="560" y="213">Tier 3 · Intensive</text>
    </g>
    <text x="560" y="248" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#0A1E33">MTSS Tiers</text>
    <text x="560" y="270" text-anchor="middle" font-size="12" fill="#46506E">0–100 sorts the tier</text>
    <text x="560" y="290" text-anchor="middle" font-size="11" fill="#8A6D1F" font-weight="700">Normed · flag, not a label</text>
  </g>

  <!-- ===== STAGE 4 · RESOURCE MAP ===== -->
  <g>
    <rect x="690" y="100" width="180" height="232" rx="16" fill="#FFFFFF" stroke="#E4DAC5" stroke-width="1.5"/>
    <circle cx="780" cy="131" r="13" fill="#0A1E33"/><text x="780" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#D9A33B">4</text>
    <circle cx="780" cy="182" r="28" fill="#0A1E33"/>
    <path d="M780 169 L780 194" stroke="#F4EEE2" stroke-width="2"/>
    <path d="M780 169 C776 166 770 166 767 168 L767 190 C770 188 776 188 780 191" fill="none" stroke="#F4EEE2" stroke-width="2" stroke-linejoin="round"/>
    <path d="M780 169 C784 166 790 166 793 168 L793 190 C790 188 784 188 780 191" fill="none" stroke="#F4EEE2" stroke-width="2" stroke-linejoin="round"/>
    <text x="780" y="248" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#0A1E33">Resource Map</text>
    <text x="780" y="270" text-anchor="middle" font-size="12" fill="#46506E">Mapped to the curriculum</text>
    <text x="780" y="290" text-anchor="middle" font-size="11" fill="#8A6D1F" font-weight="700">Lowest domain → lesson</text>
  </g>

  <!-- ===== STAGE 5 · GROWTH OVER TIME ===== -->
  <g>
    <rect x="910" y="100" width="180" height="232" rx="16" fill="#FFFFFF" stroke="#E4DAC5" stroke-width="1.5"/>
    <circle cx="1000" cy="131" r="13" fill="#0A1E33"/><text x="1000" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#D9A33B">5</text>
    <!-- mini banded trajectory -->
    <g>
      <rect x="955" y="154" width="90" height="20" fill="#E8F0E7"/>
      <rect x="955" y="174" width="90" height="20" fill="#F5EAC8"/>
      <rect x="955" y="194" width="90" height="20" fill="#F3DFDC"/>
      <rect x="955" y="154" width="90" height="60" fill="none" stroke="#E4DAC5" stroke-width="1"/>
      <polyline points="960,208 978,200 996,184 1014,170 1040,159" fill="none" stroke="#0A1E33" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="960" cy="208" r="3" fill="#8B2A2A"/><circle cx="978" cy="200" r="3" fill="#8A6D1F"/><circle cx="996" cy="184" r="3" fill="#8A6D1F"/><circle cx="1014" cy="170" r="3" fill="#2E6B3A"/><circle cx="1040" cy="159" r="3.4" fill="#2E6B3A"/>
    </g>
    <text x="1000" y="248" text-anchor="middle" font-family="Georgia,serif" font-size="17" font-weight="700" fill="#0A1E33">Growth Over Time</text>
    <text x="1000" y="270" text-anchor="middle" font-size="12" fill="#46506E">Multi-year trajectory</text>
    <text x="1000" y="290" text-anchor="middle" font-size="11" fill="#8A6D1F" font-weight="700">Across grades &amp; years</text>
  </g>

  <!-- ===== legend ===== -->
  <g font-size="12" fill="#46506E">
    <rect x="300" y="362" width="13" height="13" rx="3" fill="#2E6B3A"/><text x="319" y="373">Doing well · 75–100</text>
    <rect x="470" y="362" width="13" height="13" rx="3" fill="#8A6D1F"/><text x="489" y="373">Worth a reflection · 50–74</text>
    <rect x="680" y="362" width="13" height="13" rx="3" fill="#8B2A2A"/><text x="699" y="373">Needs support · 0–49</text>
  </g>

  <!-- ===== footer tagline ===== -->
  <text x="560" y="412" text-anchor="middle" font-size="13" font-weight="700" fill="#0A1E33" letter-spacing="0.3">Privacy-first<tspan fill="#D9A33B"> · </tspan>School-owned<tspan fill="#D9A33B"> · </tspan>Curriculum-linked<tspan fill="#D9A33B"> · </tspan>Multi-year</text>
</svg>
