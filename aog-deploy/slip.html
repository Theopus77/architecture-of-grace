<!-- AOG-SLIP-ENGINE-V1 (2026-09-27) — Jimmy: "Make sure all slips are on a shared engine … even the old ones if
     that is possible." ONE page for every slip: a slip is a few lines of config (SLIPS below), and this page gives
     it the same quiet look, the same no-typing-needed answers, the same name buttons and the same send.
     Every slip lands in the teacher's Check-ins tab as checkinType "slip-<id>", its answers in `extra`, so the
     Sheet script needs no change and the dashboard and Inbox read it back like any check-in.
     Links: /slip.html?s=test|repair|goal|home|team|unit  &sid=<name>  &dest=<b64> or &d=<script id>.<key>
            goal adds &goal=<id>&gt=<goal title>;  unit adds &u=<unit name>.
     Calm rules: nothing moves, every field is 16px or larger, no endless motion, plain words. -->
<style>
:root{--navy:#0A1E33;--ink:#15202E;--soft:#4A5563;--cream:#FBF7EE;--card:#fff;--line:#E2D8C3;--gold:#C9A24A;--goldInk:#7A5A12;--good:#2E7D4F;--pick:#0A1E33;--pickInk:#F4EEE2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#EEF2F6;--soft:#C2CCD6;--cream:#12263D;--card:#1A3657;--line:rgba(255,255,255,.16);--goldInk:#F2C964;--pick:#F4EEE2;--pickInk:#0A1E33}}
:root[data-theme="dark"]{--ink:#EEF2F6;--soft:#C2CCD6;--cream:#12263D;--card:#1A3657;--line:rgba(255,255,255,.16);--goldInk:#F2C964;--pick:#F4EEE2;--pickInk:#0A1E33}
*{box-sizing:border-box}
html,body{background:var(--cream)}
body{margin:0;color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px 60px}
.k{font:800 12px/1.2 Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--goldInk);margin:0 0 6px}
h1{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;font-size:clamp(24px,6vw,30px);line-height:1.2;margin:0 0 6px}
.lead{color:var(--soft);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin:0 0 14px;box-shadow:0 12px 30px -26px rgba(10,30,51,.5)}
.q{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:19px;line-height:1.3;margin:0 0 4px}
.hint{color:var(--soft);font-size:14.5px;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opts.chips{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:560px){.opts.chips{grid-template-columns:repeat(3,minmax(0,1fr))}}
.opt{min-height:48px;padding:10px 14px;border:1px solid #B9B2A3;border-radius:10px;background:var(--card);color:var(--ink);font:600 16px/1.25 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px}
.opt .n{flex:0 0 26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;border:1px solid currentColor;opacity:.7}
.opt[aria-pressed="true"]{background:var(--pick);color:var(--pickInk);border-color:var(--pick)}
/* AOG-SLIP-CHECKLIST-V1 — a step list: one wide row each, a box that takes a tick */
.opts.checks{grid-template-columns:1fr}
.opt .box{flex:0 0 26px;height:26px;border:2px solid currentColor;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;line-height:1}
.opt[aria-pressed="true"] .box::after{content:"\2713"}
.cnt{font-weight:700}
.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
textarea,input[type=text]{width:100%;min-height:48px;font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:10px 12px;border:1px solid #1B2A3D;border-radius:10px;background:var(--card);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.more{margin-top:10px}.more summary{display:inline-flex;align-items:center;min-height:44px;cursor:pointer;font-weight:700;color:var(--soft)}
.talk{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:600}.talk input{width:22px;height:22px}
.names{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.names button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #B9B2A3;background:var(--card);color:var(--ink);font:600 15px/1.2 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
.names button[aria-pressed="true"]{background:var(--pick);color:var(--pickInk);border-color:var(--pick)}
.send{width:100%;min-height:54px;border:0;border-radius:12px;background:var(--navy);color:#F4EEE2;font:700 17px/1.2 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
.send:disabled{background:#B9C4D0;color:#15202E;cursor:default}
.st{margin:10px 0 0;font-weight:600}
.st.ok{color:var(--good)} .st.bad{color:#8B2A2A}
.done{text-align:center;padding:26px 16px}
.done h2{font-family:Fraunces,Georgia,serif;font-size:26px;margin:0 0 8px}
.back{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid #1B2A3D;color:var(--ink);text-decoration:none;font-weight:600;margin-top:12px}
.goalbox{border-left:4px solid var(--gold);padding:8px 12px;background:rgba(201,162,74,.10);border-radius:8px;margin:0 0 14px;font-weight:600}
.prt{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin:12px 0 0;padding:0 20px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:700 16px/1.2 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer}
.prt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media print{.send,.st,.names,.prt{display:none}}
/* AOG-SLIP-POINTS-V1 — the point sheet: the goals, one card per part of the day, three calm choices per goal */
.goals{margin:8px 0 0;padding-left:22px}.goals li{margin:0 0 10px}.goals b{display:block}.goals .gh{display:block;color:var(--soft);font-size:15px}
.pil{display:inline-block;margin-top:3px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--goldInk)}
.prow{padding:10px 0;border-top:1px solid var(--line)}.prow:first-of-type{border-top:0}
.pg{display:block;font-weight:700;margin:0 0 6px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg .opt{justify-content:center;text-align:center;min-height:48px;padding:8px 6px;font-size:16px}
/* AOG-SLIP-SKETCH-V1 — the checklist's drawing: an architect's pencil sketch on drafting paper. Drawn lines are graphite;
   the parts still to come are faint blueprint dashes. It sits on its own paper in both themes. Nothing moves. */
.artpad{background:linear-gradient(rgba(47,99,184,.07) 1px,transparent 1px) 0 0/16px 16px,linear-gradient(90deg,rgba(47,99,184,.07) 1px,transparent 1px) 0 0/16px 16px,#F7F2E6;border:1px solid rgba(42,38,34,.35);border-radius:10px;padding:8px}
.artpad svg{display:block;width:100%;height:auto}
.artcap{margin:8px 0 0;font-weight:700;color:var(--ink)}
.done .artpad{margin-top:14px}.done .artcap{color:inherit}
@media print{.artpad{background:#fff}}
/* AOG-SLIP-OVERHAUL-V1 — the list of every slip (/slip), the teachers' row under a slip, and the editor (?edit=1) */
input[type=search],.ed select{width:100%;min-height:48px;font:16px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;padding:10px 12px;border:1px solid #1B2A3D;border-radius:10px;background:var(--card);color:var(--ink)}
.grp h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:20px;line-height:1.25;margin:0 0 4px}
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.grp h2+.srow{border-top:0}
.srow[hidden]{display:none}
.grp[hidden]{display:none}
details.grp{padding:0 16px}
details.grp summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:56px;cursor:pointer;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:19px}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::before{content:"+";flex:0 0 26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--ink);border-radius:50%;font:700 16px/1 Inter,system-ui,sans-serif}
details.grp[open] summary::before{content:"\2212"}
details.grp[open]{padding-bottom:8px}
details.grp summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.gn{flex:1 1 auto}.gc{font:700 14px/1 Inter,system-ui,sans-serif;color:var(--soft)}
details.grp summary+.srow{border-top:1px solid var(--line)}
a.send.lnk{display:flex;align-items:center;justify-content:center;text-decoration:none}
a.send.lnk:focus-visible,.send:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.edbar{position:sticky;bottom:0;z-index:5;display:flex;gap:8px;margin:14px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--cream);border-top:1px solid var(--line)}
.edbar .send{flex:1 1 auto;width:auto}
.edbar .mini{min-height:54px;padding:0 18px}
.savedbox{text-align:center}
.savedbox h2{font-family:Fraunces,Georgia,serif;font-size:22px;margin:0 0 6px}
.savedbox .send{margin-top:10px}
.gone p{margin:0 0 8px;font-weight:600}
/* the site's floating My notes button would sit on Preview; a form being changed has nothing to highlight */
body.slip-editing .aog-mkbtn{display:none}
/* in dark, the main button is gold, as on /ef, so it stands out from the navy paper */
:root[data-theme="dark"] .send:not(:disabled){background:#F2C964;color:#0A1E33}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .send:not(:disabled){background:#F2C964;color:#0A1E33}}
.srow .nm{flex:1 1 auto;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;color:var(--ink);font-weight:700;text-decoration:none}
.srow .nm small{font-weight:400;font-size:14.5px;color:var(--soft)}
.srow .nm:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
@media (hover:hover){.srow .nm:hover{text-decoration:underline}}
.tag{display:inline-block;margin-left:6px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--goldInk)}
.mini{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 16px/1.2 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;cursor:pointer;text-decoration:none}
.mini:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.teach{margin:22px 0 0;padding:14px 0 0;border-top:1px solid var(--line)}
.teach .acts,.ed .acts{display:flex;flex-wrap:wrap;gap:8px}
.said{margin:8px 0 0;font-weight:600;color:var(--good);min-height:1.2em}
.linkbox{margin-top:6px}
.ed label,.ed .lab{display:block;font-weight:700;margin:12px 0 6px}
.ed label:first-of-type{margin-top:0}
.ed .orow{display:flex;gap:8px;margin:0 0 8px}
.ed .orow input{flex:1 1 auto;min-width:0}
.ed .orow .mini{min-width:48px;min-height:48px;padding:0 12px}
.ed .acts{margin-top:12px}
.ed .gbox{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.edfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
@media print{.teach,.mine-note{display:none}}

</style>
</head>

/* ══ THE SLIPS — each is a few lines. kind: scale (five steps, one pick), one (one pick), pick (up to max), note (optional words).
   Nothing is required except the name; a slip can be sent with every question skipped. ══ */
var SCALE_READY=[["Not yet","Todavía no"],["A little","Un poco"],["Getting there","Casi"],["Ready","Listo"],["Very ready","Muy listo"]];
var SLIPS={
  test:{ k:["Before a test","Antes de un examen"], h:["How ready do you feel?","¿Qué tan listo te sientes?"],

    qs:[{id:"ready",kind:"scale",q:["How ready do you feel for this test?","¿Qué tan listo te sientes para este examen?"],o:SCALE_READY},

        {id:"topic",kind:"note",q:["Which part, in your own words? (optional)","¿Qué parte, en tus palabras? (opcional)"]}]},
  endclass:{ k:["End of class","Fin de la clase"], h:["How did this class go?","¿Cómo te fue en esta clase?"],
    lead:["A few taps before you go. It shows your teacher what landed and what to go over next time.","Unos toques antes de irte. Le muestra a tu maestro qué quedó claro y qué repasar la próxima vez."],
    qs:[{id:"got",kind:"scale",q:["How well did I understand today's lesson?","¿Qué tan bien entendí la lección de hoy?"],o:[["Not yet","Todavía no"],["A little","Un poco"],["Mostly","Casi todo"],["Well","Bien"],["I could teach it","Podría enseñarlo"]]},
        {id:"work",kind:"one",q:["How did I work today?","¿Cómo trabajé hoy?"],o:[["Focused the whole time","Concentrado todo el tiempo"],["Focused most of the time","Concentrado casi todo el tiempo"],["On and off","A ratos"],["It was hard to focus","Me costó concentrarme"]]},
        {id:"help",kind:"pick",max:2,q:["What helped me learn?","¿Qué me ayudó a aprender?"],o:[["The examples","Los ejemplos"],["Working with a partner","Trabajar con un compañero"],["The pictures","Las imágenes"],["Asking a question","Hacer una pregunta"],["Quiet time","Tiempo tranquilo"],["Moving around","Moverme"]]},
        {id:"learned",kind:"note",q:["One thing I learned today","Algo que aprendí hoy"]},
        {id:"stuck",kind:"note",q:["One thing I'm still wondering about (optional)","Algo que todavía me pregunto (opcional)"]}],
    follow:function(a){ return (a.got!=null&&a.got<=0); } },
  posttest:{ k:["After a test","Después de un examen"], h:["How did the test go?","¿Cómo te fue en el examen?"],
    lead:["Four taps. It helps your teacher plan what to review. There are no wrong answers here.","Cuatro toques. Ayuda a tu maestro a planear qué repasar. Aquí no hay respuestas incorrectas."],
    qs:[{id:"went",kind:"scale",q:["How do you think it went?","¿Cómo crees que te fue?"],o:[["Really hard","Muy difícil"],["Hard","Difícil"],["Okay","Bien"],["Pretty well","Bastante bien"],["Really well","Muy bien"]]},
        {id:"hard",kind:"pick",max:3,q:["What was hard?","¿Qué fue difícil?"],hint:["Pick up to three.","Elige hasta tres."],o:[["Remembering the words","Recordar las palabras"],["The steps in a problem","Los pasos de un problema"],["Reading the questions","Leer las preguntas"],["Writing my answers","Escribir mis respuestas"],["Running out of time","Quedarme sin tiempo"],["Staying calm","Mantener la calma"],["Nothing was hard","Nada fue difícil"]]},
        {id:"prep",kind:"pick",max:3,q:["How did I get ready?","¿Cómo me preparé?"],o:[["Studied my notes","Estudié mis notas"],["Used the review sheet","Usé la hoja de repaso"],["Practiced problems","Practiqué problemas"],["Studied with someone","Estudié con alguien"],["Asked questions","Hice preguntas"],["I didn't get ready","No me preparé"]]},
        {id:"next",kind:"pick",max:2,q:["What would help next time?","¿Qué me ayudaría la próxima vez?"],o:[["More practice first","Más práctica antes"],["A review together","Un repaso juntos"],["More time","Más tiempo"],["A quieter place","Un lugar más tranquilo"],["Questions read aloud","Que me lean las preguntas"],["Keep it the same","Dejarlo igual"]]},
        {id:"words",kind:"note",q:["Anything you want your teacher to know? (optional)","¿Algo que quieras que sepa tu maestro? (opcional)"]}],
    follow:function(a){ return (a.went!=null&&a.went<=0); } },
  repair:{ k:["After a hard moment","Después de un momento difícil"], h:["Reset and repair","Reiniciar y reparar"],

    qs:[{id:"what",kind:"one",q:["What happened?","¿Qué pasó?"],o:[["I got upset","Me enojé"],["I shut down","Me cerré"],["I had a disagreement","Tuve un desacuerdo"],["I left the room","Salí del salón"],["Something else","Otra cosa"]]},
        {id:"needed",kind:"pick",max:3,q:["What did I need?","¿Qué necesitaba?"],o:[["Space","Espacio"],["A break","Un descanso"],["Someone to listen","Que alguien me escuchara"],["To be understood","Que me entendieran"],["Help with the work","Ayuda con el trabajo"],["I'm not sure","No estoy seguro"]]},
        {id:"next",kind:"one",q:["What will I try next time?","¿Qué intentaré la próxima vez?"],o:[["Ask for a break","Pedir un descanso"],["Use a calm-down tool","Usar una herramienta para calmarme"],["Talk to an adult","Hablar con un adulto"],["Slow breaths","Respiraciones lentas"],["Walk away and come back","Alejarme y regresar"],["Not sure yet","Aún no sé"]]},
        {id:"now",kind:"scale",q:["How do you feel now?","¿Cómo te sientes ahora?"],o:[["Still upset","Todavía molesto"],["A bit better","Un poco mejor"],["Okay","Bien"],["Calm","Tranquilo"],["Ready to go","Listo para seguir"]]},
        {id:"words",kind:"note",q:["Anything else you want to say? (optional)","¿Algo más que quieras decir? (opcional)"]}],

  goal:{ k:["Goal check","Revisión de mi meta"], h:["How am I doing on my goal?","¿Cómo voy con mi meta?"],
    lead:["Your answer sits beside your teacher's chart, so both views are in the room.","Tu respuesta va junto a la gráfica de tu maestro, para que ambas miradas estén presentes."],
    qs:[{id:"close",kind:"scale",q:["How close am I to my goal?","¿Qué tan cerca estoy de mi meta?"],o:[["Just starting","Apenas empiezo"],["Some progress","Algo de progreso"],["Halfway","A la mitad"],["Almost there","Casi lo logro"],["I did it","Lo logré"]]},
        {id:"week",kind:"one",q:["This week I…","Esta semana yo…"],o:[["Worked hard on it","Trabajé duro en ella"],["Did some","Hice algo"],["Forgot about it","Me olvidé"],["Needed more help","Necesité más ayuda"]]},
        {id:"helps",kind:"pick",max:3,q:["What helps me most?","¿Qué me ayuda más?"],o:[["Practice","Practicar"],["Reminders","Recordatorios"],["Seeing my progress","Ver mi progreso"],["Working with an adult","Trabajar con un adulto"],["A quiet place","Un lugar tranquilo"],["Breaks","Descansos"]]},
        {id:"words",kind:"note",q:["Anything you want your team to know? (optional)","¿Algo que quieras que tu equipo sepa? (opcional)"]}] },

    +'<p class="lead" style="margin:8px 0 0">'+(S.parent?t("Every note you send lights a star. Seven make a constellation.","Cada nota que envía enciende una estrella. Siete forman una constelación."):t("Every slip you send lights a star. Seven make a constellation. Show your grown-up!","Cada hoja que envías enciende una estrella. Siete forman una constelación. ¡Muéstraselo a un adulto!"))+'</p>'; }

  var un=Q.get("u"); if(id==="unit"&&un) h+='<div class="goalbox">'+esc(un)+'</div>';

    h+='<div class="card"><p class="q">'+esc(t(q.q[0],q.q[1]))+'</p>'+(q.kind==="check"?'<p class="hint cnt" data-cnt="'+q.id+'">'+cnt(q)+'</p>':q.hint?'<p class="hint">'+esc(t(q.hint[0],q.hint[1]))+'</p>':'<p class="hint"></p>');

  h+='<div class="teach"><p class="hint" style="margin:0 0 8px">'+t("For teachers and parents","Para maestros y padres")+'</p><div class="acts">'
    +'<a class="mini" href="/slip.html?s='+id+'&amp;edit=1">'+t("Change this slip","Cambiar este registro")+'</a>'
    +'<button type="button" class="mini" id="shr">'+((navigator.share&&matchMedia("(pointer:coarse)").matches)?t("Share link","Compartir enlace"):t("Copy link","Copiar enlace"))+'</button>'
    +'<a class="mini" href="/slip">'+t("All slips","Todos los registros")+'</a></div><p class="said" id="said" aria-live="polite"></p></div>';

function wire(){

  app.querySelectorAll("[data-who]").forEach(function(b){ b.onclick=function(){ who=b.getAttribute("data-who"); paint(); }; });

  var tk=document.getElementById("talk"); if(tk) tk.onchange=function(){ TALK=tk.checked; };
  app.querySelectorAll("[data-note]").forEach(function(tx){ tx.addEventListener("input",function(){ A[tx.getAttribute("data-note")]=tx.value; }); });
  app.querySelectorAll(".opt").forEach(function(b){ b.onclick=function(){ var qid=b.getAttribute("data-q"), i=+b.getAttribute("data-i"), q=S.qs.filter(function(x){ return x.id===qid; })[0];
    if(q.kind==="pick"||q.kind==="check"){ var a=(A[qid]||[]).slice(), p=a.indexOf(i); if(p>=0) a.splice(p,1); else { if(a.length>=(q.max||(q.kind==="check"?99:3))) a.shift(); a.push(i); } A[qid]=a; }
    else A[qid]=(A[qid]===i?null:i);
    b.closest(".opts").querySelectorAll(".opt").forEach(function(x){ var j=+x.getAttribute("data-i"); x.setAttribute("aria-pressed", String(q.kind==="pick"||q.kind==="check"?(A[qid]||[]).indexOf(j)>=0:A[qid]===j)); });
    if(q.kind==="check"){ var c=app.querySelector('[data-cnt="'+qid+'"]'); if(c) c.textContent=cnt(q); var ab=document.getElementById("artBox"); if(ab) ab.innerHTML=artSvg(); } }; });
  app.querySelectorAll(".pv").forEach(function(b){ b.onclick=function(){ var qid=b.getAttribute("data-pq"), k=b.getAttribute("data-pk"), v=+b.getAttribute("data-v"), P=A[qid]=A[qid]||{};
    if(P[k]===v) delete P[k]; else P[k]=v;
    b.parentNode.querySelectorAll(".pv").forEach(function(x){ x.setAttribute("aria-pressed", String(P[k]===+x.getAttribute("data-v"))); });
    var q=S.qs.filter(function(x){ return x.id===qid; })[0], wb=document.getElementById("wallBox"); if(wb&&q) wb.innerHTML=wallSvg(q); }; });
  var pb=document.getElementById("ptsBy"); if(pb) pb.addEventListener("input",function(){ try{ localStorage.setItem("aog.pts.by",pb.value.trim().toUpperCase().slice(0,6)); }catch(e){} });

  var pt=document.getElementById("prt"); if(pt) pt.onclick=function(){ window.print(); };
  var sh=document.getElementById("shr"); if(sh) sh.onclick=function(){ shareLink(id,document.getElementById("said")); };
  var sh2=document.getElementById("shr2"); if(sh2) sh2.onclick=function(){ shareLink(id,document.getElementById("said2")); };
}

function edAt(path){ var p=path.split("."), q=DRAFT.qs[+p[1]]; return {p:p,q:q}; }
app.addEventListener("input",function(ev){ if(!EDITING||PREVIEW) return; var el=ev.target, path=el.getAttribute&&el.getAttribute("data-f"); if(!path) return;
  DIRTY=true; var v=el.value, both=[v,v];
  if(path==="k"||path==="h"||path==="lead"){ DRAFT[path]=both; return; }
  var a=edAt(path), p=a.p, q=a.q; if(!q) return;
  if(p[2]==="max") q.max=+v;
  else if(p[2]==="q"||p[2]==="hint") q[p[2]]=both;
  else if(p[2]==="o"||p[2]==="blocks") q[p[2]][+p[3]]=both;
  else if(p[2]==="goals"&&q.goals[+p[3]]) q.goals[+p[3]][p[4]]=both; });

    if(k==="one"||k==="pick") nq.o=[["",""],["",""]]; if(k==="pick") nq.max=2;

function edSave(asNew){ var D=DRAFT, bad="";

    if(q.goals) q.goals=q.goals.filter(function(g){ return String(g.t[0]).trim(); });
    var n=qi+1;
    if(!String(q.q[0]).trim()) bad=t("Question "+n+" needs words.","La pregunta "+n+" necesita palabras.");
    else if(q.o&&q.o.length<(q.kind==="check"?1:2)) bad=q.kind==="check"?t("Question "+n+" needs at least one step.","La pregunta "+n+" necesita al menos un paso."):t("Question "+n+" needs at least two choices.","La pregunta "+n+" necesita al menos dos opciones.");
    else if(q.kind==="points"&&(!q.blocks.length||!q.goals.length)) bad=t("The point sheet needs a part of the day and a goal.","La hoja de puntos necesita una parte del día y una meta."); });
  if(bad){ err=bad; edPaint(); edFocus("#st"); return; }
  var spec=cleanSpec(D,ORIG.custom?BLANK:ORIG); if(!spec){ err=t("Something is missing. Check each question.","Falta algo. Revisa cada pregunta."); edPaint(); return; }
  var m=mine(), to=id;
  if(asNew){ to=ownId(); if(String(spec.k[0])===String(ORIG.k[0])) spec.k=[nameOf(id)+t(" (my copy)"," (mi copia)"),nameOf(id)+t(" (my copy)"," (mi copia)")]; m[to]=spec; }
  else if(!ORIG.custom&&JSON.stringify(spec)===JSON.stringify(cleanSpec(specOf(ORIG),ORIG))) delete m[id];
  else m[id]=spec;
  jSet(EDK,m); DIRTY=false;
  location.href="/slip.html?s="+to+"&saved=1"+(Q.get("lang")?"&lang="+encodeURIComponent(Q.get("lang")):""); }
/* the answers as words (what a teacher reads) and as numbers (what a chart plots) */
/* a checklist's count, said plainly */
function cnt(q){ var n=(A[q.id]||[]).length, m=q.o.length; return n===m?t("All "+m+" done","Las "+m+" listas"):t(n+" of "+m+" done",n+" de "+m+" listas"); }
function readable(){ var out={}, nums={}, done=0, all=0; S.qs.forEach(function(q){ var v=A[q.id];
  if(q.kind==="points"){ var c=ptsSum(q), gs=goalsOf(q), P=v||{}; out.bricks=c.earned+" of "+(2*c.scored)+" bricks ("+c.pct+"%) · aim "+aim()+"%"; nums.bricks=c.pct;
    gs.forEach(function(g,gi){ out["goal"+(gi+1)]=g.t[0]+": "+q.blocks.map(function(b,bi){ var x=P[bi+"-"+gi]; return b[0]+" "+(x==null?"–":["Not yet","Building","Built it"][x]); }).join(", "); }); return; }
  if(q.kind==="check"){ var d=(v||[]).slice().sort(), no=q.o.map(function(o,i){ return i; }).filter(function(i){ return d.indexOf(i)<0; }); done+=d.length; all+=q.o.length;
    out[q.id]=(d.length?"Done: "+d.map(function(i){ return q.o[i][0]; }).join("; "):"")+(d.length&&no.length?" · ":"")+(no.length?"Not yet: "+no.map(function(i){ return q.o[i][0]; }).join("; "):""); return; }
  if(v==null||v===""||(Array.isArray(v)&&!v.length)) return;
  if(q.kind==="note") out[q.id]=String(v).trim().slice(0,400);
  else if(q.kind==="pick") out[q.id]=v.map(function(i){ return q.o[i][0]; }).join("; ");
  else { out[q.id]=q.o[v][0]; if(q.kind==="scale") nums[q.id]=v+1; } }); if(all) out.steps=done+" of "+all+" steps done"; return {words:out,nums:nums}; }
/* the weekly row, exactly the shape weekly.html sent */
function weeklyRow(now,d){ var ans={}; S.qs.forEach(function(q){ var v=A[q.id], a="";
    if(q.kind==="note") a=String(v||"").trim().slice(0,400);
    else if(q.kind==="pick") a=(v||[]).map(function(i){ return t(q.o[i][0],q.o[i][1]); }).join(", ");
    else if(v!=null) a=t(q.o[v][0],q.o[v][1]);
    ans[q.id]={q:t(q.q[0],q.q[1]),a:a,more:String(MORE[q.id]||"").trim().slice(0,400)}; });
  return { action:"checkin", checkinType:"weekly", studentId:who, timestamp:now.toISOString(), date:d, weekly:S.weekly, tellAdult:TALK, source:"link",
    extra:JSON.stringify({kind:"weekly",w:S.weekly,lang:ES?"es":"en",answers:ans}) }; }
/* the short line the Check-ins tab shows; a slip someone made or changed falls back to all its answers (AOG-SLIP-OWN-V1) */
function noteOf(r){ var n=[r.words.bricks,r.words.steps,r.words.words,r.words.topic,r.words.help,r.words.well].filter(Boolean).join(" · ");
  if(!n&&S.edited) n=Object.keys(r.words).map(function(k){ return r.words[k]; }).filter(Boolean).join(" · ").slice(0,500); return n; }
function send(){
  who=String((document.getElementById("who")||{}).value||who||"").trim().slice(0,40);
  if(!who){ err=t("Put a name at the top first.","Primero pon un nombre arriba."); paint(); var w=document.getElementById("who"); if(w) w.scrollIntoView({block:"center"}); return; }
  remember(who);
  var r=readable(), now=new Date(), d=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  var follow=!!(S.follow&&S.follow(Object.keys(r.nums).reduce(function(o,k){ o[k]=r.nums[k]-1; return o; },{ today:r.words.today })));
  var row=S.weekly?weeklyRow(now,d):{ action:"checkin", checkinType:"slip-"+id, slipType:id, studentId:who, respondentId:S.parent?"parent":who, respondentRole:S.parent?"parent":"student",
    timestamp:now.toISOString(), date:d, period:Q.get("period")||"", classId:Q.get("classId")||"", grade:Q.get("grade")||"",
    note:noteOf(r), followUp:follow||!!(S.talk&&TALK), tellAdult:S.talk?(TALK?"yes":"no"):"", source:"link",
    extra:JSON.stringify({ series:"slip", slip:id, v:1, lang:ES?"es":"en", answers:r.words, scale:r.nums, goalId:Q.get("goal")||"", goalTitle:Q.get("gt")||"", unit:Q.get("u")||"", pts:ptsPack(), edited:S.edited?1:0, asked:S.edited?S.qs.reduce(function(o,q){ o[q.id]=q.q[0]; return o; },{}):undefined }) };
  if(S.weekly) jSet("aog.weekly.mine",(jGet("aog.weekly.mine",[])||[]).concat([{w:S.weekly,who:who,ts:now.toISOString(),answers:JSON.parse(row.extra).answers,talk:TALK}]).slice(-60));
  var mine=jGet("aog.slips.mine",[])||[]; mine.push(Object.assign({},row,{mine:true})); jSet("aog.slips.mine",mine.slice(-300));
  if(!DEST){ sent=true; paint(); return; }
  busy=true; err=""; paint();
  var body=JSON.stringify(Object.assign({_backendAuth:DEST.k},row));
  fetch(DEST.u,{method:"POST",mode:"cors",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body})
    .then(function(res){ return res.json(); })
    .then(function(j){ busy=false; if(j&&j.ok){ sent=true; } else { err=t("It didn’t go through: ","No se envió: ")+String((j&&j.error)||"no answer"); } paint(); })
    .catch(function(){
      /* one blind send and an honest word, never a silent retry loop */
      fetch(DEST.u,{method:"POST",mode:"no-cors",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body})
        .then(function(){ busy=false; sent=true; paint(); })
        .catch(function(){ busy=false; err=t("Couldn’t reach the Sheet. It’s saved on this device; try again in a moment.","No se pudo llegar a la Hoja. Está guardado en este aparato; inténtalo en un momento."); paint(); });
    });
}
paint();
})();
</script>
