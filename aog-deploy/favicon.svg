<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- AOG ICON "ARCH" (2026-09-26) — Jimmy: "the icon looks too much like Pictionary." The rainbow rose window is
     gone. One pointed window, a few panes of quiet glass, a gold A. Navy, gold, cream: the site's own three. -->
<defs>
 <radialGradient id="bg" cx=".5" cy=".38" r=".8"><stop offset="0" stop-color="#17395F"/><stop offset="1" stop-color="#071526"/></radialGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBE3A0"/><stop offset=".55" stop-color="#E7B94E"/><stop offset="1" stop-color="#B8862B"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2F63B8"/><stop offset=".6" stop-color="#1C4784"/><stop offset="1" stop-color="#12304F"/></linearGradient>
 <radialGradient id="lit" cx=".5" cy=".28" r=".6"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".30"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
 <clipPath id="win"><path d="M256 92 C 330 92 384 150 384 232 L 384 420 L 128 420 L 128 232 C 128 150 182 92 256 92 Z"/></clipPath>
</defs>
<rect width="512" height="512" fill="url(#bg)"/>
<!-- the window: quiet blue glass, lead lines, light from above -->
<g clip-path="url(#win)">
 <rect x="128" y="92" width="256" height="328" fill="url(#glass)"/>
 <rect x="128" y="92" width="256" height="328" fill="url(#lit)"/>
 <g stroke="#0A1E33" stroke-width="7" fill="none" opacity=".9">
  <path d="M256 92 V 420"/><path d="M128 232 H 384"/><path d="M128 326 H 384"/>
  <path d="M192 108 V 420"/><path d="M320 108 V 420"/>
 </g>
 <!-- two warm panes so the window is not all one blue -->
 <rect x="199" y="239" width="50" height="80" fill="#A8323E" opacity=".75"/>
 <rect x="263" y="239" width="50" height="80" fill="#1F8080" opacity=".75"/>
 <rect x="135" y="333" width="50" height="87" fill="#B87A12" opacity=".55"/>
 <rect x="327" y="333" width="50" height="87" fill="#B87A12" opacity=".55"/>
</g>
<!-- stone and lead frame -->
<path d="M256 92 C 330 92 384 150 384 232 L 384 420 L 128 420 L 128 232 C 128 150 182 92 256 92 Z" fill="none" stroke="#0A1E33" stroke-width="22"/>
<path d="M256 92 C 330 92 384 150 384 232 L 384 420 L 128 420 L 128 232 C 128 150 182 92 256 92 Z" fill="none" stroke="url(#gold)" stroke-width="10"/>
<path d="M112 420 H 400" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
<!-- the A -->
<g transform="translate(0,6)">
 <path d="M256 150 L 352 392 H 312 L 290 334 H 222 L 200 392 H 160 Z M 233 300 H 279 L 256 236 Z" fill="#0A1E33" opacity=".55" transform="translate(0,7)"/>
 <path d="M256 150 L 352 392 H 312 L 290 334 H 222 L 200 392 H 160 Z M 233 300 H 279 L 256 236 Z" fill="url(#gold)"/>
</g>
</svg>
