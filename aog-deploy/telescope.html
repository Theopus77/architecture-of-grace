<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Telescope — Architecture of Grace</title>
<meta name="description" content="A 90 mm brass refractor with a working eyepiece. The Moon, Jupiter, a double star — and the landing sea, where the lander is smaller than the air.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&display=optional" rel="stylesheet">
<style>
:root {
  --bg:#f4f0e6; --card:#fffcf7; --ink:#1a232c; --muted:#5c6670; --line:#ddd8cc;
  --steel:#2f5c6b; --steel-fg:#f4f8f9; --steel-soft:#e3eef2;
  --good:#2c7a4e; --good-soft:#e3f0e8; --bad:#9c3a2e; --bad-fg:#fdf6f4; --bad-soft:#f6e5e2;
  --chip:#efebe3; --shadow:0 1px 3px rgb(26 35 44 / .08);
  --sans:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  --display:"Fraunces", Georgia, serif;
}
.dark, [data-theme="dark"] {
  --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
  --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
  --good:#6fbf8b; --good-soft:#1f3327; --bad:#e08573; --bad-fg:#14181e; --bad-soft:#3a2622;
  --chip:#2a313c;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.55 var(--sans); overflow-x:hidden; }
h1,h2,h3 { font-family:var(--display); font-weight:600; letter-spacing:-.02em; text-wrap:balance; }
h1 { font-size:clamp(1.5rem,4vw,2.3rem); margin:.2rem 0 .4rem; }
a { color:inherit; }
button { font:inherit; cursor:pointer; }
button, a { touch-action:manipulation; }
.wrap { max-width:1080px; margin:0 auto; padding:max(1.1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(3rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
body:has(.aogtop) header .tools { display:none; }
.brand { font-size:.75rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-decoration:none; min-height:44px; display:inline-flex; align-items:center; }
.tools { display:flex; gap:.5rem; }
.pill, .btn { min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .9rem; font-weight:600; font-size:.9rem; display:inline-flex; align-items:center; justify-content:center; }
.btn-steel { background:var(--steel); color:var(--steel-fg); border-color:transparent; }
.btn-bad { background:var(--bad); color:var(--bad-fg); border-color:transparent; }
.nav { display:flex; gap:4px; overflow-x:auto; border-bottom:2px solid var(--line); margin-bottom:1rem; }
.nav a { min-height:44px; display:inline-flex; align-items:center; padding:0 .8rem; text-decoration:none; color:var(--muted); font-weight:600; border-bottom:2px solid transparent; margin-bottom:-2px; }
.nav a.on { color:var(--ink); border-color:var(--steel); }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:.75rem; margin-bottom:1rem; }
.kicker { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); }
.muted, .note-line { color:var(--muted); }
.lead { max-width:62ch; color:var(--muted); }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
.tiny { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); }
.ok { color:var(--good); }
.lab-grid { display:grid; gap:1.1rem; margin-top:.6rem; align-items:start; }
.eye-box { background:color-mix(in oklab, var(--ink) 94%, black); border-radius:16px; padding:.75rem; }
.eye-wrap { position:relative; margin:0 auto; width:100%; max-width:min(520px, 52dvh); aspect-ratio:1; touch-action:none; user-select:none; -webkit-user-select:none; }
.eye-wrap canvas { width:100%; height:100%; border-radius:50%; display:block; }
.eye-hud { position:absolute; left:50%; bottom:8%; transform:translateX(-50%); color:#f4efe4; font:700 12px/1.2 var(--sans); text-shadow:0 1px 3px #000; pointer-events:none; white-space:nowrap; }
.readout { display:flex; justify-content:space-between; gap:.5rem; color:color-mix(in oklab, var(--steel-fg) 82%, transparent); font-size:.9rem; margin-top:.45rem; font-variant-numeric:tabular-nums; }
.phone-bar, .desk-bar, .board { display:flex; flex-direction:column; gap:.15rem; }
.desk-bar { display:none; }
.board, .phone-bar { padding:.8rem .9rem; }
.row { display:flex; justify-content:space-between; align-items:center; gap:.4rem; padding:.28rem 0; border-bottom:1px solid var(--line); }
.row > span:last-child { display:flex; flex-wrap:wrap; gap:.35rem; justify-content:flex-end; }
.board .btn, .phone-bar .btn { min-height:40px; padding:0 .7rem; font-size:.85rem; }
.knobs { display:grid; gap:.4rem; margin-top:.8rem; }
@media (min-width:640px){ .knobs { grid-template-columns:1fr 1fr; } }
label.knob span { display:flex; justify-content:space-between; font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.scope-knob { -webkit-appearance:none; appearance:none; width:100%; height:40px; background:transparent; margin:0; }
.scope-knob::-webkit-slider-runnable-track { height:8px; border-radius:999px; background:var(--chip); }
.scope-knob::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; margin-top:-9px; border-radius:99px; background:var(--steel); border:2px solid var(--card); }
.stair { list-style:none; margin:.4rem 0 0; padding:0; display:flex; flex-direction:column; gap:.4rem; }
.stair > li { border:1px solid var(--line); border-radius:10px; padding:.5rem .7rem; }
.stair > li.now { border-color:var(--steel); background:var(--steel-soft); }
.stair > li.later { opacity:.62; }
.stair > li.done { display:flex; align-items:baseline; gap:.55rem; padding:.38rem .7rem; }
.stair > li.done h3 { margin:0; font-size:.95rem; }
.stair .mk { margin:0; font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); }
.stair h3 { margin:.05rem 0 .15rem; font-size:1.02rem; }
.stair ol { list-style:none; margin:.2rem 0 0; padding:0; }
.stair li.step { display:flex; gap:.45rem; padding:.14rem 0; font-size:.88rem; }
.do { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.5rem; }
.practical-box { margin-top:1rem; padding:1rem 1.05rem; }
.warn { margin-top:.7rem; padding:.8rem 1rem; background:var(--bad-soft); border-radius:12px; }
.lab-stack { display:flex; flex-direction:column; }
@media (max-width:767px){
  .lab-stack .lab-grid { order:1; }
  .lab-stack .phone-bar { order:2; margin-top:.7rem; }
  .lab-stack .practical-box { order:3; }
}
@media (min-width:768px){
  .phone-bar { display:none !important; }
  .desk-bar { display:flex; }
  .lab-grid { grid-template-columns:minmax(0,1fr) minmax(300px,380px); }
  .eye-stick { position:sticky; top:12px; }
  .board .btn { min-height:36px; }
}
.home-grid { display:grid; gap:1rem; margin-top:1rem; }
@media (min-width:800px){ .home-grid { grid-template-columns:280px 1fr; align-items:center; } }
svg.scope { width:100%; height:auto; }
.grid-home { display:grid; gap:1rem; margin-top:.5rem; }
.cards { display:grid; gap:.75rem; align-content:start; }
.act { display:block; padding:1.1rem 1.2rem; text-decoration:none; color:inherit; }
.act:hover { border-color:var(--steel); }
.badge { display:inline-flex; align-items:center; background:var(--steel-soft); color:var(--steel); border-radius:999px; padding:.15rem .5rem; font-size:.75rem; font-weight:700; }
@media (min-width:768px){ .grid-home { grid-template-columns: minmax(0,300px) minmax(0,1fr); align-items:start; } }

/* AOG-SCIPIC-PANEL-V1 (2026-09-23) - Jimmy: "Can the Microscope missions and the TELESCOPE
   Missions get their own walk throughs like the TURN tables and sp-1200 just recieved?
   Embedded as something they could be printed out?" Same panel as AOG-PGPANEL-V1 on the
   decks: the guide is an iframe of its own file, loaded on first open, never printed here. */
.pg{margin:1.4rem 0 0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.pg>summary{list-style:none;cursor:pointer;padding:.8rem 1rem;display:flex;align-items:center;gap:.7rem;
  font-weight:700;font-size:.98rem;min-height:44px}
.pg>summary::-webkit-details-marker{display:none}
.pg>summary::marker{content:""}
.pg .chev{flex:0 0 auto;transition:transform .15s ease;color:var(--muted);font-size:.9rem}
.pg[open] .chev{transform:rotate(90deg)}
.pg .pgsub{font-weight:400;color:var(--muted);font-size:.86rem;margin-left:auto;text-align:right}
.pg .pgbody{border-top:1px solid var(--line)}
.pg iframe{display:block;width:100%;border:0;min-height:60vh;background:var(--bg)}
.pg .pgfoot{padding:.65rem 1rem;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted);margin:0}
.pg .pgfoot a{color:inherit;font-weight:700}
@media print{ .pg{display:none !important} }

/* AOG-TOOL-THIN-V1 (2026-09-26) — Jimmy: "They all don't need the two bars stating the name. Just keep the
   blue bar. However the blue bar is to be thinner." One masthead, half the height; the brand row above it goes. */
html.aog-grace #toolMast[data-aog-hero]{padding-top:18px!important;padding-bottom:16px!important;margin-bottom:14px}
html.aog-grace #toolMast[data-aog-hero] h1{font-size:clamp(26px,3.2vw,38px)!important;margin:.15rem 0 .25rem!important}
html.aog-grace #toolMast[data-aog-hero] .lead{font-size:.95rem;margin:0}
html.aog-grace #toolMast[data-aog-hero] .kicker{font-size:.66rem}
body>.wrap>header:first-child,.wrap>header.no-print:first-child{display:none!important}
</style>
</head>
<body>
<script src="/aog-grace.js" defer></script>
<script>
(function(){
  function add(src){
    var s=document.createElement("script");
    s.src=src;
    s.onerror=function(){ if(src.indexOf("netlify.app")<0) add("https://architectureofgrace.netlify.app/aog-topbar.js"); };
    document.head.appendChild(s);
  }
  add(new URL("aog-topbar.js", document.baseURI).href);
})();

<div class="wrap">
  <header class="no-print">
    <a class="brand" href="/" id="brand">The Telescope</a>
    <div class="tools">
      <a class="pill" href="/telescope-guide" style="text-decoration:none">Picture guide</a>
      <button type="button" class="pill" id="langBtn">ES</button>
      <button type="button" class="pill" id="themeBtn">Dark</button>
    </div>
  </header>
  <!-- AOG-TOOL-MAST-V1 (2026-09-26) — Jimmy: "I like the header on the turntables page … it should be applied to
       the other tools." A static masthead outside #view, so aog-grace paints it navy like the turntables and a
       re-render of the view never wipes it. paint() keeps its words in the current language. -->
  <section class="mast" id="toolMast"><p class="kicker" id="mastK"></p><h1 id="mastH"></h1><p class="lead" id="mastL"></p></section>
  <nav class="nav no-print" id="nav" aria-label="Activity"></nav>
  <main id="view"></main>
  <!-- AOG-SCIPIC-PANEL-V1 -->
  <details class="pg no-print" id="pgPanel">
    <summary><span class="chev">&#9656;</span>Picture guide<span class="pgsub">Every mission in pictures &#183; prints on 9 pages</span></summary>
    <div class="pgbody">
      <iframe id="pgFrame" data-src="/telescope-guide?embed=1" title="The Telescope, in pictures" loading="lazy"></iframe>
    </div>
    <p class="pgfoot">To print it, <a href="/telescope-guide">open the picture guide on its own page</a>.</p>
  </details>
  <p class="muted" id="foot" style="margin-top:2rem;font-size:.9rem"></p>
</div>
<script>

const KEY = "scope.sky.v1";
const THEME_KEY = "aog.interior.ws.v1.theme";

  target:{en:"Target",es:"Objeto"}, eye:{en:"Eyepiece",es:"Ocular"},

  measure:{en:"Measure",es:"Medir"},

  filter:{en:"Solar filter",es:"Filtro solar"}, none:{en:"None",es:"Ninguno"}, front:{en:"Front",es:"Al frente"},
  practical:{en:"Bench practical",es:"Práctica de mesa"},
  teach:{en:"Missions",es:"Misiones"},
  teachLock:{en:"Locked",es:"Cerradas"},
  teachOpen:{en:"Open",es:"Abiertas"},
  teachLocked:{en:"Locked. Each mission opens the next control.",es:"Cerradas. Cada misión abre el control siguiente."},
  teachOpenNote:{en:"Open. Every control is on the bench. Lock this before a student sits down.",es:"Abiertas. Todos los controles están en la mesa. Ciérralas antes de que se siente un estudiante."},
  hint:{en:"Six missions. Each one opens the next. The last one is the ceiling: larger is not finer.",es:"Seis misiones. Cada una abre la siguiente. La última es el techo: más grande no es más fino."},

  fineHint:{en:"The fine knob is under the circle. Changing the eyepiece throws the focus off.",es:"El micrométrico está debajo del círculo. Cambiar el ocular saca el foco."},

  orion:{en:"Orion",es:"Orión"}, pleiades:{en:"Pleiades",es:"Pléyades"}, albireo:{en:"Albireo",es:"Albireo"}, pair:{en:"The pair",es:"El par"},
  sea:{en:"The sea",es:"El mar"}, sunName:{en:"Sun",es:"Sol"}
};
const STAIR = [
  {en:"Make the telescope work",es:"Haz funcionar el telescopio",
    blurb_en:"Cap off. Lock the mount. 25 mm. Coarse focus on the Moon.",
    blurb_es:"Tapa fuera. Fija la montura. 25 mm. Enfoca la Luna con el macrométrico.",
    steps:["cap","lock","low","coarse"]},
  {en:"See more",es:"Ver más",
    blurb_en:"10 mm, then the 6 mm, then the fine knob. The Moon no longer fits.",
    blurb_es:"10 mm, luego el de 6 mm, luego el micrométrico. La Luna ya no cabe.",
    steps:["mid","short","fine"]},
  {en:"Change what you see",es:"Cambia lo que ves",
    blurb_en:"Jupiter is a striped bead. Orion is a gray cloud and four stars.",
    blurb_es:"Júpiter es una cuenta rayada. Orión es una nube gris y cuatro estrellas.",
    steps:["jupiter","orion"]},
  {en:"Measure",es:"Medir",
    blurb_en:"Reticle in. Two taps. Read arcseconds, not a feeling.",
    blurb_es:"Retículo puesto. Dos toques. Lee segundos de arco, no una impresión.",
    steps:["measure"]},
  {en:"What can't this telescope see?",es:"¿Qué no puede ver este telescopio?",
    blurb_en:"The sea where they landed. 6 mm. In focus. The lander is 0.002″.",
    blurb_es:"El mar donde alunizaron. 6 mm. En foco. El módulo mide 0.002″.",
    steps:["ceiling"]},
  {en:"The research bench",es:"El banco de investigación",
    blurb_en:"Albireo splits. The 1.0″ pair does not. The Barlow makes the smear bigger.",
    blurb_es:"Albireo se separa. El par de 1.0″ no. El Barlow agranda la mancha.",
    steps:["albireo","barlow"]}
];
const STEP = {
  cap:{en:"Take the cap off",es:"Quita la tapa"},
  lock:{en:"Lock the mount",es:"Fija la montura"},
  low:{en:"Start on the 25 mm",es:"Empieza con el de 25 mm"},
  coarse:{en:"Coarse-focus the Moon",es:"Enfoca la Luna con el macrométrico"},
  mid:{en:"Go to the 10 mm",es:"Pasa al de 10 mm"},
  short:{en:"Go to the 6 mm",es:"Pasa al de 6 mm"},
  fine:{en:"Sharpen the Moon with the fine knob",es:"Afina la Luna con el micrométrico"},
  jupiter:{en:"Find Jupiter in focus",es:"Encuentra Júpiter en foco"},
  orion:{en:"Find Orion's cloud with the 10 mm or the 6 mm",es:"Encuentra la nube de Orión con el de 10 o el de 6 mm"},
  measure:{en:"Measure something at 90× or 150×",es:"Mide algo a 90× o 150×"},
  ceiling:{en:"Center the landing sea at 150×",es:"Centra el mar del alunizaje a 150×"},
  albireo:{en:"Split Albireo",es:"Separa Albireo"},
  barlow:{en:"Barlow the 1.0″ pair and read 1.3″",es:"Pon el Barlow al par de 1.0″ y lee 1.3″"}
};
const S = {
  page:"home", lang:"en", theme:"light", teacher:"open",
  lab:{cap:true,locked:false,ep:25,barlow:false,coarse:18,fine:46,eyeTwist:22,target:"moon",sky:"night",filter:false,panX:0,panY:0,reticle:false,measure:false,mA:null,mB:null}
};
try {
  const raw = JSON.parse(localStorage.getItem(KEY)||"null");
  if (raw) Object.assign(S, {lang:raw.lang||"en", missions:raw.missions||{}, teacher:raw.teacher==="locked"?"locked":"open"});
  if (localStorage.getItem(THEME_KEY)==="dark") S.theme="dark";
} catch(e){}
if (!S.missions) S.missions = {};
function persist(){ try { localStorage.setItem(KEY, JSON.stringify({lang:S.lang,missions:S.missions,teacher:S.teacher})); localStorage.setItem(THEME_KEY,S.theme);} catch(e){} }
function t(k){ const x=STR[k]; return x ? (S.lang==="es"?x.es:x.en) : k; }
function missionsOpen(){ return S.teacher!=="locked"; }
function benchStep(){ return missionsOpen() ? STAIR.length : stairNow(); }
function magOf(L){ return (SCOPE.fl/L.ep) * (L.barlow?2:1); }
function focusErr(L){
  const ideal = L.ep===25?42 : L.ep===10?58 : 72;
  return (L.coarse-ideal) + (L.fine-50)*0.12;
}
function focusBand(L){
  const e=Math.abs(focusErr(L||S.lab));
  const tol=L&&L.ep===25?12:L&&L.ep===10?6:3.2;
  return e<tol*0.4?"in":e<tol?"near":"out";
}
function stairNow(){
  for (let i=0;i<STAIR.length;i++) if (!STAIR[i].steps.every(id=>S.missions[id])) return i;
  return STAIR.length;
}
function btn(on,act,lab){ return `<button class="btn${on?" btn-steel":""}" data-act="${act}">${lab}</button>`; }
function tfovArcmin(mag){ return (SCOPE.afov/mag)*60; }

let MOON=null;
/* AOG-TELE-REALMOON-V1 (2026-09-26) — Jimmy: "Can the images from the telescope be more real?"
   The Moon is now drawn from where things actually are: the seas by their real outlines in
   selenographic longitude and latitude, forty named craters at their true places and sizes
   (Tycho and Copernicus with their rays, Plato with its dark floor, Clavius with the arc of
   craterlets), the Apennines, Alps and Caucasus as ridges, and a sphere lit by one sun so the
   terminator is the soft line where the light runs out, with long shadows next to it. */
function bakeMoon(){
  const N=1400, H=new Float32Array(N*N), alb=new Float32Array(N*N), mareM=new Uint8Array(N*N);
  const cx=N/2, cy=N/2, R=N*0.5-3, RAD=15.5;
  const D2R=Math.PI/180;

}

function targetsFor(step){
  const list=[["moon","moon"]];
  if (step>=2) list.push(["jupiter","jupiter"],["saturn","saturn"],["orion","orion"],["pleiades","pleiades"]);
  if (step>=4) list.push(["sea","sea"]);
  if (step>=5) list.push(["albireo","albireo"],["pair","pair"]);
  list.push(["sun","sunName"]);
  return list;
}

let eyeRaf=0, skyOff=null;
const EYE_DUST=[
  {a:0.4,t:.22,s:1.3,k:.55},{a:1.15,t:.58,s:1.7,k:.7},{a:2.05,t:.74,s:.9,k:.4},
  {a:2.7,t:.36,s:2.1,k:.6},{a:3.45,t:.82,s:1.15,k:.5},{a:4.2,t:.48,s:.75,k:.35},
  {a:5.05,t:.64,s:1.45,k:.55},{a:5.7,t:.28,s:1.6,k:.42},
  {a:0.95,t:.67,s:1,k:.5,fiber:1,fx:16,fy:-5},
  {a:3.7,t:.51,s:.8,k:.4,fiber:1,fx:-12,fy:8},
  {a:4.85,t:.79,s:.7,k:.38,fiber:1,fx:9,fy:11}
];
function drawEyeDust(ctx, cx, cy, r, w, twist){
  const ang=(twist||0)/100*Math.PI*2;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(ang);
  EYE_DUST.forEach(d=>{
    const x=Math.cos(d.a)*r*d.t, y=Math.sin(d.a)*r*d.t;
    const alpha=0.35+d.k*0.4, sc=Math.max(.7, w/900);
    ctx.fillStyle="rgba(28,24,18,"+alpha+")";
    ctx.strokeStyle="rgba(214,210,200,"+(alpha*0.55)+")";
    ctx.lineWidth=Math.max(0.8, sc);
    if(d.fiber){
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+d.fx*sc, y+d.fy*sc); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(x,y,Math.max(.8,d.s*sc),0,6.3); ctx.fill(); ctx.stroke();
    }
  });
  ctx.restore();
}
function achromatFringe(ctx, src, w, h, cx, cy, r, strength){
  if(strength<0.05) return;
  const N=156;
  if(!achromatFringe.buf) achromatFringe.buf=document.createElement("canvas");
  const b=achromatFringe.buf;
  if(b.width!==N){ b.width=N; b.height=N; }
  const g=b.getContext("2d",{willReadFrequently:true});
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,N,N);
  g.drawImage(src, cx-r, cy-r, r*2, r*2, 0, 0, N, N);
  let im; try{ im=g.getImageData(0,0,N,N); }catch(e){ return; }
  const d=im.data, out=g.createImageData(N,N), o=out.data;
  const lum=i=>0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
  const shift=0.7+strength*2.8;
  for(let y=2;y<N-2;y++){
    for(let x=2;x<N-2;x++){
      const i=(y*N+x)*4;
      const e=Math.hypot(lum(i+4)-lum(i-4), lum(i+N*4)-lum(i-N*4));
      if(e<24) continue;
      const dx=x-N/2, dy=y-N/2, dist=Math.min(1, Math.hypot(dx,dy)/(N*0.46));
      const lat=0.25+dist*dist*0.95, sft=shift*lat, len=Math.hypot(dx,dy)||1;
      const ux=dx/len, uy=dy/len, k=Math.min(150, e*lat*0.9);
      const stamp=(px,py,R,G,B,a)=>{
        const vx=px|0, vy=py|0;
        if(vx<1||vy<1||vx>=N-1||vy>=N-1) return;
        const j=(vy*N+vx)*4;
        o[j]=Math.min(255,o[j]+R*a); o[j+1]=Math.min(255,o[j+1]+G*a);
        o[j+2]=Math.min(255,o[j+2]+B*a); o[j+3]=Math.min(255,o[j+3]+a*255);
      };
      stamp(x+ux*sft, y+uy*sft, 0.72, 0.28, 1, k/255);
      stamp(x-ux*sft*0.6, y-uy*sft*0.6, 0.65, 0.85, 0.25, k/255*0.55);
    }
  }
  g.putImageData(out,0,0);
  ctx.save(); ctx.globalCompositeOperation="screen";
  ctx.drawImage(b, cx-r, cy-r, r*2, r*2);
  ctx.restore();
}
function startEye(){
  const canvas=document.getElementById("eyecanvas"); if(!canvas) return;
  const wrap=canvas.parentElement, ctx=canvas.getContext("2d");
  const resize=()=>{
    const s=Math.round(wrap.clientWidth||400), dpr=Math.min(devicePixelRatio||1,2), px=Math.round(s*dpr);
    if (canvas.width!==px){ canvas.width=canvas.height=px; }
  };
  resize();
  if (!wrap._bound){
    wrap._bound=true;
    let drag=null, moved=0;
    const loc=e=>{ const r=wrap.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height}; };
    wrap.addEventListener("pointerdown", e=>{ if(e.pointerType==="touch") e.preventDefault(); wrap.setPointerCapture(e.pointerId); drag={x:e.clientX,y:e.clientY}; moved=0; }, {passive:false});
    wrap.addEventListener("pointermove", e=>{
      if(!drag) return;
      const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
      moved+=Math.abs(dx)+Math.abs(dy); drag={x:e.clientX,y:e.clientY};
      if(!(S.lab.measure&&moved<10)){
        const mag=magOf(S.lab), z=(wrap.clientWidth||400)*.92/tfovArcmin(mag);
        S.lab.panX+=dx/z; S.lab.panY+=dy/z;
      }
    });
    wrap.addEventListener("pointerup", e=>{
      if (S.lab.measure && moved<12 && S.lab.target!=="sun" && !S.lab.cap){
        const p=loc(e), w=canvas.width, h=canvas.height, cx=w/2, cy=h/2, r=Math.min(w,h)*.46;
        const sx=p.x*(w/(p.w||1)), sy=p.y*(h/(p.h||1));
        if ((sx-cx)**2+(sy-cy)**2<=r*r){
          const mag=magOf(S.lab), z=w*.92/tfovArcmin(mag);
          const spec={x:(sx-cx)/z - S.lab.panX, y:(sy-cy)/z - S.lab.panY};
          if (!S.lab.mA || S.lab.mB){ S.lab.mA=spec; S.lab.mB=null; }
          else S.lab.mB=spec;
          const before=stairNow(); tick(); if (stairNow()!==before) paint();
        }
      }
      drag=null;
    });
    wrap.addEventListener("touchmove", e=>{ if(drag) e.preventDefault(); }, {passive:false});
  }
  const draw=now=>{
    EYE_NOW=now||0;
    resize();
    const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=Math.min(w,h)*.46;
    const L=S.lab;
    if (!L.locked && !L.cap && !(L.target==="sun" && !L.filter)){ L.panX+=0.012; }
    ctx.clearRect(0,0,w,h);
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,6.3); ctx.clip();
    const sky=skyNow();
    paintSky(ctx,w,h,sky);
    if (!L.cap && (L.target!=="sun" || L.filter)){
      const mag=magOf(L);
      const zoom=w*.92/tfovArcmin(mag);
      if (!skyOff) skyOff=document.createElement("canvas");
      if (skyOff.width!==w){ skyOff.width=w; skyOff.height=h; }
      const sctx=skyOff.getContext("2d");
      paintSky(sctx,w,h,sky);
      sctx.save();
      sctx.translate(cx,cy); sctx.scale(zoom,zoom); sctx.translate(L.panX,L.panY);
      if (sky!=="day" && L.target!=="moon" && L.target!=="sea") drawStars(sctx);
      if (L.target==="moon"||L.target==="sea") drawMoon(sctx);
      else if (L.target==="jupiter") drawJupiter(sctx, now);
      else if (L.target==="saturn") drawSaturn(sctx);
      else if (L.target==="orion") drawOrion(sctx);
      else if (L.target==="pleiades") drawPleiades(sctx);
      else if (L.target==="albireo") drawAlbireo(sctx);
      else if (L.target==="pair") drawPair(sctx);
      else if (L.target==="sun") drawSun(sctx);
      sctx.restore();
      achromatFringe(sctx, skyOff, w, h, cx, cy, r, Math.min(1.25, mag/120));
      const err=Math.abs(focusErr(L)), band=focusBand(L);
      const blurArcsec=SCOPE.seeing+(band==="in"?0:band==="near"?err*6:Math.min(900, err*28))+(L.barlow?2:0);
      const blurPx=blurArcsec/60*zoom;
      EYE_NOW=now||0;
      ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
      if (blurPx<1.1) ctx.drawImage(skyOff,0,0);
      else {
        const px=Math.min(56, Math.max(1.2, blurPx*0.22));
        ctx.save();
        ctx.filter="blur("+px.toFixed(2)+"px)";
        ctx.drawImage(skyOff,0,0);
        ctx.filter="none";
        ctx.restore();
      }
      if (L.reticle){
        const ink=sky==="day"?"rgba(18,28,38,.85)":"rgba(255,255,255,.8)";
        ctx.strokeStyle=ink; ctx.lineWidth=1;
        ctx.beginPath(); ctx.moveTo(cx-r*.7,cy); ctx.lineTo(cx+r*.7,cy); ctx.moveTo(cx,cy-r*.7); ctx.lineTo(cx,cy+r*.7); ctx.stroke();
      }
      if (L.mA){
        const mag=magOf(L), zoom=w*.92/tfovArcmin(mag);
        const ax=cx+(L.mA.x+L.panX)*zoom, ay=cy+(L.mA.y+L.panY)*zoom;
        ctx.fillStyle="#f2d48a"; ctx.beginPath(); ctx.arc(ax,ay,4,0,6.3); ctx.fill();
        if (L.mB){
          const bx=cx+(L.mB.x+L.panX)*zoom, by=cy+(L.mB.y+L.panY)*zoom;
          ctx.strokeStyle="#f2d48a"; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
          ctx.beginPath(); ctx.arc(bx,by,4,0,6.3); ctx.fill();
          const px=Math.hypot(ax-bx,ay-by);
          const arcsec=(px/(2*r))*tfovArcmin(mag)*60;
          const label=arcsec>=120?(arcsec/60).toFixed(1)+"′":Math.round(arcsec)+"″";
          ctx.fillStyle="#f4efe4"; ctx.font="700 13px sans-serif"; ctx.textAlign="center";
          ctx.fillText(label,(ax+bx)/2,(ay+by)/2-8);
        }
      }
      const barMin = mag<50?30:mag<120?10:2;
      const barPx=(barMin/tfovArcmin(mag))*(2*r);
      const ink=sky==="day"?"rgba(18,28,38,.8)":"rgba(255,255,255,.8)";
      ctx.strokeStyle=ink; ctx.lineWidth=1.5;
      ctx.beginPath(); const y=cy+r*.78, x0=cx-barPx/2;
      ctx.moveTo(x0,y-4); ctx.lineTo(x0,y+4); ctx.moveTo(x0,y); ctx.lineTo(x0+barPx,y); ctx.moveTo(x0+barPx,y-4); ctx.lineTo(x0+barPx,y+4); ctx.stroke();
      ctx.fillStyle=ink; ctx.font="12px sans-serif"; ctx.textAlign="center";
      ctx.fillText(barMin>=10?barMin+"′":(barMin*60)+"″", cx, y+16);
      drawEyeDust(ctx, cx, cy, r, w, L.eyeTwist);
    }
    const vg=ctx.createRadialGradient(cx,cy,r*.72,cx,cy,r);
    if(L.sky==="day" && sky==="day"){ vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(20,40,60,.18)"); }
    else if(L.sky==="dusk"||L.sky==="dawn"){ vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.28)"); }
    else { vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.55)"); }
    ctx.fillStyle=vg; ctx.fillRect(cx-r,cy-r,r*2,r*2);
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx,cy,r,0,6.3); ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.lineWidth=Math.max(2,w*.008); ctx.stroke();
    eyeRaf=requestAnimationFrame(draw);
  };
  cancelAnimationFrame(eyeRaf); eyeRaf=requestAnimationFrame(draw);
}
function tick(){
  const L=S.lab, band=focusBand(L);
  if (!L.cap) S.missions.cap=true;
  if (L.locked) S.missions.lock=true;
  if (L.ep===25) S.missions.low=true;
  if (L.target==="moon"&&L.ep===25&&band==="in"&&!L.cap&&L.locked) S.missions.coarse=true;
  if (L.ep===10) S.missions.mid=true;
  if (L.ep===6) S.missions.short=true;
  if (L.target==="moon"&&L.ep===6&&band==="in"&&!L.cap) S.missions.fine=true;
  if (L.target==="jupiter"&&band==="in"&&!L.cap&&L.ep!==25) S.missions.jupiter=true;
  if (L.target==="orion"&&band==="in"&&!L.cap&&L.ep!==25) S.missions.orion=true;
  if (L.reticle&&L.mA&&L.mB&&L.ep!==25&&!L.cap) S.missions.measure=true;
  if (L.target==="sea"&&L.ep===6&&band==="in"&&!L.cap&&!L.barlow) S.missions.ceiling=true;
  if (L.target==="albireo"&&band==="in"&&!L.cap&&L.ep!==25&&!L.barlow) S.missions.albireo=true;
  if (L.barlow&&L.target==="pair"&&L.ep===6&&band==="in"&&!L.cap) S.missions.barlow=true;
  persist();
}
function centerTarget(id){
  const spots={moon:[0,0],sea:[6.4,0.8],jupiter:[0,0],saturn:[0,0],orion:[0,0],pleiades:[0,0],albireo:[0,0],pair:[0,0],sun:[0,0]};
  const p=spots[id]||[0,0];
  S.lab.panX=-p[0]; S.lab.panY=-p[1]; S.lab.mA=S.lab.mB=null;
}
function paint(){
  cancelAnimationFrame(eyeRaf);
  const h=(location.hash||"#home").replace("#","");
  S.page=h==="lab"?"lab":"home";
  document.documentElement.lang=S.lang;
  document.documentElement.setAttribute("data-theme", S.theme);
  document.documentElement.classList.toggle("dark", S.theme==="dark");
  document.getElementById("brand").textContent=t("app");
  { const k=document.getElementById("mastK"), h=document.getElementById("mastH"), l=document.getElementById("mastL"); if(k) k.textContent=t("eyebrow"); if(h) h.textContent=t("app"); if(l) l.textContent=t("tag"); }
  document.getElementById("langBtn").textContent=S.lang==="es"?"EN":"ES";
  document.getElementById("themeBtn").textContent=S.theme==="dark"?t("light"):t("dark");
  document.getElementById("foot").textContent=t("foot");
  document.getElementById("nav").innerHTML=[["home","home"],["lab","lab"]].map(([id,k])=>`<a href="#${id}" class="${S.page===id?"on":""}">${t(k)}</a>`).join("");
  const view=document.getElementById("view");
  view.innerHTML=S.page==="lab"?pageLab():pageHome();
  if (S.page!=="lab") return;
  startEye(); tick();
  view.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.getAttribute("data-act"), L=S.lab, step=benchStep();
    if (a==="teach-lock"){ S.teacher="locked"; persist(); paint(); return; }
    if (a==="teach-open"){ S.teacher="open"; persist(); paint(); return; }
    const locked=(a==="ep10"||a==="ep6")&&step<1
      || (a==="tg-jupiter"||a==="tg-saturn"||a==="tg-orion"||a==="tg-pleiades")&&step<2
      || (a==="ret1"||a==="meas1")&&step<3
      || a==="tg-sea"&&step<4
      || (a==="tg-albireo"||a==="tg-pair"||a==="bar1")&&step<5;
    if (locked) return;
    if (a==="cap1") L.cap=true;
    if (a==="cap0"){ if(!(L.target==="sun" && !L.filter)) L.cap=false; }
    if (a==="filt0"){ L.filter=false; if(L.target==="sun") L.cap=true; }
    if (a==="filt1"){ L.filter=true; L.cap=false; L.sky="day"; L.coarse=L.ep===25?42:L.ep===10?58:72; L.fine=50; }
    if (a==="lock1") L.locked=true;
    if (a==="lock0") L.locked=false;
    if (a==="ep25"){ L.ep=25; L.barlow=false; }
    if (a==="ep10"){ L.ep=10; }
    if (a==="ep6"){ L.ep=6; }
    if (a==="bar1") L.barlow=true;
    if (a==="bar0") L.barlow=false;
    if (a==="ret1") L.reticle=true;
    if (a==="ret0") L.reticle=false;
    if (a==="meas1"){ L.measure=!L.measure; L.reticle=L.measure||L.reticle; if(!L.measure){L.mA=L.mB=null;} }
    if (a.startsWith("tg-")){ L.target=a.slice(3); centerTarget(L.target); if(L.target==="sun" && !L.filter) L.cap=true; }
    if (a.startsWith("sky-")) L.sky=a.slice(4);
    tick(); paint();
  });
  view.querySelectorAll("[data-knob]").forEach(inp=>{
    inp.oninput=()=>{
      const L=S.lab, k=inp.getAttribute("data-knob");
      L[k]=+inp.value;
      const lab=inp.closest("label"); const b=lab&&lab.querySelector("b"); if(b) b.textContent=k==="eyeTwist"?Math.round(L[k]/100*360)+"°":Math.round(L[k]);
      const band=focusBand(L);
      const fl=band==="in"?t("focusIn"):band==="near"?t("focusNear"):t("focusOut");
      const span=document.querySelector(".readout span:last-child"); if(span && !L.cap) span.textContent=fl;
      document.querySelectorAll(".fieldnote").forEach(el=>{ el.textContent=fieldNote(); });
      tick();
    };
    inp.onchange=()=>{ if(stairNow()!==S.lastStair) paint(); };
  });
  S.lastStair=stairNow();
}
document.getElementById("langBtn").onclick=()=>{ S.lang=S.lang==="en"?"es":"en"; persist(); paint(); };
document.getElementById("themeBtn").onclick=()=>{ S.theme=S.theme==="dark"?"light":"dark"; persist(); paint(); };
window.addEventListener("hashchange", paint);
paint();
</script>
<script>
/* AOG-SCIPIC-PANEL-V1 - the guide loads only when the bar is opened, and the frame is
   grown to its content so the panel scrolls with the page instead of inside itself. */
(function(){
  var d=document.getElementById("pgPanel"); if(!d) return;
  var f=document.getElementById("pgFrame"); if(!f) return;
  function fit(){
    try{ var b=f.contentDocument&&f.contentDocument.body;
         if(b){ var h=b.scrollHeight; if(h>240) f.style.height=(h+28)+"px"; } }catch(e){}
  }
  d.addEventListener("toggle", function(){
    if(d.open && !f.getAttribute("src")) f.setAttribute("src", f.getAttribute("data-src"));
  });
  f.addEventListener("load", function(){ fit(); setTimeout(fit,250); setTimeout(fit,1200); });
  var t; window.addEventListener("resize", function(){ clearTimeout(t); t=setTimeout(fit,150); });
})();
</script>
