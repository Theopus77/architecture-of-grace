<title>The Telescope — Architecture of Grace</title>
<meta name="description" content="A 90 mm brass refractor with a working eyepiece. The Moon, Jupiter, a double star — and the landing sea, where the lander is smaller than the air.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;600;700&display=optional" rel="stylesheet">
<style>
:root {
  --bg:#f4f0e6; --card:#fffcf7; --ink:#1a232c; --muted:#5c6670; --line:#ddd8cc;
  --steel:#2f5c6b; --steel-fg:#f4f8f9; --steel-soft:#e3eef2;
  --good:#2c7a4e; --good-soft:#e3f0e8; --bad:#9c3a2e; --bad-fg:#fdf6f4; --bad-soft:#f6e5e2;
  --chip:#efebe3; --shadow:0 1px 3px rgb(26 35 44 / .08);
  --sans:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  --display:"Fraunces", Georgia, serif;
}
.dark, [data-theme="dark"] {
  --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
  --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
  --good:#6fbf8b; --good-soft:#1f3327; --bad:#e08573; --bad-fg:#14181e; --bad-soft:#3a2622;
  --chip:#2a313c;
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.55 var(--sans); overflow-x:hidden; }
h1,h2,h3 { font-family:var(--display); font-weight:600; letter-spacing:-.02em; text-wrap:balance; }
h1 { font-size:clamp(1.5rem,4vw,2.3rem); margin:.2rem 0 .4rem; }
a { color:inherit; }
button { font:inherit; cursor:pointer; }
button, a { touch-action:manipulation; }
.wrap { max-width:1080px; margin:0 auto; padding:max(1.1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(3rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
body:has(.aogtop) header .tools { display:none; }
.brand { font-size:.75rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-decoration:none; min-height:44px; display:inline-flex; align-items:center; }
.tools { display:flex; gap:.5rem; }
.pill, .btn { min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .9rem; font-weight:600; font-size:.9rem; display:inline-flex; align-items:center; justify-content:center; }
.btn-steel { background:var(--steel); color:var(--steel-fg); border-color:transparent; }
.btn-bad { background:var(--bad); color:var(--bad-fg); border-color:transparent; }
.nav { display:flex; gap:4px; overflow-x:auto; border-bottom:2px solid var(--line); margin-bottom:1rem; }
.nav a { min-height:44px; display:inline-flex; align-items:center; padding:0 .8rem; text-decoration:none; color:var(--muted); font-weight:600; border-bottom:2px solid transparent; margin-bottom:-2px; }
.nav a.on { color:var(--ink); border-color:var(--steel); }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:.75rem; margin-bottom:1rem; }
.kicker { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); }
.muted, .note-line { color:var(--muted); }
.lead { max-width:62ch; color:var(--muted); }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
.tiny { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); }
.ok { color:var(--good); }
.lab-grid { display:grid; gap:1.1rem; margin-top:.6rem; align-items:start; }
.eye-box { background:color-mix(in oklab, var(--ink) 94%, black); border-radius:16px; padding:.75rem; }
.eye-wrap { position:relative; margin:0 auto; width:100%; max-width:min(520px, 52dvh); aspect-ratio:1; touch-action:none; user-select:none; -webkit-user-select:none; }
.eye-wrap canvas { width:100%; height:100%; border-radius:50%; display:block; }
.eye-hud { position:absolute; left:50%; bottom:8%; transform:translateX(-50%); color:#f4efe4; font:700 12px/1.2 var(--sans); text-shadow:0 1px 3px #000; pointer-events:none; white-space:nowrap; }
.readout { display:flex; justify-content:space-between; gap:.5rem; color:color-mix(in oklab, var(--steel-fg) 82%, transparent); font-size:.9rem; margin-top:.45rem; font-variant-numeric:tabular-nums; }
.phone-bar, .desk-bar, .board { display:flex; flex-direction:column; gap:.15rem; }
.desk-bar { display:none; }
.board, .phone-bar { padding:.8rem .9rem; }
.row { display:flex; justify-content:space-between; align-items:center; gap:.4rem; padding:.28rem 0; border-bottom:1px solid var(--line); }
.row > span:last-child { display:flex; flex-wrap:wrap; gap:.35rem; justify-content:flex-end; }
/* AOG-TELE-REALSKY-V2: the target and sky rows are drop-downs (site rule). The menu carries the row's label. */
.row:has(> .aogdd) > .tiny { display:none; }
.row > .aogdd { margin:0; flex:1 1 auto; }
.row > .aogdd .aogdd-sel { flex:1 1 160px; min-width:0; }
.lookfor { margin:.2rem 0 .3rem; font-size:.9rem; }
.board .btn, .phone-bar .btn { min-height:40px; padding:0 .7rem; font-size:.85rem; }
.knobs { display:grid; gap:.4rem; margin-top:.8rem; }
@media (min-width:640px){ .knobs { grid-template-columns:1fr 1fr; } }
label.knob span { display:flex; justify-content:space-between; font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.scope-knob { -webkit-appearance:none; appearance:none; width:100%; height:40px; background:transparent; margin:0; }
.scope-knob::-webkit-slider-runnable-track { height:8px; border-radius:999px; background:var(--chip); }
.scope-knob::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; margin-top:-9px; border-radius:99px; background:var(--steel); border:2px solid var(--card); }
.stair { list-style:none; margin:.4rem 0 0; padding:0; display:flex; flex-direction:column; gap:.4rem; }
.stair > li { border:1px solid var(--line); border-radius:10px; padding:.5rem .7rem; }
.stair > li.now { border-color:var(--steel); background:var(--steel-soft); }
.stair > li.later { opacity:.62; }
.stair > li.done { display:flex; align-items:baseline; gap:.55rem; padding:.38rem .7rem; }
.stair > li.done h3 { margin:0; font-size:.95rem; }
.stair .mk { margin:0; font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); }
.stair h3 { margin:.05rem 0 .15rem; font-size:1.02rem; }
.stair ol { list-style:none; margin:.2rem 0 0; padding:0; }
.stair li.step { display:flex; gap:.45rem; padding:.14rem 0; font-size:.88rem; }
.do { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.5rem; }
.practical-box { margin-top:1rem; padding:1rem 1.05rem; }
.warn { margin-top:.7rem; padding:.8rem 1rem; background:var(--bad-soft); border-radius:12px; }
.lab-stack { display:flex; flex-direction:column; }
@media (max-width:767px){
  .lab-stack .lab-grid { order:1; }
  .lab-stack .phone-bar { order:2; margin-top:.7rem; }
  .lab-stack .practical-box { order:3; }
}
@media (min-width:768px){
  .phone-bar { display:none !important; }
  .desk-bar { display:flex; }
  .lab-grid { grid-template-columns:minmax(0,1fr) minmax(300px,380px); }
  .eye-stick { position:sticky; top:12px; }
  .board .btn { min-height:36px; }
}
.home-grid { display:grid; gap:1rem; margin-top:1rem; }
@media (min-width:800px){ .home-grid { grid-template-columns:280px 1fr; align-items:center; } }
svg.scope { width:100%; height:auto; }
.grid-home { display:grid; gap:1rem; margin-top:.5rem; }
.cards { display:grid; gap:.75rem; align-content:start; }
.act { display:block; padding:1.1rem 1.2rem; text-decoration:none; color:inherit; }
.act:hover { border-color:var(--steel); }
.badge { display:inline-flex; align-items:center; background:var(--steel-soft); color:var(--steel); border-radius:999px; padding:.15rem .5rem; font-size:.75rem; font-weight:700; }
@media (min-width:768px){ .grid-home { grid-template-columns: minmax(0,300px) minmax(0,1fr); align-items:start; } }

/* AOG-SCIPIC-PANEL-V1 (2026-09-23) - Jimmy: "Can the Microscope missions and the TELESCOPE
   Missions get their own walk throughs like the TURN tables and sp-1200 just recieved?
   Embedded as something they could be printed out?" Same panel as AOG-PGPANEL-V1 on the
   decks: the guide is an iframe of its own file, loaded on first open, never printed here. */
.pg{margin:1.4rem 0 0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.pg>summary{list-style:none;cursor:pointer;padding:.8rem 1rem;display:flex;align-items:center;gap:.7rem;
  font-weight:700;font-size:.98rem;min-height:44px}
.pg>summary::-webkit-details-marker{display:none}
.pg>summary::marker{content:""}
.pg .chev{flex:0 0 auto;transition:transform .15s ease;color:var(--muted);font-size:.9rem}
.pg[open] .chev{transform:rotate(90deg)}
.pg .pgsub{font-weight:400;color:var(--muted);font-size:.86rem;margin-left:auto;text-align:right}
.pg .pgbody{border-top:1px solid var(--line)}
.pg iframe{display:block;width:100%;border:0;min-height:60vh;background:var(--bg)}
.pg .pgfoot{padding:.65rem 1rem;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted);margin:0}
.pg .pgfoot a{color:inherit;font-weight:700}
@media print{ .pg{display:none !important} }

/* AOG-BENCH-TOP-V1: the masthead, nav row, bench switch and Lessons card live in /aog-bench.css */
/* ══ AOG-SCOPE-LESSONS-V1 (2026-09-27) — Jimmy: "The missions should be called the lessons and mimic the
   beautiful set up that THE DRUM MACHINE LESSON HAS." Same cards as the drum machine's Lessons view. ══ */
.lesson-box{padding:.9rem 1rem 1rem;margin:1rem 0 .4rem}
.lesson-box h3{margin:.05rem 0 .15rem;font-size:1.15rem}
.lesson-pick{display:grid;gap:.3rem;margin:0 0 .7rem}
.lesson-pick span{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lesson-pick select{min-height:48px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 .75rem;max-width:100%;width:100%}
.lsteps{list-style:none;margin:.3rem 0 0;padding:0}
.lsteps li{display:flex;gap:.5rem;align-items:flex-start;padding:.22rem 0;font-size:.95rem}
.lsteps li .tick{flex:0 0 auto;width:1.25rem;height:1.25rem;border-radius:99px;border:1px solid var(--line);text-align:center;line-height:1.15rem;font-size:.8rem;color:var(--good);margin-top:.1rem}
.lsteps li.ok .tick{border-color:var(--good);background:var(--good-soft)}
.lsteps li.ok s{color:var(--muted)}
.lesson-acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem;align-items:center}
.lesson-acts .pill{text-decoration:none}
.lesson-acts .note-line{flex-basis:100%;margin:.2rem 0 0}
.ok-line{color:var(--good);font-weight:700;margin:.7rem 0 0}
.lessons-wrap{display:grid;gap:1rem;grid-template-columns:1fr}
.lessons-wrap.lessons-one{grid-template-columns:1fr!important}
@media (min-width:820px){.lessons-wrap{grid-template-columns:1fr 1fr;align-items:start}}
.ladder-box{padding:.9rem 1rem 1rem;margin:1rem 0 .4rem}
.ladder{list-style:none;margin:.4rem 0 0;padding:0;display:flex;flex-direction:column;gap:.3rem}
.ladder li{border:1px solid var(--line);border-radius:10px;padding:.45rem .7rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;min-height:44px;cursor:pointer}
.ladder li:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.ladder li.later .lt{color:var(--muted)}
.ladder li.done .mk{color:var(--good)}
.ladder li.picked{border-color:var(--steel);background:var(--steel-soft)}
.ladder .mk{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);min-width:5.6rem}
.ladder .lt{font-weight:600}
.lab-lesson{margin-top:1rem}
</style>

/* ── SATURN ── the globe inside the rings: the bright B ring, the Cassini Division, the dusky C ring,

function bakeSaturn(){
  const N=820, cx=N/2, cy=N/2, SPAN=0.58, open=0.25;
  const pxPer=(N/2)/SPAN;

    const n=vnoise(rho*80, 2)-0.5;
    if(rho<0.115||rho>0.435) return 0;
    if(rho<0.168) return 0.16+0.06*n;                 /* C ring, the crepe ring */
    if(rho<0.255) return 0.86+0.06*n;                 /* B ring, the bright one */
    if(rho<0.272) return 0.22+0.06*n;                 /* Cassini Division */
    if(rho<0.40) return (0.66-(rho-0.272)*0.55)+0.05*n;  /* A ring */
    return 0.14;

    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const ax=(x-cx)/(N/2)*SPAN, ay=(y-cy)/(N/2)*SPAN;
      const rho=Math.hypot(ax, ay/open);
      const ge=(ax*ax)/(0.158*0.158)+(ay*ay)/(0.142*0.142);
      const o=(y*N+x)*4;
      const front=ay>-0.004;

        let I=ringI(rho);

        if(lat<-0.62) { I*=0.9; }

        const rs=Math.hypot(ax,ay/open);

        if(front){ const rI=ringPx(); if(rI>0){ const a=Math.min(1,rI*1.35); R=R*(1-a)+222*rI*a; G=G*(1-a)+204*rI*a; B=B*(1-a)+172*rI*a; } }

      }

/* ── ORION ── M42 as the eye sees it in a 90 mm: a bright fan around the Trapezium, the dark bay
   (the "fish's mouth") cutting in from the north-east, two wings sweeping out like a bat, M43 as a
   comma to the north with its own star, and a faint outer loop. Grey-green: the eye has no colour
   at these light levels. */
function bakeOrion(){
  const N=760, SPAN=26;
  const blob=(ax,ay,x0,y0,rx,ry,rot)=>{ const c=Math.cos(rot),s=Math.sin(rot),dx=ax-x0,dy=ay-y0,lx=dx*c-dy*s,ly=dx*s+dy*c; return Math.exp(-((lx*lx)/(rx*rx)+(ly*ly)/(ry*ry))); };
  return bakeCanvas(N,data=>{
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){
      const ax=(x-N/2)/(N/2)*SPAN, ay=(y-N/2)/(N/2)*SPAN;
      let v=0.70*blob(ax,ay,-0.6,0.9,2.4,1.7,-0.5);
      v+=0.55*blob(ax,ay,-1.2,2.2,5.5,3.2,-0.3);
      v+=0.32*blob(ax,ay,-6.5,7.5,7.5,3.4,-0.75);
      v+=0.28*blob(ax,ay,5.8,6.2,6.0,3.2,0.65);
      v+=0.12*blob(ax,ay,-10,14,7,4,-0.6);
      v+=0.10*blob(ax,ay,10,12,6,4,0.6);
      v+=0.07*blob(ax,ay,0,6,15,10,0);
      v+=0.42*blob(ax,ay,1.8,-6.8,2.4,2.9,0.2);
      v+=0.16*blob(ax,ay,2.6,-9.5,2.2,3.2,0.4);
      const bay=blob(ax,ay,2.6,-1.4,3.2,1.5,0.55)+0.5*blob(ax,ay,5.5,-2.6,3.6,1.3,0.45);
      v*=1-0.92*Math.min(1,bay);
      const lane=blob(ax,ay,1.2,-4.0,5,0.7,0.35);
      v*=1-0.8*Math.min(1,lane);
      v*=0.7+0.5*fbm(ax*0.35+1, ay*0.35);
      v*=0.86+0.28*vnoise(ax*0.9+ay*0.5, ay*0.8);
      v*=0.82+0.36*fbm(ax*2.2+5, ay*2.2);
      v=Math.max(0,v);
      const o=(y*N+x)*4;
      const t=Math.min(1,v);
      data[o]=146+40*t; data[o+1]=168+46*t; data[o+2]=156+40*t; data[o+3]=Math.min(175, v*170);
    }
  });
}

function bakeAndromeda(){

    for(let y=0;y<N;y++) for(let x=0;x<N;x++){

      const lx=ax*ca-ay*sa, ly=ax*sa+ay*ca;

      const m32=Math.hypot(ax-0.4, ay-24)/1.6; v+=0.9*Math.exp(-m32*m32)+0.25*Math.exp(-m32*.7);
      const m110=Math.hypot((ax+26.7)/2.6,(ay+25)/5.2); v+=0.28*Math.exp(-m110*m110*.6);
      const o=(y*N+x)*4, t=Math.min(1,v);

/* ── THE RING NEBULA ── M57: a small smoke ring, 1.4′ by 1′, brighter along the long sides. */
function bakeRing(){

/* ── M13 ── the great globular in Hercules: a ball of stars whose middle stays a glow and whose edge

/* ── THE SUN ── only through the filter on the front: white light, limb darkening, granulation as far
   as 90 mm can hint at it, spot groups with umbra and penumbra, pores, faculae near the edge. */
function bakeSun(){
  const N=1400, cx=N/2, cy=N/2, R=N*0.5-2, RAD=16;
  const toP=(ax,ay)=>[cx+(ax/RAD)*R, cy+(ay/RAD)*R];
  const groups=[
    {x:-4.6,y:1.15,ang:.42,a:1.55,b:.92, um:[{dx:-.38,dy:.08,r:.48},{dx:.18,dy:-.06,r:.3},{dx:.55,dy:.14,r:.16}]},
    {x:6.1,y:-3.1,ang:-.55,a:1.05,b:.62, um:[{dx:-.16,dy:.04,r:.34},{dx:.32,dy:-.02,r:.16}]},
    {x:1.4,y:6.4,ang:.2,a:.62,b:.4, um:[{dx:0,dy:0,r:.22}]},
    {x:-8.6,y:-3.8,ang:1.05,a:.95,b:.34, um:[{dx:.08,dy:0,r:.18}]},
    {x:10.2,y:2.4,ang:1.15,a:.7,b:.24, um:[{dx:0,dy:0,r:.12}]}
  ];
  const pores=[[-2.2,-5.6,.13],[3.1,-6.4,.09],[-6.4,4.2,.1],[8.1,5.2,.08],[.4,-2.8,.07],[-1.1,3.8,.08]];
  groups.forEach(g=>{
    const p=toP(g.x,g.y); g.px=p[0]; g.py=p[1]; g.A=g.a/RAD*R; g.B=g.b/RAD*R;
    g.um.forEach(u=>{ const q=toP(g.x+u.dx,g.y+u.dy); u.px=q[0]; u.py=q[1]; u.pr=u.r/RAD*R; });
  });
  const poreP=pores.map(([x,y,r])=>{ const p=toP(x,y); return {px:p[0],py:p[1],pr:r/RAD*R}; });
  return bakeCanvas(N,data=>{
    for(let y=1;y<N-1;y++) for(let x=1;x<N-1;x++){
      const dx=x-cx, dy=y-cy, rr=dx*dx+dy*dy, o=(y*N+x)*4;
      if(rr>R*R) continue;
      const mu=Math.sqrt(1-rr/(R*R));
      const cells=(function(){
        const sc=2.6, gx=x/sc, gy=y/sc, ix=Math.floor(gx), iy=Math.floor(gy);
        let best=8;
        for(let oy=-1;oy<=1;oy++) for(let ox=-1;ox<=1;ox++){
          const cx0=ix+ox, cy0=iy+oy;
          const jx=cx0+hsh(cx0,cy0), jy=cy0+hsh(cy0,cx0+19);
          const ddx=gx-jx, ddy=gy-jy, d=ddx*ddx+ddy*ddy;
          if(d<best) best=d;
        }
        return Math.sqrt(best);
      })();
      const grain=1+((0.42-cells)*.07+(vnoise(x/14,y/14)-.5)*.03)*Math.pow(mu,.75);
      let I=(0.38+0.62*Math.pow(mu,.5))*grain;
      if(mu<0.45 && vnoise(x/22,y/22)>0.66 && vnoise(x/9,y/9)>0.4) I*=1.14;
      let kind=0, fil=1;
      for(const g of groups){
        const c=Math.cos(-g.ang), s=Math.sin(-g.ang);
        const lx=((x-g.px)*c-(y-g.py)*s)/g.A, ly=((x-g.px)*s+(y-g.py)*c)/g.B;
        const e=lx*lx+ly*ly;
        if(e>1) continue;
        let best=1e9, bang=0;
        for(const u of g.um){
          const d=Math.hypot(x-u.px,y-u.py);
          const wob=0.82+0.22*vnoise(x/6,y/6);
          if(d<u.pr*wob) kind=2;
          if(d<best){ best=d; bang=Math.atan2(y-u.py,x-u.px); }
        }
        if(kind<2){
          kind=1;
          fil=0.42+0.58*(0.5+0.5*Math.sin(bang*18+e*6));
          fil*=0.72+0.28*Math.sqrt(e);
        }
        break;
      }
      if(!kind){
        for(const p of poreP){ if(Math.hypot(x-p.px,y-p.py)<p.pr){ kind=2; break; } }
      }
      let r,gc,b;
      if(kind===2){
        const uI=0.07+0.04*vnoise(x/4,y/4);
        r=uI*80; gc=uI*62; b=uI*48;
      } else if(kind===1){
        const pI=I*(0.22+0.28*fil);
        r=pI*210; gc=pI*150; b=pI*110;
      } else {
        const edge=Math.pow(1-mu,3.2);
        r=Math.min(255,I*255*(1-edge*.04));
        gc=Math.min(255,I*250*(1-edge*.1));
        b=Math.min(255,I*242*(1-edge*.22));
      }
      data[o]=r; data[o+1]=gc; data[o+2]=b; data[o+3]=255;
    }
  });
}

    if (L.target==="pleiades") return say(
      "The Pleiades, out of focus. Each star is a smear instead of a point. There is no surface to find. Only the focus.",
      "Las Pléyades, fuera de foco. Cada estrella es una mancha en vez de un punto. No hay superficie que encontrar. Solo el foco.");
    if (L.target==="sun") return say(
      "The Sun is in the glass and soft. Even with the filter on, the disk has to be focused. Coarse, then fine. The spots appear when the edge is sharp.",
      "El Sol está en el vidrio y está blando. Aunque el filtro esté puesto, el disco hay que enfocarlo. Macrométrico, luego micrométrico. Las manchas aparecen cuando el borde está nítido.");
    return say(
      "Out of focus. The object is in the glass. The coarse knob finds it. The fine knob finishes it.",
      "Fuera de foco. El objeto está en el vidrio. El macrométrico lo encuentra. El micrométrico lo termina.");
  }
  const almost=band==="near" ? say(" Almost.", " Casi.") : "";
  if (L.target==="moon" && L.ep===25) return say(
    "The whole Moon, 31′ across. Dark seas, bright highlands, and a terminator on the left where the shadows start. A star diagonal flips left and right. The Moon is not broken."+almost,
    "La Luna entera, 31′ de ancho. Mares oscuros, tierras altas brillantes, y un terminador a la izquierda donde empiezan las sombras. Un diagonal de estrella invierte izquierda y derecha. La Luna no está rota."+almost);
  if (L.target==="moon" && m>=140) return say(
    `The terminator at ${m}×. Long shadows fall away from the Sun. A few peaks on the night side are still lit. The floors past that line are black. The lander is not one of them.`+almost,
    `El terminador a ${m}×. Sombras largas se alejan del Sol. Unos picos del lado de noche siguen encendidos. Los fondos más allá de esa línea están negros. El módulo no es uno de ellos.`+almost);
  if (L.target==="moon") return say(
    `Part of the Moon at ${m}×. It no longer fits. Along the terminator the shadows are mountains, not ink.`+almost,
    `Una parte de la Luna a ${m}×. Ya no cabe. En el terminador las sombras son montañas, no tinta.`+almost);
  if (L.target==="jupiter" && m>=140) return say(
    `Jupiter at ${m}×. The disk is about 42″ across. Two brown belts, ragged, with a pale zone between them. A salmon oval sits in a bay of the southern belt — the Great Red Spot. The sharp black dot on the disk is a moon's shadow. The four points are moons, minutes away from the disk. A poster crops them out.`+almost,
    `Júpiter a ${m}×. El disco mide unos 42″. Dos cinturones marrones, irregulares, con una zona pálida entre ellos. Un óvalo asalmonado queda en una bahía del cinturón sur — la Gran Mancha Roja. El punto negro nítido sobre el disco es la sombra de una luna. Los cuatro puntos son lunas, a minutos del disco. Un póster las recorta.`+almost);
  if (L.target==="jupiter" && m>=80) return say(
    `Jupiter at ${m}×. The stripes and the red spot are on the disk. The points are moons, not part of the planet.`+almost,
    `Júpiter a ${m}×. Las franjas y la mancha roja están en el disco. Los puntos son lunas, no parte del planeta.`+almost);
  if (L.target==="jupiter") return say(
    "Jupiter at low power. A striped bead, and moons in the same field. The stripes are a hint. The 6 mm is where they become belts."+almost,
    "Júpiter a bajo aumento. Una cuenta rayada, y lunas en el mismo campo. Las franjas son una pista. El de 6 mm es donde se vuelven cinturones."+almost);
  if (L.target==="saturn") return say(
    `Saturn at ${m}×. The globe sits inside the rings. The B ring is the bright one. The darker tone between them is Cassini — 0.7″ wide. This lens splits 1.3″, so you see a shade, not a gap. The globe throws a small shadow on the rings.`+almost,
    `Saturno a ${m}×. El globo queda dentro de los anillos. El anillo B es el brillante. El tono más oscuro entre ellos es Cassini — 0.7″ de ancho. Este lente separa 1.3″, así que ves una sombra, no una raja. El globo proyecta una sombra pequeña sobre los anillos.`+almost);
  if (L.target==="orion") {
    if (m>=140) return say(
      `Orion's sword at ${m}×. The cloud is gray-green. In its middle, four stars — the Trapezium. A 90 mm splits them. The pink in the photographs is a camera.`+almost,
      `La espada de Orión a ${m}×. La nube es gris verdosa. En su centro, cuatro estrellas — el Trapecio. Un 90 mm las separa. El rosa de las fotos es una cámara.`+almost);
    if (m>=80) return say(
      `The sword at ${m}×. A gray-green cloud with a bright core. The four stars in that core are not split yet. The 6 mm is the one that separates them.`+almost,
      `La espada a ${m}×. Una nube gris verdosa con un núcleo brillante. Las cuatro estrellas de ese núcleo aún no se separan. El de 6 mm es el que las separa.`+almost);
    return say(
      "The sword of Orion. A gray-green cloud and a chain of stars running through it. The belt does not fit in this glass."+almost,
      "La espada de Orión. Una nube gris verdosa y una cadena de estrellas que la atraviesa. El cinturón no cabe en este vidrio."+almost);
  }
  if (L.target==="pleiades") return m<50
    ? say("The Pleiades in one field. Alcyone is the bright one. The sisters spread to the edge of the glass; drag a little to bring Atlas in. The veil on Merope is a whisper. A poster would have made it a cloud."+almost,
        "Las Pléyades en un campo. Alcyone es la brillante. Las hermanas llegan hasta el borde del vidrio; arrastra un poco para traer a Atlas. El velo de Mérope es un susurro. Un póster lo habría vuelto una nube."+almost)
    : say(`The Pleiades at ${m}×. You left most of them outside the glass. A cluster is a low-power object. What remains are a few points and, if you are still on Merope, a faint veil.`+almost,
        `Las Pléyades a ${m}×. Dejaste a la mayoría afuera del vidrio. Un cúmulo es un objeto de bajo aumento. Lo que queda son unos puntos y, si sigues en Mérope, un velo tenue.`+almost);
  if (L.target==="sea") return say(
    "The sea where they landed. A dark plain and a few small craters. The lander is about 0.002″. This lens splits 1.3″. There is nothing else to find."+almost,
    "El mar donde alunizaron. Una llanura oscura y unos cráteres pequeños. El módulo mide unos 0.002″. Este lente separa 1.3″. No hay nada más que buscar."+almost);
  if (L.target==="albireo") return say(
    "Albireo. Two stars, 34″ apart. One gold, one blue. This lens can split this pair. The colors are the stars, not a filter."+almost,
    "Albireo. Dos estrellas, a 34″. Una de oro, una azul. Este lente sí separa este par. Los colores son de las estrellas, no de un filtro."+almost);
  if (L.target==="sun" && m>=80) return say(
    `Inside the disk at ${m}×. The black is the umbra. The gray fringe is the penumbra. The mottling is as close as 90 mm gets to granulation — the rice grain is about 1″, and this lens splits 1.3″. The red flames are still not here.`+almost,
    `Dentro del disco a ${m}×. Lo negro es la umbra. El fleco gris es la penumbra. El moteado es lo más cerca que un 90 mm llega a la granulación — el grano de arroz mide cerca de 1″, y este lente separa 1.3″. Las llamas rojas siguen sin estar.`+almost);
  if (L.target==="sun") return say(
    `The Sun at ${m}×. White, not orange. The edge is dimmer because you are looking through more of the Sun, not because it is a ball. Each group has a black center and a gray fringe. The specks with no fringe are pores. Bright patches near the edge are faculae.`+almost,
    `El Sol a ${m}×. Blanco, no naranja. El borde es más tenue porque miras a través de más Sol, no porque sea una bola. Cada grupo tiene un centro negro y un fleco gris. Las motas sin fleco son poros. Las manchas brillantes cerca del borde son fáculas.`+almost);
  if (L.target==="pair") return say(
    `One smear, not two stars. The pair is 1.0″ apart. A 90 mm lens splits ${SCOPE.dawes.toFixed(1)}″. ${L.barlow?"The Barlow has you near 300×. The useful ceiling is about 180×. You are magnifying the air.":"Making it larger does not split them. Neither will the Barlow."}`+almost,
    `Una mancha, no dos estrellas. El par está a 1.0″. Un lente de 90 mm separa ${SCOPE.dawes.toFixed(1)}″. ${L.barlow?"El Barlow te pone cerca de 300×. El techo útil es unos 180×. Estás aumentando el aire.":"Hacerlo más grande no los separa. El Barlow tampoco."}`+almost);
  if (L.target==="split") return m>=140
    ? (L.barlow
      ? say(`Two points with dark between them at ${m}×. They are 2.4″ apart. This lens splits ${SCOPE.dawes.toFixed(1)}″, so this pair is within reach, and here the Barlow earns its place.`+almost,
            `Dos puntos con oscuridad entre ellos a ${m}×. Están a 2.4″. Este lente separa ${SCOPE.dawes.toFixed(1)}″, así que este par está a su alcance, y aquí el Barlow sí se gana su lugar.`+almost)
      : say(`Two points just touching at ${m}×, a notch of dark between them. They are 2.4″ apart. This lens splits ${SCOPE.dawes.toFixed(1)}″. The Barlow puts dark between them.`+almost,
            `Dos puntos que apenas se tocan a ${m}×, con una muesca entre ellos. Están a 2.4″. Este lente separa ${SCOPE.dawes.toFixed(1)}″. El Barlow pone oscuridad entre ellos.`+almost))
    : say(`A stretched dot at ${m}×. The pair is 2.4″ apart. The 6 mm is the one that splits it.`+almost,
          `Un punto estirado a ${m}×. El par está a 2.4″. El de 6 mm es el que lo separa.`+almost);
  if (L.target==="mizar") return say(
    `Mizar at ${m}×. Two white stars 14″ apart. Easy. The star off to the side is Alcor. People with sharp eyes see Alcor without a telescope; Mizar's twin needs one.`+almost,
    `Mizar a ${m}×. Dos estrellas blancas a 14″. Fácil. La estrella a un lado es Alcor. Quien tiene buena vista ve Alcor sin telescopio; la gemela de Mizar lo necesita.`+almost);
  if (L.target==="mars") return m>=80
    ? say(`Mars at ${m}×. A small orange disk, ${L.barlow?"soft in the Barlow":"steady"}. The white at the top is the polar cap. The dark wedge is Syrtis Major. One edge is a little flat: Mars is not quite full from here.`+almost,
          `Marte a ${m}×. Un disco naranja pequeño. Lo blanco de arriba es el casquete polar. La cuña oscura es Syrtis Major. Un borde queda un poco plano: desde aquí Marte no está lleno.`+almost)
    : say("Mars at low power. An orange dot with an edge. The 10 mm or the 6 mm turns it into a disk with a white cap."+almost,
          "Marte a bajo aumento. Un punto naranja con borde. El de 10 o el de 6 mm lo vuelve un disco con casquete blanco."+almost);
  if (L.target==="venus") return say(
    `Venus at ${m}×. A bright crescent, like a tiny Moon. No markings: you are looking at cloud tops. It is so bright it flares in the glass.`+almost,
    `Venus a ${m}×. Una luna creciente brillante, como una Luna diminuta. Sin marcas: miras la cima de las nubes. Es tan brillante que deslumbra en el vidrio.`+almost);
  if (L.target==="andromeda") return m<50
    ? say("The Andromeda Galaxy. A soft oval glow with a brighter middle, wider than the glass. The small round smudge below it is M32, a second galaxy. The light left it two and a half million years ago."+almost,
          "La galaxia de Andrómeda. Un óvalo suave de luz con el centro brillante, más ancho que el vidrio. La manchita redonda debajo es M32, otra galaxia. Su luz salió hace dos millones y medio de años."+almost)
    : say(`Andromeda at ${m}×. Only the bright middle fits now. A galaxy is a low-power object. The 25 mm shows more of it.`+almost,
          `Andrómeda a ${m}×. Ahora solo cabe el centro brillante. Una galaxia es un objeto de bajo aumento. El de 25 mm muestra más.`+almost);
  if (L.target==="ring") return m>=80
    ? say(`The Ring Nebula at ${m}×. A tiny gray smoke ring, 1′ across, with a darker hole in the middle. The star that made it is too faint for this lens.`+almost,
          `La nebulosa del Anillo a ${m}×. Un anillo de humo gris diminuto, de 1′, con un hueco más oscuro en el centro. La estrella que lo hizo es muy tenue para este lente.`+almost)
    : say("The Ring Nebula at low power. A fuzzy dot that will not focus to a point. That is the clue. The 10 mm or the 6 mm shows the ring."+almost,
          "La nebulosa del Anillo a bajo aumento. Un punto borroso que no enfoca a punto. Esa es la pista. El de 10 o el de 6 mm muestra el anillo."+almost);
  if (L.target==="m13") return m>=80
    ? say(`M13 at ${m}×. A ball of stars. The middle is still a glow; around the edge the glow breaks into single points. There are a few hundred thousand stars in there.`+almost,
          `M13 a ${m}×. Una bola de estrellas. El centro sigue siendo un resplandor; en el borde el resplandor se deshace en puntos. Hay unos cientos de miles de estrellas ahí.`+almost)
    : say("M13 at low power. A round fuzzy patch, brighter in the middle. The 10 mm starts to break the edge into stars."+almost,
          "M13 a bajo aumento. Una mancha redonda y difusa, más brillante en el centro. El de 10 mm empieza a deshacer el borde en estrellas."+almost);
  return "";
}

const STEP2_TARGETS=["jupiter","saturn","mars","venus","orion","pleiades","andromeda","m13","ring","mizar"];
function targetsFor(step){
  const list=[["moon","moon"]];
  if (step>=2) STEP2_TARGETS.forEach(id=>list.push([id,id]));
  if (step>=4) list.push(["sea","sea"]);
  if (step>=5) list.push(["albireo","albireo"],["split","split"],["pair","pair"]);
  list.push(["sun","sunName"]);
  return list;
}
function teacherRow(){
  const open=missionsOpen();
  return `<div class="row"><span class="tiny">${t("teach")}</span><span>${btn(!open,"teach-lock",t("teachLock"))}${btn(open,"teach-open",t("teachOpen"))}</span></div>
    <p class="note-line">${open?t("teachOpenNote"):t("teachLocked")}</p>`;
}
function instrumentHTML(){
  const L=S.lab, step=benchStep();
  const eps=step>=1?[25,10,6]:[25];
  const targets=targetsFor(step);
  return `
    ${teacherRow()}
    <div class="row"><span class="tiny">${t("cap")}</span><span>${btn(L.cap,"cap1",t("on"))}${btn(!L.cap,"cap0",t("off"))}</span></div>
    <div class="row"><span class="tiny">${t("mount")}</span><span>${btn(L.locked,"lock1",t("locked"))}${btn(!L.locked,"lock0",t("loose"))}</span></div>
    <div class="row"><span class="tiny">${t("eye")}</span><span>${eps.map(e=>btn(L.ep===e&&!L.barlow,"ep"+e,e+" mm")).join("")}</span></div>
    <div class="row"><span class="tiny">${t("target")}</span><span data-aog-dropdown="${STR.target.en}|${STR.target.es}">${targets.map(([id,k])=>btn(L.target===id,"tg-"+id,t(k))).join("")}</span></div>
    <p class="note-line lookfor">${lookFor()}</p>
    ${(L.target==="moon"||L.target==="sea")?`<div class="row"><span class="tiny">${t("sky")}</span><span data-aog-dropdown="${STR.sky.en}|${STR.sky.es}">${["night","dusk","day","dawn"].map(s=>btn((L.sky||"night")===s,"sky-"+s,t(s))).join("")}</span></div>`:""}
    ${L.target==="sun"?`<div class="row"><span class="tiny">${t("filter")}</span><span>${btn(!L.filter,"filt0",t("none"))}${btn(!!L.filter,"filt1",t("front"))}</span></div>`:""}
    ${step>=3?`<div class="row"><span class="tiny">${t("reticle")}</span><span>${btn(L.reticle,"ret1",t("scaleOn"))}${btn(!L.reticle,"ret0",t("scaleOff"))}${btn(L.measure,"meas1",t("measure"))}</span></div>`:""}
    ${step>=5?`<div class="row"><span class="tiny">${t("barlow")}</span><span>${btn(L.barlow,"bar1",t("barlowIn"))}${btn(!L.barlow,"bar0",t("barlowOut"))}</span></div>`:""}
    <p class="note-line fieldnote">${fieldNote()}</p>`;
}
function missionActs(i){
  const L=S.lab, es=S.lang==="es";
  if (i===0) return btn(!L.cap,"cap0",es?"Tapa fuera":"Cap off")+btn(L.locked,"lock1",t("locked"))+btn(L.ep===25,"ep25","25 mm")+btn(L.target==="moon","tg-moon",t("moon"));
  if (i===1) return btn(L.ep===10,"ep10","10 mm")+btn(L.ep===6,"ep6","6 mm")+`<p class="note-line">${t("fineHint")}</p>`;
  if (i===2) return btn(L.target==="jupiter","tg-jupiter",t("jupiter"))+btn(L.target==="orion","tg-orion",t("orion"))+btn(L.ep===10,"ep10","10 mm")+btn(L.ep===6,"ep6","6 mm");
  if (i===3) return btn(L.ep===10,"ep10","10 mm")+btn(L.reticle,"ret1",t("scaleOn"))+btn(L.measure,"meas1",t("measure"))+`<p class="note-line">${t("tap")}</p>`;
  if (i===4) return btn(L.target==="sea","tg-sea",t("sea"))+btn(L.ep===6,"ep6","6 mm");
  if (i===5) return btn(L.target==="albireo","tg-albireo",t("albireo"))+btn(L.ep===10||L.ep===6,"ep10","10 mm")+btn(L.target==="pair","tg-pair",t("pair"))+btn(L.ep===6,"ep6","6 mm")+btn(L.barlow,"bar1",t("barlowIn"))
    +`<p class="note-line">${S.lang==="es"?`Este lente separa ${SCOPE.dawes.toFixed(1)}″. El techo útil es unos ${SCOPE.useful}×.`:`This lens splits ${SCOPE.dawes.toFixed(1)}″. The useful ceiling is about ${SCOPE.useful}×.`}</p>`;
  return "";
}
function mark(id){ return S.missions[id]?"✓":""; }
function practicalCard(){ return ""; }   /* AOG-BENCH-TOP-V1: the lesson and its buttons sit in the Lessons card at the top */
/* ══ AOG-SCOPE-LESSONS-V1 (2026-09-27) — Jimmy: "The missions should be called the lessons and mimic the
   beautiful set up that THE DRUM MACHINE LESSON HAS." The drum machine's Lessons view, built on this page's
   own STAIR, STEP and S.missions (names kept so saved progress stays). The picked lesson is the shaded one. ══ */
const LPICK_KEY="aog.tele.pick";
let LPICK=null;
try{ const v=localStorage.getItem(LPICK_KEY); if(v!=null&&v!==""&&!isNaN(+v)) LPICK=+v; }catch(e){}
const LSTR={
  lessonsNav:{en:"Lessons",es:"Lecciones"},
  lessonsLead:{en:"Six lessons. Pick one, then try its steps at the eyepiece. Each step ticks itself when you do it.",es:"Seis lecciones. Elige una y prueba sus pasos en el ocular. Cada paso se marca solo cuando lo haces."},
  lessonPick:{en:"Which lesson?",es:"¿Qué lección?"},
  lessonK:{en:"Lesson",es:"Lección"},
  lessonsAll:{en:"All 6 lessons",es:"Las seis lecciones"},
  doneMark:{en:"done",es:"lista"},
  next:{en:"Next lesson",es:"Siguiente lección"},
  toLab:{en:"Try it at the eyepiece",es:"Pruébala en el ocular"},
  toHome:{en:"Back to the bench",es:"Volver a la mesa"},
  wait:{en:"Finish lesson {n} first. Each lesson opens the next.",es:"Termina primero la lección {n}. Cada lección abre la siguiente."}
};
function lt(k){ const o=LSTR[k]; return o?o[S.lang==="es"?"es":"en"]:k; }
function lessonDone(m){ return m.steps.every(id=>S.missions[id]); }
function lessonNow(){ return stairNow(); }
function lessonPicked(){ const n=lessonNow(); if(LPICK==null||LPICK<0||LPICK>=STAIR.length) return Math.min(n,STAIR.length-1); return LPICK; }
function setLessonPick(i){ LPICK=Math.max(0,Math.min(STAIR.length-1,+i||0)); try{ localStorage.setItem(LPICK_KEY,String(LPICK)); }catch(e){} }
function lessonSelect(){
  const p=lessonPicked();
  return `<label class="lesson-pick"><span>${lt("lessonPick")}</span><select id="lessonPick">${STAIR.map((m,i)=>
    `<option value="${i}"${i===p?" selected":""}>${i+1} · ${S.lang==="es"?m.es:m.en}${lessonDone(m)?" ✓":""}</option>`).join("")}</select></label>`;
}
function lessonCard(inLab){
  /* AOG-BENCH-TOP-V1 (2026-09-27): the Lessons card at the top, the same markup as the Turntables (aog-bench.css) */
  const p=lessonPicked(), m=STAIR[p], now=lessonNow(), es=S.lang==="es";
  const done=lessonDone(m), allDone=now>=STAIR.length;
  const steps=`<ol class="lsteps">${m.steps.map(id=>{ const ok=!!S.missions[id], w=es?STEP[id].es:STEP[id].en;
    return `<li class="lstep${ok?" ok":""}"><span class="lck" aria-hidden="true">${ok?"✓":""}</span><span>${w}</span></li>`; }).join("")}</ol>`;
  const waiting=(typeof missionsOpen==="function" && !missionsOpen() && p>now)?`<p class="note-line">${lt("wait").replace("{n}",now+1)}</p>`:"";
  const next=p<STAIR.length-1?`<button type="button" class="pill" data-lesson-next="1">${lt("next")} →</button>`:"";
  const acts=inLab ? (typeof missionActs==="function"?missionActs(p):"") : `<a class="pill" href="#lab">${lt("toLab")} →</a>`;
  return `<p class="mk">${lt("lessonK")} ${p+1} ${es?"de":"of"} ${STAIR.length}${done?" · ✓":""}</p>
    <h3>${es?m.es:m.en}</h3>
    <p class="lblurb">${es?m.blurb_es:m.blurb_en}</p>
    ${steps}${waiting}
    <div class="lacts${inLab?" do":""}">${acts}</div>
    ${done?`<p class="lok">${allDone?t("done"):(es?"Lección hecha.":"Lesson done.")} ${next}</p>`:""}`;
}
function paintLessonsTop(){
  const top=["home","lab","lessons"].includes(S.page);
  const sw=document.getElementById("benchSwitch"), box=document.getElementById("lessons");
  if(!sw||!box) return;
  sw.hidden=!top; box.hidden=!top; if(!top) return;
  const es=S.lang==="es", p=lessonPicked();
  const row=document.getElementById("lessonRow");
  const rowHtml=STAIR.map((m,i)=>`<button type="button" class="ghost sm${i===p?" on":""}" data-lesson="${i}" aria-pressed="${i===p}">${i+1}${lessonDone(m)?" ✓":""} · ${es?m.es:m.en}</button>`).join("");
  if(row.__html!==rowHtml){ row.innerHTML=rowHtml; row.__html=rowHtml;
    row.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{ setLessonPick(b.getAttribute("data-lesson")); paint(); }); }
  document.getElementById("lKick").textContent=lt("lessonsNav")+" · "+STAIR.filter(lessonDone).length+"/"+STAIR.length;
  const sh=document.getElementById("lSheet");
  sh.hidden=true;   /* the telescope has no worksheet yet; the slot stays */
  document.getElementById("lessonBody").innerHTML=lessonCard(S.page==="lab");
  bindLessonBox(box);
}
function lessonBoxHtml(inLab){ return `<div class="card lesson-box${inLab?" lab-lesson practical-box":""}" id="lessonBox">${lessonSelect()}${lessonCard(inLab)}</div>`; }
function ladderHtml(){
  const now=lessonNow(), p=lessonPicked();
  return STAIR.map((m,i)=>{
    const done=lessonDone(m), cls=done?"done":(i===now?"now":"later");
    return `<li class="${cls}${i===p?" picked":""}" data-pick="${i}" role="button" tabindex="0"${i===p?' aria-current="true"':""}><span class="mk">${lt("lessonK")} ${i+1}${done?" · ✓":""}</span><span class="lt">${S.lang==="es"?m.es:m.en}</span></li>`;
  }).join("");
}
function lessonsView(){
  return `<p class="kicker">${lt("lessonsNav")}</p>
    <h1>${lt("lessonsNav")}</h1>
    <p class="lead">${lt("lessonsLead")}</p>
    <div class="lessons-wrap lessons-one">
      <div class="card ladder-box"><p class="tiny">${lt("lessonsAll")}</p><ol class="ladder" id="lessonLadder">${ladderHtml()}</ol>
        <div class="lesson-acts"><a class="pill" href="#home">${lt("toHome")}</a></div></div>
    </div>`;
}
function bindLessonBox(root){
  root=root||document;
  const sel=root.querySelector("#lessonPick");

  {a:2.7,t:.36,s:2.1,k:.6},{a:3.45,t:.82,s:1.15,k:.5},{a:4.2,t:.48,s:.75,k:.35},
  {a:5.05,t:.64,s:1.45,k:.55},{a:5.7,t:.28,s:1.6,k:.42},

function drawEyeDust(ctx, cx, cy, r, w, twist){

function achromatFringe(ctx, src, w, h, cx, cy, r, strength){
  if(strength<0.05) return;
  const N=156;
  if(!achromatFringe.buf) achromatFringe.buf=document.createElement("canvas");
  const b=achromatFringe.buf;
  if(b.width!==N){ b.width=N; b.height=N; }
  const g=b.getContext("2d",{willReadFrequently:true});
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,N,N);
  g.drawImage(src, cx-r, cy-r, r*2, r*2, 0, 0, N, N);
  let im; try{ im=g.getImageData(0,0,N,N); }catch(e){ return; }
  const d=im.data, out=g.createImageData(N,N), o=out.data;
  const lum=i=>0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
  const shift=0.7+strength*2.8;
  for(let y=2;y<N-2;y++){
    for(let x=2;x<N-2;x++){
      const i=(y*N+x)*4;
      const e=Math.hypot(lum(i+4)-lum(i-4), lum(i+N*4)-lum(i-N*4));
      if(e<24) continue;
      const dx=x-N/2, dy=y-N/2, dist=Math.min(1, Math.hypot(dx,dy)/(N*0.46));
      const lat=0.25+dist*dist*0.95, sft=shift*lat, len=Math.hypot(dx,dy)||1;
      const ux=dx/len, uy=dy/len, k=Math.min(150, e*lat*0.9);
      const stamp=(px,py,R,G,B,a)=>{
        const vx=px|0, vy=py|0;
        if(vx<1||vy<1||vx>=N-1||vy>=N-1) return;
        const j=(vy*N+vx)*4;
        o[j]=Math.min(255,o[j]+R*a); o[j+1]=Math.min(255,o[j+1]+G*a);
        o[j+2]=Math.min(255,o[j+2]+B*a); o[j+3]=Math.min(255,o[j+3]+a*255);
      };
      stamp(x+ux*sft, y+uy*sft, 0.72, 0.28, 1, k/255);
      stamp(x-ux*sft*0.6, y-uy*sft*0.6, 0.65, 0.85, 0.25, k/255*0.55);
    }
  }
  g.putImageData(out,0,0);
  ctx.save(); ctx.globalCompositeOperation="screen";
  ctx.drawImage(b, cx-r, cy-r, r*2, r*2);
  ctx.restore();

function startEye(){

    if (canvas.width!==px){ canvas.width=canvas.height=px; }
  };

    wrap._bound=true;
    let drag=null, moved=0;
    const loc=e=>{ const r=wrap.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top,w:r.width,h:r.height}; };
    wrap.addEventListener("pointerdown", e=>{ if(e.pointerType==="touch") e.preventDefault(); wrap.setPointerCapture(e.pointerId); drag={x:e.clientX,y:e.clientY}; moved=0; }, {passive:false});

      moved+=Math.abs(dx)+Math.abs(dy); drag={x:e.clientX,y:e.clientY};

        const sx=p.x*(w/(p.w||1)), sy=p.y*(h/(p.h||1));

          if (!S.lab.mA || S.lab.mB){ S.lab.mA=spec; S.lab.mB=null; }

    const L=S.lab;
    if (!L.locked && !L.cap && !(L.target==="sun" && !L.filter)){ L.panX+=0.012; }

function tick(){
  const L=S.lab, band=focusBand(L);
  if (!L.cap) S.missions.cap=true;
  if (L.locked) S.missions.lock=true;
  if (L.ep===25) S.missions.low=true;
  if (L.target==="moon"&&L.ep===25&&band==="in"&&!L.cap&&L.locked) S.missions.coarse=true;
  if (L.ep===10) S.missions.mid=true;
  if (L.ep===6) S.missions.short=true;
  if (L.target==="moon"&&L.ep===6&&band==="in"&&!L.cap) S.missions.fine=true;
  if (L.target==="jupiter"&&band==="in"&&!L.cap&&L.ep!==25) S.missions.jupiter=true;
  if (L.target==="orion"&&band==="in"&&!L.cap&&L.ep!==25) S.missions.orion=true;
  if (L.reticle&&L.mA&&L.mB&&L.ep!==25&&!L.cap) S.missions.measure=true;
  if (L.target==="sea"&&L.ep===6&&band==="in"&&!L.cap&&!L.barlow) S.missions.ceiling=true;
  if (L.target==="albireo"&&band==="in"&&!L.cap&&L.ep!==25&&!L.barlow) S.missions.albireo=true;
  if (L.barlow&&L.target==="pair"&&L.ep===6&&band==="in"&&!L.cap) S.missions.barlow=true;

}
function centerTarget(id){

      const L=S.lab, k=inp.getAttribute("data-knob");
      L[k]=+inp.value;
      const lab=inp.closest("label"); const b=lab&&lab.querySelector("b"); if(b) b.textContent=k==="eyeTwist"?Math.round(L[k]/100*360)+"°":Math.round(L[k]);
      const band=focusBand(L);
      const fl=band==="in"?t("focusIn"):band==="near"?t("focusNear"):t("focusOut");
      const span=document.querySelector(".readout span:last-child"); if(span && !L.cap) span.textContent=fl;
      document.querySelectorAll(".fieldnote").forEach(el=>{ el.textContent=fieldNote(); });
      tick();
    };
    inp.onchange=()=>{ if(stairNow()!==S.lastStair || JSON.stringify(S.missions)!==S.lastSig) paint(); };
  });
  S.lastStair=stairNow(); S.lastSig=JSON.stringify(S.missions);
}
document.getElementById("langBtn").onclick=()=>{ S.lang=S.lang==="en"?"es":"en"; persist(); paint(); };
document.getElementById("themeBtn").onclick=()=>{ S.theme=S.theme==="dark"?"light":"dark"; persist(); paint(); };
window.addEventListener("hashchange", paint);
paint();
</script>
<script>
/* AOG-SCIPIC-PANEL-V1 - the guide loads only when the bar is opened, and the frame is
   grown to its content so the panel scrolls with the page instead of inside itself. */
(function(){
  var d=document.getElementById("pgPanel"); if(!d) return;
  var f=document.getElementById("pgFrame"); if(!f) return;
  function fit(){
    try{ var b=f.contentDocument&&f.contentDocument.body;
         if(b){ var h=b.scrollHeight; if(h>240) f.style.height=(h+28)+"px"; } }catch(e){}
  }
  d.addEventListener("toggle", function(){
    if(d.open && !f.getAttribute("src")) f.setAttribute("src", f.getAttribute("data-src"));
  });
  f.addEventListener("load", function(){ fit(); setTimeout(fit,250); setTimeout(fit,1200); });
  var t; window.addEventListener("resize", function(){ clearTimeout(t); t=setTimeout(fit,150); });
})();
</script>
