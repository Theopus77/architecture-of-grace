<style>

.scope-knob::-webkit-slider-runnable-track { height:12px; border-radius:999px; background:var(--chip); }
.scope-knob::-moz-range-track { height:8px; border-radius:999px; background:var(--chip); }

.scope-knob::-moz-range-thumb { width:40px; height:40px; border-radius:999px; background:var(--steel); border:2px solid var(--card); }

.opts { display:grid; gap:.5rem; margin-top:1rem; }

.opt.right { background:var(--good-soft); border-color:var(--good); }
.opt.wrong { background:var(--bad-soft); border-color:var(--bad); }
.side { padding:1rem 1.15rem; }
.tiny { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); }
footer { margin-top:3rem; max-width:70ch; font-size:.9rem; color:var(--muted); }
.paper { padding:1.5rem; }
.psheet + .psheet { margin-top:2rem; }
.blank { border-bottom:1px solid var(--ink); display:inline-block; min-width:8rem; height:1.1em; }
.grid-home { display:grid; gap:1.5rem; margin-top:1.5rem; }

.act { display:block; padding:1.1rem 1.2rem; text-decoration:none; }
.act:hover { border-color:var(--steel); }

.compare { display:grid; gap:.75rem; }
@media (min-width:640px){ .compare { grid-template-columns:1fr 1fr; } }

  });

/* AOG-SOUND-HANDOFF-V1 — render the tone on screen (shape, pitch, loudness) for two
   seconds, silently, and hand it to the drum machine or the turntables. */
/* AOG-SCOPE-RECORD-V1 (2026-09-26) — Jimmy: "as soon as you press the drum machine or
   turntables it jumps to them. THERE IS NO RECORD BUTTON." Record now captures what you do —
   every slider move and shape change — for up to 8 seconds. Then the take waits: play it back,
   and only send it when you choose where. */
const REC={on:false,t0:0,log:[],take:null,iv:0,url:""};
function recSample(){ const tt=(performance.now()-REC.t0)/1000; REC.log.push({t:tt,hz:S.hz,amp:S.amp,shape:S.shape||"sine"}); const el=document.getElementById("recBtn"); if(el) el.textContent=(S.lang==="en"?"■ Stop  ":"■ Parar  ")+tt.toFixed(1)+" s"; if(tt>=8) recStop(); }
function recStart(){ REC.on=true; REC.t0=performance.now(); REC.log=[]; REC.take=null; recSample(); REC.iv=setInterval(recSample,25); paint(); }
async function recStop(){
  if(!REC.on) return; clearInterval(REC.iv); REC.on=false;
  const log=REC.log, dur=Math.max(.3,log[log.length-1].t+.05);
  const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext; if(!OC){ paint(); return; }
  const sr=44100, off=new OC(1, Math.ceil(sr*dur), sr), g=off.createGain(); g.connect(off.destination);
  /* one oscillator per stretch of the same shape; pitch and loudness follow the log */
  let seg=null; const segs=[];
  log.forEach(e=>{ if(!seg||seg.shape!==e.shape){ seg={shape:e.shape,t0:e.t,pts:[]}; segs.push(seg); } seg.pts.push(e); });
  segs.forEach((sg,i)=>{ const o=off.createOscillator(), og=off.createGain(); o.type=sg.shape; o.connect(og); og.connect(g);
    const end=i<segs.length-1?segs[i+1].t0:dur;
    sg.pts.forEach((e,k)=>{ if(k===0){ o.frequency.setValueAtTime(e.hz,e.t); og.gain.setValueAtTime(0,e.t); og.gain.linearRampToValueAtTime(0.2+e.amp*0.6,e.t+.008); } else { o.frequency.linearRampToValueAtTime(e.hz,e.t); og.gain.linearRampToValueAtTime(0.2+e.amp*0.6,e.t); } });
    og.gain.setValueAtTime(og.gain.value||0.4,Math.max(sg.t0,end-.008)); og.gain.linearRampToValueAtTime(0,end);
    o.start(sg.t0); o.stop(end); });
  const buf=await off.startRendering();
  REC.take={blob:window.aogWav(buf), dur, name:(log[0].shape)+"-take-"+Math.round(dur*10)/10+"s.wav"};
  if(REC.url) URL.revokeObjectURL(REC.url); REC.url=URL.createObjectURL(REC.take.blob);
  paint();
}
function recPlay(){ if(!REC.url) return; const a=new Audio(REC.url); a.volume=.6; a.play().catch(()=>{}); }
async function recordSound(where){
  if(!REC.take) return;
  const blob=REC.take.blob, name=REC.take.name;
  if(where==="saveWav"){ const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); a.remove(); return; }
  /* AOG-SEND-TO-PADS-V1 (2026-10-07) — Jimmy: "The old machine is obsolete. THE DRUM MACHINE IS WHERE IT IS AT!!!"
     The sound goes on the Drum Machine's chops bank, through the Studio's inbox, as every music tool's takes do. */
  if(where==="toDrums" && window.AOGHandoff && AOGHandoff.add){
    try{
      const r=await AOGHandoff.add(AOGHandoff.INBOX, {from:"waves", n:1, name:{en:"Oscilloscope · "+name, es:"Osciloscopio · "+name}, sec:Math.round((REC.take.dur||0)*1000)/1000, bpm:0, at:Date.now(), take:true, wav:blob});
      await AOGHandoff.put("padstake", {id:r.id, from:"waves", at:Date.now()});
      location.href="/drum-machine"; return;
    }catch(e){}
  }
  await window.aogHandoffPut({ name:name, blob:blob, at:Date.now() });
  location.href = "/music-decks.html?take=1";
}
function hear(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    if(!audio) audio=new AC();
    if(audio.state==="suspended") audio.resume();
    hush();
    osc=audio.createOscillator();
    gain=audio.createGain();
    osc.type=S.shape||"sine";
    osc.frequency.value=S.hz;
    gain.gain.value=Math.min(0.18, 0.06+S.amp*0.12);

    osc.start();
  }catch(e){}
}

function wavePath(w,h,cycles,amp,phase){
  const mid=h/2, A=(h*0.38)*amp;
  let d=`M 0 ${mid}`;
  for(let x=0;x<=w;x+=2){
    const y=mid - Math.sin((x/w)*cycles*Math.PI*2 + phase)*A;
    d+=` L ${x.toFixed(1)} ${y.toFixed(1)}`;
  }
  return d;
}
function drawWave(c, opt){
  const w=c.width, h=c.height, ctx=c.getContext("2d");
  ctx.clearRect(0,0,w,h);
  /* AOG-SCOPE-FACELIFT-V1 (2026-09-26) — a real oscilloscope screen: dark green
     phosphor glass, the graticule grid, a glowing green trace. Still, never moving. */
  const bg=ctx.createRadialGradient(w/2,h/2,10,w/2,h/2,Math.max(w,h)*.7);
  bg.addColorStop(0,"#0f3320"); bg.addColorStop(1,"#03110a");
  ctx.fillStyle=bg; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle="rgba(90,190,130,.22)"; ctx.lineWidth=1; ctx.beginPath();
  for(let i=1;i<10;i++){ const x=Math.round(w*i/10)+.5; ctx.moveTo(x,0); ctx.lineTo(x,h); }
  for(let j=1;j<8;j++){ const y=Math.round(h*j/8)+.5; ctx.moveTo(0,y); ctx.lineTo(w,y); }
  ctx.stroke();
  ctx.strokeStyle="rgba(120,230,160,.45)"; ctx.beginPath(); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
  const cycles=opt.cycles, amp=opt.amp, phase=opt.phase||0, kind=opt.shape||"sine";
  const A=(h*0.38)*amp;
  function sample(th){
    const t=((th%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    if(kind==="square") return t<Math.PI?1:-1;
    if(kind==="triangle") return t<Math.PI ? -1+2*(t/Math.PI) : 3-2*(t/Math.PI);
    if(kind==="sawtooth") return -1+2*(t/(Math.PI*2));
    return Math.sin(th);
  }
  ctx.strokeStyle="#7dffae"; ctx.lineWidth=3; ctx.shadowColor="rgba(125,255,174,.8)"; ctx.shadowBlur=10; ctx.beginPath();
  for(let x=0;x<=w;x++){
    const th=(x/w)*cycles*Math.PI*2 + phase;
    const y=h/2 - sample(th)*A;
    if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.stroke(); ctx.shadowBlur=0;
  if(opt.marks){
    const crestX=w*(0.25/cycles + (phase?0:0));
    // first crest at sin=1 => phase + 2pi cycles * x/w = pi/2
    const xCrest = ((Math.PI/2 - phase)/(2*Math.PI*cycles))*w;
    const xTrough = ((3*Math.PI/2 - phase)/(2*Math.PI*cycles))*w;
    const xCrest2 = ((Math.PI/2 + 2*Math.PI - phase)/(2*Math.PI*cycles))*w;
    function mark(x,y,id,label){
      if(x<8||x>w-8) return;
      ctx.fillStyle = S.sel===id ? "#d9a84e" : "#edeae2";
      ctx.beginPath(); ctx.arc(x,y,7,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#edeae2"; ctx.font="12px sans-serif";
      if(S.met[id]||S.sel===id) ctx.fillText(label, Math.min(w-40,x+10), y-10);
    }
    mark(xCrest, h/2-A, "crest", S.lang==="en"?"crest":"cresta");
    mark(xTrough, h/2+A, "trough", S.lang==="en"?"trough":"valle");
    if(opt.dim){
      ctx.strokeStyle="#d9a84e"; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(xCrest,h/2); ctx.lineTo(xCrest,h/2-A); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(xCrest,h/2-A); ctx.lineTo(xCrest2,h/2-A); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle="#d9a84e"; ctx.font="11px sans-serif";
      if(S.met.amplitude||S.sel==="amplitude") ctx.fillText(S.lang==="en"?"amplitude":"amplitud", xCrest+8, h/2-A/2);
      if(S.met.wavelength||S.sel==="wavelength") ctx.fillText(S.lang==="en"?"wavelength":"longitud", (xCrest+xCrest2)/2-20, h/2-A-8);
    }
  }
}

  const pick=EXPS.map(e=>`<button type="button" class="chip${L.test===e.id?" on":""}" data-exp="${e.id}">${S.lang==="en"?e.q_en:e.q_es}</button>`).join("");
  let body=`<p class="kicker">${t("lab")}</p><h1>${t("lab")}</h1><p class="lead">${t("labLead")}</p>
    <p class="tiny">${t("pickQ")}</p><div class="chips">${pick}</div>`;
  const exp=EXPS.find(e=>e.id===L.test);
  if(!exp) return body;
  const rows=L.trials[exp.id]||[];
  const hypoChips=[["up","hypoA"],["same","hypoB"],["down","hypoC"]].map(([id,k])=>`<button type="button" class="chip${L.hypo===id?" on":""}" data-hypo="${id}">${t(k)}</button>`).join("");
  const obsChips=OBS.map(o=>`<button type="button" class="chip${L.obs===o.id?" on":""}" data-obs="${o.id}">${t(o.k)}</button>`).join("");
  const stepBtns=exp.steps.map(v=>{
    const cur=exp.id==="amp"?S.amp:exp.id==="shape"?S.shape:S.hz;
    return `<button type="button" class="chip${String(v)===String(cur)?" on":""}" data-step="${String(v)}">${exp.label(v)}</button>`;
  }).join("");
  const table=rows.length?`<table class="nb"><thead><tr><th>${t("trial")}</th><th>${S.lang==="en"?exp.iv_en:exp.iv_es}</th><th>Hz</th><th>%</th><th>${t("wavesOn")}</th><th>${t("observe")}</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.iv)}</td><td>${r.hz}</td><td>${Math.round(r.amp*100)}</td><td>${r.waves}</td><td>${obsText(r.obs)}</td></tr>`).join("")}</tbody></table>`:`<p class="muted">${t("needObs")}</p>`;
  const evid=rows.map((r,i)=>`${i+1}. ${r.iv} → ${r.waves} ${S.lang==="en"?"waves":"ondas"}, ${obsText(r.obs)}`).join(" · ");
  const cer = rows.length>=3 ? `<div class="card side" style="margin-top:1rem">
      <div class="tiny">${t("claim")}</div>
      <p>${S.lang==="en"?exp.claim_en:exp.claim_es}</p>
      <div class="tiny">${t("evidence")}</div>
      <p>${evid}</p>
      <div class="tiny">${t("reason")}</div>
      <p>${S.lang==="en"?exp.why_en:exp.why_es}</p>
      <p class="tiny" style="margin-top:.8rem">${t("claim")} — ${S.lang==="en"?"your words":"tus palabras"}</p>
      <textarea class="cer" data-cer="claim" maxlength="400">${esc(L.claim[exp.id]||"")}</textarea>
      <p class="tiny">${t("reason")} — ${S.lang==="en"?"your words":"tus palabras"}</p>
      <textarea class="cer" data-cer="reason" maxlength="400">${esc(L.reason[exp.id]||"")}</textarea>
    </div>` : "";
  return body+`<div class="vars">
      <div class="card"><div class="tiny">${t("iv")}</div><p>${S.lang==="en"?exp.iv_en:exp.iv_es}</p></div>
      <div class="card"><div class="tiny">${t("dv")}</div><p>${S.lang==="en"?exp.dv_en:exp.dv_es}</p></div>
      <div class="card"><div class="tiny">${t("hold")}</div><p>${S.lang==="en"?exp.hold_en:exp.hold_es}</p></div>
    </div>
    <p class="tiny">${t("hypo")}</p><div class="chips">${hypoChips}</div>
    <div class="wavebox"><canvas id="labWave" width="900" height="220"></canvas></div>
    <p class="muted">${S.hz} Hz · ${Math.round(S.amp*100)}% · ${S.shape} · ${t("wavesOn")} ≈ ${waveCycles().toFixed(1)}</p>
    <p class="tiny">${t("iv")}</p><div class="chips">${stepBtns}</div>
    <div class="chips">
      <button type="button" class="btn btn-steel" data-act="hear">${t("hear")}</button>
      <button type="button" class="btn" data-act="hush">${t("hush")}</button>
    </div>
    <p class="tiny">${t("observe")}</p><div class="chips">${obsChips}</div>
    <button type="button" class="btn btn-good" data-act="record">${t("record")}</button>
    <h2>${t("trials")}</h2>${table}${cer}
    <p><button type="button" class="btn" data-act="resetlab">${t("resetLab")}</button></p>`;
}
function pageFind(){
  if(!S.find) S.find={items:PARTS.slice().sort(()=>Math.random()-0.5), at:0, tries:0, right:0, done:false, say:null};
  const F=S.find;
  if(F.done) return `<h1>${t("doneFind")}</h1><p>${F.right} / ${F.items.length}</p><button class="btn btn-steel" data-act="findagain">${t("again")}</button>`;
  const want=F.items[F.at];
  return `<p class="kicker">${t("find")}</p><h1>${S.lang==="en"?want.en:want.es}</h1>
    <p class="lead">${t("findLead")}</p>
    <div class="chips">${PARTS.map(p=>`<button type="button" class="chip${F.say&&F.say.ok&&p.p===want.p?" on":""}" data-guess="${p.p}">${S.lang==="en"?p.en:p.es}</button>`).join("")}</div>
    ${F.say?`<p class="${F.say.ok?"ok":"no"}">${F.say.text}</p>`:""}`;
}
function pageJob(){
  if(!S.job) S.job={items:JOBS.slice().sort(()=>Math.random()-0.5), at:0, picked:null, right:0, done:false};
  const J=S.job;
  if(J.done) return `<h1>${t("doneJob")}</h1><p>${J.right} / ${J.items.length}</p><button class="btn btn-steel" data-act="jobagain">${t("again")}</button>`;
  const q=J.items[J.at];
  return `<p class="kicker">${t("job")}</p><h1>${S.lang==="en"?q.q_en:q.q_es}</h1>
    <p class="lead">${t("jobLead")}</p>
    <div class="opts">${q.opts.map(([id,lab])=>{
      let cls="opt";
      if(J.picked){ if(id===q.a) cls+=" right"; else if(id===J.picked) cls+=" wrong"; }
      return `<button type="button" class="${cls}" data-opt="${id}">${lab}</button>`;
    }).join("")}</div>`;
}
function pagePrint(){
  return `<p class="kicker no-print">${t("print")}</p>
    <p class="no-print"><button type="button" class="btn btn-steel" data-act="doprint">${t("printNow")}</button></p>
    <article class="card paper psheet">
      <div class="tiny">${t("sheet1")}</div>
      <h2>${t("app")}</h2>
      <p>${t("nameLine")}: <span class="blank"></span> &nbsp; ${t("dateLine")}: <span class="blank"></span></p>
      <p>1. ${t("q1")}</p>
      <svg viewBox="0 0 640 160" width="100%" height="140" aria-hidden="true">
        <line x1="20" y1="80" x2="620" y2="80" stroke="#888" />
        <path d="M20 80 C 70 20, 130 20, 180 80 S 290 140, 340 80 S 450 20, 500 80 S 590 140, 620 80" fill="none" stroke="#1a232c" stroke-width="2"/>
      </svg>
      <p>2. ${t("q2")}</p>
      <p>3. ${t("q3")}</p>
      <p>4. ${t("q4")}</p>
      <p>5. ${t("q5")}</p>
      <p>6. ${t("q6")}</p>
    </article>
    <article class="card paper psheet">
      <div class="tiny">${t("sheet2")}</div>
      <h2>${t("compare")}</h2>
      <p>${t("nameLine")}: <span class="blank"></span></p>
      <p>${t("drawA")}</p>
      <div style="height:120px;border:1px solid #888;margin:.5rem 0 1.2rem"></div>
      <p>${t("drawB")}</p>
      <div style="height:120px;border:1px solid #888;margin:.5rem 0"></div>
    </article>
    <article class="card paper psheet">
      <div class="tiny">${t("sheet3")}</div>
      <h2>${t("lab")}</h2>
      <p>${t("nameLine")}: <span class="blank"></span> &nbsp; ${t("dateLine")}: <span class="blank"></span></p>
      <p>1. ${t("pickQ")}</p>
      <p class="muted">${EXPS.map(e=>"• "+(S.lang==="en"?e.q_en:e.q_es)).join("<br>")}</p>
      <p>2. ${t("iv")} / ${t("dv")} / ${t("hold")}</p>
      <p><span class="blank"></span> &nbsp; <span class="blank"></span> &nbsp; <span class="blank"></span></p>
      <p>3. ${t("hypo")}</p>
      <p><span class="blank" style="min-width:90%"></span></p>
      <p>4. ${t("trials")}</p>
      <table class="nb"><thead><tr><th>1</th><th>2</th><th>3</th></tr></thead>
      <tbody><tr><td style="height:3rem"></td><td></td><td></td></tr></tbody></table>
      <p>5. ${t("claim")}</p>
      <p><span class="blank" style="min-width:90%"></span></p>
      <p>6. ${t("evidence")}</p>
      <p><span class="blank" style="min-width:90%"></span></p>
      <p>7. ${t("reason")}</p>
      <p><span class="blank" style="min-width:90%"></span></p>
    </article>`;
}
let raf=0, phase=0;
function startAnim(){
  cancelAnimationFrame(raf);
  const reduce=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function tick(){
    phase += reduce ? 0 : 0.06;
    const home=document.getElementById("homeWave");
    const meet=document.getElementById("meetWave");
    const play=document.getElementById("playWave");
    const shSine=document.getElementById("shSine");
    const shSq=document.getElementById("shSq");
    const shTri=document.getElementById("shTri");
    const shSaw=document.getElementById("shSaw");
    const lab=document.getElementById("labWave");
    const les=document.getElementById("lesWave");
    const cycles = waveCycles();
    if(home) drawWave(home,{cycles:3,amp:0.7,phase,shape:S.shape,marks:false});
    if(meet) drawWave(meet,{cycles:2.5,amp:0.75,phase,shape:"sine",marks:true,dim:true});
    if(play) drawWave(play,{cycles:cycles,amp:S.amp,phase,shape:S.shape,marks:true,dim:true});
    if(lab) drawWave(lab,{cycles:cycles,amp:S.amp,phase,shape:S.shape,marks:true,dim:true});
    if(shSine) drawWave(shSine,{cycles:2.2,amp:0.8,phase,shape:"sine",marks:false});
    if(shSq) drawWave(shSq,{cycles:2.2,amp:0.8,phase,shape:"square",marks:false});
    if(shTri) drawWave(shTri,{cycles:2.2,amp:0.8,phase,shape:"triangle",marks:false});
    if(shSaw) drawWave(shSaw,{cycles:2.2,amp:0.8,phase,shape:"sawtooth",marks:false});
    if(les){ /* AOG-SCOPE-LESSONS-V1: the trace only moves when it is untriggered (that is the lesson) or noisy; still with reduced motion */
      const live = S.sc.on && (S.sc.trig==="off" || S.sc.noise) && !reduce;
      if(live){ lesFrame++; if(S.sc.trig==="off") lesDrift+=0.05; }
      if(live || !les.__drawn || les.__key!==JSON.stringify(S.sc)){ drawScope(les); les.__drawn=true; les.__key=JSON.stringify(S.sc); }
    }
    if(home||meet||play||lab||les||shSine||shSq||shTri||shSaw) raf=requestAnimationFrame(tick);
  }
  tick();
}
function paint(){
  const next=hashPage();
  if(next!=="play" && next!=="lab" && next!=="lessons") hush();
  S.page=next;
  paintChrome();
  const view=document.getElementById("view");
  view.innerHTML = S.page==="meet"?pageMeet(): S.page==="play"?pagePlay(): S.page==="lab"?pageLab(): S.page==="lessons"?pageLessons(): S.page==="find"?pageFind(): S.page==="job"?pageJob(): S.page==="print"?pagePrint(): pageHome();
  startAnim();
  if(S.page==="lessons") bindLessons(view);
  paintLessonsTop();   /* AOG-BENCH-TOP-V1 */
  view.querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>{ S.sel=b.getAttribute("data-part"); S.met[S.sel]=true; persist(); paint(); });
  view.querySelectorAll("[data-hz]").forEach(b=>b.onclick=()=>{
    S.hz=+b.getAttribute("data-hz"); persist();
    if(osc) osc.frequency.value=S.hz;
    paint();
    if(osc) hear();
  });
  view.querySelectorAll("[data-shape]").forEach(b=>b.onclick=()=>{
    S.shape=b.getAttribute("data-shape"); S.met.shape=true; persist();
    if(osc) osc.type=S.shape;
    paint();
    if(osc) hear();
  });
  view.querySelectorAll("[data-knob]").forEach(inp=>{
    inp.oninput=()=>{
      const k=inp.getAttribute("data-knob");
      if(k==="hz"){ S.hz=+inp.value; const el=document.getElementById("hzRead"); if(el) el.textContent=S.hz+" Hz"; if(osc) osc.frequency.value=S.hz; }
      if(k==="amp"){ S.amp=(+inp.value)/100; const el=document.getElementById("ampRead"); if(el) el.textContent=Math.round(S.amp*100)+"%"; if(gain) gain.gain.value=Math.min(0.18,0.06+S.amp*0.12); }
      clearTimeout(inp.__pt); inp.__pt=setTimeout(persist,300); /* AOG-SCOPE-SMOOTH-V1: save after the hand stops, not on every step */
    };
  });
  view.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const a=b.getAttribute("data-act");
    if(a==="hear") hear();
    if(a==="hush") hush();
    if(a==="toDrums"||a==="toDecks"||a==="saveWav") recordSound(a);
    if(a==="recStart") recStart();
    if(a==="recStop") recStop();
    if(a==="recPlay") recPlay();
    if(a==="doprint") window.print();
    if(a==="lesHear") lesHear();
    if(a==="prevLesson"){ S.sc.lesson=Math.max(0,S.sc.lesson-1); persist(); paint(); }
    if(a==="nextLesson"){ S.sc.lesson=Math.min(LESSONS.length-1,S.sc.lesson+1); persist(); paint(); }
    if(a==="findagain"){ S.find=null; paint(); }
    if(a==="jobagain"){ S.job=null; paint(); }
    if(a==="record"){
      const exp=EXPS.find(e=>e.id===S.lab.test); if(!exp) return;
      if(!S.lab.obs){ paint(); return; }
      S.lab.trials[exp.id]=S.lab.trials[exp.id]||[];
      if(S.lab.trials[exp.id].length>=3) { persist(); paint(); return; }
      S.lab.trials[exp.id].push({iv:exp.label(exp.id==="amp"?S.amp:exp.id==="shape"?S.shape:S.hz), hz:S.hz, amp:S.amp, shape:S.shape, waves:waveCycles().toFixed(1), obs:S.lab.obs});
      S.lab.obs=null; persist(); paint();
    }
    if(a==="resetlab"){
      const id=S.lab.test; if(!id) return;
      S.lab.trials[id]=[]; S.lab.hypo=null; S.lab.obs=null; S.lab.claim[id]=""; S.lab.reason[id]=""; persist(); paint();
    }
  });
  view.querySelectorAll("[data-exp]").forEach(b=>b.onclick=()=>{
    const id=b.getAttribute("data-exp");
    S.lab.test=id; S.lab.hypo=null; S.lab.obs=null;
    const exp=EXPS.find(e=>e.id===id); if(exp) exp.apply(exp.steps[0]);
    persist(); paint();
  });
  view.querySelectorAll("[data-hypo]").forEach(b=>b.onclick=()=>{ S.lab.hypo=b.getAttribute("data-hypo"); persist(); paint(); });
  view.querySelectorAll("[data-obs]").forEach(b=>b.onclick=()=>{ S.lab.obs=b.getAttribute("data-obs"); persist(); paint(); });
  view.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{
    const exp=EXPS.find(e=>e.id===S.lab.test); if(!exp) return;
    const raw=b.getAttribute("data-step");
    const v = exp.id==="shape"?raw: +raw;
    exp.apply(v); persist(); paint();
    if(osc) hear();
  });
  view.querySelectorAll("[data-cer]").forEach(el=>{
    el.oninput=()=>{
      const exp=EXPS.find(e=>e.id===S.lab.test); if(!exp) return;
      const k=el.getAttribute("data-cer");
      S.lab[k][exp.id]=el.value; persist();
    };
  });
  view.querySelectorAll("[data-guess]").forEach(b=>b.onclick=()=>{
    const F=S.find; if(!F||F.done||(F.say&&F.say.ok)) return;
    const id=b.getAttribute("data-guess"), want=F.items[F.at].p;
    if(id===want){ F.say={ok:true,text:t("thatsIt")}; F.right++; S.met[id]=true; persist(); paint();
      setTimeout(()=>{ F.at++; F.tries=0; F.say=null; if(F.at>=F.items.length){ F.done=true; S.findBest=Math.max(S.findBest,F.right); persist(); } paint(); },700); }
    else {
      F.tries++;
      if(F.tries>=2){ F.say={ok:false,text:t("glowing")}; persist(); paint();
        setTimeout(()=>{ F.at++; F.tries=0; F.say=null; if(F.at>=F.items.length){ F.done=true; persist(); } paint(); },1100); }
      else { F.say={ok:false,text:t("notThat")}; paint(); }
    }
  });
  view.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
    const J=S.job; if(!J||J.picked||J.done) return;
    const id=b.getAttribute("data-opt"), q=J.items[J.at];
    J.picked=id; if(id===q.a) J.right++; paint();
    setTimeout(()=>{ J.at++; J.picked=null; if(J.at>=J.items.length){ J.done=true; S.jobBest=Math.max(S.jobBest,J.right); persist(); } paint(); },850);
  });
  if(S.page==="meet"){
    const c=document.getElementById("meetWave");
    if(c) c.onclick=e=>{
      const r=c.getBoundingClientRect();
      const y=(e.clientY-r.top)/r.height;
      const x=(e.clientX-r.left)/r.width;
      let id="wavelength";
      if(y<0.32) id="crest";
      else if(y>0.68) id="trough";
      else if(y>0.42 && y<0.58) id="amplitude";
      else if(x>0.55) id="frequency";
      S.sel=id; S.met[id]=true; persist(); paint();
    };
  }
}
document.getElementById("langBtn").onclick=()=>{ S.lang=S.lang==="en"?"es":"en"; persist(); paint(); };
document.getElementById("themeBtn").onclick=()=>{ setTheme(S.theme==="dark"?"light":"dark"); paint(); };
window.addEventListener("beforeprint", function(){ try{ if(S.page!=="print"){ S._back=S.page; location.hash="print"; } }catch(e){} });
window.addEventListener("afterprint", function(){ try{ if(S._back){ location.hash=S._back; S._back=null; } }catch(e){} });
window.addEventListener("hashchange", paint);
window.addEventListener("pagehide", hush);
paint();
</script>
<script>
(function(){
  var d=document.getElementById("pgPanel"); if(!d) return;
  var f=document.getElementById("pgFrame"); if(!f) return;
  function fit(){
    try{ var b=f.contentDocument&&f.contentDocument.body;
         if(b){ var h=b.scrollHeight; if(h>240) f.style.height=(h+28)+"px"; } }catch(e){}
  }
  d.addEventListener("toggle", function(){
    if(d.open && !f.getAttribute("src")) f.setAttribute("src", f.getAttribute("data-src"));
  });
  f.addEventListener("load", function(){ fit(); setTimeout(fit,250); setTimeout(fit,1200); });
  var t; window.addEventListener("resize", function(){ clearTimeout(t); t=setTimeout(fit,150); });
})();
</script>
