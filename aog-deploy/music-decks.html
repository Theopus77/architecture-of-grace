<meta charset="utf-8"><style id="aog-first-paint">/* AOG-ONE-PAINT-V1 (2026-09-27) — Jimmy: moving between units was "very choppy, makes me sick". The page now shows once, fully built: it waits on its paper colour until the shared scripts and fonts are in (aog-sketch.js adds .aog-ready), and never longer than ~1 s even if a script fails. No fade, no motion. */html{background:#F7F2E6}html[data-theme="dark"]{background:#0A1E33}@media (prefers-color-scheme:dark){html:not([data-theme="light"]){background:#0A1E33}}html:not(.aog-ready) body{visibility:hidden;animation:aogOnePaint 0s linear 1.1s forwards}@keyframes aogOnePaint{to{visibility:visible}}@media print{html:not(.aog-ready) body{visibility:visible;animation:none}}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
(function(){var t="light";try{if(localStorage.getItem("aog.theme.lightstart.v1")==="1"&&localStorage.getItem("aog.interior.ws.v1.theme")==="dark")t="dark";}catch(e){}document.documentElement.setAttribute("data-theme",t);if(t==="dark")document.documentElement.classList.add("dark");})();
</script>
<title>The Turntables — Architecture of Grace</title>
<meta name="description" content="Two platters with weight. Load a song from this computer, scratch it, mix it, and record the take as a .wav. The song never leaves.">
<link rel="canonical" href="https://architectureofgrace.org/decks">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1E33">
<link rel="icon" href="/favicon.ico" sizes="any">
<!-- AOG-DECKS-V1 (2026-09-22) — Jimmy: turntables a student can load a song onto, scratch, and mix.
     Local file only. Nothing is uploaded. We do not ship songs. Classroom volume. -->
<style>
:root {
  --bg:#f4f0e6; --card:#fffcf7; --ink:#1a232c; --muted:#5c6670; --line:#ddd8cc;
  --steel:#2f5c6b; --steel-fg:#f4f8f9; --chip:#efebe3; --lamp:#d9a84e;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
.dark,[data-theme="dark"] {
  --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
  --steel:#7fb4c7; --steel-fg:#14181e; --chip:#2a313c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans)}
h1{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-size:clamp(1.5rem,4vw,2.3rem);margin:.2rem 0 .4rem}
/* AOG-DECKS-NAV-V1 (2026-09-26) — Jimmy: "the drum machine link should be at the top, or at least match the drum
   machine page and vice versa." The same activity row the drum machine has, with the drum machine one tap away. */
.nav{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin:1rem 0 .2rem;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;min-height:44px;display:inline-flex;align-items:center;padding:0 .75rem;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem;border-bottom:2px solid transparent;margin-bottom:-2px}
.nav a.on{color:var(--ink);border-color:var(--accent,#c45c26)}
.wrap{max-width:1100px;margin:0 auto;padding:max(1.1rem,env(safe-area-inset-top)) 1rem 4rem}
header{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:.6rem}
.brand{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.tools{display:flex;gap:.5rem}
.pill{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 .9rem;font-weight:600;display:inline-flex;align-items:center}
button,label.file{font:inherit;cursor:pointer;touch-action:none}
.kicker{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.lead{max-width:66ch;color:var(--muted)}
/* AOG-DECKS-FIT-V1 (2026-09-26): Jimmy's iPhone showed Deck B wider than the
   screen once a song loaded. The waveform is drawn at twice its width, and a
   grid column of plain 1fr lets that picture push the column wider every
   redraw. minmax(0,1fr) and min-width:0 keep each deck the width of the screen. */

/* ══ AOG-DECKS-SIMPLE-V1 (2026-09-26) — same recipe as the drum machine. Two decks carried
   ~55 controls before the crossfader. SIMPLE BENCH (default): Load, Take it off, Start, CUE,
   the platter, Speed and Volume per deck; the crossfader and Record. FULL BENCH brings back
   hot cues, loops, sync, key/slip, nudge, filter, echo, EQ and kills. On a phone in Simple,
   a Deck A / Deck B / Mix row shows one thing at a time so a platter and its controls share
   one screen. Sliders are colour-coded by job: gold speed, white volume, green EQ, blue
   filter and echo. ═══════════════════════════════════════════════════════════════════ */
.decktabs{display:none;gap:.4rem;margin:.7rem 0 0}
.decktabs .pill{flex:1;justify-content:center;font-weight:800}
.decktabs .pill.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
/* Jimmy, 2026-09-26: keep Set cue, the hot cues, loops, SYNC, BPM, KEY / SLIP / REV / TAP / ½× / 2× on the Simple bench too.
   Simple now hides only the mixing layer: nudge, filter, echo, EQ and the kills. */
body.bench-simple .deck .zoom,
body.bench-simple .deck label.knob:has([data-filter]),body.bench-simple .deck label.knob:has([data-echo]),body.bench-simple .deck label.knob:has([data-eq]),
body.bench-simple .deck .row:has([data-nudge]),body.bench-simple .deck .row:has([data-kill]),body.bench-simple .deck [data-wide],
body.bench-simple .xrow #curveBtn,body.bench-simple .xrow #noiseBtn,body.bench-simple .xrow #touchBtn,body.bench-simple .eqwrap{display:none}
body.bench-simple .deck .row .file,body.bench-simple .deck .row .go{min-height:52px;font-size:1.02rem;padding:0 1.1rem}
body.bench-simple .deck .row .ghost{min-height:48px}
.deck label.knob:has([data-speed]){color:#f0c26e}.deck [data-speed]{accent-color:#f0c26e}
.deck label.knob:has([data-vol]){color:#f4efe4}.deck [data-vol]{accent-color:#f4efe4}
.deck label.knob:has([data-eq]){color:#9fd4a0}.deck [data-eq]{accent-color:#9fd4a0}
.deck label.knob:has([data-filter]),.deck label.knob:has([data-echo]){color:#7fc7f5}.deck [data-filter],.deck [data-echo]{accent-color:#7fc7f5}
@media (max-width:700px){
  body.bench-simple .decktabs{display:flex}
  body.bench-simple[data-decktab="A"] #deckB,body.bench-simple[data-decktab="A"] .xfade,
  body.bench-simple[data-decktab="B"] #deckA,body.bench-simple[data-decktab="B"] .xfade,
  body.bench-simple[data-decktab="mix"] #deckA,body.bench-simple[data-decktab="mix"] #deckB{display:none}
}
.decks{display:grid;gap:1rem;margin-top:1rem;grid-template-columns:minmax(0,1fr)}
.deck{min-width:0}
@media(min-width:800px){.decks{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.deck{
  background:radial-gradient(140% 90% at 50% -10%,#4a545f,#171c22 70%);
  border-radius:20px;padding:14px;color:#efe8dc;border:1px solid #0c0f13;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 16px 36px rgba(0,0,0,.35);
}
.deck h2{margin:.1rem 0 .4rem;font-size:1rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.wave{width:100%;height:64px;background:#06110c;border-radius:8px;display:block}
.platter-wrap{display:flex;justify-content:center;margin:.7rem 0}
.platter{
  width:min(240px,52vw);aspect-ratio:1;border-radius:50%;position:relative;
  background:radial-gradient(circle at 50% 50%, #2a241c 62%, #c4a574 63%, #c4a574 66%, #1a140e 67%);
  box-shadow:0 12px 28px rgba(0,0,0,.5);
  cursor:grab;touch-action:none;
}
.platter:active{cursor:grabbing}
.vinyl{
  position:absolute;inset:7%;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%, #161616 0 1px, #0c0c0c 2px 4px);
  transform:rotate(var(--rot,0deg));
}
.label{
  position:absolute;inset:27%;border-radius:50%;
  background:conic-gradient(#e7d3a1, #8a6230, #f3e6c8, #6e4a22, #e7d3a1);
  box-shadow:inset 0 0 0 6px rgba(0,0,0,.35);
}
.hole{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#0b0d10;z-index:2}
.arm{
  position:absolute;right:8%;top:10%;width:8px;height:46%;border-radius:8px;
  background:linear-gradient(#d9d3c6,#6e675c);transform-origin:50% 0;transform:rotate(18deg);
  pointer-events:none;z-index:3;
}
.arm::after{content:"";position:absolute;left:-3px;bottom:-6px;width:14px;height:10px;border-radius:2px;background:#c4452a}
.meter{height:8px;border-radius:99px;background:#0b0e12;margin-top:.45rem;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6fbf8b,#d9a84e,#c4452a)}
.time{font-variant-numeric:tabular-nums;color:#f4e2b0;font-weight:700;margin-left:auto}
.row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-top:.45rem}
.ghost,.go{
  min-height:44px;border-radius:999px;padding:0 .9rem;font-weight:700;white-space:nowrap;
}
.ghost{background:rgba(0,0,0,.28);color:#efe8dc;border:1px solid rgba(255,255,255,.16)}
.go{background:#c4452a;color:#fff8f3;border:0}
label.file{min-height:44px;border-radius:999px;padding:0 .9rem;display:inline-flex;align-items:center;background:#efe8dc;color:#1a140e;font-weight:700}
label.file input{display:none}
button.file{min-height:44px;border-radius:999px;padding:0 .9rem;display:inline-flex;align-items:center;background:#efe8dc;color:#1a140e;font-weight:700;border:0}
.dock{margin:.6rem 0;padding:.8rem;border-radius:14px;background:#1a140e;border:1px solid #5a4630}
.dock[hidden]{display:none}
.dockh,.dockempty{margin:0 0 .5rem;color:#efe8dc;font-size:.95rem}
.docklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.45rem;max-height:260px;overflow-y:auto;overscroll-behavior:contain}
.dsong{min-height:44px;border-radius:10px;border:1px solid #5a4630;background:#2a2016;color:#f4ecdc;font-weight:700;text-align:left;padding:.4rem .7rem;overflow:hidden}
.dsong span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsong.rm{border-color:#c0523a;background:#3a1e16}
.dsong.rm span::before{content:"✕ ";color:#f0a090}
.dockrow{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.song{font-size:.85rem;color:#c9bfae;min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.knob{display:block;margin-top:.35rem;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c9bfae}
.knob input{width:100%;height:36px}
.xfade{margin-top:1rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem}
.xfade span{display:flex;justify-content:space-between;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
#xf{display:block;width:100%;margin:.55rem 0 0;height:36px;accent-color:var(--steel)}
footer{margin-top:2rem;color:var(--muted);font-size:.9rem}
footer a{color:inherit}
@media print{.no-print{display:none!important}}
.deck.dragover{ outline:2px dashed currentColor; outline-offset:4px; }
.drophint{ font-size:12px; opacity:.72; margin:2px 0 0; color:#c9bfae; }
/* AOG-VINYL-ENGINE-V1 — the close-up groove, the strobe ring, the 33/45 pair */
.zoom{width:100%;height:36px;background:#0a1410;border-radius:8px;display:block;margin-top:.3rem}
.strobe{position:absolute;inset:2%;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,#f0dfae 0deg 2.2deg,transparent 2.2deg 9deg);
  -webkit-mask:radial-gradient(circle at 50% 50%, transparent 0 51%, #000 52% 58%, transparent 59%);
  mask:radial-gradient(circle at 50% 50%, transparent 0 51%, #000 52% 58%, transparent 59%);opacity:.8}
.deck.spinning .platter{box-shadow:0 12px 28px rgba(0,0,0,.5),0 0 0 2px rgba(244,226,176,.18)}
.rpm{display:inline-flex;gap:.25rem}
.rpmb{min-height:44px;padding:0 .7rem}
.rpmb.on{background:#efe8dc;color:#1a140e;border-color:#efe8dc}
.knob .readout{color:#f4e2b0;font-variant-numeric:tabular-nums;margin-left:.35rem}
.tiny{min-height:26px;border-radius:999px;padding:0 .55rem;margin-left:.4rem;font-size:.66rem;font-weight:800;
  letter-spacing:.1em;background:rgba(0,0,0,.3);color:#c9bfae;border:1px solid rgba(255,255,255,.18)}
.tiny.on{background:#f4e2b0;color:#1a140e;border-color:#f4e2b0}
.row.tr{gap:.35rem}
.grp{display:inline-flex;gap:.25rem}
.ghost.sm{min-height:38px;padding:0 .7rem;font-size:.85rem}
.ghost.sm.on{background:#f4a3b0;color:#2a0c08;border-color:#f4a3b0}
.bpm{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.8rem;font-weight:700;color:#f4e2b0}
.xrow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;align-items:center}
.pill.rec{border-color:#c4452a;color:#c4452a;font-weight:700}
:root[data-theme="dark"] .pill.rec:not(.on){border-color:#ff8a70;color:#ff8a70}
.pill.rec.on{background:#c4452a;color:#fff8f3;border-color:#c4452a;animation:recpulse 1.1s ease-in-out infinite}
@keyframes recpulse{50%{opacity:.62}}
@media (prefers-reduced-motion:reduce){.pill.rec.on{animation:none}}
.rectime{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.rechint{font-size:.8rem;color:var(--muted);margin:.5rem 0 0}
.takes{display:grid;gap:.5rem;margin-top:.6rem}
.eqwrap{position:relative;margin-top:.7rem}
.eqcurve{display:block;width:100%;height:110px;background:#06110c;border-radius:10px}
.eqcap{position:absolute;right:10px;bottom:7px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(198,247,176,.6)}
.bench{margin-top:.6rem}
/* AOG-DECKS-CRATE-V1 */
.crate{display:grid;gap:.6rem;margin-top:.6rem}
.crate h3{margin:.2rem 0 0;font-size:.95rem}
.crate .find{list-style:none;margin:0;padding:0;display:grid;gap:.4rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr))}
.crate .find li{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .5rem;padding:.55rem .75rem;border-radius:12px;border:1px solid rgba(201,162,74,.45);min-height:44px}
.crate .find a{font-weight:700;color:inherit;text-decoration-color:#C9A24A;text-underline-offset:3px}
.crate .find span{font-size:.85rem;color:var(--muted)}
.crate .take .nm{flex:1 1 8rem;text-transform:none;letter-spacing:0;color:var(--ink);font-size:.95rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.crate .take.empty{color:var(--muted)}
.crate label.ghost{cursor:pointer}
.crate label.ghost input{display:none}
/* AOG-DECKS-CRATE-BOX-V1 — Up next is a real crate: sleeves standing in a wooden box */
.cbox{position:relative;display:flex;gap:.7rem;overflow-x:auto;padding:1rem .9rem 1.3rem;border-radius:10px;
  background:linear-gradient(180deg,#8a5a32,#6b4424);border:3px solid #4a2d16;box-shadow:inset 0 -10px 0 #4a2d16, inset 0 2px 0 #a8744a;scroll-snap-type:x proximity}
.cbox.empty{display:block;color:#f3e6d4;font-size:.9rem}
.sleeve{flex:0 0 132px;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;gap:.35rem;cursor:grab;
  background:var(--card);border:1px solid #00000055;border-radius:6px;padding:.5rem;box-shadow:0 4px 8px #0006;transition:transform .12s}
.sleeve:hover{transform:translateY(-6px)}
.sleeve .art{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:hsl(var(--h),45%,38%)}
.sleeve .art::before{content:"";position:absolute;width:78%;aspect-ratio:1;top:11%;right:-22%;border-radius:50%;
  background:radial-gradient(circle,hsl(var(--h),60%,55%) 0 16%,#111 17% 19%,#1b1b1b 20% 100%);box-shadow:0 0 0 1px #000}
.sleeve .art b{position:absolute;left:6px;top:4px;font-size:1.2rem;color:#fff;text-shadow:0 1px 2px #000}
.sleeve .nm{text-transform:none;letter-spacing:0;font-size:.8rem;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sleeve .sb{display:flex;gap:.3rem}
.sleeve .sb button{flex:1;min-height:34px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-weight:700;font-size:.8rem;cursor:pointer}
.sleeve .sb button.x{flex:0 0 34px}
.deck.dragover{outline:3px dashed var(--accent,#c45c26);outline-offset:4px}
.bench .take.empty{color:var(--muted)}
.take{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem}
.take .tlen{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.take audio{height:34px;max-width:min(320px,52vw)}
.take .ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);min-height:40px;border-radius:999px;padding:0 .8rem;display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:.85rem}

/* AOG-PGPANEL-V1 (2026-09-23) - Jimmy: "Can these be embedded into their respective
   pages with a hyperlink to open and view them?" A bar under the machine; click it and
   the picture guide unfolds in place, in an iframe of the guide's own file, so there is
   one copy of the guide and not two. Never prints with the machine page. */
.pg{margin:1.1rem 0 0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.pg>summary{list-style:none;cursor:pointer;padding:.8rem 1rem;display:flex;align-items:center;gap:.7rem;
  font-weight:700;font-size:.98rem;min-height:44px}
.pg>summary::-webkit-details-marker{display:none}
.pg>summary::marker{content:""}
.pg .chev{flex:0 0 auto;transition:transform .15s ease;color:var(--muted);font-size:.9rem}
.pg[open] .chev{transform:rotate(90deg)}
.pg .pgsub{font-weight:400;color:var(--muted);font-size:.86rem;margin-left:auto;text-align:right}
.pg .pgbody{border-top:1px solid var(--line)}
.pg iframe{display:block;width:100%;border:0;min-height:60vh;background:var(--bg)}
.pg .pgfoot{padding:.65rem 1rem;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
.pg .pgfoot a{color:inherit;font-weight:700}
@media print{ .pg{display:none !important} }

/* AOG-MUSIC-STILL-V1 (2026-09-23) - the same stillness rules as Daily Drafts (AOG-DD-STILL-V1).
   Jimmy: "make sure that the Sampler and turn table follow the same protocols about off page
   scrolling (it is making me nausea at the moment)". */
html{overflow-x:clip; overscroll-behavior:none}
body{overflow-x:clip; overscroll-behavior:none}
body *{overscroll-behavior:contain}
input:not([type=range]):not([type=file]):not([type=checkbox]):not([type=radio]),select,textarea{font-size:max(16px,1em)}
@media (hover:none){ *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important} html{scroll-behavior:auto} }

/* AOG-MUSIC-TOUCH-V1 (2026-09-25) — Jimmy: "For the turntables, sometimes it takes
   a few taps. And the copy or paste pops up when I am clicking." A held or dragged
   finger read as "select this text", so iOS raised its copy/paste callout and ate
   the tap. Nothing on the machine is text to select: selection and the callout are
   off (fields and text areas keep them), every control answers the first tap with
   no double-tap wait, and the audio engine is woken on the very first touch. */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,a,label,input[type=range],.pill,.pad,.platter,canvas{touch-action:manipulation}
.platter,canvas.wave,canvas.zoom{touch-action:none}

/* AOG-BENCH-TOP-V1: the masthead, nav row, bench switch and Lessons card live in /aog-bench.css */
#lessonRow .ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
#lessonRow .ghost.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
</style>

<body>
<script src="/aog-sound-handoff.js"></script>
<script src="/aog-grace.js" defer></script>
<script>
(function(){
  function add(src){
    var s=document.createElement("script");
    s.src=src;
    s.onerror=function(){ if(src.indexOf("netlify.app")<0) add("https://architectureofgrace.netlify.app/aog-topbar.js"); };
    document.head.appendChild(s);
  }
  add(new URL("aog-topbar.js", document.baseURI).href);
})();
</script>
<div class="wrap">
  <header class="no-print">
    <a class="brand" href="music-drums.html" id="brand">The Turntables</a>
    <div class="tools">
      <a class="pill" href="/decks-guide" style="text-decoration:none">Picture guide</a>
      <button type="button" class="pill" id="langBtn">ES</button>
      <button type="button" class="pill" id="themeBtn">Dark</button>
    </div>
  </header>

const S = { lang: localStorage.getItem("aog.lang")==="es"?"es":"en", theme: document.documentElement.getAttribute("data-theme")||"light" };
function t(k){ return STR[k][S.lang]; }

/* a 33⅓ record turns 200° in one second of music. That number is the whole
   bridge between a hand on the platter and a place in the song. */
const DEG_PER_SEC = 200;

let actx, master, comp, workletReady = null, eqScope = null;
const decks = [makeDeck("A"), makeDeck("B")];
let curve = "smooth", noiseOn = true;
/* AOG-DECKS-TOUCH-V1 (2026-09-23) — Jimmy: "when you're scratching it seems to
   be going a bit too fast, so when you try to slow it down to make the vocals
   sound interesting it is too fast."
   A real 12-inch record is 30 cm across; this platter is about 6 cm on a laptop.
   At 1:1 a centimeter of hand is five times the record it would be under your
   palm, so the smallest movement is a big move in the music. The touch ratio is
   the jog-wheel gearing: FINE means you turn further to move the same amount of
   song, which is what makes a slow, steady pull — the one that stretches a
   vocal — possible with a mouse. 1:1 is still there for true vinyl behavior. */
const TOUCH = { fine:0.35, normal:0.6, vinyl:1 };
let touch = (localStorage.getItem("aog.decks.touch") || "fine");
if(!TOUCH[touch]) touch = "fine";
/* the tape: what the decks are doing, caught on its way to the speakers */
const TAPE = { node:null, sink:null, on:false, chunks:[], frames:0, t0:0, takes:[], n:0, timer:null };
const TAPE_MAX_SEC = 600;

function ctx(){
  /* AOG-MUSIC-TOUCH-V1 — Safari suspends the engine between gestures; every call wakes it */
  if(actx && actx.state!=="running"){ try{ actx.resume(); }catch(e){} }
  if(!actx){
    const AC = window.AudioContext||window.webkitAudioContext;
    actx = new AC({ latencyHint:"interactive" });
    /* AOG-DECKS-LOUDNESS-V1 — the same treatment the drum machine got: a normal
       level with a real limiter behind it, so two loud songs at once still
       cannot clip. The last 6% is deliberately left alone. */
    master = actx.createGain(); master.gain.value = 0.94;
    comp = actx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.ratio.value = 2.5; comp.knee.value = 10;
    const makeup = actx.createGain(); makeup.gain.value = 1.6;
    const limiter = actx.createDynamicsCompressor();
    limiter.threshold.value = -3; limiter.knee.value = 0; limiter.ratio.value = 20;
    limiter.attack.value = 0.002; limiter.release.value = 0.09;
    comp.connect(makeup); makeup.connect(limiter); limiter.connect(master);
    master.connect(actx.destination);
    if(actx.audioWorklet){
      workletReady = actx.audioWorklet
        .addModule(new URL("aog-vinyl-worklet.js", document.baseURI).href)
        .catch((err)=>{ workletReady = null; try{ console.warn("vinyl worklet unavailable — falling back", err); }catch(e){} });
    }
    eqScope = actx.createAnalyser(); eqScope.fftSize = 2048; eqScope.smoothingTimeConstant = 0.72;
    master.connect(eqScope);
    buildTape();   /* ⚠ AFTER workletReady exists, or the tape quietly falls back */
  }
  if(actx.state==="suspended") actx.resume();
  return actx;
}
function makeDeck(id){
  return { id, buf:null, peaks:null, name:"", note:"", pos:0, cue:0, rate:0, motor:false,
           pitch:1, rpm:1, vol:1, node:null, core:null, gain:null, low:null, high:null,
           rot:0, level:0, held:false, wide:false, pending:[],
           bpm:0, beat0:0, bands:null, cues:[null,null,null], loopBars:0, loopOn:false,
           loopA:0, loopB:0, filt:null, cueHeld:false,
           keyOn:true, slipOn:true, syncLock:false, taps:[], echo:null, echoSend:null, trackKey:"" };
}
function send(d, m){
  if(d.node && d.node.port) d.node.port.postMessage(m, m.L ? [m.L.buffer, m.R.buffer] : []);
  else if(d.core) d.core.msg(m);
  else d.pending.push(m);
}
async function ensureNode(d){
  ctx();
  if(d.node || d.core) return;
  if(workletReady){
    try{
      await workletReady;
      const n = new AudioWorkletNode(actx, "aog-vinyl", { numberOfInputs:0, outputChannelCount:[2] });
      n.port.onmessage = (e)=>{
        const m = e.data; if(m.t!=="st") return;
        d.pos = m.pos; d.level = m.level; d.rate = m.rate;
        if(d.motor && m.ended) d.motor = false;
      };
      d.node = n;
    }catch(e){ d.node = null; }
  }
  if(!d.node){
    /* no AudioWorklet (old Safari): the same core, on the old processor */
    d.core = new self.AOGVinylCore(actx.sampleRate);
    const n = actx.createScriptProcessor(512, 0, 2);
    n.onaudioprocess = (e)=>{
      const o = e.outputBuffer;
      d.core.process(o.getChannelData(0), o.getChannelData(1), o.length);
      d.pos = d.core.pos; d.level = d.core.level;
      d.rate = d.core.rate / (d.core.srRatio||1);
      if(d.motor && d.core.ended) d.motor = false;
    };
    d.node = n;
  }
  d.gain = actx.createGain(); d.gain.gain.value = d.vol;
  /* AOG-DECKS-EQ-V1 (2026-09-23) — a mixer's three bands, in series, each with a
     kill, exactly where a DJ mixer puts them: after the record, before the
     fader, so a kill is a kill whatever the crossfader is doing. */
  d.eq = AOGEq.dj(actx);
  d.low = actx.createBiquadFilter(); d.low.type="lowshelf"; d.low.frequency.value=180;   /* kept: the old bass/treble API */
  d.high = actx.createBiquadFilter(); d.high.type="highshelf"; d.high.frequency.value=5200;
  /* one knob, two filters: left of center it closes down to a rumble, right of
     center it opens up to a whisper. Center is out of the way entirely. */
  d.filt = actx.createBiquadFilter(); d.filt.type="lowpass"; d.filt.frequency.value=20000; d.filt.Q.value=0.8;
  d.node.connect(d.eq.input); d.eq.output.connect(d.filt); d.filt.connect(d.gain); d.gain.connect(comp);
  /* AOG-DECKS-APEX-V1 — an echo that knows the tempo: a dotted eighth of the
     track's own bar, feeding back on itself, sent from after the fader so it
     rings on after you cut the deck out. */
  d.echoSend = actx.createGain(); d.echoSend.gain.value = 0;
  d.echo = actx.createDelay(2.0); d.echo.delayTime.value = 0.35;
  const fb = actx.createGain(); fb.gain.value = 0.42;
  const damp = actx.createBiquadFilter(); damp.type = "lowpass"; damp.frequency.value = 3600;
  d.gain.connect(d.echoSend); d.echoSend.connect(d.echo);
  d.echo.connect(damp); damp.connect(fb); fb.connect(d.echo);
  damp.connect(comp);
  send(d, { t:"noise", v: noiseOn ? 0.5 : 0 });
  send(d, { t:"key", on:d.keyOn });
  send(d, { t:"slip", on:d.slipOn });
  const q = d.pending; d.pending = [];
  q.forEach(m=>send(d, m));
  setMix();
}
async function loadFile(d, file, opts){
  d.note = t("loading").replace("%s", file.name); paintDeck(d);
  try{
    ctx(); await ensureNode(d);
    const arr = await file.arrayBuffer();
    const buf = await new Promise(function(ok, no){
      const r = actx.decodeAudioData(arr.slice(0), ok, no);
      if(r && r.then) r.then(ok, no);
    });
    d.buf = buf; d.name = file.name; d.note = ""; d.pos = 0; d.cue = 0; d.motor = false;
    d.peaks = peaksOf(buf);
    d.bpm = -1; d.bands = null; d.cues = [null,null,null];
    d.loopOn = false; d.loopBars = 0; send(d, { t:"loop", on:false, a:0, b:0 });
    d.trackKey = (file.name||"?") + "·" + (file.size||0) + "·" + Math.round(buf.duration*100);
    if(!opts || !opts.restore) crateSpun(d, file, arr);
    const known = marksLoad(d);
    setTimeout(()=>{
      try{ analyse(d); }catch(e){ d.bpm = 0; }
      if(known){ d.bpm = known.bpm; d.beat0 = known.beat0; d.cues = known.cues || [null,null,null]; }
      else marksSave(d);
      paintDeck(d); drawWave(d); drawZoom(d);
    }, 30);
    const L = Float32Array.from(buf.getChannelData(0));
    const R = Float32Array.from(buf.numberOfChannels>1 ? buf.getChannelData(1) : buf.getChannelData(0));
    send(d, { t:"buf", L:L, R:R, sr:buf.sampleRate });
    if(opts && opts.pos > 0 && opts.pos < buf.length-3){ d.pos = d.cue = opts.pos; send(d, { t:"seek", v:d.pos }); }
    drawWave(d); drawZoom(d); paintDeck(d);
  }catch(e){
    d.note = t("nope").replace("%s", file.name); paintDeck(d);
    setTimeout(()=>{ if(d.note){ d.note=""; paintDeck(d); } }, 9000);
  }
}
/* ══ AOG-DECKS-PRO-V1 (2026-09-23) — WHAT THE DECK KNOWS ABOUT THE RECORD ═════
   One pass over the song, once, at load. It gives three things no turntable can
   give you and every DJ wants: the shape of the music split into bass, middle
   and top (so the waveform shows you where the drums are instead of a green
   blob), the tempo, and where beat one sits. Everything after this — the grid,
   the beat loops, SYNC — is arithmetic on those three. ══════════════════════ */
function peaksOf(buf){
  const W = 1200, a = buf.getChannelData(0), step = Math.max(1, Math.floor(a.length/W)), out = new Float32Array(W);
  for(let x=0;x<W;x++){
    let m=0; const o=x*step, e=Math.min(a.length, o+step);
    for(let i=o;i<e;i+=4){ const v=a[i]<0?-a[i]:a[i]; if(v>m) m=v; }
    out[x]=m;
  }
  return out;
}
function analyse(d){
  const buf = d.buf; if(!buf) return;
  const a = buf.getChannelData(0), sr = buf.sampleRate, n = a.length;
  const W = 1200, step = n/W;
  const lo = new Float32Array(W), mid = new Float32Array(W), hi = new Float32Array(W);
  const kLo = 1 - Math.exp(-2*Math.PI*180/sr), kHi = 1 - Math.exp(-2*Math.PI*3200/sr);
  const hop = Math.max(1, Math.round(sr/400)), frames = Math.floor(n/hop);
  const env = new Float32Array(frames);
  let f1 = 0, f2 = 0, acc = 0, cnt = 0, fi = 0;
  for(let i=0;i<n;i++){
    const x = a[i];
    f1 += kLo*(x - f1);            /* bass */
    f2 += kHi*(x - f2);            /* bass + middle */
    const c = (i/step)|0;
    const al = f1<0?-f1:f1, am = Math.abs(f2-f1), ah = Math.abs(x-f2);
    if(c<W){
      if(al>lo[c]) lo[c]=al;
      if(am>mid[c]) mid[c]=am;
      if(ah>hi[c]) hi[c]=ah;
    }
    acc += x*x; cnt++;
    if(cnt===hop){ if(fi<frames) env[fi++] = Math.sqrt(acc/hop); acc = 0; cnt = 0; }
  }
  d.bands = { lo:lo, mid:mid, hi:hi };
  /* the beat is where the sound GROWS: rising energy, lined up with itself */
  const on = new Float32Array(frames);
  for(let i=1;i<frames;i++){ const dv = env[i]-env[i-1]; on[i] = dv>0?dv:0; }
  const fps = sr/hop;
  let best = 0, bestBpm = 0;
  for(let bpm=72; bpm<=176; bpm+=0.25){
    const lag = Math.round(60/bpm*fps);
    if(lag < 2 || lag*3 >= frames) continue;
    let sum = 0;
    for(let i=0; i+lag<frames; i++) sum += on[i]*on[i+lag];
    sum /= (frames - lag);
    if(sum > best){ best = sum; bestBpm = bpm; }
  }
  if(!bestBpm || frames < 200){ d.bpm = 0; d.beat0 = 0; return; }
  /* the coarse pass lands within a quarter of a beat per minute; this one walks
     around that answer in fiftieths, because a tempo that is 0.6% out drifts a
     tenth of a second across sixteen bars and the grid stops looking honest. */
  let fine = bestBpm, fineBest = best;
  for(let bpm=bestBpm-2; bpm<=bestBpm+2; bpm+=0.02){
    const lagf = 60/bpm*fps, l0 = Math.floor(lagf), fr = lagf - l0;
    if(l0 < 2 || l0*3 >= frames) continue;
    let sum = 0;
    for(let i=0; i+l0+1<frames; i++) sum += on[i]*(on[i+l0]*(1-fr) + on[i+l0+1]*fr);
    sum /= (frames - l0);
    if(sum > fineBest){ fineBest = sum; fine = bpm; }
  }
  bestBpm = fine;
  const period = 60/bestBpm*fps;
  let bo = 0, bs = -1;
  for(let off=0; off<period; off+=1){
    let sum = 0;
    for(let k=0; off + k*period < frames; k++) sum += on[Math.round(off + k*period)] || 0;
    if(sum > bs){ bs = sum; bo = off; }
  }
  d.bpm = Math.round(bestBpm*100)/100;
  d.beat0 = bo/fps;
}
async function buildTape(){
  if(TAPE.node || !actx) return;
  const keep = (L,R)=>{ TAPE.chunks.push([L,R]); TAPE.frames += L.length; };
  if(workletReady){
    try{
      await workletReady;
      const n = new AudioWorkletNode(actx, "aog-tape", { numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[2] });
      n.port.onmessage = (e)=>{ if(e.data && e.data.t==="chunk") keep(e.data.L, e.data.R); };
      TAPE.node = n;
    }catch(e){ TAPE.node = null; }
  }
  if(!TAPE.node){
    const n = actx.createScriptProcessor(4096, 2, 2);
    n.onaudioprocess = (e)=>{
      if(!TAPE.on) return;
      keep(Float32Array.from(e.inputBuffer.getChannelData(0)),
           Float32Array.from(e.inputBuffer.getChannelData(1) || e.inputBuffer.getChannelData(0)));
    };
    TAPE.node = n;
  }
  /* it hangs off the master and ends in silence: a node only runs if it is
     connected to the destination, and we are not playing the mix twice. */
  TAPE.sink = actx.createGain(); TAPE.sink.gain.value = 0;
  master.connect(TAPE.node); TAPE.node.connect(TAPE.sink); TAPE.sink.connect(actx.destination);
}
function armTape(on){
  if(!TAPE.node) return;
  TAPE.on = on;
  if(TAPE.node.port) TAPE.node.port.postMessage({ t:"arm", on:on });
}
async function recToggle(){
  ctx(); await buildTape();
  if(!TAPE.on){
    TAPE.chunks = []; TAPE.frames = 0; TAPE.t0 = performance.now();
    armTape(true);
    TAPE.timer = setInterval(()=>{
      const sec = (performance.now()-TAPE.t0)/1000;
      const el = document.getElementById("recTime"); if(el) el.textContent = clock(sec);
      if(sec >= TAPE_MAX_SEC){ recToggle(); const h=document.getElementById("recHint"); if(h) h.textContent = t("full"); }
    }, 200);
  } else {
    armTape(false);
    clearInterval(TAPE.timer); TAPE.timer = null;
    setTimeout(()=>{ finishTake(); }, 120);   /* let the last chunk arrive */
  }
  paintTape();
}
function finishTake(){
  if(!TAPE.frames){ paintTape(); return; }
  const n = TAPE.frames, L = new Float32Array(n), R = new Float32Array(n);
  let o = 0;
  TAPE.chunks.forEach(c=>{ L.set(c[0], o); R.set(c[1], o); o += c[0].length; });
  TAPE.chunks = []; TAPE.frames = 0;
  const wav = wavBlob(L, R, actx.sampleRate);
  TAPE.takes.unshift({ n: ++TAPE.n, sec: n/actx.sampleRate, url: URL.createObjectURL(wav), blob: wav });
  while(TAPE.takes.length > 6){ const old = TAPE.takes.pop(); URL.revokeObjectURL(old.url); }
  paintTape();
}
/* a 16-bit stereo WAV: it opens in anything, on any machine, with no codec to
   argue about — which matters when a student mails it to themselves. */
function wavBlob(L, R, sr){
  const n = L.length, bytes = 44 + n*4, ab = new ArrayBuffer(bytes), v = new DataView(ab);
  const str = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  str(0,"RIFF"); v.setUint32(4, bytes-8, true); str(8,"WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr*4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true);
  str(36,"data"); v.setUint32(40, n*4, true);
  let o = 44;
  for(let i=0;i<n;i++){
    let l = L[i], r = R[i];
    l = l>1?1:l<-1?-1:l; r = r>1?1:r<-1?-1:r;
    v.setInt16(o, l*32767, true); v.setInt16(o+2, r*32767, true); o += 4;
  }
  return new Blob([ab], { type:"audio/wav" });
}
function paintTape(){

/* ══ AOG-DECKS-CRATE-V1 (2026-09-25) — THE RECORD CRATE ══════════════════════
   Jimmy: "make it so the turntable saves what was last used (if the tab is
   closed) … a 'Previously spun' or a crate for upcoming music so it can go
   smoother." Three shelves, all in IndexedDB on this computer, never sent:
   · what is on each platter, and where the needle was, so a closed tab opens
     with the same two records on, parked where you left them;
   · the last eight records you played, one tap to put any back on a deck;
   · UP NEXT — songs you line up before the set, played in order. ══════════ */
const CRATE = { db:"aog-crate", store:"crate", prev:[], next:[], lib:[], max:8 };
function crateDb(){
  return new Promise((ok, no)=>{
    if(!window.indexedDB){ no(new Error("no indexedDB")); return; }
    const r = indexedDB.open(CRATE.db, 1);
    r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains(CRATE.store)) r.result.createObjectStore(CRATE.store); };
    r.onsuccess = ()=>ok(r.result); r.onerror = ()=>no(r.error);
  });
}
async function crateGet(k){
  try{
    const db = await crateDb();
    return await new Promise(ok=>{
      const q = db.transaction(CRATE.store, "readonly").objectStore(CRATE.store).get(k);
      q.onsuccess = ()=>{ db.close(); ok(q.result || null); }; q.onerror = ()=>{ db.close(); ok(null); };
    });
  }catch(e){ return null; }
}
async function cratePut(k, v){
  try{
    const db = await crateDb();
    await new Promise(ok=>{
      const tx = db.transaction(CRATE.store, "readwrite");
      if(v == null) tx.objectStore(CRATE.store).delete(k); else tx.objectStore(CRATE.store).put(v, k);
      tx.oncomplete = ()=>{ db.close(); ok(); }; tx.onerror = tx.onabort = ()=>{ db.close(); ok(); };
    });
  }catch(e){}
}
const crateId = f => (f.name||"?") + "·" + (f.size||0);
function crateFile(r){ return new File([r.blob], r.name, { type:r.blob.type||"" }); }
/* AOG-DECKS-LIBRARY-V1 (2026-09-26) — Jimmy: "the music comes and goes ... make it a permanent
   fixture ... installed in the Load a song dock." iPhone hands the page a borrowed file that can
   vanish later, so every song is copied into the page's own storage the moment it arrives, and
   every song ever added lives in the library that Load a song opens. */
async function crateCopy(file, arr){
  const buf = arr || await file.arrayBuffer();
  return new Blob([buf.slice ? buf.slice(0) : buf], { type:file.type||"" });
}
async function crateInstall(file, arr){
  const rec = { id:crateId(file), name:file.name, blob:await crateCopy(file, arr), at:Date.now() };
  CRATE.lib = [rec].concat(CRATE.lib.filter(x=>x.id!==rec.id)).slice(0, 60);
  cratePut("lib", CRATE.lib); paintDocks();
  return rec;
}
async function crateSpun(d, file, arr){
  const rec = await crateInstall(file, arr);
  cratePut("deck-"+d.id, rec);
  CRATE.prev = [rec].concat(CRATE.prev.filter(x=>x.id!==rec.id)).slice(0, CRATE.max);
  cratePut("prev", CRATE.prev);

}
function crateForget(d){ cratePut("deck-"+d.id, null); try{ localStorage.removeItem("aog.decks.pos."+d.id); }catch(e){} }
function crateKeepPlace(){
  decks.forEach(d=>{ try{ if(d.buf) localStorage.setItem("aog.decks.pos."+d.id, String(Math.round(d.pos||0))); }catch(e){} });
}
async function crateOpen(){
  CRATE.prev = (await crateGet("prev")) || [];
  CRATE.next = (await crateGet("next")) || [];
  CRATE.lib = (await crateGet("lib")) || [];
  /* songs saved before the library existed join it */
  CRATE.next.concat(CRATE.prev).forEach(r=>{ if(r && r.blob && !CRATE.lib.some(x=>x.id===r.id)) CRATE.lib.push(r); });
  paintCrate(); paintDocks();
  /* the two records that were on when the tab closed go back on, stopped */
  for(const d of decks){
    const r = await crateGet("deck-"+d.id);
    if(!r || !r.blob || d.buf) continue;
    let pos = 0; try{ pos = +localStorage.getItem("aog.decks.pos."+d.id) || 0; }catch(e){}
    await loadFile(d, crateFile(r), { restore:true, pos:pos });
  }
}

/* AOG-DECKS-FIND-V1 (2026-09-26) — Jimmy: "when you go to load a song [there]

/* what a deck remembers about a record it has seen before: the tempo it worked
   out, where beat one is, and the marks you left on it. Kept by name and size,
   so the same file dropped tomorrow is ready the moment it loads. */
const MARKS = "aog.decks.marks.v1";
function marksAll(){
  try{ return JSON.parse(localStorage.getItem(MARKS) || "{}"); }catch(e){ return {}; }
}
function marksSave(d){
  if(!d.trackKey) return;
  try{
    const all = marksAll();
    all[d.trackKey] = { bpm:d.bpm, beat0:d.beat0, cues:d.cues, at:Date.now() };
    const keys = Object.keys(all);
    if(keys.length > 40){
      keys.sort((a,b)=>(all[a].at||0)-(all[b].at||0)).slice(0, keys.length-40).forEach(k=>delete all[k]);
    }
    localStorage.setItem(MARKS, JSON.stringify(all));
  }catch(e){}
}
function marksLoad(d){
  if(!d.trackKey) return null;
  const m = marksAll()[d.trackKey];
  return (m && m.bpm > 0) ? m : null;
}
function pitchText(d){
  const pct = (d.pitch-1)*100;
  return (pct>=0?"+":"") + pct.toFixed(pct>9||pct<-9?0:1) + "%";
}
function touchLabel(){
  return t("touch")+": "+(touch==="fine"?t("touchFine"):touch==="normal"?t("touchNormal"):t("touchVinyl"));
}
function setMix(){
  const x = +document.getElementById("xf").value;
  let a = Math.cos(x*Math.PI/2), b = Math.sin(x*Math.PI/2);
  if(curve==="sharp"){ a = Math.pow(a, 0.16); b = Math.pow(b, 0.16); }   /* a cut fader opens at once */
  if(decks[0].gain) decks[0].gain.gain.value = decks[0].vol * a;
  if(decks[1].gain) decks[1].gain.gain.value = decks[1].vol * b;
}
function drawWave(d){
  const cv = document.getElementById("wave"+d.id);
  if(!cv) return;
  const w = cv.width = (cv.clientWidth*2)||600, h = cv.height = 128;
  const g = cv.getContext("2d");
  g.fillStyle = "#06110c"; g.fillRect(0,0,w,h);
  if(!d.buf || !d.peaks) return;
  /* bass, middle and top in three colors: you can SEE the kick line up */
  const B = d.bands;
  for(let x=0;x<w;x++){
    const i = Math.floor(x/w*(B?B.lo.length:d.peaks.length));
    if(B){
      const bars = [[B.hi[i]*2.2,"#7fc7f5"],[B.mid[i]*1.5,"#c6f7b0"],[B.lo[i],"#f0a35e"]];
      for(let k=0;k<bars.length;k++){
        const m = Math.min(1, bars[k][0]); if(m<=0.002) continue;
        g.strokeStyle = bars[k][1]; g.beginPath();
        g.moveTo(x+.5, h/2 - m*h*0.5); g.lineTo(x+.5, h/2 + m*h*0.5); g.stroke();
      }
    } else {
      const m = d.peaks[i]||0;
      g.strokeStyle = "#c6f7b0"; g.beginPath();
      g.moveTo(x+.5, h/2 - m*h*0.5); g.lineTo(x+.5, h/2 + m*h*0.5); g.stroke();
    }
  }
  const sr = d.buf.sampleRate, dur = d.buf.length;
  if(d.bpm > 0){                              /* a bar line every four beats */
    const barSec = 4*60/d.bpm;
    g.strokeStyle = "rgba(244,226,176,.28)"; g.beginPath();
    for(let tsec=d.beat0; tsec<d.buf.duration; tsec+=barSec){
      const x = (tsec*sr/dur)*w; g.moveTo(x, 0); g.lineTo(x, h*0.14); g.moveTo(x, h*0.86); g.lineTo(x, h);
    }
    g.stroke();
  }
  if(d.loopOn && d.loopB > d.loopA){          /* the loop, lit */
    const x1 = (d.loopA/dur)*w, x2 = (d.loopB/dur)*w;
    g.fillStyle = "rgba(127,199,245,.16)"; g.fillRect(x1, 0, Math.max(2,x2-x1), h);
  }
  d.cues.forEach((c,i)=>{                      /* hot cues */
    if(c==null) return;
    const x = (c/dur)*w;
    g.fillStyle = "#f4a3b0"; g.fillRect(x-1, 0, 3, h*0.2);
    g.font = "bold 16px sans-serif"; g.fillText(String(i+1), x+4, h*0.2);
  });
  const px = (d.pos / dur) * w;
  g.strokeStyle = "#fff"; g.lineWidth = 2; g.beginPath(); g.moveTo(px,0); g.lineTo(px,h); g.stroke(); g.lineWidth = 1;
}
/* the close-up: a second and a half of groove either side of the needle, which
   is where you actually watch a scratch happen */
function drawZoom(d){
  const cv = document.getElementById("zoom"+d.id);
  if(!cv) return;
  const w = cv.width = (cv.clientWidth*2)||600, h = cv.height = 72;
  const g = cv.getContext("2d");
  g.fillStyle = "#0a1410"; g.fillRect(0,0,w,h);
  if(!d.buf) return;
  const a = d.buf.getChannelData(0), sr = d.buf.sampleRate;
  const span = sr * 1.2, start = d.pos - span/2, per = span/w;
  g.strokeStyle = "#7fd6a3"; g.beginPath();
  for(let x=0;x<w;x++){
    const o = Math.floor(start + x*per);
    let m = 0;

/* SYNC holds: every quarter second the locked deck is nudged a whisker in pitch
   until its beat sits on the other deck's beat, then it is left alone. This is
   what stops two records drifting apart after four bars. */
let lastLock = 0;
function syncTick(){
  const now = performance.now();
  if(now - lastLock < 250) return;
  lastLock = now;
  decks.forEach(d=>{
    const o = decks.find(x=>x.id!==d.id);
    if(!d.syncLock || !d.buf || !o.buf || d.bpm<=0 || o.bpm<=0) return;
    if(!d.motor || !o.motor || d.held || o.held) return;
    const want = (o.bpm*o.pitch*o.rpm) / (d.bpm*d.rpm);
    let ratio = want; while(ratio>1.5) ratio/=2; while(ratio<0.6) ratio*=2;
    const beat = 60/d.bpm*d.buf.sampleRate;
    const beatO = 60/o.bpm*o.buf.sampleRate;
    const phase = ((d.pos - d.beat0*d.buf.sampleRate)/beat) % 1;
    const phaseO = ((o.pos - o.beat0*o.buf.sampleRate)/beatO) % 1;
    let err = phase - phaseO;                 /* in beats, -0.5 … 0.5 */
    if(err > 0.5) err -= 1; if(err < -0.5) err += 1;
    const corrected = ratio * (1 - err*0.06); /* a whisper of pitch, never a jump */
    const lo = d.wide?0.5:0.92, hi = d.wide?1.5:1.08;
    const v = Math.max(lo, Math.min(hi, corrected));
    if(Math.abs(v - d.pitch) > 0.0005){
      d.pitch = v; send(d, { t:"pitch", v:v });
      const inp = document.querySelector('[data-speed="'+d.id+'"]'); if(inp) inp.value = String(v);
      const po = document.querySelector('[data-pitchout="'+d.id+'"]'); if(po) po.textContent = pitchText(d);
    }
  });
}
function drawEq(){

    color: i===0 ? "#f0c26e" : "#7fc7f5", label: "DECK "+d.id, labelY: 12+i*12 }); });

function loop(){

  document.querySelectorAll("[data-rev]").forEach(btn=>{

    btn.onpointerdown = async (e)=>{
      const d = deck(); if(!d || !d.buf) return;
      e.preventDefault(); try{ btn.setPointerCapture(e.pointerId); }catch(err){}
      ctx(); await ensureNode(d);
      send(d, { t:"rev", on:true }); btn.classList.add("on");
    };
    const off = ()=>{ const d = deck(); if(!d) return; send(d, { t:"rev", on:false }); btn.classList.remove("on"); };
    btn.onpointerup = off; btn.onpointercancel = off; btn.onpointerleave = off;
  });
  /* TAP — four taps and the deck takes your tempo instead of its own guess */
  document.querySelectorAll("[data-tap]").forEach(btn=>{
    btn.onclick = ()=>{
      const d = decks.find(x=>x.id===btn.getAttribute("data-tap"));
      const now = performance.now();
      if(d.taps.length && now - d.taps[d.taps.length-1] > 2200) d.taps = [];
      d.taps.push(now);
      if(d.taps.length > 5) d.taps.shift();
      if(d.taps.length >= 3){
        const span = (d.taps[d.taps.length-1] - d.taps[0]) / (d.taps.length-1);
        const bpm = 60000/span;
        if(bpm > 60 && bpm < 200){
          d.bpm = Math.round(bpm*100)/100;
          d.beat0 = Math.max(0, d.pos/(d.buf?d.buf.sampleRate:44100)) % (60/d.bpm);
          marksSave(d); paintDeck(d); drawWave(d); drawZoom(d);
        }
      }
    };
  });
  document.querySelectorAll("[data-half],[data-double]").forEach(btn=>{
    const half = btn.hasAttribute("data-half");
    btn.onclick = ()=>{
      const d = decks.find(x=>x.id===btn.getAttribute(half?"data-half":"data-double"));
      if(!d.bpm || d.bpm<=0) return;
      const b = half ? d.bpm/2 : d.bpm*2;
      if(b < 50 || b > 220) return;
      d.bpm = Math.round(b*100)/100; marksSave(d);
      paintDeck(d); drawWave(d); drawZoom(d);
    };
  });
  document.querySelectorAll("[data-echo]").forEach(inp=>{
    inp.oninput = ()=>{
      const d = decks.find(x=>x.id===inp.getAttribute("data-echo"));
      LX.echo[d.id] = +inp.value;
      if(!d.echoSend) return;
      d.echoSend.gain.value = +inp.value * 0.8;
      if(d.echo && d.bpm > 0) d.echo.delayTime.value = Math.min(1.8, (60/d.bpm)*0.75);   /* a dotted eighth */
    };
  });
  document.querySelectorAll("[data-filter]").forEach(inp=>{
    inp.oninput = ()=>{
      const d = decks.find(x=>x.id===inp.getAttribute("data-filter"));
      const v = +inp.value; LX.filt[d.id] = v; if(!d.filt) return;
      if(v < -0.02){ d.filt.type="lowpass"; d.filt.frequency.value = 20000*Math.pow(0.008, -v); }
      else if(v > 0.02){ d.filt.type="highpass"; d.filt.frequency.value = 20*Math.pow(180, v); }
      else { d.filt.type="lowpass"; d.filt.frequency.value = 20000; }
    };
  });
  /* the needle goes where you point it: click or drag either waveform */
  document.querySelectorAll(".wave, .zoom").forEach(cv=>{
    const id = cv.id.replace(/^(wave|zoom)/, "");
    const zoomed = cv.id.indexOf("zoom") === 0;
    let dragging = false;
    const place = (e)=>{
      const d = decks.find(x=>x.id===id); if(!d || !d.buf) return;
      const r = cv.getBoundingClientRect(), f = Math.max(0, Math.min(1, (e.clientX-r.left)/r.width));
      d.pos = zoomed ? Math.max(0, Math.min(d.buf.length-3, d.pos + (f-0.5)*d.buf.sampleRate*1.2))
                     : f*(d.buf.length-3);
      send(d, { t:"seek", v:d.pos });
      drawWave(d); drawZoom(d); paintDeck(d);
    };
    cv.onpointerdown = async (e)=>{
      const d = decks.find(x=>x.id===id); if(!d || !d.buf) return;
      ctx(); await ensureNode(d);
      dragging = true; try{ cv.setPointerCapture(e.pointerId); }catch(err){} place(e);
    };
    cv.onpointermove = (e)=>{ if(dragging) place(e); };
    const up = ()=>{ dragging = false; };
    cv.onpointerup = up; cv.onpointercancel = up;
    cv.style.cursor = "text";
  });
  document.querySelectorAll("[data-setcue]").forEach(btn=>{
    btn.onclick = ()=>{ const d = decks.find(x=>x.id===btn.getAttribute("data-setcue")); if(d.buf){ d.cue = d.pos; LX.setcue[d.id] = true; } };
  });
  document.querySelectorAll("[data-nudge]").forEach(btn=>{
    const deck = ()=>decks.find(x=>x.id===btn.getAttribute("data-nudge"));
    const dir = btn.getAttribute("data-dir")==="1" ? 1.04 : 0.96;
    const down = ()=>{ const d=deck(); if(!d) return; send(d, { t:"pitch", v:d.pitch*dir }); };
    const up = ()=>{ const d=deck(); if(!d) return; send(d, { t:"pitch", v:d.pitch }); };
    btn.onpointerdown = down; btn.onpointerup = up; btn.onpointerleave = up; btn.onpointercancel = up;
  });
  document.querySelectorAll("[data-rpm]").forEach(btn=>{
    btn.onclick = ()=>{
      const d = decks.find(x=>x.id===btn.getAttribute("data-rpm"));
      d.rpm = +btn.getAttribute("data-v");
      send(d, { t:"rpm", v:d.rpm });
      btn.parentNode.querySelectorAll(".rpmb").forEach(b=>b.classList.toggle("on", b===btn));
    };
  });
  document.querySelectorAll("[data-eq]").forEach(inp=>{
    inp.oninput = async ()=>{
      const d = decks.find(x=>x.id===inp.getAttribute("data-eq"));
      ctx(); await ensureNode(d);
      d.eq.set(inp.getAttribute("data-band"), +inp.value);
    };
  });
  document.querySelectorAll("[data-kill]").forEach(btn=>{
    btn.onclick = async ()=>{
      const d = decks.find(x=>x.id===btn.getAttribute("data-kill"));
      ctx(); await ensureNode(d);
      const on = d.eq.kill(btn.getAttribute("data-band"), !d.eq.killed(btn.getAttribute("data-band")));
      btn.classList.toggle("on", on);
    };
  });
  document.querySelectorAll("[data-flat]").forEach(btn=>{
    btn.onclick = async ()=>{
      const d = decks.find(x=>x.id===btn.getAttribute("data-flat"));
      ctx(); await ensureNode(d);
      d.eq.flat();
      document.querySelectorAll('[data-eq="'+d.id+'"]').forEach(i=>{ i.value="0"; });
      document.querySelectorAll('[data-kill="'+d.id+'"]').forEach(b=>b.classList.remove("on"));
      const f=document.querySelector('[data-filter="'+d.id+'"]');
      if(f){ f.value="0"; f.dispatchEvent(new Event("input")); }
    };
  });
  document.querySelectorAll("[data-speed]").forEach(inp=>{
    inp.oninput = ()=>{
      const d=decks.find(x=>x.id===inp.getAttribute("data-speed"));
      d.pitch=+inp.value; send(d, { t:"pitch", v:d.pitch });
      const o=document.querySelector('[data-pitchout="'+d.id+'"]'); if(o) o.textContent = pitchText(d);
    };
  });
  /* WIDE opens the pitch fader from a DJ's ±8% to half speed / one and a half,
     which is where a voice actually changes character. */
  document.querySelectorAll("[data-wide]").forEach(btn=>{
    btn.onclick = ()=>{
      const d = decks.find(x=>x.id===btn.getAttribute("data-wide"));
      d.wide = !d.wide;
      const inp = document.querySelector('[data-speed="'+d.id+'"]');
      if(d.wide){ inp.min="0.5"; inp.max="1.5"; inp.step="0.01"; }
      else { inp.min="0.92"; inp.max="1.08"; inp.step="0.005"; d.pitch = Math.max(0.92, Math.min(1.08, d.pitch)); send(d, { t:"pitch", v:d.pitch }); }
      inp.value = String(d.pitch);
      btn.classList.toggle("on", d.wide);
      const o=document.querySelector('[data-pitchout="'+d.id+'"]'); if(o) o.textContent = pitchText(d);
    };
  });
  document.querySelectorAll("[data-vol]").forEach(inp=>{
    inp.oninput = ()=>{ decks.find(x=>x.id===inp.getAttribute("data-vol")).vol = +inp.value; setMix(); };
  });

  /* ── the hand on the record ──────────────────────────────────────────────
     Angle, not pixels. Where your finger is on the circle is where the groove
     is, so a half turn is 0.9 seconds of music whichever way you go, and how
     FAST you turn is the speed the needle reads at. */
  document.querySelectorAll(".platter").forEach(p=>{
    const d = ()=> decks.find(x=>x.id===p.getAttribute("data-deck"));
    let lastAng = 0, lastT = 0, spun = 0, trail = [];
    function angleOf(e){
      const r = p.getBoundingClientRect();
      return Math.atan2(e.clientY - (r.top + r.height/2), e.clientX - (r.left + r.width/2)) * 180/Math.PI;
    }
    p.onpointerdown = async (e)=>{
      const deck = d(); if(!deck || !deck.buf) return;
      e.preventDefault();
      try{ p.setPointerCapture(e.pointerId); }catch(err){}
      ctx(); await ensureNode(deck);
      lastAng = angleOf(e); lastT = performance.now();
      spun = 0; trail = [{ t:lastT, a:0 }];
      LX.flips[deck.id] = 0; deck._sgn = 0;
      deck.held = true; deck.lastMove = lastT;
      deck.handRate = deck.rate;                    /* you catch it at the speed it is turning */
      send(deck, { t:"hand", on:true, rate:deck.handRate });
    };
    p.onpointermove = (e)=>{
      const deck = d(); if(!deck || !deck.held) return;
      /* every pointer sample the browser collected since the last frame, not just
         the last one — a fast flick is 6 or 8 of these, and dropping them is what
         made quick scratches read as one long smear. */
      const pts = (e.getCoalescedEvents && e.getCoalescedEvents().length) ? e.getCoalescedEvents() : [e];
      for(let i=0;i<pts.length;i++){
        const ev = pts[i];
        const now = (ev.timeStamp && ev.timeStamp > 0) ? ev.timeStamp : performance.now();
        let a = angleOf(ev), da = a - lastAng;
        while(da > 180) da -= 360; while(da < -180) da += 360;   /* the short way round */
        lastAng = a; lastT = now; spun += da;
        trail.push({ t:now, a:spun });
      }
      /* the speed is measured over the last ~70 ms of hand, not over the last
         single event. Event to event, a slow steady pull is mostly jitter — and
         jitter is what made a held-back vocal warble instead of drag. */
      const now = performance.now();
      while(trail.length > 2 && now - trail[0].t > 70) trail.shift();
      const first = trail[0], last = trail[trail.length-1];
      const dt = Math.max(0.012, (last.t - first.t)/1000);
      const inst = ((last.a - first.a)/dt) / DEG_PER_SEC * TOUCH[touch];
      /* slow moves are smoothed harder than fast ones: steadiness where you want
         to hear words, immediacy where you want a cut. */
      const k = Math.abs(inst) < 0.6 ? 0.45 : 0.8;
      deck.handRate = deck.handRate*(1-k) + inst*k;
      if(Math.abs(deck.handRate) > 0.25){ const sg = deck.handRate > 0 ? 1 : -1; if(deck._sgn && sg !== deck._sgn) LX.flips[deck.id]++; deck._sgn = sg; }
      if(deck.handRate > 16) deck.handRate = 16;
      if(deck.handRate < -16) deck.handRate = -16;
      deck.lastMove = now;
      send(deck, { t:"hand", on:true, rate:deck.handRate });
    };
    const up = ()=>{
      const deck = d(); if(!deck || !deck.held) return;
      deck.held = false;
      send(deck, { t:"hand", on:false, rate:0 });               /* let go: the throw carries, the motor takes over */
    };
    p.onpointerup = up; p.onpointercancel = up; p.onlostpointercapture = up;
    /* the same deck from a keyboard: space starts and stops it, the arrows walk
       the needle a tenth of a second at a time. */
    p.onkeydown = async (e)=>{
      const deck = d(); if(!deck || !deck.buf) return;
      if(e.key === " " || e.key === "Enter"){
        e.preventDefault(); ctx(); await ensureNode(deck);
        deck.motor = !deck.motor; send(deck, { t:"motor", on:deck.motor }); paintDeck(deck);
      } else if(e.key === "ArrowLeft" || e.key === "ArrowRight"){
        e.preventDefault(); ctx(); await ensureNode(deck);
        const step = deck.buf.sampleRate * 0.1 * (e.key === "ArrowRight" ? 1 : -1);
        deck.pos = Math.max(0, Math.min(deck.buf.length - 3, deck.pos + step));
        send(deck, { t:"seek", v:deck.pos });
        drawWave(deck); drawZoom(deck); paintDeck(deck);
      }
    };
  });
}

const LKEY = "aog.decks.lessons.v1";
const LX = { dockA:false, setcue:{}, cueHeld:{}, transits:[], side:"", leftAt:0, from:"", crateTake:false, saved:false,
             flips:{A:0,B:0}, filt:{A:0,B:0}, echo:{A:0,B:0}, startPos:{}, lastTick:0, sig:"" };
S.lessons = {}; S.lessonSel = -1;
try{ const raw = JSON.parse(localStorage.getItem(LKEY) || "null"); if(raw){ S.lessons = raw.done || {}; if(raw.sel >= 0) S.lessonSel = raw.sel; } }catch(e){}
try{ const m = /[?&]lesson=(\d+)/.exec(location.search || ""); if(m) S.lessonSel = Math.max(0, Math.min(LESSONS.length-1, +m[1]-1)); }catch(e){}
function lessonsSave(){ try{ localStorage.setItem(LKEY, JSON.stringify({ done:S.lessons, sel:S.lessonSel })); }catch(e){} }
function lessonDone(i){ return LESSONS[i].steps.every(id=>S.lessons[id]); }
function lessonNow(){ for(let i=0;i<LESSONS.length;i++) if(!lessonDone(i)) return i; return LESSONS.length; }
function lessonCur(){ return S.lessonSel >= 0 ? S.lessonSel : Math.min(lessonNow(), LESSONS.length-1); }
function xfNow(){ const x = document.getElementById("xf"); return x ? +x.value : 0.5; }
function effBpm(d){ return d.bpm > 0 ? d.bpm*d.pitch*d.rpm : 0; }
function barsOn(d){ /* bars this deck has played without a stop, at its own tempo */
  if(!d.motor || !d.buf || !d._onAt || effBpm(d) <= 0) return 0;
  return ((performance.now() - d._onAt)/1000) / (240/effBpm(d));
}
function secsOn(d){ return (d.motor && d._onAt) ? (performance.now() - d._onAt)/1000 : 0; }
function transit(test){ return LX.transits.some(test); }
/* the crossfader's journeys: from one side to the other, how long it took, and
   whether the tape was rolling. A blend is a slow one; a cut is a fast one. */
function lessonXf(){
  const v = xfNow(), now = performance.now();
  const side = v < 0.1 ? "A" : v > 0.9 ? "B" : "";
  if(side && LX.side !== side){
    if(LX.from && LX.from !== side && LX.leftAt) LX.transits.push({ from:LX.from, to:side, dur:now-LX.leftAt, at:now, rec:TAPE.on });
    if(LX.transits.length > 12) LX.transits.shift();
    LX.side = side; LX.from = side; LX.leftAt = 0;
  } else if(!side && LX.side){ LX.leftAt = now; LX.side = ""; }
}
const A = ()=>decks[0], B = ()=>decks[1];
const LCHK = {
  l1a:()=>LX.dockA, l1b:()=>!!A().buf, l1c:()=>A().held,
  l2a:()=>A().motor, l2b:()=>secsOn(A()) >= 3, l2c:()=>!A().motor,
  l3a:()=>xfNow() <= 0.05, l3b:()=>{ const v=xfNow(); return v >= 0.44 && v <= 0.56; }, l3c:()=>xfNow() >= 0.95,
  l4a:()=>!!B().buf, l4b:()=>LX.setcue.B && B().buf && B().cue > B().buf.sampleRate*0.5, l4c:()=>LX.cueHeld.B,
  l5a:()=>A().motor && A().bpm > 0, l5b:()=>B().motor && B().bpm > 0, l5c:()=>A().taps.length >= 4,
  l6a:()=>A().pitch >= 1.02, l6b:()=>A().pitch <= 0.98, l6c:()=>Math.abs(A().pitch-1) < 0.003,
  l7a:()=>A().motor && B().motor && A().bpm > 0 && B().bpm > 0, l7b:()=>!A().syncLock && !B().syncLock,
  l7c:()=>A().motor && B().motor && !A().syncLock && !B().syncLock && Math.abs(effBpm(A())-effBpm(B())) <= 2,
  l8a:()=>!document.body.classList.contains("bench-simple"), l8b:()=>!!(B().eq && B().eq.killed("low")),
  l8c:()=>!!(A().eq && A().eq.killed("low") && B().eq && !B().eq.killed("low")),
  l9a:()=>curve === "smooth", l9b:()=>A().motor && B().motor && xfNow() < 0.1,
  l9c:()=>transit(t=>t.from === "A" && t.to === "B" && t.dur >= 4000),
  l10a:()=>B().buf && B().cue > B().buf.sampleRate, l10b:()=>LX.cueHeld.B,
  l10c:()=>A().motor && B().motor && B().buf && B().cue > B().buf.sampleRate && Math.abs((LX.startPos.B||0) - B().cue) < B().buf.sampleRate*0.5,
  l11a:()=>{ const v=xfNow(); return v >= 0.35 && v <= 0.65; }, l11b:()=>A().held, l11c:()=>LX.flips.A >= 2,
  l12a:()=>curve === "sharp", l12b:()=>A().motor && B().motor && xfNow() < 0.1,
  l12c:()=>{ const q = LX.transits.filter(t=>t.dur <= 450); return q.length >= 2 && (q[q.length-1].at - q[q.length-2].at) <= 3000; },
  l13a:()=>barsOn(A()) >= 8, l13b:()=>barsOn(A()) >= 16, l13c:()=>A().loopOn && A().loopBars === 4,
  l14a:()=>LX.filt.A <= -0.4, l14b:()=>LX.echo.A >= 0.3, l14c:()=>Math.abs(LX.filt.A) < 0.05 && LX.echo.A < 0.05,
  l15a:()=>CRATE.next.length >= 3, l15b:()=>LX.crateTake, l15c:()=>!!(A().buf && B().buf),
  l16a:()=>TAPE.on, l16b:()=>transit(t=>t.rec), l16c:()=>TAPE.on && (performance.now()-TAPE.t0)/1000 >= 120,
  l17a:()=>TAPE.takes.length > 0, l17b:()=>LX.saved,
  l17c:()=>{ try{ return localStorage.getItem("aog.decks.lessons.handin") === "1"; }catch(e){ return false; } }
};
/* every ~150 ms: the steps of the lesson on screen, in order — a step only
   counts once the one before it is done, so "put it back at 0" cannot tick
   before the fader has moved. */
function tickLessons(){
  const now = performance.now();
  decks.forEach(d=>{ if(d.motor && !d.held){ if(!d._onAt) d._onAt = now; } else d._onAt = 0; });
  if(now - LX.lastTick < 150) return;
  LX.lastTick = now;
  const m = LESSONS[lessonCur()]; if(!m) return;
  let changed = false;
  for(const id of m.steps){
    if(S.lessons[id]) continue;
    let ok = false; try{ ok = !!LCHK[id](); }catch(e){}
    if(ok){ S.lessons[id] = true; changed = true; }
    break;
  }
  if(changed){ lessonsSave(); paintLessons(); }
}
function lessonsT(en, es){ return S.lang === "es" ? es : en; }
function paintLessons(){
  const box = document.getElementById("lessons"); if(!box) return;
  const es = S.lang === "es", cur = lessonCur(), m = LESSONS[cur], total = LESSONS.length;
  const doneN = LESSONS.filter((x,i)=>lessonDone(i)).length, all = doneN >= total;
  const row = document.getElementById("lessonRow");
  const rowHtml = LESSONS.map((x,i)=>`<button type="button" class="ghost sm${i===cur?" on":""}" data-lesson="${i}" aria-pressed="${i===cur}">${i+1}${lessonDone(i)?" ✓":""} · ${es?x.es:x.en}</button>`).join("");
  if(row.__html !== rowHtml){ row.innerHTML = rowHtml; row.__html = rowHtml;
    row.querySelectorAll("[data-lesson]").forEach(b=>{ b.onclick = ()=>{ S.lessonSel = +b.getAttribute("data-lesson"); lessonsSave(); paintLessons(); }; }); }
  document.getElementById("lKick").textContent = lessonsT("Lessons", "Lecciones") + " · " + doneN + "/" + total;
  const sheet = document.getElementById("lSheet");
  sheet.href = "decks-lessons.html#l" + (cur+1);
  sheet.textContent = lessonsT("Worksheet", "Hoja de trabajo") + " " + (cur+1);
  const steps = m.steps.map(id=>`<li class="lstep${S.lessons[id]?" ok":""}"><span class="lck" aria-hidden="true">${S.lessons[id]?"✓":""}</span><span>${es?LSTEP[id].es:LSTEP[id].en}</span></li>`).join("");
  const done = lessonDone(cur);
  const next = cur+1 < total ? `<button type="button" class="pill" id="lNext">${lessonsT("Next lesson", "Siguiente lección")} →</button>` : "";
  document.getElementById("lessonBody").innerHTML =
    `<p class="mk">${lessonsT("Lesson", "Lección")} ${cur+1} ${lessonsT("of", "de")} ${total}${done?" · ✓":""}</p>
     <h3>${es?m.es:m.en}</h3>
     <p class="lblurb">${es?m.blurb_es:m.blurb_en}</p>
     <ol class="lsteps">${steps}</ol>
     ${done ? `<p class="lok">${all ? lessonsT("All seventeen done. You can run a set.", "Las diecisiete hechas. Ya puedes tocar un set.") : lessonsT("Lesson done.", "Lección hecha.")} ${next}</p>` : ""}`;
  const nb = document.getElementById("lNext"); if(nb) nb.onclick = ()=>{ S.lessonSel = cur+1; lessonsSave(); paintLessons(); };
}
paintChrome(); shell(); paintLessons(); requestAnimationFrame(loop);
checkBench();
crateOpen();
try{ AOGHandoff.listen(function(key){ if(key==="drumbench") checkBench(); }); }catch(e){}
window.addEventListener("focus", checkBench);
</script>
<script>
/* AOG-PGPANEL-V1 - the guide loads only when the bar is opened, and the frame is
   grown to its content so the panel scrolls with the page instead of inside itself. */
(function(){
  var d=document.getElementById("pgPanel"); if(!d) return;
  var f=document.getElementById("pgFrame"); if(!f) return;
  function fit(){
    try{ var b=f.contentDocument&&f.contentDocument.body;
         if(b){ var h=b.scrollHeight; if(h>240) f.style.height=(h+28)+"px"; } }catch(e){}
  }
  d.addEventListener("toggle", function(){
    if(d.open && !f.getAttribute("src")) f.setAttribute("src", f.getAttribute("data-src"));
  });
  f.addEventListener("load", function(){ fit(); setTimeout(fit,250); setTimeout(fit,1200); });
  var t; window.addEventListener("resize", function(){ clearTimeout(t); t=setTimeout(fit,150); });
})();
</script>
<script>/* AOG-MUSIC-TOUCH-V1 — wake Safari's audio on the first touch, every time it sleeps */
(function(){ function wake(){ try{ if(typeof actx!=="undefined"&&actx&&actx.state!=="running") actx.resume(); }catch(e){} }
  ["touchstart","pointerdown","keydown"].forEach(function(t){ document.addEventListener(t, wake, {capture:true, passive:true}); }); })();
/* AOG-SOUND-HANDOFF-V1 — a sound sent from the oscilloscope goes into Up next */
(function(){ if(!/[?&]take=1/.test(location.search)||!window.aogHandoffTake) return;
  setTimeout(function(){ window.aogHandoffTake().then(function(v){ if(!v||!v.blob) return; const f=new File([v.blob], v.name||"scope.wav", {type:"audio/wav"});
    CRATE.next.push({ id:crateId(f), name:f.name, blob:f, at:Date.now() }); cratePut("next", CRATE.next); paintCrate(); }); }, 1200); })();
</script>
