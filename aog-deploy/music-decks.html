<meta charset="utf-8"><style id="aog-first-paint">/* AOG-ONE-PAINT-V1 (2026-09-27) — Jimmy: moving between units was "very choppy, makes me sick". The page now shows once, fully built: it waits on its paper colour until the shared scripts and fonts are in (aog-sketch.js adds .aog-ready), and never longer than ~1 s even if a script fails. No fade, no motion. */html{background:#F7F2E6}html[data-theme="dark"]{background:#0A1E33}html:not(.aog-ready) body{visibility:hidden;animation:aogOnePaint 0s linear 1.1s forwards}@keyframes aogOnePaint{to{visibility:visible}}@media print{html:not(.aog-ready) body{visibility:visible;animation:none}}/* AOG-DECKS-KEYS-V1: the keys line shows on a computer with a mouse, and anywhere once a key has been pressed */
.dk-keys{display:none}
@media (hover:hover) and (pointer:fine){ .dk-keys{display:block} }
html.aog-keys .dk-keys{display:block}
</style><script>/* AOG-LIGHT-START-V1 — Jimmy: "All pages should start in light mode." Light unless this site was switched to dark. */(function(){var h=document.documentElement;if(!h.getAttribute("data-theme"))h.setAttribute("data-theme","light");})();</script>

</script>
<title>The Turntables — Architecture of Grace</title>
<meta name="description" content="Three platters with weight and a mixer. Play the records made right here or load a song from this computer, scratch it, mix it, and record the take as a .wav. The song never leaves.">
<link rel="canonical" href="https://architectureofgrace.org/decks">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A1E33">
<link rel="icon" href="/favicon.ico" sizes="any">
<!-- AOG-DECKS-V1 (2026-09-22) — Jimmy: turntables a student can load a song onto, scratch, and mix.
     Local file only. Nothing is uploaded. We do not ship songs. Classroom volume. -->
<!-- AOG-DJ-V1 (2026-10-04) — Jimmy's DJs: a Chicago house DJ (long blends, extended grooves, the bass swap),
     a sampling DJ (records chopped into pads, played in time, slip and censor), a techno DJ (three decks,
     a three-channel mixer, effects in beats). Three decks, a mixer with a 3-band isolator EQ and kills, a
     filter and beat-timed echo, reverb and flanger on every channel, SYNC to a MASTER deck, 8 pads a deck,
     beat loops, and four records made on the page (aog-dj.js). On a phone: one deck at a time, from a menu. -->
<style>
:root {
  --bg:#f4f0e6; --card:#fffcf7; --ink:#1a232c; --muted:#5c6670; --line:#ddd8cc;
  --steel:#2f5c6b; --steel-fg:#f4f8f9; --chip:#efebe3; --lamp:#d9a84e;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
}
.dark,[data-theme="dark"] {
  --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
  --steel:#7fb4c7; --steel-fg:#14181e; --chip:#2a313c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans)}
h1{font-family:var(--display);font-weight:600;letter-spacing:-.02em;font-size:clamp(1.5rem,4vw,2.3rem);margin:.2rem 0 .4rem}
/* AOG-DECKS-NAV-V1 (2026-09-26) — Jimmy: "the drum machine link should be at the top, or at least match the drum
   machine page and vice versa." The same activity row the drum machine has, with the drum machine one tap away. */
.nav{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin:1rem 0 .2rem;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;min-height:44px;display:inline-flex;align-items:center;padding:0 .75rem;text-decoration:none;color:var(--muted);font-weight:600;font-size:.9rem;border-bottom:2px solid transparent;margin-bottom:-2px}
.nav a.on{color:var(--ink);border-color:var(--accent,#c45c26)}
.wrap{max-width:1100px;margin:0 auto;padding:max(1.1rem,env(safe-area-inset-top)) 1rem 4rem}
header{display:flex;justify-content:space-between;align-items:center;gap:.75rem;margin-bottom:.6rem}
.brand{font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.tools{display:flex;gap:.5rem}
.pill{min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 .9rem;font-weight:600;display:inline-flex;align-items:center}
button,label.file{font:inherit;cursor:pointer;touch-action:none}
.kicker{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.lead{max-width:66ch;color:var(--muted)}
/* AOG-DECKS-FIT-V1 (2026-09-26): Jimmy's iPhone showed Deck B wider than the
   screen once a song loaded. The waveform is drawn at twice its width, and a
   grid column of plain 1fr lets that picture push the column wider every
   redraw. minmax(0,1fr) and min-width:0 keep each deck the width of the screen. */

/* ══ AOG-DECKS-SIMPLE-V1 (2026-09-26) — same recipe as the drum machine. SIMPLE BENCH (default):
   Load, Take it off, Start, CUE, the platter, Speed and Volume per deck; the crossfader and Record.
   FULL BENCH brings back nudge, the close-up groove, and the mixer's EQ, kills, filter and effects.
   Sliders are colour-coded by job: gold speed, white volume, green EQ, blue filter and effects. ═══ */
/* Jimmy, 2026-09-26: keep Set cue, the hot cues, loops, SYNC, BPM, KEY / SLIP / REV / TAP / ½× / 2× on the Simple bench too.
   Simple now hides only the mixing layer: nudge, filter, effects, EQ and the kills. */
body.bench-simple .deck .zoom,
body.bench-simple .deck .row.nud,body.bench-simple .deck [data-wide],
body.bench-simple .strip .eqk,body.bench-simple .strip .flt,body.bench-simple .strip .fxbox,body.bench-simple .strip [data-flat],
body.bench-simple .xrow #curveBtn,body.bench-simple .xrow #noiseBtn,body.bench-simple .xrow #touchBtn,body.bench-simple .eqwrap{display:none}
body.bench-simple .deck .row .file,body.bench-simple .deck .row .go{min-height:52px;font-size:1.02rem;padding:0 1.1rem}
body.bench-simple .deck .row .ghost{min-height:48px}
.deck label.knob:has([data-speed]){color:#f0c26e}.deck [data-speed]{accent-color:#f0c26e}
.strip label.knob:has([data-vol]){color:#f4efe4}.strip [data-vol]{accent-color:#f4efe4}
.strip label.knob:has([data-eq]){color:#9fd4a0}.strip [data-eq]{accent-color:#9fd4a0}
.strip label.knob:has([data-filter]),.strip label.knob:has([data-fxamt]){color:#7fc7f5}.strip [data-filter],.strip [data-fxamt]{accent-color:#7fc7f5}

/* ══ AOG-DJ-LAYOUT-V1 (2026-10-04) — iPhone first: one deck (or the mixer) at a time, picked from a menu
   (CLAUDE.md: four choices are a drop-down). An iPad or a computer shows the three decks side by side,
   the mixer under them. ═══════════════════════════════════════════════════════════════════════════ */
.viewpick{display:none;margin:.7rem 0 0}
.viewpick .decktabs{display:flex;gap:.4rem}
.viewpick .aogdd{margin:0}
.viewpick .aogdd-lab{flex:0 0 auto!important;min-width:0!important;margin-right:.3rem;color:var(--ink)}
.viewpick .aogdd-sel{flex:1 1 auto!important;min-width:0!important;width:100%}
.decks{display:grid;gap:1rem;margin-top:1rem;grid-template-columns:minmax(0,1fr)}
.deck{min-width:0}
@media (max-width:700px){
  .viewpick{display:block}
  body[data-decktab="A"] #deckB,body[data-decktab="A"] #deckC,body[data-decktab="A"] #mixer,
  body[data-decktab="B"] #deckA,body[data-decktab="B"] #deckC,body[data-decktab="B"] #mixer,
  body[data-decktab="C"] #deckA,body[data-decktab="C"] #deckB,body[data-decktab="C"] #mixer,
  body[data-decktab="mix"] .decks{display:none}
  body[data-decktab="mix"] #mixer{margin-top:.8rem}
}
/* ══ AOG-DJ-DESK-V1 (2026-10-08) — Jimmy: "There is a LOT of stuff going on." "I like the option of have the fader in
   the middle and the different options for the two records but using three." An iPad or a computer now shows TWO decks,
   the third one tap away (A · B, A · C, B · C). The deck that is off the desk keeps playing, with its song, cues, loop
   and pitch: it is the same deck, just not on the desk. From 960 px the two decks and a mixer bay are one chassis.
   The phone keeps its Show menu (AOG-DJ-LAYOUT-V1). ═══════════════════════════════════════════════════════════ */
.pairbar{display:none;flex-wrap:wrap;align-items:center;gap:.5rem .9rem;margin:.8rem 0 0}
.pairbar .pairs{display:inline-flex;gap:.4rem}
.pairbar .pill{min-width:72px;justify-content:center;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.pairbar .pill.on{background:#f0c26e;color:#2a1a08;border-color:#f0c26e}   /* the Simple bench's gold pill */
.pairbar .waiting{margin:0;color:var(--muted);font-size:.92rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 12rem}
.pairbar .waiting b{color:var(--ink);font-weight:700}
.bay{display:none}
.dmore{margin-top:.55rem;border-top:1px solid rgba(255,255,255,.1)}
.dmore>summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:700;letter-spacing:.06em;color:#c9bfae;list-style:none}
.dmore>summary::-webkit-details-marker{display:none}
.dmore>summary::marker{content:""}
.dmore>summary::before{content:"\25B8";font-size:.8rem}
.dmore[open]>summary::before{content:"\25BE"}
.dmore .padhead{margin:.1rem 0 0}
.deck .row.perf{gap:.35rem}
.deck{container-type:inline-size}
@container (min-width:380px){ .deck .padgrid{grid-template-columns:repeat(8,minmax(0,1fr));gap:4px} }   /* eight across while a pad is still 44 px wide */
@media (min-width:701px){
  .pairbar{display:flex}
  .decks{grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
  body[data-pair="AB"] #deckC,body[data-pair="AC"] #deckB,body[data-pair="BC"] #deckA,
  body[data-pair="AB"] #stripC,body[data-pair="AC"] #stripB,body[data-pair="BC"] #stripA{display:none}
  .decks .deck{padding:11px}
  .deck .row{gap:.35rem}
  /* the record: a wrap of up to 200 px, REV in the flow under its bottom-right edge, never on the vinyl */
  .decks .deck .platter-wrap{width:min(200px,100%);margin:.6rem auto .5rem;flex-direction:column;align-items:stretch}
  .decks .deck .platter{width:100%}
  .decks .deck .platter-wrap .revc{position:static;align-self:flex-end;margin-top:8px}
  /* the mixer under the two decks, one row: left channel, the crossfader, right channel */
  #mixer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:.6rem;align-items:start}
  .mixer>*{grid-column:1 / -1}
  .mixer .strips{display:contents}
  .mixer .strip{grid-row:2}
  .mixer .xfade{grid-column:2;grid-row:2;margin:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center}
  body[data-pair="AB"] #stripA,body[data-pair="AC"] #stripA,body[data-pair="BC"] #stripB{grid-column:1}
  body[data-pair="AB"] #stripB,body[data-pair="AC"] #stripC,body[data-pair="BC"] #stripC{grid-column:3}
  .mixer>h2{grid-row:1}
  .mixer .xrow,.mixer .eqwrap,.mixer .rechint{grid-row:auto}
  body.bench-simple #mixH,body.bench-simple .strip .side{display:none}
}
@media (min-width:701px) and (max-height:860px){ .deck .wave{height:48px} }
@media (min-width:960px){
  /* one chassis: the two decks and the mixer bay are one object, no paper between them */
  .decks.stage{
    display:grid;grid-template-columns:minmax(0,1fr) 168px minmax(0,1fr);gap:0;align-items:stretch;
    background:radial-gradient(140% 80% at 50% -30%,#4a545f,#171c22 64%);
    border:1px solid #0c0f13;border-radius:22px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.28);overflow:hidden;
  }
  .decks.stage .deck{background:transparent;border:0;box-shadow:none;border-radius:0;grid-row:1;padding:14px 13px}
  body[data-pair="AB"] #deckA,body[data-pair="AC"] #deckA,body[data-pair="BC"] #deckB{grid-column:1}
  body[data-pair="AB"] #deckB,body[data-pair="AC"] #deckC,body[data-pair="BC"] #deckC{grid-column:3}
  .decks.stage .deck>.meter{display:none}            /* the bay's meters show each channel's level */
  .decks.stage .bay{display:grid}
  /* the bay holds the volumes and the crossfader, so the mixer under the chassis keeps Record (and, on the
     Full bench, the EQ, kills, filter and effects of the two decks on the desk) */
  .mixer .xfade{display:none}
  body.bench-simple .mixer .strip{display:none}
  body:not(.bench-simple) .mixer .strip [data-vol]{accent-color:#f4efe4}
}

/* ── the mixer bay: a recess in the chassis, the height of the decks ── */
.bay{grid-column:2;grid-row:1;grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;gap:6px 4px;
  padding:92px 8px 16px;background:rgba(0,0,0,.34);
  box-shadow:inset 1px 0 0 rgba(255,255,255,.1),inset -1px 0 0 rgba(255,255,255,.1),inset 2px 0 6px rgba(0,0,0,.45),inset -2px 0 6px rgba(0,0,0,.45);color:#f4e2b0}
.bch{display:contents}
.bch .blet{grid-row:1;text-align:center;font-size:1rem;font-weight:800;letter-spacing:.16em;padding-left:.16em;color:#f4e2b0;line-height:48px;height:48px}
.bfw{grid-row:2;display:flex;justify-content:center;align-items:stretch;gap:4px;min-height:160px}
body[data-pair="AB"] [data-bch="A"]>*,body[data-pair="AC"] [data-bch="A"]>*,body[data-pair="BC"] [data-bch="B"]>*{grid-column:1}
body[data-pair="AB"] [data-bch="B"]>*,body[data-pair="AC"] [data-bch="C"]>*,body[data-pair="BC"] [data-bch="C"]>*{grid-column:2}
body[data-pair="AB"] [data-bch="C"],body[data-pair="AC"] [data-bch="B"],body[data-pair="BC"] [data-bch="A"]{display:none}
.bticks{flex:0 0 14px;margin:9px 0;background:repeating-linear-gradient(180deg,#f4e2b0 0 1px,transparent 1px 10%);opacity:.75}
.bfader{flex:0 0 40px;position:relative;touch-action:none;cursor:ns-resize}
.bfader::before{content:"";position:absolute;left:16px;width:8px;top:4px;bottom:4px;border-radius:4px;background:#050607;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08)}
.bcap{position:absolute;left:0;width:40px;height:18px;border-radius:3px;bottom:calc(var(--v,.8) * (100% - 18px));pointer-events:none;
  background:linear-gradient(180deg,transparent 8px,#2a2622 8px 10px,transparent 10px),linear-gradient(180deg,#f7f3ea,#c4bdb0 50%,#eee8dc);
  box-shadow:0 3px 4px rgba(0,0,0,.6),inset 0 1px 0 #fff}
.bfader input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none}
.bfader:has(input:focus-visible) .bcap{outline:3px solid #f4e2b0;outline-offset:2px}
.bmeter{flex:0 0 6px;margin:4px 0;border-radius:3px;background:#0b0e12;overflow:hidden;display:flex;align-items:flex-end}
.bmeter i{display:block;width:100%;height:100%;background:linear-gradient(0deg,#6fbf8b,#d9a84e 70%,#c4452a);transform-origin:50% 100%;transform:scaleY(0);will-change:transform}
.bxf{grid-row:3;grid-column:1 / -1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px;margin-top:8px}
.bxf b{color:#f4e2b0;font-weight:800;letter-spacing:.16em;font-size:.9rem}
.bxf #xf{height:44px;margin:0;width:100%;-webkit-appearance:none;appearance:none;background:transparent;cursor:ew-resize}
.bxf #xf::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:#050607;box-shadow:inset 0 1px 2px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.08)}
.bxf #xf::-moz-range-track{height:8px;border-radius:4px;background:#050607}
.bxf #xf::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:40px;margin-top:-16px;border-radius:3px;border:0;
  background:linear-gradient(90deg,transparent 8px,#2a2622 8px 10px,transparent 10px),linear-gradient(90deg,#f7f3ea,#c4bdb0 50%,#eee8dc);box-shadow:0 3px 4px rgba(0,0,0,.6)}
.bxf #xf::-moz-range-thumb{width:18px;height:40px;border-radius:3px;border:0;
  background:linear-gradient(90deg,transparent 8px,#2a2622 8px 10px,transparent 10px),linear-gradient(90deg,#f7f3ea,#c4bdb0 50%,#eee8dc)}
.bxf #xf:focus-visible{outline:3px solid #f4e2b0;outline-offset:2px;border-radius:6px}
.deck{
  background:radial-gradient(140% 90% at 50% -10%,#4a545f,#171c22 70%);
  border-radius:20px;padding:14px;color:#efe8dc;border:1px solid #0c0f13;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 16px 36px rgba(0,0,0,.35);
}
.dhead{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.deck h2{margin:.1rem 0 .3rem;font-size:1rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.wave{position:relative;overflow:hidden;width:100%;height:64px;background:#06110c;border-radius:8px;display:block}
.wave img,.zoom img{position:absolute;left:0;top:0;pointer-events:none;max-width:none;-webkit-user-drag:none;user-select:none}
.wave img:not([src]),.zoom img:not([src]){display:none}
.wave .wimg{width:100%;height:100%}
.wave i{position:absolute;top:0;bottom:0;left:0;pointer-events:none}
.wave .wloop{width:0;background:rgba(127,199,245,.22)}
.wave .whead{width:2px;margin-left:-1px;background:#fff;will-change:transform}
.wave .wslip{width:0;margin-left:-1px;border-left:2px dashed rgba(159,212,160,.9);opacity:0;will-change:transform,opacity}
.platter-wrap{display:flex;justify-content:center;margin:.7rem 0;position:relative}
/* AOG-DECKS-REV-CORNER-V1 (2026-10-06) — Jimmy: "Can the Rev button be on bottom right of the turn table?" Held, it plays the
   record backwards; it sits in the platter's bottom-right corner, beside the record, where a hand already is. */
.deck .platter-wrap{margin-bottom:1.1rem}
.deck .platter-wrap .revc{position:absolute;right:0;bottom:-16px;z-index:2;min-height:44px;min-width:58px}
.platter{
  width:min(240px,52vw);aspect-ratio:1;border-radius:50%;position:relative;
  /* AOG-DJ-DESK-V1 §6: the gold ring stays at 63–66%; past it the platter's own dark sidewall, so the disc has an edge */
  background:radial-gradient(circle at 50% 50%, #2a241c 62%, #c4a574 63%, #c4a574 66%, #1a140e 67%, #2e261d 69.2%, #0a0806 70.6%);
  box-shadow:0 16px 18px rgba(0,0,0,.55),0 4px 0 #120e0a;
  cursor:grab;touch-action:none;
}
/* the lamp on the metal ring: masked to the gold ring only, outside the vinyl, so it never turns */
.platter::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 8%, rgba(255,255,255,.75), rgba(255,255,255,0) 46%);
  -webkit-mask:radial-gradient(circle at 50% 50%, transparent 0 63%, #000 63% 66%, transparent 66%);
  mask:radial-gradient(circle at 50% 50%, transparent 0 63%, #000 63% 66%, transparent 66%)}
.platter:active{cursor:grabbing}
/* AOG-DJ-VINYL-LOOK-V1 (2026-10-09) — Jimmy: "I want the turn tables to look like they have VINYL on it." A 12-inch
   record: glossy black, fine grooves, the quiet gaps between songs, a smooth lead-in at the edge and a run-out by
   the label, which is a third of the record across. The light on it stays still while it turns (.sheen, outside
   the vinyl), the way a real record catches a lamp. */
.vinyl{
  position:absolute;inset:7%;border-radius:50%;
  background:
    radial-gradient(circle closest-side, transparent 0 41%, rgba(255,255,255,.05) 41.5% 43.5%, transparent 44%),
    radial-gradient(circle closest-side, transparent 0 56%, #1f1f1f 56.4% 57.6%, transparent 58%,
      transparent 0 69%, #1f1f1f 69.4% 70.4%, transparent 70.8%, transparent 0 82%, #1f1f1f 82.4% 83.2%, transparent 83.6%),
    radial-gradient(circle closest-side, #121212 0 44%, transparent 44% 95%, #1c1c1c 95.5% 98.2%, #060606 99%, transparent 100%),
    repeating-radial-gradient(circle at 50% 50%, #0a0a0a 0 1px, #171717 1px 2px, #0d0d0d 2px 3px);
  box-shadow:inset 0 0 10px 2px rgba(0,0,0,.7),0 0 0 1px #050505;   /* even all round, so it reads the same at any turn */
  will-change:transform;
}
.label{
  position:absolute;inset:30%;border-radius:50%;
  background:conic-gradient(#e7d3a1, #8a6230, #f3e6c8, #6e4a22, #e7d3a1);
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.35),inset 0 0 0 9px rgba(255,255,255,.08);
}
/* AOG-DJ-RECORD-ART-V1 (2026-10-09) — Jimmy: "On the vinyl pad do something with the name or a logo or the company!!!
   … It could be colored vinyl EXCiting". A record on a deck is pressed in colour: the colour of its sleeve in the
   crate, in one of two pressings (see-through colour or swirl; the splatter spots went, Jimmy 2026-10-09). Its label prints the record company
   (Grace Records, this site's own), the record's name and the deck's side. The label turns with the record, so
   the words go round when it plays and stand upright when it is put on. An empty deck keeps the black record. */
.vinyl.v-solid,.vinyl.v-swirl{
  --c1:hsl(var(--vh),78%,52%);--c2:hsl(var(--vh),72%,34%);--c3:hsl(calc(var(--vh) + 150),80%,62%);
  background:
    radial-gradient(circle closest-side, transparent 0 41%, rgba(255,255,255,.14) 41.5% 43.5%, transparent 44%),
    radial-gradient(circle closest-side, transparent 0 56%, rgba(0,0,0,.35) 56.4% 57.6%, transparent 58%,
      transparent 0 69%, rgba(0,0,0,.35) 69.4% 70.4%, transparent 70.8%, transparent 0 82%, rgba(0,0,0,.35) 82.4% 83.2%, transparent 83.6%),
    radial-gradient(circle closest-side, rgba(255,255,255,.18) 0 44%, transparent 44% 95%, rgba(255,255,255,.22) 95.5% 98.2%, rgba(0,0,0,.55) 99%, transparent 100%),
    repeating-radial-gradient(circle at 50% 50%, rgba(0,0,0,.26) 0 1px, rgba(255,255,255,.06) 1px 2px, rgba(0,0,0,.12) 2px 3px),
    var(--press);
}
.vinyl.v-solid{--press:radial-gradient(circle closest-side, var(--c1), var(--c2) 100%)}
.vinyl.v-swirl{--press:conic-gradient(from 20deg, var(--c1), var(--c3) 14%, var(--c2) 30%, var(--c1) 46%, var(--c3) 60%, var(--c2) 78%, var(--c1))}
.label.printed{background:#f6efdf;box-shadow:inset 0 0 0 3px hsl(var(--vh),70%,40%),inset 0 0 0 5px #f6efdf,inset 0 0 0 6px hsl(var(--vh),60%,30%);
  container-type:inline-size;overflow:hidden}
.label.printed .rl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:13% 17% 12%;text-align:center;line-height:1.05;pointer-events:none}
.rl-logo small{display:block;font:800 4.6cqw/1.1 var(--sans);letter-spacing:.14em}
.rl-logo>span{text-align:left}
.rl-logo{display:flex;align-items:center;gap:2cqw;font:800 7.6cqw/1 var(--display);letter-spacing:.05em;color:hsl(var(--vh),65%,26%);white-space:nowrap}
.rl-logo i{font-style:normal;display:inline-grid;place-items:center;width:10cqw;height:10cqw;border-radius:50%;
  background:hsl(var(--vh),65%,26%);color:#f6efdf;font:800 7cqw/1 var(--display)}
.rl-name{font:800 8.4cqw/1.05 var(--sans);color:#1a140e;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.rl-side{font:700 5.4cqw/1 var(--sans);letter-spacing:.08em;color:hsl(var(--vh),65%,26%);margin-top:3%}
.rl-low{display:flex;flex-direction:column;align-items:center;max-width:100%}
/* Jimmy, 2026-10-09: "Some of the text falls off the vinyl. It needs to be a TAD smaller": smaller words, kept off the label's round edge */
/* the lamp on the record: two soft bands of light across the grooves, still while the record turns under them */
.sheen{position:absolute;inset:7%;border-radius:50%;pointer-events:none;z-index:1;
  background:conic-gradient(from 0deg, transparent 0 18deg, rgba(255,255,255,.22) 38deg, rgba(255,255,255,.07) 52deg, transparent 66deg,
    transparent 198deg, rgba(255,255,255,.16) 218deg, rgba(255,255,255,.05) 232deg, transparent 246deg);
  -webkit-mask:radial-gradient(circle closest-side, transparent 0 40%, #000 46% 97%, transparent 99%);
  mask:radial-gradient(circle closest-side, transparent 0 40%, #000 46% 97%, transparent 99%)}
/* the light on the label: over it, not part of the record, so it stays put while the label turns under it */
.dome{position:absolute;inset:32.8%;border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle at 30% 26%, rgba(255,255,255,.42), rgba(255,255,255,.08) 34%, rgba(255,255,255,0) 58%)}
.hole{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:#0b0d10;z-index:2}
.arm{
  position:absolute;right:8%;top:10%;width:8px;height:46%;border-radius:8px;
  background:linear-gradient(90deg,#5d564c,#f2ede3 42%,#b3ab9c 68%,#5a5349);transform-origin:50% 0;transform:rotate(16deg);
  pointer-events:none;z-index:3;will-change:transform;
}
.arm::before{content:"";position:absolute;left:50%;top:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  background:radial-gradient(circle at 38% 34%, #f7f4ee, #9b9385 48%, #2a2622);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.arm::after{content:"";position:absolute;left:-4px;bottom:-7px;width:16px;height:11px;border-radius:2px;   /* the red cartridge on a metal headshell */
  background:linear-gradient(#c4452a,#c4452a) 50% 100%/12px 8px no-repeat,linear-gradient(90deg,#8a8376,#efe9dd 45%,#9a9385)}
.meter{height:8px;border-radius:99px;background:#0b0e12;margin-top:.45rem;overflow:hidden}
.meter i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6fbf8b,#d9a84e,#c4452a);transform-origin:0 50%;transform:scaleX(0);will-change:transform}
.time{font-variant-numeric:tabular-nums;color:#f4e2b0;font-weight:700;margin-left:auto}
.row{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-top:.45rem}
.ghost,.go{
  min-height:44px;border-radius:999px;padding:0 .9rem;font-weight:700;white-space:nowrap;
}
.ghost{background:rgba(0,0,0,.28);color:#efe8dc;border:1px solid rgba(255,255,255,.16)}
.go{background:#c4452a;color:#fff8f3;border:0}
label.file{min-height:44px;border-radius:999px;padding:0 .9rem;display:inline-flex;align-items:center;background:#efe8dc;color:#1a140e;font-weight:700}
label.file input{display:none}
button.file{min-height:44px;border-radius:999px;padding:0 .9rem;display:inline-flex;align-items:center;background:#efe8dc;color:#1a140e;font-weight:700;border:0}
.dock{margin:.6rem 0;padding:.8rem;border-radius:14px;background:#1a140e;border:1px solid #5a4630}
.dock[hidden]{display:none}
.dockhd{display:flex;align-items:flex-start;justify-content:space-between;gap:.6rem}
.dockhd .dockh{flex:1}
.dockx{flex:none;min-height:44px;padding:.4rem .9rem;border-radius:999px;border:1px solid #8a6d4a;background:#2a2016;color:#f5ead8;font:inherit;font-weight:700;cursor:pointer}
.dockh,.dockempty{margin:0 0 .5rem;color:#efe8dc;font-size:.95rem}
.docklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.45rem;max-height:260px;overflow-y:auto;overscroll-behavior:contain}
.dsong{min-height:44px;border-radius:10px;border:1px solid #5a4630;background:#2a2016;color:#f4ecdc;font-weight:700;text-align:left;padding:.4rem .7rem;overflow:hidden}
.dsong span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsong.rm{border-color:#c0523a;background:#3a1e16}
.dsong.rm span::before{content:"";display:inline-block;width:.9em;height:.9em;margin-right:.3em;vertical-align:-.1em;background:url(/img/sketch/2715.webp) center/contain no-repeat;filter:invert(1) brightness(1.9)} /* pencil cross */
.dockrow{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.ithelp{margin-top:.7rem;color:#efe8dc;font-size:.92rem;line-height:1.45}
.ithelp summary{cursor:pointer;min-height:44px;display:list-item;padding:.6rem 0;font-weight:700;color:#f5ead8}
.ithelp p{margin:0 0 .4rem}
.ithelp ul{margin:0;padding-left:1.2rem;display:grid;gap:.35rem}
.song{font-size:.85rem;color:#c9bfae;min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 0 .3rem}
.knob{display:block;margin-top:.35rem;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#c9bfae}
.knob input{width:100%;height:36px}
footer{margin-top:2rem;color:var(--muted);font-size:.9rem}
footer a{color:inherit}
@media print{.no-print{display:none!important}}
.deck.dragover{ outline:2px dashed currentColor; outline-offset:4px; }
.drophint{ font-size:.82rem; margin:.5rem 0 0; color:var(--muted); }
/* AOG-VINYL-ENGINE-V1 — the close-up groove, the strobe ring, the 33/45 pair */
.zoom{position:relative;overflow:hidden;width:100%;height:36px;background:#0a1410;border-radius:8px;display:block;margin-top:.3rem;touch-action:none}
.zoom .zimg{height:36px;width:auto;will-change:transform}
.zoom .zhead{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#c4452a;pointer-events:none}
/* AOG-DJ-VINYL-LOOK-V1: the strobe dots are on the platter's edge, outside the record, as on a real deck. They turn
   with the record (a platter turns under its record), so they still show the spin and the speed. */
.strobe{position:absolute;inset:-8.14%;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,#f0dfae 0deg 2.2deg,transparent 2.2deg 9deg);
  -webkit-mask:radial-gradient(circle closest-side, transparent 0 95%, #000 95.6% 99%, transparent 99.6%);
  mask:radial-gradient(circle closest-side, transparent 0 95%, #000 95.6% 99%, transparent 99.6%);opacity:.8}
.deck.spinning .platter{box-shadow:0 16px 18px rgba(0,0,0,.55),0 4px 0 #120e0a,0 0 0 2px rgba(244,226,176,.18)}
.rpm{display:inline-flex;gap:.25rem}
.rpmb{min-height:44px;padding:0 .7rem}
.rpmb.on{background:#efe8dc;color:#1a140e;border-color:#efe8dc}
.knob .readout{color:#f4e2b0;font-variant-numeric:tabular-nums;margin-left:.35rem}
.tiny{min-height:26px;border-radius:999px;padding:0 .55rem;margin-left:.4rem;font-size:.66rem;font-weight:800;
  letter-spacing:.1em;background:rgba(0,0,0,.3);color:#c9bfae;border:1px solid rgba(255,255,255,.18)}
.tiny.on{background:#f4e2b0;color:#1a140e;border-color:#f4e2b0}
.row.tr{gap:.35rem}
.grp{display:inline-flex;gap:.25rem}
.ghost.sm{min-height:38px;padding:0 .7rem;font-size:.85rem}
.ghost.sm.on{background:#f4a3b0;color:#2a0c08;border-color:#f4a3b0}
.bpm{margin-left:auto;font-variant-numeric:tabular-nums;font-size:.8rem;font-weight:700;color:#f4e2b0}
/* AOG-DJ-DECK-V1 — MASTER, the 8 pads, the loops */
.mst{min-height:30px;margin:0}
.mst.on{background:#9fd4a0;color:#0e2412;border-color:#9fd4a0}
.dlab{font-size:.68rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#c9bfae}
.pads{margin-top:.55rem}
.padhead{display:flex;flex-wrap:wrap;align-items:center;gap:.35rem .5rem;margin-bottom:.35rem}
.chopline{margin:.45rem 0 0;color:#e3d8c6;font-size:.92rem;line-height:1.4}
.chopline:empty{display:none}
.chopline a{color:#cfe2ff}
.padhead .snap{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:#c9bfae}
.padhead select{min-height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:#20262e;color:#efe8dc;font:600 16px/1.2 var(--sans);padding:0 .4rem;max-width:9.5rem}
.padgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem}
.pad{min-height:46px;border-radius:10px;border:1px dashed rgba(255,255,255,.3);background:rgba(0,0,0,.3);color:#c9bfae;font:800 1rem/1 var(--sans);touch-action:none}
.pad.set{border-style:solid;color:#14100a;background:var(--pc);border-color:var(--pc)}
.pad.hit{outline:3px solid #fff8e8;outline-offset:-3px}
.pad.erase{border-color:#ff8a70;border-style:solid}
.loops .dlab{margin-right:.15rem}
.loops [data-beats="16"]{margin-left:.15rem}
.deck .ghost.sm.on[data-sync]{background:#9fd4a0;color:#0e2412;border-color:#9fd4a0}
.deck .ghost.sm.on[data-loop]{background:#7fc7f5;color:#08202e;border-color:#7fc7f5}
.xrow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;align-items:center}
.rectime{font-variant-numeric:tabular-nums;font-weight:700;color:#f4e2b0}
.rechint{font-size:.8rem;color:var(--muted);margin:.5rem 0 0}
.takes{display:grid;gap:.5rem;margin-top:.6rem}
.takes:empty{display:none}
/* AOG-STUDIO-SEND-V1 — the line under the takes: "Sent to the Studio. Open the Studio" */
.takeline{margin:.55rem 0 0;font-size:.95rem;line-height:1.45;color:var(--ink)}
.takeline:empty{display:none}
.takeline a{color:inherit;font-weight:700;text-decoration-color:var(--lamp);text-underline-offset:3px}
.eqwrap{position:relative;margin-top:.7rem;background:#06110c;border-radius:10px}
.eqcurve{position:relative;display:block;width:100%;height:110px;border-radius:10px}
.eqlive{position:absolute;left:0;top:0;width:100%;height:110px;border-radius:10px;pointer-events:none}
.eqcap{position:absolute;right:10px;bottom:7px;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(198,247,176,.75)}
.bench{margin-top:.6rem}

/* ══ AOG-DJ-MIXER-V1 — the mixer: one channel strip a deck, the crossfader under them ══════════════ */
.mixer{margin-top:1rem;border-radius:20px;padding:14px;color:#efe8dc;border:1px solid #0c0f13;
  background:linear-gradient(180deg,#2b3139,#171c22);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 16px 36px rgba(0,0,0,.3);display:flex;flex-direction:column}
.mixer h2{margin:.1rem 0 .5rem;font-size:1rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.strips{display:grid;gap:.6rem;grid-template-columns:minmax(0,1fr)}
@media (min-width:701px){ .strips{grid-template-columns:repeat(3,minmax(0,1fr))} }
.strip{min-width:0;border-radius:14px;padding:.6rem .7rem .7rem;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.1)}
.shead{display:flex;align-items:baseline;gap:.5rem;min-width:0}
.shead .sid{font-size:1rem;letter-spacing:.14em;font-weight:800}
.sname{font-size:.82rem;color:#c9bfae;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.eqk{display:flex;align-items:flex-end;gap:.4rem}
.eqk .knob{flex:1 1 auto;min-width:0}
.eqk .kill{flex:0 0 auto;margin-bottom:2px;font-size:.72rem;letter-spacing:.06em}
.strip .ghost.sm.on[data-kill]{background:#ff8a70;color:#2a0c08;border-color:#ff8a70}
.fxbox{margin-top:.45rem;padding-top:.35rem;border-top:1px solid rgba(255,255,255,.1)}
.fxrow{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem}
.fxrow .dlab{margin-right:.2rem}
.strip .ghost.sm.on[data-fxtype]{background:#7fc7f5;color:#08202e;border-color:#7fc7f5}
.fxb{display:inline-flex;align-items:center;gap:.35rem;margin-top:.35rem;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#c9bfae}
.fxb select{min-height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:#20262e;color:#efe8dc;font:600 16px/1.2 var(--sans);padding:0 .4rem}
.strip [data-flat]{margin-top:.45rem}
.side{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem;margin-top:.45rem}
.side .dlab{flex:1 0 100%}
.strip .ghost.sm.on[data-side]{background:#efe8dc;color:#1a140e;border-color:#efe8dc}
.xfade{order:2;margin-top:.8rem;padding:.6rem .7rem .7rem;border-radius:14px;background:rgba(0,0,0,.26);border:1px solid rgba(255,255,255,.1)}
.xfade .xends{display:flex;justify-content:space-between;gap:.5rem;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#c9bfae}
.xfade .xends b:first-child,.xfade .xends b:last-child{color:#f4e2b0;min-width:3ch}
.xfade .xends b:last-child{text-align:right}
#xf{display:block;width:100%;margin:.55rem 0 0;height:36px;accent-color:#f4e2b0}
.mixer .strips{order:1}
.mixer .xrow,.mixer .eqwrap,.mixer .rechint{order:3}
.mixer .pill{background:rgba(0,0,0,.28);color:#efe8dc;border-color:rgba(255,255,255,.18)}
.mixer .pill.rec{border-color:#ff8a70;color:#ffb4a4;font-weight:700}
.mixer .pill.rec.on{background:#c4452a;color:#fff8f3;border-color:#c4452a;animation:recpulse 1.1s ease-in-out infinite}
@keyframes recpulse{50%{opacity:.62}}
@media (prefers-reduced-motion:reduce){.mixer .pill.rec.on{animation:none}}
.mixer .rechint{color:#c9bfae}
/* on a phone the crossfader comes first in the mixer, so it is in reach without scrolling past three strips */
@media (max-width:700px){ .xfade{order:0;margin:0 0 .7rem} }

/* AOG-DECKS-CRATE-V1 */
.cratecard{margin-top:1rem;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem}
.crate{display:grid;gap:.6rem;margin-top:.6rem}
.crate:first-child{margin-top:0}
.crate h3{margin:.2rem 0 0;font-size:.95rem}
.crate .find{list-style:none;margin:0;padding:0;display:grid;gap:.4rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,15rem),1fr))}
.crate .find li{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .5rem;padding:.55rem .75rem;border-radius:12px;border:1px solid rgba(201,162,74,.45);min-height:44px}
.crate .find a{font-weight:700;color:inherit;text-decoration-color:#C9A24A;text-underline-offset:3px}
.crate .find span{font-size:.85rem;color:var(--muted)}
.crate .take .nm{flex:1 1 8rem;text-transform:none;letter-spacing:0;color:var(--ink);font-size:.95rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.crate .take.empty{color:var(--muted)}
.crate label.ghost{cursor:pointer}
.crate .starter{list-style:none;margin:0;padding:0;display:grid;gap:.3rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,14rem),1fr))}
.crate .starter li{display:flex;flex-wrap:wrap;gap:.1rem .5rem;align-items:baseline;padding:.4rem .7rem;border-radius:10px;border:1px solid rgba(201,162,74,.45);font-size:.9rem}
.crate .starter li b{color:var(--ink)}
.crate .starter li span{color:var(--muted);font-size:.85rem}
.crate .starter-msg{margin:0;font-size:.95rem;color:var(--ink)}
.crate label.ghost input{display:none}
/* AOG-DECKS-BARS-V1 (2026-10-06) — Jimmy: "some of the best quick bars that are hilarious and edgy" */
.bars-top{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.bars-top label{font-size:.9rem;color:var(--muted)}
.bars-top select{font:inherit;font-size:16px;min-height:44px;padding:.3rem .6rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.barcard{margin:0;padding:1rem 1.1rem;border-radius:14px;border:1px solid #C9A24A;background:#fff8e8;color:#1d1a16;font-size:1.2rem;line-height:1.5;font-weight:700}
.barcard span{display:block}
.bars-nav{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.bars-nav .ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);min-height:44px;border-radius:999px;padding:0 1.1rem;font-weight:700;font-size:1rem}
.bars-nav .n{font-size:.9rem;color:var(--muted);margin-left:auto}
/* AOG-DJ-MADE-V1 — the four records made on the page */
.made{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(min(100%,12.5rem),1fr))}
.mrec{display:grid;grid-template-columns:64px minmax(0,1fr);gap:.45rem .65rem;align-items:center;padding:.6rem;border-radius:12px;border:1px solid var(--line);background:var(--chip);min-width:0}
.mrec>.onto{grid-column:1 / -1}
.mrec .art{flex:0 0 64px;height:64px;border-radius:6px;position:relative;overflow:hidden;background:hsl(var(--h),45%,34%)}
.mrec .art::before{content:"";position:absolute;width:86%;aspect-ratio:1;top:7%;right:-30%;border-radius:50%;
  background:radial-gradient(circle,hsl(var(--h),60%,58%) 0 16%,#111 17% 19%,#1b1b1b 20% 100%);box-shadow:0 0 0 1px #000}
.mrec .mi{min-width:0;flex:1 1 auto}
.mrec .mi b{display:block;font-size:.95rem;color:var(--ink)}
.mrec .mi span{display:block;font-size:.8rem;color:var(--muted)}
.mrec .onto{display:flex;align-items:center;gap:.35rem;flex-wrap:nowrap}
.mrec .onto button{flex:1 1 0;min-width:0;padding:0}   /* AOG-DECKS-CALM-V1: A, B and C always in one row */
.mrec .onto em{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.crate details.more{margin:0}
.crate details.more>summary{cursor:pointer;display:list-item;padding:.65rem 0;font-size:.9rem;font-weight:700;color:var(--ink)}
.crate details.more[open]>summary{margin-bottom:.3rem}
.crate details.find-box>summary{font-size:.95rem;font-family:var(--display,Georgia,serif)}
.onto button,.take .onto button{min-width:44px;min-height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;padding:0 .6rem}
.take .onto{display:inline-flex;align-items:center;gap:.3rem}
.take .onto em{font-style:normal;font-size:.82rem;color:var(--muted);font-weight:600}
/* AOG-DECKS-CRATE-BOX-V1 — Up next is a real crate: sleeves standing in a wooden box */
.cbox{position:relative;display:flex;gap:.7rem;overflow-x:auto;padding:1rem .9rem 1.3rem;border-radius:10px;
  background:linear-gradient(180deg,#8a5a32,#6b4424);border:3px solid #4a2d16;box-shadow:inset 0 -10px 0 #4a2d16, inset 0 2px 0 #a8744a;scroll-snap-type:x proximity}
.cbox.empty{display:block;color:#f3e6d4;font-size:.9rem}
.sleeve{flex:0 0 132px;min-width:0;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;gap:.35rem;cursor:grab;
  background:var(--card);border:1px solid #00000055;border-radius:6px;padding:.5rem;box-shadow:0 4px 8px #0006;transition:transform .12s}
.sleeve:hover{transform:translateY(-6px)}
.sleeve .art{position:relative;aspect-ratio:1;border-radius:4px;overflow:hidden;background:hsl(var(--h),45%,38%)}
.sleeve .art::before{content:"";position:absolute;width:78%;aspect-ratio:1;top:11%;right:-22%;border-radius:50%;
  background:radial-gradient(circle,hsl(var(--h),60%,55%) 0 16%,#111 17% 19%,#1b1b1b 20% 100%);box-shadow:0 0 0 1px #000}
.sleeve .art b{position:absolute;left:6px;top:4px;font-size:1.2rem;color:#fff;text-shadow:0 1px 2px #000}
.sleeve .nm{text-transform:none;letter-spacing:0;font-size:.8rem;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sleeve .sb{display:flex;gap:.3rem}
.sleeve .sb button{flex:1;min-height:34px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font-weight:700;font-size:.8rem;cursor:pointer}
.sleeve .sb button.x{flex:0 0 34px}
/* AOG-DECKS-SLEEVES-V1 (2026-10-06) — Jimmy: "Can we have all the vinyl look like they are in crates so we only
   see their sleeves?" Every record on the page stands in a crate as its sleeve: the ones made here, the starter
   crate, the scripture records and the speeches. A, B or C puts it straight onto that deck. */
.sleeve.still{cursor:default}
.sleeve .sub{font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:-.25rem}
.cbox.shelf{margin-top:.5rem}
/* AOG-DECKS-SPINES-V1 (2026-10-06) — Jimmy: "It is still the face and not the side sleeve." Records stand in a crate
   edge on: only their spines show, each with its name down it. Tap a spine and that record comes up out of the crate;
   its cover shows beside the crate with A, B and C. Nothing moves until it is tapped. */
.cbox.spines{gap:5px;align-items:flex-end;padding:1.1rem .8rem .9rem}
.spine{flex:0 0 46px;height:188px;position:relative;writing-mode:vertical-rl;display:flex;align-items:center;justify-content:flex-start;
  padding:12px 0 10px;border-radius:3px;border:1px solid #00000080;color:#fff;cursor:pointer;
  background-color:hsl(var(--h),42%,27%);background-image:linear-gradient(90deg,hsl(var(--h),40%,22%),hsl(var(--h),46%,33%) 45%,hsl(var(--h),40%,24%));
  box-shadow:inset -3px 0 0 #00000045,inset 2px 0 0 #ffffff1f,0 2px 4px #0006;font:700 14px/1 var(--sans);letter-spacing:.02em;text-shadow:0 1px 1px #000}
.spine .sp-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%}
.spine .sp-n{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);writing-mode:horizontal-tb;font-size:11px;opacity:.85}
.spine.out{transform:translateY(-18px);box-shadow:0 0 0 3px #ffd36b,0 6px 10px #0008}
/* AOG-DECKS-THIN-SLEEVES-V1 (2026-10-09) — Jimmy: "Can the records sleeves be thinner? They look more like books." A record
   sleeve is a thin square of card: a narrow edge, square corners, packed tight. The site's practice-room glass also
   styles any ".spine" (rounded corners, a thick border, a coloured band on top); that is for its own pages, not this crate. */
.cbox.spines{gap:2px;padding:1.1rem .8rem .9rem}
.cbox.spines .spine{flex:0 0 30px!important;height:206px!important;padding:8px 0 22px!important;border:1px solid rgba(0,0,0,.6)!important;border-radius:1px!important;
  box-shadow:inset -2px 0 0 rgba(0,0,0,.3),inset 1px 0 0 rgba(255,255,255,.14),1px 0 2px rgba(0,0,0,.45)!important;font-size:13px;letter-spacing:.03em}
.cbox.spines .spine .sp-n{font-size:10px;bottom:5px}
.cbox.spines .spine.out{box-shadow:0 0 0 2px #ffd36b,0 6px 10px #0008!important}
.pulled{display:flex;gap:.9rem;align-items:center;margin:.6rem 0 .2rem;min-height:2.6rem}
.pulled .sleeve{flex:0 0 156px}
.pulled .hint{color:var(--muted);font-size:.9rem;margin:0}
.pulled .what{margin:0;color:var(--ink);font-size:.9rem;max-width:34ch}
.deck.dragover{outline:3px dashed var(--accent,#c45c26);outline-offset:4px}
.bench .take.empty{color:var(--muted)}
.take{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem;color:var(--ink)}
.take .tlen{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.take audio{height:34px;max-width:min(320px,52vw)}
.take .ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);min-height:40px;border-radius:999px;padding:0 .8rem;display:inline-flex;align-items:center;text-decoration:none;font-weight:700;font-size:.85rem}

/* AOG-PGPANEL-V1 (2026-09-23) - Jimmy: "Can these be embedded into their respective
   pages with a hyperlink to open and view them?" A bar under the machine; click it and
   the picture guide unfolds in place, in an iframe of the guide's own file, so there is
   one copy of the guide and not two. Never prints with the machine page. */
.pg{margin:1.1rem 0 0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.pg>summary{list-style:none;cursor:pointer;padding:.8rem 1rem;display:flex;align-items:center;gap:.7rem;
  font-weight:700;font-size:.98rem;min-height:44px}
.pg>summary::-webkit-details-marker{display:none}
.pg>summary::marker{content:""}
.pg .chev{flex:0 0 auto;transition:transform .15s ease;color:var(--muted);font-size:.9rem}
.pg[open] .chev{transform:rotate(90deg)}
.pg .pgsub{font-weight:400;color:var(--muted);font-size:.86rem;margin-left:auto;text-align:right}
.pg .pgbody{border-top:1px solid var(--line)}
.pg iframe{display:block;width:100%;border:0;min-height:60vh;background:var(--bg)}
.pg .pgfoot{padding:.65rem 1rem;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
.pg .pgfoot a{color:inherit;font-weight:700}
@media print{ .pg{display:none !important} }

/* AOG-MUSIC-STILL-V1 (2026-09-23) - the same stillness rules as Daily Drafts (AOG-DD-STILL-V1).
   Jimmy: "make sure that the Sampler and turn table follow the same protocols about off page
   scrolling (it is making me nausea at the moment)". */
html{overflow-x:clip; overscroll-behavior:none}
body{overflow-x:clip; overscroll-behavior:none}
body *{overscroll-behavior:contain}
input:not([type=range]):not([type=file]):not([type=checkbox]):not([type=radio]),select,textarea{font-size:max(16px,1em)}
@media (hover:none){ *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important} html{scroll-behavior:auto} }

/* AOG-MUSIC-TOUCH-V1 (2025-09-25) — Jimmy: "For the turntables, sometimes it takes
   a few taps. And the copy or paste pops up when I am clicking." A held or dragged
   finger read as "select this text", so iOS raised its copy/paste callout and ate
   the tap. Nothing on the machine is text to select: selection and the callout are
   off (fields and text areas keep them), every control answers the first tap with
   no double-tap wait, and the audio engine is woken on the very first touch. */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,a,label,input[type=range],.pill,.pad,.platter,canvas{touch-action:manipulation}
.platter,.wave,.zoom,.pad{touch-action:none}

/* AOG-BENCH-TOP-V1: the masthead, nav row, bench switch and Lessons card live in /aog-bench.css */
#lessonRow .ghost{background:var(--chip);color:var(--ink);border:1px solid var(--line)}
#lessonRow .ghost.on{background:var(--ink);color:var(--card);border-color:var(--ink)}

function hear(d, m){

  if(m.loopOn){ d.loopA = m.loopA; d.loopB = m.loopB; }
  d.wLoopOn = m.loopOn;
  if(d._startAt != null && m.frame >= d._startAt) d._startAt = null;   /* the booked start has happened */

    d.note = (/\.m4p$/i.test(file.name) ? t("locked") : t("nope")).replace("%s", file.name); paintDeck(d);

   and top (so the waveform shows you where the drums are instead of a green

    let m=0; const o=x*step, e=Math.min(a.length, o+step);
    for(let i=o;i<e;i+=4){ const v=a[i]<0?-a[i]:a[i]; if(v>m) m=v; }
    out[x]=m;
  }

}
/* the close-up's own picture: the loudest sample in every 32, worked out once */
function zoomPeaks(buf){
  const a = buf.getChannelData(0), Z = 32, n = Math.ceil(a.length/Z), out = new Float32Array(n);
  for(let k=0;k<n;k++){ let m = 0; const e = Math.min(a.length, (k+1)*Z); for(let i=k*Z;i<e;i++){ const v = a[i]<0?-a[i]:a[i]; if(v>m) m=v; } out[k] = m; }

function analyse(d, known){
  known = known || {};
  const buf = d.buf; if(!buf) return;
  const a = buf.getChannelData(0), sr = buf.sampleRate, n = a.length;
  const W = 1200, step = n/W;
  const lo = new Float32Array(W), mid = new Float32Array(W), hi = new Float32Array(W);
  const kLo = 1 - Math.exp(-2*Math.PI*180/sr), kHi = 1 - Math.exp(-2*Math.PI*3200/sr);
  const hop = Math.max(1, Math.round(sr/400)), frames = Math.floor(n/hop);
  const env = new Float32Array(frames);
  let f1 = 0, f2 = 0, acc = 0, cnt = 0, fi = 0;
  for(let i=0;i<n;i++){
    const x = a[i];
    f1 += kLo*(x - f1);            /* bass */
    f2 += kHi*(x - f2);            /* bass + middle */
    const c = (i/step)|0;
    const al = f1<0?-f1:f1, am = Math.abs(f2-f1), ah = Math.abs(x-f2);
    if(c<W){
      if(al>lo[c]) lo[c]=al;
      if(am>mid[c]) mid[c]=am;
      if(ah>hi[c]) hi[c]=ah;
    }
    acc += x*x; cnt++;
    if(cnt===hop){ if(fi<frames) env[fi++] = Math.sqrt(acc/hop); acc = 0; cnt = 0; }
  }
  d.bands = { lo:lo, mid:mid, hi:hi };
  /* how loud the record is, as an ear hears it — for the level match */
  if(known.lufs == null){ try{ d.lufs = AOGDJ.loudness(buf.getChannelData(0), buf.numberOfChannels>1 ? buf.getChannelData(1) : null, sr); }catch(e){ d.lufs = null; } }
  else d.lufs = known.lufs;
  /* a record that knows its own tempo (made here, or bounced by another tool) skips the guessing */
  if(known.bpm > 0 && known.beat0 != null){ d.bpm = known.bpm; d.beat0 = known.beat0; return; }
  /* the beat is where the sound GROWS: rising energy, lined up with itself */
  const on = new Float32Array(frames);
  for(let i=1;i<frames;i++){ const dv = env[i]-env[i-1]; on[i] = dv>0?dv:0; }
  const fps = sr/hop;
  let bestBpm = known.bpm > 0 ? known.bpm : 0;
  if(!bestBpm){
    let best = 0;
    for(let bpm=72; bpm<=176; bpm+=0.25){
      const lag = Math.round(60/bpm*fps);
      if(lag < 2 || lag*3 >= frames) continue;
      let sum = 0;
      for(let i=0; i+lag<frames; i++) sum += on[i]*on[i+lag];
      sum /= (frames - lag);
      if(sum > best){ best = sum; bestBpm = bpm; }
    }
    if(!bestBpm || frames < 200){ d.bpm = 0; d.beat0 = 0; return; }
    /* the coarse pass lands within a quarter of a beat per minute; this one walks
       around that answer in fiftieths, because a tempo that is 0.6% out drifts a
       tenth of a second across sixteen bars and the grid stops looking honest. */
    let fine = bestBpm, fineBest = best;
    for(let bpm=bestBpm-2; bpm<=bestBpm+2; bpm+=0.02){
      const lagf = 60/bpm*fps, l0 = Math.floor(lagf), fr = lagf - l0;
      if(l0 < 2 || l0*3 >= frames) continue;
      let sum = 0;
      for(let i=0; i+l0+1<frames; i++) sum += on[i]*(on[i+l0]*(1-fr) + on[i+l0+1]*fr);
      sum /= (frames - l0);
      if(sum > fineBest){ fineBest = sum; fine = bpm; }
    }
    bestBpm = fine;
  }
  const period = 60/bestBpm*fps;
  let bo = 0, bs = -1;
  for(let off=0; off<period; off+=1){
    let sum = 0;
    for(let k=0; off + k*period < frames; k++) sum += on[Math.round(off + k*period)] || 0;
    if(sum > bs){ bs = sum; bo = off; }
  }
  d.bpm = Math.round(bestBpm*100)/100;
  d.beat0 = bo/fps;
}
async function buildTape(){
  if(TAPE.node || !actx) return;
  const keep = (L,R)=>{ TAPE.chunks.push([L,R]); TAPE.frames += L.length; };
  if(workletReady){
    try{
      await workletReady;
      const n = new AudioWorkletNode(actx, "aog-tape", { numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[2] });
      n.port.onmessage = (e)=>{ if(e.data && e.data.t==="chunk") keep(e.data.L, e.data.R); };
      TAPE.node = n;
    }catch(e){ TAPE.node = null; }
  }
  if(!TAPE.node){
    const n = actx.createScriptProcessor(4096, 2, 2);
    n.onaudioprocess = (e)=>{
      if(!TAPE.on) return;
      keep(Float32Array.from(e.inputBuffer.getChannelData(0)),
           Float32Array.from(e.inputBuffer.getChannelData(1) || e.inputBuffer.getChannelData(0)));
    };
    TAPE.node = n;
  }
  /* it hangs off the master and ends in silence: a node only runs if it is
     connected to the destination, and we are not playing the mix twice. */
  TAPE.sink = actx.createGain(); TAPE.sink.gain.value = 0;
  OUT.connect(TAPE.node); TAPE.node.connect(TAPE.sink); TAPE.sink.connect(actx.destination);
}

  if(!TAPE.node) return;
  TAPE.on = on;

}

  ctx(); await buildTape();

    TAPE.bpm0 = mixTempo(); TAPE.bpm1 = 0; TAPE.msg = "";
    armTape(true);
    TAPE.timer = setInterval(()=>{
      const sec = (performance.now()-TAPE.t0)/1000;
      const el = document.getElementById("recTime"); if(el) el.textContent = clock(sec);
      if(sec >= TAPE_MAX_SEC){ recToggle(); const h=document.getElementById("recHint"); if(h) h.textContent = t("full"); }
    }, 200);
  } else {
    TAPE.bpm1 = mixTempo();

function finishTake(){
  if(!TAPE.frames){ paintTape(); return; }
  const n = TAPE.frames, L = new Float32Array(n), R = new Float32Array(n);
  let o = 0;
  TAPE.chunks.forEach(c=>{ L.set(c[0], o); R.set(c[1], o); o += c[0].length; });
  TAPE.chunks = []; TAPE.frames = 0;
  const wav = wavBlob(L, R, actx.sampleRate);
  TAPE.takes.unshift({ n: ++TAPE.n, sec: n/actx.sampleRate, url: URL.createObjectURL(wav), blob: wav, at: Date.now(), bpm: TAPE.bpm1 || TAPE.bpm0 });

/* a 16-bit stereo WAV: it opens in anything, on any machine, with no codec to
   argue about — which matters when a student mails it to themselves. */
function wavBlob(L, R, sr){
  const n = L.length, bytes = 44 + n*4, ab = new ArrayBuffer(bytes), v = new DataView(ab);
  const str = (o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  str(0,"RIFF"); v.setUint32(4, bytes-8, true); str(8,"WAVEfmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 2, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr*4, true); v.setUint16(32, 4, true); v.setUint16(34, 16, true);
  str(36,"data"); v.setUint32(40, n*4, true);
  let o = 44;
  for(let i=0;i<n;i++){
    let l = L[i], r = R[i];
    l = l>1?1:l<-1?-1:l; r = r>1?1:r<-1?-1:r;
    v.setInt16(o, l*32767, true); v.setInt16(o+2, r*32767, true); o += 4;
  }
  return new Blob([ab], { type:"audio/wav" });
}

/* ══ AOG-DECKS-CRATE-V1 (2026-09-25) — THE RECORD CRATE ══════════════════════
   Jimmy: "make it so the turntable saves what was last used (if the tab is
   closed) … a 'Previously spun' or a crate for upcoming music so it can go
   smoother." Three shelves, all in IndexedDB on this computer, never sent:
   · what is on each platter, and where the needle was, so a closed tab opens

function crateDb(){

    if(!window.indexedDB){ no(new Error("no indexedDB")); return; }
    const r = indexedDB.open(CRATE.db, 1);
    r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains(CRATE.store)) r.result.createObjectStore(CRATE.store); };
    r.onsuccess = ()=>ok(r.result); r.onerror = ()=>no(r.error);

async function crateGet(k){

      const q = db.transaction(CRATE.store, "readonly").objectStore(CRATE.store).get(k);
      q.onsuccess = ()=>{ db.close(); ok(q.result || null); }; q.onerror = ()=>{ db.close(); ok(null); };
    });
  }catch(e){ return null; }
}
async function cratePut(k, v){
  try{
    const db = await crateDb();
    await new Promise(ok=>{
      const tx = db.transaction(CRATE.store, "readwrite");
      if(v == null) tx.objectStore(CRATE.store).delete(k); else tx.objectStore(CRATE.store).put(v, k);
      tx.oncomplete = ()=>{ db.close(); ok(); }; tx.onerror = tx.onabort = ()=>{ db.close(); ok(); };
    });
  }catch(e){}
}

/* ══ AOG-DJ-MADE-V1 (2026-10-04) — THE RECORDS MADE RIGHT HERE ════════════════
   Four records in the spirit of Jimmy's DJs, named by style, made by aog-dj.js

   is nothing to download. Each knows its exact tempo and that beat one is the
   very first sample, so its grid, its loops and SYNC are exact from the start. */
const MADE = (window.AOGDJ && AOGDJ.list) || [];
function madeTrack(id){
  return new Promise((ok, no)=>{
    let w = null;
    try{ w = new Worker(new URL("aog-dj.js", document.baseURI).href); }catch(e){ w = null; }
    if(!w){ try{ const r = AOGDJ.render(id); ok(r); }catch(e){ no(e); } return; }
    w.onmessage = (e)=>{ const m = e.data; w.terminate(); if(m && m.t==="done") ok(m); else no(new Error(m && m.msg || "failed")); };
    w.onerror = (e)=>{ w.terminate(); try{ ok(AOGDJ.render(id)); }catch(err){ no(err); } };
    w.postMessage({ t:"render", id:id });
  });
}

/* AOG-DECKS-SLEEVES-V1: one sleeve, for any record; `on(id)` gives the A/B/C button its data */

/* what a deck remembers about a record it has seen before: the tempo it worked

const MARKS = "aog.decks.marks.v1";

  try{ return JSON.parse(localStorage.getItem(MARKS) || "{}"); }catch(e){ return {}; }

function marksSave(d){

/* ══ AOG-DJ-SYNC-V1 — the clock, the grid, the MASTER ═══════════════════════

/* the speed that puts this deck on the master's tempo, half or double time allowed */
function syncRatio(d, m){

  [0.5, 2].forEach(k=>{ const w = base*k; if(Math.abs(Math.log(w)) < Math.abs(Math.log(best))){ best = w; f = 1/k; } });

}

/* where a synced deck's beat sits against the master's, in master beats (−0.5 … 0.5) */
function phaseErr(d, m, F, f){

/* ══ AOG-DJ-MIXER-V1 — the channel strip's sound ═════════════════════════════ */
/* the crossfader's two sides: Blend is constant-power (a long, even fade); Cut keeps

function sideGains(x){

/* one knob, two filters: left of center a low-pass closes down to a rumble, right of

function applyFilter(d){

/* the effect's tempo is this deck's tempo as it plays now (pitch and all) */

  const m = { t:"fx", type:d.fxType, amt:d.fxAmt, beatSec:60/bpm, beats:d.fxBeats };

/* AOG-DJ-PERF-V1 — a canvas's width comes from a ResizeObserver, never read in the middle of
   a frame: reading layout after the platters have turned makes the browser lay the page out
   again, six times a frame on three decks. */
const SIZE = new WeakMap();
const RO = window.ResizeObserver ? new ResizeObserver(es=>{ es.forEach(e=>SIZE.set(e.target, e.contentRect.width)); decks.forEach(d=>{ d.waveDirty = true; d._drawn = -1; }); eqDirty = true; }) : null;

/* AOG-DJ-PERF-V2 — everything that moves (platters, arms, meters, the needles on the

  turn:  { k:[{transform:"rotate(0deg)"},{transform:"rotate(360deg)"}], t:360000, p:"transform", f:v=>"rotate("+(v/1000)+"deg)" },
  fill:  { k:[{transform:"scaleX(0)"},{transform:"scaleX(1)"}], t:1000, p:"transform", f:v=>"scaleX("+(v/1000)+")" },
  fillY: { k:[{transform:"scaleY(0)"},{transform:"scaleY(1)"}], t:1000, p:"transform", f:v=>"scaleY("+(v/1000)+")" },
  right: { k:[{transform:"translateX(0px)"},{transform:"translateX(100000px)"}], t:100000, p:"transform", f:v=>"translateX("+v+"px)" },
  left:  { k:[{transform:"translateX(0px)"},{transform:"translateX(-100000px)"}], t:100000, p:"transform", f:v=>"translateX("+(-v)+"px)" },

/* a record's pictures are drawn in a Worker where the browser allows it (AOGDJ.paintWave

function parts(d){ if(!d.$ || !d.$.el.isConnected) d.$ = deckParts(d); return d.$; }
/* ══ the waveform: one picture per record; the needle, the loop and the slip mark sit on top ══ */

async function startDeck(d, from){

/* ══ AOG-DJ-PADS-V1 — eight pads a deck: a chop each ════════════════════════

/* ══ AOG-CHOPS-TO-PADS-V1 (2026-10-09) — STUDIO-HANDOFF §9, Jimmy: "I cut this from my record. Put it on the pads." ══

   8 seconds from the needle when the record's tempo is not known), and sends them the way every take goes: into the

function tickLessons(){

/* AOG-PGPANEL-V1 - the guide loads only when the bar is opened, and the frame is
   grown to its content so the panel scrolls with the page instead of inside itself. */
(function(){
  var d=document.getElementById("pgPanel"); if(!d) return;
  var f=document.getElementById("pgFrame"); if(!f) return;
  function fit(){
    try{ var b=f.contentDocument&&f.contentDocument.body;
         if(b){ var h=b.scrollHeight; if(h>240) f.style.height=(h+28)+"px"; } }catch(e){}
  }
  d.addEventListener("toggle", function(){
    if(d.open && !f.getAttribute("src")) f.setAttribute("src", f.getAttribute("data-src"));
  });
  f.addEventListener("load", function(){ fit(); setTimeout(fit,250); setTimeout(fit,1200); });
  var t; window.addEventListener("resize", function(){ clearTimeout(t); t=setTimeout(fit,150); });
})();
</script>
