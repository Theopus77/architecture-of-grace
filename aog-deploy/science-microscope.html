function tickMissions(){
  const L=S.lab, band=focusBand(L.coarse,L.fine,L.obj);
  if(L.lightOn) S.missions.lamp=true;
  if(L.clipped) S.missions.clips=true;
  if(L.obj===4) S.missions.low=true;
  if(L.obj===10) S.missions.ten=true;
  if(L.obj===40) S.missions.forty=true;
  if(L.spec==="e"&&L.obj===4&&band==="in"&&L.lightOn&&!L.cracked) S.missions.coarse=true;
  if(L.obj===40&&band==="in"&&L.lightOn&&!L.cracked) S.missions.fine=true;
  if(L.dia>=28&&L.dia<=72&&L.lightOn&&!L.cracked&&band!=="out") S.missions.iris=true;
  if(L.spec==="onion"&&L.obj===40&&band==="in"&&L.lightOn&&!L.cracked && (L.stain==="iodine"||L.stain==="methylene"||L.stain==="safranin")) S.missions.onion=true;
  if(L.spec==="onion"&&L.stain==="iodine"&&L.obj===40&&band==="in"&&L.lightOn&&!L.cracked) S.missions.stain=true;
  if(L.illum==="dark"&&L.spec==="pond"&&L.lightOn&&!L.cracked&&L.stain==="none") S.missions.dark=true;
  if(L.illum==="slit"&&L.lightOn&&!L.cracked) S.missions.slit=true;
  if(L.illum==="polar"&&(L.spec==="onion"||L.spec==="elodea")&&L.lightOn&&!L.cracked) S.missions.polar=true;
  if(L.graticule&&L.obj===40&&L.mA&&L.mB&&L.lightOn&&!L.cracked) S.missions.micrometer=true;
  if(L.spec==="hair"&&L.obj===40&&band==="in"&&L.lightOn&&!L.cracked) S.missions.hair=true;
  if(L.obj===100&&L.oil&&L.spec==="cheek"&&band==="in"&&L.lightOn&&!L.cracked) S.missions.oil=true;
  if(L.spec==="bact"&&L.stain!=="none"&&L.obj>=40&&band==="in"&&L.lightOn&&!L.cracked) S.missions.bact=true;
  if(L.spec==="virus"&&L.obj===100&&L.oil&&band==="in"&&L.lightOn&&!L.cracked) S.missions.limit=true;
  if(L.prism&&L.spec==="virus"&&L.obj===100&&L.oil&&L.lightOn&&!L.cracked) S.missions.prism=true;
  /* AOG-SCOPE-ANCIENT-V1 — mission 7 */
  if(L.spec==="papyrus"&&L.obj===10&&band==="in"&&L.lightOn&&!L.cracked) S.missions.papyrus=true;
  if(L.spec==="scroll"&&L.obj===40&&band==="in"&&L.lightOn&&!L.cracked) S.missions.scroll=true;
  if(L.spec==="tablet"&&L.obj===40&&band==="in"&&L.lightOn&&!L.cracked) S.missions.tablet=true;
  if(L.spec==="papyrus"&&L.illum==="polar"&&L.lightOn&&!L.cracked) S.missions.inkpolar=true;
  persist();
}

let walkTimer=0;
function walkStep(){
  if(!S.playing) return;
  if(S.walk<0) S.walk=0; else S.walk++;
  if(S.walk>=LIGHT_PATH.length){ S.playing=false; S.walk=LIGHT_PATH.length-1; }
  else { const p=LIGHT_PATH[S.walk]; S.sel=p; S.met[p]=true; persist(); }
  paint();
  if(S.playing) walkTimer=setTimeout(walkStep, 2200);
}

function paint(){
  clearTimeout(walkTimer);
  cancelAnimationFrame(eyeRaf);
  S.page=hashPage();
  paintChrome();
  const view=document.getElementById("view");
  view.innerHTML = S.page==="meet"?pageMeet(): S.page==="lab"?pageLab(): S.page==="find"?pageFind(): S.page==="job"?pageJob(): S.page==="print"?pagePrint(): pageHome();
  if(S.page==="meet"){
    bindScope(document.getElementById("meetScope"), id=>{ S.sel=id; S.met[id]=true; persist(); paint(); });
    view.querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>{ S.sel=b.getAttribute("data-part"); S.met[S.sel]=true; persist(); paint(); });
    view.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
      const a=b.getAttribute("data-act");
      if(a==="walk"){ S.playing=true; S.walk=-1; walkStep(); }
      if(a==="pause"){ S.playing=false; }
      if(a==="nextw"){ S.playing=false; if(S.walk<0)S.walk=0; else S.walk=Math.min(S.walk+1,LIGHT_PATH.length-1); S.sel=LIGHT_PATH[S.walk]; S.met[S.sel]=true; persist(); paint(); }
      if(a==="resetw"){ S.playing=false; S.walk=-1; paint(); }
      if(a==="prevp"&&S.sel){ const i=PARTS.findIndex(p=>p.p===S.sel); if(i>0){ S.sel=PARTS[i-1].p; S.met[S.sel]=true; persist(); paint(); } }
      if(a==="nextp"){ const i=S.sel?PARTS.findIndex(p=>p.p===S.sel):-1; const n=PARTS[(i+1)%PARTS.length]; S.sel=n.p; S.met[n.p]=true; persist(); paint(); }
    });
    if(S.playing) walkTimer=setTimeout(walkStep, 2200);
  }
  if(S.page==="lab"){
    startEye(); tickMissions();
    view.querySelectorAll("[data-slidemenu]").forEach(m=>m.onchange=()=>{
      const b=m.parentNode.querySelector(`[data-act="spec-${m.value}"]`); if(b) b.click();
    });
    view.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
      const a=b.getAttribute("data-act"); const L=S.lab;
      if(a==="teach-lock"){ S.teacher="locked"; persist(); paint(); return; }
      if(a==="teach-open"){ S.teacher="open"; persist(); paint(); return; }
      const step=benchStep();
      const locked = (a==="obj10"||a==="obj40")&&step<1
        || a==="obj100"&&step<4
        || a==="illum-dark"&&step<2
        || (a==="illum-slit"||a==="illum-polar"||a==="prism1"||a==="rife"||a==="universal")&&step<5
        || a.startsWith("filter-")&&step<5
        || a.startsWith("stain-")&&a!=="stain-none"&&step<2
        || (a==="grat1"||a==="meas1")&&step<3
        || a.startsWith("spec-")&&a!=="spec-e"&&step<2;
      if(locked) return;
      if(a==="lamp1") L.lightOn=true;
      if(a==="lamp0") L.lightOn=false;
      if(a==="clip1") L.clipped=true;
      if(a==="clip0") L.clipped=false;
      if(a==="obj4"){ L.obj=4; L.oil=false; L.dfNote=false; }
      if(a==="obj10"){ L.obj=10; L.oil=false; L.dfNote=false; }
      if(a==="obj40"){ L.obj=40; L.oil=false; L.dfNote=false; }
      if(a==="obj100"){
        L.obj=100;
        if(L.illum==="dark"){ L.illum="bright"; L.dfNote=true; }
      }
      if(a==="quartz1") L.quartz=true; if(a==="quartz0") L.quartz=false;
      if(a==="oil1") L.oil=true; if(a==="oil0") L.oil=false;
      if(a==="rife"){ L.lightOn=true; L.clipped=true; L.spec="pond"; L.stain="none"; L.illum="dark"; L.filter="day"; L.prism=false; L.obj=4; L.oil=false; L.dfNote=false; L.panX=0; L.panY=0; L.mA=null; L.mB=null; if(L.cracked){ L.cracked=false; L.coarse=18; L.fine=40; } }
      if(a==="universal"){
        L.lightOn=true; L.clipped=true; L.prism=true; L.band=92; L.illum="slit"; L.stain="none"; L.oil=false;
        if(L.spec!=="virus" && L.spec!=="pond" && L.spec!=="bact") L.spec="pond";
        L.obj=L.spec==="virus"?100:40;
        if(L.obj===100) L.oil=true;
        L.coarse=L.obj===100?42:40; L.fine=L.obj===100?38:45;
        L.panX=0; L.panY=0;
        if(L.cracked){ L.cracked=false; }
      }
      if(a==="newslide"){ L.cracked=false; L.coarse=18; L.fine=40; L.obj=4; L.panX=0; L.panY=0; L.mA=null; L.mB=null; L.oil=false; }
      if(a.startsWith("spec-")){
        L.spec=a.slice(5); L.panX=0; L.panY=0; L.mA=null; L.mB=null;
        if(!allowedStains(L.spec).includes(L.stain)) L.stain=DEFAULT_STAIN[L.spec]||"none";
        if(L.cracked){ L.cracked=false; L.coarse=18; L.fine=40; L.obj=4; }
      }
      if(a.startsWith("illum-")){
        const id=a.slice(6);
        if(id==="dark" && L.obj===100){ L.illum="bright"; L.dfNote=true; }
        else { L.illum=id; if(id!=="dark") L.dfNote=false; }
      }
      if(a.startsWith("stain-")) L.stain=a.slice(6);
      if(a==="prism1") L.prism=true;
      if(a==="prism0") L.prism=false;
      if(a.startsWith("filter-")){
        L.filter=a.slice(7);
        const jump={violet:94,blue:78,green:52,amber:22,day:8};
        if(L.prism && jump[L.filter]!=null) L.band=jump[L.filter];
      }
      if(a==="grat1") L.graticule=true;
      if(a==="grat0") L.graticule=false;
      if(a==="meas1"){ L.measure=!L.measure; if(!L.measure){ L.mA=null; L.mB=null; } if(L.measure) L.graticule=true; }
      tickMissions(); paint();
    });
    view.querySelectorAll("details.more-light").forEach(d=>{
      d.addEventListener("toggle", ()=>{ S.moreOpen=d.open; });
    });
    view.querySelectorAll("[data-knob]").forEach(inp=>{
      inp.oninput=()=>{
        const v=+inp.value, L=S.lab, k=inp.getAttribute("data-knob");
        if(k==="coarse"){ if(!L.cracked && wouldCrack(L.obj,v,L.fine) && v>L.coarse){ L.cracked=true; S.cracked++; persist(); paint(); return; } L.coarse=v; }
        if(k==="fine") L.fine=v;
        if(k==="dia") L.dia=v;
        if(k==="polar") L.polar=v;
        if(k==="band") L.band=v;
        if(k==="eyeTwist") L.eyeTwist=v;
        const lab=inp.closest("label"); if(lab){ const b=lab.querySelector("b"); if(b) b.textContent = k==="band" ? bandNm(v)+" nm" : k==="eyeTwist" ? Math.round(v/100*360)+"°" : Math.round(v); }
        const ab=document.querySelectorAll(".abbe"); if(k==="band"||k==="polar") ab.forEach(el=>{ el.textContent=abbeSentence(); });
        tickMissions();
        const band=focusBand(L.coarse,L.fine,L.obj);
        const fl=L.cracked?t("cracked").split(".")[0]: band==="in"?t("focusIn"):band==="near"?t("focusNear"):t("focusOut");
        const magEl=document.getElementById("focusread"); if(magEl) magEl.textContent=fl;
        const bar=document.getElementById("wdbar"); const w=wd(L.coarse,L.fine);
        if(bar){ bar.style.width=Math.round(w*100)+"%"; bar.style.background=w<.22?"var(--bad)":w<.4?"var(--warn)":"var(--good)"; }
      };
      inp.onchange=()=>{ if(stairNow()!==S.lastStair) paint(); };
    });
    const stepNow=stairNow();
    S.lastStair=stepNow;
  }
  if(S.page==="find" && S.find && !S.find.done){
    bindScope(document.getElementById("findScope"), id=>{
      const F=S.find, want=F.items[F.at].p;
      if(F.say&&F.say.ok) return;
      if(id===want){
        const first=F.tries===0;
        F.mark={[id]:"right"}; F.say={ok:true,text:t("thatsIt")}; S.met[id]=true;
        if(first) F.right++;
        persist(); paint();
        setTimeout(()=>{ F.at++; F.tries=0; F.mark={}; F.say=null; if(F.at>=F.items.length){ F.done=true; S.findBest=Math.max(S.findBest,F.right); persist(); } paint(); }, 700);
      } else {
        const tries=F.tries+1;
        if(tries>=2){ F.mark={[want]:"glow",[id]:"wrong"}; F.say={ok:false,text:t("glowing")}; F.missed.push(want); persist(); paint();
          setTimeout(()=>{ F.at++; F.tries=0; F.mark={}; F.say=null; if(F.at>=F.items.length){ F.done=true; S.findBest=Math.max(S.findBest,F.right); persist(); } paint(); }, 1100);
        } else { F.tries=tries; F.mark={[id]:"wrong"}; F.say={ok:false,text:t("notThat")}; paint(); }
      }
    });
    view.querySelectorAll("[data-act=findagain]").forEach(b=>b.onclick=()=>{ S.find=null; paint(); });
  }
  if(S.page==="find" && S.find && S.find.done){
    view.querySelectorAll("[data-act=findagain]").forEach(b=>b.onclick=()=>{ S.find=null; paint(); });
  }
  if(S.page==="job" && S.job && !S.job.done){
    view.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
      const J=S.job; if(J.picked) return;
      const id=b.getAttribute("data-opt"), q=J.items[J.at];
      J.picked=id;
      if(id===q.a) J.right++; else if(q.p) J.missed.push(q.p);
      paint();
      setTimeout(()=>{ J.at++; J.picked=null; if(J.at>=J.items.length){ J.done=true; S.jobBest=Math.max(S.jobBest,J.right); persist(); } paint(); }, 850);
    });
  }
  if(S.page==="job" && S.job && S.job.done){
    view.querySelectorAll("[data-act=jobagain]").forEach(b=>b.onclick=()=>{ S.job=null; paint(); });
  }
  if(S.page==="print"){
    view.querySelectorAll("[data-act=doprint]").forEach(b=>b.onclick=()=>window.print());
  }
}

document.getElementById("langBtn").onclick=()=>{ S.lang=S.lang==="en"?"es":"en"; persist(); paint(); };
document.getElementById("themeBtn").onclick=()=>{ setTheme(S.theme==="dark"?"light":"dark"); paint(); };

/* AOG-SCOPE-PRINTANY-V2 — Jimmy: the worksheet must print from the browser
   menu and iPhone Share > Print, not only the in-page button. */
window.addEventListener("beforeprint", function(){
  try{
    if(S.page!=="print"){ S._back=S.page; S.page="print"; paint(); }
  }catch(e){}
});
window.addEventListener("afterprint", function(){
  try{
    if(S._back){ S.page=S._back; S._back=null; paint(); }
  }catch(e){}
});
window.addEventListener("hashchange", paint);
S.page=hashPage();
paint();

</script>
<script>
/* AOG-SCIPIC-PANEL-V1 - the guide loads only when the bar is opened, and the frame is
   grown to its content so the panel scrolls with the page instead of inside itself. */
(function(){
  var d=document.getElementById("pgPanel"); if(!d) return;
  var f=document.getElementById("pgFrame"); if(!f) return;
  function fit(){
    try{ var b=f.contentDocument&&f.contentDocument.body;
         if(b){ var h=b.scrollHeight; if(h>240) f.style.height=(h+28)+"px"; } }catch(e){}
  }
  d.addEventListener("toggle", function(){
    if(d.open && !f.getAttribute("src")) f.setAttribute("src", f.getAttribute("data-src"));
  });
  f.addEventListener("load", function(){ fit(); setTimeout(fit,250); setTimeout(fit,1200); });
  var t; window.addEventListener("resize", function(){ clearTimeout(t); t=setTimeout(fit,150); });
})();
</script>
