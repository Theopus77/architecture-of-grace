/* ── fabric weave: cotton beside polyester ──────────── */
const FAB_W=190, FAB_H=140;
function fabThreads(){
  if(fabThreads.v) return fabThreads.v;
  const o=[];
  /* cotton on the left: a plain weave of spun yarn. polyester on the right: finer, straighter, tighter */
  for(let i=0;i<5;i++) o.push({f:"cot",dir:"v",pos:-84+i*18,w:13,seed:11+i});
  for(let j=0;j<9;j++) o.push({f:"cot",dir:"h",pos:-66+j*16,w:12,seed:31+j});
  for(let i=0;i<7;i++) o.push({f:"pol",dir:"v",pos:14+i*12.5,w:9,seed:51+i});
  for(let j=0;j<13;j++) o.push({f:"pol",dir:"h",pos:-70+j*11.5,w:8.5,seed:71+j});
  return (fabThreads.v=o);
}
function fabThread(ctx,t,det,L,clipTo){
  const rng=mulberry32(t.seed), cot=t.f==="cot";
  const lo=cot?-95:4, hi=cot?-4:95, a=t.dir==="v"?-70:lo, b=t.dir==="v"?70:hi;
  ctx.save();
  if(t.dir==="h"){ ctx.translate(0,t.pos); } else { ctx.translate(t.pos,0); ctx.rotate(Math.PI/2); }
  /* now the thread runs along +x from a to b, centred on y=0 */
  if(clipTo){ ctx.beginPath(); ctx.rect(clipTo[0],-t.w,clipTo[1]-clipTo[0],t.w*2); ctx.clip(); }
  /* shadow under the yarn, then the fibres */
  ctx.beginPath(); ctx.rect(a,-t.w/2,b-a,t.w); ctx.fillStyle=cot?"rgba(120,100,70,.18)":"rgba(70,80,100,.3)"; ctx.fill();
  const nf=cot?(det?16:11):(det?14:9), tw=cot?.32:.06;
  for(let k=0;k<nf;k++){
    const y0=(k/(nf-1)-.5)*t.w*.92, ph=rng()*6.3, wid=cot?(det?1.05+rng()*.5:1.2):(det?1.4:1.5);
    ctx.beginPath();
    for(let x=a;x<=b;x+=det?1.2:3){ const y=y0+Math.sin(x*tw+ph)*t.w*(cot?.12:.02)*(1-Math.abs(y0)/(t.w*.6)); x===a?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.strokeStyle=cot?`rgba(${226+rng()*20|0},${214+rng()*16|0},${180+rng()*20|0},.95)`:`rgba(${206+rng()*16|0},${216+rng()*12|0},${236},.94)`;
    ctx.lineWidth=wid; ctx.lineCap="round"; ctx.stroke();
    if(det){
      if(cot){ /* a cotton fibre is a flattened, twisted ribbon: its edges cross every few units, and a hollow runs down it */
        ctx.beginPath(); for(let x=a;x<=b;x+=1.2){ const y=y0+Math.sin(x*tw+ph)*t.w*.12*(1-Math.abs(y0)/(t.w*.6)); x===a?ctx.moveTo(x,y):ctx.lineTo(x,y); }
        ctx.strokeStyle="rgba(120,96,60,.4)"; ctx.lineWidth=.12; ctx.stroke();
        ctx.beginPath(); for(let x=a;x<=b;x+=.6){ const p=Math.sin(x*.9+ph*2), y=y0+Math.sin(x*tw+ph)*t.w*.12*(1-Math.abs(y0)/(t.w*.6))+p*wid*.35; x===a?ctx.moveTo(x,y):ctx.lineTo(x,y); }
        ctx.strokeStyle="rgba(100,80,50,.55)"; ctx.lineWidth=.07; ctx.stroke();
      } else { /* polyester: a smooth glass rod, bright down the middle, the odd matting speck inside */
        ctx.beginPath(); ctx.moveTo(a,y0-wid*.12); ctx.lineTo(b,y0-wid*.12); ctx.strokeStyle="rgba(255,255,255,.75)"; ctx.lineWidth=wid*.28; ctx.stroke();
        ctx.beginPath(); ctx.moveTo(a,y0-wid*.48); ctx.lineTo(b,y0-wid*.48); ctx.moveTo(a,y0+wid*.48); ctx.lineTo(b,y0+wid*.48); ctx.strokeStyle="rgba(60,70,90,.55)"; ctx.lineWidth=.08; ctx.stroke();
        ctx.fillStyle="rgba(40,50,70,.5)"; for(let i=0;i<40;i++){ ctx.fillRect(a+rng()*(b-a),y0+(rng()-.5)*wid*.6,.06,.06); }
      }
    }
  }
  if(cot&&det){ /* loose fibre ends sticking out of the yarn */
    ctx.strokeStyle="rgba(200,186,150,.8)"; ctx.lineWidth=.6;
    for(let i=0;i<10;i++){ const x=a+rng()*(b-a), s=rng()<.5?1:-1; ctx.beginPath(); ctx.moveTo(x,s*t.w*.4); ctx.quadraticCurveTo(x+2,s*t.w*.7,x+4+rng()*3,s*(t.w*.7+rng()*4)); ctx.stroke(); }
  }
  ctx.restore();
}
function fabBg(ctx){
  ctx.fillStyle="#e9e6dc"; ctx.fillRect(-FAB_W/2,-FAB_H/2,FAB_W,FAB_H);
  speckle(ctx,FAB_W,FAB_H,0xfab1,3000,[110,100,80],.02,.05,.25);
}
function fabPaint(ctx,det,L){
  fabBg(ctx);

  H.forEach(t=>fabThread(ctx,t,det,L));
  V.forEach(t=>fabThread(ctx,t,det,L));
  /* plain weave: where the count is odd the horizontal yarn comes back over the vertical one */
  H.forEach((t,j)=>V.forEach((v,i)=>{ if(t.f!==v.f||(i+j)%2) return; if(L&&!inView(L,v.pos,t.pos,Math.max(t.w,v.w))) return; fabThread(ctx,t,det,L,[v.pos-v.w/2-.3,v.pos+v.w/2+.3]); }));

/* ── DNA extraction: the white goo ──────────────────── */
const DNA_W=170, DNA_H=130;

    for(let s=0;s<len;s+=4){ pa+=(rng()-.5)*.5; px+=Math.cos(pa)*4; py+=Math.sin(pa)*4; pts.push([px,py]); }
    for(let k=0;k<n;k++) o.push({k:"strand",pts,off:(rng()-.5)*spread,w:.14+rng()*.3,ph:rng()*6.3,seed:(rng()*1e9)|0});

  for(let i=0;i<24;i++) bundle((rng()-.5)*150,(rng()-.5)*110,rng()*6.3,20+rng()*40,1+(rng()*3|0),1.2);

function dnaItem(ctx,c,det){

    const path=(jit)=>{ ctx.beginPath(); c.pts.forEach((p,i)=>{ const n=i>0?[p[1]-c.pts[i-1][1],-(p[0]-c.pts[i-1][0])]:[0,1], l=Math.hypot(n[0],n[1])||1, o=c.off+Math.sin(i*.6+c.ph)*jit, x=p[0]+n[0]/l*o, y=p[1]+n[1]/l*o; i?ctx.lineTo(x,y):ctx.moveTo(x,y); }); };

    path(1.2); ctx.strokeStyle="rgba(70,72,84,.28)"; ctx.lineWidth=c.w*2.6; ctx.stroke();      /* the dark rim: light bends round a thread */
    path(1.2); ctx.strokeStyle="rgba(255,255,252,.92)"; ctx.lineWidth=c.w; ctx.stroke();
    if(det){ path(1.2); ctx.strokeStyle="rgba(40,42,52,.5)"; ctx.lineWidth=.04; ctx.stroke(); }

    ctx.strokeStyle="rgba(120,120,130,.4)"; ctx.lineWidth=det?.08:.18;
    for(let i=0;i<(det?40:14);i++){ const a=rng()*6.3, x=c.x+(rng()-.5)*c.r, y=c.y+(rng()-.5)*c.r; ctx.beginPath(); ctx.moveTo(x,y); ctx.quadraticCurveTo(x+Math.cos(a)*c.r,y+Math.sin(a)*c.r*.5,x+Math.cos(a+1)*c.r*1.4,y+Math.sin(a+1)*c.r); ctx.stroke(); }

    ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2); ctx.fillStyle=`rgba(${120+rng()*60|0},${110+rng()*50|0},${90+rng()*40|0},${.2+rng()*.3})`; ctx.fill();
    if(det){ ctx.strokeStyle="rgba(60,55,45,.4)"; ctx.lineWidth=.06; ctx.stroke(); }

/* ── the letter e at high power: cellulose and pigment ─ */
function eInkAt(x,y){
  const m=SLIDE.eMask; if(!m) return 0;
  const px=Math.round((x+340)/680*m.w), py=Math.round((y+242.5)/485*m.h);
  if(px<0||py<0||px>=m.w||py>=m.h) return 0;
  return m.d[(py*m.w+px)*4+3]/255;
}
function drawLetterEHi(ctx,L){
  cachedView(ctx,L,"e",vc=>{
    const r=viewRect(L,3);
    vc.fillStyle="#d9cda8"; vc.fillRect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);
    /* fibres: cell-by-cell, so the same fibre is always in the same place */
    const cs=10;
    for(let gy=Math.floor(r.y0/cs);gy*cs<r.y1;gy++) for(let gx=Math.floor(r.x0/cs);gx*cs<r.x1;gx++){
      const h=mulberry32((gx*73856093^gy*19349663^0xe)|0);
      for(let k=0;k<3;k++){
        const x=gx*cs+h()*cs, y=gy*cs+h()*cs, a=(h()-.5)*Math.PI, len=14+h()*40, w=1.1+h()*1.7, seg=3, n=Math.ceil(len/seg);
        let px=x, py=y, pa=a;
        for(let s=0;s<n;s++){
          const qx=px+Math.cos(pa)*seg, qy=py+Math.sin(pa)*seg, ink=eInkAt((px+qx)/2,(py+qy)/2);
          const tone=Math.min(1,ink*1.4);
          vc.beginPath(); vc.moveTo(px,py); vc.lineTo(qx,qy); vc.lineCap="round";
          vc.strokeStyle=`rgba(${232-tone*200|0},${218-tone*196|0},${176-tone*160|0},.72)`; vc.lineWidth=w; vc.stroke();
          vc.beginPath(); vc.moveTo(px,py); vc.lineTo(qx,qy); vc.strokeStyle=tone>.5?"rgba(70,60,50,.35)":"rgba(150,130,90,.35)"; vc.lineWidth=w*.22; vc.stroke();   /* the lumen down the middle */
          px=qx; py=qy; pa+=(h()-.5)*.35;
        }
      }
    }
    /* ink: a wash that soaks into the sheet, then pigment grains sitting on the fibres. The edge of the stroke is ragged because paper is */
    const ps=.7;
    for(let y=Math.floor(r.y0/ps)*ps;y<r.y1;y+=ps) for(let x=Math.floor(r.x0/ps)*ps;x<r.x1;x+=ps){
      const ink=eInkAt(x,y); if(ink<.04) continue;
      const h=mulberry32(((x*7.3)|0)*73856093^((y*7.3)|0)*19349663);
      const cov=Math.min(1,ink*(0.6+h()*.7));
      vc.fillStyle=`rgba(30,24,16,${cov*.3})`; vc.fillRect(x,y,ps,ps);
      const nd=Math.round(cov*2.6);
      vc.beginPath(); for(let i=0;i<nd;i++){ const dx=x+h()*ps, dy=y+h()*ps, q=.05+h()*.11; vc.moveTo(dx+q,dy); vc.arc(dx,dy,q,0,Math.PI*2); }
      vc.fillStyle="rgba(14,10,8,.8)"; vc.fill();
    }
    /* stray specks of ink and a hair of dust on the paper */
    const h2=mulberry32(((r.x0)|0)*31^((r.y0)|0)*17);
    vc.fillStyle="rgba(20,16,12,.6)"; for(let i=0;i<50;i++){ const x=r.x0+h2()*(r.x1-r.x0), y=r.y0+h2()*(r.y1-r.y0); if(eInkAt(x,y)<.1&&h2()<.3) vc.fillRect(x,y,.14,.14); }
  });
}

/* ── blood smear (Wright's): a monolayer with a feathered edge ── */
function bloodList2(){
  if(bloodList2.v) return bloodList2.v;
  const rng=mulberry32(0xb100e), o=[], sp=.78;
  for(let y=-BLOOD_H/2; y<BLOOD_H/2; y+=sp*.9) for(let x=-BLOOD_W/2; x<BLOOD_W/2; x+=sp){
    /* the feathered edge (left) thins to single cells; the body is one cell thick; the thick end crowds and stacks */
    /* the smear is a tongue: narrow and thin at the feathered end, wide and crowded at the thick end */
    const fx=(x+BLOOD_W/2)/BLOOD_W, half=(BLOOD_H/2)*(.55+.45*Math.pow(fx,.7))*(.96+.04*Math.sin(x*.9)), ny=Math.abs(y)/half;
    const ey=ny>1?0:1-Math.pow(ny,2.4);

    const px=x+(rng()-.5)*sp*.5+(Math.round(y/(sp*.9))&1?sp/2:0), py=y+(rng()-.5)*sp*.4;

function bloodCell2(ctx,c,det){

function fieldFinish(ctx,cx,cy,r,L){

  const s=(L.obj===4?.55:L.obj===10?.3:0)*(L.quartz!==false?.45:1)*(L.prism?0:1);
  if(s>0){
    ctx.save(); ctx.globalCompositeOperation="screen";

    g=ctx.createRadialGradient(cx,cy,r*.84,cx,cy,r*.96); g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(.7,`rgba(255,214,120,${s*.35})`); g.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=g; ctx.fillRect(cx-r,cy-r,r*2,r*2);

  if(L.obj===100&&L.oil){
    ctx.save(); ctx.globalCompositeOperation="screen";
    let g=ctx.createRadialGradient(cx-r*.38,cy-r*.42,0,cx-r*.38,cy-r*.42,r*.8); g.addColorStop(0,"rgba(255,250,232,.14)"); g.addColorStop(.5,"rgba(255,246,220,.05)"); g.addColorStop(1,"rgba(255,246,220,0)");

    g=ctx.createRadialGradient(cx+r*.5,cy+r*.55,r*.02,cx+r*.5,cy+r*.55,r*.5); g.addColorStop(0,"rgba(255,236,200,.1)"); g.addColorStop(1,"rgba(255,236,200,0)");
    ctx.fillStyle=g; ctx.fillRect(cx-r,cy-r,r*2,r*2);

  }

  else if(L.spec==="virus") blit(ctx, SLIDE.virus);

  else if(L.spec==="leaf") drawLeaf(ctx, L);
  else if(L.spec==="diatom") drawDiatoms(ctx, L);
  else if(L.spec==="crystal") drawCrystals(ctx, L);

function specNote(spec){
  const es=S.lang==="es", o=S.lab.obj, L=S.lab;

  let line=es?(spec[key+"_es"]||spec.note40_es||spec.note_es):(spec[key+"_en"]||spec.note40_en||spec.note_en);
  if(spec.id==="onion" && L.stain==="iodine")
    line+=es?" El yodo está puesto: citoplasma ámbar, núcleo más marrón.":" Iodine is on: cytoplasm amber, nucleus a deeper brown.";
  if(spec.id==="pond" && L.stain==="none" && (L.illum==="dark"||L.illum==="slit"))
    line+=es?" El fondo está oscuro a propósito. Lo vivo se ve porque dispersa la luz.":" The background is dark on purpose. What is alive shows because it scatters the light.";
  if(spec.id==="crystal" && L.illum==="polar")
    line+=es?" Filtros cruzados: la sal es igual en toda dirección, así que queda negra. El azúcar dobla la luz y brilla en colores. Gira el ángulo: cada barra se apaga cuatro veces por vuelta.":" Crossed filters: salt is the same in every direction, so it stays black. Sugar bends the light and glows in colours. Turn the angle: each bar goes dark four times a turn.";
  if(spec.id==="hairs" && L.illum==="polar")
    line+=es?" Filtros cruzados: solo brillan los cristales en la base de los ganchos. Son de carbonato de calcio, como la tiza.":" Crossed filters: only the crystals in the hook bases shine. They are calcium carbonate, like chalk.";
  if(spec.id==="diatom" && (L.illum==="dark"||L.illum==="slit"))
    line+=es?" En campo oscuro el vidrio brilla. Así se ven mejor.":" In darkfield the glass shines. This is the best way to see them.";
  if(o===100 && !L.oil && spec.id!=="scale" && spec.id!=="e")
    line+=es?" Sin aceite el 100× se queda blando.":" Without oil the 100× stays soft.";
  if(L.dfNote) line+=t("dfBlock");
  if(L.lightOn && L.quartz!==false) line+=es
    ? " Lentes de cuarzo fundido: el vidrio más puro, sin borde de color, y dejan pasar el ultravioleta. Más nítido — pero la luz sigue siendo el límite."
    : " Fused-quartz lenses: the purest glass, no colour fringe, and they pass ultraviolet. Sharper — but light is still the limit.";
  else if(L.lightOn) line+=S.lang==="es"
    ? " Un borde violeta es el acromático, no la muestra. El polvo que gira con el ocular está en el ocular."
    : " A purple edge is the achromat, not the specimen. Dust that turns with the eyepiece is on the eyepiece.";
  return line;
}
function achromatFringe(ctx, src, w, h, cx, cy, r, strength){
  if(strength<0.05) return;
  const N=150;
  if(!achromatFringe.buf) achromatFringe.buf=document.createElement("canvas");
  const b=achromatFringe.buf;
  if(b.width!==N){ b.width=N; b.height=N; }
  const g=b.getContext("2d",{willReadFrequently:true});
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,N,N);
  g.drawImage(src, cx-r, cy-r, r*2, r*2, 0, 0, N, N);
  let im; try{ im=g.getImageData(0,0,N,N); }catch(e){ return; }
  const d=im.data, out=g.createImageData(N,N), o=out.data;
  const lum=i=>0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
  const shift=0.7+strength*2.6;
  for(let y=2;y<N-2;y++){
    for(let x=2;x<N-2;x++){
      const i=(y*N+x)*4;
      const e=Math.hypot(lum(i+4)-lum(i-4), lum(i+N*4)-lum(i-N*4));
      if(e<26) continue;
      const dx=x-N/2, dy=y-N/2, dist=Math.min(1, Math.hypot(dx,dy)/(N*0.46));
      const lat=0.22+dist*dist, sft=shift*lat, len=Math.hypot(dx,dy)||1;
      const ux=dx/len, uy=dy/len, k=Math.min(140, e*lat*0.85);
      const stamp=(px,py,R,G,B,a)=>{
        const vx=px|0, vy=py|0;
        if(vx<1||vy<1||vx>=N-1||vy>=N-1) return;
        const j=(vy*N+vx)*4;
        o[j]=Math.min(255,o[j]+R*a); o[j+1]=Math.min(255,o[j+1]+G*a);
        o[j+2]=Math.min(255,o[j+2]+B*a); o[j+3]=Math.min(255,o[j+3]+a*255);
      };
      stamp(x+ux*sft, y+uy*sft, 0.7, 0.25, 1, k/255);
      stamp(x-ux*sft*0.55, y-uy*sft*0.55, 0.6, 0.82, 0.22, k/255*0.5);
    }
  }
  g.putImageData(out,0,0);
  ctx.save(); ctx.globalCompositeOperation="screen";
  ctx.drawImage(b, cx-r, cy-r, r*2, r*2); ctx.restore();
}
function startEye(){

        const p=loc(e);
        const w=canvas.width, h=canvas.height, cx=w/2, cy=h/2, r=Math.min(w,h)*.46;
        const sx=p.x*(w/(p.rw||1)), sy=p.y*(h/(p.rh||1));
        const dx=sx-cx, dy=sy-cy;
        if(dx*dx+dy*dy <= r*r){
          const zoom=startEye.zoom||((S.lab.obj/4)*(w/420));
          const spec=screenToSpec(sx,sy,S.lab,cx,cy,zoom);
          if(!S.lab.mA || (S.lab.mA && S.lab.mB)){ S.lab.mA=spec; S.lab.mB=null; }
          else S.lab.mB=spec;
          const before=stairNow();
          tickMissions();
          if(stairNow()!==before) paint();
        }
      }
      drag=null;
    };
    wrap.addEventListener("pointerdown", down, {passive:false});
    wrap.addEventListener("pointermove", move);
    wrap.addEventListener("pointerup", up);
    wrap.addEventListener("pointercancel", up);
    wrap.addEventListener("touchmove", e=>{ if(drag) e.preventDefault(); }, {passive:false});
  }
  let last=performance.now();
  const draw=now=>{
    if(S.page!=="lab"){ cancelAnimationFrame(eyeRaf); return; }
    resize();
    const dt=Math.min(.1,(now-last)/1000); last=now;
    const L=S.lab, ctx=canvas.getContext("2d"); if(!ctx){ eyeRaf=requestAnimationFrame(draw); return; }
    const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=Math.min(w,h)*.46;
    if(w<8){ eyeRaf=requestAnimationFrame(draw); return; }
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle=cssVar("--metal","#3d4a55"); ctx.beginPath(); ctx.arc(cx,cy,r*1.1,0,Math.PI*2); ctx.fill();
    const ring=ctx.createRadialGradient(cx,cy,r*.96,cx,cy,r*1.12);
    ring.addColorStop(0,"#1a1610"); ring.addColorStop(.4,"#8a6116"); ring.addColorStop(.72,"#e0c070"); ring.addColorStop(1,"#2a2010");
    ctx.fillStyle=ring; ctx.beginPath(); ctx.arc(cx,cy,r*1.08,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#0a0c10"; ctx.beginPath(); ctx.arc(cx,cy,r*1.015,0,Math.PI*2); ctx.fill();
    ctx.save(); ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
    if(!L.lightOn){
      ctx.fillStyle="#07090c"; ctx.fillRect(cx-r,cy-r,r*2,r*2);
      ctx.fillStyle="rgba(237,234,226,.35)"; ctx.font=`${Math.round(w*.028)}px system-ui,sans-serif`;
      ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(S.lang==="es"?"lámpara apagada":"lamp off",cx,cy);
    } else if(L.cracked){
      const zoom=(L.obj/4)*(w/420);
      ctx.fillStyle="#8a8680"; ctx.fillRect(cx-r,cy-r,r*2,r*2);
      ctx.save(); ctx.globalAlpha=.28; ctx.translate(cx,cy); ctx.rotate(Math.PI); ctx.scale(zoom,zoom); ctx.translate(L.panX,L.panY);
      drawSpec(ctx, now, L, reduced, dt); ctx.restore();
      ctx.strokeStyle="rgba(20,20,20,.88)"; ctx.lineWidth=Math.max(1.5,w*.004);
      [[-.62,-.72,.74,.6],[.18,-.82,-.28,.74],[-.84,.12,.88,.04],[.52,-.22,-.18,.82],[.05,-.4,.7,.55]].forEach(([ax,ay,bx,by])=>{
        ctx.beginPath(); ctx.moveTo(cx+ax*r,cy+ay*r); ctx.lineTo(cx+bx*r,cy+by*r); ctx.stroke();
      });
      ctx.fillStyle="rgba(255,255,255,.18)";
      ctx.beginPath(); ctx.moveTo(cx-.2*r,cy-.5*r); ctx.lineTo(cx-.05*r,cy-.48*r); ctx.lineTo(cx-.12*r,cy-.2*r); ctx.closePath(); ctx.fill();
    } else {
      if(!L.clipped){ S.lab.panX+=8*dt; S.lab.panY+=3*dt; }
      const iris=.35+(L.dia/100)*.65, bright=.35+(L.dia/100)*.7;
      let blur=blurPx(L.coarse,L.fine,L.obj) + (L.obj===100 && !L.oil ? 7 : 0);
      if(L.prism) blur *= 0.84 + (bandNm(L.band)-420)/230*0.26;
      /* AOG-SCOPE-QUARTZ-V1 — fused-quartz objectives: purer glass, no colour fringe, a crisper edge */
      if(L.quartz!==false) blur *= 0.78;
      const zoom=(L.obj/4)*(w/420);
      if(!startEye.field) startEye.field=mkCan(64,64);
      const field=startEye.field;
      if(field.width!==w){ field.width=w; field.height=h; }
      const fctx=field.getContext("2d");
      const bg=(L.illum==="dark"||L.illum==="slit")?"#04050a":`rgba(236,228,204,${.5+bright*.38})`;
      fctx.fillStyle=bg; fctx.fillRect(0,0,w,h);
      fctx.save();
      fctx.translate(w/2, h/2);
      fctx.rotate(Math.PI); fctx.scale(zoom,zoom); fctx.translate(L.panX,L.panY);
      drawSpec(fctx, now, L, reduced, dt);
      fctx.restore();
      applyOptics(fctx, w, h, L);
      achromatFringe(fctx, field, w, h, w/2, h/2, Math.min(w,h)*.46, (L.obj===4?0.28:L.obj===10?0.5:L.obj===40?0.95:1.2)*(L.quartz!==false?0.12:1));
      micrograph(fctx, field, w, h, L, blur);   /* AOG-SCOPE-REALISM-V1 */
      if(blur<0.7){
        ctx.drawImage(field, 0, 0);
      } else {
        const factor=Math.max(0.06, 1/(1+blur*0.55));
        const ow=Math.max(12, Math.round(w*factor)), oh=Math.max(12, Math.round(h*factor));
        off.width=ow; off.height=oh;
        const octx=off.getContext("2d");
        octx.drawImage(field, 0, 0, ow, oh);
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality="low";
        ctx.drawImage(off, 0, 0, w, h);
        if(blur>4){
          ctx.fillStyle=`rgba(236,228,204,${Math.min(.35,(blur-4)/40)})`;
          ctx.fillRect(cx-r,cy-r,r*2,r*2);
        }
      }
      startEye.zoom=zoom;
      const ar=document.getElementById("abberead");
      if(ar) ar.textContent = L.prism ? (bandNm(L.band)+" nm · "+limitUm(L).d.toFixed(2)+" µm") : "";
      if(L.illum!=="dark" && L.illum!=="polar" && L.illum!=="slit" && L.stain!=="methylene" && !L.prism){
        ctx.fillStyle=`rgba(255,196,110,${.05+bright*.04})`;
        ctx.fillRect(cx-r,cy-r,r*2,r*2);
      }
      if(SLIDE.grain){
        ctx.globalAlpha=L.illum==="dark"?0.06:.12; ctx.drawImage(SLIDE.grain, cx-r, cy-r, r*2, r*2); ctx.globalAlpha=1;
      }
      fieldFinish(ctx,cx,cy,r,L);
      const g=ctx.createRadialGradient(cx,cy,r*iris*.55,cx,cy,r);
      g.addColorStop(0,"rgba(0,0,0,0)"); g.addColorStop(.7,"rgba(0,0,0,0)"); g.addColorStop(1,`rgba(0,0,0,${.58+(1-L.dia/100)*.38})`);
      ctx.fillStyle=g; ctx.fillRect(cx-r,cy-r,r*2,r*2);
      if(L.dia>82){ ctx.fillStyle=`rgba(255,255,240,${(L.dia-82)/80})`; ctx.fillRect(cx-r,cy-r,r*2,r*2); }
      const twist=(L.eyeTwist||0)/100*Math.PI*2;
      const dustDark=L.illum==="dark"||L.illum==="slit";
      SLIDE.dust.forEach(d=>{
        const ang=d.a+twist, rr=r*d.t;
        const x=cx+Math.cos(ang)*rr, y=cy+Math.sin(ang)*rr;
        const alpha=(dustDark?0.34:0.46)*(0.45+d.k);
        const col=dustDark?`rgba(214,210,200,${alpha})`:`rgba(16,12,8,${alpha})`;
        if(d.fiber){
          ctx.strokeStyle=col; ctx.lineWidth=Math.max(0.7,w*.0015);
          ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+d.fx*(w/700), y+d.fy*(w/700)); ctx.stroke();
        } else {
          ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,d.s*(w/420),0,Math.PI*2); ctx.fill();
        }
      });
      if(L.obj===100 && !L.oil){
        ctx.fillStyle="rgba(8,10,18,.32)"; ctx.fillRect(cx-r,cy-r,r*2,r*2);
      }
      if(!L.graticule){
        const barUm=L.obj===4?500:L.obj===10?200:L.obj===40?50:20;
        const barPx=(barUm/fovUm(L.obj))*(2*r);
        ctx.strokeStyle="rgba(255,255,255,.78)"; ctx.fillStyle="rgba(255,255,255,.78)";
        ctx.lineWidth=Math.max(1.5,w*.003);
        const bx=cx-barPx/2, by=cy+r*.78;
        ctx.beginPath(); ctx.moveTo(bx,by-4); ctx.lineTo(bx,by+4); ctx.moveTo(bx,by); ctx.lineTo(bx+barPx,by); ctx.moveTo(bx+barPx,by-4); ctx.lineTo(bx+barPx,by+4); ctx.stroke();
        ctx.font=`${Math.max(10,Math.round(w*.022))}px system-ui,sans-serif`;
        ctx.textAlign="center"; ctx.textBaseline="top";
        ctx.fillText(barUm>=200?(barUm/1000)+" mm":barUm+" µm", cx, by+6);
      }
      if(L.graticule) drawGraticule(ctx, cx, cy, r, L, w);
      drawMeasure(ctx, cx, cy, r, L, w, zoom);
    }
    ctx.restore();
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle="rgba(255,255,255,.16)"; ctx.lineWidth=Math.max(2,w*.008); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,r*1.04,0,Math.PI*2);
    ctx.strokeStyle="rgba(0,0,0,.35)"; ctx.lineWidth=Math.max(2,w*.01); ctx.stroke();
    eyeRaf=requestAnimationFrame(draw);
  };
  cancelAnimationFrame(eyeRaf);
  eyeRaf=requestAnimationFrame(draw);
}

function tickMissions(){
  const L=S.lab, band=focusBand(L.coarse,L.fine,L.obj);
  if(L.lightOn) S.missions.lamp=true;
  if(L.clipped) S.missions.clips=true;
  if(L.obj===4) S.missions.low=true;
  if(L.obj===10) S.missions.ten=true;
  if(L.obj===40) S.missions.forty=true;
  if(L.spec==="e"&&L.obj===4&&band==="in"&&L.lightOn&&!L.cracked) S.missions.coarse=true;
  if(L.obj===40&&band==="in"&&L.lightOn&&!L.cracked) S.missions.fine=true;
  if(L.dia>=28&&L.dia<=72&&L.lightOn&&!L.cracked&&band!=="out") S.missions.iris=true;
  if(L.spec==="onion"&&L.obj===40&&band==="in"&&L.lightOn&&!L.cracked && (L.stain==="iodine"||L.stain==="methylene"||L.stain==="safranin")) S.missions.onion=true;
  if(L.spec==="onion"&&L.stain==="iodine"&&L.obj===40&&band==="in"&&L.lightOn&&!L.cracked) S.missions.stain=true;
  if(L.illum==="dark"&&L.spec==="pond"&&L.lightOn&&!L.cracked&&L.stain==="none") S.missions.dark=true;
  if(L.illum==="slit"&&L.lightOn&&!L.cracked) S.missions.slit=true;
  if(L.illum==="polar"&&(L.spec==="onion"||L.spec==="elodea")&&L.lightOn&&!L.cracked) S.missions.polar=true;
  if(L.graticule&&L.obj===40&&L.mA&&L.mB&&L.lightOn&&!L.cracked) S.missions.micrometer=true;
  if(L.spec==="hair"&&L.obj===40&&band==="in"&&L.lightOn&&!L.cracked) S.missions.hair=true;
  if(L.obj===100&&L.oil&&L.spec==="cheek"&&band==="in"&&L.lightOn&&!L.cracked) S.missions.oil=true;
  if(L.spec==="bact"&&L.stain!=="none"&&L.obj>=40&&band==="in"&&L.lightOn&&!L.cracked) S.missions.bact=true;
  if(L.spec==="virus"&&L.obj===100&&L.oil&&band==="in"&&L.lightOn&&!L.cracked) S.missions.limit=true;
  if(L.prism&&L.spec==="virus"&&L.obj===100&&L.oil&&L.lightOn&&!L.cracked) S.missions.prism=true;
  /* AOG-SCOPE-ANCIENT-V1 — the ancient-text lesson */
  if(L.spec==="papyrus"&&L.obj===10&&band==="in"&&L.lightOn&&!L.cracked) S.missions.papyrus=true;
  if(L.spec==="scroll"&&L.obj===40&&band==="in"&&L.lightOn&&!L.cracked) S.missions.scroll=true;
  if(L.spec==="tablet"&&L.obj===40&&band==="in"&&L.lightOn&&!L.cracked) S.missions.tablet=true;
  if(L.spec==="papyrus"&&L.illum==="polar"&&L.lightOn&&!L.cracked) S.missions.inkpolar=true;
  /* AOG-SCOPE-LESSONS17-V1 — lessons 8–17 */
  const ok=L.lightOn&&!L.cracked, sharp=ok&&band==="in", meas=L.graticule&&L.mA&&L.mB&&ok;
  if(L.spec==="cheek"&&L.stain==="none"&&L.obj===40&&sharp&&L.dia<=50) S.missions.irisCheek=true;
  if(L.spec==="cheek"&&L.stain==="methylene"&&L.obj===40&&sharp) S.missions.cheekBlue=true;
  if(L.spec==="onion"&&L.stain==="safranin"&&L.obj===40&&sharp) S.missions.safOnion=true;
  if(L.spec==="yeast"&&L.stain==="methylene"&&L.obj>=40&&sharp&&(L.obj<100||L.oil)) S.missions.yeastBlue=true;
  if(L.spec==="scale"&&L.graticule&&L.obj===10&&sharp) S.missions.calib10=true;
  if(L.spec==="scale"&&L.graticule&&L.obj===40&&sharp) S.missions.calib40=true;
  if(L.spec==="scale"&&L.obj===4&&sharp) S.missions.fov4=true;
  if(meas&&L.obj===10) S.missions.measure10=true;
  if(meas&&L.spec==="hair"&&L.obj===40) S.missions.hairW=true;
  if(meas&&L.spec==="blood"&&L.obj===40) S.missions.rbcW=true;
  if(meas&&L.spec==="sand"&&L.obj===10) S.missions.sandW=true;
  if(L.spec==="bact"&&L.stain!=="none"&&L.obj===100&&L.oil&&sharp) S.missions.bact100=true;
  if(L.spec==="pollen"&&L.obj===40&&sharp) S.missions.pollen40=true;
  if(L.spec==="leaf"&&L.obj===40&&sharp) S.missions.stomata40=true;
  if(L.spec==="elodea"&&L.stain==="none"&&L.obj===40&&sharp) S.missions.elodea40=true;
  if(L.spec==="pond"&&L.stain==="none"&&L.obj===40&&sharp) S.missions.pond40=true;
  if(L.spec==="yeast"&&L.stain==="none"&&L.obj===40&&sharp) S.missions.yeast40=true;
  if(L.illum==="polar"&&ok&&L.spec==="crystal") S.missions.cryPolar=true;
  if(L.illum==="polar"&&ok&&L.spec==="sand") S.missions.sandPolar=true;
  if(L.illum==="polar"&&ok&&L.spec==="fabric") S.missions.fabricPolar=true;
  if(L.spec==="dog"&&(L.obj===10||L.obj===40)&&sharp) S.missions.dog40=true;
  if(meas&&L.spec==="fabric"&&L.obj===40) S.missions.fabricW=true;
  persist();
}

let walkTimer=0;
function walkStep(){
  if(!S.playing) return;
  if(S.walk<0) S.walk=0; else S.walk++;
  if(S.walk>=LIGHT_PATH.length){ S.playing=false; S.walk=LIGHT_PATH.length-1; }
  else { const p=LIGHT_PATH[S.walk]; S.sel=p; S.met[p]=true; persist(); }
  paint();
  if(S.playing) walkTimer=setTimeout(walkStep, 2200);
}

function paint(){
  clearTimeout(walkTimer);
  cancelAnimationFrame(eyeRaf);
  S.page=hashPage();
  paintChrome();
  lessonsHome();
  const view=document.getElementById("view");
  view.innerHTML = S.page==="meet"?pageMeet(): S.page==="lab"?pageLab(): S.page==="lessons"?lessonsView(): S.page==="find"?pageFind(): S.page==="job"?pageJob(): S.page==="print"?pagePrint(): pageHome();
  bindLessonBox(view);
  paintLessonsTop();   /* AOG-BENCH-TOP-V1 */
  lessonsBelow();
  if(S.page==="meet"){
    bindScope(document.getElementById("meetScope"), id=>{ S.sel=id; S.met[id]=true; persist(); paint(); });
    view.querySelectorAll("[data-part]").forEach(b=>b.onclick=()=>{ S.sel=b.getAttribute("data-part"); S.met[S.sel]=true; persist(); paint(); });
    view.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
      const a=b.getAttribute("data-act");
      if(a==="walk"){ S.playing=true; S.walk=-1; walkStep(); }
      if(a==="pause"){ S.playing=false; }
      if(a==="nextw"){ S.playing=false; if(S.walk<0)S.walk=0; else S.walk=Math.min(S.walk+1,LIGHT_PATH.length-1); S.sel=LIGHT_PATH[S.walk]; S.met[S.sel]=true; persist(); paint(); }
      if(a==="resetw"){ S.playing=false; S.walk=-1; paint(); }
      if(a==="prevp"&&S.sel){ const i=PARTS.findIndex(p=>p.p===S.sel); if(i>0){ S.sel=PARTS[i-1].p; S.met[S.sel]=true; persist(); paint(); } }
      if(a==="nextp"){ const i=S.sel?PARTS.findIndex(p=>p.p===S.sel):-1; const n=PARTS[(i+1)%PARTS.length]; S.sel=n.p; S.met[n.p]=true; persist(); paint(); }
    });
    if(S.playing) walkTimer=setTimeout(walkStep, 2200);
  }
  if(S.page==="lab"){
    startEye(); tickMissions();
    view.querySelectorAll("[data-slidemenu]").forEach(m=>m.onchange=()=>{
      const b=m.parentNode.querySelector(`[data-act="spec-${m.value}"]`); if(b) b.click();
    });
    document.querySelectorAll("#view [data-act], #lessons [data-act]").forEach(b=>b.onclick=()=>{
      const a=b.getAttribute("data-act"); const L=S.lab;
      if(a==="teach-lock"){ S.teacher="locked"; persist(); paint(); return; }
      if(a==="teach-open"){ S.teacher="open"; persist(); paint(); return; }
      const step=benchStep();
      const locked = (a==="obj10"||a==="obj40")&&step<LX("m2")
        || a==="obj100"&&step<LX("m13")
        || a==="illum-dark"&&step<LX("m3")
        || (a==="illum-slit"||a==="illum-polar"||a==="prism1"||a==="rife"||a==="universal")&&step<LX("m6")
        || a.startsWith("filter-")&&step<LX("m6")
        || a.startsWith("stain-")&&a!=="stain-none"&&step<LX("m3")
        || (a==="grat1"||a==="meas1")&&step<LX("m4")
        || a.startsWith("spec-")&&a!=="spec-e"&&step<LX("m8");
      if(locked) return;
      if(a==="lamp1") L.lightOn=true;
      if(a==="lamp0") L.lightOn=false;
      if(a==="clip1") L.clipped=true;
      if(a==="clip0") L.clipped=false;
      if(a==="obj4"){ L.obj=4; L.oil=false; L.dfNote=false; }
      if(a==="obj10"){ L.obj=10; L.oil=false; L.dfNote=false; }
      if(a==="obj40"){ L.obj=40; L.oil=false; L.dfNote=false; }
      if(a==="obj100"){
        L.obj=100;
        if(L.illum==="dark"){ L.illum="bright"; L.dfNote=true; }
      }
      if(a==="quartz1") L.quartz=true; if(a==="quartz0") L.quartz=false;
      if(a==="oil1") L.oil=true; if(a==="oil0") L.oil=false;
      if(a==="rife"){ L.lightOn=true; L.clipped=true; L.spec="pond"; L.stain="none"; L.illum="dark"; L.filter="day"; L.prism=false; L.obj=4; L.oil=false; L.dfNote=false; L.panX=0; L.panY=0; L.mA=null; L.mB=null; if(L.cracked){ L.cracked=false; L.coarse=18; L.fine=40; } }
      if(a==="universal"){
        L.lightOn=true; L.clipped=true; L.prism=true; L.band=92; L.illum="slit"; L.stain="none"; L.oil=false;
        if(L.spec!=="virus" && L.spec!=="pond" && L.spec!=="bact") L.spec="pond";
        L.obj=L.spec==="virus"?100:40;
        if(L.obj===100) L.oil=true;
        L.coarse=L.obj===100?42:40; L.fine=L.obj===100?38:45;
        L.panX=0; L.panY=0;
        if(L.cracked){ L.cracked=false; }
      }
      if(a==="newslide"){ L.cracked=false; L.coarse=18; L.fine=40; L.obj=4; L.panX=0; L.panY=0; L.mA=null; L.mB=null; L.oil=false; }
      if(a.startsWith("spec-")){
        L.spec=a.slice(5); L.panX=0; L.panY=0; L.mA=null; L.mB=null;
        if(!allowedStains(L.spec).includes(L.stain)) L.stain=DEFAULT_STAIN[L.spec]||"none";
        if(L.cracked){ L.cracked=false; L.coarse=18; L.fine=40; L.obj=4; }
      }
      if(a.startsWith("illum-")){
        const id=a.slice(6);
        if(id==="dark" && L.obj===100){ L.illum="bright"; L.dfNote=true; }
        else { L.illum=id; if(id!=="dark") L.dfNote=false; }
      }
      if(a.startsWith("stain-")) L.stain=a.slice(6);
      if(a==="prism1") L.prism=true;
      if(a==="prism0") L.prism=false;
      if(a.startsWith("filter-")){
        L.filter=a.slice(7);
        const jump={violet:94,blue:78,green:52,amber:22,day:8};
        if(L.prism && jump[L.filter]!=null) L.band=jump[L.filter];
      }
      if(a==="grat1") L.graticule=true;
      if(a==="grat0") L.graticule=false;
      if(a==="meas1"){ L.measure=!L.measure; if(!L.measure){ L.mA=null; L.mB=null; } if(L.measure) L.graticule=true; }
      tickMissions(); paint();
    });
    view.querySelectorAll("details.more-light").forEach(d=>{
      d.addEventListener("toggle", ()=>{ S.moreOpen=d.open; });
    });
    document.querySelectorAll("#view [data-knob], #lessons [data-knob]").forEach(inp=>{
      inp.oninput=()=>{
        const v=+inp.value, L=S.lab, k=inp.getAttribute("data-knob");
        if(k==="coarse"){ if(!L.cracked && wouldCrack(L.obj,v,L.fine) && v>L.coarse){ L.cracked=true; S.cracked++; persist(); paint(); return; } L.coarse=v; }
        if(k==="fine") L.fine=v;
        if(k==="dia") L.dia=v;
        if(k==="polar") L.polar=v;
        if(k==="band") L.band=v;
        if(k==="eyeTwist") L.eyeTwist=v;
        const lab=inp.closest("label"); if(lab){ const b=lab.querySelector("b"); if(b) b.textContent = k==="band" ? bandNm(v)+" nm" : k==="eyeTwist" ? Math.round(v/100*360)+"°" : Math.round(v); }
        const ab=document.querySelectorAll(".abbe"); if(k==="band"||k==="polar") ab.forEach(el=>{ el.textContent=abbeSentence(); });
        tickMissions();
        const band=focusBand(L.coarse,L.fine,L.obj);
        const fl=L.cracked?t("cracked").split(".")[0]: band==="in"?t("focusIn"):band==="near"?t("focusNear"):t("focusOut");
        const magEl=document.getElementById("focusread"); if(magEl) magEl.textContent=fl;
        const bar=document.getElementById("wdbar"); const w=wd(L.coarse,L.fine);
        if(bar){ bar.style.width=Math.round(w*100)+"%"; bar.style.background=w<.22?"var(--bad)":w<.4?"var(--warn)":"var(--good)"; }
      };
      inp.onchange=()=>{ if(stairNow()!==S.lastStair || JSON.stringify(S.missions)!==S.lastSig) paint(); };
    });
    const stepNow=stairNow();
    S.lastStair=stepNow; S.lastSig=JSON.stringify(S.missions);
  }
  if(S.page==="find" && S.find && !S.find.done){
    bindScope(document.getElementById("findScope"), id=>{
      const F=S.find, want=F.items[F.at].p;
      if(F.say&&F.say.ok) return;
      if(id===want){
        const first=F.tries===0;
        F.mark={[id]:"right"}; F.say={ok:true,text:t("thatsIt")}; S.met[id]=true;
        if(first) F.right++;
        persist(); paint();
        setTimeout(()=>{ F.at++; F.tries=0; F.mark={}; F.say=null; if(F.at>=F.items.length){ F.done=true; S.findBest=Math.max(S.findBest,F.right); persist(); } paint(); }, 700);
      } else {
        const tries=F.tries+1;
        if(tries>=2){ F.mark={[want]:"glow",[id]:"wrong"}; F.say={ok:false,text:t("glowing")}; F.missed.push(want); persist(); paint();
          setTimeout(()=>{ F.at++; F.tries=0; F.mark={}; F.say=null; if(F.at>=F.items.length){ F.done=true; S.findBest=Math.max(S.findBest,F.right); persist(); } paint(); }, 1100);
        } else { F.tries=tries; F.mark={[id]:"wrong"}; F.say={ok:false,text:t("notThat")}; paint(); }
      }
    });
    view.querySelectorAll("[data-act=findagain]").forEach(b=>b.onclick=()=>{ S.find=null; paint(); });
  }
  if(S.page==="find" && S.find && S.find.done){
    view.querySelectorAll("[data-act=findagain]").forEach(b=>b.onclick=()=>{ S.find=null; paint(); });
  }
  if(S.page==="job" && S.job && !S.job.done){
    view.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{
      const J=S.job; if(J.picked) return;
      const id=b.getAttribute("data-opt"), q=J.items[J.at];
      J.picked=id;
      if(id===q.a) J.right++; else if(q.p) J.missed.push(q.p);
      paint();
      setTimeout(()=>{ J.at++; J.picked=null; if(J.at>=J.items.length){ J.done=true; S.jobBest=Math.max(S.jobBest,J.right); persist(); } paint(); }, 850);
    });
  }
  if(S.page==="job" && S.job && S.job.done){
    view.querySelectorAll("[data-act=jobagain]").forEach(b=>b.onclick=()=>{ S.job=null; paint(); });
  }
  if(S.page==="print"){
    if(typeof bindLessonBox==="function") bindLessonBox(view);
    view.querySelectorAll("[data-act=doprint]").forEach(b=>b.onclick=()=>window.print());
  }
}

document.getElementById("langBtn").onclick=()=>{ S.lang=S.lang==="en"?"es":"en"; persist(); paint(); };
document.getElementById("themeBtn").onclick=()=>{ setTheme(S.theme==="dark"?"light":"dark"); paint(); };

/* AOG-SCOPE-PRINTANY-V2 — Jimmy: the worksheet must print from the browser
   menu and iPhone Share > Print, not only the in-page button. */
window.addEventListener("beforeprint", function(){
  try{
    if(S.page!=="print"){ S._back=S.page; S.page="print"; paint(); }
  }catch(e){}
});
window.addEventListener("afterprint", function(){
  try{
    if(S._back){ S.page=S._back; S._back=null; paint(); }
  }catch(e){}
});
window.addEventListener("hashchange", paint);
S.page=hashPage();
paint();

</script>
<script>
/* AOG-SCIPIC-PANEL-V1 - the guide loads only when the bar is opened, and the frame is
   grown to its content so the panel scrolls with the page instead of inside itself. */
(function(){
  var d=document.getElementById("pgPanel"); if(!d) return;
  var f=document.getElementById("pgFrame"); if(!f) return;
  function fit(){
    try{ var b=f.contentDocument&&f.contentDocument.body;
         if(b){ var h=b.scrollHeight; if(h>240) f.style.height=(h+28)+"px"; } }catch(e){}
  }
  d.addEventListener("toggle", function(){
    if(d.open && !f.getAttribute("src")) f.setAttribute("src", f.getAttribute("data-src"));
  });
  f.addEventListener("load", function(){ fit(); setTimeout(fit,250); setTimeout(fit,1200); });
  var t; window.addEventListener("resize", function(){ clearTimeout(t); t=setTimeout(fit,150); });
})();
</script>
