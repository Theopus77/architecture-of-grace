<style>
:root {
  --bg:#f4f0e6; --card:#fffcf7; --ink:#1a232c; --muted:#5c6670; --line:#ddd8cc;
  --steel:#2f5c6b; --steel-fg:#f4f8f9; --steel-soft:#e3eef2;
  --good:#2c7a4e; --good-fg:#f3faf5; --good-soft:#e3f0e8;
  --warn:#8a5a00; --warn-soft:#f4ead6; --bad:#9c3a2e; --bad-fg:#fdf6f4; --bad-soft:#f6e5e2;
  --chip:#efebe3; --lamp:#d9a84e; --metal:#3d4a55; --brass:#8a6116;
  --shadow:0 1px 3px rgb(26 35 44 / .08);
  --sans:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  --display:"Fraunces", "Iowan Old Style", Palatino, Georgia, serif;
}
.dark, [data-theme="dark"] {
  --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
  --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
  --good:#6fbf8b; --good-fg:#14181e; --good-soft:#1f3327;
  --warn:#d9a84e; --warn-soft:#332a18; --bad:#e08573; --bad-fg:#14181e; --bad-soft:#3a2622;
  --chip:#2a313c; --metal:#9aa3b0; --brass:#c4a056;
  --shadow:0 1px 3px rgb(0 0 0 / .35);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 16px/1.55 var(--sans); overflow-x:hidden; }
h1,h2,h3 { font-family:var(--display); font-weight:600; letter-spacing:-.02em; text-wrap:balance; }
h1 { font-size:clamp(1.5rem,4vw,2.4rem); margin:.2rem 0 .4rem; }
p { text-wrap:pretty; }
a { color:inherit; }
button, a, [role=button] { touch-action:manipulation; -webkit-tap-highlight-color: color-mix(in oklab, var(--steel) 22%, transparent); }
button { font:inherit; cursor:pointer; }
.wrap { max-width:1080px; margin:0 auto; padding: max(1.25rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(4rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); }
body:has(.aogtop) header .tools { display:none; }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:.75rem; margin-bottom:1rem; }
.brand { font-size:.75rem; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-decoration:none; min-height:44px; display:inline-flex; align-items:center; }
.tools { display:flex; gap:.5rem; }
.pill, .btn {
  min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:0 .9rem; font-weight:600; font-size:.9rem; display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
}
.btn-steel { background:var(--steel); color:var(--steel-fg); border-color:transparent; }
.btn-good { background:var(--good); color:var(--good-fg); border-color:transparent; }
.btn-bad { background:var(--bad); color:var(--bad-fg); border-color:transparent; }
.btn[disabled] { opacity:.5; cursor:default; }
.nav { display:flex; gap:4px; overflow-x:auto; border-bottom:2px solid var(--line); margin-bottom:1.25rem; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.nav::-webkit-scrollbar { display:none; }
.nav a { flex:0 0 auto; min-height:44px; display:inline-flex; align-items:center; padding:0 .75rem; text-decoration:none; color:var(--muted); font-weight:600; font-size:.9rem; border-bottom:2px solid transparent; margin-bottom:-2px; }
.nav a.on { color:var(--ink); border-color:var(--steel); }
.short { display:none; }
@media (max-width:767px){ .full{display:none;} .short{display:inline;} }
.muted { color:var(--muted); }
.lead { max-width:66ch; color:var(--muted); }
.card { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); }
.grid-home { display:grid; gap:1.5rem; margin-top:1.5rem; }
.cards { display:grid; gap:.75rem; }
.act { display:block; padding:1.1rem 1.2rem; text-decoration:none; }
.act:hover { border-color:var(--steel); }
.kicker { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); }
.badge { display:inline-flex; align-items:center; background:var(--steel-soft); color:var(--steel); border-radius:999px; padding:.15rem .5rem; font-size:.75rem; font-weight:700; letter-spacing:0; text-transform:none; white-space:nowrap; margin-left:.4rem; }
.stats { display:flex; flex-wrap:wrap; gap:.5rem 1rem; font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums; margin:.8rem 0; }
.split { display:grid; gap:1.25rem; margin-top:1.25rem; }
@media (min-width:768px){
  .grid-home { grid-template-columns: minmax(0,340px) minmax(0,1fr); align-items:start; }
  .split { grid-template-columns: minmax(240px,400px) minmax(0,1fr); }
  .lab-grid { grid-template-columns: minmax(0,1fr) minmax(280px,360px); }
  .sticky { position:sticky; top:.75rem; }
}
.scope { width:100%; height:auto; display:block; }
.scope-part { cursor:pointer; touch-action:manipulation; }
.scope-part .hit { fill:transparent; stroke:transparent; stroke-width:18; pointer-events:all; }
.scope-part.sel .shape { stroke:var(--steel)!important; stroke-width:3!important; }
.scope-part.glow .shape { stroke:var(--lamp)!important; stroke-width:5!important; filter:drop-shadow(0 0 8px var(--lamp)); }
.scope-part.right .shape { stroke:var(--good)!important; stroke-width:3.5!important; }
.scope-part.wrong .shape { stroke:var(--bad)!important; stroke-width:3.5!important; }
.scope.lit .scope-part:not(.glow) .shape { opacity:.35; }
.scope-beam { fill:none; stroke:var(--lamp); stroke-width:5; stroke-linecap:round; opacity:.9; pointer-events:none; filter:drop-shadow(0 0 6px var(--lamp)); }
.chips { display:flex; flex-wrap:wrap; gap:.4rem; margin-bottom:1rem; }
.chip { min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--chip); padding:0 .75rem; font-weight:600; font-size:.85rem; }
.chip.on { background:var(--steel); color:var(--steel-fg); border-color:transparent; }
.why { margin-top:.8rem; padding-top:.8rem; border-top:1px solid var(--line); }
.lab-grid { display:grid; gap:1.25rem; margin-top:1rem; align-items:start; }
.eye-box { background:color-mix(in oklab, var(--ink) 95%, black); border-radius:16px; padding:.75rem; border:1px solid var(--line); }
.eye-wrap { position:relative; margin:0 auto; width:100%; max-width:min(520px,48dvh); aspect-ratio:1; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
.slide-menu{font:inherit;font-size:max(16px,1rem);font-weight:700;min-height:44px;width:100%;max-width:340px;padding:0 2.2rem 0 .9rem;border-radius:12px;border:1.5px solid var(--steel);background:var(--card);color:var(--ink);cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--steel) 50%),linear-gradient(135deg,var(--steel) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.eye-wrap canvas { width:100%; height:100%; border-radius:50%; display:block; }
.phone-bar { display:flex; flex-direction:column; gap:.45rem; padding:.75rem .9rem; margin-top:1rem; }
.phone-bar .row, .desk-bar .row, .board .row { display:flex; justify-content:space-between; align-items:center; gap:.4rem; }
.phone-bar .row > span:last-child, .desk-bar .row > span:last-child, .board .row > span:last-child, .btns { display:flex; flex-wrap:wrap; gap:.35rem; justify-content:flex-end; }
.desk-bar { display:none; flex-direction:column; gap:.75rem; }
.board { padding:.85rem 1rem; }
.more-light { border-top:1px solid var(--line); margin-top:.35rem; }
.more-light summary {
  min-height:44px; display:flex; align-items:center; gap:.5rem; cursor:pointer;
  font-weight:700; font-size:.92rem; list-style:none;
}
.more-light summary::-webkit-details-marker { display:none; }
.more-light summary::after { content:"▾"; margin-left:auto; color:var(--muted); font-weight:600; }
.more-light:not([open]) summary::after { content:"▸"; }
.board .row { padding:.2rem 0; border-bottom:1px solid var(--line); }
.board .row:last-child { border-bottom:0; }
.board .tiny { min-width:5.6rem; }
.note-line { font-size:.8rem; color:var(--muted); margin:.45rem 0 0; }
.lab-stack { display:flex; flex-direction:column; }
@media (max-width:767px){
  .lab-stack .lab-grid { order:1; }
  .lab-stack .phone-bar { order:2; margin-top:.75rem; }
  .lab-stack .phone-follow { order:3; }
  .lab-stack .practical-box { order:4; }
}
.practical-box { margin-top:1.25rem; }
.stair { list-style:none; margin:.45rem 0 0; padding:0; display:flex; flex-direction:column; gap:.4rem; }
.stair > li { border:1px solid var(--line); border-radius:10px; padding:.5rem .7rem; }
.stair > li.now { border-color:var(--steel); background:var(--steel-soft); }
.stair > li.later { opacity:.62; }
.stair > li.done { display:flex; align-items:baseline; gap:.55rem; padding:.4rem .7rem; }
.stair > li.done h3 { margin:0; font-size:.95rem; }
.stair .do { display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.55rem; }
.stair .mk { margin:0; font-size:.68rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); }
.stair h3 { margin:.05rem 0 .15rem; font-size:1.02rem; }
.stair ol { list-style:none; margin:.25rem 0 0; padding:0; }
.stair li.step { display:flex; gap:.45rem; align-items:flex-start; padding:.16rem 0; font-size:.88rem; }
.research-note { margin-top:.75rem; padding-top:.7rem; border-top:1px solid var(--line); }
.practical-grid { display:grid; gap:.15rem .9rem; padding-left:0; list-style:none; margin:.5rem 0 0; }
@media (min-width:768px){
  .phone-bar{display:none !important;} .desk-bar{display:flex;} .phone-follow{display:none;}
  .lab-grid { grid-template-columns: minmax(0,1fr) minmax(300px, 380px); }
  .eye-stick { position:sticky; top:56px; }
  .practical-grid { grid-template-columns: 1fr 1fr; }
  .lab-lead { display:none; }
  .lab-page > h1 { font-size:1.45rem; margin:.05rem 0 .2rem; }
  .board .btn { min-height:36px; padding:0 .58rem; font-size:.8rem; }
  .board .row { padding:.12rem 0; }
  .board { padding:.65rem .85rem; }
}
@media (min-width:640px){ .knobs { grid-template-columns:1fr 1fr; } }
.knobs { display:grid; gap:.75rem; margin-top:1rem; }
@media (min-width:640px){ .knobs { grid-template-columns:1fr 1fr; } }
label.knob { display:block; }
label.knob span { display:flex; justify-content:space-between; font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.scope-knob { -webkit-appearance:none; appearance:none; width:100%; height:44px; background:transparent; margin:0; }
.scope-knob::-webkit-slider-runnable-track { height:8px; border-radius:999px; background:var(--chip); }
.scope-knob::-moz-range-track { height:8px; border-radius:999px; background:var(--chip); }
.scope-knob::-webkit-slider-thumb { -webkit-appearance:none; width:28px; height:28px; margin-top:-10px; border-radius:999px; background:var(--steel); border:2px solid var(--card); }
.scope-knob::-moz-range-thumb { width:28px; height:28px; border-radius:999px; background:var(--steel); border:2px solid var(--card); }
.wd { height:8px; background:var(--chip); border-radius:999px; overflow:hidden; }
.wd > i { display:block; height:100%; border-radius:999px; }
.opts { display:grid; gap:.5rem; margin-top:1rem; }
.opt { min-height:48px; text-align:left; padding:.75rem 1rem; border-radius:8px; border:1px solid var(--line); background:var(--card); font-weight:600; }
.opt.right { background:var(--good-soft); border-color:var(--good); }
.opt.wrong { background:var(--bad-soft); border-color:var(--bad); }
.opt.mark { background:var(--good-soft); }
.side { padding:1rem 1.15rem; }
.tiny { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); }
footer { margin-top:3rem; max-width:70ch; font-size:.9rem; color:var(--muted); }
.order-prompt { order:1; }
.order-scope { order:2; }
@media (min-width:768px){ .order-prompt,.order-scope { order:unset; } }
.plets text { font:800 12px var(--sans); fill:var(--ink); }
.plets circle { fill:var(--card); stroke:var(--muted); stroke-width:1.2; }
.plets line { stroke:var(--ink); stroke-width:1.1; }
.plets circle.dot { fill:var(--ink); stroke:none; }
.paper { padding:1.5rem; }
@media print {
  .no-print { display:none !important; }
  body { background:#fff; color:#111; }
  .paper { break-inside:auto; }
  .psheet + .psheet { break-before:page; }
}
.home-scope { max-height:min(42dvh,420px); }
@media (min-width:768px){ .home-scope { max-height:70vh; } }
.ok { color:var(--good); }
.no { color:var(--bad); }
.hide { display:none !important; }

.swatch { width:.7rem; height:.7rem; border-radius:99px; display:inline-block; border:1px solid rgb(26 35 44 / .25); flex:0 0 auto; }
.eye-hud {
  position:absolute; left:50%; bottom:9%; transform:translateX(-50%);
  color:#f4efe4; font:700 12px/1.25 var(--sans); letter-spacing:.02em;
  text-shadow:0 1px 3px #000; font-variant-numeric:tabular-nums;
  pointer-events:none; white-space:nowrap; text-align:center;
}
.eye-hud b { font-weight:700; color:#f2d48a; }
.filter-btn { gap:.4rem; }
.lab-extra { display:grid; gap:.75rem; margin-top:.75rem; }
@media (min-width:640px){ .lab-extra { grid-template-columns:1fr 1fr; } }
.eye-wrap.measuring { cursor:crosshair; }
.royal-plate { font:700 8px var(--sans); letter-spacing:.28em; fill:#c4a056; opacity:.9; }
.oil-warn { background:var(--warn-soft); border:1px solid color-mix(in oklab, var(--warn) 40%, var(--line)); }


/* AOG-SCIPIC-PANEL-V1 (2026-09-23) - Jimmy: "Can the Microscope missions and the TELESCOPE
   Missions get their own walk throughs like the TURN tables and sp-1200 just recieved?
   Embedded as something they could be printed out?" Same panel as AOG-PGPANEL-V1 on the
   decks: the guide is an iframe of its own file, loaded on first open, never printed here. */
.pg{margin:1.4rem 0 0;border:1px solid var(--line);border-radius:14px;background:var(--card);overflow:hidden}
.pg>summary{list-style:none;cursor:pointer;padding:.8rem 1rem;display:flex;align-items:center;gap:.7rem;
  font-weight:700;font-size:.98rem;min-height:44px}
.pg>summary::-webkit-details-marker{display:none}
.pg>summary::marker{content:""}
.pg .chev{flex:0 0 auto;transition:transform .15s ease;color:var(--muted);font-size:.9rem}
.pg[open] .chev{transform:rotate(90deg)}
.pg .pgsub{font-weight:400;color:var(--muted);font-size:.86rem;margin-left:auto;text-align:right}
.pg .pgbody{border-top:1px solid var(--line)}
.pg iframe{display:block;width:100%;border:0;min-height:60vh;background:var(--bg)}
.pg .pgfoot{padding:.65rem 1rem;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted);margin:0}
.pg .pgfoot a{color:inherit;font-weight:700}
@media print{ .pg{display:none !important} }
.print-pick .paper{padding:1.1rem 1.2rem}
.print-pick .paper .muted{margin:.2rem 0 0}

/* AOG-MIC-WIDE-V1 (2026-09-26) — Jimmy: sweet when the iPad is tall, yucky when wide.
   Wide and short screens: the eyepiece is sized to the screen's height so it, the
   four knobs and the controls panel all fit without scrolling; the page's navy
   ground runs to the bottom (no white band). */
html{background:#081828}
@media (orientation:landscape) and (min-width:900px){
  .lab-grid{grid-template-columns:minmax(0,1fr) minmax(300px,420px)!important;align-items:start}
  .eye-wrap{width:min(100%, calc(100vh - 360px))!important;height:auto!important;aspect-ratio:1;margin:0 auto}
  .eye-wrap canvas{width:100%!important;height:auto!important}
  .eye-box{padding:12px!important}
}

/* AOG-BENCH-TOP-V1: the masthead, nav row, bench switch and Lessons card live in /aog-bench.css */
/* ══ AOG-SCOPE-LESSONS-V1 (2026-09-27) — Jimmy: "The missions should be called the lessons and mimic the
   beautiful set up that THE DRUM MACHINE LESSON HAS." Same cards as the drum machine's Lessons view. ══ */
.lesson-box{padding:.9rem 1rem 1rem;margin:1rem 0 .4rem}
.lesson-box h3{margin:.05rem 0 .15rem;font-size:1.15rem}
.lesson-pick{display:grid;gap:.3rem;margin:0 0 .7rem}
.lesson-pick span{font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lesson-pick select{min-height:48px;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 .75rem;max-width:100%;width:100%}
.lsteps{list-style:none;margin:.3rem 0 0;padding:0}
.lsteps li{display:flex;gap:.5rem;align-items:flex-start;padding:.22rem 0;font-size:.95rem}
.lsteps li .tick{flex:0 0 auto;width:1.25rem;height:1.25rem;border-radius:99px;border:1px solid var(--line);text-align:center;line-height:1.15rem;font-size:.8rem;color:var(--good);margin-top:.1rem}
.lsteps li.ok .tick{border-color:var(--good);background:var(--good-soft)}
.lsteps li.ok s{color:var(--muted)}
.lesson-acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem;align-items:center}
.lesson-acts .pill{text-decoration:none}
.lesson-acts .note-line{flex-basis:100%;margin:.2rem 0 0}
.ok-line{color:var(--good);font-weight:700;margin:.7rem 0 0}
.lessons-wrap{display:grid;gap:1rem;grid-template-columns:1fr}
.lessons-wrap.lessons-one{grid-template-columns:1fr!important}
@media (min-width:820px){.lessons-wrap{grid-template-columns:1fr 1fr;align-items:start}}
.ladder-box{padding:.9rem 1rem 1rem;margin:1rem 0 .4rem}
.ladder{list-style:none;margin:.4rem 0 0;padding:0;display:flex;flex-direction:column;gap:.3rem}
.ladder li{border:1px solid var(--line);border-radius:10px;padding:.45rem .7rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;min-height:44px;cursor:pointer}
.ladder li:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.ladder li.later .lt{color:var(--muted)}
.ladder li.done .mk{color:var(--good)}
.ladder li.picked{border-color:var(--steel);background:var(--steel-soft)}
.ladder .mk{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);min-width:5.6rem}
.ladder .lt{font-weight:600}
.lab-lesson{margin-top:1rem}

<div class="wrap">
  <header class="no-print">
    <a class="brand" href="/" id="brand">The Microscope Lab</a>
    <div class="tools">
      <a class="pill" href="/microscope-guide" style="text-decoration:none">Picture guide</a>
      <button type="button" class="pill" id="langBtn">ES</button>
      <button type="button" class="pill" id="themeBtn">Dark</button>
    </div>
  </header>

const PARTS = [
  ["eyepiece","Eyepiece (ocular lens)","Ocular","The lens you look through. It magnifies the image the objective already made — usually 10×.","El lente por el que miras. Aumenta la imagen que el objetivo ya formó — normalmente 10×.","It is the second of the two lenses — its power multiplies the objective's.","Es el segundo de los dos lentes — su aumento multiplica el del objetivo.","Its 10× is easy to forget in the magnification math.","Es fácil olvidar su 10× en la matemática del aumento."],
  ["tube","Body tube","Tubo","The tunnel that holds the eyepiece the right distance above the objective.","El túnel que sostiene el ocular a la distancia correcta sobre el objetivo.","The two lenses only work together at one exact spacing — the tube is that spacing, built in metal.","Los dos lentes solo funcionan juntos a una distancia exacta — el tubo es esa distancia, hecha de metal.","It does no magnifying itself — it only holds the geometry.","No aumenta nada por sí mismo — solo sostiene la geometría."],
  ["nosepiece","Revolving nosepiece","Revólver","The rotating disk the objectives hang from. Turn it until the next lens clicks into place.","El disco giratorio del que cuelgan los objetivos. Gíralo hasta que el siguiente lente haga clic.","The click matters — between clicks, no lens is over the hole and you see nothing.","El clic importa — entre clics, ningún lente queda sobre el agujero y no ves nada.","Turn the nosepiece, never push the objective sideways.","Gira el revólver; nunca empujes el objetivo de lado."],
  ["objectives","Objective lenses","Objetivos","The lenses closest to the slide — 4×, 10×, 40×, and a 100× oil immersion. They make the first image.","Los lentes más cercanos a la lámina — 4×, 10×, 40× y un 100× de inmersión en aceite. Forman la primera imagen.","Total magnification is eyepiece × objective: 10× over 40× is 400×; over 100× oil is 1,000×.","El aumento total es ocular × objetivo: 10× sobre 40× es 400×; sobre 100× con aceite es 1,000×.","Always start with the shortest, lowest-power one — it is the easiest to focus and the safest. Oil only on the 100×.","Empieza siempre con el más corto y de menor aumento — es el más fácil de enfocar y el más seguro. Aceite solo en el 100×."],
  ["arm","Arm","Brazo","The curved backbone connecting the tube to the base. One of your two carrying handles.","La columna curva que conecta el tubo con la base. Una de tus dos agarraderas.","Everything optical hangs off it — a bent arm is a broken microscope.","Todo lo óptico cuelga de él — un brazo doblado es un microscopio roto.","Carry with one hand on the arm AND one under the base — never by the arm alone.","Carga con una mano en el brazo Y otra bajo la base — nunca solo del brazo."],
  ["stage","Stage","Platina","The flat platform the slide sits on, with a hole in the middle for light to pass through.","La plataforma plana donde va la lámina, con un agujero en el centro para que pase la luz.","The hole is the whole idea: the specimen must sit exactly where the light comes up.","El agujero es la idea completa: la muestra debe quedar justo donde sube la luz.","Center the specimen over the hole before you magnify — 400× of the wrong spot is nothing.","Centra la muestra sobre el agujero antes de aumentar — 400× del lugar equivocado no es nada."],
  ["clips","Stage clips","Pinzas","The two spring clips that hold the slide still on the stage.","Las dos pinzas de resorte que mantienen quieta la lámina sobre la platina.","At 400×, a nudge of a millimeter throws the specimen completely out of view.","A 400×, un empujón de un milímetro saca la muestra completamente de la vista.","If your specimen keeps drifting, the clips are not doing their job — reseat the slide.","Si tu muestra se mueve sola, las pinzas no están haciendo su trabajo — acomoda la lámina."],
  ["diaphragm","Diaphragm","Diafragma","The adjustable disk under the stage that controls how much light comes up through the hole.","El disco ajustable bajo la platina que controla cuánta luz sube por el agujero.","Detail lives in contrast. Too much light washes the image out; too little buries it.","El detalle vive en el contraste. Demasiada luz lava la imagen; muy poca la entierra.","A too-bright, ghostly image is a diaphragm problem, not a focus problem.","Una imagen fantasmal y demasiado brillante es problema del diafragma, no del enfoque."],
  ["light","Light source","Fuente de luz","The lamp (or mirror) in the base that sends light up through the diaphragm and the specimen.","La lámpara (o espejo) en la base que envía luz hacia arriba por el diafragma y la muestra.","A light microscope sees by light shining THROUGH the specimen — that is why thin slices work best.","Un microscopio óptico ve con luz que atraviesa la muestra — por eso las láminas delgadas funcionan mejor.","No image at all? Check the light before you blame the focus.","¿No hay imagen? Revisa la luz antes de culpar al enfoque."],
  ["coarse","Coarse adjustment knob","Tornillo macrométrico","The big knob. It moves the stage (or tube) a long way fast, for first focus on low power.","El tornillo grande. Mueve la platina (o el tubo) mucho y rápido, para el primer enfoque en bajo aumento.","Big moves find the image; it is the fast half of a two-speed system.","Los movimientos grandes encuentran la imagen; es la mitad rápida de un sistema de dos velocidades.","On high power it can drive the objective into the slide — crack. Low power only.","En alto aumento puede estrellar el objetivo contra la lámina — crac. Solo en bajo aumento."],
  ["fine","Fine adjustment knob","Tornillo micrométrico","The small knob. It moves the focus a tiny, precise amount — the sharpening tool.","El tornillo pequeño. Mueve el enfoque una cantidad diminuta y precisa — la herramienta de afinar.","On high power the focus zone is paper-thin; only tiny moves can stay inside it.","En alto aumento la zona de enfoque es finísima; solo movimientos diminutos se quedan dentro.","Blurry at 400×? Fine knob. The coarse knob is how slides get cracked.","¿Borroso a 400×? Micrométrico. El macrométrico es como se rompen las láminas."],
  ["base","Base","Base","The heavy foot the whole instrument stands on. Your second carrying handle.","El pie pesado sobre el que se para todo el instrumento. Tu segunda agarradera.","The weight is on purpose — a steady image starts with a machine that cannot tip.","El peso es a propósito — una imagen estable empieza con una máquina que no se vuelca.","One hand under the base whenever the microscope moves. No exceptions.","Una mano bajo la base siempre que el microscopio se mueva. Sin excepciones."]

  wrightNote:{en:"Wright's is on. Red cells go salmon with a pale center. White-cell nuclei go purple. Platelets are the tiny purple clusters.",es:"La tinción de Wright está puesta. Los glóbulos rojos se ponen salmón con el centro pálido. Los núcleos blancos se ponen morados. Las plaquetas son los racimos morados diminutos."},
  safraninNote:{en:"Safranin is on. Walls and nuclei go red. On the bacteria smear the rods go pink-red.",es:"La safranina está puesta. Paredes y núcleos se ponen rojos. En el frotis los bastones se ponen rojo rosado."},
  noStainNote:{en:"Ink is already a stain. Nothing to add.",es:"La tinta ya es una tinción. Nada que añadir."},
  hairStainNote:{en:"Hair is already pigmented. The brown is melanin in the cortex — not a stain you add.",es:"El cabello ya está pigmentado. El marrón es melanina en la corteza — no una tinción que añadas."},
  killedNote:{en:"The stain stopped the motion. That is the trade: you can see structure, or you can watch it live.",es:"La tinción detuvo el movimiento. Ese es el trato: ves la estructura, o la ves viva."},
  illumTile:{en:"Darkfield and color",es:"Campo oscuro y color"},
  illumBody:{en:"Brightfield is the school default. Darkfield blacks the field so living edges glow. Slit-ultra throws a narrow oblique beam — edges light from one side. Polarized light makes plant walls birefringent. The Risley prism picks one wavelength. It colors the lamp. It does not give a germ its own name.",es:"El campo claro es el default de la escuela. El campo oscuro pone el campo en negro para que los bordes vivos brillen. La rendija ultra lanza un haz oblicuo y angosto — los bordes se encienden de un lado. La luz polarizada hace birrefringentes las paredes vegetales. El prisma de Risley elige una longitud de onda. Colorea la lámpara. No le pone nombre a un germen."},
  scaleTile:{en:"The eyepiece micrometer",es:"El micrómetro del ocular"},
  scaleBody:{en:"A 100-unit scale sits in the eyepiece. At 40× (400× total) each unit is 2.5 µm. Line the specimen up, or tap two points. The stage micrometer slide is how that scale is calibrated.",es:"Una escala de 100 unidades vive en el ocular. A 40× (400× total) cada unidad es 2.5 µm. Alinea la muestra, o toca dos puntos. La lámina micrómetro de platina es cómo se calibra esa escala."},
  stainTile:{en:"Stain versus live",es:"Tinción contra vivo"},
  stainBody:{en:"Unstained onion is a ghost. Iodine makes nuclei appear. Methylene blue does the same for cheek cells — and kills a pond drop. Darkfield is how you keep them alive and still see them.",es:"La cebolla sin tinción es un fantasma. El yodo hace aparecer los núcleos. El azul de metileno hace lo mismo con las células de la mejilla — y mata una gota de estanque. El campo oscuro es cómo las dejas vivas y aún las ves."},
  polarizer:{en:"Polarizer",es:"Polarizador"},
  crossed:{en:"Crossed",es:"Cruzados"},
  oil:{en:"Immersion oil",es:"Aceite de inmersión"},
  lens:{en:"Lenses",es:"Lentes"},
  quartz:{en:"Quartz",es:"Cuarzo"},
  glass:{en:"Glass",es:"Vidrio"},
  oilOn:{en:"On the 100×",es:"En el 100×"},
  oilOff:{en:"Wipe off",es:"Sin aceite"},
  oilNeed:{en:"100× is built to look through a drop of oil. Without it the image stays dim and soft — that is physics, not a broken lens.",es:"El 100× está hecho para mirar a través de una gota de aceite. Sin él la imagen se queda tenue y blanda — eso es física, no un lente roto."},
  royalCard:{en:"The brass universal",es:"El universal de bronce"},
  royalBody:{en:"Quartz-bright brass, a Risley prism, darkfield, a slit of oblique light, polarized light, oil, and a micrometer. Turn the prism and the limit moves — violet splits a slightly smaller gap than red. It never reaches a virus. 1,000× with oil is still the ceiling. The color you see is the lamp, not a germ announcing its name.",es:"Bronce claro como cuarzo, un prisma de Risley, campo oscuro, una rendija de luz oblicua, luz polarizada, aceite y un micrómetro. Gira el prisma y el límite se mueve — el violeta separa un hueco un poco menor que el rojo. Nunca alcanza un virus. 1,000× con aceite sigue siendo el techo. El color que ves es la lámpara, no un germen diciendo su nombre."},
  researchLook:{en:"Live darkfield",es:"Campo oscuro en vivo"},
  seatPrism:{en:"Seat the prism",es:"Monta el prisma"},
  risley:{en:"Risley prism",es:"Prisma de Risley"},
  prismIn:{en:"In the beam",es:"En el haz"},
  prismOut:{en:"Out",es:"Fuera"},
  prismNote:{en:"Two wedges, turned against each other, pass one slice of the lamp. Shorter light, slightly finer limit. The whole field takes that color. A microbe does not glow its own.",es:"Dos cuñas, giradas una contra la otra, dejan pasar una rebanada de la lámpara. Luz más corta, límite un poco más fino. Todo el campo toma ese color. Un microbio no brilla el suyo."},
  oilStation:{en:"Oil the 100× and sharpen a cheek cell",es:"Aceita el 100× y afina una célula de mejilla"},
  oilHint:{en:"Click 100×, seat the oil, then the fine knob only. Coarse will crack the slide.",es:"Pasa a 100×, pon el aceite y luego solo el micrométrico. El macrométrico romperá la lámina."}
};
const SPECIMENS = [
  {id:"e",en:"Letter e",es:"Letra e",
    note_en:"Newsprint, upside down. That flip is the lenses.",
    note_es:"Papel de periódico, al revés. Ese giro son los lentes.",
    note4_en:"The whole e fits, upside down and backwards. Faint words sit in the paper around it. The flip is the machine.",
    note4_es:"Cabe la e entera, al revés y de espaldas. Palabras tenues en el papel alrededor. El giro es la máquina.",
    note10_en:"The stroke is no longer smooth. Ink feathers into the paper, and the grain of the sheet shows beside the black.",
    note10_es:"El trazo ya no es liso. La tinta se abre en el papel, y la fibra de la hoja se ve junto al negro.",
    note40_en:"You are inside the ink. Fibers cross the black. The letter has come apart into pigment sitting in cellulose.",
    note40_es:"Estás dentro de la tinta. Fibras cruzan el negro. La letra se deshizo en pigmento sobre celulosa.",
    note100_en:"A few soaked fibers. There is no finer letter hiding here. Oil sharpens the threads. It does not redraw the type.",
    note100_es:"Unas fibras empapadas. No hay una letra más fina escondida. El aceite afina los hilos. No redibuja el tipo."},
  {id:"onion",en:"Onion epidermis",es:"Epidermis de cebolla",
    note_en:"One layer of bricks, peeled off a scale.",
    note_es:"Una capa de ladrillos, pelada de una escama.",
    note4_en:"A pale sheet. Each brick is one cell. You are looking through a single layer.",
    note4_es:"Una lámina pálida. Cada ladrillo es una célula. Miras a través de una sola capa.",
    note10_en:"Dark walls, and a thin pale line where two walls meet — the middle lamella. The clear middle of each brick is the vacuole.",
    note10_es:"Paredes oscuras, y una línea pálida donde se juntan dos — la lámina media. El centro claro de cada ladrillo es la vacuola.",
    note40_en:"The nucleus is shoved against a wall, not floating in the middle. The speck inside it is the nucleolus. Strands cross the clear vacuole.",
    note40_es:"El núcleo está pegado a una pared, no flotando en el centro. El puntito adentro es el nucléolo. Hebras cruzan la vacuola clara.",
    note100_en:"One nucleus fills much of the hole. The wall reads as a double line. The vacuole is still the empty middle — empty on purpose.",
    note100_es:"Un núcleo llena buena parte del agujero. La pared se lee como una línea doble. La vacuola sigue siendo el centro vacío — vacío a propósito."},
  {id:"pond",en:"Pond water",es:"Agua de estanque",
    note_en:"A detained drop. What swims is alive. What only jitters is silt.",
    note_es:"Una gota detenida. Lo que nada está vivo. Lo que solo tiembla es limo.",
    note4_en:"A whole drop. Moving specks are organisms. Brown grit that only shivers is debris. Clip the slide or they leave the hole.",
    note4_es:"La gota entera. Los puntos que se mueven son organismos. La arenilla marrón que solo tiembla es detrito. Sujeta la lámina o se salen.",
    note10_en:"A slipper (paramecium), a green screw (spirogyra), a crawler (amoeba), a green cell with a whip (euglena). Pan to hunt. The drop is slowed so you can look.",
    note10_es:"Una zapatilla (paramecio), un tornillo verde (espirogira), uno que se arrastra (ameba), una célula verde con un látigo (euglena). Arrastra para buscar. La gota va lenta para que mires.",
    note40_en:"On the slipper: a haze of cilia, a clear circle that pulses (contractile vacuole), granules inside. The green screw is one chloroplast wound through the cell. Debris has no direction.",
    note40_es:"En la zapatilla: una bruma de cilios, un círculo claro que pulsa (vacuola contráctil), gránulos adentro. El tornillo verde es un cloroplasto enrollado. El detrito no tiene dirección.",
    note100_en:"A piece of one organism. Cilia are a moving edge, not a comb you can count tooth by tooth. Still micrometers. Not a virus.",
    note100_es:"Un pedazo de un organismo. Los cilios son un borde que se mueve, no un peine que cuentes diente por diente. Siguen siendo micrómetros. No un virus."},
  {id:"blood",en:"Blood smear",es:"Frotis de sangre",
    note_en:"A pulled film. Salmon discs, a few larger white cells, specks of platelets.",
    note_es:"Una película estirada. Discos salmón, unos glóbulos blancos más grandes, puntitos de plaquetas.",
    note4_en:"A pink island on the glass. Thick on one side, feathered on the other. That is how a smear is pulled. Cells are not separate yet.",
    note4_es:"Una isla rosa en el vidrio. Gruesa de un lado, plumosa del otro. Así se estira un frotis. Las células aún no se separan.",
    note10_en:"A field of salmon discs. The pale center is the thin middle of a doughnut, not a nucleus. Stacks are rouleaux — cells piled like coins.",
    note10_es:"Un campo de discos salmón. El centro pálido es la parte delgada de un donut, no un núcleo. Las pilas son rouleaux — células como monedas.",
    note40_en:"Rings with a light middle — red cells, no nucleus. A larger cell with a purple lobed nucleus is a neutrophil. Tiny purple clusters are platelets. A spiky disc is a drying artifact, not a diagnosis.",
    note40_es:"Anillos con el centro claro — glóbulos rojos, sin núcleo. Una célula mayor con núcleo morado y lobulado es un neutrófilo. Los racimos morados diminutos son plaquetas. Un disco con púas es un artefacto de secado, no un diagnóstico.",
    note100_en:"A field of red cells — dozens in the hole, not one. Each is a ring: darker rim, pale middle, still no nucleus. A white cell in this field is mostly nucleus and granules.",
    note100_es:"Un campo de glóbulos rojos — decenas en el agujero, no uno. Cada uno es un anillo: borde más oscuro, centro pálido, sigue sin núcleo. Un glóbulo blanco en este campo es casi todo núcleo y gránulos."},
  {id:"cheek",en:"Cheek cells",es:"Células de la mejilla",
    note_en:"Flat cells from inside a mouth. A nucleus, and rods that are not the cell.",
    note_es:"Células planas del interior de la boca. Un núcleo, y bastones que no son la célula.",
    note4_en:"Pale shapes overlapping like fried eggs. No brick wall. No green. Animal cells.",
    note4_es:"Formas pálidas, una sobre otra, como huevo frito. Sin muro de ladrillos. Sin verde. Células animales.",
    note10_en:"Irregular, folded, see-through. The dark spot off to one side is the nucleus, with a smaller speck — the nucleolus.",
    note10_es:"Irregulares, plegadas, transparentes. La mancha oscura a un lado es el núcleo, con un puntito menor — el nucléolo.",
    note40_en:"No wall — set this next to onion and the difference is the line. Short rods on the surface are bacteria that live in a mouth.",
    note40_es:"Sin pared — ponla junto a la cebolla y la diferencia es la línea. Los bastones cortos en la superficie son bacterias de la boca.",
    note100_en:"Chromatin looks mottled inside the nucleus. The rods show a highlight and a rounded end. They are about 1–5 µm. A virus is not in this crowd.",
    note100_es:"La cromatina se ve moteada dentro del núcleo. Los bastones tienen un brillo y un extremo redondo. Miden unos 1–5 µm. Un virus no está en este grupo."},
  {id:"hair",en:"Human hair",es:"Cabello humano",
    note_en:"One shaft. Brown is melanin. The broken dark line is the medulla. The tiles are the cuticle.",
    note_es:"Un tallo. El marrón es melanina. La línea oscura rota es la médula. Las tejas son la cutícula.",
    note4_en:"One strand across the glass. Cut blunt at one end, splitting at the tip. The brown is already in the hair — you did not stain it.",
    note4_es:"Un pelo sobre el vidrio. Cortado de un extremo, abierto en la punta. El marrón ya estaba en el pelo — no lo teñiste.",
    note10_en:"A cylinder. One edge catches the lamp and goes bright. Pigment sits in the cortex, under the surface.",
    note10_es:"Un cilindro. Un borde atrapa la lámpara y se pone brillante. El pigmento está en la corteza, bajo la superficie.",
    note40_en:"Scales like roof tiles, free edge toward the tip. A broken canal down the middle — the medulla. Many human hairs have a broken one, or none. A pale flake nearby is skin, not hair.",
    note40_es:"Escamas como tejas, el borde libre hacia la punta. Un canal roto en el centro — la médula. Muchos cabellos humanos la tienen rota, o no la tienen. Una escama pálida al lado es piel, no pelo.",
    note100_en:"A few scales and the pigment grains in the cortex. If the medulla is in this stretch, it is a gap, not a stripe that runs forever.",
    note100_es:"Unas escamas y los granos de pigmento en la corteza. Si la médula está en este tramo, es un hueco, no una raya que siga para siempre."},
  {id:"elodea",en:"Elodea leaf",es:"Hoja de elodea",
    note_en:"A leaf one cell thick. The green discs are chloroplasts. If they move, the cell is alive.",
    note_es:"Una hoja de una célula de grueso. Los discos verdes son cloroplastos. Si se mueven, la célula está viva.",
    note4_en:"A brick wall of plant cells, greener along the middle vein. The green is not paint on the cell. It is about to resolve into discs.",
    note4_es:"Un muro de células vegetales, más verde en la vena del centro. El verde no es pintura. Está a punto de resolverse en discos.",
    note10_en:"Boxes with sharp walls. Green discs parked on the edges. The middle is clear because the vacuole is clear.",
    note10_es:"Cajas de pared afilada. Discos verdes pegados a los bordes. El centro es claro porque la vacuola es clara.",
    note40_en:"Watch one box. The discs drift along the wall — cytoplasmic streaming. That motion is the cell being alive. A stain will stop it.",
    note40_es:"Mira una caja. Los discos se desplazan por la pared — flujo citoplasmático. Ese movimiento es la célula viva. Una tinción lo detiene.",
    note100_en:"Two or three chloroplasts, each a green disc with a lighter spot. You are not seeing the stacks inside them. That takes an electron beam.",
    note100_es:"Dos o tres cloroplastos, cada uno un disco verde con un punto más claro. No estás viendo las pilas de adentro. Eso pide un haz de electrones."},
  {id:"bact",en:"Bacteria smear",es:"Frotis de bacterias",
    note_en:"A film of culture. The shapes are rods, chains, and a corkscrew — bacteria, not viruses.",
    note_es:"Una película de cultivo. Las formas son bastones, cadenas y un sacacorchos — bacterias, no virus.",
    note4_en:"A dried oval on the glass. No shapes yet. That is the power, not an empty slide.",
    note4_es:"Un óvalo seco en el vidrio. Aún no hay formas. Es el aumento, no una lámina vacía.",
    note10_en:"Clumps in the film, and a haze. A few short dashes if the focus is honest. Too small to name from here.",
    note10_es:"Grumos en la película, y una bruma. Unos trazos cortos si el foco es honesto. Muy chicos para nombrar desde aquí.",
    note40_en:"Rods, chains of spheres, a corkscrew. About 1–5 µm. A bright line across a rod is where it is about to split. A virus is smaller than the smallest of these.",
    note40_es:"Bastones, cadenas de esferas, un sacacorchos. Unos 1–5 µm. Una línea clara atravesando un bastón es donde está por dividirse. Un virus es más chico que el menor de estos.",
    note100_en:"The rods have a rounded end and a highlight. The chains are separate spheres. This is as sharp as this lamp gets, and it is still bacteria.",
    note100_es:"Los bastones tienen un extremo redondo y un brillo. Las cadenas son esferas separadas. Así de nítido llega esta lámpara, y siguen siendo bacterias."},
  {id:"virus",en:"Virus?",es:"¿Virus?",
    note_en:"The cells a virus would live in. The guest is smaller than this lamp.",
    note_es:"Las células donde viviría un virus. El huésped es más chico que esta lámpara.",
    note4_en:"A sheet of host cells. Nothing smaller is on this glass in any way the light can draw.",
    note4_es:"Una lámina de células hospederas. Nada más chico está en este vidrio de una forma que la luz pueda dibujar.",
    note10_en:"Most cells are spread flat. A few have rounded up and look brighter. That rounding is damage — a cytopathic effect — not the virus.",
    note10_es:"La mayoría está extendida. Unas se redondearon y se ven más claras. Ese redondeo es daño — un efecto citopático — no el virus.",
    note40_en:"Grain in the cytoplasm, a nucleus, a nucleolus. No spikes. No dot you can honestly call a virion.",
    note40_es:"Grano en el citoplasma, un núcleo, un nucléolo. Sin púas. Ningún punto que puedas llamar virión con honestidad.",
    note100_en:"The host, as close as oil allows. Read the number on the bezel. If it says about 0.18 µm, a 0.10 µm coronavirus is still under the floor. Spikes are an electron-microscope picture.",
    note100_es:"El hospedero, tan cerca como el aceite permite. Lee el número del bisel. Si dice unos 0.18 µm, un coronavirus de 0.10 µm sigue bajo el piso. Las púas son una foto de microscopio electrónico."},
  {id:"pollen",en:"Pollen",es:"Polen",
    note_en:"Pollen from five plants, shaken onto one slide. Each plant makes its own shape.",
    note_es:"Polen de cinco plantas, sacudido en una lámina. Cada planta hace su propia forma.",
    note4_en:"Gold dust, heavier where the flower was tapped. Every speck is one grain.",
    note4_es:"Polvo dorado, más espeso donde se golpeó la flor. Cada puntito es un grano.",
    note10_en:"Now the shapes differ. Small spiky balls, big spiky balls, long orange ovals, grains with two little wings.",
    note10_es:"Ahora las formas cambian. Bolitas con púas, bolas grandes con púas, óvalos naranjas, granos con dos alitas.",
    note40_en:"Spiky balls are sunflower-type — the spikes hook onto bees. The two bubbles on pine pollen are air sacs; wind carries it. The orange oval is lily, covered in a net.",
    note40_es:"Las bolitas con púas son tipo girasol — las púas se enganchan a las abejas. Las dos burbujas del polen de pino son sacos de aire; el viento lo lleva. El óvalo naranja es lirio, cubierto de una red.",
    note100_en:"The spikes seen from the top are bright dots. The lily's net has pits and ridges. The shell (exine) is so tough it lasts for millions of years in mud.",
    note100_es:"Las púas vistas desde arriba son puntos claros. La red del lirio tiene hoyos y crestas. La cáscara (exina) es tan dura que dura millones de años en el lodo."},
  {id:"wing",en:"Butterfly wing",es:"Ala de mariposa",
    note_en:"A piece of wing with an eyespot. The colour is thousands of tiny scales.",
    note_es:"Un pedazo de ala con un ocelo. El color son miles de escamas diminutas.",
    note4_en:"An eye: a white dot, a black ring, a yellow ring. Orange around it and a brown vein. It looks painted. It is not.",
    note4_es:"Un ojo: un punto blanco, un anillo negro, un anillo amarillo. Naranja alrededor y una vena marrón. Parece pintado. No lo es.",
    note10_en:"The paint breaks into rows of tiles, like a roof. A bare patch shows where scales rubbed off — the empty sockets are still there.",
    note10_es:"La pintura se rompe en filas de tejas, como un techo. Una zona pelada muestra dónde se cayeron escamas — los huecos siguen ahí.",
    note40_en:"Each scale has a stem that plugs into a socket and a toothed tip. Every scale is one colour. The picture is made the way a mosaic is made.",
    note40_es:"Cada escama tiene un tallo que entra en un hueco y una punta con dientes. Cada escama es de un color. El dibujo se hace como un mosaico.",
    note100_en:"Fine ridges run down each scale. Under oil, faint cross-ribs show between them. The blue scales get their colour from those ridges bending light, not from a dye.",
    note100_es:"Crestas finas recorren cada escama. Con aceite se ven costillas cruzadas entre ellas. Las escamas azules sacan su color de esas crestas que doblan la luz, no de un tinte."},
  {id:"leaf",en:"Leaf peel (stomata)",es:"Piel de hoja (estomas)",
    note_en:"The skin peeled from under a purple leaf. Puzzle-piece cells, and little mouths called stomata.",
    note_es:"La piel del revés de una hoja morada. Células como piezas de rompecabezas, y bocas chicas llamadas estomas.",
    note4_en:"A thin lilac film. A faint net, and green specks scattered through it.",
    note4_es:"Una película lila y delgada. Una red tenue, y puntitos verdes por todas partes.",
    note10_en:"The net is cells with wavy walls that lock together like a jigsaw. Each green speck is a stoma — a pair of cells with a gap.",
    note10_es:"La red son células de pared ondulada que encajan como rompecabezas. Cada puntito verde es un estoma — un par de células con una abertura.",
    note40_en:"Two bean-shaped guard cells around a slit. They swell to open it and let air in; they go limp to close it. The purple is sap in the skin cells. Only the guard cells have green chloroplasts.",
    note40_es:"Dos células oclusivas con forma de frijol alrededor de una rendija. Se hinchan para abrirla y dejar entrar aire; se aflojan para cerrarla. El morado es savia de la piel. Solo las oclusivas tienen cloroplastos verdes.",
    note100_en:"Count the chloroplasts in one guard cell. The thick bright inner wall is why it bends when it swells. Iodine turns the starch grains dark.",
    note100_es:"Cuenta los cloroplastos de una célula oclusiva. La pared interna, gruesa y clara, es la razón de que se doble al hincharse. El yodo oscurece los granos de almidón."},
  {id:"diatom",en:"Diatoms",es:"Diatomeas",
    note_en:"Algae that live in glass boxes. Boats, needles, coins and triangles, from pond mud.",
    note_es:"Algas que viven en cajas de vidrio. Botes, agujas, monedas y triángulos, del lodo de un estanque.",
    note4_en:"Faint clear shapes. Glass is hard to see in bright light. Try darkfield.",
    note4_es:"Formas claras y tenues. El vidrio cuesta verlo con luz clara. Prueba el campo oscuro.",
    note10_en:"Boats (Navicula), long bars (Pinnularia), thin needles, round coins. Each is one cell inside a two-part glass case, like a pill box.",
    note10_es:"Botes (Navicula), barras largas (Pinnularia), agujas finas, monedas redondas. Cada uno es una célula dentro de una caja de vidrio de dos partes, como un pastillero.",
    note40_en:"Lines across the boats and rows of dots on the coins. The line down the middle of a boat is the raphe — a slit it glides with.",
    note40_es:"Líneas cruzando los botes y filas de puntos en las monedas. La línea del centro del bote es el rafe — una rendija con la que se desliza.",
    note100_en:"The dots are pores, less than a micrometer apart. Lens makers once tested their best lenses on diatoms: if the rows showed, the lens was good.",
    note100_es:"Los puntos son poros, a menos de un micrómetro. Antes los fabricantes probaban sus mejores lentes con diatomeas: si se veían las filas, el lente era bueno."},
  /* AOG-SCOPE-ANCIENT-V1 (2026-09-26) — Jimmy: "Could the Microscope have some biblical / ancient
     texts to examine?" Three slides a conservator would put under the lens: papyrus with carbon
     ink (the material of Egyptian and early Greek scripture), a parchment fragment with iron-gall
     ink in a Hebrew square hand (what a Dead Sea Scroll is made of), and a clay tablet with
     cuneiform (the oldest writing). Drawn as material: fibres, follicles, ink corrosion, wedge
     impressions. The words are shapes, not a quoted text. */
  {id:"papyrus",en:"Papyrus with ink",es:"Papiro con tinta",
    note_en:"A scrap of papyrus with a line of Greek letters in carbon ink. Papyrus is a plant, pressed into a sheet.",
    note_es:"Un pedazo de papiro con una línea de letras griegas en tinta de carbón. El papiro es una planta prensada en una hoja.",
    note4_en:"A tan sheet with a woven look. Dark letters sit on top. One edge is torn and frayed.",
    note4_es:"Una hoja color arena con aspecto tejido. Letras oscuras encima. Un borde está roto y deshilachado.",
    note10_en:"The weave is two layers of strips: one running across, one running down, pressed together. The ink follows the strips — it sat on the surface and never soaked in.",
    note10_es:"El tejido son dos capas de tiras: una atravesada, otra hacia abajo, prensadas. La tinta sigue las tiras — quedó en la superficie y nunca se empapó.",
    note40_en:"Each strip is made of long plant cells with thin walls, like straws laid side by side. The ink is soot in gum: tiny black particles caught in the fibres, thicker where the pen started a stroke.",
    note40_es:"Cada tira está hecha de células vegetales largas de pared delgada, como pajitas una junto a otra. La tinta es hollín en goma: partículas negras diminutas atrapadas en las fibras, más gruesa donde la pluma empezó el trazo.",
    note100_en:"Single fibre cells with their pitted walls. Carbon ink is chemically dead — it does not fade or eat the page, which is why Egyptian papyri are still legible after 3,000 years. Try the polarized bench: the cellulose lights up, the ink stays black.",
    note100_es:"Células de fibra individuales con sus paredes punteadas. La tinta de carbón es químicamente inerte — no se decolora ni come la página; por eso los papiros egipcios siguen legibles tras 3.000 años. Prueba el banco polarizado: la celulosa se ilumina, la tinta queda negra."},
  {id:"scroll",en:"Scroll fragment (parchment)",es:"Fragmento de rollo (pergamino)",
    note_en:"A fragment of parchment with Hebrew square letters in iron-gall ink — the material of the Dead Sea Scrolls. Parchment is animal skin, scraped thin.",
    note_es:"Un fragmento de pergamino con letras hebreas cuadradas en tinta ferrogálica — el material de los Rollos del Mar Muerto. El pergamino es piel de animal raspada.",
    note4_en:"A cream skin with a smooth, slightly shiny face. Brown-black letters hang from faint ruled lines. Dark spots and a crack along one side.",
    note4_es:"Una piel color crema con cara lisa, algo brillante. Letras marrón-negras cuelgan de líneas guía tenues. Manchas oscuras y una grieta en un lado.",
    note10_en:"The letters hang below the line — that is how Hebrew scribes ruled a page. The ruling was scored with a dry point, not drawn. Tiny dots in a pattern are hair follicles: this side was the hair side of the skin.",
    note10_es:"Las letras cuelgan bajo la línea — así regían la página los escribas hebreos. La guía se marcó con punta seca, no dibujada. Puntitos en patrón son folículos: este lado era el lado del pelo de la piel.",
    note40_en:"Iron-gall ink bites into the skin. Around each stroke the parchment is browned — the acid halo. Where the ink was thick it has cracked and lifted in flakes. The follicles are small pits with a raised rim.",
    note40_es:"La tinta ferrogálica muerde la piel. Alrededor de cada trazo el pergamino está pardo — el halo ácido. Donde la tinta fue gruesa se agrietó y se levanta en escamas. Los folículos son hoyitos con borde levantado.",
    note100_en:"Collagen fibres of the skin, matted flat by scraping. Inside a stroke, the ink is a crust with an orange rim of rust. Conservators read this rim to date the damage, and they never touch it with water. The scrolls survived because the caves were dry.",
    note100_es:"Fibras de colágeno de la piel, aplastadas por el raspado. Dentro de un trazo, la tinta es una costra con un borde naranja de óxido. Los conservadores leen ese borde para fechar el daño, y nunca lo tocan con agua. Los rollos sobrevivieron porque las cuevas eran secas."},
  {id:"tablet",en:"Clay tablet (cuneiform)",es:"Tablilla de arcilla (cuneiforme)",
    note_en:"A corner of a clay tablet with cuneiform — the oldest writing, pressed into wet clay with a reed. Under the lens it is a landscape of wedges.",
    note_es:"Una esquina de una tablilla de arcilla con cuneiforme — la escritura más antigua, marcada en arcilla húmeda con una caña. Bajo la lente es un paisaje de cuñas.",
    note4_en:"Grey-brown clay, rows of small triangular dents in lines. A chipped corner. This is reflected light: the lamp is above, not below — clay is not see-through.",
    note4_es:"Arcilla gris-parda, filas de hendiduras triangulares en líneas. Una esquina astillada. Es luz reflejada: la lámpara está arriba, no abajo — la arcilla no es transparente.",
    note10_en:"Each sign is a group of wedges: a deep head where the reed corner went in first, then a shallowing tail. The scribe held the reed at one angle, so every wedge points the same way.",
    note10_es:"Cada signo es un grupo de cuñas: una cabeza profunda donde entró primero la esquina de la caña, luego una cola que se va aplanando. El escriba sostuvo la caña en un ángulo, así todas las cuñas apuntan igual.",
    note40_en:"The clay is grains of silt and tiny mica flakes that glint. Inside a wedge the walls are smooth — the reed pressed, it did not cut. A hairline crack runs from the chipped corner: the tablet was baked, or burned in a fire that saved it.",
    note40_es:"La arcilla son granos de limo y escamitas de mica que brillan. Dentro de una cuña las paredes son lisas — la caña presionó, no cortó. Una grieta fina sale de la esquina astillada: la tablilla fue cocida, o se quemó en un incendio que la salvó.",
    note100_en:"Mica flakes and quartz grains at the edge of a wedge. A fingerprint ridge on the flat between two signs — the scribe's own thumb, 4,000 years ago. Baked clay is the most permanent writing surface people have made.",
    note100_es:"Escamas de mica y granos de cuarzo al borde de una cuña. Una cresta de huella dactilar en el plano entre dos signos — el pulgar del escriba, hace 4.000 años. La arcilla cocida es la superficie de escritura más permanente que la gente ha hecho."},
  {id:"crystal",en:"Salt & sugar",es:"Sal y azúcar",
    note_en:"A drop of salt water and a drop of sugar water, dried. Salt makes cubes. Sugar makes slanted bars.",
    note_es:"Una gota de agua con sal y una de agua con azúcar, secas. La sal hace cubos. El azúcar hace barras inclinadas.",
    note4_en:"Glittering specks where the water dried. Some big, some tiny.",
    note4_es:"Puntitos que brillan donde se secó el agua. Unos grandes, otros diminutos.",
    note10_en:"Squares and long six-sided bars. The squares are salt. The bars are sugar.",
    note10_es:"Cuadrados y barras largas de seis lados. Los cuadrados son sal. Las barras son azúcar.",
    note40_en:"Big salt cubes have steps inside, like a hollow pyramid — a hopper crystal. The edges look dark because the light bends there.",
    note40_es:"Los cubos grandes de sal tienen escalones adentro, como una pirámide hueca — un cristal tolva. Los bordes se ven oscuros porque ahí se dobla la luz.",
    note100_en:"One crystal edge fills the hole. On the research bench, try Polarized: salt goes black, sugar lights up in colours.",
    note100_es:"Un borde de cristal llena el agujero. En el banco de investigación, prueba Polarizado: la sal se vuelve negra, el azúcar se enciende en colores."},
  {id:"hairs",en:"Leaf hairs",es:"Pelos de hoja",
    note_en:"A leaf covered in tiny hairs. Some are hooks. Some are glass beads on stalks.",
    note_es:"Una hoja cubierta de pelitos. Unos son ganchos. Otros son cuentas de vidrio en tallitos.",
    note4_en:"A green leaflet with a toothed edge. A pale midrib, and side veins that each run out to a tooth. The leaf looks frosted.",
    note4_es:"Una hojita verde con borde dentado. Una vena central clara, y venas que terminan cada una en un diente. La hoja se ve escarchada.",
    note10_en:"The frost is hairs. Short white hooks all point toward the tip. Round shiny dots are glands.",
    note10_es:"La escarcha son pelos. Ganchitos blancos que apuntan hacia la punta. Los puntos redondos y brillantes son glándulas.",
    note40_en:"Each hook is one cell, with a small crystal in its round base. The glands are clear beads, some on stalks, some sitting flat. They hold the plant's oils and smell. Mint, tomato and sage have them too.",
    note40_es:"Cada gancho es una sola célula, con un cristal chico en su base redonda. Las glándulas son cuentas claras, unas en tallito, otras planas. Guardan los aceites y el olor de la planta. La menta, el tomate y la salvia también las tienen.",
    note100_en:"Under a bead, a ring of little cells that make the oil. The bead turns from clear to amber as it ages.",
    note100_es:"Bajo cada cuenta, un anillo de celulitas que hacen el aceite. La cuenta pasa de clara a ámbar con el tiempo."},
  {id:"dog",en:"Dog hair & tick",es:"Pelo de perro y garrapata",
    note_en:"A young tick holding on to a dog's hairs. Eight legs, a hard shield, and mouthparts built to stay in.",
    note_es:"Una garrapata joven agarrada a los pelos de un perro. Ocho patas, un escudo duro y una boca hecha para quedarse.",
    note4_en:"The whole animal fits easily in the hole — a young tick, under 1 mm. Count the legs: eight, so it is an arachnid, like a spider, not an insect.",
    note4_es:"El animal entero cabe de sobra en el agujero — una garrapata joven, de menos de 1 mm. Cuenta las patas: ocho, así que es un arácnido, como una araña, no un insecto.",
    note10_en:"The dark shield on its back is the scutum. Two shiny eyes sit at its edges. The scalloped back edge is the festoons. The thick hair has a wide dark core.",
    note10_es:"El escudo oscuro de la espalda es el escudo dorsal. Dos ojos brillantes están en sus bordes. El borde de atrás, en ondas, son los festones. El pelo grueso tiene un centro oscuro y ancho.",
    note40_en:"Look at the front. Two club-shaped feelers (palps) guard a blade with rows of teeth that point backward — that is why a tick is hard to pull out. The dog hair's core is wide and full of air cells. Put a human hair next to it: its core is thin, broken, or missing.",
    note40_es:"Mira el frente. Dos antenitas en forma de mazo (palpos) cuidan una hoja con filas de dientes que apuntan hacia atrás — por eso cuesta sacar una garrapata. El centro del pelo de perro es ancho y lleno de celdas de aire. Ponlo junto a un pelo humano: su centro es delgado, roto o no está.",
    note100_en:"The teeth on the blade, row by row. Each foot ends in two hooked claws and a pad. On the first feet, a small pit smells for breath and warmth.",
    note100_es:"Los dientes de la hoja, fila por fila. Cada pata termina en dos garras curvas y una almohadilla. En las primeras patas, un hoyito huele el aliento y el calor."},
  /* AOG-SCOPE-REALSLIDES-V1 — five more slides, each with one plain line per power */
  {id:"section",en:"Leaf cross-section",es:"Corte de hoja",
    note_en:"A leaf cut edge-on. Every layer has a job.",
    note_es:"Una hoja cortada de canto. Cada capa tiene un trabajo.",
    note4_en:"A thin green stripe with a bump in the middle. The bump is the main vein.",
    note4_es:"Una franja verde delgada con un bulto en medio. El bulto es la vena principal.",
    note10_en:"Top skin, then tall cells packed like fence posts, then loose round cells with air between. The bump holds the pipes.",
    note10_es:"Piel de arriba, luego células altas como postes de cerca, luego células redondas sueltas con aire entre ellas. El bulto guarda las tuberías.",
    note40_en:"The fence posts are palisade cells, full of green chloroplasts. On the bottom skin, find a gap between two bean-shaped guard cells: a stoma. Air comes in there.",
    note40_es:"Los postes son células en empalizada, llenas de cloroplastos verdes. En la piel de abajo, busca un hueco entre dos células con forma de frijol: un estoma. Por ahí entra el aire.",
    note100_en:"Count the chloroplasts in one palisade cell. In the vein, the big round pipes are xylem: they carry water up. Their thick walls are why they do not collapse.",
    note100_es:"Cuenta los cloroplastos de una célula en empalizada. En la vena, los tubos grandes y redondos son xilema: suben el agua. Sus paredes gruesas evitan que se aplasten."},
  {id:"fly",en:"Fly wing",es:"Ala de mosca",
    note_en:"One wing from a house fly. A clear sheet held up by tubes.",
    note_es:"Un ala de mosca doméstica. Una lámina clara sostenida por tubos.",
    note4_en:"The whole wing fits. The dark lines are veins. The thick front edge is the costa.",
    note4_es:"Cabe el ala entera. Las líneas oscuras son venas. El borde grueso de adelante es la costa.",
    note10_en:"The veins are hollow tubes. Blood and air run through them. Between the veins the sheet is see-through.",
    note10_es:"Las venas son tubos huecos. Por ellos corren sangre y aire. Entre las venas la lámina se transparenta.",
    note40_en:"The sheet is not bare. It is covered in tiny hairs, all leaning toward the tip. Bristles stand along the front edge.",
    note40_es:"La lámina no está desnuda. Está cubierta de pelitos, todos inclinados hacia la punta. Cerdas se paran en el borde de adelante.",
    note100_en:"One vein: wall and hollow. The little hairs help air flow over the wing. Nothing smaller shows. The wing is two sheets pressed together.",
    note100_es:"Una vena: pared y hueco. Los pelitos ayudan a que el aire fluya sobre el ala. Nada más chico se ve. El ala son dos láminas pegadas."},
  {id:"fern",en:"Fern spore capsules",es:"Cápsulas de esporas de helecho",
    note_en:"The brown dots under a fern leaf. Each is a bag that throws spores.",
    note_es:"Los puntos marrones bajo una hoja de helecho. Cada uno es una bolsa que lanza esporas.",
    note4_en:"A cluster of little brown balls on stalks. The dust around them is spores.",
    note4_es:"Un racimo de bolitas marrones con tallo. El polvo alrededor son esporas.",
    note10_en:"Each ball is a capsule. The dark ridge over the top is the annulus, a row of thick cells. Some capsules have burst.",
    note10_es:"Cada bola es una cápsula. La cresta oscura de arriba es el anillo, una fila de células gruesas. Algunas cápsulas ya reventaron.",
    note40_en:"The annulus cells have thick walls on three sides. When they dry they bend back, then snap, and the spores fly out. Each spore is a bean with a scar.",
    note40_es:"Las células del anillo tienen paredes gruesas por tres lados. Al secarse se doblan hacia atrás, luego saltan, y las esporas salen volando. Cada espora es un frijol con una cicatriz.",
    note100_en:"One spore fills the hole. Its coat is bumpy. The line across it is where it split from its three siblings.",
    note100_es:"Una espora llena el agujero. Su cubierta es rugosa. La línea que la cruza es donde se separó de sus tres hermanas."},
  {id:"fabric",en:"Cloth: cotton and polyester",es:"Tela: algodón y poliéster",
    note_en:"Two cloths side by side. One grew on a plant. One came out of a machine.",
    note_es:"Dos telas lado a lado. Una creció en una planta. Otra salió de una máquina.",
    note4_en:"Threads over and under: a plain weave. Left is cotton, right is polyester. The polyester weave is tighter.",
    note4_es:"Hilos por arriba y por abajo: un tejido llano. Izquierda algodón, derecha poliéster. El de poliéster es más apretado.",
    note10_en:"Each thread is a bundle of fibers. Cotton fibers are fuzzy and poke out. Polyester fibers lie straight and smooth.",
    note10_es:"Cada hilo es un manojo de fibras. Las de algodón son peludas y se asoman. Las de poliéster están rectas y lisas.",
    note40_en:"A cotton fiber is a flat ribbon that twists. A polyester fiber is a smooth rod, the same all the way along. That is how you tell them apart.",
    note40_es:"Una fibra de algodón es una cinta plana que se retuerce. Una de poliéster es una varilla lisa, igual en todo su largo. Así se distinguen.",
    note100_en:"Cotton: the twists, and a hollow down the middle. Polyester: nothing but a bright line, and a few specks put in to dull the shine.",
    note100_es:"Algodón: los giros y un hueco por el centro. Poliéster: solo una línea brillante y unas motas puestas para quitarle brillo."},
  {id:"dna",en:"DNA goo",es:"Moco de ADN",
    note_en:"White threads pulled out of mashed fruit with soap, salt and cold alcohol.",
    note_es:"Hilos blancos sacados de fruta machacada con jabón, sal y alcohol frío.",
    note4_en:"A cloudy drop with white strings through it. Bits of broken cells float around.",
    note4_es:"Una gota turbia con hilos blancos. Pedazos de células rotas flotan alrededor.",
    note10_en:"Each string is a rope of many finer threads. Where they knot, the goo is thick.",
    note10_es:"Cada hilo es una cuerda de muchos hilos más finos. Donde se anudan, el moco es espeso.",
    note40_en:"The ropes come apart into threads. Each thread is still millions of DNA molecules stuck together.",
    note40_es:"Las cuerdas se separan en hilos. Cada hilo sigue siendo millones de moléculas de ADN pegadas.",
    note100_en:"This is as close as light gets. One DNA molecule is 2 nanometers wide, about 100 times finer than the smallest thing this microscope can show. You are seeing the crowd, not the person.",
    note100_es:"Hasta aquí llega la luz. Una molécula de ADN mide 2 nanómetros de ancho, unas 100 veces más fina que lo más pequeño que este microscopio puede mostrar. Ves la multitud, no a la persona."},
  /* AOG-SCOPE-SLIDES17-V1 (2026-09-27) — two new slides for the 17 lessons; nothing here repeats a slide above */
  {id:"sand",en:"Beach sand",es:"Arena de playa",
    note_en:"Dry sand on glass. Most grains are quartz. A few are something else.",
    note_es:"Arena seca sobre vidrio. Casi todos los granos son cuarzo. Algunos son otra cosa.",
    note4_en:"Grains of many sizes. Most are clear or pale. A few are black, pink, or flat and gold.",
    note4_es:"Granos de muchos tamaños. Casi todos son claros o pálidos. Unos pocos son negros, rosados, o planos y dorados.",
    note10_en:"Clear grains with dark edges are quartz. Cloudy ones with straight breaks are feldspar. Black beads are magnetite. Pink is garnet. Measure one grain here.",
    note10_es:"Los granos claros con bordes oscuros son cuarzo. Los turbios con cortes rectos son feldespato. Las cuentas negras son magnetita. Lo rosado es granate. Mide un grano aquí.",
    note40_en:"The surface is frosted with tiny pits from wind and waves. Only one level is sharp. The grain is thicker than the focus. Turn the fine knob to move through it.",
    note40_es:"La superficie está escarchada con hoyitos del viento y las olas. Solo un nivel está nítido. El grano es más grueso que el foco. Gira el micrométrico para recorrerlo.",
    note100_en:"Inside the quartz: trails of tiny bubbles. Water was trapped there when the crystal grew, long ago.",
    note100_es:"Dentro del cuarzo: filas de burbujitas. El agua quedó atrapada ahí cuando creció el cristal, hace mucho."},
  {id:"yeast",en:"Baker's yeast",es:"Levadura de pan",
    note_en:"A drop of live yeast. Each tiny oval is one whole living thing.",
    note_es:"Una gota de levadura viva. Cada óvalo diminuto es un ser vivo entero.",
    note4_en:"A fine gray haze. The cells are too small to see one by one at 4×.",
    note4_es:"Una bruma gris fina. Las células son demasiado chicas para verlas una por una a 4×.",
    note10_en:"Tiny grains, some in clumps. Still too small to see inside.",
    note10_es:"Granitos diminutos, algunos en grupos. Aún muy chicos para ver adentro.",
    note40_en:"Small ovals, 4 to 8 µm long. Some have a smaller bead stuck on: a bud, a new cell growing. Cells above or below focus look like soft gray rings.",
    note40_es:"Óvalos chicos, de 4 a 8 µm. Algunos tienen una cuenta más chica pegada: una yema, una célula nueva creciendo. Las células arriba o abajo del foco se ven como anillos grises suaves.",
    note100_en:"Now you can see inside: a clear round vacuole, a thin dark wall, a few grains. With methylene blue, living cells clear the dye. Dead cells stay blue.",
    note100_es:"Ahora ves adentro: una vacuola clara y redonda, una pared fina y oscura, unos granos. Con azul de metileno, las células vivas aclaran el tinte. Las muertas se quedan azules."},
  {id:"scale",en:"Stage micrometer",es:"Micrómetro de platina",
    note_en:"A 1 mm ruler, 100 ticks of 10 µm. This is how the eyepiece scale learns the truth.",
    note_es:"Una regla de 1 mm, 100 marcas de 10 µm. Así la escala del ocular aprende la verdad.",
    note4_en:"The whole millimeter. Drop the eyepiece scale on top of these ticks. That is calibration, not a specimen.",
    note4_es:"El milímetro entero. Pon la escala del ocular sobre estas marcas. Eso es calibrar, no una muestra.",
    note10_en:"Each small tick is 10 µm. Count how many eyepiece units cover ten ticks — 100 µm.",
    note10_es:"Cada marca pequeña es 10 µm. Cuenta cuántas unidades del ocular cubren diez marcas — 100 µm.",
    note40_en:"A short run of 10 µm ticks. At 400× one eyepiece unit is 2.5 µm, so four units should sit on one tick.",
    note40_es:"Un tramo corto de marcas de 10 µm. A 400× una unidad del ocular es 2.5 µm, así que cuatro unidades caben en una marca.",
    note100_en:"One or two ticks fill the hole. At 1,000× with oil each eyepiece unit is 1 µm. The ruler did not get smaller. You got closer.",
    note100_es:"Una o dos marcas llenan el agujero. A 1,000× con aceite cada unidad del ocular es 1 µm. La regla no encogió. Tú te acercaste."}
];
/* AOG-SCOPE-LESSONS17-V1 (2026-09-27) — Jimmy: 17 lessons, like the Turntables. The first seven keep their
   ids (m1–m7) so saved progress stays; the ten new ones (m8–m17) sit where they belong on the ladder. */
const STAIR = [
  {id:"m1", en:"Make the microscope work", es:"Haz funcionar el microscopio",
    blurb_en:"Light, then the clips, then 4×, then the coarse knob.",
    blurb_es:"Luz, luego las pinzas, luego 4×, luego el macrométrico.",
    steps:["lamp","clips","low","coarse"]},
  {id:"m2", en:"See more", es:"Ver más",
    blurb_en:"10×, then 40×, then the fine knob only.",
    blurb_es:"10×, luego 40×, luego solo el micrométrico.",
    steps:["ten","forty","fine"]},
  {id:"m8", en:"Set the light", es:"Ajusta la luz",
    blurb_en:"Too much light washes a clear cell away. Close the iris until the edges show. Real labs call the full routine Köhler lighting. The iris is the part you can set here.",
    blurb_es:"Demasiada luz borra una célula clara. Cierra el iris hasta que se vean los bordes. En los laboratorios la rutina completa se llama iluminación de Köhler. El iris es la parte que puedes ajustar aquí.",
    steps:["iris","irisCheek"]},
  {id:"m3", en:"Change what you see", es:"Cambia lo que ves",
    blurb_en:"Stain the onion. Then darkfield a live drop — no stain on that one.",
    blurb_es:"Tiñe la cebolla. Luego campo oscuro en una gota viva — esa, sin tinción.",
    steps:["stain","dark"]},
  {id:"m9", en:"Stains tell parts apart", es:"Las tinciones separan las partes",
    blurb_en:"Each stain grabs different parts. Blue shows a cheek cell's nucleus. Red shows an onion's walls. On yeast, blue tells the living from the dead.",
    blurb_es:"Cada tinción se pega a partes distintas. El azul muestra el núcleo de una célula de mejilla. El rojo muestra las paredes de la cebolla. En la levadura, el azul separa las vivas de las muertas.",
    steps:["cheekBlue","safOnion","yeastBlue"]},
  {id:"m4", en:"Measure", es:"Medir",
    blurb_en:"Eyepiece scale in. Two taps on a cell at 400×.",
    blurb_es:"Escala del ocular puesta. Dos toques en una célula a 400×.",
    steps:["micrometer"]},
  {id:"m10", en:"Calibrate the scale", es:"Calibra la escala",
    blurb_en:"The eyepiece scale has no units until you check it against a real ruler. Lay it on the stage micrometer at 10× and at 40×.",
    blurb_es:"La escala del ocular no tiene unidades hasta que la comparas con una regla real. Ponla sobre el micrómetro de platina a 10× y a 40×.",
    steps:["calib10","calib40"]},
  {id:"m11", en:"Field of view math", es:"Cálculo del campo de visión",
    blurb_en:"The circle you see is 18 mm divided by the objective. At 4× that is 4.5 mm. See it on the ruler, then measure at 10×.",
    blurb_es:"El círculo que ves mide 18 mm dividido por el objetivo. A 4× son 4.5 mm. Míralo en la regla, luego mide a 10×.",
    steps:["fov4","measure10"]},
  {id:"m12", en:"Measure real things", es:"Mide cosas reales",
    blurb_en:"Three sizes, three powers. A hair at 40×, a red blood cell at 40×, a sand grain at 10×. Write each one down.",
    blurb_es:"Tres tamaños, tres aumentos. Un pelo a 40×, un glóbulo rojo a 40×, un grano de arena a 10×. Anota cada uno.",
    steps:["hairW","rbcW","sandW"]},
  {id:"m13", en:"Oil immersion", es:"Inmersión en aceite",

};

} catch(e){}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify({lang:S.lang,met:S.met,findBest:S.findBest,jobBest:S.jobBest,cracked:S.cracked,missions:S.missions,teacher:S.teacher}));

  S.theme=th; persist();

}

  <g class="${mark("stage")}" data-p="stage"><rect class="hit" x="80" y="330" width="230" height="36"/><path class="shape" d="M85 336 H305 l-10 24 H95 Z" fill="var(--ink)" opacity=".85" stroke="var(--line)" stroke-width="1.2"/><rect x="150" y="329" width="90" height="8" rx="2" fill="var(--steel-soft)" stroke="var(--steel)" stroke-width="1.2"/></g>

function bindScope(root, fn){
  root.querySelectorAll(".scope-part").forEach(g=>{
    g.setAttribute("tabindex","0");
    g.setAttribute("role","button");
    const go=()=>fn(g.getAttribute("data-p"));
    g.addEventListener("click", go);
    g.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); }});
  });
}

  const cap = S.walk<0 ? t("lightIntro") : S.walk>=LIGHT_PATH.length-1 && !S.playing ? t("lightDone") : `${S.walk+1} / ${LIGHT_PATH.length} — ${LIGHT_COPY[S.lang][S.walk]||""}`;

}

  const L=S.lab;
  const stains=allowedStains(L.spec);
  const step=benchStep();
  const research=step>=LX("m6");
  const specs=step<LX("m8")?SPECIMENS.filter(s=>s.id==="e"):SPECIMENS;
  const objs=[4];
  if(step>=LX("m2")) objs.push(10,40);
  if(step>=LX("m13")) objs.push(100);
  const illumBtns=ILLUMS.filter(([id])=>id==="bright"||id==="dark")
    .map(([id,k])=>btn(L.illum===id,"illum-"+id, t(k))).join("");
  return `
    <div class="row"><span class="tiny">${t("teach")}</span><span>${btn(S.teacher==="locked","teach-lock",t("teachLock"))}${btn(S.teacher!=="locked","teach-open",t("teachOpen"))}</span></div>

    <div class="row"><span class="tiny">${t("lamp")}</span><span>${btn(L.lightOn,"lamp1",t("on"))}${btn(!L.lightOn,"lamp0",t("off"))}</span></div>
    <div class="row"><span class="tiny">${t("clips")}</span><span>${btn(L.clipped,"clip1",t("seated"))}${btn(!L.clipped,"clip0",t("loose"))}</span></div>
    <div class="row"><span class="tiny">${t("objective")}</span><span>${objs.map(o=>btn(L.obj===o,"obj"+o,o+"×")).join("")}</span></div>
    <div class="row"><span class="tiny">${t("lens")}</span><span>${btn(L.quartz,"quartz1",t("quartz"))}${btn(!L.quartz,"quartz0",t("glass"))}</span></div>
    ${L.obj===100?`<div class="row"><span class="tiny">${t("oil")}</span><span>${btn(L.oil,"oil1",t("oilOn"))}${btn(!L.oil,"oil0",t("oilOff"))}</span></div>`:""}
    ${step>=LX("m3")?`<div class="row"><span class="tiny">${t("stain")}</span><span>${STAINS.filter(s=>stains.includes(s.id)).map(s=>btn(L.stain===s.id,"stain-"+s.id,`<i class="swatch" style="background:${s.color}"></i>${s.id==="none"?(S.lang==="es"?"Nada":"None"):s.id==="methylene"?(S.lang==="es"?"Metileno":"Methylene"):t(s.key)}`)).join("")}</span></div>
    <div class="row"><span class="tiny">${t("illum")}</span><span>${illumBtns}</span></div>`:""}
    ${step>=LX("m4")?`<div class="row"><span class="tiny">${t("ocular")}</span><span>${btn(L.graticule,"grat1",t("scaleOn"))}${btn(!L.graticule,"grat0",t("scaleOff"))}${btn(L.measure,"meas1",t("measure"))}</span></div>`:""}
    ${research?`<details class="more-light"${S.moreOpen?" open":""}>
      <summary>${t("researchK")}</summary>
      <div class="row"><span class="tiny">${t("illum")}</span><span>${ILLUMS.filter(([id])=>id==="slit"||id==="polar").map(([id,k])=>btn(L.illum===id,"illum-"+id, t(k))).join("")}</span></div>
      <div class="row"><span class="tiny">${t("risley")}</span><span>${btn(L.prism,"prism1",t("prismIn"))}${btn(!L.prism,"prism0",t("prismOut"))}</span></div>

      <div class="row"><span class="tiny">${t("beam")}</span><span>${FILTERS.map(f=>`<button class="btn filter-btn${L.filter===f.id?" btn-steel":""}" data-act="filter-${f.id}"><i class="swatch" style="background:rgb(${f.rgb.join(',')})"></i>${S.lang==="es"?{day:"Día",blue:"Azul",green:"Verde",amber:"Ámbar",violet:"Violeta"}[f.id]:{day:"Day",blue:"Blue",green:"Green",amber:"Amber",violet:"Violet"}[f.id]}</button>`).join("")}</span></div>

/* ── leaf peel: jigsaw cells and stomata ─────────────── */
const LEAF_W=150, LEAF_H=112;

    for(let dr=-2;dr<=2;dr++) for(let dc=-2;dc<=2;dc++){

/* ── diatoms: glass boxes ───────────────────────────── */

}
