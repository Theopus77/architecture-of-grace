<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><style id="aog-first-paint">/* AOG-ONE-PAINT-V1 (2026-09-27) — Jimmy: moving between units was "very choppy, makes me sick". The page now shows once, fully built: it waits on its paper colour until the shared scripts and fonts are in (aog-sketch.js adds .aog-ready), and never longer than ~1 s even if a script fails. No fade, no motion. */html{background:#F7F2E6}html[data-theme="dark"]{background:#0A1E33}html:not(.aog-ready) body{visibility:hidden;animation:aogOnePaint 0s linear 1.1s forwards}@keyframes aogOnePaint{to{visibility:visible}}@media print{html:not(.aog-ready) body{visibility:visible;animation:none}}</style><script>/* AOG-LIGHT-START-V1 — Jimmy: "All pages should start in light mode." Light unless this site was switched to dark. */(function(){var h=document.documentElement;if(!h.getAttribute("data-theme"))h.setAttribute("data-theme","light");})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly check-in — Architecture of Grace</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/aog-calm.css">
<!-- AOG-WEEKLY-V2 (2026-09-27) — Jimmy: "Make sure all slips are on a share engine … Even the old ones."
     The Monday, midweek and Friday check-ins now live in /slip.html (s=mon|mid|fri) and send the same
     "weekly" row as before. Old links (?w=, ?who=, ?dest=, ?d=) land here and are passed along. -->
<script>
(function(){
  var q=new URLSearchParams(location.search), w=q.get("w");
  var out=new URLSearchParams();
  out.set("s",/^(mon|mid|fri)$/.test(w||"")?w:"weekly");
  q.forEach(function(v,k){ if(k==="w") return; out.set(k==="who"?"sid":k,v); });
  location.replace("/slip.html?"+out.toString());
})();
</script>
<style>body{margin:0;font:17px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#FFFDF8;color:#15202E}main{max-width:560px;margin:0 auto;padding:40px 16px}a{color:#1F5F8B;font-weight:700}</style>
</head>
<body>
<main><p>Opening your weekly check-in… <a href="/slip.html?s=weekly">Tap here if it doesn't open.</a></p></main>
<script src="/aog-topbar.js"></script>
</body>
<script id="aog-sketch-js" src="/aog-sketch.js" defer></script>
</html>
