<title>Dashboard — Architecture of Grace</title>
<meta name="description" content="Hand out Daily Drafts, assignments and slips in one link. A teacher view and a student view.">
<link rel="icon" href="/favicon.ico" sizes="any">

<!-- AOG-DASH2-V1 (2026-09-26) — Jimmy: "The WHOLE DASHBOARD needs a complete new interface and
     engine behind it … a masterpiece in craftsmanship." Stage 1 of the new dashboard: the frame,
     Today (hand out Daily Drafts, assignments and slips), the teacher and student views, and Set up.
     It reads the same saved connection as the classic dashboard (aog.sync.url / .writekey /
     aog.org.id) and never writes or erases it. Links carry dest= and org= built exactly as the
     classic builder builds them, so every answer still lands in the teacher's Sheet.

<style id="aog-link-door">

/* ══ AOG-DASH-PULL-V1 (2026-09-26) — "Refresh from your Sheet" lives here now, so nobody has to open the
   classic dashboard first. Same two POSTs the classic page makes (action pull, action pullCheckins), read-
   gated by the ADMIN_PULL_KEY saved on this device (aog.sync.key), never by the write key. What comes back
   is saved where every page already reads it: aog.reflect.remote, aog.checkin.remote, aog.practice.remote. */
function canRead(){ return !!(raw("aog.sync.url")&&raw("aog.sync.key")); }
function pullBtn(){ return '<span class="pullwrap" style="display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap"><button class="btn solid" type="button" data-pull="1"'+(canRead()?'':' disabled')+'>⟳ '+t2("Refresh from your Sheet","Actualizar desde tu Hoja")+'</button><span class="s" data-pullst style="margin:0">'+(canRead()?(get("aog.dash2.pulledAt","")?t2("Last refreshed","Última actualización")+" "+new Date(get("aog.dash2.pulledAt","")).toLocaleString():""):t2("Connect your Sheet with ADMIN_PULL_KEY first (Set up).","Conecta tu Hoja con ADMIN_PULL_KEY primero (Configurar)."))+'</span></span>'; }
async function pullAll(btn){
  const url=raw("aog.sync.url"), key=raw("aog.sync.key"), say=m=>{ document.querySelectorAll("[data-pullst]").forEach(st=>{ st.textContent=m; }); };
  if(!url||!key){ say(t2("Connect your Sheet with ADMIN_PULL_KEY first.","Conecta tu Hoja con ADMIN_PULL_KEY primero.")); return; }
  if(btn) btn.disabled=true; say(t2("Pulling…","Trayendo…"));
  const post=b=>fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)}).then(r=>r.json());
  try{
    const [a,b]=await Promise.all([post({action:"pull",passcode:key}).catch(e=>({error:String(e)})),post({action:"pullCheckins",passcode:key}).catch(e=>({error:String(e)}))]);
    const errs=[];
    if(a&&a.error) errs.push(a.error); else if(a&&"records" in a){ const num=v=>{ const n=parseFloat(v); return isNaN(n)?null:n; };
      const recs=(a.records||[]).filter(r=>r&&r.timestamp).map(r=>({timestamp:r.timestamp,studentId:String(r.studentId==null?"":r.studentId),grade:r.grade,window:r.window,mode:r.mode==="depth"?"depth":"rapid",population:(r.population==="adult"||String(r.grade)==="Adult")?"adult":"k12",normA:num(r.normA),normB:num(r.normB),normC:num(r.normC),normComposite:num(r.normComposite),tier:r.tier||"",trustedAdultFlag:String(r.trustedAdultFlag).toUpperCase()==="TRUE",unsafeFlag:String(r.unsafeFlag).toUpperCase()==="TRUE",synced:true}));
      put("aog.reflect.remote",recs); }
    if(b&&b.error) errs.push(b.error); else if(b&&"checkins" in b){ const rowsC=[], pr=[]; (b.checkins||[]).forEach(r=>{ if(String((r&&r.checkinType)||"")==="practice") pr.push(r); else rowsC.push(r); });
      put("aog.checkin.remote",rowsC); put("aog.practice.remote",(b.practice||[]).concat(pr)); if(b.tabs&&typeof b.tabs==="object") put("aog.sheet.tabs",b.tabs); else put("aog.sheet.tabs",null); }
    if(errs.length){ say(errs.join(" · ")); }
    else { put("aog.dash2.pulledAt",new Date().toISOString()); say("✓ "+t2("Updated","Actualizado")); render(); }
  }catch(e){ say(t2("Couldn’t reach the Sheet. Confirm the Web App is deployed to “Anyone” and try again.","No se pudo conectar con la Hoja. Confirma que la Web App esté desplegada para “Cualquiera” e inténtalo otra vez.")); }
  if(btn) btn.disabled=false;
}

/* ══ AOG-DASH-OVER-V1 (2026-09-26) — everything the classic dashboard still held for a teacher lives here now:
   the Sheet connection (same three keys, same URL rule, Disconnect is the only thing that erases them),
   a backup file, Delete everything (keep-list, like the classic page), IEP goals and data points in the same
   aog.iep.v1 shape the classic charts read, and the adult observation link with the same staff token. */
const SYNC_RE=/^https:\/\/script\.google\.com\/.*\/exec$/;
function connectCard(){
  const u=raw("aog.sync.url"), k=raw("aog.sync.key"), w=raw("aog.sync.writekey");
  /* the green light: Jimmy liked it on the classic page. Green = link + write key (students' sends arrive);

  const light=u?(w?'<span class="pill ok"><span class="dot"></span>'+t2("Connected — student links send to your Sheet","Conectado — los enlaces envían a tu Hoja")+(k?"":t2(" · add ADMIN_PULL_KEY to pull"," · agrega ADMIN_PULL_KEY para traer"))+'</span>':'<span class="pill"><span class="dot"></span>'+t2("Link saved — add BACKEND_AUTH_KEY so student links send","Enlace guardado — agrega BACKEND_AUTH_KEY para que los enlaces envíen")+'</span>'):'<span class="pill" style="border-style:dashed"><span class="dot" style="background:#8A93A0"></span>'+T("no")+'</span>';
  /* AOG-DASH-CONN-FOLD-V1 (2026-09-26) — Jimmy: "Can the connect and sync collapse once you save, and the green light
     is missing." A connected card stays folded with the light in its header line; tap the header to open it. */

  return '<details class="card" id="connCard" style="margin-bottom:16px"'+(open?' open':'')+'><summary style="display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;cursor:pointer;list-style:none;min-height:44px"><p class="k" style="color:var(--goldInk);margin:0">'+t2("Connection details","Detalles de conexión")+' <span class="s" style="font-weight:600">'+(open?"▴":"▾")+'</span></p></summary><p class="s">'+t2("The same link and two keys you set in Apps Script.","El mismo enlace y las dos claves de Apps Script.")+'</p>'

  /* keep-list, never a delete-list: a new store is erased by default. The Sheet connection survives, as the standing rule says. */

function pwPersist(){

  const dt=root.querySelector("[data-doc=date]"); if(dt&&dt.value) d.date=dt.value;
  const srs=root.querySelectorAll("[data-sri]"); if(srs.length||root.querySelector("#pwSrAdd")){ d.fields.svcRows=[...srs].map(tr=>({area:tr.querySelector("[data-sr=area]").value,setting:tr.querySelector("[data-sr=setting]").value,min:tr.querySelector("[data-sr=min]").value})); }
  root.querySelectorAll("[data-gi]").forEach(c=>{ const r=(d.goalRows||[])[+c.dataset.gi]; if(!r) return; r.title=c.querySelector("[data-gk=title]").value; r.rating=c.querySelector("[data-gk=rating]").value; r.chart=c.querySelector("[data-gk=chart]").checked; });
  root.querySelectorAll("[data-gmid]").forEach(c=>{ const gid=c.dataset.gmid, m=st.goalMeta[gid]||(st.goalMeta[gid]={}); c.querySelectorAll("[data-gm]").forEach(e=>{ m[e.dataset.gm]=e.type==="checkbox"?e.checked:e.value; }); m.implementors=[...c.querySelectorAll("[data-gmi]")].filter(e=>e.checked).map(e=>e.dataset.gmi); });
  d.updated=Date.now(); pwSave(st);
}

  const on=(id,f)=>{ const e=document.getElementById(id); if(e) e.addEventListener("click",f); };
  const withDoc=f=>{ if(pwTimer){ clearTimeout(pwTimer); pwPersist(); } const st=pwLoad(), d=st.docs[get("aog.dash2.pwDoc","")]; if(d){ f(st,d); pwSave(st); } render(); };

  +'</div>'

    +(savedLinks().length?'<p class="k" style="color:var(--goldInk);margin-top:14px">'+(lang==="es"?"Enlaces guardados":"Saved links")+'</p><div class="items">'+savedLinks().map((x,i)=>'<div class="item" style="--ac:var(--c1)"><b>'+esc(x.n)+'</b><span style="color:var(--sub);font-size:.85rem">'+esc(new Date(x.at).toLocaleDateString())+'</span><a class="btn" href="'+esc(x.u)+'" target="_blank" rel="noopener">'+(lang==="es"?"Abrir":"Open")+'</a><button class="btn" type="button" data-lkcopy="'+i+'">'+T("copy")+'</button><button type="button" data-lkdel="'+i+'" aria-label="Remove">✕</button></div>').join("")+'</div>':'')
  +'</section>'

/* AOG-DASH-SENT-V1 — a tick on today's work once something from that page went to the teacher from this device */
function sentToday(it){ const f=itemPath(it).replace(/^\/|\?.*$/g,""), d=new Date().toISOString().slice(0,10); return get("aog.dash2.sent",[]).some(x=>x&&x.f===f&&String(x.at||"").slice(0,10)===d); }
/* AOG-DASH-NAMES-V1 (2026-09-27) — Jimmy: "I am going back between myself and my two children. I have to always rewrite
   the names." Every name used on this device is a button above the box (and the family's children too); tap to switch. */
function knownNames(){ const a=get("aog.dash2.names",[]).concat(get("aog.dash2.kids",[])); const seen={}, out=[]; a.forEach(n=>{ n=String(n||"").trim(); const k=n.toLowerCase(); if(n&&!seen[k]){ seen[k]=1; out.push(n); } }); return out.slice(0,8); }
function rememberName(n){ n=String(n||"").trim(); if(!n) return; const a=get("aog.dash2.names",[]).filter(x=>String(x).toLowerCase()!==n.toLowerCase()); a.unshift(n); put("aog.dash2.names",a.slice(0,8)); }
function nameChips(cur){ const ns=knownNames(); if(!ns.length) return ""; return '<div class="row" style="margin:6px 0 10px;gap:8px">'+ns.map(n=>'<button type="button" class="btn'+(n.toLowerCase()===String(cur||"").trim().toLowerCase()?" solid":"")+'" data-pickname="'+esc(n)+'" style="min-height:40px">'+esc(n)+'</button>').join("")+'</div>'; }
function earlierHandouts(cur){ const all=get("aog.dash2.handedAll",[]), seen={}; (cur||[]).forEach(it=>seen[JSON.stringify(it)]=1); const lang=L(), rows=[];
  all.forEach(h=>{ (h.items||[]).forEach(it=>{ const k=JSON.stringify(it); if(seen[k]) return; seen[k]=1; rows.push({it,at:h.at}); }); });
  if(!rows.length) return "";
  return '<details class="card" style="margin-top:16px"><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700">'+t2("Earlier handouts","Repartos anteriores")+' ('+rows.length+')</summary><div class="work" style="margin-top:12px">'+rows.map(r=>'<a class="go" style="--ac:'+itemColor(r.it)+'" href="'+esc(studentHref(r.it))+'"><span class="ic">'+itemIcon(r.it)+'</span><span><b>'+esc(itemLabel(r.it,lang))+'</b><span>'+new Date(r.at||Date.now()).toLocaleDateString()+'</span></span><span class="arr">›</span></a>').join("")+'</div></details>'; }
/* AOG-STU-FRESH-NAME (2026-09-27) — Jimmy: "I don't want it to save the last person every time." On a shared
   device the Student page opens with an empty name and nothing picked; the name still carries through this
   one visit (into the work the student opens), and is cleared again the next time the page is opened. */
let __stuFresh=false;
function student(){
  if(!__stuFresh){ __stuFresh=true; put(K.stu,""); }
  const lang=L(), h=get("aog.dash2.handed",null), items=(h&&h.items)||(QS.get("view")==="student"?[]:get(K.tray,[])), nm=get(K.stu,"");
  const ic={dd:"dd",unit:"as",prac:"as",slip:"sl"}, ac={dd:"var(--c1)",unit:"var(--c3)",prac:"var(--c3)",slip:"var(--c5)"};
  return '<div class="stu"><div class="hello"><div><h1>'+T("sw")+'</h1><p>'+T("swS")+'</p></div></div>'
   +'<section class="card"><label class="f" for="stN">'+T("name")+'</label>'+nameChips(nm)+'<input type="text" id="stN" maxlength="40" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" value="'+esc(nm)+'"><p class="note">'+T("nameS")+'</p></section>'
   +'<div class="work">'+(items.length?items.map(it=>{ const dn=sentToday(it); return '<a class="go'+(dn?' sent':'')+'" style="--ac:'+itemColor(it)+'" href="'+esc(studentHref(it))+'"><span class="ic">'+itemIcon(it)+'</span><span><b>'+esc(itemLabel(it,lang))+'</b><span>'+(dn?T("sentTick"):TAG[it.t][0])+'</span></span><span class="arr">'+(dn?'✓':'›')+'</span></a>'; }).join(""):'<p class="empty">'+T("nothing")+'</p>')+'</div>'+earlierHandouts(items)+'</div>';
}
function setup(){
  /* AOG-DASH-SETUP-CALM-V1 (2026-09-27) — Jimmy: "This is very ugly and confusing … all the words." One status line, one
     button, the tabs as small counts. The connection details stay folded until they are wanted. */
  const u=raw("aog.sync.url"), w=raw("aog.sync.writekey"), k=raw("aog.sync.key"), ok=!!(u&&w), tb=get("aog.sheet.tabs",null), at=get("aog.dash2.pulledAt","");
  const status=ok?(k?t2("Connected. Students’ work comes to your Sheet, and this device can bring it back.","Conectado. El trabajo llega a tu Hoja y este aparato puede traerlo."):t2("Connected for sending. Add ADMIN_PULL_KEY below to bring work back.","Conectado para enviar. Agrega ADMIN_PULL_KEY abajo para traer el trabajo.")):t2("Not connected yet. Open Connect below.","Aún sin conexión. Abre Conectar abajo.");
  const tabs=(tb&&typeof tb==="object")?Object.keys(tb).map(x=>'<span class="pill" style="min-height:30px;font-size:13px;font-weight:600">'+esc(x.replace(/^Practice · (Daily Drafts · )?/,""))+' <b style="margin-left:4px">'+tb[x]+'</b></span>').join(""):"";
  return '<div class="hello"><div><h1>'+T("setupH")+'</h1></div></div>'
   +'<section class="card" style="margin-bottom:16px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span class="pill '+(ok?"ok":"")+'"><span class="dot"></span>'+(ok?t2("Sheet connected","Hoja conectada"):t2("Not connected","Sin conexión"))+'</span><span class="s" style="margin:0">'+status+'</span></div>'
   +(ok&&k?'<div class="row" style="margin-top:14px;align-items:center">'+pullBtn()+'</div>':'')
   +(tabs?'<p class="k" style="color:var(--goldInk);margin:16px 0 8px">'+t2("In your Sheet","En tu Hoja")+'</p><div style="display:flex;flex-wrap:wrap;gap:6px">'+tabs+'</div>':'')
   +'</section>'
   +connectCard()+dangerCard();
}
/* AOG-DASH-BLUEPRINT-V1 — Jimmy: "their blueprint should be a tab on the left." One student's stained-glass Blueprint, from the Inbox page. */
function blueprint(){ const names=Object.keys(data().S).sort(), sel=get("aog.dash2.bpStu","")||names[0]||"";
  const head='<div class="hello"><div><h1>'+T("blueprint")+'</h1><p>'+t2("Everything one student has built, as a window of stained glass.","Todo lo que un estudiante ha construido, como un vitral.")+'</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select id="bpStu" style="min-width:200px">'+(names.length?names.map(n=>opt(n,n,n===sel)).join(""):'<option value="">'+t2("No students yet","Aún no hay estudiantes")+'</option>')+'</select><a class="btn" href="/turn-ins.html?blueprint='+encodeURIComponent(sel)+'" target="_blank" rel="noopener">'+T("fullPage")+' ›</a></div></div>';
  if(!sel) return head+noData();
  if(matchMedia("(max-width:760px)").matches) return head+'<section class="card"><p class="s">'+t2("On a phone the Blueprint opens as its own page.","En un teléfono el Plano se abre como su propia página.")+'</p><div class="row"><a class="btn solid" href="/turn-ins.html?blueprint='+encodeURIComponent(sel)+'">'+t2("Open the Blueprint","Abrir el Plano")+' ›</a></div></section>';
  return head+'<iframe src="/turn-ins.html?solo=1&teacher=1&blueprint='+encodeURIComponent(sel)+'" title="'+T("blueprint")+'" style="width:100%;height:calc(100vh - 190px);min-height:520px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)"></iframe>'; }
function inbox(){ const head='<div class="hello"><div><h1>'+T("inbox")+'</h1><p>'+T("inboxS")+'</p></div><a class="btn" href="/turn-ins.html" target="_blank" rel="noopener">'+T("fullPage")+' ›</a></div>';
  /* AOG-DASH-INBOX-PHONE-V1 — a page inside a page stutters when a phone scrolls it (Jimmy: "freezing"). On a phone the Inbox opens as its own page. */
  if(matchMedia("(max-width:760px)").matches) return head+'<section class="card"><p class="s">'+t2("On a phone the Inbox opens as its own page, so it scrolls smoothly.","En un teléfono la Bandeja se abre como su propia página, para que se deslice bien.")+'</p><div class="row"><a class="btn solid" href="/turn-ins.html">'+t2("Open the Inbox","Abrir la Bandeja")+' ›</a></div></section>';
  return head+'<iframe src="/turn-ins.html?embed=1" title="'+T("inbox")+'" style="width:100%;height:calc(100vh - 190px);min-height:520px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)"></iframe>'; }
function soon(){ return '<div class="hello"><div><h1>'+T("today")+'</h1><p>'+T("soon")+'</p></div></div><div class="row"><a class="btn solid" href="#today">'+T("today")+' ›</a></div>'; }
function render(){
  nav(); const app=document.getElementById("app");
  app.innerHTML = VIEW==="student"? student() : VIEW==="family"? family() : PAGE==="today"? today() : PAGE==="setup"? setup() : PAGE==="students"? students() : PAGE==="checkins"? checkins() : PAGE==="trends"? trends() : PAGE==="brick"? brick() : PAGE==="reports"? reports() : PAGE==="mtss"? mtss() : PAGE==="papers"? papers() : PAGE==="inbox"? inbox() : PAGE==="blueprint"? blueprint() : soon();
  wire();
  engSchedule(false);
}
function asGet(){ return Object.assign({k:"unit",p:"mth",f:"mth-u1.html",i:"m1"},get(K.as,{})); }
function saveDD(){ put(K.dd,{s:val("ddS"),g:val("ddG"),n:+val("ddN")}); }
const val=id=>{const e=document.getElementById(id);return e?e.value:""};
function wire(){
  const ss=document.getElementById("slipStu"); if(ss) ss.onchange=()=>{ SLIPSTU=ss.value; render(); };
  const hs=document.getElementById("homeStu"); if(hs) hs.onchange=()=>{ HOMESTU=hs.value; render(); };
  const on=(id,ev,f)=>{const e=document.getElementById(id); if(e) e.addEventListener(ev,f);};
  document.querySelectorAll("[data-pull]").forEach(b=>b.addEventListener("click",()=>pullAll(b)));
  on("mtssView","change",()=>{ put("aog.dash2.mtssView",val("mtssView")); render(); });
  on("mtssBand","change",()=>{ put("aog.dash2.mtssBand",val("mtssBand")); render(); });
  on("mtssStu","change",()=>{ put("aog.dash2.mtssStu",val("mtssStu")); render(); });
  document.querySelectorAll("[data-meta]").forEach(e=>e.addEventListener("input",()=>{ const m=mMeta(); m[e.getAttribute("data-meta")]=e.value; put("aog.mtss.meta",m); }));
  document.querySelectorAll("[data-pm]").forEach(e=>e.addEventListener("input",()=>{ pmSave(val("mtssStu"),e.getAttribute("data-pm"),e.value); }));
  if(PAGE==="mtss") document.querySelectorAll("tr.pick[data-stu]").forEach(r=>r.addEventListener("click",()=>{ put("aog.dash2.mtssStu",r.getAttribute("data-stu")); put("aog.dash2.mtssView","individual"); render(); }));
  on("ddS","change",()=>{ const s=val("ddS"), g=gradesFor(s); put(K.dd,{s:s,g:g.indexOf(val("ddG"))>=0?val("ddG"):g[0],n:+val("ddN")}); render(); });
  on("ddG","change",()=>{ saveDD(); render(); }); on("ddN","change",()=>{ saveDD(); render(); });
  on("asK","change",()=>{ const a=asGet(); a.k=val("asK"); put(K.as,a); render(); });
  on("asP","change",()=>{ const a=asGet(); a.p=val("asP"); a.f=(CAT.units[a.p]||[[0,"",""]])[0][2]; put(K.as,a); render(); });
  on("asF","change",()=>{ const a=asGet(); a.f=val("asF"); put(K.as,a); });
  on("asI","change",()=>{ const a=asGet(); a.i=val("asI"); put(K.as,a); });
  on("slI","change",()=>{ put(K.sl,{i:val("slI")}); });
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    const tr=get(K.tray,[]), w=b.dataset.add;
    if(w==="dd") tr.push({t:"dd",s:val("ddS"),g:val("ddG"),n:+val("ddN")});
    if(w==="as"){ if(val("asK")==="unit") tr.push({t:"unit",p:val("asP"),f:val("asF")}); else tr.push({t:"prac",i:val("asI")}); }
    if(w==="sl") tr.push({t:"slip",i:val("slI")});
    put(K.tray,tr); render();
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const tr=get(K.tray,[]); tr.splice(+b.dataset.del,1); put(K.tray,tr); render(); });
  on("cp","click",async()=>{ try{ await navigator.clipboard.writeText(classLink()); }catch(e){ const r=document.createRange(); r.selectNode(document.getElementById("lk")); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); } const b=document.getElementById("cp"); b.textContent=T("copied")+" ✓"; setTimeout(()=>{ if(b.isConnected) b.textContent=T("copy"); },1600); });
  on("lkSave","click",()=>{ saveLink(val("lkName")); render(); });
  document.querySelectorAll("[data-lkcopy]").forEach(b=>b.onclick=async()=>{ const x=savedLinks()[+b.dataset.lkcopy]; if(!x) return; try{ await navigator.clipboard.writeText(x.u); b.textContent=T("copied"); }catch(e){ prompt("Copy this link:",x.u); } });
  document.querySelectorAll("[data-lkdel]").forEach(b=>b.onclick=()=>{ const L=savedLinks(); L.splice(+b.dataset.lkdel,1); put("aog.dash2.links",L); render(); });
  on("bg","click",()=>{ const u=classLink(); document.getElementById("bigLead").textContent=T("bigLead"); document.getElementById("bigU").textContent=u.replace(/^https?:\/\//,"").split("?")[0]+"…"; document.getElementById("bigSub").textContent=T("bigSub"); document.getElementById("bigClose").textContent=T("close"); document.getElementById("big").classList.add("on"); });
  on("q","input",()=>{ put("aog.dash2.q",val("q")); const c=document.getElementById("q").selectionStart; render(); const e=document.getElementById("q"); if(e){e.focus();e.setSelectionRange(c,c);} });
  document.querySelectorAll("[data-stu]").forEach(e=>e.addEventListener("click",()=>{ put("aog.dash2.sel",e.dataset.stu); if(PAGE!=="students"){ location.hash="students"; } else render(); window.scrollTo(0,0); }));
  on("iepStu","change",()=>{ put("aog.dash2.iepStu",val("iepStu")); render(); });
  if(PAGE==="papers") pwWire();
  on("demoBtn","click",demoToggle);
  on("kidAdd","click",()=>{ const n=val("kidN").trim().slice(0,40); if(!n) return; const a=kids(); if(a.map(x=>x.toLowerCase()).indexOf(n.toLowerCase())<0) a.push(n); put("aog.dash2.kids",a.slice(0,12)); render(); });
  const kn=document.getElementById("kidN"); if(kn) kn.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); const b=document.getElementById("kidAdd"); if(b) b.click(); } });
  document.querySelectorAll("[data-kiddel]").forEach(b=>b.onclick=()=>{ put("aog.dash2.kids",kids().filter(x=>x!==b.dataset.kiddel)); render(); });
  document.querySelectorAll("[data-kidgo]").forEach(b=>b.onclick=()=>{ put(K.stu,b.dataset.kidgo); try{ localStorage.setItem("aog.drops.who",b.dataset.kidgo); }catch(e){} rememberName(b.dataset.kidgo); VIEW="student"; put(K.view,"student"); render(); window.scrollTo(0,0); });
  on("fcp","click",async()=>{ try{ await navigator.clipboard.writeText(familyLink()); document.getElementById("fcp").textContent=T("copied"); }catch(e){} });
  on("navSel","change",()=>{ location.hash=val("navSel"); });
  on("bpStu","change",()=>{ put("aog.dash2.bpStu",val("bpStu")); render(); });
  on("syS","click",syncSave);
  const cc=document.getElementById("connCard"); if(cc) cc.addEventListener("toggle",()=>{ put("aog.dash2.connOpen",cc.open); }); on("syT","click",syncTest); on("syD","click",syncDrop); on("bkUp","click",backup); on("delAll","click",deleteAll);
  on("tcp","click",async()=>{ const b=document.getElementById("tcp"); try{ await navigator.clipboard.writeText(teamLink()); b.textContent=T("copied"); }catch(e){ const r=document.createRange(); r.selectNode(document.getElementById("tlk")); getSelection().removeAllRanges(); getSelection().addRange(r); } });
  on("gNew","click",()=>{ put("aog.dash2.gEdit","new"); render(); const f=document.getElementById("gForm"); if(f) f.scrollIntoView({block:"start"}); });
  on("gCancel","click",()=>{ put("aog.dash2.gEdit",""); render(); }); on("gSave","click",goalSave);
  on("gArch","click",()=>{ const id=document.getElementById("gArch").dataset.gid, I=iep(); if(!I.goals[id]) return; if(!confirm(t2("Archive this goal? Its data stays saved.","¿Archivar esta meta? Sus datos se conservan."))) return; I.goals[id].archived=true; iepSave(I); put("aog.dash2.gEdit",""); render(); });
  document.querySelectorAll("[data-gedit]").forEach(b=>b.onclick=()=>{ put("aog.dash2.gEdit",b.dataset.gedit); render(); const f=document.getElementById("gForm"); if(f) f.scrollIntoView({block:"start"}); });
  document.querySelectorAll("[data-pt]").forEach(b=>b.onclick=()=>pointSave(b.dataset.pt));
  document.querySelectorAll("[data-gcl]").forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.gcl); b.textContent="✓ "+t2("Copied","Copiado"); }catch(e){ prompt(t2("Copy this link","Copia este enlace"),b.dataset.gcl); } });
  document.querySelectorAll("[data-pdel]").forEach(b=>b.onclick=()=>{ const [id,i]=b.dataset.pdel.split("|"); pointDrop(id,+i); });
  on("backStu","click",()=>{ put("aog.dash2.sel",""); render(); });
  on("stN","input",()=>{ const v=val("stN"); put(K.stu,v); try{ localStorage.setItem("aog.drops.who",v); }catch(e){} });
  on("stN","change",()=>{ rememberName(val("stN")); setTimeout(render,0); });
  document.querySelectorAll("[data-pickname]").forEach(b=>b.onclick=()=>{ const v=b.dataset.pickname; put(K.stu,v); rememberName(v); try{ localStorage.setItem("aog.drops.who",v); }catch(e){} render(); });
}
document.getElementById("bigClose").onclick=()=>document.getElementById("big").classList.remove("on");
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.getElementById("big").classList.remove("on"); });
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ VIEW=b.dataset.view; put(K.view,VIEW); render(); });

new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});
render();
