<html lang="en" data-aog-nohero>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Dashboard — Architecture of Grace</title>
<meta name="description" content="Hand out Daily Drafts, assignments and slips in one link. A teacher view and a student view.">
<link rel="icon" href="/favicon.ico" sizes="any">
<meta name="theme-color" content="#0A1E33">
<!-- AOG-DASH2-V1 (2026-09-26) — Jimmy: "The WHOLE DASHBOARD needs a complete new interface and
     engine behind it … a masterpiece in craftsmanship." Stage 1 of the new dashboard: the frame,
     Today (hand out Daily Drafts, assignments and slips), the teacher and student views, and Set up.
     It reads the same saved connection as the classic dashboard (aog.sync.url / .writekey /
     aog.org.id) and never writes or erases it. Links carry dest= and org= built exactly as the
     classic builder builds them, so every answer still lands in the teacher's Sheet.
     THE CLASS LINK: a student device cannot see the teacher's device, so today's handout travels
     on one link (?hand=…) that opens the student view with just those items. -->
<style>
:root{--navy:#0A1E33;--navy2:#13314F;--ink:#1a232c;--soft:#556270;--faint:#7d8896;--cream:#FBF7EE;--card:#fff;--line:#E7DDC8;
 --gold:#C9A24A;--goldInk:#8A6516;--gold2:#F2C964;--good:#2E7D4F;--c1:#2F63B8;--c2:#B87A12;--c3:#2E8B57;--c4:#A8323E;--c5:#7B4FA0;--shadow:0 1px 2px rgba(10,30,51,.06),0 14px 34px -22px rgba(10,30,51,.45)}
[data-theme="dark"]{--goldInk:#F2C964;--ink:#EEF2F6;--soft:#B9C4D0;--faint:#93A0AE;--cream:#1A3657;--card:#22436A;--line:rgba(255,255,255,.14);--shadow:0 16px 34px -22px rgba(0,0,0,.7)}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;color:var(--ink);background:linear-gradient(to right,var(--navy) 240px,var(--cream) 240px) !important;font:16px/1.5 -apple-system,"Segoe UI",Inter,Roboto,Arial,sans-serif}
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 56px);align-items:stretch;background:linear-gradient(to right,var(--navy) 240px,transparent 240px)}
.rail{background:var(--navy);color:#EAF0F6;padding:18px 12px;position:sticky;top:var(--aogbar-h,52px);height:calc(100vh - var(--aogbar-h,52px));overflow:auto}
.rail .brand{font:600 13px Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);padding:4px 10px 14px}
.view{display:flex;background:rgba(255,255,255,.08);border-radius:12px;padding:4px;margin:0 4px 16px}
.view button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:#DCE5EE;font:700 14px inherit;font-family:inherit;cursor:pointer}
.view button[aria-pressed=true]{background:var(--gold2);color:var(--navy)}
.nav a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;color:#DCE5EE;text-decoration:none;font-weight:650;margin:2px 0}
.nav a[aria-current=page]{background:rgba(242,201,100,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold2)}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .sep{height:1px;background:rgba(255,255,255,.12);margin:12px 8px}
.nav small{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9FB1C4;padding:8px 12px 2px}
#app{padding:26px clamp(16px,3vw,48px) 60px;width:100%;min-width:0;background:var(--cream)}
#app>*{max-width:1500px}
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 0 20px}
.hello h1{font:600 clamp(28px,4vw,40px)/1.1 Fraunces,Georgia,serif;margin:0;color:var(--ink)!important;opacity:1!important;-webkit-text-fill-color:currentColor!important;background:none!important}
.hello p{margin:4px 0 0;color:var(--soft)}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--card)}
.pill .dot{width:9px;height:9px;border-radius:50%;background:#C7931F}.pill.ok .dot{background:var(--good)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow)}
.stat b{display:block;font:600 34px/1 Fraunces,Georgia,serif}.stat span{color:var(--soft);font-size:14px}
.stat.flag b{color:#B3261E}
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{text-align:left;font:800 11.5px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.pick{cursor:pointer}.tbl tr.pick:hover td{background:rgba(201,162,74,.08)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;background:rgba(10,30,51,.07);margin:2px 4px 2px 0}
.chip.warn{background:rgba(179,38,30,.12)!important;color:#8E1F18!important;border:0!important;box-shadow:none!important;padding:3px 10px!important;font-size:13px!important}.chip.good{background:rgba(46,125,79,.14);color:#1E5A38}
[data-theme="dark"] .chip{background:rgba(255,255,255,.1)}[data-theme="dark"] .chip.warn{color:#FFB4AB}[data-theme="dark"] .chip.good{color:#BFE6CC}
.bar{height:10px;border-radius:999px;background:rgba(10,30,51,.08);overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--good)}
.search{max-width:360px;margin:0 0 14px}
.spark{display:flex;align-items:flex-end;gap:3px;height:44px}.spark i{width:10px;border-radius:3px 3px 0 0;background:var(--c1)}
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card.hand::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--ac)}
.card h2{font:600 22px/1.2 Fraunces,Georgia,serif;margin:4px 0 6px}
.card .k{font:800 11.5px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ac,var(--gold))}
.card p.s{color:var(--soft);margin:0 0 14px;font-size:15px}
.ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--ac);color:#fff;margin-bottom:10px;box-shadow:0 8px 16px -10px var(--ac)}
.ic svg{width:22px;height:22px}
label.f{display:block;font:700 12px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:10px 0 4px}
select,input[type=text]{width:100%;font:inherit;font-size:16px;min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:700 15px inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.solid{background:var(--navy);border-color:var(--navy);color:#F4EEE2}
.btn.add{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.gold{background:var(--gold2);border-color:#B8893A;color:var(--navy)}
.btn:disabled{opacity:.45;cursor:default}
.tray{margin-top:22px}
.tray .items{display:grid;gap:10px;margin:12px 0}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--cream)}
.item .tag{font:800 11px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border-radius:8px;color:#fff;background:var(--ac)}
.item b{flex:1}
.item button{min-height:36px;min-width:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:16px}
.empty{color:var(--soft);font-style:italic;padding:8px 2px}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--navy);color:#F4EEE2;border-radius:16px;padding:14px}
.linkbox code{flex:1 1 260px;font:13px ui-monospace,Menlo,monospace;word-break:break-all;color:#E8EEF4}
.note{font-size:14px;color:var(--soft);margin:8px 0 0}
.warn{border-left:4px solid #C7931F;background:rgba(199,147,31,.1);padding:10px 14px;border-radius:0 12px 12px 0;margin:12px 0;font-size:15px}
.stage{display:none}.stage.on{display:block}
.big{position:fixed;inset:0;z-index:9500;background:var(--navy);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:24px;text-align:center}
.big.on{display:flex}
.big .u{font:700 clamp(28px,6vw,72px)/1.2 Inter,sans-serif;word-break:break-all;color:var(--gold2)}
.big p{font-size:clamp(18px,2.5vw,26px);margin:0;color:#DCE5EE}
/* student view */
.stu{max-width:760px;margin:0 auto}
.stu .work{display:grid;gap:14px;margin-top:16px}
.stu a.go{display:flex;align-items:center;gap:14px;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--ink)}
.stu a.go .ic{margin:0}
.stu a.go b{display:block;font-size:18px}.stu a.go span{color:var(--soft);font-size:14px}
.stu a.go .arr{margin-left:auto;font-size:26px;color:var(--faint)}
@media (max-width:980px){.grid3{grid-template-columns:1fr!important}}
@media print{.rail,.aogtop,.aogtop-spacer,.hello .btn,.hello select,.row{display:none!important}.app{display:block}body{background:#fff!important}#app{padding:0}.card{break-inside:avoid;box-shadow:none}}
@media (max-width:760px){body{background:var(--cream)!important}.app{grid-template-columns:1fr;background:none}.rail{position:static;height:auto;display:block}
 .nav{display:flex;overflow-x:auto;gap:4px}.nav a{white-space:nowrap}.nav .sep,.nav small{display:none}}
</style>
</head>

    <div class="brand">Dashboard</div>

    <nav class="nav" id="nav"></nav>
  </aside>
  <div id="app" role="main"></div>
</div>
<div class="big" id="big" role="dialog" aria-modal="true"><p id="bigLead"></p><div class="u" id="bigU"></div><p id="bigSub"></p><button class="btn gold" type="button" id="bigClose"></button></div>

function day(r){ return String(r.date||r.timestamp||"").slice(0,10); }
function who(r){ return String(r.studentId||r.respondentId||"").trim(); }
function data(){
  const ci=rows("aog.checkin.remote").filter(r=>String(r.checkinType||"")!=="thisisme"), pr=rows("aog.practice.remote");
  const S={};
  const S_=n=>S[n]||(S[n]={name:n,ci:[],pr:[],last:""});
  ci.forEach(r=>{ const n=who(r); if(!n) return; const s=S_(n); s.ci.push(r); if(day(r)>s.last) s.last=day(r); });
  pr.forEach(r=>{ const n=who(r); if(!n) return; const s=S_(n); s.pr.push(r); if(day(r)>s.last) s.last=day(r); });
  Object.values(S).forEach(s=>{ s.ci.sort((a,b)=>day(a)<day(b)?1:-1); s.pr.sort((a,b)=>day(a)<day(b)?1:-1);
    s.flags=s.ci.filter(r=>flagged(r)).length;
    const scored=s.pr.filter(r=>+r.itemsTotal>0); s.acc=scored.length?Math.round(100*scored.reduce((a,r)=>a+(+r.independent||0),0)/scored.reduce((a,r)=>a+(+r.itemsTotal||0),0)):null; });
  return {ci,pr,S};
}

function lineSvg(pts,opt){ opt=opt||{}; const W=opt.w||560,H=opt.h||180,P=28; if(!pts.length) return "";
  const ys=pts.map(p=>p.v).concat([opt.target,opt.base].filter(v=>v!=null&&!isNaN(v))), lo0=Math.min(opt.min!=null?opt.min:Math.min(...ys),...ys), hi0=Math.max(opt.max!=null?opt.max:Math.max(...ys),...ys,lo0+1), pad=(opt.min==null&&opt.max==null)?(hi0-lo0)*.08:0, lo=lo0-pad, hi=hi0+pad;
  const X=i=>P+(W-2*P)*(pts.length<2?0.5:i/(pts.length-1)), Y=v=>H-P-(H-2*P)*((v-lo)/(hi-lo));
  const path=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img">';
  [0,.5,1].forEach(t=>{ const y=P+(H-2*P)*t; g+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y+'" y2="'+y+'" stroke="currentColor" stroke-opacity=".12"/>'; g+='<text x="2" y="'+(y+4)+'" font-size="11" fill="currentColor" fill-opacity=".6">'+Math.round(hi-(hi-lo)*t)+'</text>'; });
  if(opt.target!=null){ const y=Y(opt.target); g+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y+'" y2="'+y+'" stroke="#2E7D4F" stroke-dasharray="6 5" stroke-width="2"/><text x="'+(W-P)+'" y="'+(y-5)+'" font-size="11" text-anchor="end" fill="#2E7D4F" font-weight="700">'+T("goal")+' '+opt.target+'</text>'; }
  if(opt.base!=null){ const y=Y(opt.base); g+='<line x1="'+P+'" x2="'+(W-P)+'" y1="'+y+'" y2="'+y+'" stroke="#B8893A" stroke-dasharray="3 5" stroke-width="1.5"/>'; }
  g+='<path d="'+path+'" fill="none" stroke="'+(opt.c||"#2F63B8")+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p,i)=>{ g+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="4.5" fill="'+(opt.c||"#2F63B8")+'"><title>'+esc(p.l||"")+' · '+p.v+'</title></circle>'; });
  const n=pts.length; [0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{ g+='<text x="'+X(i)+'" y="'+(H-6)+'" font-size="11" text-anchor="middle" fill="currentColor" fill-opacity=".6">'+esc(pts[i].l||"")+'</text>'; });
  return g+'</svg>';
}

   +'</div>';

    +'<label class="f" for="asK">'+T("kind")+'</label><select id="asK">'+opt("unit",T("unit"),as.k==="unit")+opt("prac",T("prac"),as.k==="prac")+'</select>'
    +(as.k==="unit"
      ? '<label class="f" for="asP">'+T("subject")+'</label><select id="asP">'+Object.keys(UNITNAME).filter(k=>CAT.units[k]).map(k=>opt(k,UNITNAME[k][lang==="es"?1:0],k===as.p)).join("")+'</select>'
       +'<label class="f" for="asF">'+T("pick")+'</label><select id="asF">'+units.map(u=>opt(u[2],u[1],u[2]===as.f)).join("")+'</select>'
      : '<label class="f" for="asI">'+T("pick")+'</label><select id="asI">'+CAT.acts.filter(a=>a[0]!=="drops").map(a=>opt(a[0],lang==="es"?a[2]:a[1],a[0]===as.i)).join("")+'</select>')
    +'<div class="row"><button class="btn add" type="button" data-add="as">+ '+T("add")+'</button></div></section>'
  +'<section class="card hand" style="--ac:var(--c5)"><div class="ic">'+svg("sl")+'</div><p class="k">'+T("hand")+'</p><h2>'+T("sl")+'</h2><p class="s">'+T("slS")+'</p>'
    +'<label class="f" for="slI">'+T("slip")+'</label><select id="slI">'+SLIPS.map(s=>opt(s[0],lang==="es"?s[2]:s[1],s[0]===sl.i)).join("")+'</select>'
    +'<div class="row"><button class="btn add" type="button" data-add="sl">+ '+T("add")+'</button></div></section>'
  +'</div>'
  +'<section class="card" style="margin-top:22px"><p class="k" style="color:var(--goldInk)">'+T("tools")+'</p><div class="row">'+TOOLS.map(x=>'<a class="btn" href="/#opentool='+x[0]+'">'+x[lang==="es"?2:1]+'</a>').join("")+'<a class="btn" href="/#tools">'+T("allTools")+' ›</a></div></section>'
  +'<section class="card tray"><p class="k" style="color:var(--goldInk)">'+T("tray")+'</p>'
    +'<div class="items">'+(tr.length?tr.map((it,i)=>'<div class="item" style="--ac:'+TAG[it.t][1]+'"><span class="tag">'+TAG[it.t][0]+'</span><b>'+esc(itemLabel(it,lang))+'</b><button type="button" data-del="'+i+'" aria-label="Remove">✕</button></div>').join(""):'<p class="empty">'+T("trayE")+'</p>')+'</div>'
    +(tr.length?'<p class="k" style="color:var(--goldInk)">'+T("link")+'</p><div class="linkbox"><code id="lk">'+esc(link)+'</code><button class="btn gold" type="button" id="cp">'+T("copy")+'</button><button class="btn" type="button" id="bg">'+T("show")+'</button><a class="btn" href="'+esc(link)+'" target="_blank" rel="noopener">'+T("open")+'</a></div>'
      +(conn?'':'<p class="warn">'+T("nosheet")+'</p>'):'')
  +'</section>';
}
function student(){
  const lang=L(), h=get("aog.dash2.handed",null), items=(h&&h.items)||(QS.get("view")==="student"?[]:get(K.tray,[])), nm=get(K.stu,"");
  const ic={dd:"dd",unit:"as",prac:"as",slip:"sl"}, ac={dd:"var(--c1)",unit:"var(--c3)",prac:"var(--c3)",slip:"var(--c5)"};
  return '<div class="stu"><div class="hello"><div><h1>'+T("sw")+'</h1><p>'+T("swS")+'</p></div></div>'
   +'<section class="card"><label class="f" for="stN">'+T("name")+'</label><input type="text" id="stN" maxlength="40" autocomplete="off" value="'+esc(nm)+'"><p class="note">'+T("nameS")+'</p></section>'
   +'<div class="work">'+(items.length?items.map(it=>'<a class="go" style="--ac:'+ac[it.t]+'" href="'+esc(studentHref(it))+'"><span class="ic">'+svg(ic[it.t])+'</span><span><b>'+esc(itemLabel(it,lang))+'</b><span>'+TAG[it.t][0]+'</span></span><span class="arr">›</span></a>').join(""):'<p class="empty">'+T("nothing")+'</p>')+'</div></div>';
}
function setup(){
  const conn=!!destParam();
  return '<div class="hello"><div><h1>'+T("setupH")+'</h1><p>'+T("setupS")+'</p></div><span class="pill '+(conn?"ok":"")+'"><span class="dot"></span>'+T(conn?"ok":"no")+'</span></div>'
   +'<div class="grid3" style="grid-template-columns:repeat(2,minmax(0,1fr))">'
   +'<section class="card hand" style="--ac:var(--c2)"><div class="ic">'+svg("setup")+'</div><h2>'+T("conn")+'</h2><p class="s">'+T("connS")+'</p><div class="row"><a class="btn solid" href="/#dashboard">'+T("openConn")+'</a><a class="btn" href="/AoG-Screener-Sync-Code.gs" download>⬇ '+T("gs")+'</a><a class="btn" href="/AoG-Sheet-Setup.pdf" target="_blank" rel="noopener">📄 '+T("guide")+'</a></div></section>'
   +'<section class="card hand" style="--ac:var(--c4)"><div class="ic">'+svg("reports")+'</div><h2>'+T("classic")+'</h2><p class="s">'+T("classicS")+'</p><div class="row"><a class="btn solid" href="/#dashboard">'+T("openClassic")+'</a></div></section>'
   +'</div>';
}
function inbox(){ return '<div class="hello"><div><h1>'+T("inbox")+'</h1><p>'+T("inboxS")+'</p></div><a class="btn" href="/turn-ins.html" target="_blank" rel="noopener">'+T("fullPage")+' ›</a></div><iframe src="/turn-ins.html?embed=1" title="'+T("inbox")+'" style="width:100%;height:calc(100vh - 190px);min-height:520px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow)"></iframe>'; }
function soon(){ return '<div class="hello"><div><h1>'+T(PAGE)+'</h1><p>'+T("soon")+'</p></div></div><div class="row"><a class="btn solid" href="/#dashboard">'+T("openClassic")+' ›</a>'+(PAGE==="inbox"?'<a class="btn" href="/turn-ins.html">'+T("inbox")+' ›</a>':'')+'</div>'; }
function render(){
  nav(); const app=document.getElementById("app");
  app.innerHTML = VIEW==="student"? student() : PAGE==="today"? today() : PAGE==="setup"? setup() : PAGE==="students"? students() : PAGE==="checkins"? checkins() : PAGE==="trends"? trends() : PAGE==="brick"? brick() : PAGE==="reports"? reports() : PAGE==="inbox"? inbox() : soon();
  wire();
}
function asGet(){ return Object.assign({k:"unit",p:"mth",f:"mth-u1.html",i:"m1"},get(K.as,{})); }
function saveDD(){ put(K.dd,{s:val("ddS"),g:val("ddG"),n:+val("ddN")}); }
const val=id=>{const e=document.getElementById(id);return e?e.value:""};
function wire(){
  const on=(id,ev,f)=>{const e=document.getElementById(id); if(e) e.addEventListener(ev,f);};
  on("ddS","change",()=>{ const s=val("ddS"), g=gradesFor(s); put(K.dd,{s:s,g:g.indexOf(val("ddG"))>=0?val("ddG"):g[0],n:+val("ddN")}); render(); });
  on("ddG","change",()=>{ saveDD(); render(); }); on("ddN","change",()=>{ saveDD(); render(); });
  on("asK","change",()=>{ const a=asGet(); a.k=val("asK"); put(K.as,a); render(); });
  on("asP","change",()=>{ const a=asGet(); a.p=val("asP"); a.f=(CAT.units[a.p]||[[0,"",""]])[0][2]; put(K.as,a); render(); });
  on("asF","change",()=>{ const a=asGet(); a.f=val("asF"); put(K.as,a); });
  on("asI","change",()=>{ const a=asGet(); a.i=val("asI"); put(K.as,a); });
  on("slI","change",()=>{ put(K.sl,{i:val("slI")}); });
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    const tr=get(K.tray,[]), w=b.dataset.add;
    if(w==="dd") tr.push({t:"dd",s:val("ddS"),g:val("ddG"),n:+val("ddN")});
    if(w==="as"){ if(val("asK")==="unit") tr.push({t:"unit",p:val("asP"),f:val("asF")}); else tr.push({t:"prac",i:val("asI")}); }
    if(w==="sl") tr.push({t:"slip",i:val("slI")});
    put(K.tray,tr); render();
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{ const tr=get(K.tray,[]); tr.splice(+b.dataset.del,1); put(K.tray,tr); render(); });
  on("cp","click",async()=>{ try{ await navigator.clipboard.writeText(classLink()); }catch(e){ const r=document.createRange(); r.selectNode(document.getElementById("lk")); getSelection().removeAllRanges(); getSelection().addRange(r); document.execCommand("copy"); } const b=document.getElementById("cp"); b.textContent=T("copied")+" ✓"; setTimeout(()=>{ if(b.isConnected) b.textContent=T("copy"); },1600); });
  on("bg","click",()=>{ const u=classLink(); document.getElementById("bigLead").textContent=T("bigLead"); document.getElementById("bigU").textContent=u.replace(/^https?:\/\//,"").split("?")[0]+"…"; document.getElementById("bigSub").textContent=T("bigSub"); document.getElementById("bigClose").textContent=T("close"); document.getElementById("big").classList.add("on"); });
  on("q","input",()=>{ put("aog.dash2.q",val("q")); const c=document.getElementById("q").selectionStart; render(); const e=document.getElementById("q"); if(e){e.focus();e.setSelectionRange(c,c);} });
  document.querySelectorAll("[data-stu]").forEach(e=>e.addEventListener("click",()=>{ put("aog.dash2.sel",e.dataset.stu); if(PAGE!=="students"){ location.hash="students"; } else render(); window.scrollTo(0,0); }));
  on("iepStu","change",()=>{ put("aog.dash2.iepStu",val("iepStu")); render(); });
  on("backStu","click",()=>{ put("aog.dash2.sel",""); render(); });
  on("stN","input",()=>{ const v=val("stN"); put(K.stu,v); try{ localStorage.setItem("aog.drops.who",v); }catch(e){} });
}
document.getElementById("bigClose").onclick=()=>document.getElementById("big").classList.remove("on");
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.getElementById("big").classList.remove("on"); });
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{ VIEW=b.dataset.view; put(K.view,VIEW); render(); });
window.addEventListener("hashchange",()=>{ PAGE=location.hash.slice(1)||"today"; if(PAGE!=="students") put("aog.dash2.sel",""); render(); window.scrollTo(0,0); });
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});
render();
</script>
<script src="/aog-grace.js" defer></script>
</body>
