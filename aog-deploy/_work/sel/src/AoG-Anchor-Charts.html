<style>
:root{
  --ground:#F5F1E8;
  --field:#FFFFFF;
  --field-2:#EAE4D8;
  --ink:#16202B;
  --ink-soft:#4E5A67;
  --ink-faint:#78848F;
  --navy:#1B3A5F;
  --gold:#B8893A;
  --gold-deep:#7A5C1F;
  --rule:rgba(22,32,43,.18);
  --rule-soft:rgba(22,32,43,.09);
  --neg:#A81E22;          /* the costly side — shame, the critic, self-punishment */
  --neg-wash:rgba(168,30,34,.07);
  --pos:#2C6A4C;          /* the constructive side — guilt, the witness, repair */
  --pos-wash:rgba(44,106,76,.07);
  --u1:#1C5499;
  --u2:#356B25;
  --u3:#A63A2B;
  --u4:#8A6A1F;
  --a:var(--u1);
  --a-wash:rgba(28,84,153,.08);
  --lift:0 1px 0 rgba(255,255,255,.7), 0 18px 40px -28px rgba(22,32,43,.5);
  --lift-sm:0 1px 2px rgba(22,32,43,.07), 0 8px 20px -16px rgba(22,32,43,.4);
  --focus:#B8893A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#10151B; --field:#18202A; --field-2:#212B36;
    --ink:#E8EEF4; --ink-soft:#A2AEBA; --ink-faint:#7F8B97;
    --navy:#9CC2E8; --gold:#D6A852; --gold-deep:#D6A852;
    --rule:rgba(232,238,244,.2); --rule-soft:rgba(232,238,244,.1);
    --neg:#F08A8E; --neg-wash:rgba(240,138,142,.12);
    --pos:#7FCCA4; --pos-wash:rgba(127,204,164,.12);
    --u1:#7FB0E8; --u2:#8CC97A; --u3:#E08573; --u4:#D9B45C;
    --a-wash:rgba(127,176,232,.12);
    --lift:0 1px 0 rgba(232,238,244,.04), 0 22px 50px -30px rgba(0,0,0,.95);
    --lift-sm:0 1px 2px rgba(0,0,0,.5), 0 10px 24px -18px rgba(0,0,0,.9);
    --focus:#D6A852;
  }
}
:root[data-theme="dark"]{
  --ground:#10151B; --field:#18202A; --field-2:#212B36;
  --ink:#E8EEF4; --ink-soft:#A2AEBA; --ink-faint:#7F8B97;
  --navy:#9CC2E8; --gold:#D6A852; --gold-deep:#D6A852;
  --rule:rgba(232,238,244,.2); --rule-soft:rgba(232,238,244,.1);
  --neg:#F08A8E; --neg-wash:rgba(240,138,142,.12);
  --pos:#7FCCA4; --pos-wash:rgba(127,204,164,.12);
  --u1:#7FB0E8; --u2:#8CC97A; --u3:#E08573; --u4:#D9B45C;
  --a-wash:rgba(127,176,232,.12);
  --lift:0 1px 0 rgba(232,238,244,.04), 0 22px 50px -30px rgba(0,0,0,.95);
  --lift-sm:0 1px 2px rgba(0,0,0,.5), 0 10px 24px -18px rgba(0,0,0,.9);
  --focus:#D6A852;
}
.u2{--a:var(--u2); --a-wash:rgba(53,107,37,.09);}
.u3{--a:var(--u3); --a-wash:rgba(166,58,43,.09);}
.u4{--a:var(--u4); --a-wash:rgba(138,106,31,.10);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .u2{--a-wash:rgba(140,201,122,.12);}}
:root[data-theme="dark"] .u2{--a-wash:rgba(140,201,122,.12);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .u3{--a-wash:rgba(224,133,115,.13);}}
:root[data-theme="dark"] .u3{--a-wash:rgba(224,133,115,.13);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .u4{--a-wash:rgba(217,180,92,.13);}}
:root[data-theme="dark"] .u4{--a-wash:rgba(217,180,92,.13);}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.45;
  display:flex; flex-direction:column; overflow:hidden;
}
h1,h2,h3{margin:0; text-wrap:balance;}
p{margin:0;}
button{font:inherit; color:inherit; cursor:pointer;}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:5px;}

/* ══ TOP BAR ══ */
.bar{
  flex:none; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:9px 14px; background:var(--field); border-bottom:1.5px solid var(--rule);
  box-shadow:var(--lift-sm); z-index:30;
}
.aog-home{
  display:inline-flex; align-items:center; gap:7px; text-decoration:none; color:var(--ink);
  padding:8px 14px 8px 11px; border-radius:10px; flex:none; font-size:13px; font-weight:700;
  border:1.5px solid var(--rule); background:var(--field);
  transition:border-color .12s ease, transform .12s ease;
}
.aog-home:hover{border-color:var(--a); transform:translateY(-1px);}
.aog-home .arw{font-size:15px; line-height:1;}
.brand{display:inline-flex; align-items:center; gap:9px; flex:none;}
@media (max-width:760px){ .brand{display:none;} }
.brand .mk{
  width:32px; height:32px; border-radius:9px; background:var(--navy); color:#E7C77B;
  display:grid; place-items:center; font-family:var(--serif); font-size:19px; font-weight:700;
}
:root[data-theme="dark"] .brand .mk{background:#1B3A5F;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .mk{background:#1B3A5F;}}
.brand .nm{font-family:var(--serif); font-size:14.5px; font-weight:700; color:var(--navy); line-height:1.1;}
.brand .sb{font-size:9.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-faint); font-weight:700;}
.bar .spacer{flex:1 1 auto; min-width:6px;}

.seg{display:inline-flex; border:1.5px solid var(--rule); border-radius:10px; overflow:hidden; flex:none;}
.seg button{
  border:0; background:transparent; padding:7px 13px; font-size:13px; font-weight:700;
  letter-spacing:.02em; color:var(--ink-soft);
}
.seg button[aria-pressed="true"]{background:var(--a); color:#fff;}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#10151B;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#10151B;}}
.seg button + button{border-left:1.5px solid var(--rule);}

.btn{
  border:1.5px solid var(--rule); background:var(--field); border-radius:10px;
  padding:7px 13px; font-size:13px; font-weight:600; flex:none;
  display:inline-flex; align-items:center; gap:7px;
  transition:border-color .12s ease, transform .12s ease;
}
.btn:hover{border-color:var(--a); transform:translateY(-1px);}
.btn-accent{background:var(--a); border-color:var(--a); color:#fff;}
:root[data-theme="dark"] .btn-accent{color:#10151B;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn-accent{color:#10151B;}}
.btn[disabled]{opacity:.4; cursor:default; transform:none;}
.btn-ghost{border-color:transparent;}
.menu-wrap{position:relative; display:inline-flex; flex:none;}
.menu{
  position:absolute; top:calc(100% + 7px); right:0; min-width:16rem; z-index:60; display:none;
  background:var(--field); border:1.5px solid var(--rule); border-radius:13px;
  box-shadow:var(--lift); padding:6px;
}
.menu.on{display:block;}
.menu button{
  display:block; width:100%; text-align:left; border:0; background:transparent;
  border-radius:9px; padding:9px 11px; font-size:13.5px; font-weight:700; line-height:1.25;
}
.menu button:hover:not([disabled]){background:var(--a-wash);}
.menu button[disabled]{opacity:.4; cursor:default;}
.menu button small{display:block; font-weight:400; font-size:11.5px; color:var(--ink-faint); margin-top:3px;}

/* ══ SHELL ══ */
.shell{flex:1 1 auto; display:flex; min-height:0;}
.rail{
  flex:none; width:250px; overflow-y:auto; padding:12px 10px 30px;
  border-right:1.5px solid var(--rule); background:var(--field);
}
.rail-h{
  font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-faint); padding:10px 8px 6px;
}
.rail-h:first-child{padding-top:2px;}
.ritem{
  display:block; width:100%; text-align:left; border:1.5px solid transparent; background:transparent;
  border-radius:10px; padding:7px 10px; margin-bottom:2px; position:relative;
}
.ritem:hover{background:var(--a-wash);}
.ritem .rl{font-size:9.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint);}
.ritem .rn{font-family:var(--serif); font-size:15px; font-weight:600; line-height:1.2; display:block;}
.ritem[aria-current="true"]{background:var(--a-wash); border-color:var(--a);}
.ritem[aria-current="true"] .rl{color:var(--a);}
.ritem .dot{
  position:absolute; right:9px; top:50%; transform:translateY(-50%);
  width:7px; height:7px; border-radius:50%; background:var(--a); opacity:0;
}
.ritem.has-class .dot{opacity:1;}
.rail-note{font-size:11px; color:var(--ink-faint); padding:10px 9px 0; line-height:1.5;}
.rail-toggle{display:none;}

.stage{flex:1 1 auto; overflow-y:auto; min-width:0; padding:22px clamp(14px,2.4vw,40px) 40px;}

/* ══ CHART ══ */
.chart{max-width:1500px; margin:0 auto;}
.chart-head{display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; margin-bottom:6px;}
.chart-head .k{font-size:clamp(11px,1.05vw,14px); font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:var(--a);}
.chart-head h1{
  font-family:var(--serif); font-size:clamp(30px,4.1vw,62px); line-height:1.03; letter-spacing:-.02em;
  margin-top:3px;
}
.chart-head .form{font-size:clamp(11px,1vw,13px); font-weight:700; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-faint); padding-bottom:8px;}
.tri{display:grid;gap:14px;margin-top:8px;}
.tri .tri-top{border-width:3px;}
@media(min-width:760px){.tri{grid-template-columns:1fr 1fr;}
  .tri .tri-top{grid-column:1 / -1;}}
.chart-rule{height:4px; background:var(--a); border-radius:2px; margin:12px 0 22px;}

.say{
  font-family:var(--serif); font-style:italic; font-size:clamp(19px,2.2vw,34px); line-height:1.3;
  color:var(--ink); border-left:5px solid var(--gold); padding:4px 0 4px 18px; margin:24px 0 0;
  max-width:34ch;
}
.say.wide{max-width:none;}
.say .tag{
  display:block; font-family:var(--sans); font-style:normal; font-size:11px; font-weight:800;
  letter-spacing:.13em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:5px;
}

/* two-column / T-chart */
.cols{display:grid; gap:clamp(12px,1.6vw,26px); grid-template-columns:1fr 1fr;}
.cols.three{grid-template-columns:1fr 1fr 1fr;}
@media (max-width:820px){.cols,.cols.three{grid-template-columns:1fr;}}
.col{
  border:3px solid var(--rule); border-radius:16px; padding:clamp(12px,1.4vw,22px);
  background:var(--field); display:flex; flex-direction:column; min-width:0;
}
.col.neg{border-color:var(--neg); background:var(--neg-wash);}
.col.pos{border-color:var(--pos); background:var(--pos-wash);}
.col.flat{border-color:var(--a); background:var(--a-wash);}
.col > .ch{
  font-family:var(--sans); font-size:clamp(17px,2vw,32px); font-weight:800; letter-spacing:.01em;
  line-height:1.1; text-transform:uppercase;
}
.col.neg > .ch{color:var(--neg);}
.col.pos > .ch{color:var(--pos);}
.col.flat > .ch{color:var(--a);}
.col > .csub{font-family:var(--serif); font-style:italic; font-size:clamp(13px,1.2vw,19px);
  color:var(--ink-soft); margin-top:4px;}
.items{list-style:none; margin:14px 0 0; padding:0; display:flex; flex-direction:column; gap:clamp(7px,.8vw,12px);}
.items li{
  font-size:clamp(15px,1.5vw,25px); line-height:1.3; padding-left:20px; position:relative;
}
.items li::before{
  content:""; position:absolute; left:0; top:.55em; width:9px; height:3px; border-radius:2px;
  background:currentColor; opacity:.5;
}
.col.neg .items li::before{background:var(--neg); opacity:.85;}
.col.pos .items li::before{background:var(--pos); opacity:.85;}
.items li.staged{border-left:0;}

/* class contributions */
.class-wrap{margin-top:auto; padding-top:14px;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:9px;}
.chips:empty{display:none;}
.chip{
  display:inline-flex; align-items:center; gap:8px; border:2px solid var(--a);
  border-radius:99px; padding:5px 7px 5px 14px; background:var(--field);
  font-size:clamp(14px,1.35vw,22px); font-weight:600; line-height:1.25;
  animation:pop .25s cubic-bezier(.2,.8,.3,1) both;
}
.col.neg .chip{border-color:var(--neg);}
.col.pos .chip{border-color:var(--pos);}
@keyframes pop{from{opacity:0; transform:scale(.92);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion: reduce){.chip{animation:none;} .btn:hover{transform:none;}}
.chip button{border:0; background:transparent; color:var(--ink-faint); font-size:17px; line-height:1; padding:2px 6px; border-radius:99px;}
.chip button:hover{color:var(--neg);}
.addrow{display:flex; gap:8px;}
.addrow input{
  flex:1 1 auto; min-width:0; border:2px dashed var(--rule); border-radius:10px; background:transparent;
  color:var(--ink); font:inherit; font-size:clamp(14px,1.2vw,19px); padding:8px 12px;
}
.addrow input:focus{outline:none; border-color:var(--a); border-style:solid;}
.addrow input::placeholder{color:var(--ink-faint); opacity:.7;}

/* rings */
.rings{max-width:1000px;}
.ring{border:4px solid var(--rule); border-radius:26px; padding:clamp(12px,1.4vw,20px);}
.ring.r1{border-color:var(--ink-faint);}
.ring.r2{border-color:var(--a); margin-top:14px;}
.ring.r3{border-color:var(--a); border-width:6px; background:var(--a-wash); margin-top:14px;}
.ring .rh{font-size:clamp(15px,1.7vw,27px); font-weight:800; text-transform:uppercase; letter-spacing:.02em; color:var(--ink-soft);}
.ring.r2 .rh,.ring.r3 .rh{color:var(--a);}
.ring .rs{font-family:var(--serif); font-style:italic; font-size:clamp(13px,1.2vw,19px); color:var(--ink-soft); margin:3px 0 12px;}

/* spectrum */
.spec-ends{display:grid; grid-template-columns:1fr 1fr; gap:clamp(12px,1.6vw,26px);}
.spec-bar{
  position:relative; height:16px; margin:26px 0 10px; border-radius:99px;
  border:4px solid var(--ink-soft);
}
.spec-bar .cap{
  position:absolute; top:26px; font-size:clamp(11px,1vw,14px); font-weight:800;
  letter-spacing:.11em; text-transform:uppercase; color:var(--ink-faint);
}
.spec-bar .cap.l{left:0;} .spec-bar .cap.r{right:0;}
.notice{
  margin-top:34px; border:3px dashed var(--gold); border-radius:14px; padding:14px 18px;
  display:flex; gap:14px; align-items:flex-start;
}
.notice .k{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--gold-deep); flex:none; padding-top:3px;}
.notice p{font-size:clamp(14px,1.3vw,20px); line-height:1.4;}

/* backpack */
.pack{display:grid; grid-template-columns:minmax(0,300px) 1fr; gap:clamp(16px,2vw,34px); align-items:start;}
@media (max-width:820px){.pack{grid-template-columns:1fr;}}
.pack svg{width:100%; height:auto; display:block;}
.pack .into{
  font-family:var(--serif); font-style:italic; font-size:clamp(17px,1.8vw,28px);
  color:var(--a); margin-top:12px; text-align:center;
}

/* signal vs noise */
.sig{display:grid; gap:clamp(12px,1.6vw,26px); grid-template-columns:1fr 1fr;}
@media (max-width:820px){.sig{grid-template-columns:1fr;}}
.mechs{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(10px,1.2vw,18px); margin-top:22px;}
@media (max-width:820px){.mechs{grid-template-columns:1fr;}}
.mech{border:3px solid var(--a); border-radius:14px; padding:12px 14px; background:var(--field);}
.mech .n{
  width:34px; height:34px; border-radius:10px; border:2.5px solid var(--a); color:var(--a);
  display:grid; place-items:center; font-family:var(--serif); font-weight:700; font-size:19px;
}
.mech .t{font-size:clamp(15px,1.5vw,24px); font-weight:800; margin-top:9px; line-height:1.2;}
.mech.pending{border-style:dashed; opacity:.55;}
.mech.pending .t{color:var(--ink-faint);}

/* bubbles */
.cols.bubbles .col{border-radius:32px 32px 32px 8px; position:relative;}
.cols.bubbles .col:last-child{border-radius:32px 32px 8px 32px;}

/* crisis */
.crisis{border:5px solid var(--neg); border-radius:18px; padding:clamp(16px,2vw,30px); max-width:1000px;}
.crisis h2{font-size:clamp(12px,1.1vw,15px); font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:var(--neg);}
.crisis ul{list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:14px;}
.crisis li{font-size:clamp(22px,2.7vw,44px); font-weight:700; line-height:1.2;}
.crisis li span{display:block; font-size:clamp(13px,1.2vw,19px); font-weight:600; color:var(--ink-soft); letter-spacing:.02em;}
.crisis .cslr{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:22px;}
@media (max-width:640px){.crisis .cslr{grid-template-columns:1fr;}}
.crisis .cslr input{
  border:0; border-bottom:3px solid var(--rule); background:transparent; color:var(--ink);
  font:inherit; font-size:clamp(16px,1.6vw,26px); padding:7px 3px;
}
.crisis .cslr input:focus{outline:none; border-bottom-color:var(--neg);}

/* posting strip */
.posting{
  margin-top:34px; display:flex; flex-wrap:wrap; gap:10px 26px;
  border-top:1.5px solid var(--rule); padding-top:14px;
}
.posting div{font-size:13px; color:var(--ink-soft); max-width:44ch;}
.posting b{font-size:10px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-faint); display:block;}

/* build spec (teacher note) */
.spec-note{margin-top:16px;}
.spec-note summary{
  font-size:11px; font-weight:800; letter-spacing:.13em; text-transform:uppercase; color:var(--a);
  cursor:pointer; list-style:none; display:inline-flex; align-items:center; gap:7px;
}
.spec-note summary::-webkit-details-marker{display:none;}
.spec-note summary::after{content:"＋"; opacity:.7;}
.spec-note[open] summary::after{content:"−";}
.spec-note p{font-size:14px; color:var(--ink-soft); margin-top:8px; max-width:70ch; line-height:1.55;}

/* ══ WALL VIEW ══ */
.wall{max-width:1700px; margin:0 auto;}
.wall-h{display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; margin-bottom:4px;}
.wall-h h1{font-family:var(--serif); font-size:clamp(26px,3.2vw,46px); line-height:1.05;}
.wall-h .k{font-size:11px; font-weight:800; letter-spacing:.15em; text-transform:uppercase; color:var(--a);}
.wall-say{font-family:var(--serif); font-style:italic; font-size:clamp(15px,1.5vw,22px); color:var(--ink-soft); margin-top:8px; max-width:60ch;}
.wall-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:18px; margin-top:22px;}
.tile{
  border:2.5px solid var(--rule); border-radius:16px; background:var(--field); overflow:hidden;
  box-shadow:var(--lift-sm); text-align:left; padding:0; display:flex; flex-direction:column;
}
.tile:hover{border-color:var(--a);}
.tile .th{padding:11px 14px 9px; border-bottom:2px solid var(--a);}
.tile .th .k{font-size:9.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--a);}
.tile .th .n{font-family:var(--serif); font-size:19px; font-weight:600; line-height:1.15; display:block; margin-top:2px;}
.tile .tb{padding:12px 14px 15px; display:grid; gap:9px; flex:1 1 auto;}
.tile .tcol{border-left:4px solid var(--rule); padding-left:10px;}
.tile .tcol.neg{border-color:var(--neg);} .tile .tcol.pos{border-color:var(--pos);} .tile .tcol.flat{border-color:var(--a);}
.tile .tcol b{display:block; font-size:11.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;}
.tile .tcol.neg b{color:var(--neg);} .tile .tcol.pos b{color:var(--pos);} .tile .tcol.flat b{color:var(--a);}
.tile .tcol p{font-size:13px; color:var(--ink-soft); line-height:1.4; margin-top:2px;}
.tile .cls{font-size:12px; color:var(--a); font-weight:700; padding-top:2px;}

/* ══ TOAST ══ */
.toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(14px);
  background:var(--ink); color:var(--ground); padding:10px 18px; border-radius:99px;
  font-size:13.5px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  z-index:100; box-shadow:var(--lift);
}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0);}

@media (max-width:900px){
  .rail{
    position:fixed; inset:0 auto 0 0; width:264px; z-index:40; transform:translateX(-102%);
    transition:transform .22s ease; box-shadow:var(--lift);
  }
  body.rail-open .rail{transform:none;}
  .rail-toggle{display:inline-flex;}
}

/* ══ PRINT — a wall chart, 11×17 if the printer has it, Letter if not ══ */

/* ══ AOG-CHART-WEB-V1 — the Identity Web drawn as a web (2026-09-12, Jimmy: "Can this actually be an
   interactive web that is made? Same across all curriculum bands"). ME in the center, the branches
   radiate, and every word the class adds hangs off its branch. Same slot/chip store as every other
   form (chips(c.id, slot.id)), so save / load / print / Reset all work unchanged. Narrow screens fall
   back to a stacked list of the same nodes — a web needs room to be a web. ══ */
.web{position:relative; width:min(100%,1180px); margin:22px auto 0; aspect-ratio:1.45;}
.web svg.wlines{position:absolute; inset:0; width:100%; height:100%; pointer-events:none;}
.web svg.wlines line{stroke:var(--a); stroke-width:3; stroke-linecap:round; opacity:.7;}
.web .wnode{position:absolute; transform:translate(-50%,-50%); width:min(27%,280px);
  border:3px solid var(--a); border-radius:18px; background:var(--field); padding:clamp(10px,1.1vw,16px);}
.web .wnode .n{display:inline-grid; place-items:center; width:32px; height:32px; border-radius:50%; border:2.5px solid var(--a);
  color:var(--a); font-family:var(--serif); font-weight:700; margin-bottom:6px;}
.web .wnode .ch{font-size:clamp(15px,1.4vw,22px); margin-bottom:6px;}
.web .wnode .chips{margin-bottom:6px;}
.web .wcenter{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:clamp(110px,13vw,190px); height:clamp(110px,13vw,190px);
  border-radius:50%; border:4px solid var(--a); background:var(--card); display:grid; place-items:center;
  font-family:var(--serif); font-weight:800; font-size:clamp(28px,3.4vw,52px); color:var(--ink); box-shadow:0 10px 30px -14px rgba(20,28,40,.5);}
@media (max-width:860px){
  .web{aspect-ratio:auto; display:flex; flex-direction:column; gap:12px;}
  .web svg.wlines{display:none;}
  .web .wnode{position:static; transform:none; width:100%;}
  .web .wcenter{position:static; transform:none; margin:0 auto 6px;}
}
@media print{ .web{aspect-ratio:1.3;} .web .wnode{border-color:#000; background:#fff;} .web .wcenter{border-color:#000; background:#fff;} .web svg.wlines line{stroke:#000;} }
@media print{
  @page{size:portrait; margin:12mm;}
  html,body{height:auto; overflow:visible; background:#fff; color:#000;}
  body{display:block; font-size:12pt;}
  .bar,.rail,.toast,.no-print,.addrow,.chip button,.spec-note,.rail-toggle,.menu{display:none !important;}
  .shell{display:block;}
  .stage{overflow:visible; padding:0;}
  .chart,.wall{max-width:none;}
  .chart-head h1{font-size:40pt;}
  .chart-head .k,.wall-h .k{font-size:11pt; color:#000;}
  .chart-rule{background:#000; height:5px;}
  .col{border-color:#000 !important; background:#fff !important; break-inside:avoid;}
  .col > .ch{font-size:20pt; color:#000 !important;}
  .col > .csub,.ring .rs{color:#000;}
  .items li{font-size:14pt;}
  .items li::before{background:#000 !important; opacity:1;}
  .chip{border-color:#000 !important; background:#fff !important; font-size:14pt; padding:4px 12px;}
  .ring{border-color:#000 !important; background:#fff !important;}
  .ring .rh{color:#000;}
  .say{font-size:20pt; border-left-color:#000; break-inside:avoid;}
  .say .tag{color:#000;}
  .mech{border-color:#000 !important; background:#fff !important;}
  .mech .n,.mech .t{color:#000;}
  .mech.pending{display:none;}
  .crisis{border-color:#000 !important;}
  .crisis h2,.crisis li span{color:#000;}
  .crisis li{font-size:26pt;}
  .notice{border-color:#000 !important;}
  .notice .k,.notice p{color:#000;}
  .spec-bar{border-color:#000;}
  .posting{border-top-color:#000;}
  .posting div,.posting b{color:#000;}
  .wall-grid{grid-template-columns:1fr 1fr; break-inside:avoid; page-break-inside:avoid;}
  .tile{border-color:#000 !important; box-shadow:none; break-inside:avoid;}
  .tile .th{border-bottom-color:#000;}
  .tile .th .k,.tile .tcol b,.tile .cls{color:#000;}
  .tile .tcol{border-left-color:#000;}
}
.brand .ac-title{margin:0;}

/* ══ AOG-PRINT-SAFE-V1 (2026-09-20) ═══════════════════════════════════════════
   Jimmy, printing a novel study from his phone: "another pdf that gets parts of
   the material cut off." These are the rules that keep paper honest on every
   engine — a table row, a list item, a figure and a picture stay whole; a head
   keeps the lines under it; no paragraph strands one line at a page edge; and a
   long table repeats its head at the top of each page. Printed pages only. */
@media print{
  table{break-inside:auto; page-break-inside:auto}
  thead{display:table-header-group}
  tfoot{display:table-footer-group}
  tr{break-inside:avoid; page-break-inside:avoid}
  li,figure,img,svg{break-inside:avoid; page-break-inside:avoid}
  h1,h2,h3,h4,h5{break-after:avoid; page-break-after:avoid}
  p{orphans:3; widows:3}
}

/* ══ tiny DOM helpers ══ */
function el(tag, cls, text){
  var n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text != null) n.textContent = text;
  return n;
}
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove("on"); }, 2600);
}
function maxStage(c){ return c.stages || 0; }
function shown(c, item){
  var st = item && item.stage ? item.stage : 0;
  if(!st) return true;
  if(S.mode === "complete") return true;
  return cs(c.id).stage >= st;
}

/* ══ pieces ══ */
function classBlock(c, slot){
  var wrap = el("div","class-wrap");
  var box  = el("div","chips");
  box.setAttribute("data-slot", slot.id);
  function draw(){
    box.innerHTML = "";
    chips(c.id, slot.id).forEach(function(text, i){
      var chip = el("span","chip");
      chip.appendChild(el("span", null, text));
      var x = el("button", null, "×");
      x.type = "button";
      x.setAttribute("aria-label", "Remove " + text);
      x.addEventListener("click", function(){
        chips(c.id, slot.id).splice(i,1); save(); draw(); paintRail();
      });
      chip.appendChild(x);
      box.appendChild(chip);
    });
  }
  draw();
  wrap.appendChild(box);

  var row = el("div","addrow no-print");
  var inp = document.createElement("input");
  inp.type = "text"; inp.autocomplete = "off";
  inp.placeholder = slot.label + " — type it, press Enter";
  inp.setAttribute("aria-label", slot.label);
  inp.addEventListener("keydown", function(e){
    if(e.key !== "Enter") return;
    e.preventDefault();
    var v = inp.value.trim(); if(!v) return;
    chips(c.id, slot.id).push(v); inp.value = ""; save(); draw(); paintRail();
  });
  row.appendChild(inp);
  wrap.appendChild(row);
  return wrap;
}

function artSvg(kind){
  var ns = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox","0 0 200 40");
  svg.setAttribute("aria-hidden","true");
  svg.style.width = "100%"; svg.style.height = "38px"; svg.style.marginTop = "10px";
  var path = document.createElementNS(ns,"path");
  path.setAttribute("fill","none");
  path.setAttribute("stroke","currentColor");
  path.setAttribute("stroke-width", kind === "signal" ? "3" : "2");
  path.setAttribute("stroke-linecap","round");
  path.setAttribute("d", kind === "signal"
    ? "M2 20 H198"
    : "M2 20 l6 -14 l6 28 l6 -22 l6 18 l6 -26 l6 30 l6 -16 l6 12 l6 -24 l6 26 l6 -18 l6 20 l6 -28 l6 24 l6 -12 l6 16 l6 -22 l6 26 l6 -14 l6 10 l6 -18 l6 22 l6 -20 l6 16 l6 -10 l6 14 l6 -20 l6 18 l6 -8 l6 10 l6 -14 l1 6");
  svg.appendChild(path);
  return svg;
}

function columnBlock(c, col, idx){
  var d = el("div","col " + (col.tone || "flat"));
  if(!shown(c, col)) d.style.opacity = ".38";
  d.appendChild(el("div","ch", col.k));
  if(col.sub) d.appendChild(el("div","csub", col.sub));
  if(col.art) d.appendChild(artSvg(col.art));

  var visible = (col.items || []).filter(function(it){ return shown(c, it) && shown(c, col); });
  if(visible.length){
    var ul = el("ul","items");
    visible.forEach(function(it){
      var li = el("li", null, it.t);
      if(it.q){
        var q = el("div", null, it.q);
        q.style.fontFamily = "var(--serif)"; q.style.fontStyle = "italic";
        q.style.color = "var(--ink-soft)"; q.style.marginTop = "2px";
        li.appendChild(q);
      }
      ul.appendChild(li);
    });
    d.appendChild(ul);
  }
  var slot = (c.slots || []).filter(function(s){ return s.col === idx; })[0]
          || {id:"col"+idx, label:"Add what the class says"};
  d.appendChild(classBlock(c, slot));
  return d;
}

function mechBlock(c){
  var wrap = el("div");
  wrap.appendChild(labeled(c.mechLabel || "Added during the lesson"));
  var grid = el("div","mechs");
  if(c.mechs.length === 4) grid.style.gridTemplateColumns = "repeat(4,1fr)";
  c.mechs.forEach(function(m, i){
    var on = shown(c, m);
    var card = el("div","mech" + (on ? "" : " pending"));

    card.appendChild(el("div","t", on ? m.t : "…"));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  return wrap;
}

function labeled(text){
  var l = el("div", null, text);
  l.style.cssText = "font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);margin:26px 0 -8px;";

}

function sayBlock(s){

      var d = el("div","tcol " + (col.tone || "flat"));
      d.appendChild(el("b", null, col.k));
      var line = col.sub || (col.items && col.items[0] ? col.items[0].t : "");
      if(line) d.appendChild(el("p", null, line));
      tb.appendChild(d);
    });
    (c.rings || []).forEach(function(r){
      var d = el("div","tcol flat");
      d.appendChild(el("b", null, r.k));
      d.appendChild(el("p", null, r.s));
      tb.appendChild(d);
    });
    (c.ends || []).forEach(function(e){
      var d = el("div","tcol " + e.tone);
      d.appendChild(el("b", null, e.k));
      d.appendChild(el("p", null, e.q));
      tb.appendChild(d);
    });
    if(c.form === "web"){
      var dw = el("div","tcol flat");
      dw.appendChild(el("b", null, c.center || "ME"));
      dw.appendChild(el("p", null, c.branches.join(" · ")));
      tb.appendChild(dw);
    }
    if(c.form === "backpack"){
      var d0 = el("div","tcol flat");
      d0.appendChild(el("b", null, "What goes in"));
      d0.appendChild(el("p", null, c.packItems.join(" · ")));
      tb.appendChild(d0);
    }
    var n = 0, st = S.charts[c.id];
    if(st && st.chips){ for(var k in st.chips){ n += (st.chips[k] || []).length; } }
    if(n) tb.appendChild(el("div","cls", n + (n === 1 ? " thing this class added" : " things this class added")));
    tile.appendChild(tb);
    tile.addEventListener("click", function(){ go(c.id); });
    grid.appendChild(tile);
  });
  root.appendChild(grid);
  stage.appendChild(root);
  stage.scrollTop = 0;
}

/* ══ rail ══ */
function paintRail(){
  var rail = document.getElementById("rail");
  rail.innerHTML = "";
  var UNAMES = {1:"Identity", 2:"Self-Compassion", 3:"Empathy & Forgiveness", 4:"Grace & Generosity"};
  [1,2,3,4].forEach(function(u){
    rail.appendChild(el("div","rail-h","Unit " + u + " · " + UNAMES[u]));
    CHARTS.filter(function(c){ return c.unit === u; }).forEach(function(c){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "ritem" + (c.unit > 1 ? " u" + c.unit : "") + (hasClassWork(c.id) ? " has-class" : "");
      b.setAttribute("aria-current", String(current === c.id));
      b.innerHTML = "";
      b.appendChild(el("span","rl","L" + c.lesson));
      b.appendChild(el("span","rn", c.name));
      b.appendChild(el("span","dot"));
      b.addEventListener("click", function(){ go(c.id); });
      rail.appendChild(b);
    });
    var w = null;
    WALLS.forEach(function(x){ if(x.unit === u) w = x; });
    if(!w) return;
    var NWORD = {5:"five", 6:"six", 7:"seven"};
    var wb = document.createElement("button");
    wb.type = "button";
    wb.className = "ritem" + (u > 1 ? " u" + u : "");
    wb.setAttribute("aria-current", String(current === w.id));
    wb.appendChild(el("span","rl","L7 · review"));
    wb.appendChild(el("span","rn","All " + (NWORD[w.ids.length] || w.ids.length) + " at once"));
    wb.addEventListener("click", function(){ go(w.id); });
    rail.appendChild(wb);
  });
  rail.appendChild(el("p","rail-note","A dot means this class has added something to that chart. Nothing here is a student's private work — these are the words the room said out loud."));
}

/* ══ navigation ══ */
function isWall(id){ return id.indexOf("wall") === 0; }
function go(id){
  current = id;
  if(isWall(id)) renderWall(id); else renderChart(id);
  paintRail();
  paintBar();
  document.body.classList.remove("rail-open");
  try{ if(location.hash.replace(/^#/,"") !== id) history.replaceState(null,"","#"+id); }catch(e){}
}
function order(){
  var list = [];
  [1,2,3,4].forEach(function(u){
    CHARTS.filter(function(c){ return c.unit === u; }).forEach(function(c){ list.push(c.id); });
    WALLS.forEach(function(w){ if(w.unit === u) list.push(w.id); });
  });
  return list;
}
function step(delta){
  var l = order(), i = l.indexOf(current);
  if(i < 0) return;
  go(l[(i + delta + l.length) % l.length]);
}

/* ══ bar ══ */
function paintBar(){
  var sk = document.getElementById("modeSkeleton"), cp = document.getElementById("modeComplete");
  sk.setAttribute("aria-pressed", String(S.mode === "skeleton"));
  cp.setAttribute("aria-pressed", String(S.mode === "complete"));
  var rb = document.getElementById("revealBtn");
  var c = isWall(current) ? null : chartById(current);
  var m = c ? maxStage(c) : 0;
  if(!c || !m || S.mode === "complete"){
    rb.disabled = true;
    rb.textContent = "Reveal next";
  } else {
    /* One-way reveal meant the next class walked in with the answers already
       up, and nothing on the page undid it. The button cycles back instead. */
    var st = cs(c.id).stage;
    rb.disabled = false;
    rb.textContent = st >= m ? "Hide the reveals" : "Reveal next (" + (st+1) + " of " + m + ")";
  }
  var rc = document.getElementById("resetChart");
  if(rc) rc.disabled = isWall(current);
  document.getElementById("printBtn").textContent = isWall(current) ? "Print this wall" : "Print this chart";
}

/* ══ wiring ══ */
document.getElementById("modeSkeleton").addEventListener("click", function(){
  S.mode = "skeleton"; save(); go(current);
});
document.getElementById("modeComplete").addEventListener("click", function(){
  S.mode = "complete"; save(); go(current);
});
document.getElementById("revealBtn").addEventListener("click", function(){
  var c = chartById(current); if(!c) return;
  var st = cs(c.id);
  st.stage = st.stage >= maxStage(c) ? 0 : st.stage + 1;
  save(); go(current);
});

/* ══ reset ══ */
(function(){
  var btn = document.getElementById("resetBtn");
  var menu = document.getElementById("resetMenu");
  function open(on){
    menu.classList.toggle("on", on);
    menu.hidden = !on;
    btn.setAttribute("aria-expanded", String(on));
  }
  btn.addEventListener("click", function(e){
    e.stopPropagation();
    open(!menu.classList.contains("on"));
  });
  document.addEventListener("click", function(e){
    if(!menu.contains(e.target) && e.target !== btn) open(false);
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") open(false); });

  document.getElementById("resetChart").addEventListener("click", function(){
    var c = chartById(current); if(!c) return;
    if(!window.confirm("Reset " + c.name + "? This hides the reveals and clears everything this class added to it.")) return;
    delete S.charts[c.id];
    save(); open(false); go(current);
    toast(c.name + " is back to a blank board.");
  });
  document.getElementById("resetAll").addEventListener("click", function(){
    if(!window.confirm("Reset every chart? This clears the reveals and the class contributions on all of them. Save class work first if you want to keep them.")) return;
    S.charts = {}; S.counselor = {name:"", contact:""};
    save(); open(false); go(current);
    toast("Every board is clean.");
  });
})();
/* Synchronous — iOS only allows printing inside the user-gesture chain. */
document.getElementById("printBtn").addEventListener("click", function(){ window.print(); });

document.getElementById("exportBtn").addEventListener("click", function(){
  var payload = JSON.stringify({ format:"aog-anchor-charts", version:1, charts:S.charts, counselor:S.counselor }, null, 2);
  var blob = new Blob([payload], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = "AoG-Anchor-Charts-class-work.json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  toast("Saved. Load this file on any computer to bring the charts with you.");
});
document.getElementById("importBtn").addEventListener("click", function(){
  document.getElementById("importFile").click();
});
document.getElementById("importFile").addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var d = JSON.parse(r.result);
      if(!d || d.format !== "aog-anchor-charts") throw new Error("not ours");
      S.charts = d.charts || {};
      S.counselor = d.counselor || {name:"",contact:""};
      save(); go(current);
      toast("Loaded. Every chart is back where this class left it.");
    }catch(err){
      toast("That file isn't a saved set of anchor charts.");
    }
    e.target.value = "";
  };
  r.readAsText(f);
});

var tBtn = document.getElementById("themeBtn");
function prefersDark(){ return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }
function isDark(){ var s = document.documentElement.getAttribute("data-theme"); return s ? s === "dark" : prefersDark(); }
function paintTheme(){ tBtn.textContent = isDark() ? "Light" : "Dark"; }
if(S.theme) document.documentElement.setAttribute("data-theme", S.theme);
paintTheme();
tBtn.addEventListener("click", function(){
  S.theme = isDark() ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", S.theme);
  save(); paintTheme();
});
if(window.matchMedia){
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  if(mq.addEventListener) mq.addEventListener("change", paintTheme);
}

document.getElementById("railBtn").addEventListener("click", function(){
  var open = document.body.classList.toggle("rail-open");
  this.setAttribute("aria-expanded", String(open));
});

document.addEventListener("keydown", function(e){
  var t = e.target || {};
  if(t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === "ArrowRight"){ e.preventDefault(); step(1); }
  else if(e.key === "ArrowLeft"){ e.preventDefault(); step(-1); }
  else if(e.key === "r" || e.key === "R"){ var b = document.getElementById("revealBtn"); if(!b.disabled) b.click(); }
});

var hash = (location.hash || "").replace(/^#/,"").trim();
var known = order();
go(known.indexOf(hash) > -1 ? hash : CHARTS[0].id);

if(!hasLS) toast("This computer will not let the board save. Print the chart before you close it.");
})();
</script>

<script>
/* .30gp — Jimmy: the chart page "doesn't haev a back page, it just takes you
   right back to the main page." Same-origin arrival goes BACK to the lesson
   that linked here; a cold open still lands on the site. */
(function(){
  var b = document.getElementById("acBackBtn");
  if(!b) return;
  b.addEventListener("click", function(e){
    var same = false;
    try{ same = document.referrer.indexOf(location.origin) === 0; }catch(err){}
    if(history.length > 1 && same){ e.preventDefault(); history.back(); }
  });
})();
</script>
