     up in advance? Or at least a track list one could gather." Built by _work/crate/make_tracks_page.py;
     edit the lists there and re-run. Song names only; no music is hosted here. -->
<style>
:root{
  --ground:#F5F1E8;         /* chart paper */
  --field:#FFFFFF;          /* the writing surface */
  --field-2:#EFEAE0;
  --ink:#1D2733;
  --ink-soft:#57626F;
  --ink-faint:#5F6B78;
  --navy:#1B3A5F;
  --gold:#B8893A;
  --gold-deep:#7A5C1F;
  --rule:rgba(29,39,51,.16);
  --rule-soft:rgba(29,39,51,.08);
  --lift:0 1px 0 rgba(255,255,255,.7), 0 20px 44px -30px rgba(29,39,51,.55);
  --lift-sm:0 1px 2px rgba(29,39,51,.07), 0 8px 20px -16px rgba(29,39,51,.4);
  --a:#1C5499;              /* per-sheet accent, overridden below */
  --a-wash:rgba(28,84,153,.07);
  --lock:#2E6B4F;
  --lock-wash:rgba(46,107,79,.09);
  --caution:#9A3412;
  --focus:#B8893A;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12161C; --field:#1A2029; --field-2:#222A34;
    --ink:#E9EEF4; --ink-soft:#A3AFBC; --ink-faint:#84909D;
    --navy:#9CC2E8; --gold:#D6A852; --gold-deep:#D6A852;
    --rule:rgba(233,238,244,.18); --rule-soft:rgba(233,238,244,.09);
    --lift:0 1px 0 rgba(233,238,244,.04), 0 24px 54px -32px rgba(0,0,0,.95);
    --lift-sm:0 1px 2px rgba(0,0,0,.5), 0 10px 24px -18px rgba(0,0,0,.9);
    --a:#7FB0E8; --a-wash:rgba(127,176,232,.11);
    --lock:#79C79E; --lock-wash:rgba(121,199,158,.12);
    --caution:#F0A07C;
    --focus:#D6A852;
  }
}
:root[data-theme="dark"]{
  --ground:#12161C; --field:#1A2029; --field-2:#222A34;
  --ink:#E9EEF4; --ink-soft:#A3AFBC; --ink-faint:#84909D;
  --navy:#9CC2E8; --gold:#D6A852; --gold-deep:#D6A852;
  --rule:rgba(233,238,244,.18); --rule-soft:rgba(233,238,244,.09);
  --lift:0 1px 0 rgba(233,238,244,.04), 0 24px 54px -32px rgba(0,0,0,.95);
  --lift-sm:0 1px 2px rgba(0,0,0,.5), 0 10px 24px -18px rgba(0,0,0,.9);
  --a:#7FB0E8; --a-wash:rgba(127,176,232,.11);
  --lock:#79C79E; --lock-wash:rgba(121,199,158,.12);
  --caution:#F0A07C;
  --focus:#D6A852;
}


*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{margin:0;text-wrap:balance;font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;font-weight:600}
p{margin:0}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:64rem;margin:0 auto;padding:0 16px}
.ws-mast{padding-top:26px;padding-bottom:6px}
.ws-mast .k{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep)}
.ws-mast h1{font-size:clamp(26px,4.6vw,38px);line-height:1.08;letter-spacing:-.02em;margin:8px 0 6px}
.ws-mast .cdeck{color:var(--ink-soft);max-width:60ch}
.ws-mast .hubline{margin:8px 0 0;font-size:.95rem}
.ws-mast .hubline a{font-weight:700;color:var(--navy)}
.linkbtn{font:inherit;font-weight:700;background:none;border:0;padding:0;min-height:44px;color:var(--navy);text-decoration:underline;cursor:pointer}
.note{margin:18px 0 8px;padding:14px 16px;border:2px solid var(--lock);border-radius:16px;background:var(--lock-wash)}
.note h2{font-size:1.2rem;margin-bottom:4px}
.note p+p{margin-top:6px}
.small,.secline{font-size:.92rem;color:var(--ink-soft)}
.sec{font-size:1.45rem;margin:28px 0 6px}
.secline{margin:0 0 10px}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,19rem),1fr))}
.card{background:var(--field);color:var(--ink);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;box-shadow:var(--lift-sm);break-inside:avoid;page-break-inside:avoid}
.card h3{font-size:1.1rem;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 a{color:var(--navy)}
.card .num{flex:none;display:inline-grid;place-items:center;min-width:1.8em;height:1.8em;border-radius:99px;background:var(--navy);color:var(--field);font-size:.85rem;font-family:inherit}
.card .tag{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-deep);border:1.5px solid var(--gold);border-radius:99px;padding:1px 8px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.card p{margin-top:6px;font-size:.96rem}
.card .st{color:var(--ink-soft);font-size:.9rem}
.picks{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}
.picks li{border-top:1px solid var(--rule-soft);padding-top:8px}
.picks .song{margin:0}
.picks .art{color:var(--ink-soft)}
.picks .bpm{white-space:nowrap;font-size:.85rem;font-weight:700;color:var(--gold-deep)}
.picks .why{margin-top:2px;font-size:.9rem;color:var(--ink-soft)}
.card .go a{font-weight:700;display:inline-block;min-height:44px;padding-top:10px}
.check{margin:0;padding:14px 16px 14px 2.2em;display:grid;gap:8px}
.foot{border-top:1px solid var(--rule-soft);margin-top:32px;padding-top:22px;padding-bottom:46px;color:var(--ink-faint);font-size:12.5px}
.foot b{color:var(--ink-soft)}
.foot a{color:inherit}
@media print{
  @page{size:Letter;margin:12mm}
  body{background:#fff;color:#000;font-size:10.5pt}
  .no-print,.foot{display:none !important}
  .wrap{max-width:none;padding:0}
  .card,.note{box-shadow:none;border:1px solid #000;background:#fff;color:#000;break-inside:avoid;page-break-inside:avoid}
  .card .num{background:#fff;color:#000;border:1px solid #000}
  .card p,.picks .why,.picks .art,.picks .bpm,.card .st,.small,.secline,.ws-mast .cdeck,.ws-mast .k{color:#000}
  .card h3 a{color:#000;text-decoration:none}
  .card h3 a::after{content:" — " attr(href);font-size:8.5pt;font-weight:400;font-family:sans-serif}
  .cards{grid-template-columns:1fr 1fr;gap:8px}
  .sec{break-after:avoid;page-break-after:avoid}
}
</style>

</head>
