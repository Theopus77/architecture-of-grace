<meta charset="utf-8"><style id="aog-first-paint">/* AOG-ONE-PAINT-V1 (2026-09-27) — the page shows once, fully built. No fade, no motion. */html{background:#F7F2E6}html[data-theme="dark"]{background:#0A1E33}html:not(.aog-ready) body{visibility:hidden;animation:aogOnePaint 0s linear 1.1s forwards}@keyframes aogOnePaint{to{visibility:visible}}@media print{html:not(.aog-ready) body{visibility:visible;animation:none}}</style>

<script>
(function(){var t="light";try{if(localStorage.getItem("aog.theme.lightstart.v1")==="1"&&localStorage.getItem("aog.interior.ws.v1.theme")==="dark")t="dark";}catch(e){}document.documentElement.setAttribute("data-theme",t);if(t==="dark")document.documentElement.classList.add("dark");})();

<title>The Dojo — Architecture of Grace</title>
<!-- AOG-DOJO-V1 (2026-10-12) — Jimmy: "In the martial arts curriculum books, instructions on how to learn moves with this
     engine showing the person the moves!!!" and "I want more realism, not sharp straight lines … Hit the ceiling."
     The Dojo (/dojo): a figure in a gi shows each of the 36 moves step by step, in 3D (three.js from /vendor, the shared
     figure aog-figure3d.js). The moves are keyframes in aog-dojo-moves.js; the page and player are aog-dojo.js; the room
     and the figure's posing (planted feet, knees over toes, falls resting on the mat) are aog-dojo3d.js.
       /dojo#<move-id> opens that move (ids fixed in _work/engine3d/CONTRACT.md); ?side=left mirrors it.
     Calm: nothing moves until Go; Go plays the move once; ◀ ▶ step through it; reduce motion shows each step's pose at
     once. It draws only when a step plays, a finger drags, the size or the theme changes. Check: node tools/check-dojo.js -->
<meta name="description" content="The Dojo: watch martial arts moves step by step in 3D. Stances, footwork, strikes, blocks, kicks, safe falls and moves from many arts. English and Spanish.">
<link rel="canonical" href="https://architectureofgrace.com/dojo">

<style>
:root {
  --bg:#f4f0e6; --card:#fffcf7; --ink:#1a232c; --muted:#5c6670; --line:#ddd8cc;
  --steel:#2f5c6b; --steel-fg:#f4f8f9; --steel-soft:#e3eef2;
  --good:#2c7a4e; --good-fg:#f3faf5; --good-soft:#e3f0e8;
  --warn:#7a4e00; --warn-soft:#f6ecd6;
  --chip:#efebe3; --stage:#e9e1d2;
  /* the 3D room's own colors (read by aog-dojo3d.js) */
  --dj-gi:#f3f0e8; --dj-belt:#2f5c6b; --dj-skin:#b98a66; --dj-hair:#2e2620;
  --dj-floor:#c79d6c; --dj-mat:#5e7f73; --dj-mat2:#a8b9a4; --dj-wall:#efe7d9; --dj-wood:#9a7350; --dj-accent:#8aa596;
  --shadow:0 1px 3px rgb(26 35 44 / .08);
  --sans:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  --display:"Fraunces", Georgia, serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.dark, [data-theme="dark"] {
  --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
  --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
  --good:#6fbf8b; --good-fg:#14181e; --good-soft:#1f3327;
  --warn:#e8c27a; --warn-soft:#332a18;
  --chip:#2a313c; --stage:#1a2029;
  --dj-gi:#e4e0d6; --dj-belt:#7fb4c7; --dj-skin:#b98a66; --dj-hair:#2e2620;
  --dj-floor:#7a5d42; --dj-mat:#3f574f; --dj-mat2:#6d7d6a; --dj-wall:#3a3f49; --dj-wood:#6b5038; --dj-accent:#5e7a6c;
  --shadow:0 1px 3px rgb(0 0 0 / .35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
    --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
    --good:#6fbf8b; --good-fg:#14181e; --good-soft:#1f3327;
    --warn:#e8c27a; --warn-soft:#332a18;
    --chip:#2a313c; --stage:#1a2029;
    --dj-gi:#e4e0d6; --dj-belt:#7fb4c7; --dj-skin:#b98a66; --dj-hair:#2e2620;
    --dj-floor:#7a5d42; --dj-mat:#3f574f; --dj-mat2:#6d7d6a; --dj-wall:#3a3f49; --dj-wood:#6b5038; --dj-accent:#5e7a6c;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.55 var(--sans); overflow-x:hidden; }
h1,h2,h3 { font-family:var(--display); font-weight:600; letter-spacing:-.01em; text-wrap:balance; }
h2 { font-size:1.35rem; margin:.1rem 0 .3rem; }
h3 { font-size:1.05rem; margin:1rem 0 .35rem; }
p, li { text-wrap:pretty; }
a { color:inherit; }
button, select, input { font:inherit; touch-action:manipulation; }
button { cursor:pointer; }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:.75rem; }
.brand { font-weight:700; text-decoration:none; }
.tools { display:flex; gap:.5rem; }
.pill, .btn {
  min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:0 1rem; font-weight:600; font-size:.95rem; display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
}
.btn-steel { background:var(--steel); color:var(--steel-fg); border-color:transparent; }
.btn[disabled] { opacity:.55; cursor:default; }
.btn[aria-pressed="true"] { background:var(--steel-soft); border-color:var(--steel); color:var(--ink); }
.nav { display:flex; gap:4px; }
.muted { color:var(--muted); }
.lead { max-width:66ch; }
.kicker { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); margin:0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* the picker */
.pick { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:.5rem; align-items:end; margin:.8rem 0 0; }
.pick label { display:grid; gap:.2rem; font-weight:700; font-size:.9rem; min-width:0; }
select.sel { width:100%; max-width:100%; min-height:44px; font-size:16px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .6rem; }
.pick .band select.sel { width:auto; min-width:7.5em; }

/* the bench: the stage on the left, the steps on the right; one column on a phone */
.dj-bench { display:grid; gap:1rem; margin-top:.8rem; }
@media (min-width:900px){ .dj-bench { grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); align-items:start; }
  .dj-side { position:sticky; top:.75rem; } }
.dj-side { display:flex; flex-direction:column; gap:.6rem; min-width:0; }
.panel { padding:1rem 1.1rem 1.2rem; min-width:0; }
.panel h2 { margin-top:0; }

/* the 3D stage */
.stage { position:relative; width:100%; aspect-ratio:4/5; max-height:72vh; border-radius:18px; overflow:hidden; border:1px solid var(--line);
  background:var(--stage); touch-action:pan-y; user-select:none; -webkit-user-select:none; }
@media (min-width:600px){ .stage { aspect-ratio:4/3; } }
.stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.stage .cap { position:absolute; left:10px; top:8px; right:10px; display:flex; justify-content:space-between; gap:.5rem; pointer-events:none; z-index:2; }
.stage .cap span { font:700 .85rem/1.2 var(--sans); color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:.2rem .6rem; }
.stage .wait { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:1rem; margin:0; color:var(--ink); font-weight:600; z-index:1; }
.stage .wait[hidden] { display:none; }
.stage .wait span { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:.5rem .9rem; }

/* the player: Go, step, slider, speed */
.player { display:flex; flex-wrap:wrap; align-items:center; gap:.45rem; }
.player .btn { padding:0 .9rem; }
.player .grow { flex:1 1 160px; min-width:140px; display:flex; align-items:center; gap:.5rem; }
.player input[type=range] { flex:1; }
.player .time { font:700 .95rem/1 var(--mono); min-width:4.4em; text-align:right; }
input[type=range] { accent-color:var(--steel); min-height:32px; width:100%; }
.views { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.45rem; align-items:end; }
.views label { display:grid; gap:.2rem; font-weight:700; font-size:.85rem; min-width:0; }
.views .btn { width:100%; }

/* the words */
.tag { display:inline-block; border-radius:999px; padding:.15rem .6rem; font:700 .8rem/1.3 var(--sans); background:var(--chip); color:var(--ink); margin:0 .3rem .3rem 0; }
.tsteps { padding-left:0; margin:.4rem 0; list-style:none; counter-reset:st; }
.tsteps li { counter-increment:st; margin:.3rem 0; padding:.45rem .6rem .45rem 2.4rem; border-radius:10px; border-left:4px solid transparent; position:relative; cursor:pointer; }
.tsteps li::before { content:counter(st); position:absolute; left:.55rem; top:.42rem; width:1.5rem; height:1.5rem; border-radius:50%; background:var(--chip); color:var(--ink); font:700 .85rem/1.5rem var(--sans); text-align:center; }
.tsteps li.on { background:var(--steel-soft); border-left-color:var(--steel); color:var(--ink); font-weight:600; }
.tsteps li.on::before { background:var(--steel); color:var(--steel-fg); }
.tips { padding-left:1.2rem; margin:.3rem 0; }
.tips li { margin:.25rem 0; }
.note { border-left:4px solid var(--steel); background:var(--steel-soft); color:var(--ink); padding:.55rem .8rem; border-radius:0 10px 10px 0; margin:.6rem 0; }
.note.warn { border-left-color:var(--warn); background:var(--warn-soft); }
.note p { margin:.2rem 0; }
.prog { display:flex; flex-wrap:wrap; gap:.35rem; }
.prog button { min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .85rem; font-weight:600; font-size:.92rem; }
.prog button[aria-pressed="true"] { background:var(--good); color:var(--good-fg); border-color:transparent; }
a.more { display:inline-flex; align-items:center; min-height:44px; font-weight:700; color:var(--steel); }
.nextup { display:flex; flex-wrap:wrap; gap:.35rem; margin:.3rem 0; }
.nextup button { min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .8rem; font-weight:600; font-size:.9rem; }
i.pg { display:inline-block; width:.8em; height:.8em; border-radius:50%; border:2px solid currentColor; margin-left:.35em; vertical-align:-.05em; box-sizing:border-box; }
i.pg.s1 { background:conic-gradient(currentColor 0 33%, transparent 0); }
i.pg.s2 { background:conic-gradient(currentColor 0 66%, transparent 0); }
i.pg.s3 { background:currentColor; }

footer { margin-top:2rem; font-size:.85rem; color:var(--muted); }
@media (max-width:420px){ .panel { padding:.9rem .85rem 1.1rem; } }
@media print { .no-print { display:none !important; } }
/* the Dojo is a tool page, like the music labs: the reading pages' "My notes" button sat over the player's slider */
.aog-mkbtn, .aog-mktip { display:none !important; }
</style>

<script src="/aog-grace.js" defer></script>
<script src="/aog-dropdowns.js" defer></script>
<script>
(function(){
  function add(src){
    var s=document.createElement("script");
    s.src=src;
    s.onerror=function(){ if(src.indexOf("netlify.app")<0) add("https://architectureofgrace.netlify.app/aog-topbar.js"); };
    document.head.appendChild(s);
  }
  add(new URL("aog-topbar.js", document.baseURI).href);
})();
</script>
<div class="wrap">
  <header class="no-print">
    <a class="brand" href="/dojo" id="brand">The Dojo</a>
    <div class="tools">
      <button type="button" class="pill" id="langBtn">ES</button>
      <button type="button" class="pill" id="themeBtn">Dark</button>
    </div>
  </header>
  <section class="mast" id="toolMast"><p class="kicker" id="mastK"></p><h1 id="mastH"></h1><p class="lead" id="mastL"></p></section>
  <div class="bench-bar">
    <nav class="nav no-print" id="nav" aria-label="The Dojo"></nav>
  </div>
  <div class="pick no-print">
    <label for="movePick"><span id="pickLab">Move</span><select class="sel" id="movePick"></select></label>
    <label class="band" for="bandPick"><span id="bandLab">Grades</span><select class="sel" id="bandPick"></select></label>
  </div>
  <main class="dj-bench" id="bench">
    <div class="dj-side">
      <div class="stage" id="stage" role="img" aria-describedby="stageDesc">
        <div class="cap"><span id="capStep"></span><span id="capSide" hidden></span></div>
        <p class="wait" id="wait"><span id="waitTxt">Getting the dojo ready…</span></p>
      </div>
      <div class="player no-print" id="player">
        <button type="button" class="btn btn-steel" id="goBtn">Go</button>
        <button type="button" class="btn" id="backBtn" aria-label="Step back">◀</button>
        <button type="button" class="btn" id="fwdBtn" aria-label="Next step">▶</button>
        <span class="grow"><input type="range" id="scrub" min="0" max="100" step="1" value="0" aria-label="Move through time"><span class="time" id="tRead">0.0 s</span></span>
      </div>
      <div class="views no-print">
        <label for="speedPick"><span id="speedLab">Speed</span><select class="sel" id="speedPick"></select></label>
        <label for="viewPick"><span id="viewLab">View</span><select class="sel" id="viewPick"></select></label>
        <button type="button" class="btn" id="mirrorBtn" aria-pressed="false">Mirror</button>
        <button type="button" class="btn" id="ghostBtn" aria-pressed="false">Ghost</button>
      </div>
      <p class="sr" id="stageDesc" aria-live="polite"></p>
    </div>
    <section class="panel card" id="panel"></section>
  </main>
  <footer><p id="foot"></p></footer>
</div>
<script src="/aog-dojo-moves.js"></script>
<script src="/aog-dojo.js"></script>
</body>
