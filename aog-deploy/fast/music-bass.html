/* ══ AOG-FINISH-STRINGS-V1 (Jimmy, 2026-10-09: "1, 3, 2, 4" — 2: each instrument its own finish). The neck as a made thing:
   a rosewood board, rounded toward its edges, with a cream binding; nickel frets that catch the light; mother-of-pearl dots;
   a bone nut; the wound strings coiled, the plain ones bright, all of them standing a little above the wood. ══ */
.neck .nk-wood{fill:url(#aogRose);stroke:#d9ccb0;stroke-width:1.2}
.neck .nk-fret{stroke:#dfe3e8;stroke-width:2.6;filter:drop-shadow(1.2px 0 0 rgba(0,0,0,.55))}
.neck .nk-inlay{fill:url(#aogPearl);opacity:.92}
#playView .neck .nk-fl{fill:url(#aogPearl);opacity:.9}
.neck .nk-nut{fill:url(#aogBone)}
.neck .nk-str{stroke:url(#aogWound);filter:drop-shadow(0 1.6px .8px rgba(0,0,0,.7))}   /* the coil is a pattern on a solid string, so the whole string takes a tap */
.neck .nk-str.plain{stroke:#eef0f2}
.neck .nk-str.pick{stroke:#ffd36b;stroke-dasharray:none;filter:drop-shadow(0 0 3px rgba(255,211,107,.9))}
.neck .nk-name.pick{fill:#ffd36b}

<!-- AOG-FINISH-STRINGS-V1: the neck's materials -->
<svg width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="aogRose" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1e0f07"/><stop offset=".08" stop-color="#3a1f0f"/><stop offset=".19" stop-color="#4a2a15"/><stop offset=".27" stop-color="#3b2010"/>
    <stop offset=".38" stop-color="#55311a"/><stop offset=".47" stop-color="#4a2a15"/><stop offset=".55" stop-color="#5a341c"/><stop offset=".63" stop-color="#432512"/>
    <stop offset=".74" stop-color="#4e2c16"/><stop offset=".86" stop-color="#36200f"/><stop offset=".94" stop-color="#2a170a"/><stop offset="1" stop-color="#1a0d06"/></linearGradient>
  <radialGradient id="aogPearl" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#f3eee6"/><stop offset=".6" stop-color="#dfe9ea"/><stop offset=".8" stop-color="#e6dcef"/><stop offset="1" stop-color="#c9c2b4"/></radialGradient>
  <pattern id="aogWound" patternUnits="userSpaceOnUse" width="2.2" height="2.2"><rect width="2.2" height="2.2" fill="#c9a061"/><rect width=".8" height="2.2" fill="#6e5026" opacity=".6"/></pattern>
  <linearGradient id="aogBone" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d9cfb6"/><stop offset=".45" stop-color="#f6efdc"/><stop offset="1" stop-color="#cfc3a6"/></linearGradient>
</defs></svg>
