<!-- AOG-BEATLAB-NAME-V1 (2026-10-05) — Jimmy: "I don't like the name the pad machine". It is The Beat Lab (El laboratorio de
     ritmos), at /beat-lab; /pads and /pad-machine still open it. The file keeps its name.
     AOG-DRUM-MACHINE-V2 (2026-10-05) — Jimmy: "The drum machine should be retired not deleted, and the beat pad should take
     over this name." It is The Drum Machine (La caja de ritmos), at /drum-machine; /beat-lab still opens it. The first drum
     machine (music-drums.html) is retired (2026-10-07): /drums and /classic-drum-machine now open this one.
     AOG-PADS-V1 (2026-10-05) — Jimmy: "A drum pad should be made that incorporates everything in one. This could be the 1%
     drum pad machine that kills it compared to everything else out there. Everything is basically built."
     The Beat Lab, /pads: sixteen pads, four banks (A to D), and every sound the site already has.
     · Each bank has one job (AOG-PADS-KINDS-V1): A Drums (two recorded kits, eight pads each, aog-drumkit.js), C Notes (any recorded
       instrument from the piano, the guitar, the bass and the band, in a key and a scale), B Chords (the key's chords
       and their sevenths on that instrument), D Chops (a record from the turntables' crate, or a take waiting at
       the Mixing Desk, cut into sixteen beats).
     · Near the middle of a pad plays louder, near the edge softer (a drum plays its soft, normal or hard recording).
       Notes and chords ring while the pad is held. A closed hi-hat stops the open one; a new chop stops the last.
     · The loop: 1, 2, 4, 8 or 16 bars (AOG-PADS-16BARS-V1), a tempo, swing, and "line up to" (quantize). Record plays what you tap back on the
       next time round, on every bank at once. Repeat plays a held pad in time. Undo takes back the last change.
       The steps show the picked pad's hits; tap a step to add or take one away.
     · Each pad has its own volume, pitch and left/right. Everything stays on this device (aog.pads.v1).
     · ● Record keeps a take (aog-recorder.js) to save as .wav or send to the Mixing Desk or the turntables.
     · AOG-PADS-BOUNCE-V1: Make the loop into a file plays the loop offline and keeps one exact, seamless pass, to save
       as .wav or send to the Mixing Desk (with its exact length, so it starts on the bar) or the turntables.
     · Calm: nothing sounds until a pad is touched, the loop plays only after Play, the click is off until it is
       turned on, and the loop stops when the page is hidden. Keys: Z X C V, A S D F, Q W E R, 1 2 3 4; space plays. -->

          <p class="pm-line" id="inLine" aria-live="polite"></p>
          <p class="pm-line" id="midiLine" aria-live="polite"></p><!-- AOG-MIDI-V1: the MIDI pads' or keyboard's one-line answer -->
          <div class="pm-bigrow"><button type="button" class="pm-b" id="bigBtn"></button></div><!-- AOG-PADS-BIG-V1 -->
          <div class="pads" id="pads" role="group"></div>
          <div id="pedalsNear" hidden></div><!-- AOG-ROOM-PEDALS-V1: the effects that are on, with their knobs, and the menu of the rest, under the pads (aog-amp.js) -->
        </div>
        <div>
          <div class="pm-row">
            <label class="pm-f tempo"><span id="tempoLab"></span>
              <span class="pm-tempo"><button type="button" class="pm-b" id="tDown" aria-label="−1">−</button><input class="pm-num" id="tempo" type="number" inputmode="numeric" min="60" max="180" step="1"><button type="button" class="pm-b" id="tUp" aria-label="+1">+</button></span></label>
            <label class="pm-f"><span id="barsLab"></span><select class="pm-sel" id="barsSel"></select></label>
          </div>
          <div class="pm-row" style="margin-top:8px">
            <label class="pm-f"><span id="qLab"></span><select class="pm-sel" id="qSel"></select></label>
            <label class="pm-f"><span id="swLab"></span><select class="pm-sel" id="swSel"></select></label>
          </div>
          <div class="pm-row" style="margin-top:8px">
            <button type="button" class="pm-b" id="rptBtn" aria-pressed="false"></button>
            <label class="pm-f"><span id="rateLab"></span><select class="pm-sel" id="rateSel"></select></label>
            <button type="button" class="pm-b" id="clickBtn" aria-pressed="false"></button>
            <button type="button" class="pm-b" id="fullBtn" aria-pressed="false"></button>
            <button type="button" class="pm-b" id="midiBtn" hidden></button><!-- AOG-MIDI-V1 -->
          </div>
          <!-- AOG-PADS-TRANSPORT-HERE-V1 (Jimmy, 2026-10-11: "The stop / Recording / undo need to sit above the beat bank a"):
               Play, Record the loop, Undo and Clear sit right above the beat and its steps, where the loop is made -->
          <div class="pm-row pm-transport">
            <button type="button" class="pm-b" id="playBtn" aria-pressed="false"></button>
            <button type="button" class="pm-b rec" id="loopRec" aria-pressed="false"></button>
            <button type="button" class="pm-b" id="undoBtn"></button>
            <button type="button" class="pm-b" id="clearBtn"></button>
          </div>
          <div class="pm-beat"><!-- AOG-PADS-BEATPICK-V1: a style, then its beats; ◀ ▶ step through every beat -->
            <p class="pm-h" id="startLab"></p>
            <div class="pm-beatrow">
              <button type="button" class="pm-b pm-step" id="beatPrev"></button>
              <label class="pm-f"><span class="sr" id="grpLab"></span><select class="pm-sel" id="grpSel"></select></label>
              <label class="pm-f"><span class="sr" id="beatLab"></span><select class="pm-sel" id="startSel"></select></label>
              <button type="button" class="pm-b pm-step" id="beatNext"></button>
            </div>
            <p class="pm-now" id="beatNow" aria-live="polite"></p>
          </div>
          <div class="pm-sec stepsec">
            <p class="pm-h" id="stepsH"></p>
            <div class="pm-barnav" id="barNav" hidden></div><!-- AOG-PADS-16BARS-V1: four bars at a time -->
            <div class="steps" id="steps" role="group"></div>
            <div class="pm-bartools" id="barTools" hidden><button type="button" class="pm-b" id="barCopy"></button><button type="button" class="pm-b" id="barClear"></button></div>
          </div>
          <details class="pm-set pm-sec" id="padSet">
            <summary id="padSetSum"></summary>
            <div class="pm-row">
              <label class="pm-f"><span><span id="volLab"></span> · <span class="pm-val" id="volVal"></span></span><input class="pm-range" id="vol" type="range" min="0" max="150" step="5"></label>
              <label class="pm-f"><span><span id="tuneLab"></span> · <span class="pm-val" id="tuneVal"></span></span><input class="pm-range" id="tune" type="range" min="-12" max="12" step="1"></label>
              <label class="pm-f"><span><span id="panLab"></span> · <span class="pm-val" id="panVal"></span></span><input class="pm-range" id="pan" type="range" min="-100" max="100" step="10"></label>
            </div>
            <div class="pm-row" style="margin-top:8px">
              <label class="pm-f"><span><span id="nudgeLab"></span> · <span class="pm-val" id="nudgeVal"></span></span><input class="pm-range" id="nudge" type="range" min="-20" max="20" step="5"></label>
              <label class="pm-f"><span id="cutLab"></span><select class="pm-sel" id="cutSel"></select></label>
            </div>
            <div class="pm-row" style="margin-top:8px">
              <button type="button" class="pm-b" id="padReset"></button>
              <button type="button" class="pm-b" id="padClear"></button>
            </div>
          </details>
        </div>
      </div>
      <div class="pm-sec pm-fx" id="ampBlk"><!-- AOG-ROOM-PEDALS-V1: every effect and the EQ (aog-amp.js draws them) -->
        <h2 class="pm-h" id="fxH"></h2>
        <p class="pm-line" id="fxLine"></p>
        <div id="ampBox"></div>
      </div>
    </div>
    <section id="lessons" aria-label="Lessons"></section><!-- AOG-LESSONS-V1: the Beat Lab's lessons (aog-lessons.js) -->
    <div class="pm-rec">
      <div class="aogrec-row"><button type="button" class="pm-b" id="bounceBtn"></button></div>
      <p class="aogrec-line" id="bounceLine" aria-live="polite"></p>
      <div class="aogrec-row" id="bounceAct" hidden><button type="button" class="pm-b" id="bSave"></button><button type="button" class="pm-b" id="bStudio"></button><button type="button" class="pm-b" id="bDecks"></button></div>
      <div class="aogrec-row" id="loopFile"><button type="button" class="pm-b" id="lfSave"></button><button type="button" class="pm-b" id="lfDecks"></button></div><!-- AOG-PADS-LOOP-ADD-V1: in the Studio, under More -->
      <div class="aogrec-row pm-sec" id="takeRow"><button type="button" class="kp-b" id="takeBtn" aria-pressed="false"></button><span id="takeTime" hidden>0:00</span></div>
      <p class="aogrec-line" id="takeLine" aria-live="polite"></p>
      <div id="takeList"></div>
    </div>
  </main>
  <footer class="foot" id="foot"></footer>
</div>
<div id="padView" role="region"><!-- AOG-PADS-BIG-V1: the 24 pads on the whole screen; #pads moves in while it is open -->
  <div class="pv-bar">
    <button type="button" class="pm-b" id="pvClose"></button>
    <select class="pm-sel" id="pvBank"></select>
    <button type="button" class="pm-b" id="pvStage" aria-pressed="false"></button><!-- AOG-PADS-STAGE-V1 -->
    <button type="button" class="pm-b" id="pvKnobs" aria-pressed="true"></button><!-- AOG-PADS-KNOBS-V1: the knobs come along -->
    <span class="pv-sp"></span>
    <button type="button" class="pm-b pv-st" id="pvStop"></button>
    <button type="button" class="pm-b pv-st" id="pvLock" aria-pressed="false"></button>
    <button type="button" class="pm-b" id="pvPlay" aria-pressed="false"></button>
    <button type="button" class="pm-b rec" id="pvRec" aria-pressed="false"></button>
  </div>
  <div class="pv-stage" id="pvStageRow"><div class="pv-banks" id="pvBanks"></div><div class="pv-scenes" id="pvScenes"></div></div>
  <div class="pv-grids" id="pvGrid"></div>
</div>
<script src="/front/36f9be018462.js"></script>
</body>
</html>
