<title>The Sewing Room — Architecture of Grace</title>
<!-- AOG-SEWING-ROOM-V1 (2026-10-12) — Jimmy: "Could we not take this amazement to FACS for cooking and sewing lessons?
     Have this person cook recipes … and demonstration on how to sew etc." and "I want more realism, not sharp straight lines."
     The Sewing Room (/sewing-lab, also /sewing): a person (the shared figure, outfit "plain", no face) shows every sewing
     move step by step in 3D. Hand stitches with a real thread that follows the needle through two layers of cloth and
     stays in it stitch by stitch; pinning, marking and cutting a pattern; a sewing machine (parts tour, winding a bobbin,
     threading, straight seam, backstitch, pivot, seam allowance) and pressing a seam.
       aog-sewing-moves.js  the words: 20 moves (ids fixed in _work/engine3d/CONTRACT.md), steps, safety, tools, EN/ES
       aog-sewing.js        the engine (each step owns a stretch of time; sample(t) rebuilds the scene) and the page
       aog-sewing3d.js      the room in three.js (/vendor), loaded right after the words show
     /sewing-lab#<move-id> opens that move. Calm: nothing moves until Go; Go plays once; ◀ ▶ play one step; reduce
     motion shows each step's end at once. It draws only when a step plays, a finger drags, the size or the theme
     changes. Check: node tools/check-sewing.js -->

<style>
:root {
  --bg:#f4f0e6; --card:#fffcf7; --ink:#1a232c; --muted:#5c6670; --line:#ddd8cc;
  --steel:#2f5c6b; --steel-fg:#f4f8f9; --steel-soft:#e3eef2;
  --good:#2c7a4e; --good-fg:#f3faf5; --good-soft:#e3f0e8;
  --warn:#7a4e00; --warn-soft:#f6ecd6;
  --chip:#efebe3; --stage:#efe9de;
  /* the finished-stitch drawings */
  --th-top:#b3263a; --th-bob:#2b55a8; --rs-cloth:#e6dcc6; --rs-cloth2:#cfdccd; --rs-edge:#8a7d64; --rs-btn:#f8f4ec;
  --shadow:0 1px 3px rgb(26 35 44 / .08);
  --sans:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  --display:"Fraunces", Georgia, serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.dark, [data-theme="dark"] {
  --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
  --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
  --good:#6fbf8b; --good-fg:#14181e; --good-soft:#1f3327;
  --warn:#e8c27a; --warn-soft:#332a18;
  --chip:#2a313c; --stage:#151b26;
  --th-top:#e0485c; --th-bob:#6f9be8; --rs-cloth:#3a3730; --rs-cloth2:#2f3a33; --rs-edge:#a89c84; --rs-btn:#d9d4c8;
  --shadow:0 1px 3px rgb(0 0 0 / .35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
    --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
    --good:#6fbf8b; --good-fg:#14181e; --good-soft:#1f3327;
    --warn:#e8c27a; --warn-soft:#332a18;
    --chip:#2a313c; --stage:#151b26;
    --th-top:#e0485c; --th-bob:#6f9be8; --rs-cloth:#3a3730; --rs-cloth2:#2f3a33; --rs-edge:#a89c84; --rs-btn:#d9d4c8;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.55 var(--sans); overflow-x:hidden; }
h1,h2,h3 { font-family:var(--display); font-weight:600; letter-spacing:-.01em; text-wrap:balance; }
h2 { font-size:1.35rem; margin:.1rem 0 .3rem; }
h3 { font-size:1.05rem; margin:1rem 0 .35rem; }
p, li { text-wrap:pretty; }
a { color:inherit; }
button, select, input { font:inherit; touch-action:manipulation; }
button { cursor:pointer; }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:.75rem; }
.brand { font-weight:700; text-decoration:none; }
.tools { display:flex; gap:.5rem; }
.pill, .btn {
  min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:0 1rem; font-weight:600; font-size:.95rem; display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
}
.btn-steel { background:var(--steel); color:var(--steel-fg); border-color:transparent; }
.btn[disabled] { opacity:.55; cursor:default; }
.btn[aria-pressed="true"] { background:var(--steel-soft); border-color:var(--steel); color:var(--ink); }
.btn[hidden] { display:none; }
.nav { display:flex; gap:4px; }
.muted { color:var(--muted); }
.small { font-size:.88rem; }
.lead { max-width:66ch; }
.kicker { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); margin:0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* the move picker */
.pick { display:grid; grid-template-columns:minmax(0,1fr); gap:.5rem; margin:.8rem 0 0; }
.pick label { display:grid; gap:.2rem; font-weight:700; font-size:.9rem; min-width:0; }
select.sel { width:100%; max-width:100%; min-height:44px; font-size:16px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .6rem; }

/* the bench: the room on the left, the steps on the right; one column on a phone */
.sw-bench { display:grid; gap:1rem; margin-top:.8rem; }
@media (min-width:900px){ .sw-bench { grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); align-items:start; }
  .sw-side { position:sticky; top:.75rem; } }
.sw-side { display:flex; flex-direction:column; gap:.6rem; min-width:0; }
.panel { padding:1rem 1.1rem 1.2rem; min-width:0; }
.panel h2 { margin-top:0; }

/* the 3D room */
.stage { position:relative; width:100%; aspect-ratio:4/4.4; max-height:70vh; border-radius:18px; overflow:hidden; border:1px solid var(--line);
  background:var(--stage); touch-action:pan-y; user-select:none; -webkit-user-select:none; }
@media (min-width:600px){ .stage { aspect-ratio:4/3; } }
.stage canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.stage .cap { position:absolute; left:10px; top:8px; right:10px; pointer-events:none; z-index:2; display:flex; }
.stage .cap .capbox { font:700 .85rem/1.25 var(--sans); color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:.25rem .6rem; max-width:100%; }
.stage .cap #stepNow { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.stage .wait { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:1rem; margin:0; z-index:1; }
.stage .wait[hidden] { display:none; }
.stage .wait span { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:.5rem .9rem; font-weight:600; }

/* the player: Go, ◀ ▶, slider */
.player { display:flex; flex-wrap:wrap; align-items:center; gap:.45rem; }
.player .btn { padding:0 .9rem; }
.player #goBtn { min-width:6.2em; }
.player .grow { flex:1 1 160px; min-width:140px; display:flex; align-items:center; }
input[type=range] { accent-color:var(--steel); min-height:32px; width:100%; }
.views { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.45rem; align-items:end; }
.views label { display:grid; gap:.2rem; font-weight:700; font-size:.85rem; min-width:0; }
.views .btn { width:100%; }
@media (max-width:520px){ .views label[for="camSel"] { grid-column:1 / -1; } }   /* the camera names are long: a full row on a phone */

/* the steps and the words */
.say { margin:.3rem 0 .4rem; }
.steps { padding-left:0; margin:.4rem 0; list-style:none; counter-reset:st; }
.steps li { counter-increment:st; margin:.25rem 0; position:relative; }
.steps .stepbtn { display:block; width:100%; text-align:left; min-height:44px; padding:.45rem .6rem .45rem 2.5rem; border-radius:10px; border:0; border-left:4px solid transparent;
  background:transparent; color:var(--ink); font:inherit; font-size:1rem; line-height:1.4; }
.steps li::before { content:counter(st); position:absolute; left:.6rem; top:.55rem; width:1.5rem; height:1.5rem; border-radius:50%; background:var(--chip); color:var(--ink);
  font:700 .85rem/1.5rem var(--sans); text-align:center; pointer-events:none; }
.steps li.on .stepbtn { background:var(--steel-soft); border-left-color:var(--steel); color:var(--ink); font-weight:600; }
.steps li.on::before { background:var(--steel); color:var(--steel-fg); }
.note { border-left:4px solid var(--steel); background:var(--steel-soft); color:var(--ink); padding:.55rem .8rem; border-radius:0 10px 10px 0; margin:.6rem 0; }
.note.good { border-left-color:var(--good); background:var(--good-soft); }
.note.warn { border-left-color:var(--warn); background:var(--warn-soft); }
.note b { display:block; margin-bottom:.15rem; }
.note .sl { display:block; margin:.15rem 0; }
.tools-need { margin:.5rem 0; }

/* the finished stitches, front and back */
.result h3 { margin-top:1rem; }
.rsrow { display:grid; grid-template-columns:minmax(0,1fr); gap:.5rem; }
@media (min-width:520px){ .rsrow { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.rs { margin:0; }
.rs figcaption { font-weight:700; font-size:.85rem; color:var(--muted); margin-bottom:.15rem; }
.rs svg { display:block; width:100%; height:auto; }
.rs .cloth { fill:var(--rs-cloth); }
.rs .cloth2 { fill:var(--rs-cloth2); }
.rs .th { stroke:var(--th-top); stroke-width:2.6; stroke-linecap:round; fill:none; }
.rs .edge { stroke:var(--rs-edge); stroke-width:1.5; stroke-dasharray:4 3; }
.rs .btn4 { fill:var(--rs-btn); stroke:var(--rs-edge); stroke-width:1; }

/* my practice */
.track h3 { margin-top:1.1rem; }
.seg { display:flex; flex-wrap:wrap; gap:.35rem; }
.seg button { min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .85rem; font-weight:600; font-size:.92rem; }
.seg button[aria-pressed="true"] { background:var(--good); color:var(--good-fg); border-color:transparent; }

footer { margin-top:2rem; font-size:.85rem; color:var(--muted); }
@media (max-width:420px){ .panel { padding:.9rem .85rem 1.1rem; } }
@media print { .no-print { display:none !important; } }
/* the Sewing Room is a tool page, like the Dojo: the reading pages' "My notes" button sat over the player */
.aog-mkbtn, .aog-mktip { display:none !important; }
</style>

<div class="wrap">
  <header class="no-print">
    <a class="brand" href="/sewing-lab" id="brand">The Sewing Room</a>
    <div class="tools">
      <button type="button" class="pill" id="langBtn">ES</button>
      <button type="button" class="pill" id="themeBtn">Dark</button>

        <button type="button" class="btn" id="backBtn" aria-pressed="false">Show the back of the fabric</button>

      <p class="sr" id="stageDesc" aria-live="polite"></p>
    </div>
    <section class="panel card" id="panel"></section>
  </main>
  <footer><p id="foot"></p></footer>
</div>
<script src="/aog-sewing-moves.js"></script>
<script src="/aog-sewing.js"></script>
