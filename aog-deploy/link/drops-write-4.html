<!-- ═══ A FRONT DOOR, NOT A PAGE ═══ build .30m1 ═══════════════════════════
     Written by _work/aog_drops_doors.py — do not hand-edit; edit the script.

     This file exists for one reason: a link scraper reads the <head> of the
     URL it is given and runs no JavaScript, so /drops could only ever show
     ONE card no matter which subject or grade the link named. This document
     carries Writing · Grade 4's own card and then hands the reader
     straight on to the sheet with the whole query string intact.

     ⚠ NO <meta http-equiv="refresh">. Some scrapers follow one and would end
     up reading daily-drops.html's card instead of this one. The forward is
     script only, with a real link underneath it for anyone without script.
     ⚠ IT FORWARDS TO /daily-drops.html, NEVER TO /drops — /drops is rewritten
     back to this file, and forwarding there would loop forever.
     ⚠ THE IMAGE URL CARRIES ?v=. Apple, Google, Slack and Facebook cache an
     og image BY URL for weeks. Change the picture, bump the v, or nothing
     you do will show up in a new message.
     ══════════════════════════════════════════════════════════════════════ -->

<style>
  html,body{margin:0;height:100%}
  body{background:#F5F1E8;color:#1D2733;display:grid;place-items:center;
    font:400 17px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

  .k{max-width:26rem}
  .m{font:600 13px/1 -apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.14em;
    text-transform:uppercase;color:#7A5C1F;margin-bottom:14px}
  .l{font-size:19px;font-weight:400;margin:0 0 6px}
  .h{color:#57626F;font-size:15px;margin:0 0 22px}
  a.go{display:inline-block;background:#1B3A5F;color:#fff;text-decoration:none;
    padding:12px 22px;border-radius:10px;font-weight:600;min-height:44px;
    box-sizing:border-box}
  @media (prefers-color-scheme:dark){
    body{background:#141821;color:#E9E5DC} .h{color:#9AA6B4} .m{color:#B8893A}
  }

<body>
<div class="k">
  <div class="m">Daily Drafts</div>
  <h1 class="l" id="lead">Opening Writing · Grade 4…</h1>
  <p class="h" id="hint">If nothing happens in a moment, use the button.</p>
  <a class='go' href='/daily-drops?subject=write&amp;grade=4' id='go'>Continue</a>
</div>
<script>
(function () {
  /* ⚠ THE CARD CANNOT BE TRANSLATED AND THIS SCREEN CAN. A scraper fetches one
     URL and gets one head, so og:title and og:description are English for
     everyone — the same constraint that made this file necessary at all. The
     one thing a Spanish-speaking reader actually sees is this screen. */
  try {
    if ((new URLSearchParams(location.search).get("lang") || "").toLowerCase() === "es") {
      document.documentElement.lang = "es";
      var L = document.getElementById("lead"), H = document.getElementById("hint"),
          G = document.getElementById("go");
      if (L) L.textContent = "Abriendo Escritura · Grado 4…";
      if (H) H.textContent = "Si no pasa nada en un momento, usa el botón.";
      if (G) G.textContent = "Continuar";
    }
  } catch (e) {}

  /* ⚠ THE LINK'S OWN PARAMS WIN. On the query route the address bar still
     holds the reader's real query — sheet, lang, key, lock, classset, dest —
     because the rewrite is a 200 and the browser never navigated. On the
     /drops/write/4 path route there is no query at all, and this
     door's own subject and grade are what fill it in. Never overwrite what
     the reader arrived with. */
  var q;
  try { q = new URLSearchParams(location.search); } catch (e) { return; }
  if (!q.has("subject")) q.set("subject", "write");
  if (!q.has("grade")) q.set("grade", "4");
  var s = q.toString();
  var to = "/daily-drops.html" + (s ? "?" + s : "") + (location.hash || "");
  var a = document.getElementById("go"); if (a) a.href = to;
  try { location.replace(to); } catch (e) { location.href = to; }
})();
</script>
</body>
