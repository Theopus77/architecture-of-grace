<style>
:root{

}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:clip;overscroll-behavior:none}

.wrap{max-width:1100px;margin:0 auto}

/* ══ the instrument: the piano's dark panel ══ */

.field.small{flex:0 1 auto}
.rig select{min-height:48px;width:100%;max-width:100%;font:600 16px/1.25 var(--sans);color:#0A1E33;background-color:#FFFDF8;
  border:1.5px solid #C9A24A;border-radius:12px;padding:8px 38px 8px 14px;-webkit-appearance:none;appearance:none;cursor:pointer;

  background-repeat:no-repeat;background-position:right 12px center;background-size:16px}

/* chord pads: one tap, one chord */
.pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.55rem;margin:.2rem 0 .2rem}
@media (min-width:700px){ .pads{grid-template-columns:repeat(6,minmax(0,1fr))} }

/* the chord wheel (circle of fifths), as on the piano (AOG-PIANO-WHEEL-V1/V2) */
.wheel-wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
#rig svg.wheel{display:block;width:100%;max-width:420px;height:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.wheel-side{flex:1 1 230px;min-width:0}

.wheel .wd text{font-family:var(--display);font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.wheel .wd.o path{fill:#2a2e35} .wheel .wd.i path{fill:#202328}

.wheel .home{fill:none;stroke:#e0a640;stroke-width:6;pointer-events:none}
.wheel .hub{fill:#15171b;stroke:#e0a640;stroke-width:3}
.wheel .hub-k{font-family:var(--display);font-weight:800;fill:#f4ecd8;text-anchor:middle;dominant-baseline:central}
.wheel .hub-m{font-family:var(--sans);font-weight:700;fill:#d9cdb2;text-anchor:middle;dominant-baseline:central}
.prog{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0 0;min-height:44px;align-items:center}

  display:inline-flex;align-items:center;justify-content:center;font:800 1.05rem/1 var(--display);padding:0 .65rem}
.slot.now{background:#f0c26e;color:#2a1a08;border-color:#f0c26e}
/* AOG-NECK-PATTERN-V1: the pattern by the neck, each chord with its number up the scale */
.nk-pat{margin-top:.7rem} .nk-prog{margin-top:.55rem} .nk-theory{margin:.5rem 0 .8rem}
.nk-prog .slot{flex-direction:column;gap:.15rem;padding:.3rem .7rem;min-width:3.8rem}
.nk-prog .slot small{font:700 .8rem/1 var(--body,inherit);opacity:.85}
.tempo{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}

.tempo b,.dial b{font:800 .9rem/1 var(--sans);color:#ffd9a8}

/* ══ AOG-STRINGS-V1 — the neck: frets and strings, as a guitar looks to the person playing it: the thick low string on top,
   so a finger moving down strums low to high, as a down strum does; the nut and the open strings on the left; on the
   guitar, a strip on the right to strum across.
   Pale = the chord (on the guitar, where fingers go; × = skip that string), orange = playing now, gold = your finger. ══ */
.krow{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .7rem;margin:0 0 .6rem}
.krow .range{font:800 1rem/1 var(--display);color:#f1ebdf;min-width:7.5rem;text-align:center}
.neckbox{position:relative}
#rig svg.neck{display:block;width:100%;height:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.neck .nk-open{fill:#1b1c20}
.neck .nk-wood{fill:#3a2414}
.neck .nk-fret{stroke:#b9bec5;stroke-width:2.5}
.neck .nk-nut{fill:#ece3cc}
.neck .nk-inlay{fill:#d9cfb8;opacity:.5}
.neck .nk-strum{fill:#0f1012;stroke:#8a6a2a;stroke-width:1.5}
.neck .nk-str{stroke:#c9a56c}
.neck .nk-str.plain{stroke:#dedede}
.neck text{font-family:var(--sans);font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.neck .nk-name{fill:#f1e9d6}
.neck .nk-x{fill:#ffb1a4}
.neck .nk-num{fill:#d8cfbf;font-weight:700}
.neck .nk-strumlab{fill:#ffd9a8;letter-spacing:.06em}
.neck .dot{display:none}
.neck .dot.fit,.neck .dot.now,.neck .dot.down{display:inline}
.neck .dot circle{fill:#f8eed3;stroke:#0c0d10;stroke-width:1.5}
.neck .dot text{fill:#2b2116}
.neck .dot.root circle{stroke:#b4581a;stroke-width:4}
.neck .dot.now circle{fill:#ef9a4a} .neck .dot.now text{fill:#1f1206}
.neck .dot.down circle{fill:#ffd36b} .neck .dot.down text{fill:#1f1206}
.keys-line{display:none}
/* AOG-STRINGS-KEYS-V2: the keys as a picture; each letter on the neck as a small keycap */
.keymap{margin:.6rem 0 0;padding:.6rem .75rem .7rem;border:1px solid #2f3339;border-radius:12px;background:#17191c}
.km-h{margin:0 0 .45rem;font:800 .72rem/1.2 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:#d8cfbf}

  background:linear-gradient(#f6efe0,#e2d6bd);color:#1a1408;font:800 .82rem/1 var(--sans);box-shadow:0 2px 0 #0b0b0c}
.keymap kbd.km-space{min-width:4.2rem}
.km-say{color:#e3dac9;font-size:.92rem}

html.aog-keys .cs kbd,html.aog-keys .pad kbd{display:inline-block;margin-top:.35rem;font:700 .66rem/1.4 var(--sans);color:#5a4b2b;border:1px solid #8b7a55;border-radius:4px;padding:0 .35em}
.touch-line{display:block}
@media (hover:hover) and (pointer:fine){
  .pad kbd{display:inline-block;margin-top:.35rem;font:700 .66rem/1.4 var(--sans);color:#5a4b2b;border:1px solid #8b7a55;border-radius:4px;padding:0 .35em}
  .keys-line{display:block}
  .touch-line{display:none}
}
.foot{margin:2rem 0 0;color:var(--muted);font-size:.92rem}
.foot p{margin:.35rem 0}
@media (max-width:520px){
  .rig{padding:14px 10px 16px;border-radius:14px}
  .pbtn.play{min-width:0;flex:1 1 100%}

}
/* AOG-ANYCHORD-V1: any chord, under the pattern by the neck */
.nk-any{margin-top:.2rem} .nk-any .field.small{min-width:6.5rem} .nk-anyline{margin:.45rem 0 .8rem;font-weight:700}
.nk-anyline:empty{display:none}
@media print{ .rig,.bench-bar,header{display:none!important} }
/* AOG-CHORDSTRIP-V1: the six chords in one row, right on top of the instrument */
.cstrip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:.1rem 0 .6rem}
.cs{min-height:48px;min-width:0;border-radius:10px;border:1px solid #0a0b0d;padding:0 .2rem;color:#1f1a10;
  background:linear-gradient(#fbf3df,#e6d7b5);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 0 #07080a;
  font:800 1.05rem/1 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.cs.hit{background:linear-gradient(#ffe08a,#e0a640);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 1px 0 #07080a}
.cs.more{background:linear-gradient(#efe6cf,#d9c79f);font-size:.95rem}   /* AOG-CHORDS-MORE-V1: the four more, a shade apart */
.cstrip:not(.pv-chords) .cs.more:nth-child(7){grid-column:2}   /* upright: the four more sit centred under the six */
/* AOG-PLAY-CHORDS-V1 — Jimmy: "Can the chords be on the neck and make the strumming bar a bit smaller." Sideways, the six
   chords stand in a column at the nut end of the neck (the fretting hand picks the chord, the other strums), so the neck
   has the whole height; mirrored (Left-handed, Screen faces away) they move with the nut. */
/* AOG-CHORDS-MORE-V1: the six, then the four more beside them; AOG-PLAY-ROOM-V1 (Jimmy: "Allow some more space between the
   open notes and the chords"): a clear gap before the open strings */
#playView .cstrip.pv-chords{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,minmax(0,1fr));grid-auto-flow:column;gap:5px;
  width:clamp(118px,16vw,210px);margin:0 18px 20px 0}
body.pv-left #playView .cstrip.pv-chords{order:2;margin:0 0 20px 18px}
#playView .cs.more{font-size:.9rem}
#playView .cs{min-height:0;font-size:1rem}
/* ══ AOG-PLAY-V1 — the neck sideways. A phone or tablet turned on its side (or a computer's "Play on the whole screen"):
   the page steps aside and the neck fills the screen, clear of the notch and the home bar. Nothing moves on its own. The
   page is not zoomed while you play (aog-calm.css zooms a wide page; a finger must land on the string it touches). ══ */
.pv{display:none}
html{touch-action:manipulation}   /* AOG-PLAY-ZOOM-V1: a quick second tap plays, it does not zoom (pinching the page still does) */
.pv-big{display:none}
@media (pointer:fine){ .pv-big{display:inline-flex} }
@media (pointer:coarse) and (min-width:600px) and (min-height:600px){ .pv-big{display:inline-flex} }   /* AOG-PLAY-TABLET-V1: a tablet chooses the whole screen itself */
html body.aog-play{zoom:1 !important;overflow:hidden;position:fixed;inset:0;width:100%;height:100%;overscroll-behavior:none}
body.aog-play>*:not(#playView){display:none !important}
body.aog-play #playView{display:flex;flex-direction:column;position:fixed;inset:0;width:100vw;width:100dvw;height:100vh;height:100dvh;z-index:60;
  background:#0d0e11;color:#f1e9d6;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════════════════
   THE GUITAR AND THE BASS (AOG-STRINGS-V1) — one page, built twice
   ══════════════════════════════════════════════════════════════════════════ */
const INST="guitar", GTR=INST==="guitar";
const LKEY="aog."+INST+".v1";
/* the strings, low to high, as note numbers: a guitar E A D G B E, a bass E A D G */
const TUNING=GTR?[40,45,50,55,59,64]:[28,33,38,43];
const STRPICK={s:-1};   /* AOG-STRING-TAB-V1: the string the letters play on (-1: the nearest) */
const MAXF=15;                                   /* the highest fret on the neck */
/* AOG-STRINGS-WAYS-V1: the ways to play, in the menu's order (RHYTHM_GROUPS); the first stays first, the ids never change */
const RHYTHMS=GTR?["hold","down","folk","pop","waltz","pick","travis","ballad","country","rock","punk","chug","gallop","thrash","breakdown","tremolo","reggae","funk","bossa","rumba","shuffle"]
                 :["root","steady","eighths","fifth","waltz","walk","arpeggio","boogie","approach","motown","rock","gallop","sixteen","breakdown","octave","funk","reggae","tumbao","bossa"];
const S={ lang:"en", sound:GTR?"steel":"finger", key:0, minor:false, preset:"", prog:[], own:false, rhythm:RHYTHMS[0], bpm:90,
  fret0:1, era:0, vol:0.8, withDrums:false, playing:false, hand:null };
try{ S.lang=localStorage.getItem("aog.lang")==="es"?"es":"en"; }catch(e){}
function loadState(){
  try{
    const r=JSON.parse(localStorage.getItem(LKEY)||"null");
    if(r){
      if(SOUNDS[r.sound]) S.sound=r.sound;
      if(r.key>=0 && r.key<12) S.key=r.key|0;
      S.minor=!!r.minor;
      if(Array.isArray(r.prog)) S.prog=r.prog.filter(c=>c && typeof c.off==="number" && Q[c.q]).slice(0,12);
      if(typeof r.preset==="string") S.preset=r.preset;
      if(RHYTHMS.indexOf(r.rhythm)>=0) S.rhythm=r.rhythm;
      if(r.bpm>=50 && r.bpm<=180) S.bpm=r.bpm|0;
      if(r.fret0>=1 && r.fret0<=MAXF) S.fret0=r.fret0|0;
      if(typeof r.era==="number") S.era=Math.max(0,Math.min(1,r.era));
      if(typeof r.vol==="number") S.vol=Math.max(0.05,Math.min(1,r.vol));
      S.withDrums=!!r.withDrums;
      return;
    }
    /* first visit: the same tempo as the drum machine */
    const d=JSON.parse(localStorage.getItem("aog.drums.bench.v2")||"null");
    if(d && d.bpm>=50 && d.bpm<=180) S.bpm=Math.round(d.bpm);
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(LKEY, JSON.stringify({sound:S.sound,key:S.key,minor:S.minor,prog:S.prog,preset:S.preset,rhythm:S.rhythm,
    bpm:S.bpm,fret0:S.fret0,era:S.era,vol:S.vol,withDrums:S.withDrums})); }catch(e){}
}

const STR={
  app: GTR?{en:"The Guitar",es:"La guitarra"}:{en:"The Bass",es:"El bajo"},

function wavBlob(L, R, sr){
  const n=L.length, ab=new ArrayBuffer(44+n*4), v=new DataView(ab);
  const str=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  str(0,"RIFF"); v.setUint32(4,36+n*4,true); str(8,"WAVE"); str(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,2,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*4,true); v.setUint16(32,4,true); v.setUint16(34,16,true); str(36,"data"); v.setUint32(40,n*4,true);
  let o=44; for(let i=0;i<n;i++){ const l=Math.max(-1,Math.min(1,L[i])), r=Math.max(-1,Math.min(1,R[i]));
    v.setInt16(o,l<0?l*0x8000:l*0x7fff,true); v.setInt16(o+2,r<0?r*0x8000:r*0x7fff,true); o+=4; }

}

  $("muteBtn").onclick=()=>{ muteAll(); LES.mark("mute"); };
  $("era").oninput=()=>{ LES.mark("era"); S.era=Math.max(0,Math.min(1,1-(+$("era").value)/100)); $("eraOut").textContent=eraWord(); $("era").setAttribute("aria-valuetext",eraWord());
    if(ac) setEra(LIVE_CH, S.era); clearTimeout(bind.et); bind.et=setTimeout(save,250); };
  $("vol").oninput=()=>{ S.vol=Math.max(0.05,(+$("vol").value)/100); $("volOut").textContent=Math.round(S.vol*100); if(ac) LIVE_CH.master.gain.setTargetAtTime(volGain(S.vol), ac.currentTime, 0.02); clearTimeout(bind.vt); bind.vt=setTimeout(save,250); };
  $("sendBtn").onclick=()=>bounce(); $("sendPadsBtn").onclick=()=>bounce("pads");
  $("padsBtn").onclick=sendPads;
  $("langBtn").onclick=()=>{ S.lang=S.lang==="es"?"en":"es"; try{ localStorage.setItem("aog.lang", S.lang); }catch(e){} paintText(); };
  $("themeBtn").onclick=()=>{ const h=document.documentElement, d=h.getAttribute("data-theme")==="dark"?"light":"dark";
    h.setAttribute("data-theme", d); h.classList.toggle("dark", d==="dark"); try{ localStorage.setItem("aog.interior.ws.v1.theme", d); }catch(e){} paintText(); };
  /* after a menu is picked with a finger or the mouse, it gives focus back, so Space plays instead of reopening the menu */
  ["soundSel","keySel","keySel2","progSel","progSel2","rhythmSel","anyRoot","anyKind"].forEach(id=>{ const el=$(id);
    el.addEventListener("pointerdown",()=>{ el._ptr=true; });
    el.addEventListener("change",()=>{ if(el._ptr){ el._ptr=false; setTimeout(()=>el.blur(),0); } }); });
  bindNeck();
  let rt=0, lastW=0; window.addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ const w=Math.round($("neckBox").clientWidth); if(w && w!==lastW){ lastW=w; buildNeck(); } },150); });
}

loadState();
bind();
lessonListen();   /* AOG-LESSONS-V1 */
paintText();
pvInit();
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ stop(); muteAll(); } });
window.addEventListener("pagehide",()=>{ stop(true); muteAll(); });
/* wake Safari's audio on the first touch, every time it sleeps (AOG-MUSIC-TOUCH-V1) */
["touchstart","touchend","pointerdown","click","keydown"].forEach(ev=>document.addEventListener(ev,()=>{ try{ if(ac && ac.state!=="running") ac.resume(); }catch(e){} },{capture:true,passive:true}));
/* the strings are made once the page is up; the drum beat is looked up on the shared shelf */
window.addEventListener("load",()=>{ prepare(S.sound); });
checkDrums();
try{ AOGHandoff.listen(function(key){ if(key==="drumbench" || key==="padbench") checkDrums(); }); }catch(e){}
window.addEventListener("focus", checkDrums);
</script>
</body>
</html>
