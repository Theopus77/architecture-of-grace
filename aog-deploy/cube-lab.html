<title>The Cube Lab — Architecture of Grace</title>
<!-- AOG-CUBE-LAB-V1 (2026-10-10) — Jimmy: "a step by step 3d interactive engine … instructions on how to make and
     finish a rubric cube." A real 3D Rubik's Cube on the Lab Bench, drawn with CSS 3D (no canvas, no library):
     drag a row to turn it, or the space around it to look; Front and Back show every side. Ten short steps teach the layer-by-layer way
     (daisy, white cross, white corners, middle, yellow cross, yellow top, yellow corners, yellow edges).
     "Solve with me" solves any mixed cube with the very moves the steps teach (aog-cube.js), one move at a
     time. "My cube" paints a real cube's colours in, then helps finish it. Nothing moves until it is tapped. -->

<style>
:root {
  --bg:#f4f0e6; --card:#fffcf7; --ink:#1a232c; --muted:#5c6670; --line:#ddd8cc;
  --steel:#2f5c6b; --steel-fg:#f4f8f9; --steel-soft:#e3eef2;
  --good:#2c7a4e; --good-fg:#f3faf5; --good-soft:#e3f0e8;
  --warn:#7a4e00; --warn-soft:#f6ecd6;
  --chip:#efebe3; --stage-a:#fbf8f1; --stage-b:#e9e2d2;
  --shadow:0 1px 3px rgb(26 35 44 / .08);
  --sans:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  --display:"Fraunces", Georgia, serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.dark, [data-theme="dark"] {
  --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
  --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
  --good:#6fbf8b; --good-fg:#14181e; --good-soft:#1f3327;
  --warn:#e8c27a; --warn-soft:#332a18;
  --chip:#2a313c; --stage-a:#232b35; --stage-b:#161b22;
  --shadow:0 1px 3px rgb(0 0 0 / .35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
    --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
    --good:#6fbf8b; --good-fg:#14181e; --good-soft:#1f3327;
    --warn:#e8c27a; --warn-soft:#332a18;
    --chip:#2a313c; --stage-a:#232b35; --stage-b:#161b22;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.55 var(--sans); overflow-x:hidden; }
h1,h2,h3 { font-family:var(--display); font-weight:600; letter-spacing:-.01em; text-wrap:balance; }
h2 { font-size:1.35rem; margin:.1rem 0 .3rem; }
h3 { font-size:1.05rem; margin:1rem 0 .35rem; }
p, li { text-wrap:pretty; }
a { color:inherit; }
button, select { font:inherit; touch-action:manipulation; }
button { cursor:pointer; }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:.75rem; }
.brand { font-weight:700; text-decoration:none; }
.tools { display:flex; gap:.5rem; }
.pill, .btn {
  min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:0 1rem; font-weight:600; font-size:.95rem; display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
}
.btn-steel { background:var(--steel); color:var(--steel-fg); border-color:transparent; }
.btn-good { background:var(--good); color:var(--good-fg); border-color:transparent; }
.btn[disabled] { opacity:.55; cursor:default; }
.nav { display:flex; gap:4px; }
.nav a.on { color:var(--ink); border-color:var(--steel); }
.muted { color:var(--muted); }
.lead { max-width:66ch; }
.kicker { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); margin:0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }

/* the bench: the cube on the left, the words on the right; one column on a phone */
.cube-bench { display:grid; gap:1rem; margin-top:1rem; }
@media (min-width:900px){ .cube-bench { grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); align-items:start; }
  .cube-side { position:sticky; top:.75rem; } }
.cube-side { display:flex; flex-direction:column; gap:.6rem; min-width:0; }
.panel { padding:1rem 1.1rem 1.2rem; min-width:0; }

/* ── the 3D cube ── */
.stage *, .stage { touch-action:none; }
.stage { overscroll-behavior:contain; }
/* the whole cube fits on the screen with the card: never taller than the window allows */
/* AOG-CUBE-STEADY-V1 (2026-10-11) — Jimmy: "In the chrome version, when you scroll it goes large or small and makes me
   nauseous." The box was sized from the window's height, and Chrome's address bar changes that height while a page
   scrolls, so the cube grew and shrank. Now its size is set once (--stage-max, from the script) and changes only when
   the screen is turned, never while scrolling. */
.stage { max-width:var(--stage-max, 560px); }
#bench { scroll-margin-top:70px; }
.stage { position:relative; width:100%; margin:0 auto; aspect-ratio:1/1; border-radius:18px; overflow:hidden;
  background:radial-gradient(120% 95% at 50% 35%, var(--stage-a) 0%, var(--stage-b) 100%); border:1px solid var(--line);
  perspective:1150px; /* set from the cube's size in fit(), PERSP in the script */ perspective-origin:50% 45%; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; cursor:grab; }
.stage.grabbing { cursor:grabbing; }
.stage .floor { position:absolute; left:20%; right:20%; bottom:7%; height:9%; border-radius:50%;
  background:radial-gradient(closest-side, rgb(0 0 0 / .22), rgb(0 0 0 / 0)); pointer-events:none; }
.cube-view { position:absolute; left:50%; top:48%; width:0; height:0; transform-style:preserve-3d; will-change:transform; }
/* AOG-CUBE-SMOOTH-V1 (2026-10-11) — Jimmy: "A go back button needs to appear also … when your rotating it, lags and it
   seems difficult to follow." Undo sits on the cube itself, and Front view appears once the cube has been turned around.
   Looking around now moves only the view (one transform per frame, never every piece), a little slower, and never
   tips the cube past 60°, so it stays easy to follow. */
.stage-tools { position:absolute; left:10px; right:10px; bottom:10px; display:flex; justify-content:space-between; gap:.5rem; pointer-events:none; }
.stage-tools button { pointer-events:auto; min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .95rem; font:600 .95rem/1 var(--sans); box-shadow:var(--shadow); }
.stage-tools button[hidden] { display:none; }
.stage-tools .spacer { flex:1; }
.cubie { position:absolute; width:var(--s,64px); height:var(--s,64px); left:calc(var(--s,64px) / -2); top:calc(var(--s,64px) / -2); transform-style:preserve-3d; }
.face { position:absolute; inset:0; background:#121418; border-radius:4%; pointer-events:none; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.face.fF { transform:translateZ(calc(var(--s,64px) / 2)); }
.face.fB { transform:rotateY(180deg) translateZ(calc(var(--s,64px) / 2)); }
.face.fR { transform:rotateY(90deg) translateZ(calc(var(--s,64px) / 2)); }
.face.fL { transform:rotateY(-90deg) translateZ(calc(var(--s,64px) / 2)); }
.face.fU { transform:rotateX(90deg) translateZ(calc(var(--s,64px) / 2)); }
.face.fD { transform:rotateX(-90deg) translateZ(calc(var(--s,64px) / 2)); }
.face i { position:absolute; inset:6.5%; border-radius:13%; background:var(--c); overflow:hidden; display:flex; align-items:center; justify-content:center; }
.face i { pointer-events:auto; }
.face i b { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; }
.face i span { position:relative; font:800 calc(var(--s,64px) * .34)/1 var(--sans); color:var(--lc,#14161a); pointer-events:none; }
.stage.painting .face i { cursor:pointer; }
.face i.flag { box-shadow:inset 0 0 0 calc(var(--s,64px) * .085) #14161a; }
/* the piece to watch: a still dark dot with a white rim in the middle of each of its stickers, clear on every color */
.face i.flag::after { content:""; position:absolute; left:50%; top:50%; width:30%; height:30%; transform:translate(-50%,-50%); border-radius:50%;
  background:#14161a; box-shadow:0 0 0 calc(var(--s,64px) * .04) #fff; }
.fixbox { border:2px solid var(--steel); border-radius:12px; padding:.75rem .9rem; margin:.7rem 0; background:var(--steel-soft); }
.fixbox h3 { margin:.1rem 0 .4rem; }
.fixbox ul { margin:.3rem 0 .5rem; padding-left:1.2rem; }
.stage-hint { text-align:center; margin:.1rem 0 0; font-size:.92rem; color:var(--muted); }
.view-row { display:flex; flex-wrap:wrap; justify-content:center; gap:.4rem; }
.view-row .pill { min-height:44px; font-size:.9rem; }
.look-row { display:flex; justify-content:center; margin:.1rem 0 0; }
.looks { display:inline-flex; align-items:center; gap:.3rem; }
.looks .lk { font-size:.8rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-right:.15rem; }
.looks .lookb { min-width:92px; font-size:1rem; }
.looks .lookb.on { background:var(--steel); color:var(--steel-fg); border-color:transparent; }
.view-row select { min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .8rem; font-size:16px; font-weight:600; }

/* the turn pad: six faces, each way, and turning the whole cube */
.pad { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:.35rem; max-width:560px; margin:0 auto; width:100%; }
.pad button { min-height:48px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:700 1.05rem/1 var(--mono); }
.pad button.prime { background:var(--chip); }
.pad .lbl { grid-column:1/-1; font-size:.8rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:.35rem 0 0; }
.pad .whole { grid-column:span 3; font-family:var(--sans); font-size:.95rem; }
.pad .act { grid-column:span 2; font-family:var(--sans); font-size:.95rem; }
.pad .act.go { background:var(--steel); color:var(--steel-fg); border-color:transparent; }

/* the arrow for the next move: a dark line with a light edge, so it reads on every color; it never moves */
.stage .arrow { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.arrow .halo { fill:#fff; stroke:#fff; stroke-width:11; stroke-linecap:round; stroke-linejoin:round; fill-opacity:1; }
.arrow path.halo:first-child { fill:none; }
.arrow .line { fill:none; stroke:#14161a; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
.arrow .head { fill:#14161a; stroke:#14161a; stroke-width:2; stroke-linejoin:round; }
.arrow .x2 { font:800 22px/1 var(--sans); fill:#14161a; paint-order:stroke; stroke:#fff; stroke-width:5px; }
/* the calm card: the goal, the move in words, one button */
.calm .aim { margin:.2rem 0 .6rem; color:var(--muted); font-size:1rem; }
.calm .move-big { font:600 clamp(1.35rem, 1.2rem + 1vw, 1.75rem)/1.25 var(--display); margin:.2rem 0 .6rem; }
.calm .move-big { margin-bottom:.9rem; }
.progress { margin:.1rem 0 .6rem; font-weight:600; color:var(--ink); }
.calm .keys { display:none; margin:.4rem 0 0; font-size:.88rem; color:var(--muted); }
@media (hover:hover) and (pointer:fine){ .calm .keys { display:block; } }
.btn:active:not([disabled]) { transform:translateY(1px); filter:brightness(.92); }
.startat { display:inline-flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
.startat span { font-size:.9rem; color:var(--muted); font-weight:600; }
.startat select { min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .8rem; font-size:16px; font-weight:600; }
.calm .note { background:var(--steel-soft); border-radius:10px; padding:.45rem .7rem; margin:.2rem 0 .6rem; }
.calm .btn.goal { margin-top:.2rem; }
.calm ol.last { margin:.2rem 0 .6rem; padding-left:1.3rem; }
@media (max-width:600px){ .calm .btn-row .btn.big { flex:1 1 100%; } }
.calm .move-big .once { display:block; font:700 .95rem/1.2 var(--sans); color:var(--steel); margin-bottom:.2rem; }
.calm .move-big .tok { font:700 .95rem/1 var(--mono); color:var(--muted); background:var(--chip); border-radius:6px; padding:.2rem .4rem; vertical-align:middle; }
.calm .chips .chip { font-size:.85rem; padding:.3rem .4rem; min-width:1.8rem; }
.btn.big { min-height:60px; padding:0 1.5rem; font-size:1.1rem; }
.calm details.more { margin-top:.7rem; color:var(--muted); }
.calm details.more summary { cursor:pointer; min-height:44px; display:flex; align-items:center; font-weight:600; }
.dots { display:flex; gap:.4rem; margin:.35rem 0 .9rem; }
.dots .dot { width:.7rem; height:.7rem; border-radius:50%; border:2px solid var(--steel); }
.dots .dot.done { background:var(--steel); }
.dots .dot.now { background:var(--steel-soft); box-shadow:0 0 0 3px var(--steel-soft); }
/* Solve with me: no turn pad (the steps say every move), and on a phone the card sits right under the cube */
.cube-bench.solving .pad { display:none; }
@media (max-width:899px){ .cube-bench { display:flex; flex-direction:column; } .cube-side { display:contents; }
  .stage { order:1; } .paintbar { order:2; } .look-row { order:2; } .stage-hint { order:3; } .cube-bench > .panel { order:4; } .view-row { order:5; } .pad { order:6; } }
.btn-row.start { flex-direction:column; align-items:stretch; max-width:22rem; }
.btn-row.quiet { margin-top:1.2rem; }
.btn-row.quiet .btn { font-size:.9rem; color:var(--muted); }
a.btn { text-decoration:none; }
/* words */
.steps { margin:.4rem 0 .2rem; padding-left:1.4rem; }
.steps li { margin:.35rem 0; }
.steps li.now { font-weight:700; }
.goal { background:var(--steel-soft); border-radius:10px; padding:.55rem .8rem; margin:.5rem 0; }
.alg { margin:.7rem 0; padding:.7rem .8rem; border-radius:12px; border:1px solid var(--line); background:var(--bg); }
.alg .name { font-weight:700; margin:0 0 .35rem; }
.chips { display:flex; flex-wrap:wrap; gap:.3rem; margin:.2rem 0 .5rem; }
.chip { font:700 1.02rem/1 var(--mono); padding:.45rem .55rem; border-radius:8px; background:var(--chip); color:var(--ink); border:1px solid transparent; min-width:2.2rem; text-align:center; }
.chip.done { opacity:.5; }
.chip.next { background:var(--steel); color:var(--steel-fg); }
.btn-row { display:flex; flex-wrap:wrap; gap:.45rem; margin:.4rem 0; }
.state { border-radius:10px; padding:.6rem .8rem; margin:.6rem 0; font-weight:600; }
.state.ok { background:var(--good-soft); color:var(--ink); }
.state.warn { background:var(--warn-soft); color:var(--ink); }
.say { margin:.3rem 0 .4rem; font-size:1.02rem; }
.stagelist { list-style:none; padding:0; margin:.4rem 0 .8rem; display:grid; gap:.2rem; }
.stagelist li { display:flex; gap:.5rem; align-items:baseline; padding:.25rem .4rem; border-radius:8px; }
.stagelist li.now { background:var(--steel-soft); font-weight:700; }
.stagelist li .mk { width:1.2rem; flex:0 0 auto; color:var(--good); font-weight:800; }
.palette { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.4rem; margin:.5rem 0; }
.palette button { min-height:48px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink); display:flex; align-items:center; gap:.5rem; padding:0 .6rem; font-weight:600; font-size:.95rem; }
.palette button.on { border-color:var(--steel); box-shadow:0 0 0 2px var(--steel); }
.palette .sw { width:1.5rem; height:1.5rem; border-radius:6px; border:1px solid rgb(0 0 0 / .25); flex:0 0 auto; }
.palette .n { margin-left:auto; font-variant-numeric:tabular-nums; color:var(--muted); font-size:.85rem; }
.lesson-nav { display:flex; justify-content:space-between; gap:.5rem; margin-top:1rem; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
footer p { margin-top:2rem; font-size:.9rem; color:var(--muted); max-width:70ch; }
@media print { .no-print { display:none !important; } }

/* AOG-CUBE-CEILING-V1 (2026-10-11) — the named moves, kinds of help, the real-cube check, symbols, the camera, the card */
.calm .chunk { margin:.1rem 0 .3rem; font-weight:600; color:var(--steel); }
.calm .cdots { display:flex; flex-wrap:wrap; gap:.3rem; margin:0 0 .7rem; }
.calm .cdots span { width:.62rem; height:.62rem; border-radius:50%; border:2px solid var(--steel); }
.calm .cdots span.gap { margin-left:.55rem; }
.calm .cdots span.done { background:var(--steel); }
.calm .cdots span.now { background:var(--steel-soft); box-shadow:0 0 0 3px var(--steel-soft); }
.calm .move-big.quiet { font:500 1.05rem/1.4 var(--sans); color:var(--ink); }
.note.checkin { background:var(--good-soft); border-radius:12px; padding:.6rem .8rem; margin:0 0 .8rem; }
.note.checkin p { margin:.1rem 0 .4rem; font-weight:600; }
/* symbols on the stickers, for telling colors apart without color */
.stage.symbols .face i::before { content:attr(data-sym); position:relative; font:800 calc(var(--s,64px) * .4)/1 var(--sans); color:var(--lc,#14161a); pointer-events:none; }
.stage.symbols .face i.flag::before, .stage.symbols.letters .face i.ctr::before { position:absolute; left:8%; top:6%; font-size:calc(var(--s,64px) * .22); }
.palette .sym { font-weight:800; width:1.2rem; text-align:center; }
/* the camera: one quiet sheet over the page */
.cam { position:fixed; inset:0; z-index:2147483600; background:var(--bg); overflow:auto; overscroll-behavior:contain; padding:max(12px, env(safe-area-inset-top)) 16px 24px; }
.cam .in { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:.6rem; }
.cam h2 { margin:.3rem 0 0; }
.cam .box { position:relative; width:100%; max-width:min(100%, 32vh); margin:0 auto; aspect-ratio:1/1; border-radius:16px; overflow:hidden; background:#000; }
.cam video { width:100%; height:100%; object-fit:cover; display:block; }
.cam video.mirror { transform:scaleX(-1); }
.cam .grid { position:absolute; inset:24%; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); border:3px solid #fff; border-radius:10px; box-shadow:0 0 0 2px #14161a, 0 0 0 999px rgb(0 0 0 / .32); pointer-events:none; }
.cam .grid span { border:1.5px solid rgb(255 255 255 / .85); }
.cam .sides { display:flex; gap:.35rem; }
.cam .sides span { flex:1; height:.5rem; border-radius:999px; background:var(--line); }
.cam .sides span.done { background:var(--steel); }
.cam .say { font-weight:600; }
.cam .rsides { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.8rem .6rem; }
@media (max-width:420px){ .cam .rsides { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.cam .rside { display:flex; flex-direction:column; gap:.3rem; align-items:center; }
.cam .rname { margin:0; font-weight:700; }
.cam .rgrid { display:grid; grid-template-columns:repeat(3,44px); gap:4px; background:#14161a; padding:5px; border-radius:10px; }
.cam .rgrid button { width:44px; height:44px; border-radius:7px; border:0; font:800 1.1rem/1 var(--sans); padding:0; }
.note.fewer { background:var(--steel-soft); border-radius:12px; padding:.6rem .8rem; margin:.4rem 0 .6rem; }
.note.fewer p { margin:.1rem 0 .3rem; font-weight:600; }
.calm .hold { display:flex; flex-wrap:wrap; align-items:center; gap:.35rem; margin:.1rem 0 .5rem; font-weight:700; }
.calm .hold .chip { width:1.15rem; height:1.15rem; border-radius:5px; border:1px solid rgb(0 0 0 / .3); display:inline-block; }
.calm .after { margin:.2rem 0 .7rem; }
.calm .after .lk { margin:0 0 .3rem; font-size:.9rem; color:var(--muted); font-weight:600; }
.calm .after-row { display:flex; gap:1rem; }
.calm .after-row > div { display:flex; flex-direction:column; align-items:center; gap:.2rem; font-size:.85rem; font-weight:600; }
.calm .rgrid.mini { display:grid; grid-template-columns:repeat(3,18px); gap:2px; padding:3px; background:#14161a; border-radius:6px; }
.calm .rgrid.mini span { width:18px; height:18px; border-radius:3px; display:block; }
.cam .live { min-height:2.4rem; display:flex; align-items:center; justify-content:center; gap:.7rem; }
.cam .live p { margin:0; }
.cam .rgrid.big { grid-template-columns:repeat(3,64px); gap:5px; padding:6px; margin:0 auto; }
.cam .rgrid.big button { width:64px; height:64px; border-radius:9px; border:0; font:800 1.3rem/1 var(--sans); padding:0; }
.cam .vfy { display:flex; gap:1.2rem; justify-content:center; flex-wrap:wrap; }
.cam .vfy .rgrid span { width:44px; height:44px; border-radius:7px; display:grid; place-items:center; font:800 1.2rem/1 var(--sans); }
.cam .vfy .rgrid span.off { box-shadow:0 0 0 4px #14161a, 0 0 0 6px #fff; }
.cam .lastside { display:flex; align-items:center; gap:.7rem; }
.cam .lastside p { margin:0; }
.cam .rgrid.small { grid-template-columns:repeat(3,26px); gap:3px; padding:3px; }
.cam .rgrid.small span { width:26px; height:26px; border-radius:5px; display:block; }
.cam .btn.small { min-height:44px; font-size:.85rem; padding:0 .7rem; }
.cam .palette.small { grid-template-columns:repeat(4,minmax(0,1fr)); }
.cam .palette.small button { font-size:.85rem; padding:0 .4rem; gap:.35rem; }
/* AOG-CUBE-MINE-V2: the colors under the cube, four across, big enough for a finger */
.paintbar { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.4rem; max-width:560px; width:100%; margin:0 auto; }
.paintbar[hidden] { display:none; }
.paintbar button { min-height:56px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink); display:flex; align-items:center; gap:.45rem; padding:.3rem .5rem; font-weight:600; font-size:.92rem; }
.paintbar button.on { border-color:var(--steel); box-shadow:0 0 0 2px var(--steel); }
.paintbar .sw { width:1.9rem; height:1.9rem; border-radius:7px; border:1px solid rgb(0 0 0 / .25); flex:0 0 auto; display:grid; place-items:center; font-weight:800; }
.paintbar .nm { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.paintbar .n { font-variant-numeric:tabular-nums; color:var(--muted); font-size:.85rem; }
.paintbar .n.over { color:var(--warn); font-weight:800; }
.paintbar { container-type:inline-size; }
@container (max-width:600px){ .paintbar button { flex-direction:column; justify-content:center; gap:.15rem; padding:.3rem .2rem; } .paintbar .nm { display:none; } }
.calm .kind { margin:.2rem 0 .35rem; font-weight:600; display:flex; flex-wrap:wrap; align-items:center; gap:.45rem; }
.calm .kind .tag { display:inline-block; border-radius:999px; padding:.25rem .7rem; font:800 .8rem/1.2 var(--sans); letter-spacing:.08em; text-transform:uppercase; }
.calm .kind.whole .tag { background:var(--warn-soft); color:var(--ink); border:2px solid var(--warn); }
.calm .kind.side .tag { background:var(--steel-soft); color:var(--ink); border:2px solid var(--steel); }
.actbar { display:none; }
/* AOG-CUBE-PHONEFIT-V1 (2026-10-21) — Jimmy (iPhone, Learn): "It is hard to follow." The navy title, the tabs and the
   Step menu took half the screen, and the lesson bar hid the bottom of the cube. On a phone the title is for screen
   readers only (the tabs and the top bar already say where you are), so the whole cube sits above the lesson. */
@media (max-width:600px){
  #nav a.sep { display:none; }   /* the sister tool is in the site menu; here it took a line of its own */
  html.aog-grace #toolMast, #toolMast { position:absolute!important; width:1px!important; height:1px!important; min-height:0!important; padding:0!important; margin:-1px!important; overflow:hidden!important; clip:rect(0 0 0 0)!important; white-space:nowrap!important; border:0!important; }
}
@media (max-width:899px){
  .actbar:not([hidden]) { display:flex; align-items:center; gap:.5rem; position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--card); border-top:1px solid var(--line);
    box-shadow:0 -2px 10px rgb(0 0 0 / .08); padding:.55rem max(16px, env(safe-area-inset-right)) calc(.55rem + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  .actbar .ab-move { flex:1 1 auto; margin:0; font:600 1rem/1.25 var(--sans); color:var(--ink); min-width:0; }
  .actbar .btn.big { min-height:56px; padding:0 1.1rem; flex:0 0 auto; }
  .actbar .btn:not(.big) { min-width:48px; min-height:56px; padding:0; font-size:1.3rem; }
  body.has-actbar, body.has-lessonbar { padding-bottom:calc(var(--bar-h, 88px) + 8px); }
  .actbar .ab-lesson { flex:1 1 auto; min-width:0; }
  .actbar .ab-dots { display:flex; gap:.3rem; margin:0 0 .3rem; }
  .actbar .ab-dots span { width:.5rem; height:.5rem; border-radius:50%; border:2px solid var(--steel); }
  .actbar .ab-dots span.done { background:var(--steel); }
  .actbar .ab-dots span.now { background:var(--steel-soft); box-shadow:0 0 0 2px var(--steel-soft); }
  body.has-lessonbar .actbar .ab-move { font:600 1.08rem/1.35 var(--sans); }
  body.has-lessonbar .actbar .btn { min-width:52px; min-height:56px; padding:0; font-size:1.6rem; flex:0 0 auto; }
  body.has-lessonbar .aog-mkbtn { bottom:calc(var(--bar-h, 84px) + 10px); }
  body.has-actbar .calm .mainrow, body.has-actbar .calm .move-big { display:none; }
  body.has-actbar .aog-mkbtn { bottom:calc(84px + env(safe-area-inset-bottom)); }
  body.has-actbar .aog-mktip { bottom:calc(140px + env(safe-area-inset-bottom)); }
}
/* the printed move card: only on paper */
#printCard { display:none; }
@media print { body.printing .wrap { display:none !important; } body.printing #printCard { display:block; color:#000; background:#fff; font:400 12pt/1.4 var(--sans); }
  #printCard table { border-collapse:collapse; width:100%; margin:.4rem 0 .8rem; } #printCard td, #printCard th { border:1px solid #999; padding:.25rem .4rem; text-align:left; vertical-align:top; }
  #printCard .m { font:700 12pt/1.2 var(--mono); white-space:nowrap; } }
@media (max-width:420px){ .pad button { min-height:46px; } .panel { padding:.9rem .85rem 1.1rem; } }

  const F=fewer, adopt=moves => {   /* a shorter way from the cube as it is now: follow it */
    if(fewer!==F || cube.toJSON()!==F.json) return;
    const cur=guide && guide.short ? guide.flat.length-guide.i : 99; if(moves.length>=cur) return;
    guide={r:{stages:[{key:"short", parts:[{note:"short", vars:{n:moves.length}, moves}]}]}, flat:moves.map((tok,mi) => ({tok, si:0, pi:0, mi})), i:0, key:F.json, short:true};
    F.best=moves; $("live").textContent=t("fewerUsed",{n:moves.length}); };
  const finish=() => { if(fewer!==F) return; if(F.best && F.lb>=F.best.length) F.proven=true; if(F.proven || (F.done||0)>=2){ fewerStop(true); } panel(); };
  const mk=cmd => { let w; try{ w=new Worker("/aog-cube-short.js"); }catch(e){ return null; }
    w.onmessage=e => { const q=e.data; if(fewer!==F) return;
      if(q.better && q.better.length<left){ adopt(q.better); }
      if(q.bound){ F.lb=Math.max(F.lb, q.bound); }
      if(q.least){ adopt(q.least); F.lb=q.least.length; F.proven=true; }
      if(q.done) F.done=(F.done||0)+1;
      finish(); };
    w.onerror=() => { if(fewer===F){ F.done=(F.done||0)+1; finish(); } };
    w.postMessage({id:1, cmd, cube:json, ms:30000}); return w; };
  F.workers=[mk("better"), mk("least")].filter(Boolean);
  if(!F.workers.length){ fewer=null; return; }
  F.best=guide.flat.slice(guide.i).map(x => x.tok);   /* the way already found counts as the best so far */
  F.timer=setTimeout(() => { if(fewer===F){ fewerStop(true); panel(); } }, 33000);
  panel();
}

const SIDE_TILT=mul3(C.rot([1,0,0],-14*deg), C.rot([0,1,0],-18*deg));
function sideView(f){
  const n=C.FACES[f], up = f==="U" ? [0,0,-1] : f==="D" ? [0,0,1] : [0,1,0], right=cross(up, n), fl=v => [v[0],-v[1],v[2]];
  const A=[fl(right), fl(up), fl(n)], E=[[1,0,0],[0,-1,0],[0,0,1]], B=[];
  for(let r=0;r<3;r++) for(let c=0;c<3;c++) B[r*3+c]=E[0][r]*A[0][c]+E[1][r]*A[1][c]+E[2][r]*A[2][c];
  return mul3(SIDE_TILT, B);
}

/* ── hands on the cube: drag a row to turn it; the space around it never moves it ── */
let drag=null;
const AXES=[[1,0,0],[0,1,0],[0,0,1]];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
/* which sticker is under the finger: each sticker is projected the way the browser draws it (the stage's
   perspective), and the nearest one facing us wins. Browsers' own hit-testing in 3D is not reliable enough. */
/* AOG-CUBE-TOUCH-V1 (2026-10-11) — Jimmy, on an iPad: "I can't rotate like how it suggest and I keep on moving the entire
   screen while trying to just move the cube." The browser's own touch target (the sticker under the finger) is used
   first, and a touch on the black edge between stickers still finds the nearest one, so a drag on the cube turns a
   row instead of swinging the whole view. The depth of the view grows with the cube, so a big iPad cube is not
   stretched. The arrow is always drawn along a row you can drag, so following it with a finger makes that move. */

  const ox=W*.5, oy=H*.48, px=W*.5, py=H*.45, g=size*1.015, cam=[px-ox, py-oy, PERSP];
  const proj=v => { const q=toView(v); const X=q[0]*g, Y=q[1]*g, Z=q[2]*g, s=PERSP/(PERSP-Z); return [px+(ox+X-px)*s, py+(oy+Y-py)*s, Z, X, Y]; };
  let best=null, near=null;
  cube.P.forEach((p,i) => {
    const pos=cube.pos(p);
    for(const f in p.cols){
      const n=C.mulV(p.M, C.FACES[f]), c=[pos[0]+n[0]*.5, pos[1]+n[1]*.5, pos[2]+n[2]*.5];
      const cv=proj(c), nv=toView(n);
      if(nv[0]*(cam[0]-cv[3])+nv[1]*(cam[1]-cv[4])+nv[2]*(cam[2]-cv[2])<=0) continue;
      const [u,w]=AXES.filter(a => C.dot(a,n)===0);
      const quad=[[1,1],[1,-1],[-1,-1],[-1,1]].map(([a,b]) => proj([c[0]+(u[0]*a+w[0]*b)*.5, c[1]+(u[1]*a+w[1]*b)*.5, c[2]+(u[2]*a+w[2]*b)*.5]));

      for(let j=0;j<4;j++){ const A=quad[j], B=quad[(j+1)%4], z=(B[0]-A[0])*(sy-A[1])-(B[1]-A[1])*(sx-A[0]);
        if(Math.abs(z)<1e-9) continue; const sg=z>0?1:-1; if(!sign) sign=sg; else if(sg!==sign){ inside=false; break; } }
      if(inside && (!best || cv[2]>best.z)) best={i, f, z:cv[2]};
      const dd=Math.hypot(cv[0]-sx, cv[1]-sy); if(!near || dd<near.d) near={i, f, z:cv[2], d:dd};
    }

}
/* AOG-CUBE-NOSCROLL-V1 (2026-10-11) — Jimmy (iPad): "It gets stuck here. The screen keeps moving." Safari on an iPad
   and iPhone does not keep to touch-action:none alone: a finger moving on the cube scrolled the page, and the scroll
   cancelled the drag, so the cube stuck while the screen slid. A finger on the cube now never scrolls, zooms or
   brings up the text loupe; only the buttons on the cube keep their own taps. */
const keepTap = e => e.target && e.target.closest && e.target.closest("button");

["gesturestart","gesturechange","gestureend"].forEach(ev => stage.addEventListener(ev, e => e.preventDefault(), {passive:false}));
/* AOG-CUBE-TWOHANDS-V1 — two fingers on the cube, swiped together, turn the whole cube that way (a swipe left is
   "turn the whole cube to the left"). A row the first finger had started to turn goes back first. */

       paints. (Elsewhere the cube holds still, so a learner turning rows never gets lost.) */

    if(Math.hypot(dx,dy)<14) return;

    let best=null;
    AXES.forEach(a => { if(C.dot(a,front)!==0) return; const v=toView(cross(a, ps)), len=Math.hypot(v[0],v[1]); if(len<1e-6) return;
      const score=(dx*v[0]+dy*v[1])/(Math.hypot(dx,dy)*len); if(!best || Math.abs(score)>Math.abs(best.score)) best={a, v, len, score}; });
    if(!best) return;

      else base="UDRLFB".split("").find(b => C.eqV(C.MOVES[b].n, T2.a.map(x=>x*T2.layer)));

    for(let y=0;y<h;y++) for(let x=0;x<w;x++){ let r=0,g=0,b=0; for(let j=0;j<k;j++) for(let i=0;i<k;i++){ const o=((y*k+j)*W+(x*k+i))*4; r+=data[o]; g+=data[o+1]; b+=data[o+2]; } const n=k*k, q=y*w+x; R[q]=r/n; G[q]=g/n; B[q]=b/n; }
    const E=new Float32Array(w*h);
    for(let y=0;y<h-1;y++) for(let x=0;x<w-1;x++){ const q=y*w+x, a=q+1, c=q+w;
      E[q]=Math.abs(R[q]-R[a])+Math.abs(G[q]-G[a])+Math.abs(B[q]-B[a])+Math.abs(R[q]-R[c])+Math.abs(G[q]-G[c])+Math.abs(B[q]-B[c]); }
    const D=new Float32Array(w*h);
    for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){ let m=0; for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++){ const v=E[(y+j)*w+x+i]; if(v>m) m=v; } D[y*w+x]=m; }
    const I=new Float64Array((w+1)*(h+1));
    for(let y=0;y<h;y++){ let row=0; for(let x=0;x<w;x++){ row+=E[y*w+x]; I[(y+1)*(w+1)+x+1]=I[y*(w+1)+x+1]+row; } }
    const CV=new Float64Array((h+1)*w), RH=new Float64Array(h*(w+1));
    for(let x=0;x<w;x++) for(let y=0;y<h;y++) CV[(y+1)*w+x]=CV[y*w+x]+D[y*w+x];
    for(let y=0;y<h;y++) for(let x=0;x<w;x++) RH[y*(w+1)+x+1]=RH[y*(w+1)+x]+D[y*w+x];
    return {k, w, h, I, CV, RH};
  }
  function score(P, x, y, s){
    const {w, I, CV, RH}=P, c=s/3, m=Math.round(c*.18);
    const area=(x0,y0,x1,y1)=>(I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0])/Math.max(1,(x1-x0)*(y1-y0));
    const vl=(x,y0,y1)=>(CV[y1*w+x]-CV[y0*w+x])/Math.max(1,y1-y0), hl=(y,x0,x1)=>(RH[y*(w+1)+x1]-RH[y*(w+1)+x0])/Math.max(1,x1-x0);
    const a=Math.round(x+c), b=Math.round(x+2*c), p=Math.round(y+c), q=Math.round(y+2*c);
    const L=[vl(a,y+m,y+s-m),vl(b,y+m,y+s-m),hl(p,x+m,x+s-m),hl(q,x+m,x+s-m),vl(x,y+m,y+s-m),vl(x+s,y+m,y+s-m),hl(y,x+m,x+s-m),hl(y+s,x+m,x+s-m)];
    let cells=0; for(let j=0;j<3;j++) for(let i=0;i<3;i++) cells+=area(Math.round(x+i*c+c*.25), Math.round(y+j*c+c*.25), Math.round(x+i*c+c*.75), Math.round(y+j*c+c*.75));
    return L.reduce((u,v)=>u+v,0)/8 + Math.min(...L) - 2*cells/9;
  }
  /* a coarse look over the whole picture, then a close look around the best spot */
  const P1=prep(Math.max(1, Math.round(Math.max(W,H)/128)));
  let best=null;
  for(let s=Math.round(Math.min(P1.w,P1.h)*.18); s<=Math.round(Math.min(P1.w,P1.h)*.92); s+=(s<30?1:2)){ const st=s<30?1:2;
    for(let y=1; y+s<P1.h-1; y+=st) for(let x=1; x+s<P1.w-1; x+=st){ const v=score(P1,x,y,s); if(!best || v>best.v) best={v,x,y,s}; } }
  if(!best) return null;
  const P2=prep(Math.max(1, Math.round(Math.max(W,H)/384))), r=P1.k/P2.k;
  let fine=null; const cx=best.x*r, cy=best.y*r, cs=best.s*r, d=Math.ceil(r*2.5);
  for(let s=Math.round(cs*.9); s<=Math.round(cs*1.1); s++)
    for(let y=Math.max(1,Math.round(cy-d)); y<=Math.round(cy+d) && y+s<P2.h-1; y++) for(let x=Math.max(1,Math.round(cx-d)); x<=Math.round(cx+d) && x+s<P2.w-1; x++){ const v=score(P2,x,y,s); if(!fine || v>fine.v) fine={v,x,y,s}; }
  const f=fine||{v:best.v, x:cx, y:cy, s:cs};
  return {x:f.x*P2.k, y:f.y*P2.k, s:f.s*P2.k, score:f.v};
}
const CAM_MIN=215;   /* below this, no cube is in the picture */
function camTake(){
  if(cam && cam.live && Date.now()-cam.liveAt<1500){ const rgb=cam.live; cam.live=null; cam.msg=""; if(cam.mode==="verify"){ verifyRead(rgb); return; } camSide(rgb); return; }
  const v=cam && cam.box.querySelector("video"); if(!v || !v.videoWidth || cam.busy) return;
  const W=v.videoWidth, H=v.videoHeight;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const g=cv.getContext("2d", {willReadFrequently:true}); g.drawImage(v,0,0,W,H);
  cam.busy=true; const tb=cam.box.querySelector('[data-cam="take"]'); if(tb){ tb.disabled=true; tb.textContent=t("camReading"); }
  setTimeout(() => { if(!cam) return; cam.busy=false; camRead(g.getImageData(0,0,W,H)); }, 30);
}
/* the picture is never mirrored (only the front camera's view on screen is, like a mirror): the squares are listed
   the way the camera sees the side, left to right */
function camRead(img){
  const out=sampleFace(img);
  if(!out){ cam.msg=t("camLost"); if(cam.mode==="verify") cam.result=null; camDraw(); return; }
  cam.msg=""; if(cam.mode==="verify"){ verifyRead(out); return; } camSide(out);
}
/* the nine colors of the cube side in a picture, or null when no cube is in it */
function sampleFace(img){
  const f=findGrid(img.data, img.width, img.height);
  if(!f || f.score<CAM_MIN) return null;
  const c=f.s/3, out=[];
  for(let r=0;r<3;r++) for(let q=0;q<3;q++){
    const cx=f.x+c*(q+.5), cy=f.y+c*(r+.5), h=c*.22, R=[], G=[], B=[];
    for(let y=Math.round(cy-h); y<Math.round(cy+h); y++) for(let x=Math.round(cx-h); x<Math.round(cx+h); x++){ const o=(y*img.width+x)*4; R.push(img.data[o]); G.push(img.data[o+1]); B.push(img.data[o+2]); }
    const med=a => a.sort((m,n) => m-n)[a.length>>1];   /* the middle value: a fingertip on part of a square does not tint it */
    out.push([med(R), med(G), med(B)]);
  }
  return out;
}
/* AOG-CUBE-CAMREVIEW-V1 (2026-10-11) — Jimmy: "once I took the shot, I couldn't figure out what to do next." After the
   sixth side the sheet stays open and shows all six sides as the camera read them, flat, the way each was held up.
   A wrong square is fixed right there (tap a color, tap the square); the counts say what is off; one big button goes on. */
function camSide(rgb9){
  if(!cam.wb) cam.wb=balanceFrom(rgb9);
  cam.pending={rgb:rgb9, letters:rgb9.map(nameLive)}; cam.mode="confirm"; liveStop(); camDraw(); cam.box.scrollTop=0;
}
function confirmHtml(){
  const P=cam.pending, brush=cam.brush||P.letters[4];
  return `<div class="in"><h2>${esc(t("camH"))}</h2><p class="kicker">${esc(t("camN",{i:cam.i+1}))}</p>
    <p class="say">${esc(t("confLine"))}</p>
    <div class="rgrid big">${P.letters.map((l,j) => `<button type="button" data-ck="${j}" style="background:${COL[l]};color:${INK[l]}" aria-label="${esc((j+1)+": "+cn(l))}">${S.symbols?SYM[l]:""}</button>`).join("")}</div>
    <p class="muted">${esc(t("confFix"))}</p>
    <div class="palette small" role="group" aria-label="${esc(t("hintPaint"))}">${"WYGBORPK".split("").map(c=>`<button type="button" data-rb="${c}" class="${brush===c?"on":""}" aria-pressed="${brush===c}"><span class="sw" style="background:${COL[c]}"></span>${esc(cn(c))}</button>`).join("")}</div>
    <div class="btn-row start"><button type="button" class="btn btn-good big" data-cam="ok">${esc(t(cam.i<5 || cam.only ? "confOk" : "confLast"))}</button>
    <button type="button" class="btn" data-cam="redo">${esc(t("confRedo"))}</button></div></div>`;
}
function confirmWire(){
  const B=cam.box, P=cam.pending;
  B.querySelectorAll("[data-rb]").forEach(b => b.onclick=() => { cam.brush=b.getAttribute("data-rb"); camDraw(); });
  B.querySelectorAll("[data-ck]").forEach(b => b.onclick=() => { P.letters[+b.getAttribute("data-ck")]=cam.brush||P.letters[4]; camDraw(); });
  B.querySelector('[data-cam="redo"]').onclick=() => { cam.pending=null; cam.mode="shoot"; camDraw(); liveStart(); };
  B.querySelector('[data-cam="ok"]').onclick=() => {
    /* this side's colors, as confirmed, teach the camera what each color looks like here */
    cam.refs=cam.refs||{}; P.rgb.forEach((c,j) => { (cam.refs[P.letters[j]]=cam.refs[P.letters[j]]||[]).push(toLab(c)); });
    const whites=P.rgb.filter((c,j) => P.letters[j]==="W"); if(whites.length){ const m=[0,1,2].map(i => whites.reduce((a,c) => a+c[i],0)/whites.length), avg=(m[0]+m[1]+m[2])/3; cam.wb=m.map(v => avg/Math.max(1,v)); }
    camConfirmed(P.rgb, P.letters); };
}
function camConfirmed(rgb9, letters){
  const f=CAM_ORDER[cam.i]; cam.samples[f]=rgb9; cam.conf=cam.conf||{}; cam.conf[f]=letters.slice(); cam.pending=null;
  if(cam.edits) Object.keys(cam.edits).forEach(k => { if(k.endsWith("|"+f)) delete cam.edits[k]; });
  if(cam.only){ cam.only=false; cam.i=6; } else cam.i++;
  if(cam.i<6){ cam.mode="shoot"; camDraw(); liveStart(); cam.box.scrollTop=0; return; }
  camStop(); cam.mode="review"; cam.edits=cam.edits||{};
  /* the sides as the learner confirmed them, placed on the cube */
  const lab=CAM_ORDER.map(s => cam.conf[s]);
  cam.read=placeSides(lab, l => l);
  camRef={}; Object.keys(cam.refs||{}).forEach(l => { const r=cam.samples && Object.keys(cam.conf).flatMap(s => cam.conf[s].map((x,j) => x===l ? cam.samples[s][j] : null)).filter(Boolean); if(r && r.length) camRef[l]=[0,1,2].map(i => r.reduce((a,c) => a+c[i],0)/r.length); });
  camDraw(); cam.box.scrollTop=0;
}
const camCols=() => Object.assign({}, cam.read, cam.edits);
function camCounts(){ const n={}; Object.values(camCols()).forEach(c => { n[c]=(n[c]||0)+1; }); return n; }
function camOffList(){ const n=camCounts(); return Object.keys(n).filter(c => n[c]!==9).map(c => cn(c)+" "+n[c]).join(", "); }   /* "white 10, yellow 7" */
function camReviewHtml(){
  const cols=camCols(), off=camOffList(), brush=cam.brush||S.brush||"W";
  const grid=f => `<div class="rside"><p class="rname">${esc(tx(T.sideName[f]).replace(/^./,x=>x.toUpperCase()))}</p><div class="rgrid">`
    +C.facelets(f).map(([pos],j) => { const k=pos.join(",")+"|"+f, c=cols[k]||"?"; return `<button type="button" data-rk="${k}" style="background:${COL[c]};color:${INK[c]}" aria-label="${esc(tx(T.sideName[f])+" "+(j+1)+": "+cn(c))}">${S.symbols?SYM[c]:""}</button>`; }).join("")
    +`</div><button type="button" class="btn small" data-retake="${f}">${esc(t("revRetake"))}</button></div>`;
  return `<div class="in"><h2>${esc(t("revH"))}</h2><p>${esc(t("revLine"))}</p>
    <p class="state ${off?"warn":"ok"}" id="revState">${esc(off ? t("revBad",{list:off}) : t("revOk"))}</p>
    <div class="palette small" role="group" aria-label="${esc(t("hintPaint"))}">${"WYGBORPK".split("").map(c=>`<button type="button" data-rb="${c}" class="${brush===c?"on":""}" aria-pressed="${brush===c}"><span class="sw" style="background:${COL[c]}"></span>${esc(cn(c))}</button>`).join("")}</div>
    <div class="rsides">${CAM_ORDER.map(grid).join("")}</div>
    <div class="btn-row start"><button type="button" class="btn btn-good big" data-cam="go">${esc(t("revGo"))}</button></div>
    <div class="btn-row quiet"><button type="button" class="btn" data-cam="close">${esc(t("camClose"))}</button></div></div>`;
}
function camReviewWire(){
  const B=cam.box;
  B.querySelectorAll("[data-rb]").forEach(b => b.onclick=() => { cam.brush=b.getAttribute("data-rb"); const y=B.scrollTop; camDraw(); B.scrollTop=y; });
  B.querySelectorAll("[data-rk]").forEach(b => b.onclick=() => { cam.edits[b.getAttribute("data-rk")]=cam.brush||S.brush||"W"; const y=B.scrollTop; camDraw(); B.scrollTop=y; });
  B.querySelectorAll("[data-retake]").forEach(b => b.onclick=() => { cam.i=CAM_ORDER.indexOf(b.getAttribute("data-retake")); cam.only=true; cam.mode="shoot"; camDraw(); camStart(); B.scrollTop=0; });
  B.querySelector('[data-cam="go"]').onclick=() => {
    const off=camOffList();
    if(off){ const st=B.querySelector("#revState"); st.textContent=t("revFix",{list:off}); st.className="state warn"; B.scrollTop=0; return; }
    S.paint=camCols(); if(camRef) S.camRef=camRef; camClose(); doctor=null; flags=[]; peek=false; mineMsg=null; save(); checkMine();
  };
  B.querySelector('[data-cam="close"]').onclick=() => { S.paint=camCols(); camClose(); doctor=null; flags=[]; peek=false; mineMsg={ok:true, text:t("camDone")}; save(); render(); panel(); };
}
window.AOGCubeLab={pick:pickSticker, get cube(){ return cube; }, readColors, sampleFace, camConfirm:() => { const b=cam && cam.box.querySelector('[data-cam="ok"]'); if(b) b.click(); }, verifyRead:rgb => { if(!cam) camOpen("verify"); verifyRead(rgb); return cam.result; }, camSide:rgb => { if(!cam) camOpen(); camSide(rgb); }, get cam(){ return cam; }};   /* for the site's checks */
$("langBtn").onclick=()=>{ S.lang=es()?"en":"es"; save(); paintAll(); };
$("themeBtn").onclick=()=>{
  const next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next); document.documentElement.classList.toggle("dark",next==="dark");
  try{ localStorage.setItem("aog.interior.ws.v1.theme",next); }catch(e){}
  paintAll();
};
/* the cube and the card in full view (a plain jump, no glide), when the cube's bottom is off the screen */
function showBench(){ const r=stage.getBoundingClientRect(); if(r.bottom>innerHeight-8 || r.top<60) $("bench").scrollIntoView({block:"start"}); }
window.addEventListener("hashchange", () => { fewerStop(false); camClose(); mineMsg=null; doctor=null; flags=[]; peek=false; paintAll(); if(S.view==="solve") showBench(); });
/* the box's size: fixed when the page opens, set again only when the screen's width changes (turning it) */
let sizedW=0;
function setStageMax(){
  if(Math.abs(innerWidth-sizedW)<60 && sizedW) return;
  sizedW=innerWidth;
  document.documentElement.style.setProperty("--stage-max", Math.round(Math.min(560, Math.max(280, innerHeight-190)))+"px");
}
setStageMax();
let fitW=0;
const refit=() => { const w=stage.clientWidth; if(w && w!==fitW){ fitW=w; fit(); } };   /* only a real change of width redraws */
window.addEventListener("resize", () => { setStageMax(); refit(); });
if(window.ResizeObserver) new ResizeObserver(refit).observe(stage);
/* a trackpad pinch over the cube (Ctrl + wheel) would zoom the whole page; on the cube it does nothing */
stage.addEventListener("wheel", e => { if(e.ctrlKey) e.preventDefault(); }, {passive:false});
if(!location.hash && S.view && S.view!=="learn") history.replaceState(null,"","#"+S.view);
paintAll();
})();
