<title>The Cube Lab — Architecture of Grace</title>
<!-- AOG-CUBE-LAB-V1 (2026-10-10) — Jimmy: "a step by step 3d interactive engine … instructions on how to make and
     finish a rubric cube." A real 3D Rubik's Cube on the Lab Bench, drawn with CSS 3D (no canvas, no library):
     drag a row to turn it; Front and Back show every side. Ten short steps teach the layer-by-layer way
     (daisy, white cross, white corners, middle, yellow cross, yellow top, yellow corners, yellow edges).
     "Solve with me" solves any mixed cube with the very moves the steps teach (aog-cube.js), one move at a
     time. "My cube" paints a real cube's colours in, then helps finish it. Nothing moves until it is tapped. -->

<style>
:root {
  --bg:#f4f0e6; --card:#fffcf7; --ink:#1a232c; --muted:#5c6670; --line:#ddd8cc;
  --steel:#2f5c6b; --steel-fg:#f4f8f9; --steel-soft:#e3eef2;
  --good:#2c7a4e; --good-fg:#f3faf5; --good-soft:#e3f0e8;
  --warn:#7a4e00; --warn-soft:#f6ecd6;
  --chip:#efebe3; --stage-a:#fbf8f1; --stage-b:#e9e2d2;
  --shadow:0 1px 3px rgb(26 35 44 / .08);
  --sans:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  --display:"Fraunces", Georgia, serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.dark, [data-theme="dark"] {
  --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
  --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
  --good:#6fbf8b; --good-fg:#14181e; --good-soft:#1f3327;
  --warn:#e8c27a; --warn-soft:#332a18;
  --chip:#2a313c; --stage-a:#232b35; --stage-b:#161b22;
  --shadow:0 1px 3px rgb(0 0 0 / .35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
    --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
    --good:#6fbf8b; --good-fg:#14181e; --good-soft:#1f3327;
    --warn:#e8c27a; --warn-soft:#332a18;
    --chip:#2a313c; --stage-a:#232b35; --stage-b:#161b22;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.55 var(--sans); overflow-x:hidden; }
h1,h2,h3 { font-family:var(--display); font-weight:600; letter-spacing:-.01em; text-wrap:balance; }
h2 { font-size:1.35rem; margin:.1rem 0 .3rem; }
h3 { font-size:1.05rem; margin:1rem 0 .35rem; }
p, li { text-wrap:pretty; }
a { color:inherit; }
button, select { font:inherit; touch-action:manipulation; }
button { cursor:pointer; }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:.75rem; }
.brand { font-weight:700; text-decoration:none; }
.tools { display:flex; gap:.5rem; }
.pill, .btn {
  min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:0 1rem; font-weight:600; font-size:.95rem; display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
}
.btn-steel { background:var(--steel); color:var(--steel-fg); border-color:transparent; }
.btn-good { background:var(--good); color:var(--good-fg); border-color:transparent; }
.btn[disabled] { opacity:.55; cursor:default; }
.nav { display:flex; gap:4px; }
.nav a.on { color:var(--ink); border-color:var(--steel); }
.muted { color:var(--muted); }
.lead { max-width:66ch; }
.kicker { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); margin:0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }

/* the bench: the cube on the left, the words on the right; one column on a phone */
.cube-bench { display:grid; gap:1rem; margin-top:1rem; }
@media (min-width:900px){ .cube-bench { grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); align-items:start; }
  .cube-side { position:sticky; top:.75rem; } }
.cube-side { display:flex; flex-direction:column; gap:.6rem; min-width:0; }
.panel { padding:1rem 1.1rem 1.2rem; min-width:0; }

/* ── the 3D cube ── */
.stage *, .stage { touch-action:none; }
.stage { overscroll-behavior:contain; }
/* the whole cube fits on the screen with the card: never taller than the window allows */
/* AOG-CUBE-STEADY-V1 (2026-10-11) — Jimmy: "In the chrome version, when you scroll it goes large or small and makes me
   nauseous." The box was sized from the window's height, and Chrome's address bar changes that height while a page
   scrolls, so the cube grew and shrank. Now its size is set once (--stage-max, from the script) and changes only when
   the screen is turned, never while scrolling. */
.stage { max-width:var(--stage-max, 560px); }
#bench { scroll-margin-top:70px; }
.stage { position:relative; width:100%; margin:0 auto; aspect-ratio:1/1; border-radius:18px; overflow:hidden;
  background:radial-gradient(120% 95% at 50% 35%, var(--stage-a) 0%, var(--stage-b) 100%); border:1px solid var(--line);
  perspective:1150px; /* set from the cube's size in fit(), PERSP in the script */ perspective-origin:50% 45%; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; cursor:grab; }
.stage.grabbing { cursor:grabbing; }
.stage .floor { position:absolute; left:20%; right:20%; bottom:7%; height:9%; border-radius:50%;
  background:radial-gradient(closest-side, rgb(0 0 0 / .22), rgb(0 0 0 / 0)); pointer-events:none; }
.cube-view { position:absolute; left:50%; top:48%; width:0; height:0; transform-style:preserve-3d; will-change:transform; }
/* AOG-CUBE-SMOOTH-V1 (2026-10-11) — Jimmy: "A go back button needs to appear also … when your rotating it, lags and it
   seems difficult to follow." Undo sits on the cube itself, and Front view appears once the cube has been turned around.
   Looking around now moves only the view (one transform per frame, never every piece), a little slower, and never
   tips the cube past 60°, so it stays easy to follow. */
.stage-tools { position:absolute; left:10px; right:10px; bottom:10px; display:flex; justify-content:space-between; gap:.5rem; pointer-events:none; }
.stage-tools button { pointer-events:auto; min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .95rem; font:600 .95rem/1 var(--sans); box-shadow:var(--shadow); }
.stage-tools button[hidden] { display:none; }
.stage-tools .spacer { flex:1; }
.cubie { position:absolute; width:var(--s,64px); height:var(--s,64px); left:calc(var(--s,64px) / -2); top:calc(var(--s,64px) / -2); transform-style:preserve-3d; }
.face { position:absolute; inset:0; background:#121418; border-radius:4%; pointer-events:none; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
.face.fF { transform:translateZ(calc(var(--s,64px) / 2)); }
.face.fB { transform:rotateY(180deg) translateZ(calc(var(--s,64px) / 2)); }
.face.fR { transform:rotateY(90deg) translateZ(calc(var(--s,64px) / 2)); }
.face.fL { transform:rotateY(-90deg) translateZ(calc(var(--s,64px) / 2)); }
.face.fU { transform:rotateX(90deg) translateZ(calc(var(--s,64px) / 2)); }
.face.fD { transform:rotateX(-90deg) translateZ(calc(var(--s,64px) / 2)); }
.face i { position:absolute; inset:6.5%; border-radius:13%; background:var(--c); overflow:hidden; display:flex; align-items:center; justify-content:center; }
.face i { pointer-events:auto; }
.face i b { position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; }
.face i span { position:relative; font:800 calc(var(--s,64px) * .34)/1 var(--sans); color:var(--lc,#14161a); pointer-events:none; }
.stage.painting .face i { cursor:pointer; }
.face i.flag { box-shadow:inset 0 0 0 calc(var(--s,64px) * .085) #14161a; }
/* the piece to watch: a still dark dot with a white rim in the middle of each of its stickers, clear on every color */
.face i.flag::after { content:""; position:absolute; left:50%; top:50%; width:30%; height:30%; transform:translate(-50%,-50%); border-radius:50%;
  background:#14161a; box-shadow:0 0 0 calc(var(--s,64px) * .04) #fff; }
.fixbox { border:2px solid var(--steel); border-radius:12px; padding:.75rem .9rem; margin:.7rem 0; background:var(--steel-soft); }
.fixbox h3 { margin:.1rem 0 .4rem; }
.fixbox ul { margin:.3rem 0 .5rem; padding-left:1.2rem; }
.stage-hint { text-align:center; margin:.1rem 0 0; font-size:.92rem; color:var(--muted); }
.view-row { display:flex; flex-wrap:wrap; justify-content:center; gap:.4rem; }
.view-row .pill { min-height:44px; font-size:.9rem; }
.look-row { display:flex; justify-content:center; margin:.1rem 0 0; }
.looks { display:inline-flex; align-items:center; gap:.3rem; }
.looks .lk { font-size:.8rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-right:.15rem; }
.looks .lookb { min-width:92px; font-size:1rem; }
.looks .lookb.on { background:var(--steel); color:var(--steel-fg); border-color:transparent; }
.view-row select { min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .8rem; font-size:16px; font-weight:600; }

/* the turn pad: six faces, each way, and turning the whole cube */
.pad { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:.35rem; max-width:560px; margin:0 auto; width:100%; }
.pad button { min-height:48px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:700 1.05rem/1 var(--mono); }
.pad button.prime { background:var(--chip); }
.pad .lbl { grid-column:1/-1; font-size:.8rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:.35rem 0 0; }
.pad .whole { grid-column:span 3; font-family:var(--sans); font-size:.95rem; }
.pad .act { grid-column:span 2; font-family:var(--sans); font-size:.95rem; }
.pad .act.go { background:var(--steel); color:var(--steel-fg); border-color:transparent; }

/* the arrow for the next move: a dark line with a light edge, so it reads on every color; it never moves */
.stage .arrow { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.arrow .halo { fill:#fff; stroke:#fff; stroke-width:11; stroke-linecap:round; stroke-linejoin:round; fill-opacity:1; }
.arrow path.halo:first-child { fill:none; }
.arrow .line { fill:none; stroke:#14161a; stroke-width:6; stroke-linecap:round; stroke-linejoin:round; }
.arrow .head { fill:#14161a; stroke:#14161a; stroke-width:2; stroke-linejoin:round; }
.arrow .x2 { font:800 22px/1 var(--sans); fill:#14161a; paint-order:stroke; stroke:#fff; stroke-width:5px; }
/* the calm card: the goal, the move in words, one button */
.calm .aim { margin:.2rem 0 .6rem; color:var(--muted); font-size:1rem; }
.calm .move-big { font:600 clamp(1.35rem, 1.2rem + 1vw, 1.75rem)/1.25 var(--display); margin:.2rem 0 .6rem; }
.calm .move-big { margin-bottom:.9rem; }
.progress { margin:.1rem 0 .6rem; font-weight:600; color:var(--ink); }
.calm .keys { display:none; margin:.4rem 0 0; font-size:.88rem; color:var(--muted); }
@media (hover:hover) and (pointer:fine){ .calm .keys { display:block; } }
.btn:active:not([disabled]) { transform:translateY(1px); filter:brightness(.92); }
.startat { display:inline-flex; align-items:center; gap:.4rem; flex-wrap:wrap; }
.startat span { font-size:.9rem; color:var(--muted); font-weight:600; }
.startat select { min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .8rem; font-size:16px; font-weight:600; }
.calm .note { background:var(--steel-soft); border-radius:10px; padding:.45rem .7rem; margin:.2rem 0 .6rem; }
.calm .btn.goal { margin-top:.2rem; }
.calm ol.last { margin:.2rem 0 .6rem; padding-left:1.3rem; }
@media (max-width:600px){ .calm .btn-row .btn.big { flex:1 1 100%; } }
.calm .move-big .once { display:block; font:700 .95rem/1.2 var(--sans); color:var(--steel); margin-bottom:.2rem; }
.calm .move-big .tok { font:700 .95rem/1 var(--mono); color:var(--muted); background:var(--chip); border-radius:6px; padding:.2rem .4rem; vertical-align:middle; }
.calm .chips .chip { font-size:.85rem; padding:.3rem .4rem; min-width:1.8rem; }
.btn.big { min-height:60px; padding:0 1.5rem; font-size:1.1rem; }
.calm details.more { margin-top:.7rem; color:var(--muted); }
.calm details.more summary { cursor:pointer; min-height:44px; display:flex; align-items:center; font-weight:600; }
.dots { display:flex; gap:.4rem; margin:.35rem 0 .9rem; }
.dots .dot { width:.7rem; height:.7rem; border-radius:50%; border:2px solid var(--steel); }
.dots .dot.done { background:var(--steel); }
.dots .dot.now { background:var(--steel-soft); box-shadow:0 0 0 3px var(--steel-soft); }
/* Solve with me: no turn pad (the steps say every move), and on a phone the card sits right under the cube */
.cube-bench.solving .pad { display:none; }
@media (max-width:899px){ .cube-bench { display:flex; flex-direction:column; } .cube-side { display:contents; }
  .stage { order:1; } .look-row { order:2; } .stage-hint { order:3; } .cube-bench > .panel { order:4; } .view-row { order:5; } .pad { order:6; } }
.btn-row.start { flex-direction:column; align-items:stretch; max-width:22rem; }
.btn-row.quiet { margin-top:1.2rem; }
.btn-row.quiet .btn { font-size:.9rem; color:var(--muted); }
a.btn { text-decoration:none; }
/* words */
.steps { margin:.4rem 0 .2rem; padding-left:1.4rem; }
.steps li { margin:.35rem 0; }
.goal { background:var(--steel-soft); border-radius:10px; padding:.55rem .8rem; margin:.5rem 0; }
.alg { margin:.7rem 0; padding:.7rem .8rem; border-radius:12px; border:1px solid var(--line); background:var(--bg); }
.alg .name { font-weight:700; margin:0 0 .35rem; }
.chips { display:flex; flex-wrap:wrap; gap:.3rem; margin:.2rem 0 .5rem; }
.chip { font:700 1.02rem/1 var(--mono); padding:.45rem .55rem; border-radius:8px; background:var(--chip); color:var(--ink); border:1px solid transparent; min-width:2.2rem; text-align:center; }
.chip.done { opacity:.5; }
.chip.next { background:var(--steel); color:var(--steel-fg); }
.btn-row { display:flex; flex-wrap:wrap; gap:.45rem; margin:.4rem 0; }
.state { border-radius:10px; padding:.6rem .8rem; margin:.6rem 0; font-weight:600; }
.state.ok { background:var(--good-soft); color:var(--ink); }
.state.warn { background:var(--warn-soft); color:var(--ink); }
.say { margin:.3rem 0 .4rem; font-size:1.02rem; }
.stagelist { list-style:none; padding:0; margin:.4rem 0 .8rem; display:grid; gap:.2rem; }
.stagelist li { display:flex; gap:.5rem; align-items:baseline; padding:.25rem .4rem; border-radius:8px; }
.stagelist li.now { background:var(--steel-soft); font-weight:700; }
.stagelist li .mk { width:1.2rem; flex:0 0 auto; color:var(--good); font-weight:800; }
.palette { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:.4rem; margin:.5rem 0; }
.palette button { min-height:48px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink); display:flex; align-items:center; gap:.5rem; padding:0 .6rem; font-weight:600; font-size:.95rem; }
.palette button.on { border-color:var(--steel); box-shadow:0 0 0 2px var(--steel); }
.palette .sw { width:1.5rem; height:1.5rem; border-radius:6px; border:1px solid rgb(0 0 0 / .25); flex:0 0 auto; }
.palette .n { margin-left:auto; font-variant-numeric:tabular-nums; color:var(--muted); font-size:.85rem; }
.lesson-nav { display:flex; justify-content:space-between; gap:.5rem; margin-top:1rem; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
footer p { margin-top:2rem; font-size:.9rem; color:var(--muted); max-width:70ch; }
@media print { .no-print { display:none !important; } }

/* AOG-CUBE-CEILING-V1 (2026-10-11) — the named moves, kinds of help, the real-cube check, symbols, the camera, the card */
.calm .chunk { margin:.1rem 0 .3rem; font-weight:600; color:var(--steel); }
.calm .cdots { display:flex; flex-wrap:wrap; gap:.3rem; margin:0 0 .7rem; }
.calm .cdots span { width:.62rem; height:.62rem; border-radius:50%; border:2px solid var(--steel); }
.calm .cdots span.gap { margin-left:.55rem; }
.calm .cdots span.done { background:var(--steel); }
.calm .cdots span.now { background:var(--steel-soft); box-shadow:0 0 0 3px var(--steel-soft); }
.calm .move-big.quiet { font:500 1.05rem/1.4 var(--sans); color:var(--ink); }
.note.checkin { background:var(--good-soft); border-radius:12px; padding:.6rem .8rem; margin:0 0 .8rem; }
.note.checkin p { margin:.1rem 0 .4rem; font-weight:600; }
/* symbols on the stickers, for telling colors apart without color */
.stage.symbols .face i::before { content:attr(data-sym); position:relative; font:800 calc(var(--s,64px) * .4)/1 var(--sans); color:var(--lc,#14161a); pointer-events:none; }
.stage.symbols .face i.flag::before, .stage.symbols.letters .face i.ctr::before { position:absolute; left:8%; top:6%; font-size:calc(var(--s,64px) * .22); }
.palette .sym { font-weight:800; width:1.2rem; text-align:center; }
/* the camera: one quiet sheet over the page */
.cam { position:fixed; inset:0; z-index:2147483600; background:var(--bg); overflow:auto; overscroll-behavior:contain; padding:max(12px, env(safe-area-inset-top)) 16px 24px; }
.cam .in { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:.6rem; }
.cam h2 { margin:.3rem 0 0; }
.cam .box { position:relative; width:100%; aspect-ratio:1/1; border-radius:16px; overflow:hidden; background:#000; }
.cam video { width:100%; height:100%; object-fit:cover; display:block; }
.cam video.mirror { transform:scaleX(-1); }
.cam .grid { position:absolute; inset:15%; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); border:3px solid #fff; border-radius:10px; box-shadow:0 0 0 2px #14161a, 0 0 0 999px rgb(0 0 0 / .32); pointer-events:none; }
.cam .grid span { border:1.5px solid rgb(255 255 255 / .85); }
.cam .sides { display:flex; gap:.35rem; }
.cam .sides span { flex:1; height:.5rem; border-radius:999px; background:var(--line); }
.cam .sides span.done { background:var(--steel); }
.cam .say { font-weight:600; }
/* the printed move card: only on paper */
#printCard { display:none; }
@media print { body.printing .wrap { display:none !important; } body.printing #printCard { display:block; color:#000; background:#fff; font:400 12pt/1.4 var(--sans); }
  #printCard table { border-collapse:collapse; width:100%; margin:.4rem 0 .8rem; } #printCard td, #printCard th { border:1px solid #999; padding:.25rem .4rem; text-align:left; vertical-align:top; }
  #printCard .m { font:700 12pt/1.2 var(--mono); white-space:nowrap; } }
@media (max-width:420px){ .pad button { min-height:46px; } .panel { padding:.9rem .85rem 1.1rem; } }

    <a class="brand" href="/cube" id="brand">The Cube Lab</a>
    <div class="tools">

      <button type="button" class="pill" id="themeBtn">Dark</button>

      <div class="look-row no-print" id="lookRow"></div>
      <p class="stage-hint" id="hint"></p>
      <div class="view-row no-print" id="viewRow"></div>
      <div class="pad no-print" id="pad"></div>
      <p class="sr" id="live" aria-live="polite"></p>
      <p class="sr" id="cubeDesc"></p>
    </div>
    <section class="panel card" id="panel" aria-live="off"></section>
  </main>
  <footer><p id="foot"></p></footer>
</div>

const LIGHT=(()=>{ const v=[-0.35,-0.8,0.6], n=Math.hypot(...v); return v.map(x=>x/n); })();
function toView(v){ return C.mulV(VIEW, [v[0], -v[1], v[2]]); }   /* model → CSS (y down) → the view's turn */
const viewCSS=() => { const V=VIEW; return `matrix3d(${V[0]},${V[3]},${V[6]},0,${V[1]},${V[4]},${V[7]},0,${V[2]},${V[5]},${V[8]},0,0,0,0,1)`; };

/* a quarter turn of the view, eased, then it rests */
let lookAnim=0;

  cancelAnimationFrame(lookAnim);

  if(!dur){ end(); return; }
  const step=now => { const k=Math.min(1,(now-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    if(k>=1){ end(); return; }

      const R=mul3(target, [from[0],from[3],from[6],from[1],from[4],from[7],from[2],from[5],from[8]]);
      const c=Math.max(-1,Math.min(1,(R[0]+R[4]+R[8]-1)/2)), th=Math.acos(c);

const SG=[1,-1,1];
function render(anim){
  const g=size*1.015;

  const R=anim ? C.rot(anim.a, anim.th) : null;
  const SHOW=goalView || cube;                                             /* "Show me the goal" draws the finished step */
  SHOW.P.forEach((p,i) => {
    if(anim && !anim.set.has(i)) return;                                  /* a turn: only the pieces that move */
    let M=p.M; if(anim && anim.set.has(i)) M=C.mulM(R, M);
    const pos=C.mulV(M, p.home), m=[];
    for(let r=0;r<3;r++) for(let c=0;c<3;c++) m[r*3+c]=M[r*3+c]*SG[r]*SG[c];
    const E=els[i];
    E.el.style.transform=`matrix3d(${m[0]},${m[3]},${m[6]},0,${m[1]},${m[4]},${m[7]},0,${m[2]},${m[5]},${m[8]},0,${pos[0]*g},${-pos[1]*g},${pos[2]*g},1)`;
    for(const f in p.cols){
      const F=E.faces[f]; const n=C.mulV(M, C.FACES[f]), nv=toView(n);
      const lit=Math.max(0, nv[0]*LIGHT[0]+nv[1]*LIGHT[1]+nv[2]*LIGHT[2]);
      const fs=turnFocus || focusSet, dimmed=!painting && !anim && fs && !fs.has(i);
      F.sh.style.opacity=painting ? "0" : dimmed ? (turnFocus ? "0.42" : "0.62") : (0.24*(1-lit)).toFixed(3);   /* a turn under way: the rest of the cube steps back */   /* painting: flat colours, so white never reads as grey */
      if(anim) continue;

      const col=!painting ? disp(p.cols[f]) : (peek && doctor) ? (doctor.raw[k2]||"?") : (S.paint[k2] || (p.kind===1 ? S.scheme[wf] : "?"));
      const flag=painting ? (p.kind>1 && flags.some(q => q.join(",")===pk)) : (!goalView && i===markIdx);   /* the piece to watch */
      if(F.flag!==flag){ F.st.classList.toggle("flag", flag); F.flag=flag; }
      if(F.col!==col){ F.st.style.setProperty("--c", COL[col]); F.st.style.setProperty("--lc", INK[col]); F.st.setAttribute("data-sym", SYM[col]||""); F.col=col; }
      if(F.lab){ const txt=(S.letters && !painting) ? wf : ""; if(F.lab.textContent!==txt) F.lab.textContent=txt; }

/* the next move, drawn on the cube: a straight arrow along the row that turns, or a round one on the face you look at */
function projector(){
  const W=stage.clientWidth, H=stage.clientHeight, ox=W*.5, oy=H*.48, px=W*.5, py=H*.45, g=size*1.015;
  return v => { const q=toView(v); const X=q[0]*g, Y=q[1]*g, Z=q[2]*g, s=PERSP/(PERSP-Z); return [px+(ox+X-px)*s, py+(oy+Y-py)*s]; };
}
let arrowGeo=null;   /* the arrow on screen (stage pixels) and its move, so a finger can follow it */
/* how near a point is to the arrow, and which way the arrow runs there */

function stageTools(){

function fit(){ const w=stage.clientWidth||320; size=Math.max(30, Math.round(w/5.7)); PERSP=Math.round(size*17); stage.style.perspective=PERSP+"px";   /* small enough to stay whole in the box, whichever way it is turned */ stage.style.setProperty("--s", size+"px"); render(); }

/* ── turning, one move at a time ── */
const queue=[]; let busy=false, runner=null;
const SPEED={slow:620, normal:300, instant:0};

function enqueue(tokens, src){ C.split(tokens).forEach(tok => queue.push({tok, src})); pump(); }

    const dur=SPEED[S.speed]*(Math.abs(mv.q)===2?1.45:1);

}
function stopQueue(){ queue.length=0; runner=null; }

/* everything that follows a move */
function after(job){

  const nx=guide && guide.flat[guide.i];
  if(nx && nx.tok===tok){ guide.i++; guide.key=cube.toJSON(); }
  else if(nx && nx.tok===C.parse(tok).base+"2" && Math.abs(C.parse(tok).q)===1){ nx.tok=tok; nx.half=true; guide.key=cube.toJSON(); }   /* half of a "twice": one more the same way */

  /* AOG-CUBE-TIME-V1 (2026-10-11) — Jimmy: "look at the seconds it took" (it said 128:05). The clock now counts only
     time spent turning: a pause (a break, a chat, the page left open overnight) adds at most 30 seconds, the

  if(S.mix && cube.solved()){ S.result={ms:S.mix.active||0, moves:S.mix.moves, by:S.mix.by||{}, help:S.mix.help||{}}; S.mix=null; if(S.lesson===9 && S.view==="learn") S.done[9]=1; }

/* ── the teacher's plan for this cube ── */
let guide=null;
function getGuide(){
  const key=cube.toJSON();
  if(!guide || guide.key!==key){
    const r=C.plan(cube), flat=[];
    r.stages.forEach((st,si) => st.parts.forEach((p,pi) => p.moves.forEach((tok,mi) => flat.push({tok, si, pi, mi}))));
    guide={r, flat, i:0, key};
  }

}
function guideNow(){ const g=getGuide(), f=g.flat[g.i]; if(!f) return null; const st=g.r.stages[f.si], p=st.parts[f.pi];
  const left=g.flat.slice(g.i).filter(x => x.si===f.si && x.pi===f.pi).length; return {g, f, st, p, left}; }

/* ── the words beside the cube ── */

/* AOG-CUBE-GUIDE-PLUS-V1 (2026-10-11) — from a review Jimmy passed on: mark the piece the step is about (a still

}

/* AOG-CUBE-CHUNKS-V1 — where the part's named moves start (the turns before them only get the cube ready), and

/* time in plain words: "under a minute", "about 12 minutes", "1 hour and 5 minutes" */
function clock(ms){
  const m=Math.round(ms/60000), h=Math.floor(m/60), r=m%60;
  if(m<1) return es()?"menos de un minuto":"under a minute";
  if(!h) return es()?`unos ${m} ${m===1?"minuto":"minutos"}`:`about ${m} ${m===1?"minute":"minutes"}`;
  const hs=es()?`${h} ${h===1?"hora":"horas"}`:`${h} ${h===1?"hour":"hours"}`;
  return r ? (es()?`${hs} y ${r} ${r===1?"minuto":"minutos"}`:`${hs} and ${r} ${r===1?"minute":"minutes"}`) : hs;
}

function playAlg(k, how){
  const [li,ai]=k.split(":").map(Number), moves=C.split(L[li].algs[ai].s);
  if(algAt.k!==k){ algAt={k, i:0}; if(how==="one"){ panel(); return; } }   /* the first tap shows the first move and its arrow */
  if(how==="all"){ const rest=moves.slice(algAt.i); algAt={k:null,i:0}; runner={left:rest.length}; enqueue(rest,"play"); }
  else { const tok=moves[algAt.i]; algAt.i++; if(algAt.i>=moves.length) algAt={k:null,i:0}; enqueue([tok],"play"); }
}

function act(a){
  const i=S.lesson; acted=true;
  if(a==="ready"){ S.done[i]=1; save(); panel(); bar(); }
  else if(a==="prev"){ pick(i-1); }
  else if(a==="nextLesson"){ pick(i+1); }
  else if(a==="mix"){ S.drill=null; checkIn=false; stopQueue(); cube=new C.Cube().run(C.scramble()); S.real=false; setTimeout(showBench, 0); S.hist=[]; S.mix={t0:null,moves:0}; S.result=null; S.showHint=false; guide=null; S.practice=S.lesson; save(); render(); panel(); }
  else if(a==="fresh"){ S.drill=null; checkIn=false; stopQueue(); cube=new C.Cube(); S.hist=[]; S.mix=null; S.result=null; guide=null; save(); render(); panel(); }
  else if(a==="setup"){ setup(L[i].stage); }
  else if(a==="hint"){ S.showHint=true; panel(); }
  else if(a==="gnext"){ const n=guideNow(); if(n && !busy && !queue.length) enqueue([n.f.tok],"guide"); }
  else if(a==="gpart"){ const n=guideNow(); if(n && !busy && !queue.length){ const rest=n.g.flat.slice(n.g.i, n.g.i+n.left).map(x=>x.tok); runner={left:rest.length}; enqueue(rest,"guide"); panel(); } }
  else if(a==="focus"){ S.focus=!S.focus; save(); panel(); }
  else if(a==="reveal"){ reveal.n=Math.min(2, reveal.n+1); acted=true; panel(); }
  else if(a==="undrill"){ S.drill=null; act("mix"); }
  else if(a==="checkYes"){ checkIn=false; panel(); }
  else if(a==="camera"){ camOpen(); }
  else if(a==="print"){ printCard(); }
  else if(a==="startAt"){ /* handled by the select */ }
  else if(a==="goal"){ goalView = goalView ? null : goalOf(); render(); panel(); }
  else if(a==="repaint"){ act("copyMine"); location.hash="mine"; }
  else if(a==="own"){ S.lesson=9; S.showHint=false; save(); location.hash="learn"; act("mix"); }
  else if(a==="stop"){ stopQueue(); panel(); }
  else if(a==="undo"){ if(!busy && !queue.length && S.hist.length) enqueue([C.invert(S.hist[S.hist.length-1])],"undo"); }
  else if(a==="clearMine"){ S.paint={}; mineMsg=null; doctor=null; flags=[]; save(); render(); panel(); }
  else if(a==="copyMine"){ doctor=null; flags=[]; S.paint={}; const held=heldWhiteDown(cube); C.FACE_NAMES.forEach(f => C.facelets(f).forEach(([pos,dir]) => { S.paint[pos.join(",")+"|"+f]=disp(held.colorAt(pos,dir)); })); mineMsg=null; save(); render(); panel(); }
  else if(a==="checkMine"){ checkMine(); }
  else if(a==="fixPeek"){ peek=!peek; render(); panel(); }
  else if(a==="fixDone" && doctor){
    doctor.fixes[doctor.i].edits.forEach(e => { S.paint[e.pos.join(",")+"|"+e.f]=disp(e.to); });
    save(); peek=false;
    if(++doctor.i<doctor.fixes.length){ flags=doctor.fixes[doctor.i].spots; render(); panel(); }
    else { doctor=null; flags=[]; checkMine(); }
  }
}
/* the screen cube, turned so its centres sit like a fresh one (yellow up, green in front) */
function heldWhiteDown(c){ for(const a of ["","x","x'","x2","z","z'"]) for(const b of ["","y","y2","y'"]){ const t=c.clone().run(a+" "+b); if(t.center("U")==="Y" && t.center("F")==="G") return t; } return c.clone(); }
/* every square of the painted cube, centres included (a centre not painted keeps this cube's color) */
function rawPaint(){ const raw={}; C.FACE_NAMES.forEach(f => C.facelets(f).forEach(([pos]) => { const k=pos.join(",")+"|"+f;
  const isC=Math.abs(pos[0])+Math.abs(pos[1])+Math.abs(pos[2])===1; raw[k]=S.paint[k] || (isC ? S.scheme[f] : "?"); })); return raw; }
function checkMine(){
  doctor=null; flags=[]; peek=false;
  const raw=rawPaint(), centers={};
  C.FACE_NAMES.forEach(f => { centers[f]=raw[C.FACES[f].join(",")+"|"+f]; });
  if(new Set(Object.values(centers)).size<6){ mineMsg={ok:false, text:t("errCenters")}; render(); panel(); return; }
  const toSolver={}; C.FACE_NAMES.forEach(f => { toSolver[centers[f]]=C.HOME_COLOR[f]; });
  const stray=Object.values(raw).find(c => c!=="?" && !toSolver[c]);
  if(stray){ mineMsg={ok:false, text:t("errStray",{c:cn(stray)})}; render(); panel(); return; }
  S.scheme=centers; save();                                   /* from now on the lab draws this cube's own colors */
  const cols={}; Object.keys(raw).forEach(k => { cols[k]=toSolver[raw[k]]||"?"; });
  const d=C.diagnose(cols);
  if(d.error==="count"){ mineMsg={ok:false, text:t("errCount",{c:cnd(d.col).replace(/^./,x=>x.toUpperCase()), n:d.n})}; render(); panel(); return; }
  if(d.error==="stickers"){ mineMsg={ok:false, text:t("errStickers")}; flags=d.spots; VIEW=HOME_VIEW.slice(); render(); panel(); return; }
  if(d.fixes.length){ mineMsg=null; doctor={fixes:d.fixes, raw:Object.fromEntries(Object.entries(d.fixed).map(([k,v]) => [k,disp(v)])), i:0}; flags=d.fixes[0].spots; VIEW=HOME_VIEW.slice(); render(); panel();
    const box=document.querySelector("#panel .fixbox"); if(box && box.scrollIntoView) box.scrollIntoView({block:"nearest"}); return; }
  const r=C.fromFacelets(cols);
  if(r.error==="twist") mineMsg={ok:false, text:t("errTwist")};
  else if(r.error) mineMsg={ok:false, text:t("errPiece")};
  else { mineMsg={ok:true, text:t("allGood")}; cube=r.cube; cubeBeforePaint=null; painting=false; S.real=true; S.drill=null; S.realStage=C.stageOf(r.cube); checkIn=false; S.hist=[]; S.mix={t0:null,moves:0}; S.result=null; guide=null; save(); location.hash="solve"; return; }
  panel();
}
/* a cube with every step before this one done, and this one still to do */
function setup(stageIdx){
  stopQueue();
  for(let tries=0; tries<40; tries++){
    const c=new C.Cube().run(C.scramble()), r=C.plan(c);
    r.stages.forEach(st => { if(st.key==="hold" || C.STAGES.indexOf(st.key)<stageIdx) st.parts.forEach(p => c.run(p.moves)); });
    if(C.stageOf(c)===stageIdx){ cube=c; break; }
  }
  S.hist=[]; S.mix=null; S.result=null; S.showHint=false; guide=null; S.practice=S.lesson; save(); render(); panel();
}

/* AOG-CUBE-STILL-V1 (2026-10-11) — Jimmy (iPad): "I am still having challenges with moving the screen when I am working

  const SH=goalView || cube, raw=painting ? rawPaint() : null;
  el.textContent=t("descH")+" "+["F","R","B","L","U","D"].map(f => tx(T.sideName[f]).replace(/^./,x=>x.toUpperCase())+": "
    +C.facelets(f).map(([pos,dir]) => cn(painting ? raw[pos.join(",")+"|"+f] : disp(SH.colorAt(pos,dir)))).join(", ")).join(". ")+".";
}
/* AOG-CUBE-CARD-V1 — a move card to print and keep beside a real cube */
function printCard(){
  const el=$("printCard"), row=tok => `<tr><td class="m">${esc(tok)}</td><td>${esc(words(tok))}</td><td class="m">${esc(tok+"'")}</td><td>${esc(words(tok+"'"))}</td></tr>`;
  el.innerHTML=`<h1>${esc(t("cardH"))}</h1><p>${esc(t("cardHold"))}</p><h2>${esc(t("cardMoves"))}</h2>
    <table>${["U","D","R","L","F","B","y"].map(row).join("")}</table>
    <h2>${esc(t("cardTricks"))}</h2><table>${L.filter(l => l.algs && l.stage!==undefined).map(l => l.algs.map(a => `<tr><td>${esc(tx(l.t))}</td><td>${esc(tx(a.n))}</td><td class="m">${esc(a.s)}</td></tr>`).join("")).join("")}</table>
    <p>architectureofgrace.com/cube</p>`;
  document.body.classList.add("printing");
  const done=() => { document.body.classList.remove("printing"); window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  window.print(); setTimeout(done, 1500);
}
/* AOG-CUBE-CAMERA-V1 — read a real cube with the camera, on this device only: six sides, each held up inside the
   square, then the colors are painted in for the learner to check. Every square goes to the center it is closest to,
   nine to each, so a dim room or a warm lamp still sorts them; then each center is named by its hue. */
function toLab(rgb){
  const f=c => { c/=255; return c<=.04045 ? c/12.92 : Math.pow((c+.055)/1.055, 2.4); };
  const r=f(rgb[0]), g=f(rgb[1]), b=f(rgb[2]);
  const X=(r*.4124+g*.3576+b*.1805)/.95047, Y=r*.2126+g*.7152+b*.0722, Z=(r*.0193+g*.1192+b*.9505)/1.08883;
  const h=v => v>.008856 ? Math.cbrt(v) : 7.787*v+16/116;
  return [116*h(Y)-16, 500*(h(X)-h(Y)), 200*(h(Y)-h(Z))];
}
function hsv(rgb){ const [r,g,b]=rgb.map(x=>x/255), mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0; if(d){ h = mx===r ? ((g-b)/d)%6 : mx===g ? (b-r)/d+2 : (r-g)/d+4; h*=60; if(h<0) h+=360; }
  return [h, mx ? d/mx : 0, mx]; }
/* typical hues of cube colors; white is the one with little color */
const HUE={R:355, O:25, Y:55, G:140, B:215, P:275, K:330};
function nameCenter(rgb, c){
  const [h,s,v]=hsv(rgb);
  if(c==="W") return s<.28 ? 0 : 2+s*4;
  if(s<.2) return 3;
  const dh=Math.min(Math.abs(h-HUE[c]), 360-Math.abs(h-HUE[c]));
  return dh/40 + (c==="K" && s>.75 ? .6 : 0) + (c==="R" && s<.5 ? .4 : 0);
}
function readColors(samples){   /* samples: {F:[9 rgb], R:…, B:…, L:…, U:…, D:…} → {key: color letter} */
  const faces=Object.keys(samples), all=[];
  faces.forEach(f => samples[f].forEach((rgb,j) => all.push({f, j, lab:toLab(rgb), rgb})));
  const centers=faces.map(f => ({f, lab:toLab(samples[f][4]), rgb:samples[f][4], n:0}));
  /* each square to the nearest center with room left (nine each), the closest pairs first */
  const pairs=[]; all.forEach((q,a) => centers.forEach((c,b) => pairs.push([Math.hypot(q.lab[0]-c.lab[0], q.lab[1]-c.lab[1], q.lab[2]-c.lab[2])*(q.j===4 && q.f===c.f ? 0 : 1), a, b])));
  pairs.sort((x,y) => x[0]-y[0]);
  const got=new Array(all.length).fill(-1);
  for(const [,a,b] of pairs){ if(got[a]>=0 || centers[b].n>=9) continue; got[a]=b; centers[b].n++; }
  /* name the six centers: the best match of six different colors */
  /* white balance: the center with the least color is taken as white, so a warm lamp or blue shade does not tint the names */
  const wc=centers.slice().sort((a,b) => hsv(a.rgb)[1]-hsv(b.rgb)[1])[0].rgb, avg=(wc[0]+wc[1]+wc[2])/3, wb=wc.map(v => avg/Math.max(1,v));
  const bal=rgb => rgb.map((v,i) => Math.min(255, v*wb[i]));
  const LET=["W","Y","G","B","O","R","P","K"], cost=centers.map(c => LET.map(l => nameCenter(bal(c.rgb), l)));
  let best=null;
  const go=(i, used, sum, pick) => { if(best && sum>=best.sum) return; if(i===centers.length){ best={sum, pick:pick.slice()}; return; }
    for(let k=0;k<LET.length;k++){ if(used&(1<<k)) continue; pick.push(LET[k]); go(i+1, used|(1<<k), sum+cost[i][k], pick); pick.pop(); } };
  go(0, 0, 0, []);
  const out={}; all.forEach((q,a) => { const [pos]=C.facelets(q.f)[q.j]; out[pos.join(",")+"|"+q.f]=best.pick[got[a]]; });
  return out;
}
const CAM_ORDER=["F","R","B","L","U","D"];
let cam=null;
function camOpen(){
  camClose();
  const box=document.createElement("div"); box.className="cam"; box.setAttribute("role","dialog"); box.setAttribute("aria-modal","true"); box.setAttribute("aria-label", t("camH"));
  document.body.appendChild(box); document.body.style.overflow="hidden";
  cam={box, i:0, samples:{}, facing:"user", stream:null};
  camDraw(); camStart();
}
function camDraw(){
  if(!cam) return;
  const i=cam.i;
  cam.box.innerHTML=`<div class="in"><h2>${esc(t("camH"))}</h2><p class="muted">${esc(t("camPrivacy"))}</p>
    <div class="sides" aria-hidden="true">${CAM_ORDER.map((f,k)=>`<span class="${k<i?"done":""}"></span>`).join("")}</div>
    <p class="kicker">${esc(t("camN",{i:i+1}))}</p><p class="say">${esc(t("cam"+(i+1)))}</p>
    <div class="box"><video playsinline muted autoplay class="${cam.facing==="user"?"mirror":""}"></video><div class="grid" aria-hidden="true">${"<span></span>".repeat(9)}</div></div>
    ${cam.err?`<p class="state warn">${esc(t("camNo"))}</p>`:""}
    <div class="btn-row"><button type="button" class="btn btn-good big" data-cam="take" ${cam.err?"disabled":""}>${esc(t("camTake"))}</button>
    <button type="button" class="btn" data-cam="back" ${i?"":"disabled"}>${esc(t("camRetake"))}</button></div>
    <div class="btn-row quiet"><button type="button" class="btn" data-cam="switch">${esc(t("camSwitch"))}</button><button type="button" class="btn" data-cam="close">${esc(t("camClose"))}</button></div></div>`;
  const v=cam.box.querySelector("video"); if(cam.stream){ v.srcObject=cam.stream; v.play && v.play().catch(()=>{}); }
  cam.box.querySelectorAll("[data-cam]").forEach(b => b.onclick=() => {
    const k=b.getAttribute("data-cam");
    if(k==="take") camTake(); else if(k==="back"){ cam.i=Math.max(0,cam.i-1); camDraw(); }
    else if(k==="switch"){ cam.facing=cam.facing==="user"?"environment":"user"; camStop(); camStart(); camDraw(); } else camClose();
  });
}
function camStart(){
  if(!cam) return;
  const md=navigator.mediaDevices;
  if(!md || !md.getUserMedia){ cam.err=true; camDraw(); return; }
  const mine=cam;
  md.getUserMedia({video:{facingMode:cam.facing, width:{ideal:960}, height:{ideal:960}}, audio:false}).then(st => {
    if(cam!==mine){ st.getTracks().forEach(tr => tr.stop()); return; }
    cam.stream=st; cam.err=false; const v=cam.box.querySelector("video"); if(v){ v.srcObject=st; v.play && v.play().catch(()=>{}); }
    const tb=cam.box.querySelector('[data-cam="take"]'); if(tb) tb.disabled=false; const w=cam.box.querySelector(".state.warn"); if(w) w.remove();
  }).catch(() => { if(cam===mine){ cam.err=true; camDraw(); } });
}
function camStop(){ if(cam && cam.stream){ cam.stream.getTracks().forEach(tr => tr.stop()); cam.stream=null; } }
function camClose(){ if(!cam) return; camStop(); cam.box.remove(); document.body.style.overflow=""; cam=null; }
function camTake(){
  const v=cam && cam.box.querySelector("video"); if(!v || !v.videoWidth) return;
  const W=v.videoWidth, H=v.videoHeight, side=Math.min(W,H), x0=(W-side)/2, y0=(H-side)/2;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const g=cv.getContext("2d", {willReadFrequently:true}); g.drawImage(v,0,0,W,H);
  const cell=side*.7/3, out=[];
  for(let r=0;r<3;r++) for(let c=0;c<3;c++){
    /* the picture itself is never mirrored (only the front camera's view on screen is, like a mirror): the camera
       sees the side as a person facing it would, left to right, which is how the squares are listed */
    const cx=x0+side*.15+cell*(c+.5), cy=y0+side*.15+cell*(r+.5), half=cell*.22;
    const d=g.getImageData(Math.round(cx-half), Math.round(cy-half), Math.max(1,Math.round(half*2)), Math.max(1,Math.round(half*2))).data;
    let R=0,G=0,B=0,n=0; for(let k=0;k<d.length;k+=4){ R+=d[k]; G+=d[k+1]; B+=d[k+2]; n++; }
    out.push([R/n, G/n, B/n]);
  }
  camSide(out);
}
function camSide(rgb9){
  cam.samples[CAM_ORDER[cam.i]]=rgb9; cam.i++;
  if(cam.i<6){ camDraw(); return; }
  const got=readColors(cam.samples); camClose();
  S.paint=got; doctor=null; flags=[]; peek=false; mineMsg={ok:true, text:t("camDone")}; save(); render(); panel();
}
window.AOGCubeLab={pick:pickSticker, get cube(){ return cube; }, readColors, camSide:rgb => { if(!cam) camOpen(); camSide(rgb); }, get cam(){ return cam; }};   /* for the site's checks */
$("langBtn").onclick=()=>{ S.lang=es()?"en":"es"; save(); paintAll(); };
$("themeBtn").onclick=()=>{
  const next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next); document.documentElement.classList.toggle("dark",next==="dark");
  try{ localStorage.setItem("aog.interior.ws.v1.theme",next); }catch(e){}
  paintAll();
};
/* the cube and the card in full view (a plain jump, no glide), when the cube's bottom is off the screen */
function showBench(){ const r=stage.getBoundingClientRect(); if(r.bottom>innerHeight-8 || r.top<60) $("bench").scrollIntoView({block:"start"}); }
window.addEventListener("hashchange", () => { camClose(); mineMsg=null; doctor=null; flags=[]; peek=false; paintAll(); if(S.view==="solve") showBench(); });
/* the box's size: fixed when the page opens, set again only when the screen's width changes (turning it) */
let sizedW=0;
function setStageMax(){
  if(Math.abs(innerWidth-sizedW)<60 && sizedW) return;
  sizedW=innerWidth;
  document.documentElement.style.setProperty("--stage-max", Math.round(Math.min(560, Math.max(280, innerHeight-190)))+"px");
}
setStageMax();
let fitW=0;
const refit=() => { const w=stage.clientWidth; if(w && w!==fitW){ fitW=w; fit(); } };   /* only a real change of width redraws */
window.addEventListener("resize", () => { setStageMax(); refit(); });
if(window.ResizeObserver) new ResizeObserver(refit).observe(stage);
/* a trackpad pinch over the cube (Ctrl + wheel) would zoom the whole page; on the cube it does nothing */
stage.addEventListener("wheel", e => { if(e.ctrlKey) e.preventDefault(); }, {passive:false});
if(!location.hash && S.view && S.view!=="learn") history.replaceState(null,"","#"+S.view);
paintAll();
})();
