/* ══ AOG-PADS-UNIT-V1 (2026-10-27) — Jimmy: "make it feel more real and separate from the computer? Almost like a stand alone
   unit." One case: a maker's plate, a backlit screen that says what the unit is doing, Play and Record with their own
   lights, a light on every step and the sixteen steps across the foot of the unit (as a TR-808), and Shift: Shift and a
   step puts in an accent. Only colour shows a press; nothing moves (AOG-STILL-HIT-V1). The screen is a fixed device colour,
   the same in light and dark. ══ */
.pm{position:relative;background:linear-gradient(#2b2e34,#1a1c20);border:1px solid #0a0b0d;border-radius:18px;padding:10px 14px 14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.35)}
.pm::before,.pm::after{content:"";position:absolute;top:10px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8a8f97,#3a3d42);box-shadow:inset 0 0 0 1px #111}

/* ══ AOG-PADS-REAL-V1 (2026-10-27) — Jimmy: "Make them look more real and less 'fake!'" The unit in real materials, drawn by
   the page (no pictures to fetch): a brushed aluminium case with bevelled edges and slotted screws; a backlit LCD with its
   pixel grid, a little glass glare and a dark bezel; matte rubber pads with their names printed in small capitals; dark
   plastic buttons whose lights, not their colour, say Play and Record; and the TR-808's step keys, red, orange, yellow and
   cream in fours, a key with a hit bright with its light on. Still nothing moves on a press (AOG-STILL-HIT-V1). ══ */
.pm{background:repeating-linear-gradient(90deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px),linear-gradient(#383b41,#202226 60%,#1a1c1f);
  border:1px solid #070809;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 0 rgba(0,0,0,.55),inset 1px 0 0 rgba(255,255,255,.05),0 10px 24px rgba(0,0,0,.45)}
.pm::before,.pm::after{width:11px;height:11px;background:linear-gradient(45deg,transparent 43%,#16171a 43% 57%,transparent 57%),radial-gradient(circle at 35% 30%,#b9bec6,#5d6168 60%,#2f3236);
  box-shadow:inset 0 0 0 1px #0d0e10,0 1px 0 rgba(255,255,255,.08)}
.pm-plate{color:#d9d3c5;text-shadow:0 1px 0 #000}

    repeating-linear-gradient(0deg,rgba(0,0,0,.045) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.045) 0 1px,transparent 1px 3px),

#steps .st{border:1px solid #0b0c0e;border-radius:6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 2px rgba(0,0,0,.35),0 2px 0 #08090a}

#steps .st:nth-child(16n+9),#steps .st:nth-child(16n+10),#steps .st:nth-child(16n+11),#steps .st:nth-child(16n+12){--key:#e8c547;--dim:#5a4e1f}
#steps .st:nth-child(16n+13),#steps .st:nth-child(16n+14),#steps .st:nth-child(16n+15),#steps .st:nth-child(16n+16){--key:#ece6d6;--dim:#4d4b45}

#steps .st.now::before{background:radial-gradient(circle at 40% 35%,#fff6d8,#ffd36b 55%,#a87b12);box-shadow:0 0 7px #ffd36b}

/* ══ AOG-PADS-16-V1 (2026-10-27) — Jimmy: "make the drum machine 16 pads again with the option of making it 24 … the pads can
   be a bit bigger". 16 is the start: the classic four by four (pads 1 to 16), each pad bigger; Pads 24 brings back the two
   columns on the right. Hits on pads 17 to 24 keep playing in the loop either way. ══ */

<!-- AOG-BEATLAB-NAME-V1 (2026-10-05) — Jimmy: "I don't like the name the pad machine". It is The Beat Lab (El laboratorio de
     ritmos), at /beat-lab; /pads and /pad-machine still open it. The file keeps its name.
     AOG-DRUM-MACHINE-V2 (2026-10-05) — Jimmy: "The drum machine should be retired not deleted, and the beat pad should take
     over this name." It is The Drum Machine (La caja de ritmos), at /drum-machine; /beat-lab still opens it. The first drum
     machine (music-drums.html) is retired (2026-10-07): /drums and /classic-drum-machine now open this one.
     AOG-PADS-V1 (2026-10-05) — Jimmy: "A drum pad should be made that incorporates everything in one. This could be the 1%
     drum pad machine that kills it compared to everything else out there. Everything is basically built."
     The Beat Lab, /pads: sixteen pads, four banks (A to D), and every sound the site already has.
     · Each bank has one job (AOG-PADS-KINDS-V1): A Drums (two recorded kits, eight pads each, aog-drumkit.js), C Notes (any recorded
       instrument from the piano, the guitar, the bass and the band, in a key and a scale), B Chords (the key's chords
       and their sevenths on that instrument), D Chops (a record from the turntables' crate, or a take waiting at
       the Mixing Desk, cut into sixteen beats).
     · Near the middle of a pad plays louder, near the edge softer (a drum plays its soft, normal or hard recording).
       Notes and chords ring while the pad is held. A closed hi-hat stops the open one; a new chop stops the last.
     · The loop: 1, 2, 4, 8 or 16 bars (AOG-PADS-16BARS-V1), a tempo, swing, and "line up to" (quantize). Record plays what you tap back on the
       next time round, on every bank at once. Repeat plays a held pad in time. Undo takes back the last change.
       The steps show the picked pad's hits; tap a step to add or take one away.
     · Each pad has its own volume, pitch and left/right. Everything stays on this device (aog.pads.v1).
     · ● Record keeps a take (aog-recorder.js) to save as .wav or send to the Mixing Desk or the turntables.
     · AOG-PADS-BOUNCE-V1: Make the loop into a file plays the loop offline and keeps one exact, seamless pass, to save
       as .wav or send to the Mixing Desk (with its exact length, so it starts on the bar) or the turntables.
     · Calm: nothing sounds until a pad is touched, the loop plays only after Play, the click is off until it is
       turned on, and the loop stops when the page is hidden. Keys: Z X C V, A S D F, Q W E R, 1 2 3 4; space plays. -->

/* ══ beats to start from: bank A, pads 1 to 8 (kick, snare, hat, open hat, clap, tom, rim, bell) ══ */
/* AOG-PADS-BEATS-V1 (Jimmy, 2026-10-05: "Can more beat options be opened in the beat pad?") — every beat the drum machine
   knows (aog-beats.js: 10 first beats, 8 styles, 87 beats in ten groups), on bank A's pads 1 to 8 (kick, snare, hat, open
   hat, clap, tom, rim, bell, the drum machine's own order). A hit is 0.8, an accent 1, a soft hit 0.45. The beat brings its
   tempo and swing, and its own kit when that kit is a recorded one here; its line says what it is. */
function beatFlat(){ const A=window.AOGBeats; if(!A) return [];
  const out=[]; A.classroom.forEach(b=>out.push({g:"first", b:b})); A.styles.forEach(b=>out.push({g:"styles", b:b}));
  Object.keys(A.groups).forEach(g=>A.beats.filter(b=>b.grp===g).forEach(b=>out.push({g:g, b:b})));
  handBeats().forEach(b=>out.push({g:b.grp||"hand", b:b}));
  /* AOG-BEATS-GROUPS-V1: a kit's groove joins its group too; every main group runs slow to fast */
  const gi={}; out.forEach(x=>{ if(gi[x.g]==null) gi[x.g]=Object.keys(gi).length; });
  return out.map((x,i)=>[x,i]).sort((a,b)=>gi[a[0].g]-gi[b[0].g] || (A.groups[a[0].g] ? (a[0].b.bpm||0)-(b[0].b.bpm||0) : 0) || a[1]-b[1]).map(x=>x[0]); }   /* AOG-DRUM-PERC-V1 · AOG-DRUM-MORE-V1: a new kit's groove sits in its kind's group */
/* AOG-DRUM-PERC-V1: the hand-drum and tabla grooves (aog-drumkit.js, hand:1), each on its own kit */
function handBeats(){ return ((window.AOGDrumKit && AOGDrumKit.starters)||[]).filter(b=>b.hand && KITS().indexOf(b.kit)>=0); }
function grpName(g){ const A=window.AOGBeats; return g==="first" ? t("bgFirst") : g==="styles" ? t("bgStyles") : g==="hand" ? L(AOGDrumKit.words.handGroup) : A.groups[g] ? L(A.groups[g]) : L(AOGDrumKit.beatGroups[g]); }   /* AOG-BEATS-GROUPS-V1: a main group keeps its own name when a kit's groove joins it */
function bankASig(){ return S.ev.filter(e=>e.b===0).map(e=>e.p+":"+e.t+":"+e.v).sort().join(","); }
function beatById(id){ const A=window.AOGBeats; return A ? [].concat(A.classroom, A.styles, A.beats, handBeats()).find(b=>b.id===id) : null; }
function startBeat(id){
  const B=beatById(id); if(!B) return;
  snapshot();
  S.ev=S.ev.filter(e=>e.b!==0);
  const V={1:0.8, 2:1, 3:0.45};
  /* AOG-DRUM-PERC-V1: a beat in parts (the tabla's teental) plays its parts bar after bar, so the loop holds them all */
  const PARTS=[B.map].concat((B.parts||[]).map(q=>q.map)); if(PARTS.length>1 && S.bars<PARTS.length) S.bars=PARTS.length<=2 ? 2 : 4;
  /* AOG-BEATS-ELITE-V1: res steps a beat (4 sixteenths; 3 and 6 triplets; 8 thirty-second notes): a step is 96/res ticks */
  const RES=[3,4,6,8].indexOf(B.res)>=0 ? B.res : 4, TK=96/RES, N=4*RES;
  /* AOG-BEATS-PERFECT-V1: swing8 swings the eighth notes (the "&" late, as a jazz ride or a shuffle), written into the hits
     as the Drum Kit plays it; plain swing stays this machine's swing of the in-between sixteenths */
  const SW8=RES===4 && B.swing8 && B.swing>0.5 ? Math.min(23, Math.round((B.swing-0.5)*96)) : 0, late=i=>SW8 && i%4>=2 ? SW8 : 0;
  /* AOG-BEATS-PERFECT-V1: bars of 3 (len 12) follow each other with no silent beat: four of them fill a loop of 3 bars of 4 */
  const LENS=[B.len||0].concat((B.parts||[]).map(q=>q.len||B.len||0)), L0=LENS[0], SHORT=RES===4 && L0>0 && L0<16 && LENS.every(x=>x===L0);
  const NB=SHORT ? BAR_LENS.find(k=>(k*16)%(PARTS.length*L0)===0) : 0;
  if(NB){ S.bars=NB;
    for(let s=0;s<NB*16;s++){ const k=Math.floor(s/L0), i=s%L0, part=PARTS[k%PARTS.length];
      DRUM_IDS.forEach((pid, pi)=>{ const row=part[pid]; if(row && row[i]) S.ev.push({b:0, p:pi, t:s*24+late(i), v:V[row[i]]||0.8, len:24}); }); } }
  else for(let bar=0;bar<S.bars;bar++) DRUM_IDS.forEach((pid, pi)=>{ const row=PARTS[bar%PARTS.length][pid]; if(!row) return;
    for(let i=0;i<N;i++) if(row[i]) S.ev.push({b:0, p:pi, t:bar*384+i*TK+(RES===4 ? late(i) : 0), v:V[row[i]]||0.8, len:TK}); });
  if(RES!==4 || SW8) S.swing=50;   /* a triplet or 32nd grid carries its own feel; a swing8 beat has its swing written in */
  if(B.swing && RES===4 && !SW8){ const sw=B.swing*100; S.swing=[50,54,58,62,66].reduce((a,b)=>Math.abs(b-sw)<Math.abs(a-sw)?b:a, 50); }
  if(B.bpm) retime(B.bpm);
  LES.mark("beat1"); const song={boombap:"sbb", lofi:"slofi", house:"shouse", trap:"strap"}[B.id]; if(song) LES.mark(song);
  const A0=S.banks[0];
  if(B.kit && KITS().indexOf(B.kit)>=0) A0.kitA=B.kit;
  S.bank=0; S.sel=0;
  changed(); S.beat={id:B.id, sig:bankASig(), g:(beatFlat().find(x=>x.b.id===B.id)||{}).g||""}; save(); paintAll(); prep(0);
  say(t("startedB",{name:L(B), kit:kitName(A0.kitA)})+(B.about ? " "+L(B.about) : ""), 9000);
}

const PRESET_GROUPS={pop:{en:"Pop, rock and folk",es:"Pop, rock y folk"}, rock:{en:"Rock and metal",es:"Rock y metal"}, soul:{en:"Soul, funk and dance",es:"Soul, funk y baile"},
  jazz:{en:"Blues and jazz",es:"Blues y jazz"}, min:{en:"Minor and moody",es:"Menor y melancólico"}};

const TRI={major:["maj","min","min","maj","maj","min","dim"], minor:["min","dim","maj","min","min","maj","maj"]};
const SEV={major:["maj7","m7","m7","maj7","dom7","m7","m7b5"], minor:["m7","m7b5","maj7","m7","m7","maj7","dom7"]};
/* AOG-PADS-ALLPATS-V1 (2026-10-11, Jimmy: "all the scales and chord progressions like the other tabs have") — every one
   of the 44 patterns. A chord in the key plays on its own pad, as before; a chord from outside the key (rock's ♭7, the
   blues' sevenths on 1 and 4, flamenco's major 5) is put on a spare pad for as long as the pattern is chosen: pad 16
   (sus4), then 8 (home up high), then 7 and 15 (the diminished ones), the pads a pattern uses least. */
const SPARE=[15,7,6,14];
function patLayout(P){
  const sc=P.minor?"minor":"major", deg=SCALES[sc], pads=P.chords.map(c=>{ const d=deg.indexOf(((c.off%12)+12)%12);
    return d<0 ? -1 : TRI[sc][d]===c.q ? d : SEV[sc][d]===c.q ? 8+d : -1; });
  const used=new Set(pads.filter(p=>p>=0)), free=SPARE.filter(p=>!used.has(p)), extra=[];
  for(let i=0;i<pads.length;i++){ if(pads[i]>=0) continue; const c=P.chords[i];
    let x=extra.find(e=>e.off===c.off && e.q===c.q);
    if(!x){ if(!free.length) return null; x={pad:free.shift(), off:c.off, q:c.q}; extra.push(x); }
    pads[i]=x.pad; }
  return pads.length>=2 && pads.length<=16 ? {pads:pads, extra:extra} : null;
}
function patPads(P){ const l=patLayout(P); return l ? l.pads : null; }
/* how long each chord lasts in the loop, in beats: evenly over 4 bars; 3, 6 or 12 chords over 3 bars (the 12-bar blues,
   one beat a bar); otherwise evenly with the last chord, home, holding the beats left over */
function patBeats(n){
  const idx=Array.from({length:n}, (x,i)=>i);
  /* AOG-PADS-16BARS-V1: in a loop of 8 bars or more, one chord a bar, the pattern again and again to fill the loop (8 chords
     over 8 bars; 4 chords four times over 16); bars left over are the last chord's, home, held. The 12-bar blues is 12 bars. */
  if(S.bars>=8){
    const B=n===12 ? 12 : n<=S.bars ? S.bars : 16, k=Math.floor(B/n), beats=[], at=[];
    for(let r=0;r<k;r++) idx.forEach(i=>{ beats.push(4); at.push(i); });
    beats[beats.length-1]+=4*(B-k*n);
    return {bars:B, beats:beats, idx:at};
  }
  if(16%n===0) return {bars:4, beats:Array(n).fill(16/n), idx:idx};
  if(12%n===0) return {bars:3, beats:Array(n).fill(12/n), idx:idx};
  const b=Math.floor(16/n), out=Array(n).fill(b); out[n-1]+=16-b*n; return {bars:4, beats:out, idx:idx};
}
function patEach(n){
  const pb=patBeats(n), b=pb.beats[0], last=pb.beats[pb.beats.length-1];
  if(b!==last) return t("eachLast",{n:b, m:last});
  return b===4 ? t("each1") : b===2 ? t("each2") : b===8 ? t("eachTwoBars") : b===1 ? t("eachBeat") : t("eachBeats",{n:b});
}
const PATS=PRESETS.filter(P=>patLayout(P));
/* AOG-PADS-PAT-ANYSCALE-V1 (2026-10-09) — Jimmy: "I don't get the chords golden light up when I switch to minor keys in
   the chord bank." A pattern is its steps ("4 5 3 6"): it stays when the scale changes, on the same pads, which now hold
   this key's chords. (It used to be dropped the moment the scale left the pattern's own.) Picking a pattern leaves your
   key and scale as they are (it used to flip a minor bank back to major). */
function patOf(B){ return PATS.find(x=>x.id===B.pat) || null; }
function patMinor(B){ if(B.scale==="minor"||B.scale==="pmin"||B.scale==="dorian"||B.scale==="blues") return true;
  const iv=scaleIv(B.scale); return iv.indexOf(3)>=0 && iv.indexOf(4)<0; }   /* AOG-PADS-ALLSCALES-V1: a library scale with a minor third */
function paintGuide(){
  const B=S.banks[S.bank], row=$("guideRow"), now=$("guideNow");
  if(B.type==="chords"){
    const cur=patOf(B);
    let o=opt("", esc(t("patNone")), cur?cur.id:"");
    Object.keys(PRESET_GROUPS).forEach(g=>{ const ps=PATS.filter(P=>P.g===g); if(ps.length) o+=`<optgroup label="${esc(L(PRESET_GROUPS[g]))}">`+ps.map(P=>opt(P.id, esc(L(P)), cur?cur.id:"")).join("")+`</optgroup>`; });
    row.innerHTML=field("fPat", t("patLab"), o, true)+(cur?`<button type="button" class="pm-b" id="fPatLoop">${esc(t("patLoop"))}</button>`:"");
    row.hidden=false;
    $("fPat").onchange=()=>{ const P=PATS.find(x=>x.id===$("fPat").value); B.pat=P?P.id:"";
      /* AOG-PADS-PAT-ANYSCALE-V1: picking a pattern never changes your key or scale (it used to flip a minor bank back to
         major); its steps light up in the chords you chose */
      if(P){ const sc=patMinor(B)?"minor":"major";
        /* the Notes bank follows, so every note of every chord in the pattern has a pad */
        const N=S.banks.find(x=>x.type==="notes"), ok={major:["major","pmaj"], minor:["minor","pmin","blues","dorian"]}[sc];
        if(N && (N.key!==B.key || ok.indexOf(N.scale)<0)){ N.key=B.key; if(ok.indexOf(N.scale)<0) N.scale=sc; } }

   minor), and a bass line on bank C (o.bass) that plays each chord's root in the vibe's way (o.style): "kick" follows the

  const K=[
    {id:"tempo", min:60, max:180, step:1, px:2, get:()=>S.bpm, set:v=>{ retime(v); }, txt:v=>String(Math.round(v))},
    {id:"swing", min:0, max:4, step:1, px:28, get:()=>Math.max(0, SW.indexOf(S.swing)), set:v=>{ const el=$("swSel"); el.value=String(SW[v]); el.dispatchEvent(new Event("change")); },
      txt:v=>v===0 ? w("off") : SW[v]+"%"},
    {id:"vol", min:0, max:150, step:5, px:6, get:()=>S.mvol==null ? 100 : S.mvol, set:v=>{ S.mvol=v; if(bus && ac) bus.gain.setTargetAtTime(0.9*mvol(), ac.currentTime, 0.02); save(); }, txt:v=>v+"%"},
    {id:"pad", min:0, max:150, step:5, px:6, get:()=>{ const el=$("vol"); return el ? +el.value : 100; }, set:v=>{ const el=$("vol"); if(!el) return; el.value=String(v); el.dispatchEvent(new Event("input")); }, txt:v=>v+"%"}];
  const box=document.createElement("div"); box.className="pm-knobs"; box.id="pmKnobs";
  box.innerHTML='<div class="pm-kgrp" role="group" id="pmKgrp">'+K.map(k=>`<div class="pm-kn"><div class="pm-knob" id="kn_${k.id}" role="slider" tabindex="0" aria-valuemin="${k.min}" aria-valuemax="${k.max}"></div><span class="pm-kl" id="knl_${k.id}"></span><span class="pm-kv" id="knv_${k.id}"></span></div>`).join("")+'</div>'
    +'<div class="pm-jog"><div class="pm-jogside"><div class="pm-jogmodes" role="group" id="pmJogModes"><button type="button" class="pm-b" data-jm="bank"></button><button type="button" class="pm-b" data-jm="sound"></button><button type="button" class="pm-b" data-jm="beat"></button></div>'
    +'<div class="pm-jogscr" id="pmJogScr" aria-live="polite"></div></div><div class="pm-wheel" id="pmWheel" role="slider" tabindex="0"></div></div>';
  lcdEl.after(box);
  const last={};
  const put=(el, k, v)=>{ if(last[k]===v) return false; last[k]=v; return true; };
  function knobPaint(){
    K.forEach(k=>{ const v=k.get(), t=k.txt(v), el=$("kn_"+k.id), key=k.id+"|"+v+"|"+t+"|"+S0.lang; if(!put(el, k.id, key)) return;
      el.style.setProperty("--a", (-135+270*(v-k.min)/(k.max-k.min))+"deg"); el.setAttribute("aria-valuenow", String(v)); el.setAttribute("aria-valuetext", t);
      el.setAttribute("aria-label", w(k.id)); $("knl_"+k.id).textContent=w(k.id); $("knv_"+k.id).textContent=t; });
    jogPaint();
  }
  function knobTo(k, v){ v=Math.max(k.min, Math.min(k.max, Math.round(v/k.step)*k.step)); if(v===k.get()) return; k.set(v); knobPaint(); }
  K.forEach(k=>{ const el=$("kn_"+k.id); let y0=0, v0=0, id=null;
    el.addEventListener("pointerdown", e=>{ id=e.pointerId; y0=e.clientY; v0=k.get(); try{ el.setPointerCapture(id); }catch(x){} e.preventDefault(); });
    el.addEventListener("pointermove", e=>{ if(e.pointerId!==id) return; knobTo(k, v0+Math.trunc((y0-e.clientY)/k.px)*k.step); });
    const up=e=>{ if(e.pointerId===id) id=null; }; el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
    el.addEventListener("keydown", e=>{ const d={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1,PageUp:10,PageDown:-10}[e.key]; if(!d) return; e.preventDefault(); knobTo(k, k.get()+d*k.step); }); });
  /* the jog wheel */
  const J={mode:"bank", pend:null, t:0};
  const soundSel=()=>{ const ty=S.banks[S.bank].type; return $(ty==="drums" ? "fKitA" : ty==="chops" ? "fRec" : "fInst"); };
  const choices=()=>{ if(J.mode==="bank") return [0,1,2,3].map(i=>({v:i, n:bankLabel(i)}));
    if(J.mode==="beat") return beatFlat().map(x=>({v:x.b.id, n:L(x.b)+(x.b.bpm?" · "+x.b.bpm:"")}));
    const sel=soundSel(); return sel ? [...sel.options].filter(o=>!o.disabled).map(o=>({v:o.value, n:o.textContent})) : []; };
  const curIdx=(L)=>{ const v=J.mode==="bank" ? S.bank : J.mode==="beat" ? (S.beat && S.beat.id) : (soundSel()||{}).value; return L.findIndex(x=>String(x.v)===String(v)); };
  function jogPaint(){
    document.querySelectorAll("#pmJogModes [data-jm]").forEach(b=>{ const on=b.dataset.jm===J.mode; if(b.textContent!==w(b.dataset.jm)) b.textContent=w(b.dataset.jm); if(b.getAttribute("aria-pressed")!==String(on)) b.setAttribute("aria-pressed", String(on)); });
    const L=choices(), i=J.pend!=null ? J.pend : curIdx(L), n=L[i] ? L[i].n : w("turn"), scr=$("pmJogScr"), txt=w(J.mode)+": "+n;
    if(scr.textContent!==txt) scr.textContent=txt;
    const wh=$("pmWheel"); if(wh.getAttribute("aria-valuetext")!==n){ wh.setAttribute("aria-valuetext", n); wh.setAttribute("aria-label", w("jog")+" · "+w(J.mode)); }
  }
  function land(){ clearTimeout(J.t); J.t=0; if(J.pend==null) return; const L=choices(), x=L[J.pend]; J.pend=null; if(!x){ jogPaint(); return; }
    if(J.mode==="beat") startBeat(x.v);
    else { const sel=soundSel(); if(sel && sel.value!==x.v){ sel.value=x.v; sel.dispatchEvent(new Event("change")); } }
    knobPaint(); }
  function jog(d){
    const L=choices(); if(!L.length) return; const i=J.pend!=null ? J.pend : Math.max(0, curIdx(L)), j=Math.max(0, Math.min(L.length-1, i+d)); if(j===i) return;
    if(J.mode==="bank"){ const bs=$("bankSel"); bs.value=String(L[j].v); bs.dispatchEvent(new Event("change")); knobPaint(); return; }
    J.pend=j; jogPaint();
  }
  $("pmJogModes").addEventListener("click", e=>{ const b=e.target.closest("[data-jm]"); if(!b) return; land(); J.mode=b.dataset.jm; jogPaint(); });
  const wh=$("pmWheel"); let a0=null, acc=0, rot=0, pid=null;
  const ang=e=>{ const r=wh.getBoundingClientRect(); return Math.atan2(e.clientY-(r.top+r.height/2), e.clientX-(r.left+r.width/2))*180/Math.PI; };
  wh.addEventListener("pointerdown", e=>{ pid=e.pointerId; a0=ang(e); acc=0; try{ wh.setPointerCapture(pid); }catch(x){} e.preventDefault(); });
  wh.addEventListener("pointermove", e=>{ if(e.pointerId!==pid || a0==null) return; const a=ang(e); let d=a-a0; if(d>180) d-=360; if(d<-180) d+=360; a0=a; acc+=d; rot+=d;
    wh.style.setProperty("--a", rot.toFixed(1)+"deg");
    while(acc>=24){ acc-=24; jog(1); } while(acc<=-24){ acc+=24; jog(-1); } });
  const wup=e=>{ if(e.pointerId!==pid) return; pid=null; a0=null; land(); }; wh.addEventListener("pointerup", wup); wh.addEventListener("pointercancel", wup);
  wh.addEventListener("keydown", e=>{ const d={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1}[e.key]; if(e.key==="Enter"){ e.preventDefault(); land(); return; } if(!d) return; e.preventDefault();
    rot+=d*24; wh.style.setProperty("--a", rot+"deg"); jog(d); if(J.mode!=="bank"){ clearTimeout(J.t); J.t=setTimeout(land, 500); } });
  $("pmKgrp").setAttribute("aria-label", w("knobs"));
  ["paintAll","paintControls","paintSel","paintTransport"].forEach(n=>{ const f=window[n]; if(typeof f==="function") window[n]=function(){ const r=f.apply(this, arguments); knobPaint(); return r; }; });
  /* in the whole screen too (Jimmy, 2026-10-28: "Sure"): 🎛 Knobs there shows or hides them, kept on the device (S.pvKn) */
  let back=null;
  window.pvKnobsPlace=function(){
    const pv=$("padView"), grid=$("pvGrid"), bt=$("pvKnobs"); if(!pv || !grid) return;
    const show=PV.on && S.pvKn!==false, inPv=box.parentNode===pv;
    if(show && !inPv){ back=document.createComment("knobs"); box.before(back); pv.insertBefore(box, grid); }
    else if(!show && inPv && back && back.parentNode){ back.replaceWith(box); back=null; }
    pv.classList.toggle("kn", box.parentNode===pv);
    if(bt){ const tx=S0.lang==="es" ? "🎛 Perillas" : "🎛 Knobs"; if(bt.textContent!==tx) bt.textContent=tx; bt.setAttribute("aria-pressed", String(S.pvKn!==false)); }
  };
  const kb=$("pvKnobs"); if(kb) kb.onclick=()=>{ S.pvKn=S.pvKn===false; save(); pvKnobsPlace(); };
  const pp=window.pvPaint; if(typeof pp==="function") window.pvPaint=function(){ const r=pp.apply(this, arguments); pvKnobsPlace(); return r; };
  pvKnobsPlace();
  knobPaint();
})();
init();
</script>
</body>
