<title>The Skate Lab — Architecture of Grace</title>
<!-- AOG-SKATE-LAB-V1 (2026-10-11) — Jimmy: "how to do tricks, grinds, etc. how it balance all the grooves from a
     science perspective. Make a killer interactive engine." The science of skateboarding, worked out live
     (aog-skate.js, no library):
       #ramp     Ramp and energy: a real ramp, gravity, rolling friction, air drag and pumping, step by step in time;
                 stored energy, motion energy and heat add up to the total at every moment.
       #ollie    The ollie: the tail as a lever, the front foot's friction, timing, hang time.
       #grind    Grinds and slides: how far a grind goes, d = v² / (2μg), on metal, wax, paint or concrete.
       #balance  Balance and turning: center of mass over the wheels; truck geometry; the speed that balances a lean.
       #flip     Flips and spins: a 3D board turning about its three axes; arms in, arms out.
       #timeline Boards through time: the board, the wheel and what changed, 1959 to today.
       #tricks   Trick book (AOG-SKATE-TRICKS-V2): 26 tricks, each shown moving step by step (AOG-SKATE-DEMO-V1; Go plays it
                 once, the step it shows lights up in the list), where each foot goes, what helps, the science, "Learn first"
                 links, progress kept on the device (learning / landed it once / got it, 7 of 10) and a trick map.
       #questions Questions (AOG-SKATE-FAQ-V1): 30 answers, searchable, by topic, in English and Spanish.
       #build    Build a board (AOG-SKATE-BUILD-V1; "Every part" pulls the board apart with a printable parts list, AOG-SKATE-PARTS-V1): a whole setup for a rider and a use, and checks for truck fit,
                 the wheels and wheel bite, drawn from the front at full lean.
     Build a board is the home room (AOG-SKATE-BUILD-HOME-V1): /skate opens on it; #ollie and the rest still open their rooms.
     Calm: nothing moves until Go is pressed, a run plays once and stops, and every moment can be stepped
     through by hand. With "reduce motion" set, a run shows as one still picture with a slider. -->
<meta name="description" content="The Skate Lab: the science of skateboarding you can try. Ramps and energy, the ollie, grinds and friction, balance and turning, flips and spins, boards through time, and a trick book. English and Spanish.">

<style>
:root {
  --bg:#f4f0e6; --card:#fffcf7; --ink:#1a232c; --muted:#5c6670; --line:#ddd8cc;
  --steel:#2f5c6b; --steel-fg:#f4f8f9; --steel-soft:#e3eef2;
  --good:#2c7a4e; --good-fg:#f3faf5; --good-soft:#e3f0e8;
  --warn:#7a4e00; --warn-soft:#f6ecd6;
  --chip:#efebe3; --stage-a:#fbf8f1; --stage-b:#ebe4d4;
  /* the drawing's own colors (read by aog-skate.js) */
  --cv-sky:#fbf8f1; --cv-ground:#cfc6b2; --cv-ramp:#b9ab8f; --cv-ramp-edge:#6d5f45; --cv-ink:#1a232c;
  --cv-deck:#7a4a22; --cv-grip:#2a2a2a; --cv-wheel:#efe6cf; --cv-truck:#8a929b; --cv-skin:#c99a74;
  --cv-shirt:#2f5c6b; --cv-pants:#3b4250; --cv-pe:#2e6fb0; --cv-ke:#c0601a; --cv-heat:#9a3a5e; --cv-pump:#2c7a4e;
  --cv-force:#b0281f; --cv-friction:#6a3fb0; --cv-path:#2f5c6b; --cv-grid:rgba(26,35,44,.08); --cv-soft:#5c6670;
  --shadow:0 1px 3px rgb(26 35 44 / .08);
  --sans:"Source Sans 3", ui-sans-serif, system-ui, sans-serif;
  --display:"Fraunces", Georgia, serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
.dark, [data-theme="dark"] {
  --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
  --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
  --good:#6fbf8b; --good-fg:#14181e; --good-soft:#1f3327;
  --warn:#e8c27a; --warn-soft:#332a18;
  --chip:#2a313c; --stage-a:#232b35; --stage-b:#161b22;
  --cv-sky:#1b222b; --cv-ground:#3a4350; --cv-ramp:#4d5868; --cv-ramp-edge:#9aa7b8; --cv-ink:#edeae2;
  --cv-deck:#b07a48; --cv-grip:#0e1014; --cv-wheel:#efe6cf; --cv-truck:#aab3bd; --cv-skin:#d6a988;
  --cv-shirt:#7fb4c7; --cv-pants:#8a93a3; --cv-pe:#6fa8e8; --cv-ke:#f0954a; --cv-heat:#e07aa0; --cv-pump:#6fbf8b;
  --cv-force:#ff7a6e; --cv-friction:#b89af0; --cv-path:#7fb4c7; --cv-grid:rgba(237,234,226,.08); --cv-soft:#9aa3b0;
  --shadow:0 1px 3px rgb(0 0 0 / .35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181e; --card:#1c232c; --ink:#edeae2; --muted:#9aa3b0; --line:#333b47;
    --steel:#7fb4c7; --steel-fg:#14181e; --steel-soft:#1d2f36;
    --good:#6fbf8b; --good-fg:#14181e; --good-soft:#1f3327;
    --warn:#e8c27a; --warn-soft:#332a18;
    --chip:#2a313c; --stage-a:#232b35; --stage-b:#161b22;
    --cv-sky:#1b222b; --cv-ground:#3a4350; --cv-ramp:#4d5868; --cv-ramp-edge:#9aa7b8; --cv-ink:#edeae2;
    --cv-deck:#b07a48; --cv-grip:#0e1014; --cv-wheel:#efe6cf; --cv-truck:#aab3bd; --cv-skin:#d6a988;
    --cv-shirt:#7fb4c7; --cv-pants:#8a93a3; --cv-pe:#6fa8e8; --cv-ke:#f0954a; --cv-heat:#e07aa0; --cv-pump:#6fbf8b;
    --cv-force:#ff7a6e; --cv-friction:#b89af0; --cv-path:#7fb4c7; --cv-grid:rgba(237,234,226,.08); --cv-soft:#9aa3b0;
  }
}
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:400 17px/1.55 var(--sans); overflow-x:hidden; }
h1,h2,h3 { font-family:var(--display); font-weight:600; letter-spacing:-.01em; text-wrap:balance; }
h2 { font-size:1.35rem; margin:.1rem 0 .3rem; }
h3 { font-size:1.05rem; margin:1rem 0 .35rem; }
p, li { text-wrap:pretty; }
a { color:inherit; }
button, select, input { font:inherit; touch-action:manipulation; }
button { cursor:pointer; }
header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:.75rem; }
.brand { font-weight:700; text-decoration:none; }
.tools { display:flex; gap:.5rem; }
.pill, .btn {
  min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink);
  padding:0 1rem; font-weight:600; font-size:.95rem; display:inline-flex; align-items:center; justify-content:center; gap:.4rem;
}
.btn-steel { background:var(--steel); color:var(--steel-fg); border-color:transparent; }
.btn-good { background:var(--good); color:var(--good-fg); border-color:transparent; }
.btn[disabled] { opacity:.55; cursor:default; }
.btn[aria-pressed="true"] { background:var(--steel-soft); border-color:var(--steel); color:var(--ink); }
.nav { display:flex; gap:4px; }
.muted { color:var(--muted); }
.lead { max-width:66ch; }
.kicker { font-size:.75rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--steel); margin:0; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* the bench: the drawing on the left, the controls and words on the right; one column on a phone */
.sk-bench { display:grid; gap:1rem; margin-top:1rem; }
@media (min-width:900px){ .sk-bench { grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); align-items:start; }
  .sk-side { position:sticky; top:.75rem; } }
.sk-side { display:flex; flex-direction:column; gap:.6rem; min-width:0; }
.panel { padding:1rem 1.1rem 1.2rem; min-width:0; }
.panel h2 { margin-top:0; }

/* the drawing */
.stage { position:relative; width:100%; border-radius:18px; overflow:hidden; border:1px solid var(--line);
  background:var(--cv-sky); touch-action:pan-y; user-select:none; -webkit-user-select:none; }
.stage canvas { display:block; width:100%; height:auto; }
.stage .cap { position:absolute; left:10px; top:8px; right:10px; display:flex; justify-content:space-between; gap:.5rem; pointer-events:none;
  font:700 .8rem/1.2 var(--sans); color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }

/* the player: Go, step, slider */
.player { display:flex; flex-wrap:wrap; align-items:center; gap:.45rem; }
.player .btn { padding:0 .9rem; }
.player .grow { flex:1 1 160px; min-width:140px; display:flex; align-items:center; gap:.5rem; }
.player input[type=range] { flex:1; }
.player .time { font:700 .95rem/1 var(--mono); min-width:5.2em; text-align:right; }
input[type=range] { accent-color:var(--steel); min-height:32px; width:100%; }

/* the readouts under the drawing */
.reads { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:.45rem; }
.read { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:.45rem .7rem; min-width:0; }
.read .k { font-size:.78rem; font-weight:700; color:var(--muted); letter-spacing:.04em; }
.read .v { font:700 1.2rem/1.2 var(--mono); }
.read .u { font-size:.8rem; color:var(--muted); }

/* energy bars */
.ebars { display:grid; gap:.3rem; }
.ebar { display:grid; grid-template-columns:7.5em 1fr 4.2em; align-items:center; gap:.5rem; font-size:.9rem; }
.ebar .track { display:block; height:16px; background:var(--chip); border-radius:999px; overflow:hidden; }
.ebar .fill { display:block; height:100%; width:0; border-radius:999px; }
.ebar .num { font:700 .85rem/1 var(--mono); text-align:right; }

/* controls */
.ctl { display:grid; gap:.25rem; margin:.55rem 0; }
.ctl label, .ctl .lab { font-weight:700; font-size:.95rem; display:flex; justify-content:space-between; gap:.5rem; }
.ctl label output, .ctl .lab output { font:700 .95rem/1.3 var(--mono); color:var(--steel); }
.ctl .hint { font-size:.85rem; color:var(--muted); margin:0; }
.seg { display:flex; flex-wrap:wrap; gap:.35rem; }
.seg button { min-height:44px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .85rem; font-weight:600; font-size:.92rem; }
.seg button[aria-pressed="true"] { background:var(--steel); color:var(--steel-fg); border-color:transparent; }
select.sel { width:100%; max-width:100%; min-height:44px; font-size:16px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .6rem; }
input.num { font-size:16px; min-height:44px; width:7em; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:0 .6rem; }
.row { display:flex; flex-wrap:wrap; gap:.45rem; align-items:center; }

/* the words */
.say { margin:.4rem 0 .2rem; }
.math { font-family:var(--mono); background:var(--chip); border-radius:10px; padding:.55rem .75rem; margin:.5rem 0; font-size:.92rem; line-height:1.55; overflow-x:auto; white-space:pre-wrap; }
.note { border-left:4px solid var(--steel); background:var(--steel-soft); color:var(--ink); padding:.55rem .8rem; border-radius:0 10px 10px 0; margin:.6rem 0; }
.note.good { border-left-color:var(--good); background:var(--good-soft); }
.note.warn { border-left-color:var(--warn); background:var(--warn-soft); }
.legend { display:flex; flex-wrap:wrap; gap:.3rem .9rem; font-size:.85rem; color:var(--muted); margin:.2rem 0 0; }
.legend i { display:inline-block; width:.9em; height:.9em; border-radius:3px; margin-right:.3em; vertical-align:-.1em; }
details.more { margin:.6rem 0; }
details.more summary { cursor:pointer; font-weight:700; min-height:44px; display:flex; align-items:center; }

/* the trick book */
.tlist { display:grid; gap:.4rem; }
.tsteps { padding-left:1.3rem; margin:.4rem 0; }
.tsteps li { margin:.3rem 0; }
.tag { display:inline-block; border-radius:999px; padding:.15rem .6rem; font:700 .78rem/1.3 var(--sans); background:var(--chip); color:var(--ink); margin-right:.3rem; }
.fixes { display:grid; gap:.35rem; margin:.4rem 0; }
.fixes div { background:var(--chip); border-radius:10px; padding:.45rem .7rem; }
.fixes b { display:block; }
.tsteps li { padding:.3rem .5rem; border-radius:10px; border-left:4px solid transparent; }
.tsteps li.on { background:var(--steel-soft); border-left-color:var(--steel); color:var(--ink); font-weight:600; }
button.linkish { min-height:44px; border:1px solid var(--line); background:var(--card); color:var(--steel); border-radius:999px; padding:0 .85rem; font-weight:700; font-size:.92rem; cursor:pointer; }
.tmap { display:grid; gap:.55rem; margin:.4rem 0; }
.tlv b { display:block; font:700 .8rem/1.3 var(--sans); color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
.tlv p { margin:.25rem 0 0; display:flex; flex-wrap:wrap; gap:.3rem; }
.tchip { display:inline-block; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); padding:.2rem .6rem; font-weight:600; font-size:.85rem; }
.tchip.s1 { border-color:var(--warn); background:var(--warn-soft); }
.tchip.s2 { border-color:var(--steel); background:var(--steel-soft); }
.tchip.s3 { border-color:transparent; background:var(--good); color:var(--good-fg, #fff); }

i.pg { display:inline-block; width:.85em; height:.85em; border-radius:50%; border:2px solid currentColor; margin-right:.35em; vertical-align:-.1em; box-sizing:border-box; }
i.pg.s1 { background:conic-gradient(currentColor 0 25%, transparent 0); }
i.pg.s2 { background:conic-gradient(currentColor 0 50%, transparent 0); }
i.pg.s3 { background:currentColor; }
/* the parts list */
.parts ol { padding-left:1.4rem; margin:.4rem 0; }
.parts li { margin:.45rem 0; }
.parts .pq { font:700 .9rem/1 var(--mono); color:var(--steel); }
.parts .muted { color:var(--muted); font-size:.92rem; }
@media print { body.print-parts * { visibility:hidden !important; } body.print-parts #partsList, body.print-parts #partsList * { visibility:visible !important; } body.print-parts #partsList { position:absolute; left:0; top:0; width:100%; color:#000; } }
/* questions */
.faq { display:grid; gap:.45rem; margin:.6rem 0; }
details.qa { margin:0; border:1px solid var(--line); border-radius:12px; background:var(--card); padding:0 .85rem; }
details.qa summary { font-weight:700; color:var(--ink); }
details.qa[open] { padding-bottom:.7rem; }
details.qa p { margin:.3rem 0 .5rem; color:var(--ink); }

/* the timeline */
.tl-years { display:flex; flex-wrap:wrap; gap:.3rem; margin:.3rem 0 .6rem; }
.tl-years button { min-height:44px; min-width:3.6em; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font:700 .85rem/1 var(--mono); padding:0 .5rem; }
.tl-years button[aria-pressed="true"] { background:var(--steel); color:var(--steel-fg); border-color:transparent; }

footer { margin-top:2rem; font-size:.85rem; color:var(--muted); }
@media (max-width:420px){ .panel { padding:.9rem .85rem 1.1rem; } .ebar { grid-template-columns:6.4em 1fr 3.8em; font-size:.85rem; } }
@media print { .no-print { display:none !important; } .stage { break-inside:avoid; } }
</style>

  <section class="mast" id="toolMast"><p class="kicker" id="mastK"></p><h1 id="mastH"></h1><p class="lead" id="mastL"></p></section>
