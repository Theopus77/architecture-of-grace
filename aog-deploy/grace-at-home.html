<style>
:root{--navy:#0A1E33;--ink:#1f2a36;--soft:#4f5b69;--gold:#B8893A;--gold2:#F2C964;--cream:#FBF6EA;--card:#fff;--line:#E6DCC6;

*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;color:var(--ink);background:var(--cream);font:17px/1.55 -apple-system,"Segoe UI",Inter,Roboto,Arial,sans-serif}

.lede{color:#D5DEE8;margin:0;max-width:600px}
main{max-width:760px;margin:0 auto;padding:18px 16px 70px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:0 0 14px}
.bar label{font:800 12px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
select{font:inherit;font-size:16px;font-weight:700;min-height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 16px}
.pillars button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 15px/1.2 inherit;cursor:pointer;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.pillars button b{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;color:#fff;background:var(--pc);font:700 14px Inter,sans-serif}
.pillars button[aria-pressed="true"]{border-color:var(--pc);box-shadow:inset 0 -4px 0 var(--pc);background:color-mix(in srgb,var(--pc) 8%,var(--card))}
.pillars .now{font:700 10px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--pc)}
@media (max-width:520px){.pillars button{font-size:13px}}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin:0 0 14px;box-shadow:inset 0 5px 0 var(--pc),0 10px 28px -22px rgba(10,30,51,.5)}
.k{font:800 11.5px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--pc);margin:0 0 8px}
.big{font:600 clamp(21px,4.4vw,26px)/1.3 Fraunces,Georgia,serif;margin:0 0 14px;min-height:2.6em}
.row{display:flex;flex-wrap:wrap;gap:8px}
button.b{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--pc);background:transparent;color:var(--ink);font:700 15px inherit;font-family:inherit;cursor:pointer}
button.b.solid{background:var(--pc);color:#fff}
.sub{color:var(--soft);font-size:15px;margin:10px 0 0}
.acts{display:grid;gap:10px}
.act{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border:1.5px solid var(--line);cursor:pointer;background:transparent;text-align:left;font:inherit;color:inherit;width:100%}
.act[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 8%,transparent)}
.act .tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--pc);display:grid;place-items:center;color:#fff;font-weight:900}
.act[aria-pressed="true"] .tick{background:var(--pc)}
.week{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.week span{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;border:1.5px solid var(--line);font:700 12px Inter,sans-serif;color:var(--soft)}
.week span.on{background:var(--pc);border-color:var(--pc);color:#fff}
details{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
summary{cursor:pointer;font-weight:700;min-height:40px;display:flex;align-items:center}
.chal{background:color-mix(in srgb,var(--gold) 10%,var(--card));border:1.5px dashed var(--gold)}
.foot{color:var(--soft);font-size:14px;text-align:center;margin-top:18px}
@media print{header.hero,.bar,.pillars,.row,.noprint,.aogtop,.aogtop-spacer{display:none!important}.card{break-inside:avoid;box-shadow:none}}

<script>
const DATA={"en": {"pillars": [{"k": "Pillar One", "n": "Identity", "s": "Who we come to believe we are — shaped by what we notice out loud.", "heads": ["Weekly prompts — pick one", "Reflection questions", "Follow-up discussion", "Family activities (5–15 min)", "Reinforces at school"], "prompts": ["\"What's one thing you did today that felt <b>like you</b>?\"", "\"When were you proud of <b>who you were</b>, not just what you got?\"", "\"What's something you're good at that has nothing to do with school?\"", "\"If your friends described you in three words, what would you want them to say?\"", "\"Who in our family are you most like — and what part?\""], "reflect": ["\"Did anyone make you feel seen today? Did you do that for anyone?\"", "\"What's a label you've outgrown?\"", "\"What do you hope is true about you a year from now?\""], "acts": ["<b>Catch them being.</b> Each day, name one <i>true thing you saw them be</i> — patient, curious, brave — not just what they achieved.", "<b>The strengths jar.</b> All week, drop in slips naming a strength you noticed in each other. Read them Sunday.", "<b>Three-word portraits.</b> Everyone writes three words for each family member. Compare. Talk about the surprises."], "age": "Younger: \"What makes you <i>you</i>?\" · Teens: \"Where do you feel most yourself?\"", "follow": "Later in the week: \"You said you felt most like yourself when ___. How can we make more room for that?\" Naming it once is good; protecting it is better.", "school": "Classrooms explore identity through \"I am\" statements and strengths language. At home you're doing the same work — praising the <b>person, not only the grade</b> — so a child hears one consistent message about who they are.", "chal": "<b>\"The Out-Loud Week.\"</b> For seven days, say one specific, character-based thing you notice in each family member <i>out loud</i>, every day. No achievements allowed — only who they were being. Notice what changes by day seven.", "chalk": "Monthly Grace Challenge — Identity", "stick": "Praise the person."}, {"k": "Pillar Two", "n": "Self-Compassion", "s": "How we learn to speak to ourselves when things go wrong.", "heads": ["Weekly prompts — pick one", "Reflection questions", "Follow-up discussion", "Family activities (5–15 min)", "Reinforces at school"], "prompts": ["\"What's something hard you tried today, even though it scared you?\"", "\"When you messed up today, what did you <b>say to yourself</b>?\"", "\"Would you talk to a friend the way you talk to yourself?\"", "\"What does your kind inside-voice sound like? What about the harsh one?\"", "\"What do you need when you're disappointed in yourself?\""], "reflect": ["\"Was today a 'be gentle' day or a 'push yourself' day? How do you know?\"", "\"What would you tell a friend in your exact situation?\"", "\"What's one kind thing you could say to yourself tonight?\""], "acts": ["<b>Flip the critic.</b> When the harsh voice shows up — theirs or yours — help each other \"talk to yourself like a friend,\" out loud.", "<b>Mistake of the day.</b> At dinner, everyone shares one slip-up and one kind thing they told themselves. You go first.", "<b>The friend test.</b> Write down a harsh self-thought, then rewrite it as if it were advice to your best friend."], "age": "Younger: \"Can we be gentle with ourselves like we are with a puppy?\" · Teens: \"What's your inner critic's favorite line?\"", "follow": "Circle back: \"Earlier you were really hard on yourself about ___. How are you feeling about it now?\" Self-compassion grows when someone notices the storm has passed.", "school": "Lessons teach kids to notice self-talk and reframe it (\"I made a mistake — that's being human\"). When the same reframing happens at home, the kind voice gets louder than the critic in both places.", "chal": "<b>\"Talk to Yourself Like a Friend.\"</b> This month, when anyone in the family catches themselves in harsh self-talk, they say it out loud — and someone helps them rephrase it the way they'd speak to a friend. Keep a tally on the fridge of how many flips you make together.", "chalk": "Monthly Grace Challenge — Self-Compassion", "stick": "Be your own friend."}, {"k": "Pillar Three", "n": "Forgiveness", "s": "Moving past mistakes to make room for growth — theirs and ours.", "heads": ["Weekly prompts — pick one", "Reflection questions", "Follow-up discussion", "Family activities (5–15 min)", "Reinforces at school"], "prompts": ["\"Is there anything between us that needs a <b>redo</b>?\"", "\"What's harder for you — saying sorry, or accepting one?\"", "\"Are you carrying something today that you'd feel lighter to set down?\"", "\"When someone forgave you, how did it feel?\"", "\"What does a <b>real</b> apology include?\""], "reflect": ["\"Did anything get repaired today? What helped?\"", "\"Is there a grudge that's costing you more than it's worth?\"", "\"What's the difference between forgiving and pretending it didn't happen?\""], "acts": ["<b>The four-step redo.</b> Practice the repair steps together: <b>own it · name the impact · make it right · reset.</b> You model one of your own first.", "<b>Mistake of the week.</b> At a weekly meal, each person shares a mistake and what they'd redo. The grown-ups go first — it makes repair normal, not scary.", "<b>Set it down.</b> Write a grudge on paper, talk about it, then crumple or recycle it together."], "age": "Younger: \"Should we have a do-over?\" · Teens: \"What makes forgiveness feel earned vs. fake?\"", "follow": "A day after a repair: \"How are we doing since our redo? Anything still tender?\" Forgiveness isn't a single moment — checking back tells a child repair is real, not performance.", "school": "The classroom teaches repair as a skill with clear steps, not just \"say sorry.\" Walking the same four steps at home means a child practices real accountability in the place it matters most.", "chal": "<b>\"One Real Repair.\"</b> Sometime this month, every family member completes one genuine four-step redo with someone — inside or outside the family. Come back and share what was hard about it and what felt better afterward. The goal isn't perfection; it's practice.", "chalk": "Monthly Grace Challenge — Forgiveness", "stick": "Own it. Make it right. Reset."}, {"k": "Pillar Four", "n": "Grace", "s": "Meeting each other with understanding rather than only judgment.", "heads": ["Weekly prompts — pick one", "Reflection questions", "Follow-up discussion", "Family activities (5–15 min)", "Reinforces at school"], "prompts": ["\"Who could use a little extra patience from you this week?\"", "\"When did someone give <b>you</b> grace today?\"", "\"What's a story we don't know about why someone acted the way they did?\"", "\"Where could we choose <b>connection before correction</b> this week?\"", "\"What's something kind you did that no one noticed?\""], "reflect": ["\"Did I lead with curiosity or with judgment today?\"", "\"Who deserves the benefit of the doubt from me right now?\"", "\"What would change if I assumed the best about them?\""], "acts": ["<b>Connection before correction.</b> Before the lecture, take one calm breath and ask one kind question. Your calm is the intervention.", "<b>Grace you received.</b> Go around and each name one moment today someone was gentle with you.", "<b>The benefit of the doubt.</b> Pick a frustrating moment and invent three kind reasons the other person might have acted that way."], "age": "Younger: \"How can we be extra gentle with someone today?\" · Teens: \"When is grace hardest to give?\"", "follow": "End of week: \"Where did grace change how a moment went this week — for you or for us?\" Naming the wins teaches kids that gentleness is powerful, not weak.", "school": "Classrooms frame grace as meeting others (and ourselves) with understanding first. At home, \"connection before correction\" gives a child the same gentle on-ramp back from a hard moment.", "chal": "<b>\"Connection Before Correction.\"</b> For one month, before any correction, the adults pause for a single breath and one kind question first. Notice how often the lecture turns out to be unnecessary. Invite the kids to call it out — gently — when you forget.", "chalk": "Monthly Grace Challenge — Grace", "stick": "Your calm is the intervention."}], "tag": "A simple weekly rhythm that turns four pillars into ordinary, around-the-table conversation.", "body": "This is the family side of Architecture of Grace. Every practice here aligns to one of the four pillars your child is learning about — <b>Identity, Self-Compassion, Forgiveness,</b> and <b>Grace</b> — so the language at home matches the language at school. Nothing takes more than 5–15 minutes. Nothing requires a worksheet, a degree, or a perfect parent. You go first; they follow."}, "es": {"pillars": [{"k": "Pilar Uno", "n": "Identidad", "s": "Quiénes llegamos a creer que somos — moldeado por lo que notamos en voz alta.", "heads": ["Preguntas semanales — elige una", "Preguntas de reflexión", "Conversación de seguimiento", "Actividades familiares (5–15 min)", "Refuerza lo que se enseña en la escuela"], "prompts": ["\"¿Qué es algo que hiciste hoy que se sintió <b>muy tuyo</b>?\"", "\"¿Cuándo te sentiste orgulloso de <b>quién eras</b>, no solo de lo que lograste?\"", "\"¿En qué eres bueno que no tenga nada que ver con la escuela?\"", "\"Si tus amigos te describieran en tres palabras, ¿qué te gustaría que dijeran?\"", "\"¿A quién de nuestra familia te pareces más — y en qué parte?\""], "reflect": ["\"¿Alguien te hizo sentir visto hoy? ¿Hiciste eso por alguien más?\"", "\"¿Qué etiqueta has dejado atrás?\"", "\"¿Qué esperas que sea cierto sobre ti dentro de un año?\""], "acts": ["<b>Atrápalos siendo.</b> Cada día, nombra una <i>cosa verdadera que viste que fueron</i> — pacientes, curiosos, valientes — no solo lo que lograron.", "<b>El frasco de fortalezas.</b> Toda la semana, depositen papelitos nombrando una fortaleza que notaron en los demás. Léanlos el domingo.", "<b>Retratos de tres palabras.</b> Cada quien escribe tres palabras para cada miembro de la familia. Compárenlas. Hablen de las sorpresas."], "age": "Más pequeños: \"¿Qué te hace ser <i>tú</i>?\" · Adolescentes: \"¿Dónde te sientes más tú mismo?\"", "follow": "Más adelante en la semana: \"Dijiste que te sentías más tú mismo cuando ___. ¿Cómo podemos hacer más espacio para eso?\" Nombrarlo una vez está bien; protegerlo es mejor.", "school": "En las aulas se explora la identidad mediante frases de \"Yo soy\" y el lenguaje de las fortalezas. En casa están haciendo el mismo trabajo — elogiando a la <b>persona, no solo la calificación</b> — para que el niño escuche un mensaje constante sobre quién es.", "chal": "<b>\"La Semana en Voz Alta.\"</b> Durante siete días, di <i>en voz alta</i> una cosa específica, basada en el carácter, que notes en cada miembro de la familia, todos los días. No se permiten logros — solo quiénes estaban siendo. Observa qué cambia para el séptimo día.", "chalk": "Reto Mensual de Gracia — Identidad", "stick": "Elogia a la persona."}, {"k": "Pilar Dos", "n": "Autocompasión", "s": "Cómo aprendemos a hablarnos a nosotros mismos cuando las cosas salen mal.", "heads": ["Preguntas semanales — elige una", "Preguntas de reflexión", "Conversación de seguimiento", "Actividades familiares (5–15 min)", "Refuerza lo que se enseña en la escuela"], "prompts": ["\"¿Qué cosa difícil intentaste hoy, aunque te diera miedo?\"", "\"Cuando te equivocaste hoy, ¿qué te <b>dijiste a ti mismo</b>?\"", "\"¿Le hablarías a un amigo de la forma en que te hablas a ti mismo?\"", "\"¿Cómo suena tu voz interior amable? ¿Y la dura?\"", "\"¿Qué necesitas cuando estás decepcionado de ti mismo?\""], "reflect": ["\"¿Hoy fue un día de 'ser amable' o un día de 'exigirte'? ¿Cómo lo sabes?\"", "\"¿Qué le dirías a un amigo en tu misma situación?\"", "\"¿Qué cosa amable podrías decirte a ti mismo esta noche?\""], "acts": ["<b>Dale la vuelta al crítico.</b> Cuando aparezca la voz dura — la de ellos o la tuya — ayúdense a \"hablarse como a un amigo\", en voz alta.", "<b>El error del día.</b> En la cena, cada quien comparte un tropiezo y una cosa amable que se dijo a sí mismo. Tú vas primero.", "<b>La prueba del amigo.</b> Escribe un pensamiento duro hacia ti mismo y reescríbelo como si fuera un consejo para tu mejor amigo."], "age": "Más pequeños: \"¿Podemos ser amables con nosotros mismos como lo somos con un cachorrito?\" · Adolescentes: \"¿Cuál es la frase favorita de tu crítico interior?\"", "follow": "Retoma el tema: \"Antes fuiste muy duro contigo mismo por ___. ¿Cómo te sientes al respecto ahora?\" La autocompasión crece cuando alguien nota que la tormenta ya pasó.", "school": "Las lecciones enseñan a los niños a notar su diálogo interno y a reformularlo (\"Cometí un error — eso es ser humano\"). Cuando esa misma reformulación ocurre en casa, la voz amable se vuelve más fuerte que el crítico en ambos lugares.", "chal": "<b>\"Háblate Como a un Amigo.\"</b> Este mes, cuando cualquier miembro de la familia se sorprenda hablándose con dureza, lo dice en voz alta — y alguien le ayuda a reformularlo como le hablaría a un amigo. Lleven la cuenta en el refrigerador de cuántas veces le dan la vuelta juntos.", "chalk": "Reto Mensual de Gracia — Autocompasión", "stick": "Sé tu propio amigo."}, {"k": "Pilar Tres", "n": "Perdón", "s": "Superar los errores para abrir espacio al crecimiento — el suyo y el nuestro.", "heads": ["Preguntas semanales — elige una", "Preguntas de reflexión", "Conversación de seguimiento", "Actividades familiares (5–15 min)", "Refuerza lo que se enseña en la escuela"], "prompts": ["\"¿Hay algo entre nosotros que necesite un <b>nuevo comienzo</b>?\"", "\"¿Qué te cuesta más — pedir perdón o aceptarlo?\"", "\"¿Estás cargando algo hoy que te aliviaría soltar?\"", "\"Cuando alguien te perdonó, ¿cómo se sintió?\"", "\"¿Qué incluye una disculpa <b>de verdad</b>?\""], "reflect": ["\"¿Se reparó algo hoy? ¿Qué ayudó?\"", "\"¿Hay un rencor que te cuesta más de lo que vale?\"", "\"¿Cuál es la diferencia entre perdonar y fingir que no pasó?\""], "acts": ["<b>El nuevo comienzo en cuatro pasos.</b> Practiquen juntos los pasos de la reparación: <b>reconócelo · nombra el impacto · repáralo · empieza de nuevo.</b> Tú das el ejemplo primero con uno propio.", "<b>El error de la semana.</b> En una comida semanal, cada persona comparte un error y qué haría de otra manera. Los adultos van primero — eso hace que reparar sea normal, no aterrador.", "<b>Suéltalo.</b> Escriban un rencor en un papel, hablen de él, luego arrúguenlo o recíclenlo juntos."], "age": "Más pequeños: \"¿Deberíamos volver a intentarlo?\" · Adolescentes: \"¿Qué hace que el perdón se sienta genuino y no fingido?\"", "follow": "Un día después de una reparación: \"¿Cómo vamos desde nuestro nuevo comienzo? ¿Algo sigue sensible?\" El perdón no es un solo momento — volver a revisarlo le dice al niño que la reparación es real, no una actuación.", "school": "El aula enseña la reparación como una habilidad con pasos claros, no solo \"pedir perdón\". Recorrer los mismos cuatro pasos en casa significa que el niño practica una responsabilidad real en el lugar donde más importa.", "chal": "<b>\"Una Reparación de Verdad.\"</b> En algún momento de este mes, cada miembro de la familia completa un nuevo comienzo genuino de cuatro pasos con alguien — dentro o fuera de la familia. Vuelvan y compartan qué fue lo difícil y qué se sintió mejor después. La meta no es la perfección; es la práctica.", "chalk": "Reto Mensual de Gracia — Perdón", "stick": "Reconócelo. Repáralo. Empieza de nuevo."}, {"k": "Pilar Cuatro", "n": "Gracia", "s": "Tratarnos unos a otros con comprensión y no solo con juicio.", "heads": ["Preguntas semanales — elige una", "Preguntas de reflexión", "Conversación de seguimiento", "Actividades familiares (5–15 min)", "Refuerza lo que se enseña en la escuela"], "prompts": ["\"¿Quién podría necesitar un poco más de paciencia de tu parte esta semana?\"", "\"¿Cuándo alguien te dio gracia a <b>ti</b> hoy?\"", "\"¿Qué historia no conocemos sobre por qué alguien actuó como lo hizo?\"", "\"¿Dónde podríamos elegir <b>conexión antes que corrección</b> esta semana?\"", "\"¿Qué cosa amable hiciste que nadie notó?\""], "reflect": ["\"¿Hoy actué desde la curiosidad o desde el juicio?\"", "\"¿Quién merece el beneficio de la duda de mi parte en este momento?\"", "\"¿Qué cambiaría si asumiera lo mejor de esa persona?\""], "acts": ["<b>Conexión antes que corrección.</b> Antes del sermón, toma una respiración tranquila y haz una pregunta amable. Tu calma es la intervención.", "<b>La gracia que recibiste.</b> Den la vuelta y cada quien nombra un momento de hoy en que alguien fue suave contigo.", "<b>El beneficio de la duda.</b> Elijan un momento frustrante e inventen tres razones amables por las que la otra persona pudo haber actuado así."], "age": "Más pequeños: \"¿Cómo podemos ser extra suaves con alguien hoy?\" · Adolescentes: \"¿Cuándo es más difícil dar gracia?\"", "follow": "Al final de la semana: \"¿Dónde cambió la gracia cómo se desarrolló un momento esta semana — para ti o para nosotros?\" Nombrar los logros enseña a los niños que la suavidad es poderosa, no débil.", "school": "Las aulas presentan la gracia como tratar a los demás (y a nosotros mismos) con comprensión primero. En casa, \"conexión antes que corrección\" le da al niño la misma rampa suave para volver de un momento difícil.", "chal": "<b>\"Conexión Antes que Corrección.\"</b> Durante un mes, antes de cualquier corrección, los adultos hacen una pausa para una sola respiración y una pregunta amable primero. Observen con qué frecuencia el sermón resulta innecesario. Inviten a los niños a señalarlo — con suavidad — cuando se les olvide.", "chalk": "Reto Mensual de Gracia — Gracia", "stick": "Tu calma es la intervención."}], "tag": "Un ritmo semanal sencillo que convierte cuatro pilares en conversaciones cotidianas, alrededor de la mesa.", "body": "Este es el lado familiar de Architecture of Grace. Cada práctica de aquí se alinea con uno de los cuatro pilares que tu hijo está aprendiendo — <b>Identidad, Autocompasión, Perdón</b> y <b>Gracia</b> — para que el lenguaje en casa coincida con el lenguaje en la escuela. Nada toma más de 5 a 15 minutos. Nada requiere una hoja de trabajo, un título, ni un padre perfecto. Tú vas primero; ellos te siguen."}};
const UI={
 en:{ey:"The Front Porch · At home",h1:"Grace at Home",lede:"One pillar a week. One question at the table. Nothing to print, nothing to grade — you go first, they follow.",
  age:"Ages",ages:["All ages","4–7","8–12","13+"],pillar:"This week's pillar",thisweek:"This week",ask:"Ask tonight",another:"Another question",
  reflect:"Before bed",next:"Next one",act:"Pick one activity (5–15 min)",done:"We did it",didit:"Done — nice work.",days:"Nights you talked this week",
  tapday:"Tap a night when you talked.",follow:"Later in the week",school:"How it matches school",chal:"This month's challenge",print:"Print this week",
  dn:["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],priv:"Your marks stay on this device. Nothing is sent.",streak:w=>w===1?"1 week done so far.":w+" weeks done so far."},
 es:{ey:"El Porche · En casa",h1:"Gracia en casa",lede:"Un pilar por semana. Una pregunta en la mesa. Nada que imprimir, nada que calificar — tú primero, ellos después.",
  age:"Edades",ages:["Todas","4–7","8–12","13+"],pillar:"El pilar de esta semana",thisweek:"Esta semana",ask:"Pregunta esta noche",another:"Otra pregunta",
  reflect:"Antes de dormir",next:"Otra",act:"Elige una actividad (5–15 min)",done:"Lo hicimos",didit:"Hecho — ¡bien!",days:"Noches en que hablaron esta semana",
  tapday:"Toca una noche en que hablaron.",follow:"Más tarde en la semana",school:"Cómo se conecta con la escuela",chal:"El reto de este mes",print:"Imprimir esta semana",
  dn:["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"],priv:"Tus marcas se quedan en este aparato. No se envía nada.",streak:w=>w===1?"1 semana hecha hasta ahora.":w+" semanas hechas hasta ahora."}
};
const KEY="aog.athome.v1";
function wk(){ const d=new Date(), j=new Date(d.getFullYear(),0,1); return d.getFullYear()+"-"+Math.floor(((d-j)/864e5+j.getDay()+6)/7); }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(ST)); }catch(e){} }
const ST=Object.assign({age:0,weeks:{}},load());
const autoP=Math.floor(Date.now()/(7*864e5))%4;
let P=ST.pick!=null&&ST.pickWeek===wk()?ST.pick:autoP, qi=0, ri=0;
function lang(){ return (document.documentElement.lang||"en").slice(0,2)==="es"?"es":"en"; }
function strip(h){ const d=document.createElement("div"); d.innerHTML=h; return d.textContent; }
function prompts(p){
  /* the age line carries a younger and a teen version; lead with the one that fits */
  const age=ST.age, m=p.age.split("·"), young=m[0]?m[0].replace(/^[^:]*:/,"").trim():"", teen=m[1]?m[1].replace(/^[^:]*:/,"").trim():"";
  if(age===1&&young) return [young].concat(p.prompts);
  if(age===3&&teen) return [teen].concat(p.prompts);
  return p.prompts;
}
function wkRec(){ const w=wk(); ST.weeks[w]=ST.weeks[w]||{p:P,days:[],act:null}; return ST.weeks[w]; }
function render(){
  const L=lang(), U=UI[L], ps=DATA[L].pillars, p=ps[P], cols=["var(--c0)","var(--c1)","var(--c2)","var(--c3)"];
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=U[e.dataset.t]);
  document.documentElement.style.setProperty("--pc",cols[P]);
  const pr=prompts(p), rec=wkRec(), done=Object.values(ST.weeks).filter(x=>x.act!=null).length;
  document.getElementById("app").innerHTML=`
  <div class="bar"><div><label for="age">${U.age}</label> <select id="age">${U.ages.map((a,i)=>`<option value="${i}"${ST.age===i?" selected":""}>${a}</option>`).join("")}</select></div>
    <button class="b noprint" id="pr" type="button">${U.print}</button></div>
  <p class="k" style="color:var(--soft)">${U.pillar}</p>
  <div class="pillars" role="group">${ps.map((x,i)=>`<button type="button" data-p="${i}" style="--pc:${cols[i]}" aria-pressed="${i===P}"><b>${i+1}</b>${x.n}${i===autoP?`<span class="now">${U.thisweek}</span>`:""}</button>`).join("")}</div>
  <section class="card"><p class="k">${p.k} · ${p.n}</p><p style="margin:0 0 12px;color:var(--soft);font-style:italic">${p.s}</p>
    <p class="k">${U.ask}</p><p class="big" aria-live="polite">${pr[qi%pr.length]}</p>
    <div class="row"><button class="b solid" id="nq" type="button">${U.another}</button></div>
    <details><summary>${U.follow}</summary><p class="sub" style="margin-top:0">${p.follow}</p></details></section>
  <section class="card"><p class="k">${U.act}</p><div class="acts">${p.acts.map((a,i)=>`<button type="button" class="act" data-a="${i}" aria-pressed="${rec.act===i&&rec.p===P}"><span class="tick">${rec.act===i&&rec.p===P?"✓":""}</span><span>${a}</span></button>`).join("")}</div>
    <p class="sub">${rec.act!=null&&rec.p===P?U.didit+" "+U.streak(done):U.streak(done)}</p></section>
  <section class="card"><p class="k">${U.reflect}</p><p class="big" aria-live="polite" style="min-height:0">${p.reflect[ri%p.reflect.length]}</p>
    <div class="row"><button class="b" id="nr" type="button">${U.next}</button></div>
    <p class="k" style="margin-top:16px">${U.days}</p><p class="sub" style="margin:0 0 4px">${U.tapday}</p>
    <div class="week">${U.dn.map((d,i)=>`<span role="button" tabindex="0" data-d="${i}" class="${rec.days.includes(i)?"on":""}">${d}</span>`).join("")}</div></section>
  <section class="card chal"><p class="k">${U.chal} · ${strip(p.chalk).split("—").pop().trim()}</p><p style="margin:0">${p.chal}</p>
    <details><summary>${U.school}</summary><p class="sub" style="margin-top:0">${p.school}</p></details></section>
  <p class="foot">${U.priv}<br><i>${p.stick}</i></p>`;
  const app=document.getElementById("app");
  app.querySelector("#age").onchange=e=>{ ST.age=+e.target.value; qi=0; save(); render(); };
  app.querySelector("#pr").onclick=()=>{ document.querySelectorAll("details").forEach(d=>d.open=true); window.print(); };
  app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ P=+b.dataset.p; ST.pick=P; ST.pickWeek=wk(); qi=0; ri=0; save(); render(); });
  app.querySelector("#nq").onclick=()=>{ qi++; render(); };
  app.querySelector("#nr").onclick=()=>{ ri++; render(); };
  app.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ const r=wkRec(), i=+b.dataset.a; if(r.act===i&&r.p===P) r.act=null; else { r.act=i; r.p=P; } save(); render(); });
  app.querySelectorAll("[data-d]").forEach(b=>{ const f=()=>{ const r=wkRec(), i=+b.dataset.d, k=r.days.indexOf(i); if(k<0) r.days.push(i); else r.days.splice(k,1); save(); render(); }; b.onclick=f; b.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); f(); } }; });
}
render();
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});
</script>
<script src="/aog-grace.js" defer></script>
</body>
</html>
