<!-- AOG-DRUM-SP12-V1 (2026-09-22) — Jimmy: the bench hears like a 1987 twelve-bit sampler.
     26,040 Hz memory, 12-bit, nearest-neighbor pitch (no smoothing), a low-pass on each pad, swing on the even steps.
     Not an E-mu, and not that machine's disks. The drums are built on this page. Volume stays kind. -->
<style>

}

}

.machine {

.plate-block > small { display:block; letter-spacing:.22em; font-size:.58rem; color:#b8b2a6 !important; margin-top:.2rem; }

/* ══ AOG-SP-SIMPLE-V1 (2026-09-26) — Jimmy: "build as you think is best". The machine has
   33 keys, 11 sliders and a 128-cell grid on one screen. A learner who has never seen an
   SP-1200 cannot tell which three things to touch. SIMPLE BENCH is now the default: pads,
   the grid, Play, Clear, Send to the turntables, Tempo, Volume and the starter patterns.
   Everything else is still in the page and comes back with FULL BENCH. One colour per job
   in both modes: orange = transport, green = shapes the sound, red outline = erases,
   blue = files. ═══════════════════════════════════════════════════════════════════ */
.bench-switch{display:flex;gap:.5rem;align-items:center;margin:.6rem 0 .2rem;flex-wrap:wrap}
.bench-switch b{font-size:.62rem;letter-spacing:.16em;color:#9a9488;font-weight:800;text-transform:uppercase;margin-right:.2rem}
.bench-switch button{min-height:44px;border-radius:999px;border:1px solid #0a0b0d;background:linear-gradient(#3a3e44,#1c1f23);color:#e6e1d6;padding:0 1.1rem;font-weight:800;font-size:.95rem;letter-spacing:.02em;box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 2px 0 #07080a}
.bench-switch button.on{background:linear-gradient(#ffe8b0,#e0a640);color:#2a1a08}
.simple-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;margin:.6rem 0 .3rem}
.simple-strip button{min-height:56px;border-radius:12px;border:1px solid #0a0b0d;font-weight:800;font-size:1.02rem;letter-spacing:.02em;padding:.4rem .5rem;line-height:1.15;color:#f3efe6;background:linear-gradient(#3a3e44,#1c1f23);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 3px 0 #07080a}
.simple-strip .s-play{background:linear-gradient(#ffe08a,#e09020);color:#2a1a08}
.simple-strip .s-play.go{background:linear-gradient(#ffb1a4,#c4452a);color:#2a0c08}
.simple-strip .s-clear{border-color:#c4452a;color:#ffb1a4}
.simple-strip .s-decks{border-color:#5b8fd6;color:#cfe2ff}
.simple-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:.45rem 0 0}
.simple-row>span{font-size:.72rem;letter-spacing:.14em;color:#9a9488;font-weight:800;text-transform:uppercase;min-width:4.2rem}
.simple-row>em{font-style:normal;color:#b7f7a8;font-size:.82rem;margin-left:.3rem}
.simple-row .sp-key{min-width:2.6rem;font-size:.85rem}
.simple-row .s-len,.simple-row .s-swing{border-color:#6ea56a;min-width:0;padding:0 .7rem}
.simple-row .s-len{margin-left:auto}
.simple-row .s-reset{border-color:#c4452a;color:#ffb1a4;min-width:0;margin-left:auto}
.simple-note{color:#ffd9a8;font-size:.9rem;margin:.3rem 0 0}
/* AOG-CHORD-PADS-V1 — chords sent from the piano, the guitar or the bass */
.chord-row .cp-list{color:#f3efe6;font:800 1rem/1.2 Georgia,"Times New Roman",serif;letter-spacing:.02em}
.chord-row .s-chords{border-color:#5b8fd6;color:#cfe2ff;min-width:0;padding:0 .8rem}
/* AOG-TAKE-TO-PADS-V1 — a take sent from a music tool, waiting for a pad; the menu is the machine's other menus (aog-dropdowns.js),
   and the row's key is a full 44px for a finger, as the chord row's now is */
.sample-row .sm-pad{min-height:44px;font-size:16px;flex:0 1 15rem;min-width:0;max-width:100%}
.chord-row .s-chords{min-height:44px}
.simple-line{color:#d7cbb8;font-size:.95rem;margin:.2rem 0 .6rem;line-height:1.4}
@media (max-width:520px){ .simple-strip{grid-template-columns:1fr 1fr} .simple-strip .s-play{grid-column:1 / -1} }
.machine.simple .sp-keys,.machine.simple .sp-banks,.machine.simple .scope-bezel,.machine.simple .sp-eq,.machine.simple .fader,.machine.simple .seg-label{display:none}

/* one colour per job, in both benches */
.sp-key,.sp-run,.sp-rec{min-height:44px;font-size:.7rem}
#clearBtn,#eraseBtn,#trkClr,#kitBackBtn,#kitUndoBtn{border-color:#c4452a;color:#ffb1a4}
#eraseBtn.on{background:linear-gradient(#ffb1a4,#c4452a);color:#2a0c08}

#saveWork,#toDecks,.file-sample{border-color:#5b8fd6;color:#cfe2ff}
.sp-top { position:relative; display:grid; grid-template-columns: 1fr auto; gap:10px; align-items:stretch; margin:.15rem 0 .7rem; }
.lcd {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

.sp-pad.hit, .sp-pad:active { transform: translateY(2px); background: linear-gradient(#4a4036, #221c18); box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 1px 0 #07080a; }

.seg-label { margin: .85rem 0 .3rem; }

.chassis-top { display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-bottom:.55rem; position:relative; }
.screws { display:flex; gap:.45rem; }
.screw {
  width:11px; height:11px; border-radius:50%;
  background: radial-gradient(circle at 35% 32%, #efe8d6, #8a8172 42%, #3a342c 70%);
  box-shadow: 0 1px 0 rgba(255,255,255,.25), inset 0 -1px 1px #000;

}

}
.cell::after {
  content:""; position:absolute; left:18%; right:18%; top:22%; bottom:22%; border-radius:2px;
  background:#24180c; box-shadow: inset 0 1px 2px #000;

  background: linear-gradient(#ffe08a, #e09020);

.sp-pad.muted { opacity:.42; }

.sp-segrow .sp-key { min-width: 2.1rem; }

/* AOG-MUSIC-STILL-V1 (2026-09-23) - the same stillness rules as Daily Drafts (AOG-DD-STILL-V1).
   Jimmy: "make sure that the Sampler and turn table follow the same protocols about off page
   scrolling (it is making me nausea at the moment)". */
html{overflow-x:clip; overscroll-behavior:none}
body{overflow-x:clip; overscroll-behavior:none}
body *{overscroll-behavior:contain}
input:not([type=range]):not([type=file]):not([type=checkbox]):not([type=radio]),select,textarea{font-size:max(16px,1em)}
@media (hover:none){ *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important} html{scroll-behavior:auto} }

/* AOG-MUSIC-TOUCH-V1 (2026-09-25) — Jimmy: "For the turntables, sometimes it takes
   a few taps. And the copy or paste pops up when I am clicking." A held or dragged
   finger read as "select this text", so iOS raised its copy/paste callout and ate
   the tap. Nothing on the machine is text to select: selection and the callout are
   off (fields and text areas keep them), every control answers the first tap with
   no double-tap wait, and the audio engine is woken on the very first touch. */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,a,label,input[type=range],.pill,.pad,.platter,canvas{touch-action:manipulation}
.platter,canvas.wave,canvas.zoom{touch-action:none}

/* AOG-DRUM-PLAY-V1 (2026-10-03) — Jimmy: "It must work flawlessly on iPhone, iPad
   or computer … keys are used on the computer for quick beat making." A pad now
   sounds the moment a finger lands (not when it lifts), every finger counts, and a
   pad never scrolls or zooms the page. On a computer the keys A S D F and J K L ;
   play the pads and Space starts and stops; each pad shows its key. */
.pad,.sp-pad{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.kc,.keys-line{display:none}
@media (hover:hover) and (pointer:fine){

function volGain(v){ return Math.max(0, Math.min(1, v)) * 0.94; }
/* a bench saved before this change kept a number on the old 0.08–0.55 knob;
   the same loudness on the new knob is a little under twice that. */
function fixVol(v){
  if(typeof v!=="number" || !isFinite(v)) return 0.8;
  if(v<=0.56) v=v*1.7;
  return Math.max(0.05, Math.min(1, v));
}
function ctx(){
  if(!actx){
    const AC=window.AudioContext||window.webkitAudioContext;
    /* AOG-DRUM-PLAY-V1 — an iPhone with its side switch on silent mutes web audio.
       A drum machine is something you play, so it plays like music does. */
    try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
    actx=new AC({latencyHint:"interactive"});
    /* AOG-DRUM-LOUDNESS-V1 (2026-09-22) — Jimmy: "the volume on the drum sampler
       is incredibly low at 100%." It was: the room-volume knob topped out at a
       master gain of 0.165, about 25 dB below the ceiling, so a full pattern
       peaked at -24 dBFS. The bench now runs at a normal level and a true
       LIMITER (not the gentle glue compressor) holds the peaks, so louder here
       still cannot clip or spike a classroom speaker. */
    bus=actx.createGain(); bus.gain.value=1;
    outFilter=actx.createBiquadFilter(); outFilter.type="lowpass";
    outFilter.frequency.value=cutoffHz(S.outF); outFilter.Q.value=0.65;
    comp=actx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=12; comp.ratio.value=2.6; comp.attack.value=0.004; comp.release.value=0.22;
    analyser=actx.createAnalyser(); analyser.fftSize=1024; analyser.smoothingTimeConstant=0.72;
    scopeData=new Uint8Array(analyser.fftSize);
    makeup=actx.createGain(); makeup.gain.value=2.1;
    limiter=actx.createDynamicsCompressor();
    limiter.threshold.value=-3; limiter.knee.value=0; limiter.ratio.value=20;
    limiter.attack.value=0.002; limiter.release.value=0.09;
    master=actx.createGain(); master.gain.value=volGain(S.vol);
    /* AOG-SP-EQ-V1 (2026-09-23) — the desk the machine was plugged into: four
       bands, the two middle ones sweepable, and a high-pass to lose the rumble.
       It sits after the bench's own voice and before the limiter, which is
       where an outboard EQ sat in 1987. */
    deskEq = AOGEq.desk(actx);
    applyEq();
    bus.connect(outFilter); outFilter.connect(comp); comp.connect(analyser);
    analyser.connect(deskEq.input); deskEq.output.connect(makeup);
    makeup.connect(limiter); limiter.connect(master);
    master.connect(actx.destination);
  }
  if(actx.state==="suspended") actx.resume();
  return actx;
}
function noiseBuf(ac){
  let n=noiseCache.get(ac);
  if(n) return n;
  n=ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d=n.getChannelData(0);
  /* AOG-DRUM-ROM-SEED-V1 (2026-10-03) — the same noise every time (a fixed seed, not Math.random), so
     every kit renders exactly the same each time the page opens, like the sounds in a real ROM chip.
     Before, a hat or a guiro could come out several decibels louder or quieter from one visit to the next. */
  let x=0x2f6b1a3d;
  for(let i=0;i<d.length;i++){ x^=x<<13; x^=x>>>17; x^=x<<5; d[i]=((x>>>0)/4294967296)*2-1; }
  noiseCache.set(ac, n);
  return n;
}
function softCurve(){
  if(_curve) return _curve;
  const n=256, c=new Float32Array(n);
  for(let i=0;i<n;i++){ const x=i/(n-1)*2-1; c[i]=Math.tanh(x*1.6); }
  _curve=c; return c;
}
function envGain(ac, dest, t0, peak, decay){
  const g=ac.createGain();
  const d=Math.max(0.02, decay);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.001, peak), t0+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+d);
  g.connect(dest);
  return g;
}
function tone(ac, dest, t0, type, f0, f1, peak, decay){
  const o=ac.createOscillator();
  o.type=type;
  o.frequency.setValueAtTime(Math.max(28, f0), t0);
  if(f1) o.frequency.exponentialRampToValueAtTime(Math.max(28, f1), t0+Math.min(decay, 0.2));
  const g=envGain(ac, dest, t0, peak, decay);
  o.connect(g); o.start(t0); o.stop(t0+decay+0.03);
}
function noiseHit(ac, dest, t0, type, freq, q, peak, decay){
  const src=ac.createBufferSource(); src.buffer=noiseBuf(ac);
  const f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq; if(q) f.Q.value=q;
  const g=envGain(ac, dest, t0, peak, decay);
  src.connect(f); f.connect(g); src.start(t0); src.stop(t0+decay+0.03);
}
/* AOG-SP-KITCD-V1 (2026-09-26) — Jimmy: "fill up C & D with other sounds you think would fit the
   SP-1200 the best." Bank C is the ELECTRO kit the machine was famous for pairing with — a long
   808-style boom, a snapping snare, a cowbell and a conga, a zap. Bank D is the DUSTY kit — the
   found percussion of a breakbeat: a thumping kick with a click, a cracking rimshot snare, a shaker,
   a tambourine, a finger snap, a timbale, a woodblock, a triangle. Both are baked through the same
   twelve bits and 26,040 Hz as A, so they crunch the same way. A sample loaded onto a pad still
   wins over the kit sound on that pad. */

                F:{kick:"808",snare:"SNARE",ch:"HAT",oh:"OPEN",clap:"CLAP",tom:"KICK",rim:"RIM",bell:"PLUCK"},
                G:{kick:"SOFT",snare:"BRUSH",ch:"TICK",oh:"SIZZLE",clap:"SNAP",tom:"TOM",rim:"RIM",bell:"KEYS"},
                H:{kick:"BOMBO",snare:"TIMBAL",ch:"GUIRO",oh:"MARACA",clap:"CLAVE",tom:"CONGA",rim:"BONGO",bell:"AGOGO"},
                I:{kick:"KICK",snare:"SNARE",ch:"HAT",oh:"OPEN",clap:"XSTICK",tom:"FLOOR",rim:"RIDE",bell:"CRASH"},
                /* AOG-DRUM-KITS-V3 */
                J:{kick:"KICK",snare:"SNARE",ch:"HAT",oh:"OPEN",clap:"CLAPS",tom:"TOM",rim:"STOMP",bell:"CRASH"},

                N:{kick:"KICK",snare:"SNARE",ch:"SHAKER",oh:"OPEN",clap:"TALK",tom:"CONGA",rim:"STICKS",bell:"BELL"},
                O:{kick:"BASS",snare:"SNARE",ch:"CLICK",oh:"CYMBAL",clap:"ROLL",tom:"TENOR",rim:"RIM",bell:"BELLS"}};
const KIT_LABEL={A:["Kit A · the classic","Kit A · el clásico"],B:["Kit B · the classic, retuned","Kit B · el clásico, reafinado"],C:["Kit C · electro","Kit C · electro"],D:["Kit D · dusty breaks","Kit D · breaks polvorientos"],
  E:["Kit E · boom bap","Kit E · boom bap"],F:["Kit F · 808 trap","Kit F · trap 808"],G:["Kit G · lo-fi","Kit G · lo-fi"],
  H:["Kit H · Latin percussion","Kit H · percusión latina"],I:["Kit I · live drums","Kit I · batería en vivo"],
  J:["Kit J · rock arena","Kit J · rock de estadio"],K:["Kit K · jazz brushes","Kit K · jazz con escobillas"],L:["Kit L · 909 house","Kit L · house 909"],
  M:["Kit M · reggae and dub","Kit M · reggae y dub"],N:["Kit N · afrobeat","Kit N · afrobeat"],O:["Kit O · marching band","Kit O · banda de marcha"]};
/* AOG-SP-KITBACK-V1 — Jimmy: "something is up with sound A, it is a bell." A sample he had loaded
   onto pad 1 of bank A was playing in place of the kick. The Simple bench now says which pads hold
   your own samples and offers one tap to put the kit sounds back on that bank. */
function userPads(){ const u=USER[S.bank]||{}; return VOICES.map(v=>v.id).filter(id=>!!u[id]); }
if(window.AOGDrumKit) AOGDrumKit.ids.forEach(b=>{ KIT_NAME[b]=AOGDrumKit.padNames(b); KIT_LABEL[b]=AOGDrumKit.label(b); });   /* AOG-DRUM-REAL-V1: the recorded kits' pad and menu names */
function kitKey(bank){ return bank==="B" ? "A" : bank; }       /* B is A, retuned */
function romFor(bank){ return ROMK[kitKey(bank)] || {}; }
function hiFor(bank){ return HIK[kitKey(bank)] || {}; }
function renderVoiceC(id, t0, dest, ac){
  if(id==="kick"){            /* the 808 boom: a sine that sags from 62 to 38 Hz and hangs on */
    tone(ac, dest, t0, "sine", 62, 38, 0.95, 0.85);
    tone(ac, dest, t0, "square", 900, 200, 0.08, 0.008);
  } else if(id==="snare"){    /* short, snapping, more noise than tone */
    tone(ac, dest, t0, "triangle", 210, 170, 0.22, 0.07);
    noiseHit(ac, dest, t0, "bandpass", 2600, 0.8, 0.5, 0.11);
    noiseHit(ac, dest, t0, "highpass", 6000, 0.7, 0.2, 0.05);
  } else if(id==="ch"){       /* a tick: very short metallic burst */
    noiseHit(ac, dest, t0, "highpass", 8000, 0.9, 0.3, 0.03);
    tone(ac, dest, t0, "square", 5200, 5200, 0.05, 0.02);
  } else if(id==="oh"){       /* a hiss that breathes out */
    noiseHit(ac, dest, t0, "highpass", 6500, 0.6, 0.22, 0.3);
    tone(ac, dest, t0, "square", 4100, 4100, 0.03, 0.22);
  } else if(id==="clap"){     /* the big electro clap: five bursts then a room */
    [0, 0.01, 0.02, 0.03, 0.045].forEach((off,i)=>noiseHit(ac, dest, t0+off, "bandpass", 1200+i*120, 0.9, 0.3, 0.08));
    noiseHit(ac, dest, t0+0.05, "bandpass", 1500, 0.7, 0.18, 0.28);
  } else if(id==="tom"){      /* a conga: a bright tap that drops fast */
    tone(ac, dest, t0, "sine", 330, 215, 0.6, 0.16);
    tone(ac, dest, t0, "triangle", 660, 430, 0.12, 0.03);
  } else if(id==="rim"){      /* the cowbell: two square waves a fifth-ish apart */
    tone(ac, dest, t0, "square", 540, 540, 0.12, 0.14);
    tone(ac, dest, t0, "square", 800, 800, 0.1, 0.12);
  } else if(id==="bell"){     /* the zap: a fast fall from high to low */
    tone(ac, dest, t0, "sawtooth", 2400, 90, 0.22, 0.1);
    tone(ac, dest, t0, "sine", 1200, 60, 0.18, 0.12);
  }
}
function renderVoiceD(id, t0, dest, ac){
  if(id==="kick"){            /* a thump with the beater's click on the front */
    tone(ac, dest, t0, "sine", 120, 52, 0.85, 0.2);
    noiseHit(ac, dest, t0, "lowpass", 900, 0.5, 0.18, 0.015);
    tone(ac, dest, t0, "triangle", 1400, 300, 0.1, 0.01);
  } else if(id==="snare"){    /* the rimshot crack: ring plus wire */
    tone(ac, dest, t0, "triangle", 240, 190, 0.3, 0.09);
    tone(ac, dest, t0, "square", 1900, 1400, 0.14, 0.03);
    noiseHit(ac, dest, t0, "bandpass", 3400, 0.6, 0.42, 0.15);
    noiseHit(ac, dest, t0, "highpass", 7000, 0.6, 0.16, 0.08);
  } else if(id==="ch"){       /* a shaker: three grains of sand */
    [0, 0.014, 0.03].forEach((off,i)=>noiseHit(ac, dest, t0+off, "highpass", 5500+i*800, 0.5, 0.16-i*0.03, 0.035));
  } else if(id==="oh"){       /* a tambourine: jingles ringing over a slap */
    noiseHit(ac, dest, t0, "bandpass", 5200, 0.7, 0.2, 0.22);
    [4200, 5600, 7100, 8900].forEach((f,i)=>tone(ac, dest, t0+i*0.006, "square", f, f*0.98, 0.035, 0.2));
  } else if(id==="clap"){     /* a finger snap: one dry pop */
    noiseHit(ac, dest, t0, "bandpass", 2200, 1.2, 0.5, 0.045);
    tone(ac, dest, t0, "sine", 700, 300, 0.12, 0.02);
  } else if(id==="tom"){      /* a timbale: a metal shell, ringing */
    tone(ac, dest, t0, "sine", 262, 210, 0.5, 0.22);
    tone(ac, dest, t0, "square", 1050, 1000, 0.07, 0.08);
    noiseHit(ac, dest, t0, "bandpass", 3000, 0.8, 0.12, 0.03);
  } else if(id==="rim"){      /* a woodblock: hollow and quick */
    tone(ac, dest, t0, "sine", 880, 840, 0.4, 0.05);
    tone(ac, dest, t0, "triangle", 1760, 1700, 0.12, 0.02);
  } else if(id==="bell"){     /* a triangle: high, thin, and it lasts */
    [[2960,0.12],[4420,0.08],[7200,0.04]].forEach(p=>tone(ac, dest, t0, "sine", p[0], p[0]*0.995, p[1], 0.55));
  }
}

function lowpass(ac, dest, hz){ const f=ac.createBiquadFilter(); f.type="lowpass"; f.frequency.value=hz; f.Q.value=0.5; f.connect(dest); return f; }
function driven(ac, dest, t0, f0, f1, glide, peak, decay, drive){   /* a sine pushed into a soft clip: an 808's body */
  const o=ac.createOscillator(); o.type="sine";
  o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0+glide);
  const pre=ac.createGain(); pre.gain.value=drive;
  const sh=ac.createWaveShaper(); sh.curve=softCurve();
  const g=ac.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(peak, t0+0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+decay);
  o.connect(pre); pre.connect(sh); sh.connect(g); g.connect(dest);
  o.start(t0); o.stop(t0+decay+0.03);
}
function metal(ac, dest, t0, base, decay, peak, hp){                  /* six square waves: a cymbal or a hat */
  [1, 1.47, 1.71, 2.04, 2.55, 2.97].forEach((r,i)=>{
    const o=ac.createOscillator(); o.type="square"; o.frequency.value=base*r*(i%2?1.006:0.994);
    const f=ac.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    const g=ac.createGain(); g.gain.setValueAtTime(peak, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+decay);
    o.connect(f); f.connect(g); g.connect(dest); o.start(t0); o.stop(t0+decay+0.02);
  });
}

  else if(id==="ch"){ noiseHit(ac, dest, t0, "highpass", 7500, 0.8, 0.28, 0.045); tone(ac, dest, t0, "square", 6200, 6200, 0.03, 0.03); }

  else if(id==="clap"){ [0, 0.011, 0.022].forEach(off=>noiseHit(ac, dest, t0+off, "bandpass", 1600, 1, 0.3, 0.09)); tone(ac, dest, t0, "triangle", 210, 170, 0.15, 0.08); noiseHit(ac, dest, t0+0.03, "bandpass", 1400, 0.7, 0.12, 0.25); }
  else if(id==="tom"){ tone(ac, dest, t0, "sine", 140, 90, 0.7, 0.35); noiseHit(ac, dest, t0, "lowpass", 600, 0.5, 0.08, 0.04); }
  else if(id==="rim"){ tone(ac, dest, t0, "triangle", 1800, 1200, 0.2, 0.025); tone(ac, dest, t0, "sine", 500, 480, 0.18, 0.04); noiseHit(ac, dest, t0, "bandpass", 3000, 1, 0.12, 0.02); }

async function putSample(){

async function putSampleNow(tk){

  const b=S.bank, id=(sel && VOICES.some(v=>v.id===sel.value)) ? sel.value : (SMP.pad || "bell");
  SMP.pad=id;
  try{ await ensureKit("A"); }catch(e){}                    /* the built-in kit's share of the memory is known */
  const src=tk.pcm instanceof Float32Array ? tk.pcm : new Float32Array(tk.pcm);
  const want=Math.min(src.length, Math.floor(2.5*26040));
  const u=USER[b][id];

    SMP.note="full"; S.lcdNote="MEM FULL"; paint();

    return null;
  }
  S.kitUndo={bank:b, user:Object.assign({},USER[b]), names:Object.assign({},USER_NAME[b]), trim:JSON.parse(JSON.stringify(S.trim[b]||{})), chord:Object.assign({},CHORDPAD[b])};
  const a=new Float32Array(n); a.set(src.subarray(0, n));

/* ══ AOG-DRUM-TO-DECKS-V1 (2026-09-23) ═══════════════════════════════════════
   Jimmy: "Can we hook up the drum sampler to these?" Two pages cannot share one
   audio engine, so the bench bounces the pattern as it stands — this bank, these
   channel settings, this swing, this tempo — straight to audio in an offline
   context (instant, not in real time), and leaves it on the shelf the Turntables

function wavBlob(L, R, sr){
  const n=L.length, bytes=44+n*4, ab=new ArrayBuffer(bytes), v=new DataView(ab);
  const str=(o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); };
  str(0,"RIFF"); v.setUint32(4,bytes-8,true); str(8,"WAVEfmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,2,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*4,true); v.setUint16(32,4,true); v.setUint16(34,16,true);
  str(36,"data"); v.setUint32(40,n*4,true);
  let o=44;
  for(let i=0;i<n;i++){
    let l=L[i], r=R[i];
    l=l>1?1:l<-1?-1:l; r=r>1?1:r<-1?-1:r;
    v.setInt16(o,l*32767,true); v.setInt16(o+2,r*32767,true); o+=4;
  }
  return new Blob([ab],{type:"audio/wav"});
}
async function bounceToDecks(){
  const btn=document.getElementById("toDecks");

    S.lcdNote="BOUNCING"; refreshLcd();

    const sr=44100;
    const chain=(S.trackOn && S.track.length) ? S.track : [S.seg];
    /* each segment runs at its OWN tempo, so the length of a pass is added up
       in seconds, not in steps */
    const segSec=(i)=>{ const sg=S.segs[i]; if(!sg) return 0;
      const len=Math.max(4, Math.min(16, sg.len||16));

       Jimmy carried a beat to the turntables and it came over thin: "only the
       high notes, missing the bass and the mids." It was: the bounce skipped two
       things the bench's own output has. The GLUE COMPRESSOR is what holds a kick
       down so the snare, the claps and the hats can be heard beside it — without
       it the limiter ducked the whole mix every time the kick landed, which on a
       phone speaker (that cannot play the kick anyway) leaves you hearing hats.
       And the OUTPUT EQ was not in the bounce at all, so a mix dialled in on the
       desk arrived flat. The chain below is now the bench's live chain, node for
       node, with the same numbers. ══════════════════════════════════════════ */

    eq.set("lmid", S.eq.lmid); eq.freq("lmid", S.eq.lmidF);

    /* what gets bounced is what you would hear: the track if it is playing one,

    while(guard++ < 64 && clock < loops*chainSec - 0.001){

          const late=(step%4===2||step%4===3);
          const swingAdd=late?(sw-0.5)*six*4:0;
          const when=clock + step*six + swingAdd + 0.03;
          VOICES.forEach(v=>{
            const val=sg.grid[v.id] && sg.grid[v.id][step];
            if(!val || !padHasSound(v.id) || !padOut(v.id)) return;
            const push=(sg.off && sg.off[v.id] ? (sg.off[v.id][step]||0) : 0)*six;
            node.port.postMessage(chanMsg(v.id, when+push, val)); hits++;

        clock += len*six;

    if(!hits){ S.lcdNote="NO PATTERN"; refreshLcd(); if(btn) btn.disabled=false; return; }
    await new Promise(r=>setTimeout(r,60));      /* let every hit reach the engine */
    const buf=await off.startRendering();
    const L=buf.getChannelData(0), R=buf.numberOfChannels>1?buf.getChannelData(1):buf.getChannelData(0);
    const blob=wavBlob(L,R,sr);

      (chain.reduce((n,i)=>n + Math.max(4, Math.min(16, (S.segs[i]&&S.segs[i].len)||16)), 0)/chain.length)/16/4));

    /* AOG-PIANO-V1: the piano loops this beat in time, so it is told exactly how long one pass is,
       how many passes there are, where the first downbeat sits, and the swing */
    await AOGHandoff.put("drumbench", { name:name, bpm:S.bpm, bars:bars, bank:S.bank, at:Date.now(), wav:blob,
      passSec:chainSec, loops:loops, offset:0.03, swing:snapSwing(S.swing) });

       goes missing on the turntables and nobody knows why */
    const soloed=Object.keys(S.solo).filter(k=>S.solo[k]);
    const muted=Object.keys(S.mute).filter(k=>S.mute[k]);
    S.lcdNote = soloed.length ? ("SENT · SOLO "+soloed.join(" ").toUpperCase())
              : muted.length ? ("SENT · MUTED "+muted.join(" ").toUpperCase())
              : "SENT TO DECKS";
    try{ mark("bounce"); paintLessonBoxSoon(); }catch(e){}           /* AOG-DRUM-BLEND-V1 */
    refreshLcd();
    setTimeout(()=>{ if(/^SENT/.test(S.lcdNote)){ S.lcdNote=""; refreshLcd(); } }, 3500);

async function takeSample(file){
  S.kitUndo=null;              /* AOG-DRUM-KITBACK-V2: a new sound ends "Put my sounds back" */
  try{
    ctx();
    await bootSampler();
    const id=S.sel||"kick";
    const old=USER[S.bank]&&USER[S.bank][id];
    const oldSec=old?old.length/26040:0;
    const free=Math.max(0, 10-(memUsed()-oldSec));
    const maxSec=Math.min(2.5, free);
    if(maxSec<0.08){ S.lcdNote="MEM FULL"; refreshLcd(); return; }
    const arr=await file.arrayBuffer();
    const decoded=await actx.decodeAudioData(arr.slice(0));
    const frames=Math.max(16, Math.floor(maxSec*26040));
    const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const off=new OC(1, frames, 26040);
    const src=off.createBufferSource();
    src.buffer=decoded; src.connect(off.destination); src.start(0);
    const audio=await off.startRendering();
    let q=quantize12(audio.getChannelData(0));
    let end=q.length-1;
    while(end>32 && Math.abs(q[end])<0.004) end--;
    q=q.slice(0, end+1);
    USER[S.bank][id]=q;
    USER_NAME[S.bank][id]=(file.name||"SAMP").replace(/\.[^.]+$/,"").replace(/[^a-z0-9]/gi,"").slice(0,6).toUpperCase()||"SAMP";
    if(CHORDPAD[S.bank]) delete CHORDPAD[S.bank][id];   /* AOG-CHORD-PADS-V1 */
    pushPad(id);
    S.lcdNote="END "+(q.length/26040).toFixed(2)+"s";
    save();
    paint();
  }catch(err){
    S.lcdNote="NO SAMPLE";
    refreshLcd();
  }
}
function idb(){

function packI16(f32){
  const u8=new Uint8Array(f32.length*2);
  const view=new DataView(u8.buffer);
  for(let i=0;i<f32.length;i++){
    let s=Math.round(Math.max(-1, Math.min(1, f32[i]))*2048);
    if(s>2047) s=2047; if(s<-2048) s=-2048;
    view.setInt16(i*2, s, true);
  }
  return u8;
}
function unpackI16(u8){
  const view=new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const n=Math.floor(u8.byteLength/2);
  const f=new Float32Array(n);
  for(let i=0;i<n;i++) f[i]=view.getInt16(i*2, true)/2048;
  return f;
}
function u8ToB64(u8){
  let s="";
  for(let i=0;i<u8.length;i+=0x8000){
    s+=String.fromCharCode.apply(null, u8.subarray(i, Math.min(u8.length, i+0x8000)));
  }
  return btoa(s);
}
function b64ToU8(b64){
  const bin=atob(b64);
  const u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  return u8;
}
function pcmToF32(pcm){
  if(!pcm) return null;
  if(typeof pcm==="string"){
    if(pcm.length>4000000) return null;
    try{ return unpackI16(b64ToU8(pcm)); }catch(e){ return null; }
  }
  if(pcm instanceof ArrayBuffer) return unpackI16(new Uint8Array(pcm));
  if(ArrayBuffer.isView(pcm)) return unpackI16(new Uint8Array(pcm.buffer, pcm.byteOffset, pcm.byteLength));
  return null;
}
function cleanGrid(g){

    if(!Array.isArray(g[v.id])) return;
    for(let i=0;i<16;i++) out[v.id][i]=g[v.id][i]?1:0;
  });

}

function applySession(o, quiet){
  S.kitUndo=null;              /* AOG-DRUM-KITBACK-V2 */
  if(!o || o.aog!=="drum-bench") return false;
  if(o.segs && o.segs.length){
    S.segs=o.segs.map(sg=>({grid:cleanGrid(sg.grid||{}), off:sg.off||emptyOff(), len:Math.max(4,Math.min(16,sg.len||16)), bpm:(typeof sg.bpm==="number"?Math.max(40,Math.min(240,Math.round(sg.bpm))):null), swing:(typeof sg.swing==="number"?snapSwing(sg.swing):null)}));
    while(S.segs.length<SEGS) S.segs.push({grid:emptyGrid(), off:emptyOff(), len:16});
    S.seg=0; useSeg(0);
    if(Array.isArray(o.track)) S.track=o.track.filter(n=>n>=0&&n<SEGS);
  } else if(o.grid){ segNow().grid=cleanGrid(o.grid); useSeg(S.seg); }
  if(o.trim) BANKS.forEach(b=>{ if(o.trim[b]) S.trim[b]=o.trim[b]; });
  if(TCS.indexOf(o.tc)>=0) S.tc=o.tc;
  if(o.bpm) S.bpm=Math.max(40, Math.min(240, Math.round(+o.bpm)||96));
  if(typeof o.swing==="number") S.swing=snapSwing(o.swing);
  /* AOG-SP-COURSE-FIXES-V1: the file carries the EQ now, and the segment you land on sets the tempo it was saved at */
  if(o.eq && typeof o.eq==="object") S.eq=Object.assign(S.eq, o.eq);
  if(S.segs){ useSeg(S.seg); }
  try{ applyEq(); }catch(e){}
  if(typeof o.vol==="number") S.vol=fixVol(o.vol);
  if(typeof o.outF==="number") S.outF=Math.max(0, Math.min(1, o.outF));
  if(typeof o.bit==="boolean") S.bit=o.bit;
  S.era = (typeof o.era==="number") ? Math.max(0, Math.min(1, o.era)) : (S.bit ? 1 : 0);
  S.bit = S.era >= 0.5;
  if(o.sliderMode==="mix"||o.sliderMode==="tune"||o.sliderMode==="decay") S.sliderMode=o.sliderMode;
  if(BANKS.indexOf(o.bank)>=0) S.bank=o.bank;
  if(typeof o.metro==="boolean") S.metro=o.metro;
  if(o.chan) VOICES.forEach(v=>{
    const c=o.chan[v.id]; if(!c) return;
    const ch=S.chan[v.id];
    if(typeof c.level==="number") ch.level=Math.max(0, Math.min(1, c.level));
    if(typeof c.tune==="number") ch.tune=Math.max(-7, Math.min(7, Math.round(c.tune)));
    if(typeof c.decay==="number") ch.decay=Math.max(0.2, Math.min(1, c.decay));
    if(typeof c.cutoff==="number") ch.cutoff=Math.max(0, Math.min(1, c.cutoff));

  let dropped=false;

    const bank=o.samples&&o.samples[b]; if(!bank) return;
    VOICES.forEach(v=>{
      const slot=bank[v.id]; if(!slot) return;
      let f=pcmToF32(slot.pcm); if(!f||!f.length) return;
      const cap=Math.floor(2.5*26040);
      if(f.length>cap) f=f.slice(0, cap);
      if(f.length/26040 > 10-memUsed()+0.01){ dropped=true; return; }

      if(slot.chord) CHORDPAD[b][v.id]=true;
    });
  });
  if(engine&&kitReady) pushBank();
  save();
  S.lcdNote=quiet?"":(dropped?"MEM FULL":"OPENED");
  if(!quiet){
    const note=S.lcdNote;
    setTimeout(function(){ if(S.lcdNote===note){ S.lcdNote=""; refreshLcd(); } }, 2200);
  }
  paint();

}

    const h=document.getElementById("hearNow"); if(h) h.textContent=hearNow();
  };
  const copyBtn=document.getElementById("copyBtn");
  if(copyBtn) copyBtn.onclick=()=>{
    S.clip=JSON.parse(JSON.stringify({grid:S.grid, off:S.off, len:segLen()}));
    S.lcdNote="SEG 0"+(S.seg+1)+" COPIED"; refreshLcd();
    setTimeout(()=>{ S.lcdNote=""; refreshLcd(); }, 1200);
  };
  const pasteBtn=document.getElementById("pasteBtn");
  if(pasteBtn) pasteBtn.onclick=()=>{
    if(!S.clip) return;
    const sg=segNow();
    sg.grid=JSON.parse(JSON.stringify(S.clip.grid));
    sg.off=JSON.parse(JSON.stringify(S.clip.off||emptyOff()));
    sg.len=S.clip.len||16;
    mark("paste");
    useSeg(S.seg); repaintGrid(); refreshLcd(); save();
  };
  const trkAdd=document.getElementById("trkAdd");
  if(trkAdd) trkAdd.onclick=()=>{
    if(S.track.length>=16) return;
    S.track.push(S.seg); refreshLcd(); save();
    const h=document.getElementById("hearNow"); if(h) h.textContent=hearNow();
  };
  const trkClr=document.getElementById("trkClr");
  if(trkClr) trkClr.onclick=()=>{ S.track=[]; S.trackOn=false;
    const tb=document.getElementById("trkBtn"); if(tb) tb.classList.remove("on");
    refreshLcd(); save(); };
  const trkBtn=document.getElementById("trkBtn");
  if(trkBtn) trkBtn.onclick=()=>{
    if(!S.track.length) return;
    S.trackOn=!S.trackOn;
    trkBtn.classList.toggle("on", S.trackOn);
    if(S.trackOn){ S.trkI=0; useSeg(S.track[0]); repaintGrid(); }
    refreshLcd(); save();
    if(S.trackOn && S.playing){ try{ lessonPlayed(); }catch(e){} }   /* AOG-DRUM-SONGS-V1: song mode switched on mid-beat counts as playing the track */
    const h=document.getElementById("hearNow"); if(h) h.textContent=hearNow();
  };
  const eqMap=[["eqLow","low"],["eqLM","lmid"],["eqLMF","lmidF"],["eqHM","hmid"],["eqHMF","hmidF"],["eqHigh","high"],["eqHp","hp"]];
  eqMap.forEach(([id,key])=>{
    const inp=document.getElementById(id);
    if(!inp) return;
    inp.value=String(S.eq[key]);
    inp.oninput=()=>{ ctx(); S.eq[key]=+inp.value; applyEq(); eqReadouts(); save(); };
  });
  eqReadouts();
  const eqFlat=document.getElementById("eqFlat");
  if(eqFlat) eqFlat.onclick=()=>{
    S.eq={low:0, lmid:0, lmidF:400, hmid:0, hmidF:2500, high:0, hp:20};
    ctx(); applyEq(); eqReadouts(); save();
    eqMap.forEach(([id,key])=>{ const i=document.getElementById(id); if(i) i.value=String(S.eq[key]); });
  };
  const eraseBtn=document.getElementById("eraseBtn");
  if(eraseBtn) eraseBtn.onclick=()=>{ S.erase=!S.erase; eraseBtn.classList.toggle("on", S.erase); refreshLcd(); };
  const muteBtn=document.getElementById("muteBtn");
  const soloBtn=document.getElementById("soloBtn");
  function padMode(which, btn, other){
    S.padMode = (S.padMode===which) ? null : which;
    if(btn) btn.classList.toggle("on", S.padMode===which);
    if(other) other.classList.remove("on");
    refreshLcd();
  }
  if(muteBtn) muteBtn.onclick=()=>padMode("mute", muteBtn, soloBtn);
  if(soloBtn) soloBtn.onclick=()=>padMode("solo", soloBtn, muteBtn);
  /* the trim marks are dragged on the screen itself */
  const scope=document.getElementById("scope");
  if(scope){
    let grab=null;
    const at=(e)=>{ const r=scope.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX-r.left)/r.width)); };
    scope.onpointerdown=(e)=>{
      if(S.sliderMode!=="trim" || !padSource(S.sel)) return;
      e.preventDefault(); try{ scope.setPointerCapture(e.pointerId); }catch(err){}
      const f=at(e);
      grab = Math.abs(f-trimStart(S.sel)) < Math.abs(f-trimEnd(S.sel)) ? "s" : "e";
      move(e);
    };
    function move(e){
      if(!grab) return;
      const f=at(e), tr=trimOf(S.sel);
      if(grab==="s") tr.start=Math.min(f, trimEnd(S.sel)-0.05);
      else tr.end=Math.max(f, trimStart(S.sel)+0.05);
      const fad=document.querySelector('[data-fader="'+S.sel+'"]');
      if(fad && S.sliderMode==="trim"){ fad.value=String(trimStart(S.sel));
        const lab=document.querySelector('[data-fread="'+S.sel+'"]'); if(lab) lab.textContent=faderSpec(S.sel).read; }
      pushPad(S.sel); save();
    }
    scope.onpointermove=move;
    const drop=()=>{ if(grab){ grab=null; ctx(); hit(S.sel, ctx().currentTime); } };
    scope.onpointerup=drop; scope.onpointercancel=drop;
  }
  const revBtn=document.getElementById("revBtn");
  if(revBtn) revBtn.onclick=()=>{
    const tr=trimOf(S.sel);
    tr.rev=!tr.rev;
    revBtn.classList.toggle("on", tr.rev);
    pushPad(S.sel); save();
    ctx(); hit(S.sel, ctx().currentTime);
  };
  const bpm=document.getElementById("bpm");
  if(bpm) bpm.oninput=()=>{
    S.bpm=+bpm.value;
    segNow().bpm=S.bpm;                 /* the tempo belongs to this segment */
    const o=document.getElementById("bpmOut"); if(o) o.textContent=S.bpm;
    refreshLcd();
    const h=document.getElementById("hearNow"); if(h) h.textContent=hearNow();
    save();
  };
  const outF=document.getElementById("outF");
  if(outF) outF.oninput=()=>{
    S.outF=+outF.value;
    const o=document.getElementById("filtOut"); if(o) o.textContent=cutoffHz(S.outF);
    if(outFilter) outFilter.frequency.value=cutoffHz(S.outF);
    save();
  };
  const vol=document.getElementById("vol");
  if(vol) vol.oninput=()=>{
    S.vol=+vol.value; const o=document.getElementById("volOut"); if(o) o.textContent=Math.round(S.vol*100);
    if(master) master.gain.value=volGain(S.vol); save();
  };
  const toDecks=document.getElementById("toDecks");
  if(toDecks) toDecks.onclick=bounceToDecks;
  const rec=document.getElementById("recBtn");
  if(rec) rec.onclick=()=>{ S.rec=!S.rec; rec.classList.toggle("on", S.rec); refreshLcd(); };
  const metro=document.getElementById("metroBtn");
  if(metro) metro.onclick=()=>{ S.metro=!S.metro; metro.classList.toggle("on", S.metro); save(); };
  const swingBtn=document.getElementById("swingBtn");
  if(swingBtn) swingBtn.onclick=()=>{
    const i=SWINGS.indexOf(snapSwing(S.swing));
    S.swing=SWINGS[(i+1)%SWINGS.length];
    segNow().swing=S.swing;               /* swing belongs to the segment too */
    swingBtn.textContent="SWING "+swingPct()+"%";
    save(); refreshLcd();
    const h=document.getElementById("hearNow"); if(h) h.textContent=hearNow();
  };
  const tap=document.getElementById("tapBtn");
  if(tap) tap.onclick=()=>{
    const now=performance.now();
    S.taps=S.taps||[];
    S.taps.push(now);
    S.taps=S.taps.filter(x=>now-x<2600);
    if(S.taps.length>=2){
      const dt=(S.taps[S.taps.length-1]-S.taps[S.taps.length-2])/1000;
      if(dt>=0.25 && dt<=1.5){
        S.bpm=Math.max(40, Math.min(240, Math.round(60/dt)));
        segNow().bpm=S.bpm;                 /* AOG-SP-COURSE-FIXES-V1: TAP sets this segment's tempo, like the slider */
        const o=document.getElementById("bpmOut"); if(o) o.textContent=S.bpm;
        const bpm=document.getElementById("bpm"); if(bpm) bpm.value=S.bpm;
        mark("tap");
        save(); refreshLcd();
      }
    }
  };
  document.querySelectorAll("[data-bank]").forEach(btn=>{
    btn.onclick=()=>{ useBank(btn.getAttribute("data-bank")); paint(); };
  });
  if(window.AOGDrumKit) AOGDrumKit.decorate(document, S.lang);   /* AOG-DRUM-REAL-V1: the recorded kits under their own heading in the Sounds menu */
  const sampleIn=document.getElementById("sampleIn");
  if(sampleIn) sampleIn.onchange=()=>{ const f=sampleIn.files&&sampleIn.files[0]; if(f) takeSample(f); };
  const saveWork=document.getElementById("saveWork");
  if(saveWork) saveWork.onclick=exportSession;
  const openWork=document.getElementById("openWork");
  if(openWork) openWork.onchange=()=>{ const f=openWork.files&&openWork.files[0]; if(f) openWorkFile(f); };
  scopeNote();
  document.querySelectorAll("[data-mode]").forEach(btn=>{
    btn.onclick=()=>{ S.sliderMode=btn.getAttribute("data-mode"); save(); paint(); };
  });
  document.querySelectorAll("[data-fader]").forEach(inp=>{
    inp.oninput=()=>{
      const id=inp.getAttribute("data-fader");
      const val=+inp.value;
      const ch=S.chan[id];
      if(S.sliderMode==="tune") ch.tune=val;
      else if(S.sliderMode==="decay") ch.decay=val;
      else if(S.sliderMode==="filter") ch.cutoff=val;
      else if(S.sliderMode==="trim"){ trimOf(id).start=val; pushPad(id); }
      else ch.level=val;
      const lab=document.querySelector('[data-fread="'+id+'"]');
      if(lab) lab.textContent=faderSpec(id).read;
      save();
    };
  });
  document.querySelectorAll("[data-preset]").forEach(btn=>{
    btn.onclick=()=>{ const p=PRESETS.find(x=>x.id===btn.getAttribute("data-preset")); if(p) loadBeat(p); };
  });
  document.querySelectorAll("[data-starter]").forEach(btn=>{
    btn.onclick=()=>{ const p=STARTERS.find(x=>x.id===btn.getAttribute("data-starter")); if(p) loadBeat(p); };
  });
  const undoB=document.getElementById("undoBeat");
  if(undoB) undoB.onclick=undoBeat;
  /* AOG-DRUM-ERA-V1 — the dial is read on every hit, so a move is heard on the very next one */
  const eraIn=document.getElementById("era");
  if(eraIn) eraIn.oninput=()=>{
    S.era=Math.max(0, Math.min(1, 1-(+eraIn.value)/100)); S.bit=S.era>=0.5;
    const o=document.getElementById("eraOut"); if(o) o.textContent=eraWord();
    eraIn.setAttribute("aria-valuetext", eraWord());
    const hn=document.getElementById("hearNow"); if(hn) hn.textContent=hearNow();
    clearTimeout(eraIn.t); eraIn.t=setTimeout(save, 250);
  };
  const rollB=document.getElementById("rollBtn");
  if(rollB) rollB.onclick=()=>{ S.roll=ROLLS[(ROLLS.indexOf(S.roll)+1)%ROLLS.length]; holdNone(); save(); paint(); };
  /* AOG-DRUM-PLAY-V1 — a pad sounds on pointerdown, the instant a finger, pen or
     mouse lands, and each finger is its own hit. The click that follows is skipped.
     Mute, solo and an empty pad (which opens the file picker, and Safari only
     allows that on a finished tap) still wait for the click. */
  document.querySelectorAll("[data-pad]").forEach(btn=>{
    const id=btn.getAttribute("data-pad");
    let downAt=0;
    btn.onpointerdown=(e)=>{
      if(e.button>0) return;
      if(S.padMode==="mute" || S.padMode==="solo" || !padHasSound(id)) return;
      if(e.pointerType==="mouse") e.preventDefault();     /* focus stays put, so Space still plays */
      downAt=performance.now();
      padFire(id);
      if(S.roll!=="off"){ try{ btn.setPointerCapture(e.pointerId); }catch(err){} holdStart(id); }
    };
    btn.onpointerup=btn.onpointercancel=btn.onlostpointercapture=()=>holdEnd(id);
    btn.onclick=()=>{ if(downAt && performance.now()-downAt<1500){ downAt=0; return; } padFire(id); };
    btn.onkeydown=(e)=>{ if(e.key==="Enter"){ e.preventDefault(); if(!e.repeat) padFire(id); } };
  });
  document.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick=()=>{
      const j=JOBS[S.jobI||0];
      const ok=btn.getAttribute("data-a")===j.a;
      btn.classList.add(ok?"right":"wrong");
      const fb=document.getElementById("fb");
      if(fb) fb.textContent=ok?t("thatsIt"):t("notThat");
    };
  });
  const again=document.getElementById("againBtn");
  if(again) again.onclick=()=>{ S.jobI=((S.jobI||0)+1)%JOBS.length; paint(); };
  const pr=document.getElementById("printBtn");
  if(pr) pr.onclick=()=>window.print();
  document.querySelectorAll("[data-print]").forEach(b=>b.onclick=()=>{ document.body.setAttribute("data-print",b.dataset.print); window.print(); });
  ensureScope();
}

document.getElementById("langBtn").onclick=()=>{
  S.lang=S.lang==="en"?"es":"en";
  try{ localStorage.setItem("aog.lang", S.lang); }catch(e){}
  paint();
};
document.getElementById("themeBtn").onclick=()=>{
  S.theme=S.theme==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",S.theme);
  document.documentElement.classList.toggle("dark", S.theme==="dark");
  try{ localStorage.setItem("aog.interior.ws.v1.theme", S.theme); }catch(e){}
  paint();
};
window.addEventListener("hashchange", paint);
window.addEventListener("pagehide", function(){
  stop();
  if(!benchReady && !userTouched) return;
  clearTimeout(save.t);
  idbPut(sessionObject()).catch(function(){});
});
document.addEventListener("visibilitychange", ()=>{ if(document.hidden){ holdNone(); stop(); } });
/* AOG-DRUM-PLAY-V1 — keyboard pads. A S D F and J K L ; play pads 1 to 8 (by key
   position, so other keyboard layouts work too). Holding a key plays it once.
   Space starts and stops, unless another button (not a pad or a grid square) has focus. Typing in a box,
   or a key with Ctrl, Alt or Cmd, is left alone. */
(function(){
  let spaceTaken=false;
  function typing(el){
    if(!el || !el.tagName) return false;
    const tag=el.tagName;
    return el.isContentEditable || tag==="TEXTAREA" || tag==="SELECT" || (tag==="INPUT" && el.type!=="range");
  }
  document.addEventListener("keydown", (e)=>{
    if(e.metaKey || e.ctrlKey || e.altKey || typing(e.target)) return;
    const i=KEYPAD.indexOf(e.code);
    if(i>=0){
      const id=VOICES[i].id;
      if(!document.querySelector('[data-pad="'+id+'"]')) return;
      e.preventDefault();
      if(e.repeat) return;
      if(!padHasSound(id) && S.padMode!=="mute" && S.padMode!=="solo"){
        S.sel=id; refreshLcd();
        document.querySelectorAll(".sp-pad").forEach(p=>p.classList.toggle("sel", p.getAttribute("data-pad")===id));
        return;
      }
      padFire(id);
      holdStart(id);
      return;
    }
    if(e.code==="Space"){
      const pb=document.getElementById("playBtn"); if(!pb) return;
      const ctl=e.target.closest && e.target.closest("button,a,summary,label,[role=button]");
      /* a grid square keeps focus after a click, so Space still means play there (Enter toggles it) */
      if(ctl && !ctl.hasAttribute("data-pad") && !ctl.classList.contains("cell") && ctl!==pb && ctl.getAttribute("data-simple")!=="play") return;
      e.preventDefault(); spaceTaken=true;
      if(!e.repeat) pb.click();
    }
  });
  document.addEventListener("keyup", (e)=>{
    const i=KEYPAD.indexOf(e.code); if(i>=0) holdEnd(VOICES[i].id);
    if(e.code==="Space" && spaceTaken){ spaceTaken=false; e.preventDefault(); }
  });
  window.addEventListener("blur", holdNone);
  /* the real label on this keyboard for each key, where the browser can tell us */
  try{
    if(navigator.keyboard && navigator.keyboard.getLayoutMap) navigator.keyboard.getLayoutMap().then((m)=>{
      KEYPAD.forEach((c,i)=>{ const k=m.get(c); if(k) KEYCAP[i]=k.toUpperCase(); });
      document.querySelectorAll("[data-kc]").forEach(el=>{ el.textContent=KEYCAP[+el.getAttribute("data-kc")]; });
      document.querySelectorAll(".keys-line").forEach(el=>{ el.outerHTML=keysLine(); });
    }).catch(()=>{});
  }catch(e){}
})();
paint();
/* AOG-CHORD-PADS-V1 — chords from the piano, the guitar or the bass, on the shelf the music tools share;
   AOG-TAKE-TO-PADS-V1 — and a take from any of them, waiting for a pad */
checkChordPads(); checkDrumSample();
try{ AOGHandoff.listen(function(key){ if(key==="chordpads") checkChordPads(); else if(key==="drumsample") checkDrumSample(); }); }catch(e){}
window.addEventListener("focus", ()=>{ checkChordPads(); checkDrumSample(); });
let benchReady=false;
idbGet().then(function(o){
  benchReady=true;
  if(!o || o.aog!=="drum-bench" || userTouched) return;
  applySession(o, true);
}).catch(function(){ benchReady=true; });
</script>
<script>
/* AOG-PGPANEL-V1 - the guide loads only when the bar is opened, and the frame is
   grown to its content so the panel scrolls with the page instead of inside itself. */
(function(){
  var d=document.getElementById("pgPanel"); if(!d) return;
  var f=document.getElementById("pgFrame"); if(!f) return;
  function fit(){
    try{ var b=f.contentDocument&&f.contentDocument.body;
         if(b){ var h=b.scrollHeight; if(h>240) f.style.height=(h+28)+"px"; } }catch(e){}
  }
  d.addEventListener("toggle", function(){
    if(d.open && !f.getAttribute("src")) f.setAttribute("src", f.getAttribute("data-src"));
  });
  f.addEventListener("load", function(){ fit(); setTimeout(fit,250); setTimeout(fit,1200); });
  var t; window.addEventListener("resize", function(){ clearTimeout(t); t=setTimeout(fit,150); });
})();
</script>
<script>/* AOG-MUSIC-TOUCH-V1 — wake Safari's audio on the first touch, every time it sleeps */
(function(){ function wake(){ try{ if(typeof actx!=="undefined"&&actx&&actx.state!=="running") actx.resume(); }catch(e){} }
  ["touchstart","touchend","pointerdown","click","keydown"].forEach(function(t){ document.addEventListener(t, wake, {capture:true, passive:true}); }); })();
/* AOG-SOUND-HANDOFF-V1 — a sound sent from the oscilloscope becomes this pad's sample */
(function(){ if(!/[?&]take=1/.test(location.search)||!window.aogHandoffTake) return;
  setTimeout(function(){ window.aogHandoffTake().then(function(v){ if(v&&v.blob) takeSample(new File([v.blob], v.name||"scope.wav", {type:"audio/wav"})); }); }, 900); })();
</script>
</body>
