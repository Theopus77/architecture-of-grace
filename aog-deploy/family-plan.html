function xp(r){ try{ const x=typeof r.extra==="string"?JSON.parse(r.extra):(r.extra||{}); return x&&typeof x==="object"?x:{}; }catch(e){ return {}; } }
function dayOf(r){ return String(r.date||r.timestamp||"").slice(0,10); }
const SUBJ={math:["Math","Matemáticas"],ela:["Language Arts","Lenguaje"],science:["Science","Ciencias"],write:["Writing","Escritura"]};
function schoolData(){ const mine=get("aog.practice.mine",[])||[], rem=get("aog.practice.remote",[])||[], seen={}, pr=[];
  [[mine,"mine"],[rem,"sheet"]].forEach(([a,src])=>{ (Array.isArray(a)?a:[]).forEach(r=>{ if(!r||!isKid(r)||!/^\d{4}-\d\d-\d\d$/.test(dayOf(r))) return; const k=fold(r.studentId)+"|"+String(r.activityId||"")+"|"+String(r.timestamp||"").slice(0,16); if(seen[k]) return; seen[k]=1; pr.push(Object.assign({_src:src},r)); }); });
  const slips=(get("aog.slips.mine",[])||[]).concat(get("aog.checkin.remote",[])||[]).filter(r=>r&&isKid(r)&&String(r.respondentRole||"student")!=="parent");
  return {pr, slips}; }
function thSeries(){ return TH().map(t=>({name:t.name,pts:Object.keys(t.sessions||{}).filter(d=>/^\d{4}-\d\d-\d\d$/.test(d)&&t.sessions[d].r>=1).sort().map(d=>({d,v:t.sessions[d].r}))})).filter(x=>x.pts.length); }
function byDay(rows,val){ const m={}; rows.forEach(r=>{ const v=val(r); if(v==null||isNaN(v)) return; (m[dayOf(r)]=m[dayOf(r)]||[]).push(v); });
  return Object.keys(m).sort().slice(-40).map(d=>({d,v:Math.round(10*m[d].reduce((a,b)=>a+b,0)/m[d].length)/10})); }
function vSchool(){ const t=T(), es=lang()==="es", S=schoolData(), handed=get("aog.dash2.handedAll",[]);
  let body="", lines=[];
  const scored=S.pr.filter(r=>+r.itemsTotal>0&&r.independent!=null&&!isNaN(r.independent)), pc=r=>Math.round(100*Math.min(+r.independent,+r.itemsTotal)/+r.itemsTotal);
  const srcOf=rs=>rs.every(r=>r._src==="mine")?t.srcMine:rs.every(r=>r._src==="sheet")?t.srcSheet:t.srcMine+" + "+t.srcSheet;
  const dd={}, other=[]; scored.forEach(r=>{ const x=xp(r), id=String(r.activityId||""); if(x.series==="daily-drops"||/^dd-/.test(id)){ const m=/^dd-([a-z]+)/.exec(id), sb=String(x.subject||(m&&m[1])||"other"); (dd[sb]=dd[sb]||[]).push(r); } else other.push(r); });
  Object.keys(dd).forEach(sb=>{ const rs=dd[sb], nm=(SUBJ[sb]||[sb.charAt(0).toUpperCase()+sb.slice(1),sb])[es?1:0], it=rs.reduce((a,r)=>a+(+r.itemsTotal),0), ok=rs.reduce((a,r)=>a+Math.min(+r.independent,+r.itemsTotal),0);
    lines.push(t.ddLine(nm,rs.length,Math.round(100*ok/it))+srcCap(srcOf(rs),rs.map(r=>({d:dayOf(r)})),t.sheets));
    body+=chart(byDay(rs,pc),0,100,t.ddChart(nm),"#2E7D4F",srcOf(rs),t.sheets); });
  if(other.length){ const it=other.reduce((a,r)=>a+(+r.itemsTotal),0), ok=other.reduce((a,r)=>a+Math.min(+r.independent,+r.itemsTotal),0); lines.push(t.workLine(other.length,Math.round(100*ok/it))+srcCap(srcOf(other),other.map(r=>({d:dayOf(r)})),es?"trabajos":"pieces")); }
  const ck=S.slips.filter(r=>/^(daily|checkin)$/.test(String(r.checkinType||r.slipType||""))&&+r.readiness>=1);
  if(ck.length) body+=chart(byDay(ck,r=>+r.readiness),1,5,t.readyChart,"#2F63B8",ck.some(r=>r.mine)?t.srcMine:t.srcSheet,t.answers);
  [["slip-endclass","got",t.gotChart],["slip-test","ready",t.testChart]].forEach(([ty,q,cap])=>{ const rs=S.slips.filter(r=>String(r.checkinType||"")===ty&&+((xp(r).scale||{})[q])>=1);
    if(rs.length) body+=chart(byDay(rs,r=>+xp(r).scale[q]),1,5,cap,"#B8893A",rs.every(r=>r.mine)?t.srcMine:t.srcSheet,t.answers); });
  let links="";
  if(Array.isArray(handed)&&handed.length) links='<p class="k" style="margin-top:12px">'+t.schoolLine+'</p><ul>'+handed.slice(0,6).map(x=>{ const it=(x&&x.items)||[], names=(Array.isArray(it)?it:[]).map(i=>typeof i==="string"?i:(i&&(i.t||i.title||i.name||i.id))||"").filter(Boolean);
      return '<li>'+(x.at?esc(new Date(x.at).toLocaleDateString(es?"es":"en-US"))+" — ":"")+esc(names.slice(0,4).join(", ")||"—")+'</li>'; }).join("")+'</ul>';
  const any=lines.length||body||links;
  return '<div class="card sec" id="fromSchool"><h3>'+t.school+'</h3>'+(any?'<p class="sub" style="margin:0 0 6px">'+t.schoolIntro+'</p>'+(lines.length?'<ul>'+lines.map(l=>'<li>'+esc(l)+'</li>').join("")+'</ul>':'')+body+links:'<p class="muted" style="margin:0">'+t.schoolNone+'</p>')+'</div>'; }
function canSend(){ return /^https:\/\//.test(raw("aog.sync.url")) && !!(raw("aog.sync.writekey")||raw("aog.sync.key")); }
function planText(){ const t=T(), eng=build(), pl=P(); let s=t.h1+" — "+child+"\n"+t.planTop+"\n\n";
  s+=t.who+"\n"+(pl.who||"—")+"\n\n";
  ["strengths","hard","helps","routines","goals","therapies","sleepmood"].forEach(k=>{ const own=pl.sec&&pl.sec[k]; s+=t.S[k]+"\n"+((own?own.text:engineText(eng,k))||t.nodata)+"\n\n"; });
  return s+t.questions+"\n"+(pl.q||"—")+"\n"; }
/* AOG-FAMILY-PLAN-SEND-V2 (2026-09-28) — so the teacher's dashboard can draw the same charts: the day-by-day numbers
   (last 90 days each), the family's own words, and every section as the family sees it (their edits win). */
function sendExtra(eng){ const pl=P(), last=a=>(a||[]).slice(-90), sec={};
  ["strengths","hard","helps","routines","goals","therapies","sleepmood"].forEach(k=>{ const own=pl.sec&&pl.sec[k]; sec[k]=((own?own.text:engineText(eng,k))||"").split("\n").map(x=>x.replace(/^•\s*/,"").trim()).filter(Boolean).slice(0,12); });
  return {v:2,lang:lang(),plan:planText(),summary:eng.summary,therapies:engineText(eng,"therapies"),
    words:{who:String(pl.who||"").slice(0,1000),questions:String(pl.q||"").slice(0,1000)},sections:sec,
    series:{sleep:last(eng.sleep),mood:last(eng.mood),routines:eng.routines.map(r=>({name:r.name,pts:last(r.series)})),
      goals:eng.goals.map(g=>({text:g.text,status:g.status,pts:last(g.series)})),therapies:thSeries().map(x=>({name:x.name,pts:last(x.pts)}))}}; }
window.__aogFamilyPayload=()=>{ const eng=build(); return {action:"checkin",checkinType:"family-plan",studentId:child,timestamp:new Date().toISOString(),date:today(),source:"family",extra:JSON.stringify(sendExtra(eng))}; };
function doSend(){ const box=document.getElementById("sendBox"), t=T(), eng=build();
  const payload={action:"checkin",checkinType:"family-plan",_backendAuth:raw("aog.sync.writekey")||raw("aog.sync.key"),studentId:child,
    timestamp:new Date().toISOString(),date:today(),source:"family",extra:JSON.stringify(sendExtra(eng))};
  const body=JSON.stringify(payload), url=raw("aog.sync.url"); box.innerHTML='<p class="sub">'+t.sending+'</p>';
  fetch(url,{method:"POST",mode:"cors",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body})
   .then(r=>r.json()).then(j=>{ box.innerHTML='<p class="'+(j&&j.ok?"saved":"sub")+'">'+(j&&j.ok?t.sent:t.sendErr)+'</p>'; })
   .catch(()=>fetch(url,{method:"POST",mode:"no-cors",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body})
     .then(()=>{ box.innerHTML='<p class="saved">'+t.sent+'</p>'; }).catch(()=>{ box.innerHTML='<p class="sub">'+t.sendErr+'</p>'; })); }

function vFoot(){ const t=T(); return '<div class="card noprint"><p class="sub" style="margin:0 0 8px">'+t.privacy+'</p><button type="button" class="b small" id="del">'+t.del+'</button><div id="delBox"></div></div>'; }

function render(){ const t=T(); document.querySelectorAll("[data-t]").forEach(n=>n.textContent=t[n.dataset.t]); document.title=t.h1+" — Architecture of Grace";
  fixChild(); let h=header();
  if(child){ h+= part===0?vToday(): part===1?vGoals(): vPlan(); h+=vFoot(); }
  const y=window.scrollY; app.innerHTML=h; window.scrollTo(0,y); }

app.addEventListener("click",ev=>{ const b=ev.target.closest("button"); if(!b) return; const d=b.dataset, t=T();
  if(b.id==="addKid"){ const v=(document.getElementById("newKid").value||"").trim().slice(0,40); if(!v) return; const a=get("aog.family.kids.v1",[]); if(!kids().some(k=>k.toLowerCase()===v.toLowerCase())) a.push(v); put("aog.family.kids.v1",a); child=v; put("aog.family.child",v); return render(); }
  if(d.part!=null){ part=+d.part; put("aog.family.part",part); return render(); }
  if(d.mood) setEntry(e=>e.mood=+d.mood);
  else if(d.feel) setEntry(e=>{ const a=e.feel||[], i=a.indexOf(d.feel); i<0?a.push(d.feel):a.splice(i,1); e.feel=a; });
  else if(d.help) setEntry(e=>{ const a=e.help||[], i=a.indexOf(d.help); i<0?a.push(d.help):a.splice(i,1); e.help=a; });
  else if(d.sleep) setEntry(e=>e.sleep=(+e.sleep===+d.sleep?0:+d.sleep));
  else if(d.hw) setEntry(e=>{ e.hw=e.hw===d.hw?"":d.hw; if(!e.hw||e.hw==="none") delete e.hwHow; });
  else if(d.hwhow) setEntry(e=>e.hwHow=e.hwHow===d.hwhow?"":d.hwhow);
  else if(d.rt) setEntry(e=>{ e.rt=e.rt||{}; if(e.rt[d.rt]===d.rv) delete e.rt[d.rt]; else e.rt[d.rt]=d.rv; });
  else if(d.rtadd!=null||b.id==="rtAddOwn"){ const v=(d.rtadd!=null?d.rtadd:(document.getElementById("rtNew").value||"")).trim().slice(0,60); if(!v) return; const rs=R(); rs.push({id:"r"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:v,status:"active"}); saveR(rs); }
  else if(d.rtmv!=null){ const rs=R(), i=+d.rtmv, j=i+(+d.dir); if(j<0||j>=rs.length) return; const x=rs[i]; rs[i]=rs[j]; rs[j]=x; saveR(rs); }
  else if(d.rtpause){ saveR(R().map(r=>r.id===d.rtpause?Object.assign(r,{status:r.status==="paused"?"active":"paused"}):r)); }
  else if(d.rtdel){ saveR(R().filter(r=>r.id!==d.rtdel)); }
  else if(d.g) { const gs=G(); gs.forEach(g=>{ if(g.id===d.g){ g.marks=g.marks||{}; if(g.marks[day]===+d.gv) delete g.marks[day]; else g.marks[day]=+d.gv; } }); saveG(gs); }
  else if(b.id==="gAdd"||d.gstart!=null){ const v=(d.gstart!=null?d.gstart:(document.getElementById("gNew").value||"")).trim().slice(0,120); const gs=G(); if(!v||gs.filter(g=>g.status!=="done").length>=5) return; gs.push({id:"g"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),text:v,status:"active",created:today(),marks:{}}); saveG(gs); }
  else if(d.gp){ saveG(G().map(g=>g.id===d.gp?Object.assign(g,{status:g.status==="paused"?"active":"paused"}):g)); }
  else if(d.gf){ saveG(G().map(g=>g.id===d.gf?Object.assign(g,{status:"done"}):g)); }
  else if(d.gdel){ saveG(G().filter(g=>g.id!==d.gdel)); }
  else if(d.thadd!=null||b.id==="thAddOwn"){ const own=d.thadd==null, v=(own?(document.getElementById("thNew").value||""):t.th.starters[d.thadd]||"").trim().slice(0,60); if(!v) return;
    const ts=TH().map(q=>{ delete q.fresh; return q; }); ts.push({id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),kind:own?"other":d.thadd,name:v,status:"active",sessions:{},fresh:1,where:d.thadd==="homebound"?"home":""}); saveTH(ts); }
  else if(d.tsr){ setTh(d.tsr,x=>{ x.sessions=x.sessions||{}; const s=x.sessions[day]||{}; if(s.r===+d.r){ delete s.r; } else s.r=+d.r; if(s.r||s.note) x.sessions[day]=s; else delete x.sessions[day]; }); }
  else if(d.thc){ setTh(d.th,x=>{ x[d.thc]=x[d.thc]===d.v?"":d.v; }); }
  else if(d.thend){ setTh(d.thend,x=>{ x.status=x.status==="ended"?"active":"ended"; }); }
  else if(d.thdel){ saveTH(TH().filter(q=>q.id!==d.thdel)); }
  else if(d.edit){ const k=d.edit; if(busy[k]){ const ta=app.querySelector('[data-sec="'+k+'"]'); const et=engineText(build(),k), pl=P(); pl.sec=pl.sec||{};
      if(ta && ta.value.trim()!==( (pl.sec[k]&&pl.sec[k].text) || et ).trim()) pl.sec[k]={text:ta.value.trim(),base:et}; saveP(pl); delete busy[k]; } else busy[k]=1; }
  else if(d.usenew){ const pl=P(); if(pl.sec) delete pl.sec[d.usenew]; saveP(pl); }
  else if(b.id==="print"){ window.print(); return; }
  else if(b.id==="send"){ document.getElementById("sendBox").innerHTML='<div class="confirm"><p style="margin:0 0 8px">'+esc(t.sendAsk)+'</p><div class="row"><button type="button" class="b solid" id="sendYes">'+t.yesSend+'</button><button type="button" class="b" id="sendNo">'+t.keep+'</button></div></div>'; return; }
  else if(b.id==="sendYes"){ doSend(); return; }
  else if(b.id==="sendNo"){ document.getElementById("sendBox").innerHTML=""; return; }
  else if(b.id==="del"){ document.getElementById("delBox").innerHTML='<div class="confirm"><p style="margin:0 0 8px">'+esc(t.delAsk(child))+'</p><div class="row"><button type="button" class="b solid" id="delYes">'+t.yesDel+'</button><button type="button" class="b" id="delNo">'+t.keep+'</button></div></div>'; return; }
  else if(b.id==="delNo"){ document.getElementById("delBox").innerHTML=""; return; }
  else if(b.id==="delYes"){ ["log","goals","routines","plan","therapies"].forEach(w=>{ try{ localStorage.removeItem(key(w,child)); }catch(e){} });
    put("aog.family.kids.v1",get("aog.family.kids.v1",[]).filter(k=>String(k).toLowerCase()!==child.toLowerCase())); child=""; }
  else return;
  render(); });
app.addEventListener("change",ev=>{ const el=ev.target;
  if(el.id==="kid"){ child=el.value; put("aog.family.child",child); busy={}; render(); }
  else if(el.id==="day"){ day=el.value&&el.value<=today()?el.value:today(); render(); } });
app.addEventListener("input",ev=>{ const el=ev.target, d=el.dataset;
  if(d.note) setEntry(e=>e[d.note]=el.value.slice(0,400));
  else if(d.rtnote) setEntry(e=>{ e.rtNote=e.rtNote||{}; e.rtNote[d.rtnote]=el.value.slice(0,140); });
  else if(d.rtname){ saveR(R().map(r=>r.id===d.rtname?Object.assign(r,{name:el.value.slice(0,60)||r.name}):r)); }
  else if(d.thf){ const v=el.value, f=d.thf; setTh(d.th,x=>{ x[f]=f==="work"?v.split("\n").slice(0,3).join("\n").slice(0,300):f==="name"?(v.slice(0,60)||x.name):v.slice(0,f==="practice"?200:60); }); }
  else if(d.tsnote){ setTh(d.tsnote,x=>{ x.sessions=x.sessions||{}; const s=x.sessions[day]||{}; s.note=el.value.slice(0,140); if(s.r||s.note) x.sessions[day]=s; else delete x.sessions[day]; }); }
  else if(d.fam){ const pl=P(); pl[d.fam]=el.value.slice(0,2000); saveP(pl); } });
app.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&ev.target.tagName==="INPUT"){ const m={newKid:"addKid",rtNew:"rtAddOwn",gNew:"gAdd",thNew:"thAddOwn"}[ev.target.id]; if(m){ ev.preventDefault(); document.getElementById(m).click(); } } });
window.addEventListener("beforeprint",()=>{ if(part!==2&&child){ part=2; render(); } });
render();
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});
})();
</script>
<script src="/aog-grace.js" defer></script>
</body>
