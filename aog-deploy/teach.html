<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><style id="aog-first-paint">/* AOG-ONE-PAINT-V1 */html{background:#F7F2E6}html[data-theme="dark"]{background:#0A1E33}html:not(.aog-ready) body{visibility:hidden;animation:aogOnePaint 0s linear 1.1s forwards}@keyframes aogOnePaint{to{visibility:visible}}@media print{html:not(.aog-ready) body{visibility:visible;animation:none}}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){var t="light";try{if(localStorage.getItem("aog.theme.lightstart.v1")==="1"&&localStorage.getItem("aog.interior.ws.v1.theme")==="dark")t="dark";}catch(e){}document.documentElement.setAttribute("data-theme",t);})();</script>
<title>Teach It Tomorrow — Architecture of Grace</title>
<meta name="description" content="A ready plan for any unit in any Architecture of Grace course: the goal, the standards, the words, day-by-day lessons and the supports that help. Print it or teach from the screen. Free, in English and Spanish.">
<link rel="canonical" href="https://architectureofgrace.com/teach">
<meta property="og:title" content="Teach It Tomorrow — Architecture of Grace">
<meta property="og:description" content="A ready plan for any unit in any course: the goal, the standards, the words, day-by-day lessons and the supports that help.">
<meta property="og:url" content="https://architectureofgrace.com/teach">
<meta property="og:image" content="https://architectureofgrace.com/og-prep.png?v=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0A1E33">
<!-- ═══ AOG-TEACH-V1 (2026-10-23) · /teach — Teach it tomorrow. Jimmy: "DO them all … showstopper for the young to the
     old." For any unit of any course (?c=<course>&u=<N>): the goal, the standards, the words to teach, a plan day by day
     (one section a day, each lesson read, looked at and checked, an exit slip to close), the wrap-up, and the supports
     every unit page offers. Data: course-data/<course>-plan.json, made by _work/more/make_plans.py (fetched only for the
     course chosen). Saves nothing. Prints on white paper. ═══ -->
<style>
:root{--navy:#0A1E33;--ink:#1f2a36;--soft:#4f5b69;--gold:#8A6116;--cream:#FBF6EA;--card:#fff;--line:#E6DCC6;--chip:#F3ECDC;--sage:#2F6B52}
[data-theme="dark"]{--ink:#EDEAE2;--soft:#B6C0CC;--gold:#F2C964;--cream:#101820;--card:#18222E;--line:#2E3A48;--chip:#223042;--sage:#8FD1B0}
*{box-sizing:border-box}
html{background:var(--cream)}
body{margin:0;color:var(--ink);background:var(--cream);font:17px/1.55 -apple-system,"Segoe UI",Inter,Roboto,Arial,sans-serif}
header.hero{background:linear-gradient(180deg,#12314F,#0A1E33);color:#F4EEE2;padding:26px 16px 28px}
.hero-in{max-width:1040px;margin:0 auto}
.ey{font:800 12px/1.3 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#F2C964;margin:0 0 6px}
h1{font:600 clamp(30px,6vw,44px)/1.1 Fraunces,Georgia,serif;margin:0 0 8px;color:#F4EEE2}
.lede{color:#D5DEE8;margin:0;max-width:640px}
main{max-width:1040px;margin:0 auto;padding:18px 16px 70px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:0 0 16px}
.tools .pick{flex:1 1 260px;min-width:0}
.tools label{display:block;font-weight:700;font-size:15px;margin:0 0 6px}
select{width:100%;min-height:48px;font-size:17px;padding:8px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 18px;border-radius:999px;border:1.5px solid var(--gold);background:var(--card);color:var(--ink);font:700 15px/1.2 inherit;cursor:pointer;text-decoration:none}
.btn.main{background:var(--navy);border-color:var(--navy);color:#F4EEE2}
[data-theme="dark"] .btn.main{background:#F2C964;border-color:#F2C964;color:#0A1E33}
.btn:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px;margin:0 0 14px}
.card h2{font:600 clamp(21px,4.4vw,25px)/1.25 Fraunces,Georgia,serif;margin:0 0 8px;color:var(--ink)}
.card h3{font:700 17px/1.3 inherit;margin:14px 0 6px;color:var(--ink)}
.card p{margin:0 0 8px}
.sub{color:var(--soft);font-size:15px}
.k{font:800 12px/1.3 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 4px}
.goal{font:600 20px/1.35 Fraunces,Georgia,serif;margin:0 0 10px}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.cols{grid-template-columns:1fr 1fr}}
ul.tight{margin:0;padding-left:1.2em}
ul.tight li{margin:0 0 4px}
.std b{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{background:var(--chip);border-radius:999px;padding:4px 10px;font-weight:700;font-size:15px}
.day{border-top:1.5px solid var(--line);padding:12px 0 4px}
.day:first-of-type{border-top:0}
.day h3{margin:0 0 4px}
.day .min{display:inline-block;min-width:3.4em;font-weight:800;color:var(--sage)}
.day ol{margin:4px 0 0;padding-left:0;list-style:none}
.day li{margin:0 0 6px}
.day li a{color:var(--ink);font-weight:700}
.day .lk{color:var(--soft);font-size:15px}
.note{background:var(--chip);border-radius:12px;padding:10px 12px;font-size:15px}
.empty{color:var(--soft)}
@media print{
  header.hero,.tools,.no-print,#aogTopbar{display:none!important}
  html,body{background:#fff!important;color:#000!important;font-size:10.5pt;line-height:1.35}
  main{padding:0;max-width:none}
  .card{border:0;border-radius:0;padding:0;margin:0 0 8pt;background:#fff!important;color:#000!important}
  .card h2{font-size:14pt;margin:0 0 4pt;color:#000!important}
  .goal{font-size:12pt}
  .k,.day .min{color:#000!important}
  .cols{grid-template-columns:1fr 1fr;gap:10pt}
  .day{break-inside:avoid;padding:5pt 0 2pt}
  .day li{margin:0 0 2pt}
  .words span{background:none;border:1px solid #999;padding:0 5pt;font-size:9.5pt}
  .note{background:none;border:1px solid #999}
  a{color:#000!important;text-decoration:none}
  .sub,.day .lk{color:#333!important}
}
</style>
</head>
<body>
<script src="/aog-topbar.js"></script>
<header class="hero"><div class="hero-in">
  <p class="ey"><span data-en="For teachers and families" data-es="Para docentes y familias">For teachers and families</span></p>
  <h1><span data-en="Teach it tomorrow" data-es="Enséñalo mañana">Teach it tomorrow</span></h1>
  <p class="lede"><span data-en="Pick a course and a unit. You get a plan, day by day. Print it or teach from the screen." data-es="Elige un curso y una unidad. Recibes un plan, día por día. Imprímelo o enseña desde la pantalla.">Pick a course and a unit. You get a plan, day by day. Print it or teach from the screen.</span></p>
</div></header>
<main id="main">
  <div class="tools no-print">
    <div class="pick"><label for="cSel"><span data-en="Course" data-es="Curso">Course</span></label><select id="cSel"></select></div>
    <div class="pick"><label for="uSel"><span data-en="Unit" data-es="Unidad">Unit</span></label><select id="uSel" disabled></select></div>
    <button type="button" class="btn main" id="printBtn"><span data-en="Print the plan" data-es="Imprimir el plan">Print the plan</span></button>
  </div>
  <div id="plan" aria-live="polite"><p class="empty"><span data-en="Choose a course to begin." data-es="Elige un curso para empezar.">Choose a course to begin.</span></p></div>
</main>
<script>
(function(){
"use strict";
/* the courses, in the order of the Courses door; ids are the course builders' own */
var COURSES = [
 ["mth","Mathematics","Matemáticas"],["sci","Science","Ciencias"],["ela","English","Inglés"],
 ["ss","Social Studies","Estudios sociales"],["ush","U.S. History","Historia de EE. UU."],
 ["wcs","World Cultures and Societies","Culturas y sociedades del mundo"],["spa","Spanish","Español"],
 ["fcs","Family & Consumer Sciences","Ciencias de la Familia y el Consumidor"],["eco","Economics","Economía"],
 ["med","Medicine and Health","Medicina y salud"],["rel","World Religions","Religiones del mundo"],
 ["spt","Sports History","Historia del deporte"],["mar","The Measured Step","El paso medido"],
 ["skt","Skateboarding","Skateboarding"],["bib","The Bible","La Biblia"],["heb","The Hebrew Bible","La Biblia hebrea"],
 ["qur","The Qur’an","El Corán"],["tal","The Talmud","El Talmud"],["hin","Hindu Texts","Textos hindúes"],
 ["bud","Buddhist Texts","Textos budistas"],["chn","Chinese Classics","Clásicos chinos"],["unr","The Unseen Realm","El reino invisible"],
 ["sec","Secret Societies","Sociedades secretas"]
];
var BAND = {"k-2":["Grades K–2","Grados K–2"],"3-5":["Grades 3–5","Grados 3–5"],"6-8":["Grades 6–8","Grados 6–8"],"9-10":["Grades 9–10","Grados 9–10"],"11-12":["Grades 11–12","Grados 11–12"],"adult":["Adults","Adultos"]};
var D = document, H = D.documentElement, cSel = D.getElementById("cSel"), uSel = D.getElementById("uSel"), plan = D.getElementById("plan");
var cache = {}, cur = { c: "", u: 0 };
function es(){ return (H.getAttribute("lang")||"en").indexOf("es")===0; }
function T(en, sp){ return es() ? sp : en; }
function pick(en, sp){ return es() && sp ? sp : en; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function q(){ var m = {}; location.search.replace(/^\?/,"").split("&").forEach(function(p){ var kv = p.split("="); if(kv[0]) m[kv[0]] = decodeURIComponent(kv[1]||""); }); return m; }

function fillCourses(){
  cSel.innerHTML = '<option value="">' + esc(T("Choose a course","Elige un curso")) + "</option>" +
    COURSES.map(function(c){ return '<option value="'+c[0]+'"'+(c[0]===cur.c?" selected":"")+">"+esc(pick(c[1],c[2]))+"</option>"; }).join("");
}
function fillUnits(P){
  var ns = Object.keys(P.units).map(Number).sort(function(a,b){return a-b;});
  var last = "", html = "";
  ns.forEach(function(n){
    var u = P.units[n], b = BAND[u.band] || [u.band,u.band];
    if (u.band !== last){ if (last) html += "</optgroup>"; html += '<optgroup label="'+esc(pick(b[0],b[1]))+'">'; last = u.band; }
    html += '<option value="'+n+'"'+(n===cur.u?" selected":"")+">"+esc(T("Unit ","Unidad ")+n+" · "+pick(u.t,u.te))+"</option>";
  });
  uSel.innerHTML = '<option value="">' + esc(T("Choose a unit","Elige una unidad")) + "</option>" + html + (last ? "</optgroup>" : "");
  uSel.disabled = false;
}
function load(c, cb){
  if (cache[c]) { cb(cache[c]); return; }
  plan.innerHTML = '<p class="empty">' + esc(T("Getting the plan…","Preparando el plan…")) + "</p>";
  fetch("/course-data/"+c+"-plan.json").then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(j){ cache[c] = j; cb(j); })
    .catch(function(){ plan.innerHTML = '<p class="empty">' + esc(T("This plan could not load. Check the connection and try again.","Este plan no se pudo cargar. Revisa la conexión e inténtalo otra vez.")) + "</p>"; });
}

/* one day: a section of a chapter; the chapter's first day opens with its story */
function days(u){
  var out = [];
  u.ch.forEach(function(c){
    c.s.forEach(function(s, si){
      out.push({ c: c, s: s, first: si === 0, last: si === c.s.length - 1 });
    });
  });
  return out;
}
function render(){
  var P = cache[cur.c], u = P && P.units[cur.u];
  if (!u){ plan.innerHTML = '<p class="empty">' + esc(T("Choose a unit to see its plan.","Elige una unidad para ver su plan.")) + "</p>"; return; }
  var b = BAND[u.band] || [u.band,u.band], page = "/" + u.page, young = u.band === "k-2", adult = u.band === "adult";
  var name = pick(P.name, P.namee), title = pick(u.t, u.te);
  var h = "";
  h += '<section class="card"><p class="k">' + esc(name + " · " + pick(b[0],b[1])) + "</p>" +
       "<h2>" + esc(T("Unit ","Unidad ") + cur.u + ": " + title) + "</h2>" +
       '<p class="sub">' + esc(T("The big question","La gran pregunta")) + '</p><p class="goal">' + esc(pick(u.bq, u.bqe)) + "</p>" +
       '<p class="no-print"><a class="btn" href="' + esc(page) + '">' + esc(T("Open the unit","Abrir la unidad")) + ' ›</a></p></section>';
  h += '<div class="cols">';
  h += '<section class="card"><h2>' + esc(T("By the end, students can answer","Al final, los estudiantes pueden responder")) + '</h2><ul class="tight">' +
       u.ch.map(function(c){ return "<li>" + esc(pick(c.bq, c.bqe)) + "</li>"; }).join("") + "</ul></section>";
  h += '<section class="card std"><h2>' + esc(T("Standards","Estándares")) + (P.fw ? ' <span class="sub">(' + esc(P.fw) + ")</span>" : "") + "</h2>" +
       (u.std.length ? '<ul class="tight">' + u.std.map(function(s){ return "<li><b>" + esc(s[0]) + "</b> " + esc(s[1]) + "</li>"; }).join("") + "</ul>" : '<p class="sub">' + esc(T("This unit has no standards listed yet.","Esta unidad todavía no tiene estándares.")) + "</p>") +
       "</section></div>";
  var words = es() && u.wordse.length ? u.wordse : u.words;
  h += '<section class="card"><h2>' + esc(T("Words to teach","Palabras para enseñar")) + '</h2><div class="words">' + words.map(function(w){ return "<span>" + esc(w) + "</span>"; }).join("") + "</div></section>";

  var ds = days(u), dayN = 0;
  h += '<section class="card"><h2>' + esc(T("Day by day","Día por día")) + '</h2><p class="sub">' +
       esc(T("About 45 minutes a day. One section a day. Go slower or faster as your class needs.","Unos 45 minutos al día. Una sección al día. Ve más despacio o más rápido según tu clase.")) + "</p>";
  ds.forEach(function(d){
    dayN++;
    var n = d.s.l.length, read = Math.max(6, Math.round(30 / n));
    h += '<div class="day"><h3>' + esc(T("Day ","Día ") + dayN + " · " + T("Chapter ","Capítulo ") + d.c.n + ", " + pick(d.s.t, d.s.te)) + "</h3><ol>";
    h += '<li><span class="min">5 min</span> ' + esc(d.first
      ? T("Open with the story, “" + d.c.story + ".” Talk about it: ","Empieza con la historia, «" + d.c.story + "». Coméntenla: ") + pick(d.c.talk, d.c.talke)
      : T("Warm up: open “Three from before” on the unit page, or ask what they remember from yesterday.","Para empezar: abre «Tres de antes» en la página de la unidad, o pregunta qué recuerdan de ayer.")) + "</li>";
    d.s.l.forEach(function(l){
      h += '<li><span class="min">' + read + ' min</span> <a href="' + esc(page + "#" + l.id) + '">' + esc(pick(l.t, l.te)) + "</a>. " +
           esc(T("Read it together, then look and talk. Finish with the three checks.","Léanla juntos, luego miren y conversen. Terminen con las tres preguntas.")) +
           (l.look ? ' <span class="lk">' + esc(T("Ask: ","Pregunta: ") + l.look) + "</span>" : "") + "</li>";
    });
    if (d.last) h += '<li><span class="min">10 min</span> ' + esc(T("Chapter review: " + d.c.rev + " questions. Reread together the ones missed on the first try.","Repaso del capítulo: " + d.c.rev + " preguntas. Vuelvan a leer juntos las que fallaron al primer intento.")) + "</li>";
    h += '<li><span class="min">5 min</span> ' + esc(T("Close: an exit slip","Para cerrar: una boleta de salida")) + ' (<a href="/slip?s=endclass">/slip?s=endclass</a>).</li>';
    h += "</ol></div>";
  });
  dayN++;
  h += '<div class="day"><h3>' + esc(T("Day ","Día ") + dayN + " · " + T("Wrap-up","Cierre")) + '</h3><ol>' +
       '<li><span class="min">10 min</span> ' + esc(T("Word match: " + u.words.length + " words and their meanings.","Juego de palabras: " + u.words.length + " palabras y sus significados.")) + "</li>" +
       '<li><span class="min">20 min</span> ' + esc(T("Unit test: " + u.test + " questions, with a spiral review of earlier units. Students can send it to you.","Examen de la unidad: " + u.test + " preguntas, con un repaso en espiral de unidades anteriores. Los estudiantes pueden enviártelo.")) + "</li>" +
       '<li><span class="min">15 min</span> ' + esc(T("Show what you know, your way: write it, say it, draw it or make it. The prompt: ","Muestra lo que sabes, a tu manera: escríbelo, dilo, dibújalo o constrúyelo. La pregunta: ") + pick(u.write, u.writee)) + "</li></ol></div>";
  h += "</section>";

  h += '<div class="cols"><section class="card"><h2>' + esc(T("What helps every learner","Lo que ayuda a cada estudiante")) + '</h2><ul class="tight">' +
       "<li>" + esc(T("Listen reads each lesson aloud.","Escuchar lee cada lección en voz alta.")) + "</li>" +
       "<li>" + esc(T("How much to read: Shorter, Just right or More, in every lesson.","Cuánto leer: Más corto, Normal o Más, en cada lección.")) + "</li>" +
       "<li>" + esc(T("Español switches the lessons to Spanish.","Español cambia las lecciones al español.")) + "</li>" +
       "<li>" + esc(T("Tap a key word to see what it means.","Toca una palabra clave para ver qué significa.")) + "</li>" +
       "<li>" + esc(T("One page at a time, with Back and Next.","Una página a la vez, con Atrás y Siguiente.")) + "</li>" +
       "<li>" + esc(T("Print any page on white paper.","Imprime cualquier página en papel blanco.")) + "</li>" +
       (young ? "<li>" + esc(T("Read aloud together. Point to the picture in words as you read.","Lean en voz alta juntos. Señalen la imagen en palabras mientras leen.")) + "</li>" : "") +
       (adult ? "<li>" + esc(T("For adults: let people choose their own pace and their own way to show what they know.","Para adultos: deja que cada quien elija su ritmo y su manera de mostrar lo que sabe.")) + "</li>" : "") +
       "</ul></section>";
  h += '<section class="card"><h2>' + esc(T("Practice and progress","Práctica y progreso")) + '</h2><ul class="tight">' +
       u.rooms.map(function(r){ return '<li><a href="' + esc(r[0]) + '">' + esc(r[1]) + "</a></li>"; }).join("") +
       "<li>" + esc(T("Scores sent from the unit go to your Sheet as IEP data, with the standards.","Las puntuaciones enviadas desde la unidad llegan a tu hoja como datos para el IEP, con los estándares.")) + "</li>" +
       '<li><a href="/dashboard">' + esc(T("Educator Dashboard","Panel del educador")) + "</a></li></ul></section></div>";
  if (P.fwnote) h += '<p class="note">' + esc(P.fwnote) + "</p>";
  plan.innerHTML = h;
  D.title = T("Teach It Tomorrow","Enséñalo mañana") + ": " + title + " — Architecture of Grace";
}
function setUrl(){
  var s = cur.c ? "?c=" + encodeURIComponent(cur.c) + (cur.u ? "&u=" + cur.u : "") : "";
  try { history.replaceState(null, "", location.pathname + s); } catch (e) {}
}
cSel.addEventListener("change", function(){
  cur.c = cSel.value; cur.u = 0; setUrl();
  if (!cur.c){ uSel.disabled = true; uSel.innerHTML = ""; plan.innerHTML = ""; return; }
  load(cur.c, function(P){ fillUnits(P); render(); });
});
uSel.addEventListener("change", function(){ cur.u = +uSel.value || 0; setUrl(); render(); });
D.getElementById("printBtn").addEventListener("click", function(){ window.print(); });
new MutationObserver(function(){ fillCourses(); if (cache[cur.c]) { fillUnits(cache[cur.c]); render(); } }).observe(H, { attributes: true, attributeFilter: ["lang"] });
var a = q(); cur.c = a.c || ""; cur.u = +a.u || 0;
if (!COURSES.some(function(c){ return c[0] === cur.c; })) { cur.c = ""; cur.u = 0; }
fillCourses();
if (cur.c) load(cur.c, function(P){ fillUnits(P); render(); });
})();
</script>
<script src="/aog-grace.js" defer></script>
</body>
</html>
