function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function P(i){ const p=S.prog[i]; return p&&typeof p==="object"?p:{s:0,q:false}; }
function done(i){ const p=P(i); return p.s>=L[i].steps.length&&!!p.q; }
function stepsDone(){ return L.reduce((n,l,i)=>n+Math.min(P(i).s,l.steps.length),0); }
function firstOpen(){ for(let i=0;i<L.length;i++) if(!done(i)) return i; return L.length-1; }

/* events: a tap or a control. Each ticks the current lesson step (in order) and the free tries. */
function fire(ev){
  const i=S.lesson, l=L[i], p=P(i);
  if(l.room===S.room && p.s<l.steps.length){
    const st=l.steps[p.s];
    if(st.ev.indexOf(ev)>=0 && (!st.need || (st.need==="burnerOff" && !S.burner))){ p.s++; S.prog[i]=p; }
  }
  (TRIES[S.room]||[]).forEach(tr=>{ if(tr[1].indexOf(ev)>=0){ S.tries[S.room]=S.tries[S.room]||{}; S.tries[S.room][tr[0]]=true; } });
  save();
}
function tapObj(k){
  S.sel=k; S.warn=null; S.showFoot=false;
  if(k==="faucet"){ S.water=!S.water; fire(S.water?"act:water-on":"act:water-off"); }
  if(k==="knob"){ S.burner=!S.burner; fire(S.burner?"act:burner-on":"act:burner-off"); }
  if(k==="soap" && !S.water) S.warn="warnWater";
  if(k==="handle" && S.burner) S.warn="warnHot";
  fire("tap:"+k);
  paint();
}
function act(a){
  S.warn=null; S.showFoot=(a==="foot");
  if(a==="burner"){ S.burner=!S.burner; fire(S.burner?"act:burner-on":"act:burner-off"); }
  else if(a==="water"){ S.water=!S.water; fire(S.water?"act:water-on":"act:water-off"); }
  else if(a==="scrub"){ if(!S.water) S.warn="warnWater"; else if(!S.scrub) startScrub(); }
  else if(a==="foot"){ S.foot=!S.foot; if(!S.foot) S.sewing=false; fire(S.foot?"act:foot-down":"act:foot-up"); }
  else if(a==="sew"){
    if(S.sewing){ S.sewing=false; fire("act:stop"); }
    else if(!S.foot){ S.warn="warnFoot"; fire("refuse"); }
    else { S.sewing=true; fire("act:sew"); }
  }
  else fire("act:"+a);
  paint();
}
let scrubTimer=0;
function startScrub(){
  S.scrub=20; clearInterval(scrubTimer);
  scrubTimer=setInterval(()=>{
    S.scrub--;
    if(S.scrub<=0){ clearInterval(scrubTimer); S.scrub=0; fire("scrub-done"); paint(); return; }
    document.querySelectorAll('[data-act="scrub"]').forEach(b=>{ b.textContent=t("scrubbing",{n:S.scrub}); });
  },1000);
}

/* drawing */
function objName(k){ const o=OBJ[k]; return o?(es()?o[1]:o[0]):""; }
function hotBoxes(){
  const R=ROOMS[S.room], H=HOT[R.uid]||{};
  return Object.keys(R.ids).filter(id=>H[id]).map(id=>{ let [x,y,w,h]=H[id];
    /* a small part gets a bigger tap area (at least 6% by 7%), centred on it */
    if(w<6){ x-=(6-w)/2; w=6; } if(h<7){ y-=(7-h)/2; h=7; }
    const nd=NUDGE[R.ids[id]]; if(nd){ x+=nd[0]; y+=nd[1]; }
    x=Math.max(0,Math.min(100-w,x)); y=Math.max(0,Math.min(100-h,y));
    return {id, k:R.ids[id], x, y, w, h, a:w*h}; }).sort((a,b)=>b.a-a.a);
}
function sceneHtml(){
  const R=ROOMS[S.room], b=hotBoxes(), box=k=>b.find(o=>o.k===k);
  let marks="";
  if(S.room==="kitchen"){
    const pan=box("pan"), f=box("faucet"), s=box("sink");
    if(S.burner&&pan) marks+=`<div class="mark" style="left:${pan.x+pan.w*.3}%;top:${pan.y+pan.h*.7}%;width:${pan.w*.4}%;height:${pan.h*.45}%"><svg viewBox="0 0 40 30" aria-hidden="true"><path d="M8 28 C4 20 10 14 12 8 C14 16 17 14 18 4 C22 14 26 12 26 6 C30 14 36 20 32 28Z" fill="#fff3c0" fill-opacity=".6" stroke="#c0661a" stroke-width="1.6"/><path d="M14 28 C12 22 17 19 20 12 C23 19 28 22 26 28Z" fill="#9fcdf2" stroke="#2f6fb0" stroke-width="1.4"/></svg></div>`
      +`<span class="chip" style="left:${pan.x}%;top:${Math.min(92,pan.y+pan.h+2)}%">${esc(t("burnerOn"))}</span>`;
    if(S.water&&f&&s) marks+=`<div class="mark" style="left:${f.x+f.w*.25}%;top:${f.y+f.h*.4}%;width:2%;height:${Math.max(4,(s.y+s.h*.45)-(f.y+f.h*.4))}%"><svg viewBox="0 0 10 100" preserveAspectRatio="none" aria-hidden="true"><path d="M5 0 V100" stroke="#2f6fb0" stroke-width="3" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"/></svg></div>`
      +`<span class="chip" style="left:${s.x+2}%;top:${s.y+s.h-9}%">${esc(t("waterOn"))}</span>`;
  } else {
    const ft=box("foot"), n=box("needle");
    if(ft && S.showFoot) marks+=`<span class="chip" style="left:${Math.max(0,ft.x-6)}%;top:${Math.min(92,ft.y+ft.h+6)}%">${esc(S.foot?t("footDown"):t("footUp"))}</span>`;
    if(S.sewing&&n) marks+=`<span class="chip" style="left:${Math.max(0,n.x-12)}%;top:${Math.max(0,n.y-6)}%">${esc(t("sewing2"))}</span>`;
  }
  const on=b.find(o=>o.k===S.sel);
  const cx=on?on.x+on.w/2:0, tx=cx<35?"0":cx>65?"-100%":"-50%";
  const tag=on?`<span class="tag" style="left:${cx<35?on.x:cx>65?on.x+on.w:cx}%;top:${Math.max(8,on.y)}%;transform:translate(${tx},-100%)">${esc(objName(on.k))}</span>`:"";
  return `<figure class="scene" id="scene"><picture>
      <source type="image/webp" srcset="/img/banners/${R.uid}-pencil-900.webp 900w, /img/banners/${R.uid}-pencil-1600.webp 1600w" sizes="(min-width:900px) 760px, 100vw">
      <img src="/img/banners/${R.uid}-pencil-900.jpg" width="1600" height="1000" alt="${esc(t("alt_"+S.room))}" decoding="async">
    </picture>
    ${b.map((o,i)=>`<button type="button" class="hot${o.k===S.sel?" on":""}" data-k="${o.k}" style="left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%;z-index:${i+1}" aria-label="${esc(objName(o.k))}" aria-pressed="${o.k===S.sel}"></button>`).join("")}
    ${marks}${tag}</figure><p class="scene-note">${esc(t("pick"))}</p>`;
}
function sideHtml(){
  const o=OBJ[S.sel];
  const cap=`<div class="card cap"><p class="tiny">${esc(o?t(S.room):t("pickN"))}</p><h2>${esc(o?(es()?o[1]:o[0]):t(S.room))}</h2><p class="muted">${esc(o?(es()?o[3]:o[2]):t("pickJ"))}</p>${S.warn?`<p class="warn" role="status">${esc(t(S.warn))}</p>`:""}</div>`;
  const B=(a,on,label)=>`<button type="button" class="btn${on?" on":""}" data-act="${a}" aria-pressed="${!!on}">${esc(label)}</button>`;
  const acts=S.room==="kitchen"
    ? B("burner",S.burner,S.burner?t("burnerOn"):t("burnerOff"))+B("water",S.water,S.water?t("waterOn"):t("waterOff"))+`<button type="button" class="btn" data-act="scrub">${esc(S.scrub?t("scrubbing",{n:S.scrub}):t("scrub"))}</button>`
    : B("foot",S.foot,S.foot?t("footDown"):t("footUp"))+B("sew",S.sewing,S.sewing?t("stop"):t("sew"));
  const tr=TRIES[S.room], got=S.tries[S.room]||{};
  return `<div class="side">${cap}
    <div class="card"><p class="tiny">${esc(t("controls"))}</p><div class="acts">${acts}</div></div>
    <div class="card"><p class="tiny">${esc(t("tries"))}</p><ul class="tries">${tr.map(x=>`<li class="${got[x[0]]?"done":""}"><i class="dot" aria-hidden="true"></i><span>${esc(es()?x[3]:x[2])}</span></li>`).join("")}</ul></div></div>`;
}
function allHtml(){
  const row=i=>{ const l=L[i], d=done(i), p=P(i);
    return `<li><a href="#${l.room}" data-pick="${i}" class="${i===S.lesson?"picked":""}"><span class="mk">${esc(t("lessonK"))} ${i+1}</span><span class="lt">${esc(es()?l.es:l.en)}</span>${d?`<span class="ok">✓ ${esc(t("doneMark"))}</span>`:p.s?`<span class="muted">${Math.min(p.s,l.steps.length)}/${l.steps.length}</span>`:""}</a></li>`; };
  const ids=[...L.keys()];
  return `<div id="lessonsSlot" class="lessons-slot"></div><div class="card" style="padding:1rem 1.1rem"><p class="kicker">${esc(t("all"))}</p>
    <p class="lead" style="margin:.3rem 0 0">${esc(t("allLead"))}</p>
    <p style="margin:.5rem 0 0;font-weight:700">${esc(t("progress",{d:stepsDone(),t:TOTAL,n:L.filter((l,i)=>done(i)).length}))}</p>
    </div>
    <details class="card all-lessons"><summary>${S.lang==="es"?"Las "+L.length+" lecciones · elige una":"All "+L.length+" lessons · pick one"}</summary>
    <p class="tiny lgroup">${esc(t("kitchenG"))}</p><ol class="ladder">${ids.filter(i=>L[i].room==="kitchen").map(row).join("")}</ol>
    <p class="tiny lgroup">${esc(t("sewingG"))}</p><ol class="ladder">${ids.filter(i=>L[i].room==="sewing").map(row).join("")}</ol></details>`;
}
function lessonHtml(){
  const i=S.lesson, l=L[i], p=P(i), n=l.steps.length, all=p.s>=n, here=l.room===S.room&&S.page!=="lessons";
  const steps=l.steps.map((st,k)=>{ const ok=k<p.s, now=k===p.s;
    const key=st.actKey||(st.ev[0]==="scrub-done"?"scrub":st.ev[0].slice(4));
    const btn=(now&&st.act&&here)?` <button type="button" class="pill" data-act="${key}">${esc(es()?st.act[1]:st.act[0])}</button>`:"";
    return `<li class="lstep${ok?" ok":""}${now?" now":""}"><span class="lck" aria-hidden="true">${ok?"✓":k+1}</span><span>${esc(es()?st.es:st.en)}${btn}</span></li>`; }).join("");
  const away=!here?`<p class="lnote">${esc(t("goRoom",{r:t(l.room).toLowerCase()}))} <a class="pill" href="#${l.room}">${esc(t("go"))}</a></p>`:"";
  let check;
  if(!all) check=`<div class="lq"><p>${esc(t("check"))}</p><span class="muted">${esc(t("checkWait"))}</span></div>`;
  else { const q=l.q;
    check=`<div class="lq"><p>${esc(es()?q.es:q.en)}</p><div class="acts">${q.a.map((a,k)=>`<button type="button" class="btn${p.q&&a[2]?" on":""}" data-ans="${k}">${esc(es()?a[1]:a[0])}</button>`).join("")}</div>
      ${p.q?`<p class="lfeed ok" role="status">${esc(t("right"))}</p>`:S.answer===false?`<p class="lfeed" role="status">${esc(t("again"))}</p>`:""}</div>`; }
  const acts=`<div class="lacts">${p.q&&i<L.length-1?`<button type="button" class="pill btn-steel" data-next="1">${esc(t("next"))} →</button>`:""}${p.s?`<button type="button" class="pill" data-redo="1">${esc(t("redo"))}</button>`:""}</div>`;
  return `<p class="mk">${esc(t("lessonK"))} ${i+1} · ${esc(t(l.room))}${done(i)?` · ✓ ${esc(t("doneMark"))}`:""}</p>
    <h3>${esc(es()?l.es:l.en)}</h3>
    <p class="lblurb">${esc(t("progress",{d:stepsDone(),t:TOTAL,n:L.filter((l,i)=>done(i)).length}))}</p>
    ${away}<ol class="lsteps">${steps}</ol>${l.note?`<p class="lnote">${esc(es()?l.note.es:l.note.en)}</p>`:""}${check}${acts}`;
}
function pickLesson(i){ S.lesson=Math.max(0,Math.min(L.length-1,+i||0)); S.answer=null; save(); }
function goLessonRoom(){ const r=L[S.lesson].room; if(S.page!=="lessons" && r!==S.room) location.hash=r; else paint(); }
function paint(){
  const h=(location.hash||"").replace("#","");
  S.page=h==="lessons"?"lessons":(h==="sewing"||h==="sew")?"sewing":h==="kitchen"?"kitchen":S.room;
  if(S.page!=="lessons" && S.page!==S.room){ S.room=S.page; S.sel=null; S.warn=null; S.sewing=false; save(); }
  document.documentElement.lang=S.lang;
  document.title=t("app")+" — Architecture of Grace";
  document.getElementById("brand").textContent=t("app");
  document.getElementById("mastK").textContent=t("eyebrow");
  document.getElementById("mastH").textContent=t("app");
  document.getElementById("mastL").textContent=t("tag");
  document.getElementById("langBtn").textContent=es()?"EN":"ES";
  document.getElementById("themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?t("light"):t("dark");
  document.getElementById("foot").textContent=t("foot");
  document.getElementById("nav").innerHTML=`<span id="navViews" class="aogdd-src" data-aog-dropdown="Bench|Mesa">`
    +[["kitchen","kitchen"],["sewing","sewing"],["lessons","all"]].map(([id,k])=>`<a href="#${id}" class="${S.page===id?"on":""}">${esc(t(k))}</a>`).join("")+`</span>`
    +`<a class="sep" href="/facs">${esc(t("facs"))}</a><a class="sep" href="/microscope">${esc(t("micro"))}</a>`;
  const row=document.getElementById("lessonRow");
  const rowHtml=L.map((l,i)=>`<button type="button" class="${i===S.lesson?"on":""}" data-lesson="${i}" aria-pressed="${i===S.lesson}">${i+1}${done(i)?" ✓":""} · ${esc(es()?l.es:l.en)}</button>`).join("");
  if(row.__html!==rowHtml){ row.innerHTML=rowHtml; row.__html=rowHtml;
    row.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{ pickLesson(b.getAttribute("data-lesson")); goLessonRoom(); }); }
  document.getElementById("lKick").textContent=t("lessons")+" · "+L.filter((l,i)=>done(i)).length+"/"+L.length;
  document.getElementById("lessonBody").innerHTML=lessonHtml();
  /* the Lessons card sits right under the drawing (as on the telescope); put it back before the view is redrawn */
  const box=document.getElementById("lessons"), view=document.getElementById("view");
  if(view.contains(box)) view.after(box);
  view.innerHTML=S.page==="lessons"?allHtml():`<div class="bench"><div id="benchMain">${sceneHtml()}</div>${sideHtml()}</div>`;
  const main=document.getElementById("benchMain"), slot=document.getElementById("lessonsSlot"); if(main) main.appendChild(box); else if(slot) slot.appendChild(box);   /* AOG-LESSONS-FOLD-V1 */
  bind();
}
function bind(){
  document.querySelectorAll("#view .hot").forEach(b=>b.onclick=()=>tapObj(b.getAttribute("data-k")));
  document.querySelectorAll("#view [data-act], #lessons [data-act]").forEach(b=>b.onclick=()=>act(b.getAttribute("data-act")));
  document.querySelectorAll("#view [data-pick]").forEach(a=>a.onclick=()=>{ pickLesson(a.getAttribute("data-pick")); });
  const lb=document.getElementById("lessons");
  lb.querySelectorAll("[data-ans]").forEach(b=>b.onclick=()=>{ const i=S.lesson, p=P(i), a=L[i].q.a[+b.getAttribute("data-ans")];
    if(a[2]){ p.q=true; S.prog[i]=p; S.answer=true; } else S.answer=false; save(); paint(); });
  lb.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{ pickLesson(S.lesson+1); goLessonRoom(); });
  lb.querySelectorAll("[data-redo]").forEach(b=>b.onclick=()=>{ S.prog[S.lesson]={s:0,q:false}; S.answer=null; save(); paint(); });
}
document.getElementById("langBtn").onclick=()=>{ S.lang=es()?"en":"es"; save(); paint(); };
document.getElementById("themeBtn").onclick=()=>{
  const next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next); document.documentElement.classList.toggle("dark",next==="dark");
  try{ localStorage.setItem("aog.interior.ws.v1.theme",next); }catch(e){}
  paint();
};
window.addEventListener("hashchange",()=>{ S.answer=null; paint(); });
paint();
})();
</script>
