<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><style id="aog-first-paint">/* AOG-ONE-PAINT-V1 */html{background:#F7F2E6}html[data-theme="dark"]{background:#0A1E33}html:not(.aog-ready) body{visibility:hidden;animation:aogOnePaint 0s linear 1.1s forwards}@keyframes aogOnePaint{to{visibility:visible}}@media print{html:not(.aog-ready) body{visibility:visible;animation:none}}</style>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>(function(){var t="light";try{if(localStorage.getItem("aog.theme.lightstart.v1")==="1"&&localStorage.getItem("aog.interior.ws.v1.theme")==="dark")t="dark";}catch(e){}document.documentElement.setAttribute("data-theme",t);})();</script>
<title>My Learning — Architecture of Grace</title>
<meta name="description" content="Pick up where you left off in every course, and answer three questions from before. Everything stays on this device. Free, in English and Spanish.">
<link rel="canonical" href="https://architectureofgrace.com/my-learning">
<meta property="og:title" content="My Learning — Architecture of Grace">
<meta property="og:description" content="Pick up where you left off in every course, and answer three questions from before.">
<meta property="og:url" content="https://architectureofgrace.com/my-learning">
<meta property="og:image" content="https://architectureofgrace.com/og-prep.png?v=1">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0A1E33">
<!-- ═══ AOG-MY-LEARNING-V1 (2026-10-23) · /my-learning (also /continue). Jimmy: "DO them all … showstopper for the young
     to the old." One door back into every course: the last lesson touched in each one (aog.course.trail.v1, kept by
     aog-course-plus.js on every unit page) with one "Pick up where I left off" button, how many lessons are done (the
     units' own records, aog.interior.ws.v1.<course><N>), and "Three from before" across every course (the same review
     engine, window.AOG_AGAIN, nothing scored or sent). Reads only this device. Saves nothing new. ═══ -->
<style>
:root{--ground:#F5F1E8;--field:#FFFFFF;--field-2:#EFEAE0;--ink:#1D2733;--ink-soft:#57626F;--navy:#0A1E33;--gold-deep:#7A5C1F;
  --rule:rgba(29,39,51,.16);--rule-soft:rgba(29,39,51,.08);--good:#2E6B4F;--good-wash:rgba(46,107,79,.12);--focus:#B8893A;--paper-line:rgba(122,82,48,.22);
  --lift-sm:0 1px 2px rgba(29,39,51,.07),0 8px 20px -16px rgba(29,39,51,.4);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
:root[data-theme="dark"]{--ground:#12161C;--field:#1A2029;--field-2:#222A34;--ink:#E9EEF4;--ink-soft:#A3AFBC;--gold-deep:#D6A852;
  --rule:rgba(233,238,244,.18);--rule-soft:rgba(233,238,244,.09);--good:#79C79E;--good-wash:rgba(121,199,158,.16);--focus:#D6A852;--paper-line:rgba(214,168,82,.28);
  --lift-sm:0 1px 2px rgba(0,0,0,.5),0 10px 24px -18px rgba(0,0,0,.9)}
*{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.55 var(--sans)}
header.hero{background:linear-gradient(180deg,#12314F,#0A1E33);color:#F4EEE2;padding:26px 16px 28px}
.hero-in{max-width:880px;margin:0 auto}
.ey{font:800 12px/1.3 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:#F2C964;margin:0 0 6px}
h1{font:600 clamp(30px,6vw,44px)/1.1 var(--serif);margin:0 0 8px;color:#F4EEE2}
.lede{color:#D5DEE8;margin:0;max-width:600px}
main{max-width:880px;margin:0 auto;padding:18px 16px 70px}
h2{font:600 clamp(21px,4.4vw,25px)/1.25 var(--serif);margin:22px 0 10px}
.course{background:var(--field);border:1.5px solid var(--rule);border-radius:18px;padding:16px;margin:0 0 12px;box-shadow:var(--lift-sm)}
.course .k{font:800 12px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold-deep);margin:0 0 4px}
.course h3{font:700 19px/1.3 var(--serif);margin:0 0 4px}
.course p{margin:0 0 8px;color:var(--ink-soft);font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:999px;border:1.5px solid var(--rule);background:var(--field);color:var(--ink);font:700 15px/1.2 var(--sans);text-decoration:none;cursor:pointer}
.btn.main{background:var(--navy);border-color:var(--navy);color:#F4EEE2}
:root[data-theme="dark"] .btn.main{background:#D6A852;border-color:#D6A852;color:#12161C}
.btn:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.bar{height:8px;border-radius:6px;background:var(--field-2);overflow:hidden;flex:1 1 120px;min-width:100px;max-width:260px}
.bar i{display:block;height:100%;background:var(--good)}
.empty{color:var(--ink-soft)}
.pick{display:grid;gap:6px;font-weight:700;font-size:15px;max-width:420px}
select{min-height:48px;border:1.5px solid var(--rule);border-radius:12px;background:var(--field);color:var(--ink);padding:8px 12px;font:600 17px var(--sans)}
.note{font-size:15px;color:var(--ink-soft);margin-top:18px}
</style>
</head>
<body>
<script src="/aog-topbar.js"></script>
<header class="hero"><div class="hero-in">
  <p class="ey"><span data-en="For learners of every age" data-es="Para estudiantes de todas las edades">For learners of every age</span></p>
  <h1><span data-en="My learning" data-es="Mi aprendizaje">My learning</span></h1>
  <p class="lede"><span data-en="Pick up where you left off. Everything here stays on this device." data-es="Sigue donde te quedaste. Todo esto se queda en este aparato.">Pick up where you left off. Everything here stays on this device.</span></p>
</div></header>
<main id="main">
  <div id="go"></div>
  <div id="before"></div>
  <h2><span data-en="Start a course" data-es="Empieza un curso">Start a course</span></h2>
  <label class="pick" for="startSel"><span data-en="Choose a course to open it" data-es="Elige un curso para abrirlo">Choose a course to open it</span>
    <select id="startSel"></select></label>
  <p class="note"><span data-en="On another device, or after clearing the browser, this list starts fresh." data-es="En otro aparato, o después de borrar el navegador, esta lista empieza de nuevo.">On another device, or after clearing the browser, this list starts fresh.</span></p>
</main>
<script>
(function(){
"use strict";
var C = [["mth","Mathematics","Matemáticas","math-course.html",629],["sci","Science","Ciencias","science-course.html",653],["ela","English","Inglés","english-course.html",577],["ss","Social Studies","Estudios Sociales","social-studies-course.html",602],["ush","U.S. History","Historia de EE. UU.","us-history.html",338],["wcs","World Cultures and Societies","Culturas y sociedades del mundo","world-cultures-course.html",336],["spa","Spanish","Español","spanish-course.html",377],["fcs","Family & Consumer Sciences","Ciencias de la Familia y el Consumidor","facs-course.html",399],["eco","Economics","Economía","economics-course.html",361],["med","Medicine and Health","Medicina y salud","medicine-health-course.html",333],["rel","World Religions","Religiones del Mundo","religions-course.html",501],["spt","Sports History","Historia del deporte","sports-course.html",340],["mar","The Measured Step","El paso medido","martial-arts-course.html",387],["skt","Skateboarding","Skateboarding","skateboarding-course.html",379],["bib","The Bible","La Biblia","bible-course.html",371],["heb","The Hebrew Bible","La Biblia Hebrea","hebrew-bible-course.html",353],["qur","The Qur’an","El Corán","quran-course.html",351],["tal","The Talmud","El Talmud","talmud-course.html",337],["hin","Hindu Texts","Textos hindúes","hindu-texts-course.html",314],["bud","Buddhist Texts","Textos budistas","buddhist-texts-course.html",300],["chn","Chinese Classics","Clásicos chinos","chinese-classics-course.html",303],["unr","The Unseen Realm","El reino invisible","unseen-realm-course.html",355],["sec","Secret Societies","Sociedades secretas","secret-societies-course.html",371]];
var D = document, H = D.documentElement;
function es(){ return (H.getAttribute("lang")||"en").indexOf("es")===0; }
function T(en, sp){ return es() ? sp : en; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function rd(k, d){ try { var v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (e) { return d; } }
/* lessons done in a course: every unit's own record */
function doneIn(id){
  var n = 0, re = new RegExp("^aog\\.interior\\.ws\\.v1\\." + id + "(\\d+)$");
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (re.test(k)) { var r = rd(k, {}); n += Object.keys((r && r.les) || {}).length; } } } catch (e) {}
  return n;
}
function paint(){
  var trail = rd("aog.course.trail.v1", {}) || {};
  var mine = C.filter(function(c){ return trail[c[0]]; }).sort(function(a, b){ return trail[b[0]].ts - trail[a[0]].ts; });
  var go = D.getElementById("go");
  if (!mine.length) {
    go.innerHTML = '<p class="empty">' + esc(T("When you open a lesson in any course, it shows up here, so you can come back to it in one tap.","Cuando abras una lección de cualquier curso, aparecerá aquí, para que vuelvas a ella con un toque.")) + "</p>";
  } else {
    go.innerHTML = "<h2>" + esc(T("Pick up where you left off","Sigue donde te quedaste")) + "</h2>" + mine.map(function(c){
      var t = trail[c[0]], done = doneIn(c[0]), pct = Math.min(100, Math.round(100 * done / c[4]));
      var href = "/" + t.p + (t.lid ? "#" + t.lid : "");
      return '<section class="course"><p class="k">' + esc(es() ? c[2] : c[1]) + "</p>" +
        "<h3>" + esc(T("Unit ","Unidad ") + t.u + (t.ut ? " · " + t.ut : "")) + "</h3>" +
        (t.lt ? "<p>" + esc(T("Last lesson: ","Última lección: ") + t.lt) + "</p>" : "") +
        '<div class="row"><a class="btn main" href="' + esc(href) + '">' + esc(T("Pick up where I left off","Seguir donde me quedé")) + "</a>" +
        '<a class="btn" href="/' + esc(c[3]) + '">' + esc(T("All lessons","Todas las lecciones")) + "</a>" +
        '<span class="bar" aria-hidden="true"><i style="width:' + pct + '%"></i></span><span class="empty" style="font-size:15px">' +
        esc(T(done + " of " + c[4] + " lessons done", done + " de " + c[4] + " lecciones hechas")) + "</span></div></section>";
    }).join("");
  }
  var sel = D.getElementById("startSel");
  sel.innerHTML = '<option value="">' + esc(T("Choose a course","Elige un curso")) + "</option>" +
    C.map(function(c){ return '<option value="' + c[3] + '">' + esc(es() ? c[2] : c[1]) + "</option>"; }).join("");
}
/* Three from before, across every course */
function paintBefore(){
  var A = window.AOG_AGAIN, box = D.getElementById("before");
  if (!A) { box.innerHTML = ""; return; }
  var items = A.due("");
  if (!items.length) { box.innerHTML = ""; return; }
  box.innerHTML = '<details class="aogp-box"><summary>' + esc(T("Three from before","Tres de antes")) + ' <span class="s">' +
    esc(T("A few questions from lessons you did earlier. Just for you; nothing is scored.","Unas preguntas de lecciones que ya hiciste. Solo para ti; no cuenta como nota.")) + '</span></summary><div class="in"></div></details>';
  var det = box.querySelector("details");
  det.addEventListener("toggle", function(){
    if (!det.open || det.hasAttribute("data-built")) return;
    det.setAttribute("data-built", "1");
    var inn = det.querySelector(".in"); inn.innerHTML = A.html(items, true); A.wire(inn, items);
  });
}
D.getElementById("startSel").addEventListener("change", function(e){ if (e.target.value) location.href = "/" + e.target.value; });
/* a new language repaints the courses, and the review only while it is still closed */
new MutationObserver(function(){ paint(); var d = D.querySelector("#before details"); if (!(d && d.open)) paintBefore(); }).observe(H, { attributes: true, attributeFilter: ["lang"] });
paint();
D.addEventListener("DOMContentLoaded", paintBefore);   /* after aog-course-plus.js (defer) has set up the review */
})();
</script>
<script src="/aog-course-plus.js" defer></script>
<script src="/aog-grace.js" defer></script>
</body>
</html>
